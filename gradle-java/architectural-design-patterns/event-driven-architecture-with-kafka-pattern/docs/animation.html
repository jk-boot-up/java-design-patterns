<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Future/Promise Pattern — Animated Walkthrough</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    background: #0f172a; color: #e2e8f0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    padding-top: calc(24px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  p.sub { color: #94a3b8; margin: 0 0 20px; max-width: 70ch; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  .stage {
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
    margin-bottom: 16px;
  }
  @media (max-width: 760px) { .stage { grid-template-columns: 1fr; } }
  .boxes { display: flex; flex-direction: column; gap: 10px; }
  .row {
    border: 2px solid #334155; border-radius: 10px; padding: 12px 16px;
    background: #1e293b; transition: all .25s ease; opacity: .55;
  }
  .row .name { font-weight: 700; font-size: 1rem; }
  .row .job { color: #94a3b8; font-size: .82rem; margin-top: 2px; }
  .row.active { opacity: 1; box-shadow: 0 0 0 2px currentColor inset; }
  .row.wrong { border-color: #f87171; color: #f87171; }
  .row.wrong.active { background: #3f1d24; }
  .row.ok { border-color: #34d399; color: #34d399; }
  .row.ok.active { background: #10261f; }
  .row.amber { border-color: #fbbf24; color: #fbbf24; }
  .row.amber.active { background: #2a2110; }
  .row.dim { opacity: .22; }
  .console {
    background: #020617; border: 1px solid #334155; border-radius: 10px;
    padding: 16px; font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: .86rem; line-height: 1.55; overflow-y: auto; min-height: 320px;
    white-space: pre-wrap;
  }
  #console-lines span.ok { color: #34d399; }
  #console-lines span.bad { color: #f87171; }
  #console-lines span.amber { color: #fbbf24; }
  #console-lines span.muted { color: #94a3b8; }
  .narration {
    background: #1e293b; border: 1px solid #334155; border-radius: 10px;
    padding: 14px 18px; margin-bottom: 16px; min-height: 3.2em;
  }
  .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  button {
    background: #334155; color: #e2e8f0; border: 1px solid #475569;
    border-radius: 8px; padding: 10px 18px; font-size: .92rem; cursor: pointer;
  }
  button:hover { background: #475569; }
  button#play { background: #7c3aed; border-color: #7c3aed; }
  button#play:hover { background: #8b5cf6; }
  #progress { color: #94a3b8; font-size: .85rem; margin-left: auto; }
  .step-label {
    font-size: .78rem; text-transform: uppercase; letter-spacing: .04em;
    color: #a78bfa; font-weight: 700; margin-bottom: 4px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Future/Promise — Step by Step</h1>
  <p class="sub">
    Six acts, the same ones the demo prints. Amber is a reader that is behind.
  </p>

  <div class="narration">
    <div class="step-label" id="step-label">Ready</div>
    <div id="narration">Press Step or Play to begin.</div>
  </div>

  <div class="stage">
    <div class="boxes" id="boxes">
      <div class="row" id="row-os">
        <div class="name">order service</div>
        <div class="job">sends events</div>
      </div>
      <div class="row" id="row-kk">
        <div class="name">Kafka</div>
        <div class="job">the topic, and each group's offset</div>
      </div>
      <div class="row" id="row-in">
        <div class="name">inventory</div>
        <div class="job">a consumer group</div>
      </div>
      <div class="row" id="row-sh">
        <div class="name">shipping</div>
        <div class="job">a consumer group</div>
      </div>
    </div>
    <div class="console"><div id="console-lines"></div></div>
  </div>

  <div class="controls">
    <button id="step">Step ▸</button>
    <button id="play">Play ▶</button>
    <button id="reset">Reset ↺</button>
    <span id="progress">0 / 0</span>
  </div>
</div>

<script>
const STEPS = [
  {
    label: "Act 1 — calling and waiting",
    narration: "The order service calls shipping and waits. Shipping is down. The order is not accepted. A customer lost an order because a service they never see was down.",
    rows: { os: "active wrong", sh: "active wrong" },
    console: [
      ["order accepted: false", "bad"],
    ],
  },
  {
    label: "Act 2 — telling the log",
    narration: "The order service sends the event to Kafka, which gives it offset zero, and it finishes. It has no reference to inventory or shipping. Both read the topic, and both see the order.",
    rows: { os: "active ok", kk: "active ok", in: "active ok", sh: "active ok" },
    console: [
      ["offset 0", "ok"],
      ["inventory saw it", "ok"],
      ["shipping saw it", "ok"],
    ],
  },
  {
    label: "Act 3 — a service that is down",
    narration: "Shipping read the first order, and then went down. Three more orders were accepted. Shipping is three events behind, as the broker counts it. Shipping came back and caught up, from where it stopped. It has now planned four orders, and is none behind.",
    rows: { os: "active ok", sh: "active amber", kk: "active ok" },
    console: [
      ["3 accepted while down", "ok"],
      ["lag 3", "amber"],
      ["caught up: lag 0", "ok"],
    ],
  },
  {
    label: "Act 4 — a new reader",
    narration: "Analytics is added after two orders. It reads the topic from the start, and sees both. The order service was not touched. Kafka keeps the events, so a new service can be built from history.",
    rows: { kk: "active ok", an: "active ok" },
    console: [
      ["analytics: both orders", "ok"],
      ["order service: unchanged", "ok"],
    ],
  },
  {
    label: "Act 5 — not the same instant",
    narration: "The order is accepted, and stock in the warehouse is still ten. It should be nine. After inventory reads the topic, it is nine. For a moment, the two disagree. The system is eventually consistent, not consistent at every instant.",
    rows: { in: "active amber" },
    console: [
      ["stock 10, should be 9", "bad"],
      ["after reading: 9", "ok"],
    ],
  },
  {
    label: "Act 6 — the bill",
    narration: "The same event is delivered twice, as Kafka may after a missed commit. Without a duplicate check, stock is eight. With one, it is nine, which is right. The flow of an order is now spread over several services, so to see it, you read the topic, not one piece of code. And a broker is another system to run.",
    rows: { in: "active amber", kk: "active amber" },
    console: [
      ["no check: 8", "bad"],
      ["with a check: 9", "ok"],
      ["1 broker to run", "amber"],
    ],
  },
];

const rowIds = ["os", "kk", "in", "sh"];
const stepLabel = document.getElementById("step-label");
const narrationEl = document.getElementById("narration");
const consoleEl = document.getElementById("console-lines");
const progressEl = document.getElementById("progress");
const stepBtn = document.getElementById("step");
const playBtn = document.getElementById("play");
const resetBtn = document.getElementById("reset");

let i = -1;
let timer = null;

function clearRows() {
  for (const id of rowIds) {
    document.getElementById("row-" + id).className = "row";
  }
}

function render() {
  clearRows();
  if (i < 0) {
    stepLabel.textContent = "Ready";
    narrationEl.textContent = "Press Step or Play to begin.";
    consoleEl.innerHTML = "";
    progressEl.textContent = "0 / " + STEPS.length;
    return;
  }
  const s = STEPS[i];
  stepLabel.textContent = s.label;
  narrationEl.textContent = s.narration;
  for (const id of rowIds) {
    const el = document.getElementById("row-" + id);
    const cls = s.rows[id];
    el.className = "row " + (cls ? cls : "dim");
  }
  consoleEl.innerHTML = s.console
    .map(([text, cls]) => '<span class="' + cls + '">' + text + "</span>")
    .join("\n");
  progressEl.textContent = (i + 1) + " / " + STEPS.length;
}

function step() {
  if (i >= STEPS.length - 1) { stopPlay(); return; }
  i += 1;
  render();
}

function reset() {
  stopPlay();
  i = -1;
  render();
}

function startPlay() {
  if (timer) return;
  playBtn.textContent = "Pause ❚❚";
  timer = setInterval(() => {
    if (i >= STEPS.length - 1) { stopPlay(); return; }
    step();
  }, 2600);
}

function stopPlay() {
  if (timer) clearInterval(timer);
  timer = null;
  playBtn.textContent = "Play ▶";
}

stepBtn.addEventListener("click", () => { stopPlay(); step(); });
resetBtn.addEventListener("click", reset);
playBtn.addEventListener("click", () => { if (timer) stopPlay(); else startPlay(); });

render();
</script>
<!-- videokit:narration -->
<script>
/* videokit narration player: a Narration on/off switch and a play/pause
   button for the current step. It watches the page's own narration text,
   works out which step is showing, and plays audio/step-N.m4a beside the
   page (rendered by tools/videokit; not embedded, so the page stays small).
   If the page already plays its own clips, only the pause button is added. */
(function () {
  "use strict";
  var STEPS = ["The order service calls shipping and waits. Shipping is down. The order is not accepted. A customer lost an order because a service they never see was down.", "The order service sends the event to Kafka, which gives it offset zero, and it finishes. It has no reference to inventory or shipping. Both read the topic, and both see the order.", "Shipping read the first order, and then went down. Three more orders were accepted. Shipping is three events behind, as the broker counts it. Shipping came back and caught up, from where it stopped. It has now planned four orders, and is none behind.", "Analytics is added after two orders. It reads the topic from the start, and sees both. The order service was not touched. Kafka keeps the events, so a new service can be built from history.", "The order is accepted, and stock in the warehouse is still ten. It should be nine. After inventory reads the topic, it is nine. For a moment, the two disagree. The system is eventually consistent, not consistent at every instant.", "The same event is delivered twice, as Kafka may after a missed commit. Without a duplicate check, stock is eight. With one, it is nine, which is right. The flow of an order is now spread over several services, so to see it, you read the topic, not one piece of code. And a broker is another system to run."];
  var norm = function (s) { return String(s || "").replace(/\s+/g, " ").trim(); };
  var box = document.getElementById("narration") || document.querySelector(".narration");
  if (!box || !STEPS.length) return;

  var pageOwnsAudio = !!document.getElementById("audio");
  var current = null, step = -1, on = false;
  try { on = localStorage.getItem("vk-narration") === "on"; } catch (e) {}

  // Remember whichever clip the page (or this script) last started.
  var realPlay = HTMLMediaElement.prototype.play;
  HTMLMediaElement.prototype.play = function () {
    if (current && current !== this) { try { current.pause(); } catch (e) {} }
    current = this;
    this.addEventListener("play", label);
    this.addEventListener("pause", label);
    this.addEventListener("ended", label);
    var p = realPlay.apply(this, arguments);
    label();
    return p;
  };

  var bar = document.querySelector(".controls") || box.parentNode;
  function button(id, text) {
    var b = document.createElement("button");
    b.id = id; b.type = "button"; b.textContent = text;
    bar.appendChild(b);
    return b;
  }
  var narrBtn = pageOwnsAudio ? null : button("vk-narration", "");
  var stepBtn = button("vk-step-audio", "");
  var note = document.createElement("span");
  note.id = "vk-note";
  note.style.cssText = "color:#94a3b8;font-size:.8rem;margin-left:8px";
  bar.appendChild(note);

  function stepFor(text) {
    var t = norm(text);
    for (var i = 0; i < STEPS.length; i++) {
      var s = norm(STEPS[i]);
      if (s && t.indexOf(s.slice(0, 60)) !== -1) return i;
    }
    return -1;
  }
  function stop() { if (current) { try { current.pause(); } catch (e) {} } current = null; label(); }
  function play(i) {
    if (i < 0) return;
    var a = new Audio("audio/step-" + (i + 1) + ".m4a");
    a.play().then(function () { note.textContent = ""; }, function (e) {
      note.textContent = e && e.name === "NotAllowedError"
        ? "Click Play step to hear this step."
        : "Narration audio not found: run tools/videokit/videokit.sh animation <project>.";
      label();
    });
  }
  function label() {
    if (narrBtn) narrBtn.textContent = (on ? "🔊 Narration: on" : "🔇 Narration: off");
    if (narrBtn) narrBtn.setAttribute("aria-pressed", String(on));
    var playing = current && !current.paused && !current.ended;
    var paused = current && current.paused && !current.ended;
    stepBtn.textContent = playing ? "⏸ Pause step" : paused ? "▶ Resume step" : "▶ Play step";
    stepBtn.disabled = step < 0;
  }

  if (narrBtn) narrBtn.addEventListener("click", function () {
    on = !on;
    try { localStorage.setItem("vk-narration", on ? "on" : "off"); } catch (e) {}
    if (on) { if (step >= 0) play(step); } else stop();
    label();
  });
  stepBtn.addEventListener("click", function () {
    if (current && !current.ended) {
      if (current.paused) current.play(); else current.pause();
    } else play(step);
  });

  function changed() {
    var i = stepFor(box.textContent);
    if (i === step) return;
    step = i;
    if (!pageOwnsAudio) { stop(); if (on) play(i); }
    label();
  }
  new MutationObserver(changed).observe(box, { childList: true, subtree: true, characterData: true });
  changed();
  label();
})();
</script>
<!-- /videokit:narration -->
</body>
</html>
