<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Future/Promise Pattern — Animated Walkthrough</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    background: #0f172a; color: #e2e8f0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    padding-top: calc(24px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  p.sub { color: #94a3b8; margin: 0 0 20px; max-width: 70ch; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  .stage {
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
    margin-bottom: 16px;
  }
  @media (max-width: 760px) { .stage { grid-template-columns: 1fr; } }
  .boxes { display: flex; flex-direction: column; gap: 10px; }
  .row {
    border: 2px solid #334155; border-radius: 10px; padding: 12px 16px;
    background: #1e293b; transition: all .25s ease; opacity: .55;
  }
  .row .name { font-weight: 700; font-size: 1rem; }
  .row .job { color: #94a3b8; font-size: .82rem; margin-top: 2px; }
  .row.active { opacity: 1; box-shadow: 0 0 0 2px currentColor inset; }
  .row.wrong { border-color: #f87171; color: #f87171; }
  .row.wrong.active { background: #3f1d24; }
  .row.ok { border-color: #34d399; color: #34d399; }
  .row.ok.active { background: #10261f; }
  .row.amber { border-color: #fbbf24; color: #fbbf24; }
  .row.amber.active { background: #2a2110; }
  .row.dim { opacity: .22; }
  .console {
    background: #020617; border: 1px solid #334155; border-radius: 10px;
    padding: 16px; font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: .86rem; line-height: 1.55; overflow-y: auto; min-height: 320px;
    white-space: pre-wrap;
  }
  #console-lines span.ok { color: #34d399; }
  #console-lines span.bad { color: #f87171; }
  #console-lines span.amber { color: #fbbf24; }
  #console-lines span.muted { color: #94a3b8; }
  .narration {
    background: #1e293b; border: 1px solid #334155; border-radius: 10px;
    padding: 14px 18px; margin-bottom: 16px; min-height: 3.2em;
  }
  .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  button {
    background: #334155; color: #e2e8f0; border: 1px solid #475569;
    border-radius: 8px; padding: 10px 18px; font-size: .92rem; cursor: pointer;
  }
  button:hover { background: #475569; }
  button#play { background: #7c3aed; border-color: #7c3aed; }
  button#play:hover { background: #8b5cf6; }
  #progress { color: #94a3b8; font-size: .85rem; margin-left: auto; }
  .step-label {
    font-size: .78rem; text-transform: uppercase; letter-spacing: .04em;
    color: #a78bfa; font-weight: 700; margin-bottom: 4px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Future/Promise — Step by Step</h1>
  <p class="sub">
    Six acts, the same ones the demo prints. A red box is where it goes wrong.
  </p>

  <div class="narration">
    <div class="step-label" id="step-label">Ready</div>
    <div id="narration">Press Step or Play to begin.</div>
  </div>

  <div class="stage">
    <div class="boxes" id="boxes">
      <div class="row" id="row-nv">
        <div class="name">naive order</div>
        <div class="job">reaches outward</div>
      </div>
      <div class="row" id="row-r0">
        <div class="name">ring 0</div>
        <div class="job">order, repository idea</div>
      </div>
      <div class="row" id="row-r1">
        <div class="name">ring 1</div>
        <div class="job">pricing rules</div>
      </div>
      <div class="row" id="row-r2">
        <div class="name">ring 2</div>
        <div class="job">use cases</div>
      </div>
      <div class="row" id="row-r3">
        <div class="name">ring 3</div>
        <div class="job">storage and screens</div>
      </div>
      <div class="row" id="row-st">
        <div class="name">the database</div>
        <div class="job">outside</div>
      </div>
    </div>
    <div class="console"><div id="console-lines"></div></div>
  </div>

  <div class="controls">
    <button id="step">Step ▸</button>
    <button id="play">Play ▶</button>
    <button id="reset">Reset ↺</button>
    <span id="progress">0 / 0</span>
  </div>
</div>

<script>
const STEPS = [
  {
    label: "Act 1 — the core reaches outward",
    narration: "The order saved itself with a SQL statement. To change the storage, the order class, at the centre, must be edited.",
    rows: { nv: "active wrong", st: "active wrong" },
    console: [
      ["order runs SQL itself", "bad"],
    ],
  },
  {
    label: "Act 2 — rings, and one rule",
    narration: "Ring zero is the order, the order line, and the idea of a repository. Ring one is the pricing rules. Ring two is the use cases. Ring three is storage and screens. The rule: a class may refer to its own ring, or to a ring further in, never outward. Among the eight classes of the onion, violations: none.",
    rows: { r0: "active ok", r1: "active ok", r2: "active ok", r3: "active ok" },
    console: [
      ["8 classes, 4 rings", "ok"],
      ["violations: 0", "ok"],
    ],
  },
  {
    label: "Act 3 — checking the rule",
    narration: "The checker is pointed at the naive order. It reports: the naive order, in ring zero, refers to the SQL database, in ring three. The checker reads the fields, constructors and methods of each class, so the rule is tested, not just hoped for.",
    rows: { nv: "active wrong" },
    console: [
      ["ring 0 refers to ring 3", "bad"],
    ],
  },
  {
    label: "Act 4 — swap the outside",
    narration: "Stored in memory, the total is ten thousand eight hundred. Stored as a text record, the same. The record is the order id, the mug, two at sixty pounds, and a discount of twelve hundred. The use case, the rules and the order were not touched.",
    rows: { r3: "active ok", r2: "active ok" },
    console: [
      ["memory: 10800", "ok"],
      ["text record: 10800", "ok"],
    ],
  },
  {
    label: "Act 5 — the inside, on its own",
    narration: "A small order is nine fifty. A big order is ten thousand eight hundred, ten percent off twelve thousand. No storage, no screen and no framework was used to check the rules. Through the outside, the same order gives the same total.",
    rows: { r0: "active ok", r1: "active ok" },
    console: [
      ["small: 950", "ok"],
      ["big: 10800, 10% off", "ok"],
      ["no storage used", "ok"],
    ],
  },
  {
    label: "Act 6 — the bill",
    narration: "One order saved and read back through the outer ring costs two conversions. Every trip across a ring may copy the order into another shape. To place one order there are four classes in three rings, plus the repository idea. For a small program, that is a lot of ceremony. And the repository idea lives in the centre, so the centre knows that storage exists, though not how.",
    rows: { r3: "active amber", r2: "active amber" },
    console: [
      ["conversions: 2", "amber"],
      ["4 classes, 3 rings", "amber"],
    ],
  },
];

const rowIds = ["nv", "r0", "r1", "r2", "r3", "st"];
const stepLabel = document.getElementById("step-label");
const narrationEl = document.getElementById("narration");
const consoleEl = document.getElementById("console-lines");
const progressEl = document.getElementById("progress");
const stepBtn = document.getElementById("step");
const playBtn = document.getElementById("play");
const resetBtn = document.getElementById("reset");

let i = -1;
let timer = null;

function clearRows() {
  for (const id of rowIds) {
    document.getElementById("row-" + id).className = "row";
  }
}

function render() {
  clearRows();
  if (i < 0) {
    stepLabel.textContent = "Ready";
    narrationEl.textContent = "Press Step or Play to begin.";
    consoleEl.innerHTML = "";
    progressEl.textContent = "0 / " + STEPS.length;
    return;
  }
  const s = STEPS[i];
  stepLabel.textContent = s.label;
  narrationEl.textContent = s.narration;
  for (const id of rowIds) {
    const el = document.getElementById("row-" + id);
    const cls = s.rows[id];
    el.className = "row " + (cls ? cls : "dim");
  }
  consoleEl.innerHTML = s.console
    .map(([text, cls]) => '<span class="' + cls + '">' + text + "</span>")
    .join("\n");
  progressEl.textContent = (i + 1) + " / " + STEPS.length;
}

function step() {
  if (i >= STEPS.length - 1) { stopPlay(); return; }
  i += 1;
  render();
}

function reset() {
  stopPlay();
  i = -1;
  render();
}

function startPlay() {
  if (timer) return;
  playBtn.textContent = "Pause ❚❚";
  timer = setInterval(() => {
    if (i >= STEPS.length - 1) { stopPlay(); return; }
    step();
  }, 2600);
}

function stopPlay() {
  if (timer) clearInterval(timer);
  timer = null;
  playBtn.textContent = "Play ▶";
}

stepBtn.addEventListener("click", () => { stopPlay(); step(); });
resetBtn.addEventListener("click", reset);
playBtn.addEventListener("click", () => { if (timer) stopPlay(); else startPlay(); });

render();
</script>
</body>
</html>
