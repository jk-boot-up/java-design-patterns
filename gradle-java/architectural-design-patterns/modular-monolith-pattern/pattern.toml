[[scene]]
key = "01-poster"
kind = "poster"
title = "Modular Monolith"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Modular Monolith pattern, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] A monolith is a program that is built and deployed as one piece. [[slnc 300]] A modular monolith is still one piece. [[slnc 300]] But inside, it is split into modules. [[slnc 300]] Each module owns its own data, and the others may only use its front door. [[slnc 600]]
Think of a department store. [[slnc 300]] One building, one entrance. [[slnc 300]] But the shoe department has its own staff and its own stockroom. [[slnc 300]] Other departments do not walk in and take boxes. [[slnc 300]] They ask at the counter. [[slnc 700]]
In this video, the domain is an online shop. [[slnc 300]] It is one Java program, with a catalogue that holds the stock, orders, and payments. [[slnc 500]]
By the end, you will hear how open tables let a shop sell one kettle twice. [[slnc 300]] How modules with front doors stop it. [[slnc 300]] How to check the walls automatically. [[slnc 300]] And how a module can later become its own service.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["One Java program:", "checkout, catalogue, payments.", "", "Every table open to every class.", "", "The catalogue's rule:", "stock never goes below zero."]
narration = """
Here is the scenario. [[slnc 400]] The shop is one Java program. [[slnc 300]] Inside it: checkout, the catalogue, and payments. [[slnc 600]]
Every table is open to every class. [[slnc 300]] A table here is just a map of data, such as how many kettles are in stock. [[slnc 500]]
The catalogue has a rule. [[slnc 300]] Stock never goes below zero. [[slnc 300]] But does everyone follow it?
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["Split by business area:", "catalogue, orders, payments.", "", "Each owns its data and rules.", "Others use only its front door.", "", "Check the walls on every build."]
narration = """
Let's name the pattern. [[slnc 400]] Split the program by business area. [[slnc 300]] Catalogue, orders, payments. [[slnc 500]]
Each module owns its own data, and its own rules. [[slnc 300]] Each offers a small front door. [[slnc 300]] Other modules may use that front door, and nothing else. [[slnc 500]]
Check those walls automatically, on every build. [[slnc 500]]
It is still one program. [[slnc 300]] But inside, it has walls.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["CatalogApi, OrdersApi, PaymentsApi:", "the front doors", "internal packages: the insides", "BoundaryCheck: the walls", "RemotePayments: moved out"]
narration = """
Here is who does what. [[slnc 400]] Catalog A P I, orders A P I, and payments A P I are the front doors. [[slnc 300]] Each is a short Java interface. [[slnc 500]]
Each module keeps its real classes in a package called internal. [[slnc 300]] Nobody outside may use them. [[slnc 500]]
The boundary check reads the source, and fails the build if anyone does. [[slnc 500]]
And remote payments is the payments front door, answered over the network, for the day payments moves out.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["module-info.java: exports", "ArchUnit tests", "Spring Modulith", "Large monoliths at Shopify, GitHub"]
narration = """
You have probably met this pattern already. [[slnc 400]] Java's own module system lets each module say which packages it exports. [[slnc 500]]
Arch Unit is a test library that fails the build when one package uses another it should not. [[slnc 300]] Spring Modulith does the same for Spring Boot. [[slnc 500]]
And some of the largest web applications, such as Shopify and GitHub, are monoliths split into modules like this.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Start most new systems here.", "", "Split by business area.", "Private data, public front doors.", "", "Move a module out only when", "it needs its own deployment."]
narration = """
So, when should you use it? [[slnc 400]] Start most new systems as a modular monolith. [[slnc 500]]
Split by business area. [[slnc 300]] Keep each module's data private, and give it a front door. [[slnc 300]] Fail the build on any shortcut. [[slnc 500]]
And move a module out into its own service only when it truly needs its own deployment, its own scaling, or its own team.
"""

