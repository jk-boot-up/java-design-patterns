[[scene]]
key = "01-poster"
kind = "poster"
title = "Broker"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Broker pattern, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] A broker sits between clients and services. [[slnc 300]] Services register with it by name. [[slnc 300]] Clients call it by name. [[slnc 300]] The broker finds the service, forwards the call, and returns the answer. [[slnc 600]]
Think of an old hotel switchboard. [[slnc 300]] Guests ask the operator to put them through to room service. [[slnc 300]] They never need the extension number. [[slnc 300]] When room service moves office, only the operator's list changes. [[slnc 700]]
In this video, the domain is an online shop. [[slnc 300]] Its checkout calls a stock service and a price service, which run as small web servers. [[slnc 500]]
By the end, you will hear why hard-coded addresses break. [[slnc 300]] How a broker fixes it. [[slnc 300]] How it handles moves and several copies. [[slnc 300]] And what it costs.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["Checkout calls a stock service", "and a price service.", "", "Their addresses were written", "into checkout.", "", "Then the stock service moved."]
narration = """
Here is the scenario. [[slnc 400]] Checkout calls a stock service, and a price service. [[slnc 500]]
Their addresses were written into checkout's configuration. [[slnc 500]]
Then the stock service moved to a new machine.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["Services register by name.", "", "Clients call the broker by name.", "", "The broker finds a live instance,", "forwards, and returns the answer."]
narration = """
Let's name the pattern. [[slnc 400]] Each service registers with the broker, under a name. [[slnc 500]]
Clients send every call to the broker, by name. [[slnc 500]]
The broker finds a live instance of that service, forwards the call, and returns the answer. [[slnc 300]] Clients never know where services live.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["Broker: names -> addresses, forwards", "Stock, price: the services", "Checkout: the client", "Http: the plumbing"]
narration = """
Here is who does what. [[slnc 400]] The broker keeps a list of names and addresses, and forwards calls. [[slnc 500]]
The stock and price services register themselves, and answer questions. [[slnc 500]]
Checkout is the client. [[slnc 300]] It knows one address: the broker's. [[slnc 300]] And the H T T P class is just the plumbing.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Java RMI registry, CORBA", "Consul, Eureka, etcd", "Kubernetes services", "API gateways, service meshes"]
narration = """
You have probably met this pattern already. [[slnc 400]] Java's R M I registry, and CORBA, were brokers. [[slnc 500]]
Service registries such as Consul and Eureka do the same job today. [[slnc 500]]
Kubernetes gives each service a stable name, whatever machines it runs on. [[slnc 300]] And gateways and service meshes route calls by name.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Services that move, scale", "or change often.", "", "Run the broker redundantly.", "", "Avoid the hop? Look up once,", "then call directly."]
narration = """
So, when should you use it? [[slnc 400]] When services move, scale, or change often. [[slnc 500]]
Run the broker as several copies, so it is never the one thing that stops everything. [[slnc 500]]
And to avoid the extra hop, clients can ask the broker for an address once, then call the service directly.
"""

