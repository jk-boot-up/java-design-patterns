    { id = "s", label = "Stock service", sub = "\"stock\"", col = 2, row = 0, colour = "green" },
    { id = "a", label = "Price A", sub = "\"price\"", col = 2, row = 1, colour = "green" },
    { id = "p", label = "Price B", sub = "\"price\"", col = 2, row = 2, colour = "green" },
]
