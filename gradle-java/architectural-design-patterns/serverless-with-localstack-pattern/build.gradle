plugins {
    id 'java'
    id 'application'
}

group = 'com.jk.explore'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // AWS SDK for Java 2.55.1. Its Lambda client talks to LocalStack, which answers as the real Lambda API does.
    implementation platform('software.amazon.awssdk:bom:2.55.1')
    implementation 'software.amazon.awssdk:lambda'
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.16'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.jk.explore.serverlessls.ServerlessLsDemo'
}

test {
    useJUnitPlatform()
}
