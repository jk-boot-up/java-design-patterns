# pattern.toml for the Space-Based Architecture project. See tools/patternkit.

[project]
slug = "space-based"
category = "architectural-design-patterns"
title = "Space-Based Architecture"
package = "spacebased"
main_class = "SpaceBasedDemo"
tagline = "Take the database out of the way"
bold = "Give every copy of the application its own in-memory copy of the data, keep the copies in step through a data grid, and update the database in the background, so no request waits for it."
youtube_description = """Space-Based Architecture pattern in Java: each copy of the application keeps the data in its own memory, the copies stay in step through a data grid, and the database is updated in the background so no request waits for it, like festival stalls radioing their sales to each other. Explained with an online store kettle flash sale, where hundreds of orders arrive at once and every one must check the stock. We see why more servers did not help, add processing units with the data in memory, let the database catch up, and meet the kettle that was sold twice."""
domain_note = ""
thumb_lines = ["SPACE-BASED", "ARCHITECTURE"]
thumb_code = "unit.takeOne()"
youtube_title = "Space-Based Architecture"
youtube_tags = ["space based architecture", "in memory data grid", "scalability", "flash sale", "architecture patterns", "java"]

[readme]
intro = """
Space-based architecture is a style for systems with huge, sudden load, such
as ticket sales or flash sales, where a central database would be the
bottleneck. The application runs as several processing units, and each unit
keeps the data it needs in its own memory. Units answer requests from memory;
every change is copied to the other units through a data grid, and a data
writer brings the database up to date in the background, in batches.

Add units and the system handles more load, because nothing in the request
path is shared. The price is that the copies can disagree for a moment, and
recent changes can be lost if a unit crashes.
"""
analogy = """
Think of pop-up stalls at a festival, all selling the same T-shirts. Each
stall keeps its own tally of stock and serves its own queue. The stalls radio
each sale to the others every few minutes, and head office updates its books
overnight. Nobody queues for head office. But two stalls can both sell the
last large T-shirt before the radio message gets through.
"""
scenario = """
The online store runs a kettle flash sale. Three app servers handle the
orders, and every order checks and updates the stock in one central
database, 5 milliseconds a query, one at a time. Adding more app servers did
not help: every order still queued for the same database.
"""
costs = [
    "**Copies can disagree for a moment.** Two units sold the last kettle before the grid caught up; stock ended at -1.",
    "**Recent changes can be lost.** A unit that crashes before the grid copies its sales loses them.",
    "**Complex to run.** Data grids, replication and background writers are hard to build and operate; products exist for a reason.",
]
too_much = """
For ordinary load, one database and a few app servers are far simpler and
always consistent. Space-based architecture is for extreme, spiky load where
a short delay in consistency is acceptable, and never for money that must not
be wrong even for a moment.
"""
met_before = [
    "In-memory data grids such as Hazelcast, Apache Ignite and Oracle Coherence.",
    "Ticketing and flash-sale systems.",
    "The \"tuple space\" idea from JavaSpaces, where the name comes from.",
]
where = """
This project is in [architectural-design-patterns](..), next to
[Cell-Based Architecture](../cell-based-pattern), another way to scale by
splitting a system into independent copies.
"""

[[act]]
title = "One database for everyone"
summary = "300 orders through three app servers take over 1.4 s; six app servers still take over 1.4 s."
detail = """
Three app servers each call `CentralDatabase.takeOne`, which takes 5
milliseconds and serves one query at a time. Three hundred orders take over
1.4 seconds. With six app servers it still takes over 1.4 seconds: the
database is the limit, not the servers.
"""
speech = """
First demo: three app servers, one database. [[slnc 400]] Every kettle order checks and updates the stock in the database. [[slnc 300]] Five milliseconds each, one at a time. [[slnc 600]]
Three hundred orders take over one point four seconds. [[slnc 500]]
Double the app servers, to six. [[slnc 300]] Still over one point four seconds. [[slnc 300]] The database is the limit, not the servers.
"""
rows = { servers = "active amber", db = "active wrong" }
console = [
    ["300 orders: over 1.4 s", "bad"],
    ["six servers: still over 1.4 s", "bad"],
]

[[act]]
title = "Processing units"
summary = "Three units with the stock in memory serve 300 orders in under 0.3 s without touching the database."
detail = """
Each `ProcessingUnit` holds its own copy of the stock in memory. Orders are
spread across three units and answered from memory: 300 orders in under 0.3
seconds, with no order touching the database.
"""
speech = """
Second demo: processing units, each with the data in memory. [[slnc 400]] Each unit is a copy of the app, holding its own copy of the stock. [[slnc 600]]
Orders are spread across three units, and answered straight from memory. [[slnc 500]]
Three hundred orders in under three tenths of a second. [[slnc 300]] Not one of them touched the database.
"""
rows = { units = "active ok" }
console = [
    ["300 orders in under 0.3 s", "ok"],
    ["no order touched the database", "ok"],
]

[[act]]
title = "The data grid"
summary = "Before replication each unit shows 900 (only its own sales); after, every unit shows 700."
detail = """
Each unit has only seen its own 100 sales, so each shows 900 kettles. The
`DataGrid` copies every sale to the other units: after replication, all three
show 700.
"""
speech = """
Third demo: the data grid keeps the copies in step. [[slnc 400]] Right after the sale, each unit has only seen its own hundred sales. [[slnc 300]] Each one thinks there are nine hundred kettles left. [[slnc 600]]
The grid copies every sale to the other units. [[slnc 500]]
Now all three agree: seven hundred.
"""
rows = { grid = "active ok", units = "active ok" }
console = [
    ["before: unit-1 900, unit-2 900, unit-3 900", "amber"],
    ["after:  unit-1 700, unit-2 700, unit-3 700", "ok"],
]

[[act]]
title = "The database catches up"
summary = "The data writer brings the database to 700 in 3 batches of 100, not 300 writes; no customer waited."
detail = """
The `DataWriter` receives the changes from the grid and writes them to the
database in batches of 100: three writes instead of three hundred. The
database now shows 700, and no customer waited for any of it.
"""
speech = """
Fourth demo: the database catches up, in the background. [[slnc 400]] A data writer collects the changes from the grid. [[slnc 300]] It writes them in batches of a hundred. [[slnc 600]]
Three writes, instead of three hundred. [[slnc 300]] The database now says seven hundred. [[slnc 500]]
And no customer waited for any of those writes.
"""
rows = { writer = "active ok", db = "active ok" }
console = [
    ["database stock: 700", "ok"],
    ["3 batch writes, not 300", "ok"],
]

[[act]]
title = "The bill"
summary = "With one kettle left, two units both sell it before replication; stock ends at -1."
detail = """
One kettle is left. Two customers buy it at the same moment on two different
units, before the grid has copied either sale. Both units say yes, and after
replication the stock is -1. And a unit that crashes before the grid copies
its sales loses them.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] One kettle left. [[slnc 300]] Two customers buy it at the same moment, on two different units. [[slnc 600]]
Neither unit has heard about the other's sale yet. [[slnc 300]] Both say yes. [[slnc 500]]
After replication, the stock is minus one. [[slnc 500]]
And a unit that crashes before the grid copies its sales loses them.
"""
rows = { units = "active wrong", grid = "active amber" }
console = [
    ["unit-1 sold: true, unit-2 sold: true", "bad"],
    ["stock after replication: -1", "bad"],
]

[animation]
subtitle = "Processing units answer orders from their own in-memory copies; a grid keeps copies in step and a writer updates the database in batches."
boxes = [
    ["servers", "App servers", "the old way"],
    ["db", "Central database", "5 ms, one at a time"],
    ["units", "Processing units", "stock in memory"],
    ["grid", "Data grid", "copies every change"],
    ["writer", "Data writer", "batches to the database"],
]

[docs.problem]
scenario = """
A kettle flash sale sends hundreds of orders at once, and every order checks
and updates stock.
"""
naive = """
Every app server asks one central database, one query at a time, so adding
servers does not add capacity.
"""
deliver = [
    "Central-database timing that more servers do not improve.",
    "Processing units serving orders from memory.",
    "A data grid replicating changes between units.",
    "A background writer updating the database in batches.",
    "The cost shown: the last kettle sold twice.",
    "Every printed result asserted by a test.",
]

[docs.prerequisites]
required = [
    "Java basics: classes, threads, atomic integers.",
    "What a database bottleneck is, roughly.",
]
not_required = [
    "Hazelcast or any data grid product. The grid is a small class.",
]

[docs.session]
objectives = [
    "Explain why a central database limits scaling.",
    "Describe processing units, the data grid and the data writer.",
    "Explain eventual consistency with the last-kettle example.",
    "Decide when the trade-off is acceptable.",
]
walkthrough = """
Run `./gradlew run` and compare act one's two timings. Open `ProcessingUnit`:
memory only. Then `DataGrid.flush` and `DataWriter`. End on act five: which
things in a shop could accept that risk, and which never could?
"""
exercises = [
    "Flush the grid after every 10 orders. How often does the last kettle sell twice now?",
    "Reserve a small safety stock on each unit so it stops selling before the true zero.",
    "Add a unit while the sale is running. How does it get its copy of the stock?",
]

[docs.explained]
sentence = """
Space-based architecture gives each processing unit an in-memory copy of the
data, keeps copies in step through a data grid, and updates the database in
the background, so requests never wait for it.
"""
verdict = """
Use it for extreme, spiky load where brief disagreement between copies is
acceptable, usually with a data grid product. For most systems, a single
database with good indexes and caching is simpler and always consistent.
"""
recognise = [
    "In-memory data grids in the request path.",
    "Write-behind to a database from a grid.",
    "Many identical processing units with no shared database in front of them.",
]

[spec]
purpose = """
Teach Space-Based Architecture with an online store's kettle flash sale: a
central database limiting 300 orders to over 1.4 s regardless of servers,
then processing units serving from memory in under 0.3 s, a data grid
replicating to 700 everywhere, batched database writes, and the last kettle
sold twice.
"""
nongoals = [
    "Not a data grid product. The grid is in-process.",
    "Not networking. Units are objects in one program.",
]
problem = """
When every request must query one central database, adding servers adds no
capacity, and a flash sale queues at the database.
"""
roles = [
    ["The units", "`ProcessingUnit`"],
    ["Replication", "`DataGrid`"],
    ["Background persistence", "`DataWriter`"],
    ["The naive version", "`CentralDatabase` in the request path"],
    ["Entry point", "`SpaceBasedDemo`, five acts"],
]
requirements = [
    "**Memory first:** units answer without the database.",
    "**Replicated:** after a flush, every unit agrees.",
    "**Batched writes:** the database is updated in batches.",
    "**Honest cost:** the double sale is shown.",
    "**Every printed result is asserted** in `DemoRunsTest`.",
]

