[docs.dependencies]
intro = """
This project uses Hazelcast, which the plain Java version of Space-Based
Architecture does not. Skipping it loses none of the pattern: the plain
version teaches all of it with nothing installed.
"""
what = [
    ["Hazelcast", "Hazelcast is an in-memory data grid: several programs, called members, join into a cluster and share data. An IMap is a map split across the members; each key has one owning member, and with a backup count of one, another member keeps a copy. An entry processor is a piece of code sent to the owning member and run on one entry, one at a time for that key, so a read-change-write cannot be interleaved. A map store connects a map to a database; with a write delay, it writes in the background, and with write coalescing, only the latest value of each key."],
]
why = """
The plain version shows the idea. This version shows how a real data grid
answers the two problems the plain version left open: the oversold last item
and the crashed unit.
"""
install_note = "Only a JDK, version 21. Gradle downloads the rest, and the version is pinned:"
versions = [
    ["Java", "21"],
    ["Hazelcast", "5.7.0"],
]
costs = [
    "A cluster to size, run and upgrade in production.",
    "JVM flags that Hazelcast asks for on newer Java versions, set in build.gradle.",
]

[docs.session]
objectives = [
    "Start an embedded Hazelcast cluster.",
    "Sell atomically with an entry processor.",
    "Explain owners and backups.",
    "Configure write-behind and explain its risk.",
]
walkthrough = """
Run `./gradlew run`. Compare act one's 1.4 seconds with act two's under one.
Open `SellOne`: the whole sale. Open `Grid.config`: backups and write-behind.
End on act five's sold 1 of 2.
"""
exercises = [
    "Set the backup count to 0 and repeat the crash in act five.",
    "Sell the last kettle with get and put instead of an entry processor, and run it many times.",
    "Replace the slow database with PostgreSQL through JDBC in the map store.",
]

[docs.explained]
sentence = """
With Hazelcast, a space-based design keeps data in a partitioned in-memory
grid with backups, runs changes on each key's owner, and writes the database
behind.
"""
verdict = """
Use a data grid for bursts of load a single database cannot absorb. Change
data with entry processors, keep at least one backup, and accept that
write-behind trades durability for speed.
"""
recognise = [
    "`IMap` and `executeOnKey(key, processor)`.",
    "`MapStoreConfig` with a write delay.",
    "Clusters of application instances sharing an in-memory map.",
]

[spec]
purpose = """
Teach Space-Based Architecture with Hazelcast: a database bottleneck, stock in
a three-member grid, one owner per key, write-behind, an atomic last-kettle
sale and a survived crash.
"""
