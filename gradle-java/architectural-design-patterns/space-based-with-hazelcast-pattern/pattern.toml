# pattern.toml for the Space-Based Architecture with Hazelcast project. See tools/patternkit.

[project]
slug = "space-based-with-hazelcast"
category = "architectural-design-patterns"
title = "Space-Based Architecture with Hazelcast"
package = "spacehazelcast"
main_class = "HazelcastSpaceBasedDemo"
tagline = "A real data grid, no database in the way"
bold = "Keep the shop's stock in a real Hazelcast data grid spread across three processing units, sell with an entry processor that runs on the key's owner, write the database behind the scenes, and survive a unit crashing."
youtube_description = """Space-Based Architecture pattern in Java, explained with Hazelcast, an open-source in-memory data grid, using an online store's kettle flash sale. The busy data lives in the memory of the processing units themselves, and the database is written later in the background, like market stalls sharing one stock with a partner keeping a backup note. We see why the database was the bottleneck, hold the stock in a real grid as one copy rather than three, sell the last kettle exactly once by changing it where it lives, write the database behind, and watch what happens when a unit crashes."""
domain_note = ""
thumb_lines = ["SPACE-BASED", "WITH HAZELCAST"]
thumb_code = "executeOnKey(sku, SellOne)"
youtube_title = "Space-Based Architecture with Hazelcast"
youtube_tags = ["space-based architecture", "hazelcast", "data grid", "write-behind", "entry processor", "java"]

[readme]
intro = """
This is the framework version of the Space-Based Architecture pattern. The
plain Java version, a separate project in this category, gives each
processing unit its own copy of the data and copies sales between them. Here
Hazelcast, a real in-memory data grid, holds the data: three Hazelcast
members, started inside the demo with nothing else installed, form a cluster,
and the stock is split across them with a backup copy of every entry.

Three Hazelcast features answer the plain version's open problems. An entry
processor runs "sell one" on the member that owns the item, one at a time, so
two units can no longer both sell the last kettle. Backups mean a crashed unit
loses nothing. And write-behind writes the database later, in the background,
keeping only the latest value.
"""
analogy = """
Think of a busy market with several stalls sharing one stock of goods.
Instead of every stall running to the warehouse for each sale, the goods are
spread among the stalls, each item looked after by one stall, with a partner
stall keeping a note of it in case the first closes. A clerk updates the
warehouse ledger at the end of each hour, not after every sale.
"""
scenario = """
The online store's flash sale sends hundreds of kettle orders a second. Every
order used to update the stock in the database, which handles one write at a
time, so adding more app servers only made more of them queue for the same
database.
"""
test_note = """
Every result the demo prints is asserted, with three real Hazelcast members
started inside the test. Timings are printed as thresholds, and the wait for
the database is a bounded poll.
"""
run_note = """
Nothing to install beyond a Java 21 JDK: Hazelcast runs embedded, and the demo
starts three cluster members inside one program, joined over the local
network.
"""
twin = """
The plain Java version got the idea right: keep the data in memory in each
processing unit, keep the database out of the request path, and write it in
the background. It also showed the two dangers: copies that disagree for a
moment let two units sell the last kettle, and a unit that crashes before its
sales are copied loses them. What it left out is how a real data grid removes
both. Hazelcast gives every key one owner, so there are no copies to
disagree; an entry processor sells on the owner, one at a time, so only one of
two buyers gets the last kettle; a backup copy on another member takes over
when a unit crashes; and write-behind coalesces three hundred updates into a
few database writes.
"""
technologies = [
    ["Hazelcast", "5.7.0 (embedded)", "the data grid: partitioned map, backups, entry processors, write-behind"],
]
costs = [
    "**Memory everywhere.** Every unit holds its share of the data, and a backup of another's.",
    "**A cluster to run.** Members must find each other, be sized, upgraded and watched.",
    "**Write-behind can lose the latest.** If the whole grid stops before write-behind runs, the last sales never reach the database.",
]
too_much = """
If the database keeps up with the load, a normal app with a database is far
simpler. Space-based designs pay off for bursts of load that a single
database cannot absorb, such as flash sales and ticket releases.
"""
met_before = [
    "Hazelcast, Apache Ignite and Oracle Coherence data grids.",
    "Ticket-booking and trading systems that keep hot data in a grid.",
    "Caches with write-behind to a database.",
]
where = """
This project is in [architectural-design-patterns](..). It is the framework
version of the plain Java Space-Based Architecture project in the same
category, which is left unchanged.
"""

[[act]]
title = "One database for everyone"
summary = "300 kettle orders, each written to a database that takes 5 ms per write, take over 1.4 s; more app servers only queue for the same database."
detail = """
Every order writes the stock to the database, which handles one write at a
time and takes five milliseconds for each. Three hundred kettle orders take
over 1.4 seconds, and more app servers would only queue for the same
database.
"""
speech = """
First demo: one database for everyone. [[slnc 400]] Every order writes the stock to the database, one at a time. [[slnc 600]]
Three hundred kettle orders take more than one and a half seconds. [[slnc 500]]
More app servers would not help. [[slnc 300]] They would only queue for the same database.
"""
rows = { database = "active wrong" }
console = [
    ["300 orders: over 1.4 s", "bad"],
]

[[act]]
title = "Stock in the grid"
summary = "Three Hazelcast members form a cluster; 300 orders spread over them take under 1 s, with 0 database writes during the orders."
detail = """
Three Hazelcast members start and form a cluster. The stock lives in a
Hazelcast map spread across them. Three hundred orders, spread over the three
units, take under a second, and not one of them waits for the database.
"""
speech = """
Second demo: the stock lives in the grid. [[slnc 400]] Three Hazelcast members start, and form a cluster. [[slnc 600]]
The stock is held in their memory. [[slnc 500]]
Three hundred orders, spread over the three units, take less than a second. [[slnc 300]] Not one of them waits for the database.
"""
rows = { grid = "active ok", database = "active ok" }
console = [
    ["cluster formed: 3 members", "muted"],
    ["300 orders: under 1 s, 0 database writes", "ok"],
]

[[act]]
title = "One grid, not three copies"
summary = "Every unit reads 700; each key has one owner and a backup, so there are no copies to keep in step."
detail = """
Every unit reads the same stock, seven hundred. The grid does not keep three
copies to be synchronised: each key has one owner, with a backup on another
member, and every unit asks the owner.
"""
speech = """
Third demo: one grid, not three copies. [[slnc 400]] Every unit reads the same stock. [[slnc 300]] Seven hundred. [[slnc 600]]
Each item has one owner in the grid. [[slnc 300]] With a backup copy on another member. [[slnc 300]] Every unit asks the owner.
"""
rows = { grid = "active ok" }
console = [
    ["stock on each unit: 700, 700, 700", "ok"],
]

[[act]]
title = "Write-behind"
summary = "The database reaches 700 after at most 3 writes for 300 sales, because write-behind keeps only the latest value."
detail = """
Hazelcast writes the database later, in the background, with write-behind.
It keeps only the latest value of each key, so three hundred sales reach the
database as at most three writes, and the database stock is seven hundred. No
customer waited for any of those writes.
"""
speech = """
Fourth demo: the database catches up, in the background. [[slnc 400]] Hazelcast writes the database a little later. [[slnc 300]] And only the latest value. [[slnc 600]]
Three hundred sales become at most three database writes. [[slnc 300]] The database now says seven hundred. [[slnc 500]]
No customer waited for any of them.
"""
rows = { grid = "active ok", database = "active ok" }
console = [
    ["database: 700, after at most 3 writes", "ok"],
]

[[act]]
title = "The last kettle, a crash, and the bill"
summary = "Two customers on two units try for the last kettle: sold 1 of 2. Unit 3 crashes and KETTLE-1 is still 700 from its backup."
detail = """
One kettle is left, and two customers try for it on two different units at
once. The sale runs as an entry processor on the owning member, one at a
time: one sale succeeds, the other is refused, and stock is zero. Then unit
three crashes; its backup copies take over and the stock is still seven
hundred. The bill: data held in every unit's memory, a cluster to run, and
sales lost if the whole grid stops before write-behind runs.
"""
speech = """
Fifth demo: the last kettle, and a crash. [[slnc 400]] One kettle is left. [[slnc 300]] Two customers try for it, on two units, at the same moment. [[slnc 600]]
The sale runs on the member that owns the kettle, one at a time. [[slnc 300]] One succeeds. [[slnc 300]] The other is refused. [[slnc 600]]
Then unit three crashes. [[slnc 300]] Its backup copies take over. [[slnc 300]] Nothing is lost. [[slnc 600]]
The bill. [[slnc 300]] Data in every unit's memory. [[slnc 300]] A cluster to run. [[slnc 300]] And if the whole grid stops before the database is written, the latest sales are gone.
"""
rows = { grid = "active amber" }
console = [
    ["last kettle: sold 1 of 2; stock 0", "ok"],
    ["unit 3 crashes: stock still 700", "ok"],
    ["memory, a cluster, write-behind risk", "amber"],
]

