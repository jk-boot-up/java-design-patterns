[[scene]]
key = "01-poster"
kind = "poster"
title = "Space-Based Architecture with Hazelcast"
narration = """
Hello, and welcome. [[slnc 400]] This video explains Space-Based Architecture, built with Hazelcast, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] In a space-based design, the data lives in the memory of the processing units themselves. [[slnc 300]] So busy moments never wait for a database. [[slnc 300]] The database is written later, in the background. [[slnc 500]] Hazelcast is an open-source in-memory data grid: several programs that share data as one. [[slnc 600]]
Think of market stalls sharing one stock of goods. [[slnc 300]] Each item is looked after by one stall, with a partner keeping a note in case it closes. [[slnc 300]] The warehouse ledger is updated once an hour. [[slnc 700]]
In this video, the domain is an online shop's flash sale of kettles. [[slnc 500]]
By the end, you will hear why the database was the bottleneck. [[slnc 300]] How a real grid holds the stock. [[slnc 300]] How it sells the last kettle only once. [[slnc 300]] And what happens when a unit crashes.
"""

