[docs.session]
objectives = [
    "Name the five kinds of test double and the question each answers.",
    "Write a dummy, stub, spy, mock and fake for one interface.",
    "Explain the difference between checking state (fake) and checking calls (spy, mock).",
    "Say what a double can never prove, and what to do about it.",
]
walkthrough = """
Start with act one and ask the room what is wrong with a test that passed.
Then open `PaymentGateway.java` and point out that all five doubles implement it:
the interface is what makes doubles possible. Read each double in turn; none is
more than forty lines. End on act six, and ask which double would have caught
the pence bug, and which would not.
"""
exercises = [
    "Rewrite `CheckoutTest` using Mockito. Which of the five doubles does each Mockito call create?",
    "Add a stub that throws a timeout, and make checkout report \"try again later\".",
    "Make `FakeGateway` refuse a refund of an already refunded receipt, and test it.",
    "Find the one test that should talk to a real provider sandbox, and write it down as a to-do.",
]

[docs.explained]
sentence = """
A test double takes the place of something your code depends on, so a test can
run fast and offline and ask one precise question: a dummy for "unused", a stub
for "what if", a spy for "what was called", a mock for "never anything else",
and a fake for "the whole journey".
"""
verdict = """
Depend on interfaces for anything slow, costly or out of your control, and
replace them in unit tests. Pick the lightest double that answers your
question: stub before spy, spy before mock, fake for journeys. Check results
(state) rather than calls where you can, because it survives refactoring. And
keep one test against the real provider's sandbox.
"""
recognise = [
    "Classes named `Fake...`, `Stub...`, `InMemory...` in test folders.",
    "Mockito: `mock()`, `when().thenReturn()`, `verify()`, `@Mock`, `@Spy`.",
    "An interface with one real implementation and several in `src/test`.",
    "`@MockBean` in Spring Boot tests.",
]

