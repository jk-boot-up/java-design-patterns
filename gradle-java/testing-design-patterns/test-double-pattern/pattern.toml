# pattern.toml for the Test Double project. See tools/patternkit.

[project]
slug = "test-double"
category = "testing-design-patterns"
title = "Test Double"
package = "testdouble"
main_class = "TestDoubleDemo"
tagline = "A stand-in so tests stay fast and safe"
bold = "A test double stands in for something your code depends on, so a test can run fast, offline, without real money, and ask exactly the question it needs."
youtube_description = """Test Double pattern in Java: a test double stands in for something your code depends on, just for a test, so it runs fast, offline and without spending real money, like a stunt double taking the fall. Explained with an online store checkout that takes money through an outside payment provider. We start with the real provider, then meet all five kinds, a dummy, a stub, a spy, a mock and a fake, and the question each one answers. We finish with the bill: a double only checks what you told it to."""
domain_note = ""
thumb_lines = ["TEST", "DOUBLE"]
thumb_code = "new SpyGateway()"
youtube_title = "Test Double (Dummy, Stub, Spy, Mock, Fake)"
youtube_tags = ["test double", "mock vs stub", "unit testing", "java testing", "testing patterns"]

[readme]
intro = """
Checkout pays through a payment provider. Testing checkout against the real
provider is slow, needs the network, and charges real money. A **test double**
is an object that takes the provider's place in a test. The name comes from the
film industry's stunt double.

There are five kinds, each good for one question:

| Kind | What it does | The question it answers |
| --- | --- | --- |
| **Dummy** | Is passed in but must never be used; fails if it is | "Does this path leave the provider alone?" |
| **Stub** | Gives a canned answer | "What does checkout do when the card is declined?" |
| **Spy** | Answers, and records every call | "Did checkout charge the right amount, once?" |
| **Mock** | Is told the exact calls to expect, and fails at the first surprise | "Is anything charged twice?" |
| **Fake** | A small working version, in memory | "Does pay, cancel, pay again work end to end?" |

This project writes all five by hand, in a few lines each, so you can see
that a mocking library (Mockito and friends) is only a shortcut for writing them.
"""
analogy = """
On a film set, the actor does not jump off the roof. A stunt double does: same
costume, same shape on camera, but trained for the fall. For the lighting
check, the crew uses a stand-in who just stands on the mark. For a car crash,
a crash-test dummy.

Each stand-in fits one job, and nobody confuses them with the actor. A test
double is the same idea for code: something that looks like the payment
provider to checkout, so the test can do what would be slow, costly or
dangerous with the real one.
"""
scenario = """
The online store's `Checkout` turns a basket total into a paid order through a
`PaymentGateway` interface. The real gateway talks to a card provider over the
network. The team wants tests that run in milliseconds, work on a train, never
charge a real card, and can make the card decline on demand.
"""
costs = [
    "**A double only checks what you told it to.** Act six: a stub says \"approved\" to anything, so a checkout that charges 63 pence instead of £63.44 passes.",
    "**Doubles can drift from the real thing.** If the real provider changes its answers, every double is quietly out of date. Keep at least one test against the real provider (or its sandbox).",
    "**Mocks tie tests to how code works, not what it achieves.** A mock that expects exact calls breaks when the code is rearranged, even if the customer sees the same result.",
    "**More code to maintain,** unless a library writes the doubles for you.",
]
too_much = """
For code with no awkward dependency (pure calculations, like the Money class)
you need no double at all: call it and check the answer. And don't replace
things you own and that are fast (a list, a small value object) with doubles;
use the real ones.
"""
met_before = [
    "Mockito's `mock()`, `when(...).thenReturn(...)` (a stub) and `verify(...)` (spy-style checks).",
    "Spring's `@MockBean`, and in-memory databases such as H2 used as fakes.",
    "Payment sandboxes (Stripe test mode): a fake that the provider runs for you.",
    "Testcontainers: the other way round, a real database in a container instead of a double.",
]
where = """
This is the first project in [testing-design-patterns](..). It uses the checkout
from the rest of the course; the pattern under test is simply "checkout pays
through an interface", which almost every project here has.
"""

[[act]]
title = "The real provider"
summary = "Three tests take 2400 ms of network calls and charge £88.42 of real money; offline, a test fails though the code is fine."
detail = """
Three checkout tests run against the real provider. They pass, but they take
2400 milliseconds of network calls and charge £88.42 to a real test card. Then
the laptop goes offline, on a train, and the fourth test fails with "network
unreachable". Checkout was not broken; the test failed for a reason outside the
code. That is exactly what a unit test must never do.
"""
narration = "Three tests against the real provider pass, but take 2.4 seconds of network calls and charge 88 pounds 42 of real money. On a train with no signal, the fourth test fails, though checkout is fine."
rows = { checkout = "active ok", real = "active wrong" }
console = [
    ["3 tests passed, taking 2400 ms of network calls", "amber"],
    ["real money charged to the test card: £88.42", "bad"],
    ["4th test, on a train with no signal: FAILED, network unreachable", "bad"],
    ["checkout was not broken: the test failed for a reason outside the code", "muted"],
]

[[act]]
title = "A dummy and a stub"
summary = "A dummy proves an empty basket never pays; a stub makes the card decline on demand."
detail = """
Two of the simplest doubles. An empty basket must be refused without touching
the provider, so the test passes a **dummy**, which throws if it is used at all.
The test passes: "refused: the basket is empty". The dummy turns "I think this
never pays" into a checked fact. Then a **stub** that always answers "declined:
insufficient funds" lets the test drive checkout down the decline path, which is
hard to make happen with a real card. Both run in no time and charge nothing.
"""
narration = "An empty basket is refused, with a dummy that fails if touched: so the provider was never called. A stub that always declines makes checkout say not paid, insufficient funds. Both run instantly, and charge nothing."
rows = { checkout = "active ok", dummy = "active ok", stub = "active amber" }
console = [
    ["empty basket, with a dummy that fails if touched: refused: the basket is empty", "ok"],
    ["a stub that always declines: not paid: insufficient funds", "amber"],
    ["both ran in 0 ms and charged nothing", "ok"],
]

[[act]]
title = "A spy"
summary = "The spy records charge(ORD-7, 6344) then refund(spy-1): the exact amount, once, then the refund."
detail = """
A **spy** answers like a stub, and also writes down every call. The test places
order ORD-7 for £63.44 and then cancels it, and afterwards reads the spy's
notes: `charge(ORD-7, 6344)` and `refund(spy-1)`. So the test can check the
exact amount in pence, that it was charged once, and that the refund used the
right receipt: questions a stub alone cannot answer.
"""
narration = "A spy writes down every call. Place order seven for 63 pounds 44, then cancel it. The spy recorded: charge order seven, 6344 pence, then refund receipt spy one."
rows = { checkout = "active ok", spy = "active ok" }
console = [
    ["place ORD-7 for £63.44, then cancel it", "muted"],
    ["the spy recorded: [charge(ORD-7, 6344), refund(spy-1)]", "ok"],
]

[[act]]
title = "A mock"
summary = "Told to expect one charge, the mock passes it, then fails at once on a double-click second charge."
detail = """
A **mock** is told in advance exactly which calls to expect: here, one charge of
6344 pence for ORD-8. That call goes through, and `verify()` confirms every
expected call happened. Then the customer double-clicks and checkout charges
again: the mock fails *at that moment*, "unexpected call ... no more charges
were expected". A spy is checked after the test; a mock checks as the calls
happen, which makes it good at catching things that must never happen twice.
"""
narration = "A mock is told to expect exactly one charge. It happens, and verify passes. Then a double click charges again, and the mock fails at once: unexpected call, no more charges were expected."
rows = { checkout = "active ok", mock = "active wrong" }
console = [
    ["expected charge(ORD-8, 6344): paid, receipt mock-1", "ok"],
    ["verify(): every expected call happened", "ok"],
    ["a double click charges again: FAILED at once, unexpected call: charge(ORD-8, 6344), no more charges were expected", "bad"],
]

[[act]]
title = "A fake"
summary = "An in-memory provider with a £100 limit: pay £63.44, decline £50, cancel, pay £50, balance £50.00."
detail = """
A **fake** is a small provider that really works, keeping its ledger in memory.
With a card limit of £100.00, paying £63.44 succeeds, a further £50.00 is
declined as over the limit, cancelling the first order brings the balance back
to £0.00, and £50.00 then succeeds, leaving £50.00. A whole customer journey,
tested in milliseconds, offline, with real behaviour rather than canned answers.
"""
narration = "A fake is a small provider that really works, in memory. With a 100 pound limit: pay 63 44, fine. Another 50 is declined. Cancel the first; the balance is zero. Pay 50 again, fine. Balance 50 pounds."
rows = { checkout = "active ok", fake = "active ok" }
console = [
    ["card limit £100.00; pay £63.44: paid, receipt fake-1", "ok"],
    ["pay another £50.00: not paid: over the card limit", "amber"],
    ["cancel the first order; balance now £0.00", "ok"],
    ["pay £50.00 again: paid, receipt fake-2; balance £50.00", "ok"],
]

[[act]]
title = "The bill"
summary = "A pounds-for-pence bug passes with a stub and is caught by a spy; no double proves the real provider still works."
detail = """
A double only checks what you asked it to. A checkout with a planted bug sends
pounds where the provider expects pence, 63 instead of 6344. Tested with a stub
that approves anything, it **passes**. The same bug tested with a spy fails,
because the spy recorded `charge(ORD-12, 63)`. And no double, however careful,
can tell you the real provider still accepts your requests; keep at least one
test against the real thing or its sandbox.
"""
narration = "The bill. A bug sends pounds instead of pence: 63 instead of 6344. With a stub, the test passes. With a spy, it fails, because the spy recorded 63. And no double proves the real provider still works."
rows = { checkout = "active wrong", stub = "active wrong", spy = "active ok" }
console = [
    ["a checkout that sends pounds instead of pence, tested with a stub: paid, receipt stub-1, PASSED", "bad"],
    ["the same bug with a spy: recorded [charge(ORD-12, 63)], not charge(ORD-12, 6344): FAILED", "ok"],
    ["and no double can tell you the real provider still works: keep one test against it", "amber"],
]

