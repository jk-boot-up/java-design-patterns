[[scene]]
key = "01-poster"
kind = "poster"
title = "Test Double"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Test Double pattern, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] A test double is an object that takes the place of something your code depends on, just for a test. [[slnc 300]]
So the test can run fast, without the network, without spending real money, and ask exactly the question it needs. [[slnc 600]]
The name comes from films. [[slnc 300]] When a scene is dangerous, the actor does not jump off the roof. [[slnc 300]] A stunt double does. [[slnc 300]] Same costume, same shape on camera, but trained for the fall. [[slnc 700]]
In this video, the domain is an online shop's checkout. [[slnc 300]] Checkout takes a customer's money through a payment provider: an outside company that charges the card. [[slnc 500]]
By the end, you will know the five kinds of test double: dummy, stub, spy, mock and fake. [[slnc 300]] Which question each one answers. [[slnc 300]] And the one thing no double can ever tell you.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["Checkout pays through a", "PaymentGateway.", "", "The real one is slow, needs", "the network, and charges", "real money.", "", "How do we test checkout?"]
narration = """
Here is the scenario. [[slnc 400]] Checkout turns a basket total into a paid order. [[slnc 300]] To take the money, it calls a payment gateway. [[slnc 300]] A gateway is the part of the code that talks to the card provider. [[slnc 600]]
The real gateway is slow. [[slnc 300]] It needs the network. [[slnc 300]] And every successful call charges a real card. [[slnc 500]]
So how do we test checkout?
"""

[[scene]]
key = "03-real"
kind = "console"
title = "Act One — The Real Provider"
body = """ONE. Testing against the real provider.
  3 tests passed, 2400 ms of network calls
  real money charged: £88.42
  4th test, on a train with no signal:
    FAILED, network unreachable"""
narration = """
First demo: testing against the real provider. [[slnc 400]] Three checkout tests. [[slnc 300]] They pass. [[slnc 300]] But they take two point four seconds of network calls. [[slnc 300]] And they charge eighty-eight pounds forty-two to a real test card. [[slnc 600]]
Then the laptop goes offline, on a train. [[slnc 300]] The fourth test fails: network unreachable. [[slnc 500]]
Checkout was not broken. [[slnc 300]] The test failed for a reason outside the code. [[slnc 300]] A good unit test must never do that.
"""

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["Checkout depends on an interface,", "not on the real provider.", "", "A test puts a stand-in", "behind that interface.", "", "Five kinds, one question each."]
narration = """
Now, the pattern. [[slnc 400]] Checkout depends on an interface, called payment gateway, not on the real provider. [[slnc 300]] An interface is a list of methods, with no code behind them. [[slnc 500]]
So a test can put any object behind that interface. [[slnc 300]] Something that looks like a provider to checkout, but is built for the test. [[slnc 500]]
There are five kinds of test double. [[slnc 300]] Each one answers a different question.
"""

[[scene]]
key = "05-dummy-stub"
kind = "console"
title = "Act Two — A Dummy And A Stub"
body = """TWO. A dummy and a stub.
  empty basket, with a dummy:
    refused: the basket is empty
  a stub that always declines:
    not paid: insufficient funds
  both: 0 ms, nothing charged"""
narration = """
Second demo: the two simplest doubles. [[slnc 400]] First, a dummy. [[slnc 300]] A dummy is passed in only because checkout needs something. [[slnc 300]] It must never be used, and it fails loudly if it is. [[slnc 500]]
An empty basket must be refused without touching the provider. [[slnc 300]] With a dummy behind checkout, the test passes. [[slnc 300]] So we know, for certain, the provider was never called. [[slnc 600]]
Second, a stub. [[slnc 300]] A stub gives a fixed, canned answer. [[slnc 300]] This one always says: declined, insufficient funds. [[slnc 300]] So the test can check what checkout does when a card is declined. [[slnc 300]] Something hard to arrange with a real card. [[slnc 500]]
Both ran instantly, and charged nothing.
"""

[[scene]]
key = "06-spy"
kind = "console"
title = "Act Three — A Spy"
body = """THREE. A spy writes down every call.
  place ORD-7 for £63.44, then cancel it
  the spy recorded:
    charge(ORD-7, 6344)
    refund(spy-1)"""
narration = """
Third demo: a spy. [[slnc 400]] A spy answers like a stub. [[slnc 300]] But it also writes down every call it receives. [[slnc 500]]
The test places order seven, for sixty-three pounds forty-four. [[slnc 300]] Then cancels it. [[slnc 500]]
Afterwards, the test reads the spy's notes. [[slnc 300]] Charge order seven, six thousand three hundred and forty-four pence. [[slnc 300]] Then refund receipt spy one. [[slnc 500]]
So the test can check the exact amount, that it was charged only once, and that the right receipt was refunded.
"""

[[scene]]
key = "07-mock"
kind = "console"
title = "Act Four — A Mock"
body = """FOUR. A mock expects exact calls.
  expected charge(ORD-8, 6344): paid
  verify(): every expected call happened
  a double click charges again:
    FAILED at once, no more charges
    were expected"""
narration = """
Fourth demo: a mock. [[slnc 400]] A mock is told in advance exactly which calls to expect. [[slnc 300]] Here: one charge, for order eight, six thousand three hundred and forty-four pence. [[slnc 500]]
The charge happens. [[slnc 300]] And a final check, called verify, confirms every expected call arrived. [[slnc 600]]
Then the customer double-clicks the pay button. [[slnc 300]] Checkout charges again. [[slnc 300]] And the mock fails the test at that very moment: unexpected call, no more charges were expected. [[slnc 600]]
So here is the difference. [[slnc 300]] A spy is checked after the test. [[slnc 300]] A mock checks as the calls happen. [[slnc 300]] That makes it good at catching things that must never happen twice.
"""

[[scene]]
key = "08-fake"
kind = "console"
title = "Act Five — A Fake"
body = """FIVE. A fake, in memory.
  card limit £100.00
  pay £63.44: paid
  pay £50.00: over the card limit
  cancel the first: balance £0.00
  pay £50.00: paid, balance £50.00"""
narration = """
Fifth demo: a fake. [[slnc 400]] A fake is a small provider that really works, but keeps everything in memory. [[slnc 500]]
This one has a card limit of one hundred pounds. [[slnc 300]] Pay sixty-three forty-four: paid. [[slnc 300]] Pay another fifty pounds: declined, over the card limit. [[slnc 300]] Cancel the first order: the balance goes back to zero. [[slnc 300]] Pay fifty pounds again: paid, balance fifty pounds. [[slnc 600]]
A whole customer journey, tested in milliseconds, offline. [[slnc 300]] With real behaviour, instead of canned answers.
"""

[[scene]]
key = "09-roles"
kind = "bullets"
title = "Five Doubles, Five Questions"
body = ["Dummy: was it left alone?", "Stub: what if it says no?", "Spy: what exactly was called?", "Mock: never anything else!", "Fake: does the journey work?"]
narration = """
Here are the five doubles, and the question each one answers. [[slnc 500]]
A dummy: was the provider left alone? [[slnc 400]]
A stub: what does checkout do if the answer is no? [[slnc 400]]
A spy: what exactly was called, and with which amount? [[slnc 400]]
A mock: nothing else may happen, not even once more. [[slnc 400]]
A fake: does the whole journey work, from payment to refund? [[slnc 500]]
Pick the lightest double that answers your question.
"""

[[scene]]
key = "10-bill"
kind = "console"
title = "Act Six — The Bill"
body = """SIX. A double only checks what you told it to.
  bug: sends pounds, not pence
  with a stub: paid, PASSED
  with a spy: recorded charge(ORD-12, 63)
    not 6344: FAILED"""
narration = """
Finally, the bill. [[slnc 400]] A double only checks what you told it to check. [[slnc 500]]
Here is a planted bug. [[slnc 300]] Checkout sends the amount in pounds, where the provider expects pence. [[slnc 300]] Sixty-three, instead of six thousand three hundred and forty-four. [[slnc 600]]
Tested with a stub that approves anything, the test passes. [[slnc 300]] The bug is invisible. [[slnc 500]]
The same bug with a spy fails. [[slnc 300]] Because the spy recorded sixty-three. [[slnc 600]]
And no double, however careful, can tell you the real provider still accepts your requests. [[slnc 300]] Keep at least one test against the real provider's test sandbox.
"""

[[scene]]
key = "11-costs"
kind = "bullets"
title = "What Doubles Cost"
body = ["They check only what you ask.", "They can drift from the real thing.", "Mocks tie tests to how code", "works, not what it achieves.", "", "Check results where you can."]
narration = """
So, what do doubles cost? [[slnc 400]] They check only what you ask them to. [[slnc 300]] They can quietly drift away from how the real provider behaves. [[slnc 300]] And a mock, which expects exact calls, can break when code is rearranged, even when the customer sees the same result. [[slnc 500]]
Where you can, check the result, like the fake's balance, rather than the exact calls. [[slnc 300]] Checks on results survive changes to the code.
"""

[[scene]]
key = "12-recognise"
kind = "bullets"
title = "How To Recognise It"
body = ["Mockito: mock(), when(),", "thenReturn(), verify().", "", "FakeX, StubX, InMemoryX", "in the test folder.", "", "@MockBean in Spring tests."]
narration = """
How can you spot test doubles in code someone else wrote? [[slnc 400]] Look for Mockito: methods called mock, when, then return, and verify. [[slnc 300]] A mocking library writes these doubles for you. [[slnc 300]] Look for classes named fake, stub, or in memory, in the test folder. [[slnc 300]] Or the mock bean annotation, in Spring tests.
"""

[[scene]]
key = "13-verdict"
kind = "bullets"
title = "The Verdict"
body = ["Depend on interfaces for anything", "slow, costly or outside your control.", "", "Stub before spy, spy before mock,", "a fake for journeys.", "", "Keep one test against the real thing."]
narration = """
So, here is the verdict. [[slnc 400]] Depend on an interface for anything slow, costly, or outside your control. [[slnc 300]] Then replace it in your unit tests. [[slnc 500]]
Use the lightest double that answers your question. [[slnc 300]] A stub before a spy. [[slnc 300]] A spy before a mock. [[slnc 300]] And a fake for whole journeys. [[slnc 500]]
And keep one test against the real provider's sandbox.
"""

