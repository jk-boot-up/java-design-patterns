[[scene]]
key = "01-poster"
kind = "poster"
title = "Page Object"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Page Object pattern, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] Browser tests drive a web page the way a person would. [[slnc 300]] A page object is a class for one page. [[slnc 300]] It knows how to find the page's boxes and buttons, and how long the page takes to update. [[slnc 300]] So the tests only say what a shopper does. [[slnc 600]]
Think of a hotel guest asking the concierge for a taxi. [[slnc 300]] The guest does not need the taxi firm's number. [[slnc 300]] The concierge knows it. [[slnc 300]] And if the number changes, only the concierge needs to know. [[slnc 700]]
In this video, the domain is an online shop's checkout page, and the automated tests that check it. [[slnc 500]]
By the end, you will hear why tests that find buttons themselves are fragile. [[slnc 300]] How one class fixes a renamed button for every test. [[slnc 300]] How it hides waiting. [[slnc 300]] And what it costs to keep.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["Browser tests for checkout.", "", "Each test types the coupon,", "clicks #apply-btn,", "and reads #total itself."]
narration = """
Here is the scenario. [[slnc 400]] The shop has automated browser tests for its checkout page. [[slnc 500]]
Each test typed the coupon code, clicked the apply button, and read the total, all by itself. [[slnc 500]]
Each test knew the names the page uses for those elements.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["One class per page.", "", "It knows the selectors", "and the timing.", "", "Tests speak in shop terms."]
narration = """
Let's name the pattern. [[slnc 400]] One class for each page. [[slnc 500]]
It is the only place that knows the page's selectors, and how long the page takes to update. [[slnc 500]]
Tests call its methods, in the shop's own words.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["CheckoutPage: apply coupon, total, place order", "ConfirmationPage: the order number", "FakeBrowser: stands in for WebDriver", "Tests: decide what is right"]
narration = """
Here is who does what. [[slnc 400]] Checkout page can apply a coupon, read the total, and place the order. [[slnc 500]]
Confirmation page shows the order number. [[slnc 500]]
The fake browser stands in for a real browser driver. [[slnc 300]] And the tests decide whether what they see is right.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Selenium page objects", "Playwright and Cypress page classes", "The Screenplay pattern"]
narration = """
You have probably met this pattern already. [[slnc 400]] Selenium's own guides recommend page objects. [[slnc 500]]
Playwright and Cypress projects are often organised into page classes. [[slnc 500]]
And the Screenplay pattern is a later refinement of the same idea.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Several tests share a page.", "", "Name methods after actions.", "Hide the waiting.", "Return the next page.", "Keep checks in tests."]
narration = """
So, when should you use it? [[slnc 400]] Once several browser tests share a page. [[slnc 500]]
Name methods after what a shopper does. [[slnc 300]] Hide the waiting inside them. [[slnc 300]] Return the next page when an action moves on. [[slnc 300]] And keep the checks in the tests.
"""

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Split out a", "coupon panel component."]
narration = """
That's the Page Object pattern. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Tests say what the shopper does, and one class knows how. [[slnc 500]]
The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs offline, with nothing installed except a Java development kit. [[slnc 500]]
Here is one exercise to try. [[slnc 300]] Move the coupon box into its own small component class. [[slnc 500]]
If this helped, a like really does help other people find it. [[slnc 300]] And subscribe, if you'd like the rest of the series. [[slnc 400]] Thanks for watching.
"""
