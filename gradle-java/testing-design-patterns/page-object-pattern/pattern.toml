# pattern.toml for the Page Object project. See tools/patternkit.

[project]
slug = "page-object"
category = "testing-design-patterns"
title = "Page Object"
package = "pageobject"
main_class = "PageObjectDemo"
tagline = "Tests speak shop, not HTML"
bold = "Wrap each page of a web interface in a class that knows its selectors and its timing, so browser tests speak in the shop's words and a page change is fixed in one place."
youtube_description = """Page Object pattern in Java, explained with an online store checkout page and the automated browser tests that check it. A page object is a class for one page that knows how to find its boxes and buttons and how long it takes to update, so the tests only say what a shopper does, like a hotel concierge who knows the taxi firm's number. We watch tests full of selectors break when one button is renamed, move them into a page object, and return the next page from each action. We finish with the bill."""
domain_note = ""
thumb_lines = ["PAGE", "OBJECT"]
thumb_code = "checkout.applyCoupon()"
youtube_title = "Page Object"
youtube_tags = ["page object", "selenium", "ui testing", "end to end tests", "test automation", "java"]

[readme]
intro = """
Page Object is a pattern for browser tests. A browser test drives the web
page the way a person would: type into this box, click that button, read that
text. Each box and button is found with a selector, such as `#apply-btn`.
When every test names the selectors itself, the tests are hard to read, and
when a designer renames one button, every test that clicks it breaks.

A Page Object is a class for one page. It is the only place that knows the
page's selectors and how long it takes to update. Tests call its methods,
such as `applyCoupon("SAVE10")` and `total()`, and read like a description of
what a shopper does.
"""
analogy = """
Think of a hotel guest who asks the concierge for a taxi. The guest does not
need to know the taxi firm's phone number, or that the line is always busy at
six. The concierge knows those details. If the taxi firm changes its number,
only the concierge needs to know. The page object is the concierge.
"""
scenario = """
The online store has automated browser tests for its checkout page. Each test
typed the coupon, clicked `#apply-btn`, and read `#total` itself. Some read
the total before the page had finished updating and saw the old price. Then
the designers renamed the button to `#apply-coupon`, and every coupon test
failed at once.
"""
costs = [
    "**Another layer to maintain.** Each page needs its own object, kept in step with the real page.",
    "**Bloat.** Page objects that grow to cover everything become hard to use; split them by page or component.",
    "**Checks belong in tests.** A page object reports what the page shows; if it starts deciding what is correct, tests lose their meaning.",
]
too_much = """
For one or two throwaway checks of a page, the extra class is not worth it.
Page objects pay off once several tests use the same page, and the page keeps
changing.
"""
met_before = [
    "Selenium's documentation recommends page objects.",
    "Playwright and Cypress projects organised into page or component classes.",
    "The Screenplay pattern, a later refinement built around actors and tasks.",
]
where = """
This project is in [testing-design-patterns](..), next to
[Object Mother / Test Data Builder](../object-mother-pattern), which hides how
test data is made, where this one hides how a page is driven.
"""

[[act]]
title = "Tests click selectors"
summary = "A test types the coupon, clicks #apply-btn and reads #total at once: 50.00, because the page had not finished updating."
detail = """
A test drives the checkout page by its selectors. It types SAVE10 into
`#coupon`, clicks `#apply-btn`, and reads `#total` straight away. It sees
50.00. The coupon was accepted, but the page updates a moment later, and the
test read the total too soon.
"""
speech = """
First demo: tests that click selectors themselves. [[slnc 400]] A selector is the name a test uses to find a box or a button on the page. [[slnc 600]]
The test types a coupon code. [[slnc 300]] It clicks the apply button. [[slnc 300]] Then it reads the total, straight away. [[slnc 500]]
It sees fifty. [[slnc 300]] The old price. [[slnc 500]]
The coupon was accepted. [[slnc 300]] But the page updates a moment later, and the test looked too soon.
"""
rows = { test = "active wrong", page = "active amber" }
console = [
    ["click #apply-btn, read #total", "muted"],
    ["total: 50.00 (too soon)", "bad"],
]

[[act]]
title = "A button is renamed"
summary = "The designers rename #apply-btn to #apply-coupon: 0 of 5 coupon tests pass, and each must be found and edited."
detail = """
The designers rename the apply button from `#apply-btn` to `#apply-coupon`.
Five coupon tests each named the old selector themselves. None of the five
can find the button, all five fail, and every one must be found and edited.
"""
speech = """
Second demo: the designers rename the apply button. [[slnc 400]] It was called apply button. [[slnc 300]] Now it is called apply coupon. [[slnc 600]]
Five coupon tests each used the old name. [[slnc 300]] None of them can find the button. [[slnc 500]]
Zero of five pass. [[slnc 300]] And every one must be found and edited.
"""
rows = { test = "active wrong", page = "active amber" }
console = [
    ["#apply-btn is now #apply-coupon", "muted"],
    ["0 of 5 tests pass", "bad"],
]

[[act]]
title = "A Page Object"
summary = "CheckoutPage holds the selectors and waits for updates: one selector changed, 5 of 5 tests pass, and applyCoupon(\"SAVE10\").total() is 45.00."
detail = """
Now a `CheckoutPage` class is the only place that knows the page. Its
`applyCoupon` method types the code, clicks the button, and waits until the
page says the coupon is applied. After the rename, one selector was changed in
that class and all five tests pass. Each test just says
`applyCoupon("SAVE10")` and reads a total of 45.00.
"""
speech = """
Third demo: a page object. [[slnc 400]] One class, checkout page, is the only place that knows the page. [[slnc 300]] Its selectors, and its timing. [[slnc 600]]
Its apply coupon method types the code, clicks the button, and waits until the page has updated. [[slnc 600]]
After the rename, one line in that class changed. [[slnc 300]] And all five tests pass. [[slnc 500]]
Each test simply says, apply coupon save ten. [[slnc 300]] And reads a total of forty-five.
"""
rows = { test = "active ok", pageobject = "active ok", page = "active ok" }
console = [
    ["one selector changed: 5 of 5 pass", "ok"],
    ["applyCoupon(SAVE10).total(): 45.00", "ok"],
]

[[act]]
title = "Return the next page"
summary = "checkout.placeOrder() returns a ConfirmationPage showing ORD-1042 and \"Thank you for your order\"."
detail = """
Actions that move to another page return that page's object.
`checkout.placeOrder()` returns a `ConfirmationPage`, which shows order
ORD-1042 and the thank-you message. The test cannot ask the checkout page for
an order number by mistake: the methods follow the real journey.
"""
speech = """
Fourth demo: an action that moves to a new page returns that page. [[slnc 400]] Place order returns the confirmation page. [[slnc 600]]
The confirmation page shows the order number, O R D ten forty-two. [[slnc 300]] And the message, thank you for your order. [[slnc 600]]
The test cannot ask the checkout page for an order number by mistake. [[slnc 300]] The code follows the real journey.
"""
rows = { pageobject = "active ok", confirmation = "active ok" }
console = [
    ["placeOrder() -> ConfirmationPage", "ok"],
    ["ORD-1042", "ok"],
]

[[act]]
title = "The bill"
summary = "Every page needs its object, kept in step with the real page; page objects report, and the checks stay in the tests."
detail = """
Every page now has a class that must be kept in step with the real page. And
there is a rule to keep: page objects report what the page shows, and the
tests decide whether it is right. A page object that asserts its own results
hides what each test is checking.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] Every page now needs its own class. [[slnc 300]] And each must be kept in step with the real page. [[slnc 600]]
And there is a rule to keep. [[slnc 300]] Page objects report what the page shows. [[slnc 300]] The tests decide whether it is right. [[slnc 500]]
A page object that checks its own results hides what each test is testing.
"""
rows = { pageobject = "active amber" }
console = [
    ["one class per page, kept in step", "amber"],
    ["page objects report, tests decide", "amber"],
]

[animation]
subtitle = "Tests call the checkout page object, which drives the browser."
boxes = [
    ["test", "Checkout test", "speaks shop"],
    ["pageobject", "CheckoutPage", "selectors, waiting"],
    ["page", "Browser page", "#apply-coupon, #total"],
    ["confirmation", "ConfirmationPage", "order number"],
]

[docs.problem]
scenario = """
Browser tests for the store's checkout type a coupon, click apply and read the
total.
"""
naive = """
Tests that name selectors themselves read totals too soon, and all break
together when a button is renamed.
"""
deliver = [
    "A raw test reading a stale total.",
    "A renamed button breaking every raw test.",
    "A page object with selectors and waiting in one place.",
    "Navigation returning the next page object.",
    "The maintenance rule: report, don't assert.",
    "A real test class written with the page object.",
]

[docs.prerequisites]
required = [
    "Java basics: classes, method chaining.",
    "A rough idea of HTML elements and CSS selectors such as `#total`.",
]
not_required = [
    "Selenium or a browser. `FakeBrowser` stands in for WebDriver.",
]

[docs.session]
objectives = [
    "Explain why selectors in tests make them fragile.",
    "Write a page object with intent-named methods.",
    "Hide waiting for page updates inside the page object.",
    "Return the next page object from navigation methods.",
]
walkthrough = """
Run `./gradlew run` and compare act two's 0 of 5 with act three's 5 of 5. Open
`CheckoutPage`: the `APPLY` constant and the wait in `applyCoupon`. Then read
`CheckoutPageTest`: no selectors at all.
"""
exercises = [
    "Add a `removeCoupon()` method and a test for it.",
    "Move the coupon box into its own `CouponPanel` component object.",
    "Replace `FakeBrowser` with Selenium's `WebDriver` against a real page.",
]

[docs.explained]
sentence = """
A Page Object wraps a page in a class that knows its selectors and timing, so
tests speak in the shop's words.
"""
verdict = """
Use page objects once several browser tests share a page. Name methods after
what a shopper does, hide waiting inside them, return the next page from
navigation, and keep the checks in the tests.
"""
recognise = [
    "Classes named `...Page` with methods like `login()` or `applyCoupon()`.",
    "Selectors as constants in one class, not in tests.",
    "Methods returning another page object after a click.",
]

[spec]
purpose = """
Teach Page Object with an online store's checkout tests: a raw test reading a
stale total, a renamed button breaking every raw test, a page object fixing
both in one place, navigation returning the next page, and the upkeep cost.
"""
nongoals = [
    "Not a real browser. `FakeBrowser` imitates the parts of WebDriver the demo needs.",
]
problem = """
Browser tests that name selectors and handle timing themselves are hard to
read and break together whenever the page changes.
"""
roles = [
    ["The Page Object", "`CheckoutPage`"],
    ["The next page", "`ConfirmationPage`"],
    ["The browser", "`FakeBrowser`"],
    ["Tests in shop terms", "`CheckoutPageTest`"],
    ["Entry point", "`PageObjectDemo`, five acts"],
]
requirements = [
    "**One place:** only `CheckoutPage` names checkout selectors.",
    "**Waits:** `applyCoupon` returns only after the page has updated.",
    "**Navigation:** `placeOrder` returns a `ConfirmationPage`.",
    "**Every printed result is asserted** in `DemoRunsTest`.",
]

