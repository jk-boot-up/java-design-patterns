# pattern.toml for the Page Object with Selenium project. See tools/patternkit.

[project]
slug = "page-object-with-selenium"
category = "testing-design-patterns"
title = "Page Object with Selenium"
package = "pageobjectselenium"
main_class = "SeleniumPageObjectDemo"
tagline = "Real browser, tests in shop terms"
bold = "Drive the shop's real checkout page in a real Chromium browser with Selenium WebDriver, and wrap each page in a page object that knows its selectors and waits for the page, so tests speak in shop terms."
youtube_description = """Page Object pattern in Java: a page object is a class for one page that knows how to find its boxes and buttons and how long the page takes to answer, so tests only say what a shopper does. Explained with Selenium, driving a real Chromium browser against an online store checkout page. We watch tests with selectors inside them fail when a button is renamed, move them into a page object, return the next page from each action, and learn why waiting belongs in the page object too. We finish with the bill."""
domain_note = ""
thumb_lines = ["PAGE OBJECT", "WITH SELENIUM"]
thumb_code = "checkout.applyCoupon(\"SAVE10\")"
youtube_title = "Page Object with Selenium WebDriver"
youtube_tags = ["page object", "selenium", "webdriver", "ui testing", "end to end tests", "java"]

[readme]
intro = """
This is the real-browser version of the Page Object pattern. The plain Java
version, a separate project in this category, drives a pretend browser in
memory. Here Selenium WebDriver drives a real Chromium browser, started in a
container by the demo itself, against the shop's checkout page, which the
demo serves over HTTP. Applying a coupon updates the total from JavaScript a
moment later, exactly the kind of timing that trips up browser tests.

`CheckoutPage` is the page object: the only class that knows the page's
selectors, and the only place that waits, with Selenium's `WebDriverWait`,
until the page has answered. Tests call `applyCoupon("SAVE10")` and `total()`,
and `placeOrder()` returns the next page's object, `ConfirmationPage`.
"""
analogy = """
Think of a hotel guest who asks the concierge for a taxi. The guest does not
need the taxi firm's number, or to know that the line is always busy at six;
the concierge handles both. If the number changes, only the concierge needs to
know.
"""
scenario = """
The online store has automated browser tests for its checkout page. Each test
found the coupon box and the apply button itself and read the total straight
away, sometimes before the page had updated. When the designers renamed the
apply button, every coupon test failed at once.
"""
test_note = """
Every result the demo prints is asserted in a real Chromium browser in a
container. Waits are Selenium waits for real conditions. Without a container
runtime, the browser test is skipped rather than failed.
"""
run_note = """
This project needs a running container runtime, such as Docker Desktop: the
demo starts a real Chromium 152 browser with its WebDriver server in a
container, and removes it again. Without one, it prints a sentence saying what
to start, rather than failing. The first run downloads a large image.
"""
twin = """
The plain Java version got the idea right: selectors and timing in one class
per page, tests in shop terms, a rename fixed in one place, and navigation
returning the next page object. What it left out is a real browser. Here the
stale read is real: JavaScript updated the total 300 milliseconds after the
click, and the raw test read 50.00. The renamed button raises Selenium's
NoSuchElementException. And the page object waits with WebDriverWait on a real
condition, the status text, rather than a fixed pause.
"""
technologies = [
    ["Selenium WebDriver", "4.49.0", "driving the browser: findElement, click, WebDriverWait"],
    ["Chromium with Selenium server", "152.0 (container image selenium/standalone-chromium)", "the real browser"],
    ["Testcontainers", "2.0.5", "starts and stops the browser container"],
    ["Docker", "24 or later", "runs the container"],
    ["JDK HttpServer", "Java 21", "serves the shop's checkout and confirmation pages"],
]
costs = [
    "**Slow and heavy.** A real browser in a container, and a real page load for every test.",
    "**Another layer.** Every page needs its object, kept in step with the real page.",
    "**Report, don't assert.** Page objects report what the page shows; tests decide whether it is right.",
]
too_much = """
For one or two checks of a page, the extra class is not worth it, and many
checks are better done without a browser at all. Page objects pay off once
several browser tests share a page that keeps changing.
"""
met_before = [
    "Selenium's own documentation, which recommends page objects.",
    "Playwright and Cypress projects organised into page classes.",
    "The Screenplay pattern, a later refinement.",
]
where = """
This project is in [testing-design-patterns](..). It is the real-browser
version of the plain Java Page Object project in the same category, which is
left unchanged.
"""

[[act]]
title = "Selectors in the test"
summary = "In a real browser, a test types the coupon, clicks #apply-btn and reads #total at once: 50.00, before JavaScript updated it."
detail = """
A test drives the real checkout page by its selectors: it types SAVE10, clicks
#apply-btn and reads #total straight away. It sees 50.00. The coupon was
accepted, but the page's JavaScript updates the total 300 milliseconds later,
and the test read it too soon.
"""
speech = """
First demo: a test that finds the page's elements itself, in a real browser. [[slnc 400]] It types the coupon code. [[slnc 300]] Clicks apply. [[slnc 300]] Reads the total, straight away. [[slnc 600]]
Fifty pounds. [[slnc 300]] The old price. [[slnc 500]]
The page updates a moment later, from its own script. [[slnc 300]] The test looked too soon.
"""
rows = { test = "active wrong", page = "active amber" }
console = [
    ["read #total at once: 50.00", "bad"],
]

[[act]]
title = "A button is renamed"
summary = "The designers rename the button to #apply-coupon: 0 of 5 raw tests pass, each failing with NoSuchElementException."
detail = """
The designers rename the button from #apply-btn to #apply-coupon. Five coupon
tests each named the old selector. In the real browser, each fails with
Selenium's NoSuchElementException: zero of five pass.
"""
speech = """
Second demo: the designers rename the apply button. [[slnc 400]] Five coupon tests each used the old name. [[slnc 600]]
The browser cannot find the button. [[slnc 300]] Zero of five pass.
"""
rows = { test = "active wrong", page = "active amber" }
console = [
    ["0 of 5 pass", "bad"],
    ["NoSuchElementException", "muted"],
]

[[act]]
title = "A Page Object"
summary = "CheckoutPage holds the selectors and waits with WebDriverWait: one selector changed, 5 of 5 pass, and the total is 45.00."
detail = """
Now CheckoutPage is the only class that knows the page. Its applyCoupon types
the code, clicks the button, and waits with WebDriverWait until the status
text appears. After the rename, one selector was changed in that class, and
all five tests pass, each reading a total of 45.00.
"""
speech = """
Third demo: a page object. [[slnc 400]] One class, checkout page, knows the page's elements, and waits for the page. [[slnc 600]]
Its apply coupon method clicks, then waits until the page has answered. [[slnc 500]]
After the rename, one line in that class changed. [[slnc 300]] All five tests pass. [[slnc 300]] The total, forty-five.
"""
rows = { test = "active ok", pageobject = "active ok", page = "active ok" }
console = [
    ["5 of 5 pass", "ok"],
    ["applyCoupon(SAVE10).total(): 45.00", "ok"],
]

[[act]]
title = "Return the next page"
summary = "checkout.placeOrder() returns a ConfirmationPage, which shows ORD-1042 and \"Thank you for your order\"."
detail = """
Placing the order moves the real browser to the confirmation page, and
placeOrder returns its page object, ConfirmationPage, which waits for it and
shows order ORD-1042 with the thank-you message.
"""
speech = """
Fourth demo: an action that moves to a new page returns that page. [[slnc 400]] Place order returns the confirmation page. [[slnc 600]]
It shows the order number, O R D ten forty-two. [[slnc 300]] And, thank you for your order.
"""
rows = { pageobject = "active ok", confirmation = "active ok" }
console = [
    ["placeOrder() -> ConfirmationPage", "ok"],
    ["ORD-1042", "ok"],
]

[[act]]
title = "The bill"
summary = "Every page needs its object; checks stay in the tests; and browser tests are slow, with a real browser and page loads."
detail = """
Every page needs its object, kept in step with the real page, and the checks
stay in the tests: page objects report, tests decide. And real browser tests
are slow: this demo started a browser in a container, and every page load was
real.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] Every page needs its own class, kept in step with the real page. [[slnc 600]]
Page objects report. [[slnc 300]] Tests decide. [[slnc 500]]
And real browser tests are slow. [[slnc 300]] A browser has to start, and every page really loads.
"""
rows = { pageobject = "active amber" }
console = [
    ["one class per page", "amber"],
    ["real browsers are slow", "amber"],
]

[animation]
subtitle = "Tests call page objects, which drive a real Chromium browser on the shop's checkout page."
boxes = [
    ["test", "Checkout test", "speaks shop"],
    ["pageobject", "CheckoutPage", "selectors, waits"],
    ["page", "Chromium", "the real page"],
    ["confirmation", "ConfirmationPage", "order number"],
]

[docs.problem]
scenario = """
Browser tests for the shop's checkout type a coupon, click apply and read the
total, in a real browser.
"""
naive = """
Tests that find elements themselves read too soon and all break when a button
is renamed.
"""
deliver = [
    "A raw test reading a stale total in a real browser.",
    "A renamed button breaking every raw test.",
    "A page object with selectors and WebDriverWait in one place.",
    "Navigation returning the next page object.",
    "The costs, including real browser speed.",
    "Every printed result asserted by a test, skipped without Docker.",
]

[docs.prerequisites]
required = [
    "Java basics.",
    "HTML elements and ids.",
    "The Page Object idea, ideally from the plain Java version of this pattern.",
]
not_required = [
    "A browser installed locally. It runs in a container.",
]
install = [
    "A running container runtime such as Docker Desktop. The demo starts and removes the browser itself.",
]

[docs.dependencies]
intro = """
This project uses Selenium and a real Chromium browser in a container, which
the plain Java version of Page Object does not. Skipping it loses none of the
pattern: the plain version teaches all of it with nothing installed.
"""
what = [
    ["Selenium WebDriver", "Selenium drives a real browser from code. A WebDriver is one browser session; RemoteWebDriver talks to a browser in another process, here in a container. findElement with By.id finds an element and throws NoSuchElementException if it is missing. click and sendKeys act on it. WebDriverWait waits, up to a limit, for a condition such as some text appearing."],
    ["The browser container", "The selenium/standalone-chromium image runs Chromium with a WebDriver server on port 4444. Testcontainers starts it and lets it reach the shop's pages running on this machine."],
]
why = """
The plain version uses a pretend browser. This version shows the real thing,
where timing and missing elements are real, and why page objects are the
standard answer.
"""
versions = [
    ["Java", "21"],
    ["Docker", "running; 24 or later"],
    ["Browser image", "selenium/standalone-chromium:152.0"],
    ["Selenium", "4.49.0"],
    ["Testcontainers", "2.0.5"],
]
costs = [
    "A large browser image to download, and slow test runs.",
    "Page objects to maintain as the pages change.",
]

[docs.session]
objectives = [
    "Drive a real browser with Selenium WebDriver.",
    "Write a page object with selectors and waits.",
    "Wait for a real condition instead of a fixed pause.",
    "Return the next page object from navigation.",
]
walkthrough = """
Run `./gradlew run` with Docker running. Compare act one's 50.00 with act
three's 45.00. Open `CheckoutPage`: the APPLY constant and the WebDriverWait.
End on act two's 0 of 5 against act three's 5 of 5.
"""
exercises = [
    "Add a removeCoupon method and a test for it.",
    "Take a screenshot when a test fails.",
    "Run the same page objects against Firefox with the standalone-firefox image.",
]

[docs.explained]
sentence = """
With Selenium, a page object wraps a real page's selectors and waits in one
class, so browser tests speak in shop terms.
"""
verdict = """
Use page objects for every browser test suite that shares pages. Keep
selectors and waits inside them, wait for real conditions, return the next
page from navigation, and keep the checks in the tests.
"""
recognise = [
    "Classes named ...Page holding By selectors.",
    "WebDriverWait inside page methods, not in tests.",
    "Methods that return another page object after a click.",
]

[spec]
purpose = """
Teach Page Object with Selenium: a raw test reading a stale total in a real
browser, a renamed button breaking raw tests, a page object with waits, and
navigation returning the next page.
"""
nongoals = [
    "Not a test framework or grid. One browser session, driven by the demo.",
]
problem = """
Browser tests that find elements and handle timing themselves are fragile and
break together.
"""
roles = [
    ["The page objects", "`CheckoutPage`, `ConfirmationPage`"],
    ["The browser in a container", "`Browser`"],
    ["The shop's pages", "`ShopSite`"],
    ["Entry point", "`SeleniumPageObjectDemo`, five acts"],
]
requirements = [
    "**One place:** only CheckoutPage names checkout selectors.",
    "**Waits:** applyCoupon returns after the page answers.",
    "**Navigation:** placeOrder returns ConfirmationPage.",
    "**No Docker, no crash:** without a runtime the demo prints advice.",
]

