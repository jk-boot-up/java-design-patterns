after = { code = "checkout.applyCoupon(\"SAVE10\")", note = "one change, 5 of 5 pass", tag = "AFTER" }
taglines = [["A real browser, tests in shop terms", "gold"]]

[[scene]]
key = "01-poster"
kind = "poster"
title = "Page Object with Selenium"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Page Object pattern, with Selenium, in a real browser. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] A page object is a class for one page of a web application. [[slnc 300]] It knows how to find the page's boxes and buttons, and how long the page takes to answer. [[slnc 300]] So tests only say what a shopper does. [[slnc 500]] Selenium is the open-source tool that drives a real web browser from code. [[slnc 600]]
Think of a hotel guest asking the concierge for a taxi. [[slnc 300]] The concierge knows the number, and when the line is busy. [[slnc 700]]
In this video, the domain is an online shop's checkout page, tested in a real Chromium browser. [[slnc 500]]
By the end, you will hear why tests that find buttons themselves are fragile. [[slnc 300]] How one class fixes a renamed button for every test. [[slnc 300]] And how it waits for the page.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["Browser tests for checkout.", "", "Each test found the elements", "itself and read the total", "straight away.", "", "Then a button was renamed."]
narration = """
Here is the scenario. [[slnc 400]] The shop has browser tests for its checkout page. [[slnc 500]]
Each test found the coupon box and the apply button itself. [[slnc 300]] And read the total straight away. [[slnc 500]]
Then the designers renamed the button.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern, with Selenium"
body = ["One class per page.", "", "It holds the selectors,", "and waits with WebDriverWait.", "", "Tests speak in shop terms."]
narration = """
Let's name the pattern, with Selenium. [[slnc 400]] One class for each page. [[slnc 500]]
It holds the page's selectors, and waits for the page with Selenium's wait. [[slnc 500]]
And tests call its methods, in the shop's own words.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["CheckoutPage: apply coupon, total", "ConfirmationPage: the order number", "Browser: Chromium in a container", "ShopSite: the real pages"]
narration = """
Here is who does what. [[slnc 400]] Checkout page applies coupons, reads the total, and places the order. [[slnc 500]]
Confirmation page shows the order number. [[slnc 500]]
The browser class runs Chromium in a container. [[slnc 300]] And the shop site serves the real pages.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Selenium page objects", "Playwright and Cypress page classes", "The Screenplay pattern"]
narration = """
You have probably met this already. [[slnc 400]] Selenium's own guides recommend page objects. [[slnc 500]]
Playwright and Cypress projects use page classes too. [[slnc 500]]
And the Screenplay pattern is a later refinement of the same idea.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Several browser tests share a page.", "", "Selectors and waits inside.", "Real conditions, not pauses.", "Checks stay in tests."]
narration = """
So, when should you use it? [[slnc 400]] Whenever several browser tests share a page. [[slnc 500]]
Keep selectors and waits inside the page object. [[slnc 300]] Wait for real conditions, never fixed pauses. [[slnc 300]] And keep the checks in the tests.
"""

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Try it", "in Firefox."]
narration = """
That's the Page Object, with Selenium. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Tests say what the shopper does, and one class knows how, and when. [[slnc 500]]
The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It needs Docker running, and starts the browser for you. [[slnc 500]]
Here is one exercise to try. [[slnc 300]] Run the same page objects in Firefox. [[slnc 500]]
If this helped, a like really does help other people find it. [[slnc 300]] And subscribe, if you'd like the rest of the series. [[slnc 400]] Thanks for watching.
"""
