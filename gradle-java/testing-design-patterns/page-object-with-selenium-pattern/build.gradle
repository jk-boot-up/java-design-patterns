plugins {
    id 'java'
    id 'application'
}

group = 'com.jk.explore'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Selenium 4.49.0, the newest release: WebDriver, the standard way to drive a real browser from code.
    implementation 'org.seleniumhq.selenium:selenium-java:4.49.0'

    // Testcontainers 2.0.5 starts and stops a real Chromium browser in a container for the demo itself.
    implementation 'org.testcontainers:testcontainers:2.0.5'

    // The libraries log through SLF4J; the simple binding is switched off.
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.17'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.jk.explore.pageobjectselenium.SeleniumPageObjectDemo'
}

test {
    useJUnitPlatform()
}
