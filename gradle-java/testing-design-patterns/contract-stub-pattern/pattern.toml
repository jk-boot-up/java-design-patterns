[poster]
headline = [["CONTRACT", "text"], ["STUB", "text"]]
before = { code = "new HandWrittenStub()", note = "tests green, production broken", tag = "BEFORE" }
after = { code = "new ContractStub(contract)", note = "drift fails the build", tag = "AFTER" }
taglines = [["A stub that cannot lie", "gold"]]

[[scene]]
key = "01-poster"
kind = "poster"
title = "Contract Stub"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Contract Stub pattern, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] A stub is a stand-in for another service, used in tests. [[slnc 300]] A contract stub is made from a written agreement between the two teams. [[slnc 300]] And the real service is checked against that same agreement. [[slnc 300]] So the stub and the real service can never quietly drift apart. [[slnc 600]]
Think of a fire drill. [[slnc 300]] If it used an old floor plan, everyone would practise walking to an exit that has since been bricked up. [[slnc 300]] A contract stub is a drill always run from the current plan. [[slnc 700]]
In this video, the domain is an online shop's checkout, which calls a payment service run by another team. [[slnc 500]]
By the end, you will hear how a hand-written stub let a bug reach production. [[slnc 300]] How a contract feeds both the stub and a check of the real service. [[slnc 300]] Why a strict stub helps. [[slnc 300]] And what the contract costs.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["Checkout calls the payment service.", "", "Tests used a hand-written stub.", "", "Payments renamed a field.", "Tests stayed green."]
narration = """
Here is the scenario. [[slnc 400]] The shop's checkout calls a payment service, run by another team. [[slnc 500]]
Checkout's tests used a stub the checkout team had written by hand. [[slnc 500]]
The payment team renamed a field in its reply. [[slnc 300]] The tests stayed green. [[slnc 300]] And production broke.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["Write the contract down.", "", "Consumer: test against a stub", "made from it.", "", "Provider: check against it."]
narration = """
Let's name the pattern. [[slnc 400]] Write the contract down, as requests and the replies they get. [[slnc 500]]
The consumer tests against a stub made from that contract. [[slnc 500]]
The provider's build checks the real service against the same contract.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["Contract: the agreed interactions", "ContractStub: answers from it", "ProviderVerifier: checks the real service", "Checkout: the consumer"]
narration = """
Here is who does what. [[slnc 400]] The contract holds the agreed interactions. [[slnc 500]]
The contract stub answers checkout's tests from it, and refuses anything else. [[slnc 500]]
The provider verifier replays it against the real payment service. [[slnc 300]] And checkout is the consumer being tested.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Spring Cloud Contract", "Pact", "OpenAPI mock servers"]
narration = """
You have probably met this pattern already. [[slnc 400]] Spring Cloud Contract turns contracts into stubs, and tests for the provider. [[slnc 500]]
Pact does the same, starting from the consumer's tests. [[slnc 500]]
And mock servers built from an interface description work the same way.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Separate teams, separate releases.", "", "Share and version the contract.", "Run it in both builds.", "A refusal means: talk."]
narration = """
So, when should you use it? [[slnc 400]] When separate teams release their services separately. [[slnc 500]]
Share and version the contract. [[slnc 300]] Run it in both builds. [[slnc 300]] And when the stub refuses a request, treat it as a prompt to talk to the other team.
"""

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a US dollar", "interaction to the contract."]
narration = """
That's the Contract Stub pattern. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Build the stub and check the real service from the same contract. [[slnc 500]]
The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs offline, with nothing installed except a Java development kit. [[slnc 500]]
Here is one exercise to try. [[slnc 300]] Add a US dollar interaction to the contract, and make both sides pass. [[slnc 500]]
If this helped, a like really does help other people find it. [[slnc 300]] And subscribe, if you'd like the rest of the series. [[slnc 400]] Thanks for watching.
"""
