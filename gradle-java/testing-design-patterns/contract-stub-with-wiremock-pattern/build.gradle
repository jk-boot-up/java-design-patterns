plugins {
    id 'java'
    id 'application'
}

group = 'com.jk.explore'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // WireMock 3.13.2, the newest generally available release: a real HTTP stub server, the same one
    // Spring Cloud Contract generates its stubs for. The standalone jar brings its own libraries.
    implementation 'org.wiremock:wiremock-standalone:3.13.2'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.jk.explore.contractwiremock.WireMockContractStubDemo'
}

test {
    useJUnitPlatform()
}
