# pattern.toml for the Contract Stub with WireMock project. See tools/patternkit.

[project]
slug = "contract-stub-with-wiremock"
category = "testing-design-patterns"
title = "Contract Stub with WireMock"
package = "contractwiremock"
main_class = "WireMockContractStubDemo"
tagline = "One contract file, a real stub server"
bold = "Build a real WireMock stub server from a shared contract file for checkout's tests, and replay the same file against the real payment service over HTTP, so the stub and the service can never quietly drift apart."
domain_note = ""
thumb_lines = ["CONTRACT STUB", "WITH WIREMOCK"]
thumb_code = "stubFor(post(...).withRequestBody(...))"
youtube_title = "Contract Stub with WireMock"
youtube_tags = ["contract stub", "wiremock", "contract testing", "spring cloud contract", "http stubs", "java"]

[readme]
intro = """
This is the real-tool version of the Contract Stub pattern. The plain Java
version, a separate project in this category, keeps its stub and its checks
in memory. Here everything goes over HTTP: the stub is a real WireMock server,
the payment service is a real HTTP service, and checkout calls whichever
address it is given.

One contract file, `contracts/payments.json`, lists three interactions: a
request and the reply it gets. A WireMock stub is built from it, one stub per
interaction, matched on the request body, and it answers 404 to anything
else. The same file is replayed against the real payment service by the
provider's verifier. This is exactly the flow Spring Cloud Contract automates:
it turns contracts into WireMock stubs for consumers and into tests for
providers; doing the two halves by hand here keeps every step visible.
"""
analogy = """
Think of a fire drill run from the building's current floor plan. The drill
is only useful if the plan matches the building, so the builders must update
the plan whenever they move a wall. One plan, used by both the drill and the
builders.
"""
scenario = """
The online store's checkout team tested against a stub of the payment service
they had written themselves. The payment team renamed a field in their reply,
the checkout tests stayed green because the stub never changed, and in
production every payment left the order stuck.
"""
test_note = """
Every result the demo prints is asserted, with real WireMock stub servers
and a real payment service on local ports, called over HTTP.
"""
run_note = """
Nothing to install beyond a Java 21 JDK: WireMock and the payment service run
inside the program, on local ports.
"""
twin = """
The plain Java version got the idea right: one contract feeds both the stub
and a check of the real service, a renamed field fails the provider's build,
and a strict stub refuses what the contract does not list. What it left out is
the real mechanics. Here the contract is a file both teams share, the stub is
a real HTTP server matching request bodies as JSON, and the refusal is
WireMock's own 404, "Request was not matched", with a report of the closest
stub. Spring Cloud Contract does this same flow for you, generating the
WireMock stubs and the provider tests from contracts.
"""
technologies = [
    ["WireMock", "3.13.2 (standalone)", "the stub server, built from the contract"],
    ["JDK HttpServer and HttpClient", "Java 21", "the payment service, checkout and the verifier"],
]
costs = [
    "**Shared work.** Both teams must share and version the contract file, and run it in both builds.",
    "**Only what is listed.** The contract covers its interactions, not speed or the real network.",
    "**Strict on purpose.** A charge in US dollars got 404 from the stub until the teams agree an interaction for it.",
]
too_much = """
When one team owns both sides and deploys them together, an integration test
against the real service is simpler. Contract stubs pay off when separate
teams release separately.
"""
met_before = [
    "Spring Cloud Contract, which generates WireMock stubs and provider tests from contracts.",
    "Pact, whose consumer tests write the contract the provider verifies.",
    "WireMock mappings kept in a repository shared by two teams.",
]
where = """
This project is in [testing-design-patterns](..). It is the real-tool version
of the plain Java Contract Stub project in the same category, which is left
unchanged.
"""

[[act]]
title = "A stub that drifted"
summary = "Against the hand-written WireMock stub, checkout confirms the order; against payment service version 2, the order is stuck."
detail = """
The checkout team's hand-written WireMock stub approves any charge with a
"result" field. The checkout test confirms the order. But payment service
version 2 renamed "result" to "outcome", and in production checkout finds no
result in the reply: the order is stuck. The stub never knew.
"""
speech = """
First demo: a hand-written stub. [[slnc 400]] The checkout team's stub approves every charge. [[slnc 300]] The checkout test passes. [[slnc 600]]
But the payment team released version two. [[slnc 300]] It renamed the result field. [[slnc 500]]
In production, checkout cannot find the result. [[slnc 300]] The order is stuck. [[slnc 300]] The stub never knew.
"""
rows = { hand = "active wrong", payments = "active amber", checkout = "active wrong" }
console = [
    ["test vs hand stub: order confirmed", "ok"],
    ["production vs v2: order stuck", "bad"],
]

[[act]]
title = "A stub from the contract"
summary = "A WireMock stub built from contracts/payments.json's 3 interactions gives: confirmed, declined for no funds, rejected for a zero amount."
detail = """
The two teams keep one contract file with three interactions. A WireMock stub
is built from it, one stub per interaction, matching the request body as JSON.
Checkout's tests get exactly the agreed replies: confirmed, declined for no
funds, rejected for a zero amount.
"""
speech = """
Second demo: a stub built from the contract. [[slnc 400]] The two teams share one file, with three agreed interactions. [[slnc 600]]
A stub server is built from it. [[slnc 500]]
A normal card is confirmed. [[slnc 300]] A card with no funds is declined. [[slnc 300]] A zero amount is rejected.
"""
rows = { contract = "active ok", stub = "active ok", checkout = "active ok" }
console = [
    ["normal card: confirmed", "ok"],
    ["no funds: declined", "ok"],
    ["zero amount: rejected", "ok"],
]

[[act]]
title = "The provider is checked too"
summary = "Replayed over HTTP against version 1, 3 of 3 interactions match; against version 2, 0 of 3, failing the payment team's build."
detail = """
The payment team's build replays the same three interactions against the real
service over HTTP. Version 1 matches all three. Version 2, with its rename,
matches none, so the payment team's own build fails before the change is
released.
"""
speech = """
Third demo: the real payment service is checked against the same file. [[slnc 400]] Every interaction is sent to it, over HTTP. [[slnc 600]]
Version one matches, three of three. [[slnc 500]]
Version two matches none. [[slnc 300]] The payment team's own build fails, before the change reaches anyone.
"""
rows = { contract = "active ok", payments = "active ok" }
console = [
    ["version 1: 3 of 3", "ok"],
    ["version 2: 0 of 3, build fails", "amber"],
]

[[act]]
title = "A strict stub"
summary = "A charge in USD: the hand-written stub confirms it; the contract stub answers 404, Request was not matched."
detail = """
Checkout starts charging in US dollars. The hand-written stub confirms it,
although nobody asked the payment team. The contract stub answers WireMock's
404, "Request was not matched", and reports the closest stub it had, so the
difference is easy to see.
"""
speech = """
Fourth demo: the contract stub is strict. [[slnc 400]] Checkout starts charging in US dollars. [[slnc 600]]
The hand-written stub confirms it. [[slnc 300]] Nobody asked the payment team. [[slnc 500]]
The contract stub answers, request was not matched. [[slnc 300]] And it shows the closest request it knows.
"""
rows = { stub = "active ok", hand = "active wrong" }
console = [
    ["hand stub, USD: confirmed", "bad"],
    ["contract stub, USD: 404 not matched", "ok"],
]

[[act]]
title = "The bill"
summary = "The contract file is shared work, run in both builds; it covers only listed interactions; Spring Cloud Contract automates this flow."
detail = """
The contract file is shared work: both teams must keep it, version it and run
it in both builds. It covers only the interactions written in it, not speed
or the real network. Spring Cloud Contract automates exactly this flow,
generating the WireMock stubs and the provider tests from contracts.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] The contract is shared work. [[slnc 300]] Both teams keep it, version it, and run it in both builds. [[slnc 600]]
It covers only what is written in it. [[slnc 500]]
And tools such as Spring Cloud Contract automate exactly this. [[slnc 300]] They generate the stubs, and the provider's tests, from the contracts.
"""
rows = { contract = "active amber" }
console = [
    ["shared, versioned, run by both", "amber"],
]

[animation]
subtitle = "One contract file builds checkout's WireMock stub and checks the real payment service."
boxes = [
    ["contract", "payments.json", "3 interactions"],
    ["stub", "WireMock stub", "from the contract"],
    ["hand", "Hand-written stub", "approves anything"],
    ["checkout", "Checkout", "the consumer"],
    ["payments", "Payment service", "the provider"],
]

[docs.problem]
scenario = """
Checkout's tests use a stub of the payment service, which another team
releases independently.
"""
naive = """
A hand-written stub keeps the old behaviour after the real service changes.
"""
deliver = [
    "A hand-written WireMock stub drifting from the real service.",
    "A WireMock stub built from a shared contract file.",
    "The real service verified against the same file.",
    "A strict stub answering 404 for an unlisted request.",
    "The shared cost, and where Spring Cloud Contract fits.",
    "Every printed result asserted by a test.",
]

[docs.prerequisites]
required = [
    "Java basics.",
    "HTTP requests, JSON and status codes.",
    "The Contract Stub idea, ideally from the plain Java version of this pattern.",
]
not_required = [
    "Earlier WireMock experience. The dependencies page explains what is used.",
]

[docs.dependencies]
intro = """
This project uses WireMock, which the plain Java version of Contract Stub does
not. Skipping it loses none of the pattern: the plain version teaches all of
it with nothing installed.
"""
what = [
    ["WireMock", "WireMock is an HTTP server for tests that answers from stubs. stubFor registers a stub: here, post to a URL with a request body equal to some JSON returns a given reply. equalToJson compares bodies as JSON, not as text. A request that matches no stub gets 404, Request was not matched, with a report of the nearest stub. The standalone jar bundles its own libraries."],
    ["Spring Cloud Contract", "Spring Cloud Contract takes contracts, written in Groovy, YAML or Java, and generates two things: WireMock stubs for consumers, and tests that check the provider. This project does both halves by hand from one JSON file, so every step can be read."],
]
why = """
The plain version keeps everything in memory. This version shows the real
pieces: a stub server over HTTP, a shared file, and a verifier replaying it.
"""
install_note = "Only a JDK, version 21. Gradle downloads the rest, and the version is pinned:"
versions = [
    ["Java", "21"],
    ["WireMock (standalone)", "3.13.2"],
]
costs = [
    "A contract file both teams must maintain.",
]

[docs.session]
objectives = [
    "Build a WireMock stub from a contract file.",
    "Replay the same file against the real service.",
    "Explain why a strict stub helps.",
    "Describe how Spring Cloud Contract automates the flow.",
]
walkthrough = """
Run `./gradlew run`. Open `contracts/payments.json`, then `ContractStub.fromContract`
and `ProviderVerifier`: both read the same file. End on act four's 404.
"""
exercises = [
    "Add a USD interaction to the contract and make both sides pass.",
    "Record a real service's replies with WireMock's recorder and compare.",
    "Rewrite the contract as a Spring Cloud Contract YAML file.",
]

[docs.explained]
sentence = """
With WireMock, a contract stub is a real HTTP stub server built from a shared
contract file that the real service is also checked against.
"""
verdict = """
Use contract stubs when separate teams release separately. Keep the contract
in a shared, versioned place, build stubs from it, verify providers against
it, and let a tool such as Spring Cloud Contract generate both halves.
"""
recognise = [
    "`WireMock.stubFor(post(...).withRequestBody(equalToJson(...)))`.",
    "Shared contract files in a repository both teams build.",
    "`Request was not matched` in a failing test's output.",
]

[spec]
purpose = """
Teach Contract Stub with WireMock: a hand-written stub drifting, a WireMock
stub built from a contract file, the provider verified against the same file,
a strict 404 for unlisted requests, and the shared cost.
"""
nongoals = [
    "Not Spring Cloud Contract's code generation. Both halves are done by hand.",
]
problem = """
A hand-written stub keeps old behaviour after the real service changes.
"""
roles = [
    ["The contract", "`Contract`, `contracts/payments.json`"],
    ["The stubs", "`ContractStub`"],
    ["The provider check", "`ProviderVerifier`"],
    ["The consumer and provider", "`Checkout`, `PaymentService`"],
    ["Entry point", "`WireMockContractStubDemo`, five acts"],
]
requirements = [
    "**One file:** stub and verifier read the same contract.",
    "**Strict:** unlisted requests get 404.",
    "**Caught:** a renamed field fails verification.",
    "**Every printed result is asserted** in `DemoRunsTest`.",
]

