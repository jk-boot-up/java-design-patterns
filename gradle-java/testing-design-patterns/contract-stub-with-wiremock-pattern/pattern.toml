[poster]
headline = [["CONTRACT STUB", "text"], ["WITH WIREMOCK", "text"]]
before = { code = "post(anyUrl()) -> APPROVED", note = "tests green, production stuck", tag = "BEFORE" }
after = { code = "stubs built from payments.json", note = "drift fails the build", tag = "AFTER" }
taglines = [["One contract, a real stub server", "gold"]]

[[scene]]
key = "01-poster"
kind = "poster"
title = "Contract Stub with WireMock"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Contract Stub pattern, with WireMock, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] A contract stub is a stand-in for another service, built from a written agreement between two teams. [[slnc 300]] The real service is checked against the same agreement. [[slnc 300]] So the two can never quietly drift apart. [[slnc 500]] WireMock is an open-source stub server that answers real web requests. [[slnc 600]]
Think of a fire drill run from the building's current floor plan. [[slnc 300]] The builders must update the plan whenever they move a wall. [[slnc 700]]
In this video, the domain is an online shop's checkout, calling a payment service run by another team. [[slnc 500]]
By the end, you will hear how a hand-written stub let a bug through. [[slnc 300]] How one contract file builds the stub and checks the real service. [[slnc 300]] And where Spring Cloud Contract fits.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["Checkout calls payments.", "", "Its tests used a hand-written stub.", "", "Payments renamed a field.", "Tests stayed green."]
narration = """
Here is the scenario. [[slnc 400]] The shop's checkout calls a payment service, run by another team. [[slnc 500]]
Checkout's tests used a stub its own team had written. [[slnc 500]]
The payment team renamed a field. [[slnc 300]] The tests stayed green. [[slnc 300]] Production broke.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern, with WireMock"
body = ["One shared contract file.", "", "Consumer: a WireMock stub", "built from it.", "", "Provider: replay it over HTTP."]
narration = """
Let's name the pattern, with WireMock. [[slnc 400]] One shared contract file. [[slnc 500]]
The consumer tests against a WireMock stub, built from that file. [[slnc 500]]
And the provider's build replays the same file against the real service.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["payments.json: the contract", "ContractStub: WireMock from it", "ProviderVerifier: checks the service", "Checkout: the consumer"]
narration = """
Here is who does what. [[slnc 400]] The contract file lists the agreed interactions. [[slnc 500]]
The contract stub builds a WireMock server from it. [[slnc 500]]
The provider verifier replays it against the real payment service. [[slnc 300]] And checkout is the consumer.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Spring Cloud Contract", "Pact", "Shared WireMock mappings"]
narration = """
You have probably met this already. [[slnc 400]] Spring Cloud Contract generates WireMock stubs and provider tests from contracts. [[slnc 500]]
Pact does the same, starting from the consumer's tests. [[slnc 500]]
And teams often share WireMock mapping files in a repository.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Separate teams, separate releases.", "", "Share and version the contract.", "Run it in both builds.", "Let a tool generate both halves."]
narration = """
So, when should you use it? [[slnc 400]] When separate teams release their services separately. [[slnc 500]]
Share and version the contract. [[slnc 300]] Run it in both builds. [[slnc 300]] And let a tool generate both halves when the contracts grow.
"""

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a", "USD interaction."]
narration = """
That's the Contract Stub, with WireMock. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Build the stub and check the real service from the same contract. [[slnc 500]]
The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs offline, with nothing installed except a Java development kit. [[slnc 500]]
Here is one exercise to try. [[slnc 300]] Add a US dollar interaction to the contract, and make both sides pass. [[slnc 500]]
If this helped, a like really does help other people find it. [[slnc 300]] And subscribe, if you'd like the rest of the series. [[slnc 400]] Thanks for watching.
"""
