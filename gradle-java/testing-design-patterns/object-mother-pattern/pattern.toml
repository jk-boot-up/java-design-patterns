taglines = [["Test data, made easy", "gold"]]

[[scene]]
key = "01-poster"
kind = "poster"
title = "Object Mother / Test Data Builder"
narration = """
Hello, and welcome. [[slnc 400]] This video explains two testing patterns, the Object Mother and the Test Data Builder, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] Both help tests create the objects they need. [[slnc 300]] An Object Mother is a class of ready-made objects, each with a clear name. [[slnc 300]] A Test Data Builder starts from sensible defaults, and each test changes only the details it cares about. [[slnc 600]]
Think of a restaurant kitchen. [[slnc 300]] The chef keeps a shelf of ready-made sauces and stocks. [[slnc 300]] That shelf is the Object Mother. [[slnc 300]] And when a customer asks for the usual, but no onions, the cook starts from the usual and changes just that. [[slnc 300]] That is the builder. [[slnc 700]]
In this video, the domain is an online shop's shipping rules, and the tests that check them. [[slnc 500]]
By the end, you will hear why hand-built test data hurts. [[slnc 300]] How a mother helps, and where it stops helping. [[slnc 300]] How a builder handles every mix. [[slnc 300]] And the trap of hidden defaults.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["Many small tests check shipping.", "", "Each builds an order by hand:", "3 constructors, 8 values.", "", "Which values matter?"]
narration = """
Here is the scenario. [[slnc 400]] The shop's shipping rules are checked by many small tests. [[slnc 500]]
Each test built its order by hand. [[slnc 300]] Three constructors, and eight values. [[slnc 500]]
Nobody reading the test could tell which of those values mattered.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["Object Mother:", "named, ready-made objects.", "", "Test Data Builder:", "defaults, plus what the test", "cares about."]
narration = """
Let's name the patterns. [[slnc 400]] An Object Mother hands out named, ready-made objects. [[slnc 300]] Good for a few well-known cases. [[slnc 500]]
A Test Data Builder starts from defaults. [[slnc 300]] Each test states only the details it cares about. [[slnc 300]] Good for any mix.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["TestOrders: the mother", "OrderBuilder: the builder", "ShippingRules: the code under test", "Order: needs 8 values to exist"]
narration = """
Here is who does what. [[slnc 400]] Test orders is the mother, with methods like domestic, VIP and international. [[slnc 500]]
The order builder starts with a UK order of one mug, and has a method for each detail. [[slnc 500]]
Shipping rules is the code being tested. [[slnc 300]] And the order is the object that needs eight values to exist.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Test fixture classes", "Lombok @Builder in tests", "Instancio", "factory_bot, factory_boy"]
narration = """
You have probably met these patterns already. [[slnc 400]] Many projects have a fixtures class in their test folder. [[slnc 500]]
Lombok can generate builders. [[slnc 300]] And libraries such as Instancio fill objects with data. [[slnc 500]]
Ruby's factory bot, and Python's factory boy, are the same idea.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Objects need many values.", "", "Mother: a few named cases.", "Builder: many mixes.", "Keep defaults dull.", "State what you rely on."]
narration = """
So, when should you use them? [[slnc 400]] When objects need many values, and many tests need slightly different versions. [[slnc 500]]
Use a mother for a few named cases. [[slnc 300]] A builder for many mixes. [[slnc 300]] Keep the defaults dull. [[slnc 300]] And let every test state what it relies on.
"""

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Make the mother", "return builders."]
narration = """
That's the Object Mother and the Test Data Builder. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A test should only show the details it depends on. [[slnc 500]]
The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs offline, with nothing installed except a Java development kit. [[slnc 500]]
Here is one exercise to try. [[slnc 300]] Make the mother's methods return builders, so the two patterns work together. [[slnc 500]]
If this helped, a like really does help other people find it. [[slnc 300]] And subscribe, if you'd like the rest of the series. [[slnc 400]] Thanks for watching.
"""
