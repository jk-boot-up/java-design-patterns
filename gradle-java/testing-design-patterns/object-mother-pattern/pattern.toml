]

[docs.session]
objectives = [
    "Spot test setup that hides what a test is about.",
    "Write an Object Mother of named test objects.",
    "Write a Test Data Builder with safe defaults.",
    "Keep every detail a test depends on inside the test.",
]
walkthrough = """
Run `./gradlew run` and compare act one's hand-built order with act four's
one-liners. Open `ShippingRulesTest`: each test reads as a sentence. End on
act five's hidden default.
"""
exercises = [
    "Add `withLines(...)` to the builder and test an order of three products.",
    "Make `TestOrders` methods return builders, so mothers and builders combine.",
    "Add a required `phone` field to `Customer` and count the files you must change.",
]

[docs.explained]
sentence = """
An Object Mother hands tests named, ready-made objects; a Test Data Builder
starts from defaults and lets each test state only what it cares about.
"""
verdict = """
Use a mother for a few well-known, named cases, and a builder when tests need
many mixes. Keep defaults dull and valid, and let each test name every value
its assertion depends on.
"""
recognise = [
    "Classes named `TestOrders`, `Fixtures` or `...Mother` in `src/test`.",
    "Static methods such as `anOrder()` or `aCustomer()` returning builders.",
    "Tests that read as a sentence: `anOrder().vip().shippedTo(\"FR\")`.",
]

[spec]
purpose = """
Teach Object Mother and Test Data Builder with an online store's shipping-rule
tests: hand-built orders hiding what matters, a mother of named orders, the
mother's explosion of combinations, a builder with defaults, and the trap of
tests relying on hidden defaults.
"""
nongoals = [
    "Not a test-data library. The mother and builder are hand-written.",
]
problem = """
Tests that build complex objects by hand are long, hide their intent, and
break together whenever a constructor changes.
"""
roles = [
    ["The Object Mother", "`TestOrders`"],
    ["The Test Data Builder", "`OrderBuilder`"],
    ["The code under test", "`ShippingRules`"],
    ["The objects", "`Order`, `Customer`, `Line`"],
    ["Entry point", "`ObjectMotherDemo`, five acts"],
]
requirements = [
    "**Named:** mother methods say what kind of order they return.",
    "**Defaults:** `anOrder().build()` is valid with no other calls.",
    "**Explicit:** `ShippingRulesTest` names every value each assertion relies on.",
    "**Every printed result is asserted** in `DemoRunsTest`.",
]

