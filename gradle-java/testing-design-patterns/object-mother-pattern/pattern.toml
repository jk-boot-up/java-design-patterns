# pattern.toml for the Object Mother / Test Data Builder project. See tools/patternkit.

[project]
slug = "object-mother"
category = "testing-design-patterns"
title = "Object Mother / Test Data Builder"
package = "objectmother"
main_class = "ObjectMotherDemo"
tagline = "Test data, made easy"
bold = "Give tests ready-made, named test objects (an Object Mother), or a builder with sensible defaults where each test states only the details it cares about (a Test Data Builder)."
domain_note = ""
thumb_lines = ["OBJECT MOTHER", "TEST DATA BUILDER"]
thumb_code = "anOrder().vip().build()"
youtube_title = "Object Mother and Test Data Builder"
youtube_tags = ["object mother", "test data builder", "unit testing", "junit", "test fixtures", "java"]

[readme]
intro = """
Object Mother and Test Data Builder are two patterns for creating the objects
tests need. Real objects often demand many values before they can exist: an
order needs a customer, a country, lines, and options. When every test builds
them by hand, the tests are long, the important detail is lost among the
unimportant ones, and one new constructor argument breaks every test.

An **Object Mother** is a class of named, ready-made objects:
`TestOrders.vip()`, `TestOrders.international()`. A **Test Data Builder**
starts from sensible defaults and lets each test change only what it cares
about: `anOrder().vip().shippedTo("FR").build()`. Many teams use both.
"""
analogy = """
Think of a restaurant kitchen. The chef does not start every dish from a
raw sack of flour; there is a shelf of ready-made bases, stocks and sauces.
That shelf is the Object Mother. But when a customer asks for "the usual, no
onions, extra cheese", the cook starts from the usual and changes just those
two things. That is the builder.
"""
scenario = """
The online store's shipping rules are tested with many small tests. Each test
built its order by hand: three constructors and eight values, just to check
one rule. Reading a test, nobody could tell which of those eight values
mattered, and when the customer gained a new field, every one of those tests
had to be edited.
"""
costs = [
    "**Hidden defaults.** A test that relied on the builder's default price broke, with no visible reason, when someone changed that default.",
    "**Mothers multiply.** Every mix of details needs its own mother method: three yes-or-no details already mean eight methods.",
    "**More test code to maintain.** The mother and the builder are code too, and must keep up with the domain.",
]
too_much = """
When objects are small, with two or three fields, building them in the test is
clearer than calling a helper. These patterns pay off when objects need many
values and many tests need slightly different versions of them.
"""
met_before = [
    "Builders generated by Lombok's `@Builder`, or written by hand in `src/test`.",
    "Fixture factories such as Instancio or Java Faker helpers.",
    "Ruby's factory_bot and Python's factory_boy, the same idea in other languages.",
]
where = """
This project is in [testing-design-patterns](..), next to
[Test Double](../test-double-pattern), which fakes the objects a test talks
to, where this one builds the objects a test passes in.
"""

[[act]]
title = "Built by hand"
summary = "Each test builds its order with 3 constructors and 8 values to check one rule; the reader cannot tell which values matter."
detail = """
A test for the shipping rules builds an order by hand: a customer with a
name, an email and a VIP flag, a country, a line with a product, a quantity
and a price, and a gift-wrap flag. Three constructors and eight values, to
check that the shipping is 4.99. Which of those eight values does the test
depend on? The reader cannot tell. And when the customer gains a new field,
every test like this must be edited.
"""
speech = """
First demo: every test builds its order by hand. [[slnc 400]] A customer, with a name, an email, and a VIP flag. [[slnc 300]] A country. [[slnc 300]] A product line, with a quantity and a price. [[slnc 300]] And a gift-wrap flag. [[slnc 600]]
Eight values, just to check that shipping costs four ninety-nine. [[slnc 500]]
Which of those eight values matter to this test? [[slnc 300]] The reader cannot tell. [[slnc 500]]
And when the customer gains a new field, every test like this must be edited.
"""
rows = { test = "active wrong", order = "active amber" }
console = [
    ["3 constructors, 8 values", "bad"],
    ["which values matter? unclear", "bad"],
]

[[act]]
title = "An Object Mother"
summary = "TestOrders.domestic(), vip() and international(): shipping 4.99, 0.00 and 15.00, one line per test, and one place to change."
detail = """
An Object Mother collects ready-made orders under names that say what they
are. `TestOrders.domestic()` ships for 4.99, `vip()` ships free and
`international()` pays 15.00. Each test is one line, and when the customer
gains a field, it is added in one place: the mother.
"""
speech = """
Second demo: an Object Mother. [[slnc 400]] It is one class of ready-made orders, each with a name that says what it is. [[slnc 600]]
A domestic order ships for four ninety-nine. [[slnc 300]] A VIP order ships free. [[slnc 300]] An international order pays fifteen. [[slnc 600]]
Each test needs one line to get its order. [[slnc 300]] And a new customer field is added in one place.
"""
rows = { mother = "active ok", test = "active ok" }
console = [
    ["domestic(): 4.99", "ok"],
    ["vip(): 0.00", "ok"],
    ["international(): 15.00", "ok"],
]

[[act]]
title = "The mother multiplies"
summary = "3 yes-or-no details need 8 mother methods to cover every mix, such as vipInternationalGiftWrapped(); one more makes 16."
detail = """
The trouble starts when tests need mixes. VIP or not, abroad or not, gift
wrapped or not: three yes-or-no details make eight combinations, each needing
its own method, like `vipInternationalGiftWrapped()`. One more detail and it
is sixteen.
"""
speech = """
Third demo: the mother multiplies. [[slnc 400]] Tests need mixes. [[slnc 300]] VIP or not. [[slnc 300]] Abroad or not. [[slnc 300]] Gift wrapped or not. [[slnc 600]]
Three yes-or-no details make eight combinations. [[slnc 300]] Each one needs its own method, with a longer and longer name. [[slnc 500]]
Add one more detail, and it is sixteen.
"""
rows = { mother = "active wrong" }
console = [
    ["3 details: 8 methods", "amber"],
    ["4 details: 16 methods", "bad"],
]

[[act]]
title = "A Test Data Builder"
summary = "anOrder().vip().shippedTo(\"FR\").build() pays 15.00; anOrder().vip().giftWrapped().build() pays 2.00: any mix in one line."
detail = """
A Test Data Builder starts from sensible defaults for everything, and has one
method per detail. A VIP order to France is
`anOrder().vip().shippedTo("FR").build()`, and pays 15.00, because free VIP
shipping is UK only. A gift-wrapped VIP order pays 2.00. Any mix fits in one
line, and the line names exactly what the test cares about.
"""
speech = """
Fourth demo: a Test Data Builder. [[slnc 400]] It starts with sensible defaults for everything. [[slnc 300]] And it has one method for each detail. [[slnc 600]]
A test says: an order, VIP, shipped to France. [[slnc 300]] It pays fifteen, because free VIP shipping is only for the United Kingdom. [[slnc 500]]
Another test says: an order, VIP, gift wrapped. [[slnc 300]] It pays two, for the wrapping. [[slnc 600]]
Any mix, in one line. [[slnc 300]] And the line names exactly what the test cares about.
"""
rows = { builder = "active ok", test = "active ok" }
console = [
    ["vip, to FR: 15.00", "ok"],
    ["vip, gift wrapped: 2.00", "ok"],
]

[[act]]
title = "The bill"
summary = "A free-shipping test relied on a default price of 60; when the default fell to 30 it paid 4.99 and failed with no visible reason."
detail = """
A free-shipping test was written as a bare `anOrder().build()`, back when the
default price was 60.00, over the free-shipping line. Someone lowered the
default to 30.00; the order now pays 4.99, and the test fails with no visible
reason. The fix is `anOrder().totalling(60).build()`: a test states everything
it relies on, and defaults stay dull.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] A test leaned on a hidden default. [[slnc 600]]
A free-shipping test just asked for an order. [[slnc 300]] Back then, the default price was sixty. [[slnc 300]] Over the free-shipping line. [[slnc 500]]
Someone lowered the default to thirty. [[slnc 300]] Now the order pays four ninety-nine. [[slnc 300]] And the test fails, with no visible reason. [[slnc 600]]
The fix: the test asks for an order totalling sixty. [[slnc 300]] A test must state everything it relies on.
"""
rows = { builder = "active amber", test = "active wrong" }
console = [
    ["default 60: 0.00", "muted"],
    ["default 30: 4.99, test fails", "bad"],
    ["fix: totalling(60)", "ok"],
]

[animation]
subtitle = "Tests get their orders from a mother or a builder instead of building them by hand."
boxes = [
    ["test", "Shipping test", "checks one rule"],
    ["mother", "Object Mother", "TestOrders.vip()"],
    ["builder", "Test Data Builder", "anOrder()..."],
    ["order", "Order", "3 constructors, 8 values"],
]

