    { id = "u", label = "Signed-in user", sub = "ana, sam, alex", col = 0, row = 0, colour = "client" },
    { id = "e", label = "Endpoints", sub = "view, cancel, refund", col = 1, row = 0, colour = "green" },
    { id = "p", label = "Policy", sub = "rules, deny by default", col = 2, row = 0, colour = "accent" },
    { id = "l", label = "Audit log", sub = "decision and reason", col = 2, row = 1, colour = "amber" },
]
edges = [
    { from = "u", to = "e", label = "" },
    { from = "e", to = "p", label = "decide(request)" },
    { from = "p", to = "l", label = "" },
]

[[diagram]]
name = "class-diagram"
kind = "class"
title = "Authorization Policy — classes"
caption = "Rules over the whole request."
nodes = [
    { id = "p", label = "Policy", sub = ["+ allow(action, why, condition)", "+ decide(request): Decision", "+ auditLog()"], col = 0, row = 0, colour = "accent" },
    { id = "r", label = "«record» Rule", sub = ["action, description", "condition"], col = 1, row = 0, colour = "client" },
    { id = "q", label = "«record» Request", sub = ["user, action", "order, amount"], col = 0, row = 1, colour = "client" },
    { id = "d", label = "«record» Decision", sub = ["allowed, reason"], col = 1, row = 1, colour = "green" },
]
edges = [
    { from = "p", to = "r", label = "holds" },
    { from = "p", to = "q", label = "judges" },
    { from = "p", to = "d", label = "returns" },
]

[[diagram]]
name = "data-flow-diagram"
kind = "flow"
title = "Authorization Policy — a refund decision"
caption = "The first rule that holds allows it; none means deny."
nodes = [
    { id = "a", label = "sam: refund 250", sub = "", col = 0, row = 0, colour = "client" },
    { id = "b", label = "support, up to 100?", sub = "no", col = 1, row = 0, colour = "accent" },
    { id = "c", label = "admin?", sub = "no", col = 2, row = 0, colour = "accent" },
    { id = "d", label = "DENY", sub = "no rule allows it", col = 3, row = 0, colour = "red" },
]
edges = [
    { from = "a", to = "b", label = "" },
    { from = "b", to = "c", label = "" },
    { from = "c", to = "d", label = "" },
]

[[diagram]]
name = "sequence-diagram"
kind = "sequence"
title = "Authorization Policy — viewing an order"
caption = "Ownership is checked in one place."
participants = ["ana", "View endpoint", "Policy"]
steps = [
    ["ana", "View endpoint", "GET ORD-7"],
    ["View endpoint", "Policy", "decide(ana, order:view, ORD-7)"],
    ["Policy", "View endpoint", "DENY: not the owner", "reply"],
    ["View endpoint", "ana", "403 forbidden", "reply"],
]

[[diagram]]
name = "uml-diagram"
kind = "sequence"
title = "1. Roles only"
caption = "The role allows it; ownership is never asked."
participants = ["ana", "RolePolicy"]
steps = [
    ["ana", "RolePolicy", "order:view ORD-7"],
    ["RolePolicy", "ana", "ALLOW: CUSTOMER has order:view", "reply"],
]

[[diagram]]
name = "uml-diagram-2"
kind = "sequence"
title = "2. A new endpoint"
caption = "Closed until a rule opens it."
participants = ["alex", "Policy"]
