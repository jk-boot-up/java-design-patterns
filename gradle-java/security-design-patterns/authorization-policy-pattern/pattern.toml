    ["alex", "Policy", "order:export ORD-7"],
    ["Policy", "alex", "DENY: no rule allows it", "reply"],
]

[poster]
headline = [["AUTHORIZATION", "text"], ["POLICY", "text"]]
before = { code = "if (role == ...) in every endpoint", note = "ana reads ben's order", tag = "BEFORE" }
after = { code = "policy.decide(request)", note = "owner only, deny by default", tag = "AFTER" }
taglines = [["One place decides who may do what", "gold"]]

[[scene]]
key = "01-poster"
kind = "poster"
title = "Authorization Policy"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Authorization Policy pattern, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] Signing in proves who you are. [[slnc 300]] Authorization decides what you are allowed to do. [[slnc 500]] An authorization policy makes every one of those decisions in one place. [[slnc 300]] From rules about roles, and about details such as who owns what. [[slnc 300]] And anything no rule allows, is refused. [[slnc 600]]
Think of a hotel key-card system. [[slnc 300]] No door decides for itself who may enter. [[slnc 300]] One system holds the rules. [[slnc 300]] Guests open their own room. [[slnc 300]] The manager opens every room. [[slnc 700]]
In this video, the domain is an online shop, with customers, support staff and an admin, and endpoints to view, cancel and refund orders. [[slnc 500]]
By the end, you will hear how scattered checks exposed other customers' orders. [[slnc 300]] Why roles alone are not enough. [[slnc 300]] How rules on details fix it. [[slnc 300]] And why a policy should deny by default.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["View, cancel and refund endpoints.", "", "Each checked access itself.", "", "View forgot ownership.", "Refund forgot the limit."]
narration = """
Here is the scenario. [[slnc 400]] The shop has endpoints to view, cancel, and refund orders. [[slnc 500]]
Each endpoint checked access in its own code. [[slnc 500]]
The view endpoint forgot to check who owned the order. [[slnc 300]] And the refund endpoint forgot that support staff may only refund up to a hundred.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["One policy decides.", "", "Rules over roles and details.", "", "Deny by default.", "Every endpoint asks."]
narration = """
Let's name the pattern. [[slnc 400]] One policy makes every access decision. [[slnc 500]]
Its rules look at roles, and at details such as ownership and amounts. [[slnc 500]]
Anything no rule allows is refused. [[slnc 300]] And every endpoint asks the policy.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["Policy: the rules, and the decision", "Rule: an action and its condition", "Request: user, action, order, amount", "Decision: allow or deny, and why"]
narration = """
Here is who does what. [[slnc 400]] The policy holds the rules, and makes the decision. [[slnc 500]]
Each rule names an action, and the condition under which it is allowed. [[slnc 500]]
A request says who wants to do what, to which order. [[slnc 300]] And a decision says allow or deny, and why.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Spring Security @PreAuthorize", "Open Policy Agent", "AWS Cedar", "Cloud IAM policies"]
narration = """
You have probably met this pattern already. [[slnc 400]] Spring Security lets methods declare the rule they need. [[slnc 500]]
Open Policy Agent and Cedar are policy engines, with their own rule languages. [[slnc 500]]
And cloud permission policies say who may do which action, on which resource.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Different users, different rights.", "", "Start with roles.", "Add rules on details.", "Deny by default.", "Log and test it."]
narration = """
So, when should you use it? [[slnc 400]] As soon as different users may do different things. [[slnc 500]]
Start with roles. [[slnc 300]] Add rules on details, like ownership and limits. [[slnc 300]] Deny by default. [[slnc 300]] And log and test every rule.
"""

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Stop support", "refunding their own orders."]
narration = """
That's the Authorization Policy pattern. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] One place decides who may do what, and the answer starts as no. [[slnc 500]]
The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs offline, with nothing installed except a Java development kit. [[slnc 500]]
Here is one exercise to try. [[slnc 300]] Add a rule that stops support staff refunding their own orders. [[slnc 500]]
If this helped, a like really does help other people find it. [[slnc 300]] And subscribe, if you'd like the rest of the series. [[slnc 400]] Thanks for watching.
