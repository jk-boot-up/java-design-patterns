]

[poster]
headline = [["TOKEN", "text"], ["AUTHENTICATION", "text"]]
before = { code = "session in server A's memory", note = "server B: please sign in", tag = "BEFORE" }
after = { code = "header.payload.signature", note = "any server can check it", tag = "AFTER" }
taglines = [["Carry proof, not a session", "gold"]]

[[scene]]
key = "01-poster"
kind = "poster"
title = "Token Authentication"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Token Authentication pattern, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] After you sign in, the server gives you a token. [[slnc 300]] A short piece of text that says who you are, and when it expires. [[slnc 300]] It is signed with a secret key. [[slnc 300]] So any server holding the key can trust it, without looking anything up. [[slnc 600]]
Think of a wristband at a music festival. [[slnc 300]] Your ticket is checked once, at the gate. [[slnc 300]] Then any steward, at any stage, can glance at the band and let you in. [[slnc 300]] The hologram is hard to fake, and yesterday's band no longer works. [[slnc 700]]
In this video, the domain is an online shop's website, running on two servers. [[slnc 500]]
By the end, you will hear why remembering customers in one server's memory fails. [[slnc 300]] How a signed token works on any server. [[slnc 300]] How forged and expired tokens are caught. [[slnc 300]] And why signing out early is the hard part.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["Two servers behind a load balancer.", "", "Each remembered signed-in", "customers in its own memory.", "", "The other server: please sign in."]
narration = """
Here is the scenario. [[slnc 400]] The shop runs its website on two servers. [[slnc 300]] A load balancer shares requests between them. [[slnc 500]]
When a customer signed in, the server they reached remembered them, in its own memory. [[slnc 500]]
If the next request went to the other server, the customer was asked to sign in again.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["Sign in once, get a token.", "", "It says who, and until when.", "It is signed with a key.", "", "Any server can check it."]
narration = """
Let's name the pattern. [[slnc 400]] Sign in once, and get a token. [[slnc 500]]
The token says who you are, and until when. [[slnc 300]] It is signed with a secret key. [[slnc 500]]
Any server holding the key can check it, on its own. [[slnc 300]] The usual format is called a J W T, a JSON web token.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["TokenService: issue, verify, revoke", "TokenServer: checks every request", "SessionServer: the old way", "Verdict: the customer, or why not"]
narration = """
Here is who does what. [[slnc 400]] The token service issues tokens, checks them, and can revoke them. [[slnc 500]]
The token server keeps no sessions. [[slnc 300]] It checks the token on every request. [[slnc 500]]
The session server is the old way. [[slnc 300]] And a verdict says which customer the token names, or why it was refused.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Authorization: Bearer headers", "OAuth 2.0 access tokens", "OpenID Connect", "Spring Security resource servers"]
narration = """
You have probably met this pattern already. [[slnc 400]] Requests carrying a bearer token in their authorization header. [[slnc 500]]
The access tokens of OAuth, and the identity tokens of OpenID Connect. [[slnc 500]]
And Spring Security can check them for you.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Several servers or services.", "", "Keep tokens short-lived.", "No secrets in the payload.", "Guard and rotate the key.", "Plan for sign-out."]
narration = """
So, when should you use it? [[slnc 400]] When several servers or services must recognise the same customer. [[slnc 500]]
Keep tokens short-lived. [[slnc 300]] Put nothing secret inside them. [[slnc 300]] Guard the key, and change it regularly. [[slnc 300]] And plan for early sign-out.
"""

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Share the", "revoked list between servers."]
narration = """
That's the Token Authentication pattern. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Carry signed proof of who you are, not a session on one server. [[slnc 500]]
The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs offline, with nothing installed except a Java development kit. [[slnc 500]]
Here is one exercise to try. [[slnc 300]] Share the revoked list between both servers. [[slnc 500]]
If this helped, a like really does help other people find it. [[slnc 300]] And subscribe, if you'd like the rest of the series. [[slnc 400]] Thanks for watching.
"""
