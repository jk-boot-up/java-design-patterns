[docs.prerequisites]
required = [
    "Java basics: records, `Pattern`.",
    "HTTP methods, paths, headers and status codes.",
]
not_required = [
    "A real proxy or firewall. Requests are records.",
]

[docs.session]
objectives = [
    "Explain why trusted services should not face the internet.",
    "Write an allow-list of request shapes.",
    "Strip internal headers at the boundary.",
    "Keep secrets off the internet-facing machine.",
]
walkthrough = """
Run `./gradlew run` and compare act one's two exports with acts two and
three. Open `Gatekeeper.handle`: size, path, method, strip, forward. End on
act five's `false`.
"""
exercises = [
    "Add `GET /orders/<number>/invoice` to the allow-list.",
    "Rate-limit refused requests per caller.",
    "Make `OrderService` reject paths containing `..` itself, as a second layer.",
]

[docs.explained]
sentence = """
A Secure Gateway is a secret-free gatekeeper that is the only thing the
internet can reach, passing on only requests of an allowed shape.
"""
verdict = """
Put a gatekeeper in front of any service holding credentials or sensitive
data. Keep it free of secrets, allow-list request shapes, strip internal
headers, limit sizes, and still validate inside the services.
"""
recognise = [
    "A DMZ or public subnet holding only proxies.",
    "Proxy rules listing allowed methods and paths.",
    "Headers such as `X-Internal-...` removed at the edge.",
]

[spec]
purpose = """
Teach Secure Gateway with an online store's order service: a publicly
exposed service leaking every order through a spoofed header and a path trick,
a secret-free gatekeeper stripping internal headers, an allow-list of request
shapes, size and pattern limits, and the costs.
"""
nongoals = [
    "Not a real proxy, TLS or firewall. The network boundary is simulated.",
]
problem = """
A service holding secrets and internal features, exposed directly to the
internet, can be reached in ways it never intended.
"""
roles = [
    ["The pattern", "`Gatekeeper`"],
    ["The trusted service", "`OrderService`"],
    ["A request", "`HttpRequest`"],
    ["Entry point", "`SecureGatewayDemo`, five acts"],
]
requirements = [
    "**Allow-list:** only `GET /orders/<1-9 digits>` and `POST /orders` pass.",
    "**Strip:** `X-Internal-` headers never reach the service.",
    "**Limit:** bodies over 1,000,000 bytes are refused.",
    "**Every printed result is asserted** in `DemoRunsTest`.",
]

