[[scene]]
key = "01-poster"
kind = "poster"
title = "Secure Gateway"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Secure Gateway pattern, also called the Gatekeeper, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] The services that hold passwords and data never face the internet. [[slnc 300]] A separate gatekeeper does. [[slnc 300]] It holds no secrets. [[slnc 300]] And it only lets through requests of a few allowed shapes. [[slnc 600]]
Think of a bank. [[slnc 300]] Customers never walk into the vault. [[slnc 300]] They talk to a teller, who has no vault key, and can only pass on a few kinds of request. [[slnc 300]] Anything else is refused. [[slnc 700]]
In this video, the domain is an online shop's order service, which holds the database password. [[slnc 500]]
By the end, you will hear how two tricks exported every order. [[slnc 300]] How a gatekeeper strips what is internal. [[slnc 300]] How a short allow-list stops the rest. [[slnc 300]] And what the gate costs.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["The order service faced the internet.", "", "It held the database password.", "", "It had internal-only features:", "an admin header, an export page."]
narration = """
Here is the scenario. [[slnc 400]] The shop's order service answered the internet directly. [[slnc 500]]
It held the database password. [[slnc 500]]
And it had features meant only for internal tools. [[slnc 300]] A header that switched on admin mode. [[slnc 300]] And a page that exported every order.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["Only the gatekeeper is public.", "", "It holds no secrets.", "", "Allow-list, strip, limit,", "then forward."]
narration = """
Let's name the pattern. [[slnc 400]] Only the gatekeeper can be reached from the internet. [[slnc 500]]
It holds no passwords, and no data. [[slnc 500]]
It checks each request against an allow-list, strips anything internal, limits sizes. [[slnc 300]] And only then forwards it.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["Gatekeeper: checks and forwards", "OrderService: trusted, holds the secret", "HttpRequest: method, path, headers, size"]
narration = """
Here is who does what. [[slnc 400]] The gatekeeper checks each request, and forwards only the allowed ones. [[slnc 500]]
The order service is trusted. [[slnc 300]] It holds the database password, and can only be reached through the gate. [[slnc 500]]
And a request carries its method, path, headers, and size.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Reverse proxies in a DMZ", "Web application firewalls", "NGINX or Envoy allow-lists", "Cloud gateway request validation"]
narration = """
You have probably met this pattern already. [[slnc 400]] Reverse proxies placed in a separate network zone, in front of internal services. [[slnc 500]]
Web application firewalls. [[slnc 300]] And proxies configured with a list of allowed paths. [[slnc 500]]
Cloud gateways can also validate requests before they reach a service.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Services with secrets or", "sensitive data.", "", "No secrets on the gate.", "Allow-list, strip, limit.", "Still validate inside."]
narration = """
So, when should you use it? [[slnc 400]] In front of any service holding passwords or sensitive data. [[slnc 500]]
Keep the gate free of secrets. [[slnc 300]] Allow-list request shapes, strip internal headers, and limit sizes. [[slnc 300]] And still validate inside the services.
"""

[[scene]]
key = "08-outro"
