# pattern.toml for the Secure Gateway project. See tools/patternkit.

[project]
slug = "secure-gateway"
category = "security-design-patterns"
title = "Secure Gateway"
package = "securegateway"
main_class = "SecureGatewayDemo"
tagline = "Only the gate faces the internet"
bold = "Put a hardened gatekeeper, holding no secrets and no data, between the internet and the trusted services, and let through only requests of an allowed shape."
domain_note = ""
thumb_lines = ["SECURE", "GATEWAY"]
thumb_code = "allow-list at the gate"
youtube_title = "Secure Gateway (Gatekeeper)"
youtube_tags = ["secure gateway", "gatekeeper pattern", "allow list", "defense in depth", "security", "java"]

[readme]
intro = """
Secure Gateway, also called the Gatekeeper pattern, protects trusted services
by never letting the internet reach them. A separate gatekeeper is the only
machine exposed to the public. It holds no passwords and no data. It checks
every request against a short list of allowed shapes, such as "GET an order by
its number", removes anything meant only for internal use, limits sizes, and
only then passes the request on to the trusted service behind it.

If the gatekeeper is ever broken into, the attacker finds nothing useful on
it: no database password, no customer data, only a narrow path to the
services behind.
"""
analogy = """
Think of a bank. Customers never walk into the vault. They talk to a teller
behind a counter, who has no key to the vault and can only pass on a few kinds
of request: pay in, take out, check a balance. Anything else, the teller
simply refuses. Even a robber who got past the counter would not find the
vault key there.
"""
scenario = """
The online store's order service answered the internet directly, and it held
the database password. It also had features meant only for internal tools: a
header that switched on admin mode, and an admin export page. From outside,
anyone could send that header, or reach the export with a path such as
`/orders/../admin/export`, and download every order.
"""
costs = [
    "**An extra hop.** Every request passes one more machine, adding a little time.",
    "**A list to keep in step.** A new endpoint is blocked until someone adds it to the gate's allow-list.",
    "**Not the only defence.** The trusted services must still check their own inputs and access; the gate reduces risk, it does not remove it.",
]
too_much = """
A service with no secrets and no private data, such as a public product
catalogue, gains little from a separate gatekeeper. It pays off in front of
services that hold credentials or sensitive data.
"""
met_before = [
    "A web application firewall or reverse proxy in a DMZ, in front of internal services.",
    "NGINX or Envoy configured with an allow-list of paths and methods.",
    "Cloud API gateways with request validation and size limits.",
]
where = """
This project is in [security-design-patterns](..). It is close to
[Gateway Offloading](../../micro-services-design-patterns/gateway-offloading-pattern),
which moves shared chores into a gateway; this one is about keeping the
trusted services out of reach.
"""

[[act]]
title = "The service faces the internet"
summary = "The order service is public and holds the database password: a spoofed X-Internal-Admin header and the path /orders/../admin/export both export all 12,000 orders."
detail = """
The order service answers the internet directly. A normal request for order 7
works. But a request with the internal-tools header `X-Internal-Admin: true`
exports all twelve thousand orders, and so does `/orders/../admin/export`,
which the service tidies into `/admin/export`. And the machine the internet
talks to holds the database password.
"""
speech = """
First demo: the order service faces the internet directly. [[slnc 400]] A normal request for order seven works. [[slnc 600]]
But the service also has features meant only for internal tools. [[slnc 300]] A special header that switches on admin mode. [[slnc 300]] And an admin export page. [[slnc 600]]
Someone outside sends that header. [[slnc 300]] They get an export of all twelve thousand orders. [[slnc 500]]
Someone else asks for the orders path, then dot dot, then the admin export. [[slnc 300]] The service tidies the path, and exports everything again. [[slnc 600]]
And this machine, facing the internet, holds the database password.
"""
rows = { internet = "active wrong", orders = "active wrong" }
console = [
    ["X-Internal-Admin: export of 12000 orders", "bad"],
    ["/orders/../admin/export: export", "bad"],
    ["database password on this machine", "bad"],
]

[[act]]
title = "A gatekeeper in front"
summary = "Only the gatekeeper faces the internet; it strips internal headers, so the spoofed header now just returns order 7."
detail = """
Now the order service is moved off the internet, and a gatekeeper stands in
front. The gatekeeper strips every header whose name starts with
`X-Internal-`. The same spoofed request now just returns order 7: the admin
header never reaches the service.
"""
speech = """
Second demo: a gatekeeper in front. [[slnc 400]] The order service is moved off the internet. [[slnc 300]] Only the gatekeeper can be reached from outside. [[slnc 600]]
The gatekeeper removes every internal header from incoming requests. [[slnc 500]]
The same spoofed request now just returns order seven. [[slnc 300]] The admin header never reaches the service.
"""
rows = { gate = "active ok", orders = "active ok" }
console = [
    ["GET /orders/7: 200 order 7", "ok"],
    ["spoofed header: stripped, order 7", "ok"],
]

[[act]]
title = "An allow-list"
summary = "Only GET /orders/<number> and POST /orders pass: the traversal gets 404 and DELETE gets 405 at the gate; POST /orders creates an order."
detail = """
The gatekeeper lets through only two shapes of request: GET an order by its
number, and POST a new order. The path with dot dot does not match, and is
stopped with 404. DELETE on an order is stopped with 405, method not allowed.
A normal POST creates an order.
"""
speech = """
Third demo: only allowed shapes of request pass. [[slnc 400]] The gatekeeper has a list of two. [[slnc 300]] Get an order by its number. [[slnc 300]] And create a new order. [[slnc 600]]
The path with dot dot does not match. [[slnc 300]] Stopped at the gate. [[slnc 500]]
A request to delete an order. [[slnc 300]] Stopped, method not allowed. [[slnc 500]]
A normal new order passes, and is created.
"""
rows = { gate = "active ok" }
console = [
    ["traversal: 404 at the gate", "ok"],
    ["DELETE: 405 at the gate", "ok"],
    ["POST /orders: 201 created", "ok"],
]

[[act]]
title = "Size and shape limits"
summary = "A 5 MB body gets 413; /orders/7 OR 1=1 does not match the number pattern and gets 404; 3 passed, 4 refused."
detail = """
The gatekeeper also limits size: a five-megabyte order is refused with 413,
too large. And an order number must be digits only, so `/orders/7 OR 1=1`, an
attempt to trick the database, does not match and is refused. So far, three
requests have passed and four were stopped at the gate.
"""
speech = """
Fourth demo: size and shape limits. [[slnc 400]] A five megabyte order is refused. [[slnc 300]] Too large. [[slnc 600]]
An order number must be digits only. [[slnc 300]] So a request for order seven, followed by a trick aimed at the database, does not match. [[slnc 300]] Refused. [[slnc 600]]
So far, three requests passed. [[slnc 300]] And four were stopped at the gate.
"""
rows = { gate = "active ok" }
console = [
    ["5 MB body: 413 too large", "ok"],
    ["/orders/7 OR 1=1: 404", "ok"],
    ["passed 3, refused 4", "muted"],
]

[[act]]
title = "The bill"
summary = "A broken-into gatekeeper holds no credentials; but every request pays an extra hop, and new endpoints wait for the allow-list."
detail = """
If the gatekeeper itself is broken into, it holds no credentials and no data.
But every request pays an extra hop, and every new endpoint stays blocked
until someone adds it to the gate's list. The trusted services must still
check their own inputs: the gate is one layer, not the only one.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] If the gatekeeper itself is broken into, the attacker finds no password, and no data. [[slnc 600]]
But every request pays for one extra hop. [[slnc 300]] And every new endpoint stays blocked, until someone adds it to the gate's list. [[slnc 600]]
And the services behind must still check their own inputs. [[slnc 300]] The gate is one layer of defence, not the only one.
"""
rows = { gate = "active amber" }
console = [
    ["gatekeeper holds credentials: false", "ok"],
    ["an extra hop, a list to keep", "amber"],
]

[animation]
subtitle = "Requests from the internet meet the gatekeeper; only allowed shapes reach the order service."
boxes = [
    ["internet", "Internet", "anyone"],
    ["gate", "Gatekeeper", "no secrets, allow-list"],
    ["orders", "Order service", "holds the DB password"],
]

[docs.problem]
scenario = """
The store's order service answered the internet directly and held the
database password.
"""
naive = """
Internal-only features, a spoofable admin header and a path to the admin
export, were reachable by anyone.
"""
deliver = [
    "A directly exposed service leaking every order two ways.",
    "A gatekeeper that strips internal headers.",
    "An allow-list of request shapes.",
    "Size and pattern limits.",
    "The costs and the limits of the gate.",
    "Every printed result asserted by a test.",
