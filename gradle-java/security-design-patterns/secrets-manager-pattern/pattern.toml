[[scene]]
key = "01-poster"
kind = "poster"
title = "Secrets Manager"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Secrets Manager pattern, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] Passwords and keys are kept out of the code. [[slnc 300]] They live in one guarded store. [[slnc 300]] Each service gets only the secrets it is allowed. [[slnc 300]] Every read is logged. [[slnc 300]] And a secret can be replaced, without rebuilding anything. [[slnc 600]]
Think of the key cabinet in a hotel office. [[slnc 300]] Keys are not taped to the doors. [[slnc 300]] Each member of staff takes only the keys their job needs, and each one is written in a book. [[slnc 300]] If a key is lost, the lock is changed, and a new key hangs in the cabinet. [[slnc 700]]
In this video, the domain is an online shop's key for its card-payment company. [[slnc 500]]
By the end, you will hear why a key in the code is a problem. [[slnc 300]] How a secrets manager hands it out. [[slnc 300]] How to replace a key with no rebuild. [[slnc 300]] And what to do when a key leaks.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["The payment key was in", "a committed config file.", "", "Built into 3 services.", "", "40 people could read it."]
narration = """
Here is the scenario. [[slnc 400]] The shop's payment key was written in a configuration file, committed with the code. [[slnc 500]]
It was built into three services. [[slnc 500]]
Forty people could read the repository. [[slnc 300]] So forty people could read the key.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["Secrets live in one guarded store.", "", "Granted per service.", "Every read logged.", "Rotated without a rebuild."]
narration = """
Let's name the pattern. [[slnc 400]] Secrets live in one guarded store, never in code. [[slnc 500]]
Each service is granted only what it needs. [[slnc 300]] Every read is logged. [[slnc 500]]
And a secret can be rotated, with no rebuild.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["SecretsManager: store, grant, log, rotate", "CachedSecret: a service's copy, 5 minutes", "PaymentProvider: accepts current keys", "HardCodedConfig: the old way"]
narration = """
Here is who does what. [[slnc 400]] The secrets manager stores secrets, checks grants, logs reads, and rotates versions. [[slnc 500]]
Each service keeps a cached copy for five minutes, and fetches again when the copy expires, or is refused. [[slnc 500]]
The payment company accepts whichever keys are current. [[slnc 300]] And the hard-coded configuration is the old way.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["HashiCorp Vault", "AWS, Azure and Google secret stores", "Kubernetes Secrets", "Spring Cloud Vault"]
narration = """
You have probably met this pattern already. [[slnc 400]] HashiCorp Vault. [[slnc 500]]
The secret stores of every big cloud provider. [[slnc 300]] Kubernetes Secrets. [[slnc 500]]
And Spring Cloud Vault, which loads secrets into a Spring application.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Any real secret.", "", "Grant per service.", "Cache for minutes.", "Refetch on refusal.", "Rotate regularly."]
narration = """
So, when should you use it? [[slnc 400]] For any secret that guards real money, or real data. [[slnc 500]]
Grant it per service. [[slnc 300]] Cache it for minutes. [[slnc 300]] Fetch again when it is refused. [[slnc 300]] And rotate it regularly.
"""

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
