[docs.session]
objectives = [
    "Explain the risks of secrets in code.",
    "Grant secrets per service and audit reads.",
    "Rotate a secret with caching and a grace period.",
    "Respond to a leak without a redeploy.",
]
walkthrough = """
Run `./gradlew run` and follow act three's minutes 2, 5 and 10. Open
`CachedSecret`: a value, a time, and `refresh`. End on act four's refetch.
"""
exercises = [
    "Make `SecretsManager.read` fail while the manager is down, and have `CachedSecret` keep its last value.",
    "Store the database password too, granted to one service only.",
    "Replace `SecretsManager` with Spring Cloud Vault against a local Vault.",
]

[docs.explained]
sentence = """
A Secrets Manager keeps secrets in one guarded store, grants each service only
what it needs, logs every read, and rotates secrets without rebuilds.
"""
verdict = """
Take every real secret out of code and builds. Grant per service, log reads,
cache for minutes, fetch again on refusal, rotate regularly, and give services
a platform identity to reach the manager.
"""
recognise = [
    "Configuration like `${vault:secret/payment-key}`.",
    "Startup code calling a secrets client.",
    "Rotation schedules and audit logs in a vault console.",
]

[spec]
purpose = """
Teach Secrets Manager with an online store's payment key: a hard-coded key
exposed to forty people and three builds, a manager with grants and an audit
log, rotation with caching and a grace period, an emergency rotation after a
leak, and the costs.
"""
nongoals = [
    "Not encryption at rest or a real vault. The manager is in memory.",
]
problem = """
Secrets in code and builds are widely readable, permanent in history, and
expensive to change.
"""
roles = [
    ["The pattern", "`SecretsManager`"],
    ["A service's copy", "`CachedSecret`"],
    ["The external company", "`PaymentProvider`"],
    ["The old way", "`HardCodedConfig`"],
    ["Entry point", "`SecretsManagerDemo`, five acts"],
]
requirements = [
    "**Granted:** only listed services may read a secret.",
    "**Audited:** every read is logged, granted or denied.",
    "**Rotatable:** `rotate` changes what is handed out, with no code change.",
    "**Every printed result is asserted** in `DemoRunsTest`.",
]

