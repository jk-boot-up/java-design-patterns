# pattern.toml for the Secrets Manager project. See tools/patternkit.

[project]
slug = "secrets-manager"
category = "security-design-patterns"
title = "Secrets Manager"
package = "secrets"
main_class = "SecretsManagerDemo"
tagline = "Keys out of the code"
bold = "Keep passwords and keys out of code and builds, in one guarded store that hands each service only the secrets it is allowed, logs every read, and lets a secret be rotated without a rebuild."
youtube_description = """Secrets Manager pattern in Java, explained with an online store's key for its card-payment company. Passwords and keys are kept out of the code in one guarded store, each service gets only the secrets it is allowed, every read is logged, and a secret can be replaced without rebuilding anything, like a hotel key cabinet with a signing-out book. We watch a key hard-coded in the source, move it into a manager, rotate it without a rebuild, and respond to a leak. We finish with the bill."""
domain_note = ""
thumb_lines = ["SECRETS", "MANAGER"]
thumb_code = "manager.read(\"payment-key\")"
youtube_title = "Secrets Manager"
youtube_tags = ["secrets manager", "vault", "key rotation", "credentials", "security", "java"]

[readme]
intro = """
Every service needs secrets: database passwords, keys for payment companies,
signing keys. The easy mistake is to write them into configuration files that
are committed with the code. Then everyone who can read the repository can
read the secret, it stays in the history for ever, and changing it means
editing, rebuilding and redeploying every service that uses it.

A Secrets Manager is one guarded store for secrets. Services fetch what they
need at run time. Each service may read only the secrets it has been granted,
every read is logged, and a secret can be rotated to a new version, which the
services pick up within minutes, without anyone touching the code.
"""
analogy = """
Think of the key cabinet in a hotel office. Keys are not taped to the doors
or copied for every member of staff. They hang in one locked cabinet. Each
person may take only the keys their job needs, every key taken is written in a
book, and if a key is lost, the lock is changed and a new key hung in the
cabinet. Nobody has to rebuild the hotel.
"""
scenario = """
The online store's payment key was written in a configuration file committed
with the code, and built into three services: checkout, refunds and
subscriptions. Forty people could read the repository, and so could read the
key. Changing it meant editing, rebuilding and redeploying all three services.
"""
costs = [
    "**A critical dependency.** If the manager is down when a service starts, the service cannot get its keys; cache sensibly and run the manager for high availability.",
    "**Secret zero.** Each service needs one first credential to reach the manager; use the platform's own identity for it rather than another stored password.",
    "**Rotation has moving parts.** Services cache keys, so an old key must stay valid for a grace period, or services must fetch again when a key is refused.",
]
too_much = """
A learning project on one laptop can use environment variables. Once a
secret guards real money or real data, or is shared by several services, it
belongs in a manager.
"""
met_before = [
    "HashiCorp Vault, AWS Secrets Manager, Azure Key Vault and Google Secret Manager.",
    "Kubernetes Secrets, often fed from one of the above.",
    "Spring Cloud Vault, which loads secrets into Spring configuration.",
]
where = """
This project is in [security-design-patterns](..), next to
[Token Authentication](../token-authentication-pattern), whose signing key is
exactly the kind of secret that belongs here.
"""

[[act]]
title = "A key in the code"
summary = "The payment key is built into 3 services and readable by the 40 people with repository access; changing it means rebuilding all 3."
detail = """
The payment key is written in a configuration file that is committed with the
code and built into checkout, refunds and subscriptions. All forty people who
can read the repository can read the key, and every old copy of it stays in
the history. Changing it means editing, rebuilding and redeploying three
services.
"""
speech = """
First demo: the payment key is written in the code. [[slnc 400]] It sits in a configuration file, committed with everything else. [[slnc 600]]
It is built into three services. [[slnc 300]] Checkout, refunds, and subscriptions. [[slnc 500]]
Forty people can read the repository. [[slnc 300]] So forty people can read the key. [[slnc 300]] And every old copy stays in the history. [[slnc 600]]
Changing it means editing, rebuilding and redeploying three services.
"""
rows = { code = "active wrong", services = "active amber" }
console = [
    ["key built into 3 services", "bad"],
    ["readable by 40 people", "bad"],
]

[[act]]
title = "A key in the manager"
summary = "Checkout reads the key at run time and charges 20.00; catalog asks for it and is refused, because it was never granted."
detail = """
Now the key lives in a secrets manager, granted to the three payment services
only. Checkout reads it when it runs and charges 20.00. The catalog service
asks for the same key and is refused: it was never granted it. The key is in
no source file and no build.
"""
speech = """
Second demo: the key lives in a secrets manager. [[slnc 400]] It is granted to the three payment services, and nobody else. [[slnc 600]]
Checkout reads the key while it runs. [[slnc 300]] And charges twenty. [[slnc 500]]
The catalog service asks for the same key. [[slnc 300]] Refused. [[slnc 300]] It was never granted it. [[slnc 600]]
The key is in no source file, and no build.
"""
rows = { manager = "active ok", services = "active ok" }
console = [
    ["checkout: charged 20.00", "ok"],
    ["catalog: may not read payment-key", "ok"],
]

[[act]]
title = "Rotation without a rebuild"
summary = "Rotated to version 2: at minute 2 checkout still uses v1 (still accepted), at minute 5 its cache refreshes to v2, and v1 is cancelled at minute 10."
detail = """
The key is rotated to version 2, and the payment company accepts both for a
while. At minute 2, checkout is still using its cached version 1, which still
works. At minute 5, its five-minute cache runs out and it fetches version 2.
At minute 10, version 1 is cancelled, and checkout carries on charging. No
code changed, nothing was rebuilt.
"""
speech = """
Third demo: rotating the key, with no rebuild. [[slnc 400]] Rotating means replacing it with a new version. [[slnc 600]]
The key becomes version two. [[slnc 300]] For a while, the payment company accepts both. [[slnc 500]]
Two minutes later, checkout is still using its saved copy of version one. [[slnc 300]] It still works. [[slnc 500]]
At five minutes, checkout's copy expires, and it fetches version two. [[slnc 500]]
At ten minutes, version one is cancelled. [[slnc 300]] Checkout carries on charging. [[slnc 300]] Nothing was rebuilt.
"""
rows = { manager = "active ok", services = "active ok", provider = "active ok" }
console = [
    ["minute 2: v1, charged", "ok"],
    ["minute 5: v2, charged", "ok"],
    ["minute 10: v1 cancelled, still charging", "ok"],
]

[[act]]
title = "A leak"
summary = "The key leaks: it is rotated and cancelled at once; the attacker is refused, and checkout, refused once, fetches v3 and charges."
detail = """
Version 2 leaks. It is rotated to version 3 and cancelled at once, with no
grace period. The attacker's charge is refused. Checkout's cached copy is
refused too, so on a refusal it fetches again straight away, gets version 3,
and charges. No code change, no rebuild, no redeploy.
"""
speech = """
Fourth demo: the key leaks. [[slnc 400]] It is rotated to version three, and the leaked key is cancelled at once. [[slnc 600]]
The attacker tries to charge nine hundred and ninety-nine. [[slnc 300]] Refused. [[slnc 500]]
Checkout's saved copy is refused too. [[slnc 300]] So, on a refusal, it fetches the key again straight away. [[slnc 300]] It gets version three, and charges. [[slnc 600]]
No code change. [[slnc 300]] No rebuild. [[slnc 300]] No redeploy.
"""
rows = { manager = "active ok", provider = "active ok" }
console = [
    ["leaked key: refused", "ok"],
    ["checkout refetches: v3, charged", "ok"],
]

[[act]]
title = "The bill"
summary = "5 reads logged, including catalog's denial; the manager is now critical, and each service needs a first credential to reach it."
detail = """
Every read is logged: five so far, including catalog's refusal. But every
service now depends on the manager: if it is down when a service starts, the
service cannot get its keys. And each service still needs one first
credential to reach the manager, best given by the platform itself rather
than stored as yet another password.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] Every read is logged. [[slnc 300]] Five so far, including the catalog's refusal. [[slnc 600]]
But now every service depends on the manager. [[slnc 300]] If it is down when a service starts, the service cannot get its keys. [[slnc 600]]
And each service still needs one first credential, just to reach the manager. [[slnc 300]] Let the platform provide that identity, rather than storing another password.
"""
rows = { manager = "active amber" }
console = [
    ["5 reads logged", "muted"],
    ["manager down: no keys", "bad"],
    ["secret zero: platform identity", "amber"],
]

[animation]
subtitle = "Services fetch the payment key from the secrets manager at run time and use it with the payment company."
boxes = [
    ["code", "Source code", "no secrets"],
    ["manager", "Secrets manager", "granted, logged, versioned"],
    ["services", "Payment services", "cache for 5 minutes"],
    ["provider", "Payment company", "accepts current keys"],
]

