[docs.prerequisites]
required = [
    "Java basics: HTTP in outline.",
    "The Secrets Manager idea, ideally from the plain Java version of this pattern.",
]
not_required = [
    "Earlier Vault or OpenBao experience. The dependencies page explains the words used.",
]
install = [
    "A running container runtime such as Docker Desktop. The demo starts and removes OpenBao itself.",
]

[docs.dependencies]
intro = """
This project uses OpenBao, which the plain Java version of Secrets Manager
does not. Skipping it loses none of the pattern: the plain version teaches all
of it with nothing installed.
"""
what = [
    ["OpenBao", "OpenBao is an open-source secrets manager, a fork of HashiCorp Vault run by the Linux Foundation, with the same HTTP API. The KV version 2 engine stores secrets at paths such as secret/data/payment-key, keeping every version. A policy is a set of rules over paths, such as read on that one path. A token is what a service presents with each request, in the X-Vault-Token header; it carries policies, and can be revoked. Development mode runs everything in memory, already unsealed, with a root token: for learning only."],
    ["Why not Vault", "HashiCorp Vault changed its licence in 2023 to the Business Source License, which is not an open-source licence. OpenBao continues the open-source code, so what you learn here applies to Vault too."],
    ["Testcontainers", "Testcontainers is a Java library that starts a container, here OpenBao, from inside a program, and removes it afterwards."],
]
why = """
The plain version shows the idea. This version shows the concepts every real
secrets manager shares: paths, policies, tokens, versions and revocation.
"""
versions = [
    ["Java", "21"],
    ["Docker", "running; 24 or later"],
    ["OpenBao image", "openbao/openbao:2.7.0"],
    ["Testcontainers", "2.0.5"],
]
costs = [
    "A container runtime, and a first run that downloads the OpenBao image.",
    "A highly available secrets server to run in production.",
]

[docs.session]
objectives = [
    "Store a secret in OpenBao's KV v2 engine.",
    "Write a policy and issue tokens that carry it.",
    "Rotate a secret by writing a new version.",
    "Revoke a leaked token.",
]
walkthrough = """
Run `./gradlew run` with Docker running. Compare act two's 200 and 403. Open
`Secrets`: every method is one HTTP call. End on act four's revoked token.
"""
exercises = [
    "Enable AppRole auth and log in with a role instead of a root-issued token.",
    "Give tokens a 10-second lifetime and watch one expire.",
    "Replace the HTTP calls with Spring Cloud Vault pointed at OpenBao.",
]

[docs.explained]
sentence = """
With OpenBao, secrets live at paths, policies decide who may read them, each
service holds a revocable token, and every change is a new version.
"""
verdict = """
Use a secrets manager for every real secret. Write narrow policies, give each
service its own token from a platform identity, rotate secrets as versions,
revoke leaks at once, and run the server for high availability.
"""
recognise = [
    "`X-Vault-Token` headers and `/v1/secret/data/...` paths.",
    "Policies written as `path \"...\" { capabilities = [\"read\"] }`.",
    "`spring.cloud.vault` settings in configuration.",
]

[spec]
purpose = """
Teach Secrets Manager with a real OpenBao server: a hard-coded key, a policy
and per-service tokens, versioned rotation, revoking a leaked token, and the
costs of running the server.
"""
nongoals = [
    "Not production OpenBao. Development mode, in memory, is used.",
]
problem = """
Secrets in code are widely readable and hard to change.
"""
roles = [
    ["The server in a container", "`OpenBao`"],
    ["The shop's secret operations", "`Secrets`"],
    ["Entry point", "`OpenBaoSecretsDemo`, five acts"],
]
requirements = [
    "**Policy:** only a token with the payments policy reads the key.",
    "**Versions:** version 1 stays readable after rotation.",
    "**Revocable:** a revoked token is refused.",
    "**No Docker, no crash:** without a runtime the demo prints advice.",
]

