body = ["OpenBao: the secrets server", "Secrets: store, policy, tokens", "Checkout: reads with its token", "Catalog: has no permission"]
narration = """
Here is who does what. [[slnc 400]] OpenBao is the secrets server, in a container. [[slnc 500]]
The secrets class stores the key, writes the policy, and issues tokens. [[slnc 500]]
Checkout reads the key with its token. [[slnc 300]] And the catalog service has no permission at all.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
