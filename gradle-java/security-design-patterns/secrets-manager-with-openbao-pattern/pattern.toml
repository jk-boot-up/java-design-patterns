narration = """
You have probably met this already. [[slnc 400]] HashiCorp Vault, whose interface OpenBao keeps. [[slnc 500]]
The secret stores of every big cloud provider. [[slnc 500]]
And Spring Cloud Vault, which reads these servers into a Spring application.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Every real secret.", "", "Narrow policies.", "A token per service.", "Rotate as versions.", "Revoke leaks at once."]
narration = """
So, when should you use it? [[slnc 400]] For every secret that guards real money or data. [[slnc 500]]
Write narrow policies. [[slnc 300]] Give each service its own token. [[slnc 300]] Rotate secrets as versions. [[slnc 300]] And revoke leaks at once.
"""

