# pattern.toml for the Secrets Manager with OpenBao project. See tools/patternkit.

[project]
slug = "secrets-manager-with-openbao"
category = "security-design-patterns"
title = "Secrets Manager with OpenBao"
package = "secretsopenbao"
main_class = "OpenBaoSecretsDemo"
tagline = "Policies, tokens, versions, revocation"
bold = "Keep the payment key in a real OpenBao server, the open-source fork of HashiCorp Vault: a policy decides which service may read it, each service has its own token, the key is versioned for rotation, and a leaked token is revoked at once."
domain_note = ""
thumb_lines = ["SECRETS MANAGER", "WITH OPENBAO"]
thumb_code = "GET /v1/secret/data/payment-key"
youtube_title = "Secrets Manager with OpenBao (open-source Vault)"
youtube_tags = ["secrets manager", "openbao", "vault", "policies", "key rotation", "java"]

[readme]
intro = """
This is the real-infrastructure version of the Secrets Manager pattern. The
plain Java version, a separate project in this category, keeps secrets in a
map with grants. Here a real OpenBao server holds them, started in a container
by the demo itself, and the demo talks to it over its HTTP API.

OpenBao is the open-source fork of HashiCorp Vault, run by the Linux
Foundation. It keeps Vault's API and concepts: a key-value store with
versions, policies written as rules over paths, and tokens that carry
policies and can be revoked. It is used here rather than Vault because Vault
is no longer open source: since 2023 it is published under the Business
Source License.
"""
analogy = """
Think of a bank's safe-deposit room. Keys to the boxes are not handed out
freely: each person gets a card that opens only the boxes on their list, and
a lost card is cancelled at the desk at once. When a box's lock is changed,
the old combination is kept on file for a while, in case someone still needs
it.
"""
scenario = """
The online store's payment key was written in a configuration file committed
with the code and built into three services. Everyone who could read the
repository could read it, and changing it meant rebuilding every service.
"""
test_note = """
Every result the demo prints is asserted against a real OpenBao server.
Without a container runtime, the test is skipped rather than failed.
"""
run_note = """
This project needs a running container runtime, such as Docker Desktop: the
demo starts a real OpenBao 2.7.0 server in a container and removes it again.
Without one, it prints a sentence saying what to start, rather than failing.
"""
twin = """
The plain Java version got the idea right: secrets out of code, granted per
service, read at run time, rotated without a rebuild, and a manager every
service now depends on. What it left out is how a real secrets manager does
it. Access is a policy over paths, attached to a token each service holds, and
a service without it gets HTTP 403. Secrets are versioned, so version 1 stays
readable during rotation. A leaked token can be revoked at once, which the
plain version could not show. And development mode, used here, is exactly
what production must not be: in memory, unsealed and with a root token.
"""
technologies = [
    ["OpenBao", "2.7.0 (container image)", "the secrets server: KV v2, policies, tokens"],
    ["Java HttpClient", "JDK 21", "calls OpenBao's HTTP API directly"],
    ["Testcontainers", "2.0.5", "starts and stops OpenBao from the demo"],
    ["Docker", "24 or later", "runs the container"],
]
costs = [
    "**Secret zero.** Each service still needs a first credential to get its token; use the platform's identity, such as AppRole or Kubernetes auth.",
    "**Critical to run.** Production needs storage, unsealing and high availability, because services cannot start without it.",
    "**Policies to maintain.** Every service's access is a rule someone writes and reviews.",
]
too_much = """
A learning project on one laptop can use environment variables. Once a secret
guards real money or data, or is shared by several services, it belongs in a
secrets manager.
"""
met_before = [
    "HashiCorp Vault, whose API OpenBao keeps.",
    "AWS Secrets Manager, Azure Key Vault and Google Secret Manager.",
    "Spring Cloud Vault, which reads Vault-compatible servers into Spring configuration.",
]
where = """
This project is in [security-design-patterns](..). It is the
real-infrastructure version of the plain Java Secrets Manager project in the
same category, which is left unchanged.
"""

[[act]]
title = "A key in the code"
summary = "PAYMENT_KEY = \"pay-key-v1\" is built into three services and readable by anyone with the repository."
detail = """
The payment key is written into the code as a constant and built into
checkout, refunds and subscriptions. Everyone who can read the repository can
read it, and every old copy stays in the history.
"""
speech = """
First demo: the payment key is written in the code. [[slnc 400]] It is built into three services. [[slnc 600]]
Everyone who can read the code can read the key. [[slnc 300]] And every old copy stays in the history.
"""
rows = { code = "active wrong" }
console = [
    ["PAYMENT_KEY = \"pay-key-v1\"", "bad"],
]

[[act]]
title = "Policies and tokens"
summary = "The key is in OpenBao; checkout's token with the payments policy reads it (200), catalog's token without it is refused (403)."
detail = """
The key is stored in OpenBao's key-value store. A policy called payments
allows reading that one path. Checkout gets a token carrying the policy and
reads the key: HTTP 200. The catalog service gets a token without it and is
refused: HTTP 403, permission denied.
"""
speech = """
Second demo: the key lives in OpenBao. [[slnc 400]] A policy called payments allows reading that one key. [[slnc 600]]
Checkout has a token carrying that policy. [[slnc 300]] It reads the key. [[slnc 500]]
The catalog service has a token without it. [[slnc 300]] Refused. [[slnc 300]] Permission denied.
"""
rows = { bao = "active ok", services = "active ok" }
console = [
    ["checkout: 200, pay-key-v1", "ok"],
    ["catalog: 403, permission denied", "ok"],
]

[[act]]
title = "Versions and rotation"
summary = "Writing the key again makes version 2, which checkout now reads; version 1 stays readable for a grace period."
detail = """
Writing a new value creates version 2 of the secret, and checkout now reads
pay-key-v2 with no rebuild. OpenBao keeps version 1, so it can still be read
while the payment company accepts both during the change-over.
"""
speech = """
Third demo: rotating the key. [[slnc 400]] Writing a new value creates version two. [[slnc 300]] Checkout now reads it, with no rebuild. [[slnc 600]]
Version one is kept, and can still be read. [[slnc 300]] So old and new can overlap, for a grace period.
"""
rows = { bao = "active ok" }
console = [
    ["version 2: pay-key-v2", "ok"],
    ["version 1 still readable", "muted"],
]

[[act]]
title = "Revoke a leaked token"
summary = "Checkout's token leaks and is revoked: the attacker gets 403; checkout gets a new token and reads the key again."
detail = """
Checkout's token appears in a log that leaked. It is revoked at once. The
attacker using it gets HTTP 403. Checkout is given a new token and reads the
key as before; the key itself can also be rotated, as in act three.
"""
speech = """
Fourth demo: checkout's token leaks. [[slnc 400]] It is revoked, at once. [[slnc 600]]
The attacker tries it. [[slnc 300]] Refused. [[slnc 500]]
Checkout is given a new token, and reads the key as before. [[slnc 300]] And the key itself can be rotated too.
"""
rows = { bao = "active ok", services = "active ok" }
console = [
    ["leaked token: 403", "ok"],
    ["new token: 200", "ok"],
]

[[act]]
title = "The bill"
summary = "Every service needs a first credential to get a token, and dev mode is in memory with a root token; production needs storage, unsealing and HA."
detail = """
Every service still needs one first credential to get its token; the answer
is the platform's own identity, such as AppRole or Kubernetes auth. And this
demo's server runs in development mode: in memory, unsealed and with a root
token. Production needs real storage, unsealing and high availability,
because every service now depends on it to start.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] Every service still needs one first credential, to get its token. [[slnc 300]] Let the platform provide that identity. [[slnc 600]]
And this server runs in development mode. [[slnc 300]] In memory, with a master token. [[slnc 500]]
Production needs real storage, and high availability. [[slnc 300]] Because every service now depends on it to start.
"""
rows = { bao = "active amber" }
console = [
    ["secret zero: platform identity", "amber"],
    ["dev mode is not production", "amber"],
]

[animation]
subtitle = "Services read the payment key from OpenBao with their own tokens; policies decide who may."
boxes = [
    ["code", "Source code", "no secrets"],
    ["bao", "OpenBao", "KV v2, policies, tokens"],
    ["services", "Checkout, catalog", "one token each"],
]

