before = { code = "PAYMENT_KEY = \"pay-key-v1\"", note = "readable by everyone", tag = "BEFORE" }
after = { code = "GET /v1/secret/data/payment-key", note = "policy, token, version", tag = "AFTER" }
taglines = [["Open-source Vault, for real", "gold"]]

[[scene]]
key = "01-poster"
kind = "poster"
title = "Secrets Manager with OpenBao"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Secrets Manager pattern, with a real OpenBao server, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] A secrets manager keeps passwords and keys out of the code, in one guarded store. [[slnc 300]] Each service may read only what it is allowed, and secrets can be changed without a rebuild. [[slnc 500]] OpenBao is an open-source secrets manager, the community fork of HashiCorp Vault, with the same interface. [[slnc 600]]
Think of a bank's safe-deposit room. [[slnc 300]] Each person's card opens only their boxes. [[slnc 300]] And a lost card is cancelled at once. [[slnc 700]]
In this video, the domain is an online shop's key for its card-payment company. [[slnc 500]]
By the end, you will hear how policies and tokens decide who may read it. [[slnc 300]] How the key is rotated. [[slnc 300]] And how a leaked token is cancelled.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["The payment key was in the code.", "", "Built into three services.", "", "Readable by anyone", "with the repository."]
narration = """
Here is the scenario. [[slnc 400]] The shop's payment key was written in the code. [[slnc 500]]
It was built into three services. [[slnc 500]]
Anyone who could read the code could read the key.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern, in OpenBao"
body = ["Secrets at paths, with versions.", "", "Policies: who may read a path.", "Tokens: one per service,", "revocable."]
narration = """
Let's name the pattern, in OpenBao's words. [[slnc 400]] Secrets live at paths, and every change is a new version. [[slnc 500]]
A policy says who may read a path. [[slnc 300]] And each service holds a token, carrying its policies, that can be revoked.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
