plugins {
    id 'java'
    id 'application'
}

group = 'com.jk.explore'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Testcontainers 2.0.5 starts and stops an OpenBao server for the demo itself. OpenBao is spoken
    // to over its HTTP API with the JDK's own HttpClient, so every call is visible in the code.
    implementation 'org.testcontainers:testcontainers:2.0.5'

    // Testcontainers logs through SLF4J; the simple binding is switched off.
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.17'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.jk.explore.secretsopenbao.OpenBaoSecretsDemo'
}

test {
    useJUnitPlatform()
}
