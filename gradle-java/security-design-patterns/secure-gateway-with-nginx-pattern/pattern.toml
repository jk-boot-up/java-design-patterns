[poster]
headline = [["SECURE GATEWAY", "text"], ["WITH NGINX", "text"]]
before = { code = "order service on the internet", note = "12000 orders exported", tag = "BEFORE" }
after = { code = "location ~ ^/orders/[0-9]+$", note = "404, 403, 413 at the gate", tag = "AFTER" }
taglines = [["The gatekeeper is a config file", "gold"]]

[[scene]]
key = "01-poster"
kind = "poster"
title = "Secure Gateway with NGINX"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Secure Gateway pattern, also called the Gatekeeper, with NGINX. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] The services that hold passwords and data never face the internet. [[slnc 300]] A separate gatekeeper does. [[slnc 300]] It holds no secrets, and lets through only a few allowed kinds of request. [[slnc 500]] NGINX is the open-source web server and reverse proxy in front of much of the web. [[slnc 600]]
Think of a bank teller behind a counter, with no key to the vault. [[slnc 700]]
In this video, the domain is an online shop's order service, which holds the database password. [[slnc 500]]
By the end, you will hear how two tricks exported every order. [[slnc 300]] How a short NGINX configuration stops them. [[slnc 300]] And what the gate costs.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["The order service faced the internet.", "", "It held the database password.", "", "An admin header and an export", "page were reachable by anyone."]
narration = """
Here is the scenario. [[slnc 400]] The shop's order service answered the internet directly. [[slnc 500]]
It held the database password. [[slnc 500]]
And an internal admin header, and an admin export page, were reachable by anyone.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern, in NGINX"
body = ["Allowed locations only.", "limit_except for methods.", "client_max_body_size.", "proxy_set_header to strip.", "No secrets on the gate."]
narration = """
Let's name the pattern, in NGINX's words. [[slnc 400]] Only a few allowed locations. [[slnc 300]] A limit on methods. [[slnc 300]] A limit on body size. [[slnc 500]]
Internal headers stripped on the way through. [[slnc 300]] And no secrets on the gate.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["Gatekeeper: NGINX and its config", "OrderService: trusted, holds the secret"]
narration = """
Here is who does what. [[slnc 400]] The gatekeeper is NGINX, and its whole policy is a short configuration file. [[slnc 500]]
The order service is trusted, holds the password, and can only be reached through the gate.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Reverse proxies in a DMZ", "ModSecurity on NGINX", "Cloud load balancer rules"]
narration = """
You have probably met this already. [[slnc 400]] Reverse proxies placed in their own network zone, in front of internal services. [[slnc 500]]
Web application firewall rules on NGINX. [[slnc 500]]
And path rules on cloud load balancers.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Services with secrets or", "sensitive data.", "", "An allow-list config.", "No secrets on the gate.", "Still validate inside."]
narration = """
So, when should you use it? [[slnc 400]] In front of any service holding passwords or sensitive data. [[slnc 500]]
Keep the configuration an allow-list. [[slnc 300]] Keep secrets off the gate. [[slnc 300]] And still validate inside the services.
"""

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a", "rate limit with limit_req."]
narration = """
That's the Secure Gateway, with NGINX. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Let only a gate with nothing to steal face the internet, and write its rules as an allow-list. [[slnc 500]]
The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It needs Docker running, and starts NGINX for you. [[slnc 500]]
