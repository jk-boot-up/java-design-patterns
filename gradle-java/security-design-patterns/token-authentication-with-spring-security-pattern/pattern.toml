[[scene]]
key = "01-poster"
kind = "poster"
title = "Token Authentication with Spring Security"
narration = """
Hello, and welcome. [[slnc 400]] This video explains Token Authentication, built with Spring Security, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] After you sign in, you are given a signed token that says who you are, and until when. [[slnc 300]] Any server holding the key can trust it, without looking anything up. [[slnc 500]] Spring Security is the open-source security framework most Java web applications use, and it checks these tokens for you. [[slnc 600]]
Think of a festival wristband. [[slnc 300]] Checked once at the gate. [[slnc 300]] Then any steward can glance at it, and let you in. [[slnc 700]]
In this video, the domain is an online shop's website, running as two server instances. [[slnc 500]]
By the end, you will hear why sessions fail across servers. [[slnc 300]] How Spring Security issues and checks tokens. [[slnc 300]] And what signing out, and a stolen key, mean.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["Two server instances.", "", "Sessions in each one's memory.", "", "The other server:", "please sign in."]
narration = """
Here is the scenario. [[slnc 400]] The shop's website runs as two server instances. [[slnc 500]]
Each remembered signed-in customers in its own memory. [[slnc 500]]
A request that reached the other server was asked to sign in again.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern, in Spring Security"
body = ["Sign in once: JwtEncoder.", "", "Every request: the resource", "server checks the JWT.", "", "Add validators as needed."]
narration = """
Let's name the pattern, in Spring Security's words. [[slnc 400]] Sign in once, and a JWT encoder issues the token. [[slnc 500]]
On every request, the resource server support checks it. [[slnc 500]]
And extra rules, like a revoked list, are added as validators.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["ShopApp: security configuration", "ShopController: token, cart, sign-out", "JwtDecoder: signature, expiry, revoked"]
narration = """
Here is who does what. [[slnc 400]] Shop app holds the security configuration, and issues tokens. [[slnc 500]]
The shop controller has the sign-in, the cart, and sign-out. [[slnc 500]]
And the decoder checks each token's signature, expiry, and the revoked list.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["oauth2ResourceServer in Spring", "Keycloak, Auth0, Okta tokens", "Bearer headers"]
narration = """
You have probably met this already. [[slnc 400]] Spring configurations with a resource server, and JWT. [[slnc 500]]
Tokens from identity providers such as Keycloak, Auth0 and Okta. [[slnc 500]]
And bearer tokens, in any browser's developer tools.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Several instances or services.", "", "Short-lived tokens.", "Clock skew set on purpose.", "Shared revocation.", "Guard the key."]
narration = """
So, when should you use it? [[slnc 400]] Whenever several instances or services must recognise the same customer. [[slnc 500]]
Keep tokens short-lived. [[slnc 300]] Set the clock allowance on purpose. [[slnc 300]] Share revocation. [[slnc 300]] And guard the signing key.
"""

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Switch to", "an RSA key pair."]
narration = """
That's Token Authentication, with Spring Security. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Sign in once, carry signed proof, and let the framework check it on every request. [[slnc 500]]
The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs offline, with nothing installed except a Java development kit. [[slnc 500]]
Here is one exercise to try. [[slnc 300]] Switch to a key pair, so services can check tokens without being able to sign them. [[slnc 500]]
If this helped, a like really does help other people find it. [[slnc 300]] And subscribe, if you'd like the rest of the series. [[slnc 400]] Thanks for watching.
"""
