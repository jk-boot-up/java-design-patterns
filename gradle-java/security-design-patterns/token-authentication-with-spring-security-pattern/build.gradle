plugins {
    id 'java'
    id 'application'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.jk.explore'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot 4.1.1, the newest generally available release: a web server, Spring Security, and
    // Spring Security's resource-server support, which checks JSON Web Tokens with the Nimbus library.
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.jk.explore.tokenspring.SpringTokenAuthDemo'
}

bootJar {
    mainClass = 'com.jk.explore.tokenspring.SpringTokenAuthDemo'
}

test {
    useJUnitPlatform()
}
