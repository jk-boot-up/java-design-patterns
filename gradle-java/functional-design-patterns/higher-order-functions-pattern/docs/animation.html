<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Higher-Order Functions Pattern — Animated Walkthrough</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    background: #0f172a; color: #e2e8f0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    padding-top: calc(24px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  p.sub { color: #94a3b8; margin: 0 0 20px; max-width: 70ch; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  .stage { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  @media (max-width: 760px) { .stage { grid-template-columns: 1fr; } }
  .boxes { display: flex; flex-direction: column; gap: 10px; }
  .row { border: 2px solid #334155; border-radius: 10px; padding: 12px 16px;
         background: #1e293b; transition: all .25s ease; opacity: .55; }
  .row .name { font-weight: 700; font-size: 1rem; }
  .row .job { color: #94a3b8; font-size: .82rem; margin-top: 2px; }
  .row.active { opacity: 1; box-shadow: 0 0 0 2px currentColor inset; }
  .row.wrong { border-color: #f87171; color: #f87171; }
  .row.wrong.active { background: #3f1d24; }
  .row.ok { border-color: #34d399; color: #34d399; }
  .row.ok.active { background: #10261f; }
  .row.amber { border-color: #fbbf24; color: #fbbf24; }
  .row.amber.active { background: #2a2110; }
  .row.dim { opacity: .22; }
  .console { background: #020617; border: 1px solid #334155; border-radius: 10px; padding: 16px;
             font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: .86rem;
             line-height: 1.55; overflow-y: auto; min-height: 320px; white-space: pre-wrap; }
  #console-lines span.ok { color: #34d399; }
  #console-lines span.bad { color: #f87171; }
  #console-lines span.amber { color: #fbbf24; }
  #console-lines span.muted { color: #94a3b8; }
  .narration { background: #1e293b; border: 1px solid #334155; border-radius: 10px;
               padding: 14px 18px; margin-bottom: 16px; min-height: 3.2em; }
  .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  button { background: #334155; color: #e2e8f0; border: 1px solid #475569; border-radius: 8px;
           padding: 10px 18px; font-size: .92rem; cursor: pointer; }
  button:hover { background: #475569; }
  button:disabled { opacity: .45; cursor: default; }
  button#play { background: #7c3aed; border-color: #7c3aed; }
  button#play:hover { background: #8b5cf6; }
  #progress { color: #94a3b8; font-size: .85rem; margin-left: auto; }
  .step-label { font-size: .78rem; text-transform: uppercase; letter-spacing: .04em;
                color: #a78bfa; font-weight: 700; margin-bottom: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Higher-Order Functions — Step by Step</h1>
  <p class="sub">One filter loop takes tests as functions; small tests and price rules combine.</p>

  <div class="narration">
    <div class="step-label" id="step-label">Ready</div>
    <div id="narration">Press Step or Play to begin.</div>
  </div>

  <div class="stage">
    <div class="boxes" id="boxes">
      <div class="row" id="row-loops">
        <div class="name">Copied loops</div>
        <div class="job">one per question</div>
      </div>
      <div class="row" id="row-filter">
        <div class="name">filter(list, test)</div>
        <div class="job">one loop</div>
      </div>
      <div class="row" id="row-rules">
        <div class="name">Tests and price rules</div>
        <div class="job">made to order, combined</div>
      </div>
    </div>
    <div class="console"><div id="console-lines"></div></div>
  </div>

  <div class="controls">
    <button id="step">Step ▸</button>
    <button id="play">Play ▶</button>
    <button id="reset">Reset ↺</button>
    <span id="progress">0 / 0</span>
  </div>
</div>

<script>
const STEPS = [
 {
  "label": "Act 1 — A loop for every question",
  "narration": "First demo: a loop for every question. The catalogue can list products under ten. Products in stock. And mugs. Each question has its own method, with its own loop. The three loops are identical, except for one test in the middle. A new question, like cheap mugs that are in stock, means copying the loop again.",
  "rows": {
   "loops": "active wrong"
  },
  "console": [
   [
    "3 methods, 3 identical loops",
    "bad"
   ],
   [
    "a new question: a 4th copy",
    "bad"
   ]
  ]
 },
 {
  "label": "Act 2 — Pass the test in",
  "narration": "Second demo: one loop, and the test is passed in. There is now one filter method. It takes the list, and a function that says yes or no for each product. Pass in, price below ten. The blue mug, the mini lamp, and the tea towel. The same answer as before. A function that takes another function is called a higher-order function.",
  "rows": {
   "filter": "active ok"
  },
  "console": [
   [
    "price < 10: Blue mug, Mini lamp, Tea towel",
    "ok"
   ],
   [
    "same answers, one loop",
    "ok"
   ]
  ]
 },
 {
  "label": "Act 3 — Functions that make functions",
  "narration": "Third demo: functions that make functions. Price below ten returns a test, made to order. So does, in category mug. And, in stock. Tests can be joined with and. Price below ten, and a mug, and in stock. The blue mug. Price below twenty, and not in stock. The travel mug. New questions, built from small parts. And no new loop.",
  "rows": {
   "rules": "active ok",
   "filter": "active ok"
  },
  "console": [
   [
    "cheap, mug, in stock: Blue mug",
    "ok"
   ],
   [
    "under 20, sold out: Travel mug",
    "ok"
   ]
  ]
 },
 {
  "label": "Act 4 — Price rules as values",
  "narration": "Fourth demo: price rules are functions too. Twenty percent off is a function. Five off is another. They can be joined, one after the other. The desk lamp costs forty-five. Twenty percent off, then five off. Thirty-one. Five off, then twenty percent off. Thirty-two. The order matters. And the code makes the order plain.",
  "rows": {
   "rules": "active ok"
  },
  "console": [
   [
    "20% then 5 off: 31.00",
    "ok"
   ],
   [
    "5 off then 20%: 32.00",
    "amber"
   ]
  ]
 },
 {
  "label": "Act 5 — The bill",
  "narration": "Fifth demo: the bill. Small functions need good names. A long chain of unnamed functions can hide the rule it implements. And an error inside one shows a made-up name in the error report. So give important functions real names, like price below, and in stock. And keep each one short.",
  "rows": {
   "rules": "active amber"
  },
  "console": [
   [
    "anonymous lambdas hide rules",
    "amber"
   ],
   [
    "name them: priceBelow, inStock",
    "ok"
   ]
  ]
 }
];
const rowIds = ["loops", "filter", "rules"];
const stepLabel = document.getElementById("step-label");
const narrationEl = document.getElementById("narration");
const consoleEl = document.getElementById("console-lines");
const progressEl = document.getElementById("progress");
const playBtn = document.getElementById("play");
let i = -1, timer = null;

function esc(t) { return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

function render() {
  for (const id of rowIds) document.getElementById("row-" + id).className = "row";
  if (i < 0) {
    stepLabel.textContent = "Ready";
    narrationEl.textContent = "Press Step or Play to begin.";
    consoleEl.innerHTML = "";
    progressEl.textContent = "0 / " + STEPS.length;
    return;
  }
  const s = STEPS[i];
  stepLabel.textContent = s.label;
  narrationEl.textContent = s.narration;
  for (const id of rowIds) {
    const cls = s.rows[id];
    document.getElementById("row-" + id).className = "row " + (cls ? cls : "dim");
  }
  consoleEl.innerHTML = s.console.map(([t, c]) => '<span class="' + c + '">' + esc(t) + "</span>").join("\n");
  progressEl.textContent = (i + 1) + " / " + STEPS.length;
}
function step() { if (i >= STEPS.length - 1) { stopPlay(); return; } i += 1; render(); }
function reset() { stopPlay(); i = -1; render(); }
// While a step's narration is playing, Play waits for it to finish.
function speaking() { return typeof window.vkSpeaking === "function" && window.vkSpeaking(); }
function startPlay() {
  if (timer) return;
  playBtn.textContent = "Pause ❚❚";
  let quiet = 0;
  timer = setInterval(() => {
    if (speaking()) { quiet = 0; return; }
    if (++quiet < 6) return;                     // 6 × 500 ms of reading time
    quiet = 0;
    if (i >= STEPS.length - 1) { stopPlay(); return; }
    step();
  }, 500);
  if (i < 0) step();
}
function stopPlay() { if (timer) clearInterval(timer); timer = null; playBtn.textContent = "Play ▶"; }

document.getElementById("step").addEventListener("click", () => { stopPlay(); step(); });
document.getElementById("reset").addEventListener("click", reset);
playBtn.addEventListener("click", () => { if (timer) stopPlay(); else startPlay(); });
render();
</script>
<!-- videokit:narration -->
<script>
/* videokit narration player: a Narration on/off switch and a play/pause
   button for the current step. It watches the page's own narration text,
   works out which step is showing, and plays audio/step-N.m4a beside the
   page (rendered by tools/videokit; not embedded, so the page stays small).
   If the page already plays its own clips, only the pause button is added. */
(function () {
  "use strict";
  var STEPS = ["First demo: a loop for every question. The catalogue can list products under ten. Products in stock. And mugs. Each question has its own method, with its own loop. The three loops are identical, except for one test in the middle. A new question, like cheap mugs that are in stock, means copying the loop again.", "Second demo: one loop, and the test is passed in. There is now one filter method. It takes the list, and a function that says yes or no for each product. Pass in, price below ten. The blue mug, the mini lamp, and the tea towel. The same answer as before. A function that takes another function is called a higher-order function.", "Third demo: functions that make functions. Price below ten returns a test, made to order. So does, in category mug. And, in stock. Tests can be joined with and. Price below ten, and a mug, and in stock. The blue mug. Price below twenty, and not in stock. The travel mug. New questions, built from small parts. And no new loop.", "Fourth demo: price rules are functions too. Twenty percent off is a function. Five off is another. They can be joined, one after the other. The desk lamp costs forty-five. Twenty percent off, then five off. Thirty-one. Five off, then twenty percent off. Thirty-two. The order matters. And the code makes the order plain.", "Fifth demo: the bill. Small functions need good names. A long chain of unnamed functions can hide the rule it implements. And an error inside one shows a made-up name in the error report. So give important functions real names, like price below, and in stock. And keep each one short."];
  var norm = function (s) { return String(s || "").replace(/\s+/g, " ").trim(); };
  var box = document.getElementById("narration") || document.querySelector(".narration");
  if (!box || !STEPS.length) return;

  var pageOwnsAudio = !!document.getElementById("audio");
  var current = null, step = -1, on = false;
  try { on = localStorage.getItem("vk-narration") === "on"; } catch (e) {}

  // Remember whichever clip the page (or this script) last started.
  var realPlay = HTMLMediaElement.prototype.play;
  HTMLMediaElement.prototype.play = function () {
    if (current && current !== this) { try { current.pause(); } catch (e) {} }
    current = this;
    this.addEventListener("play", label);
    this.addEventListener("pause", label);
    this.addEventListener("ended", label);
    var p = realPlay.apply(this, arguments);
    label();
    return p;
  };

  // Lets a page's Play button wait for the step's narration to finish.
  window.vkSpeaking = function () { return !!(current && !current.paused && !current.ended); };

  var bar = document.querySelector(".controls") || box.parentNode;
  function button(id, text) {
    var b = document.createElement("button");
    b.id = id; b.type = "button"; b.textContent = text;
    bar.appendChild(b);
    return b;
  }
  var narrBtn = pageOwnsAudio ? null : button("vk-narration", "");
  var stepBtn = button("vk-step-audio", "");
  var note = document.createElement("span");
  note.id = "vk-note";
  note.style.cssText = "color:#94a3b8;font-size:.8rem;margin-left:8px";
  bar.appendChild(note);

  function stepFor(text) {
    var t = norm(text);
    for (var i = 0; i < STEPS.length; i++) {
      var s = norm(STEPS[i]);
      if (s && t.indexOf(s.slice(0, 60)) !== -1) return i;
    }
    return -1;
  }
  function stop() { if (current) { try { current.pause(); } catch (e) {} } current = null; label(); }
  function play(i) {
    if (i < 0) return;
    var a = new Audio("audio/step-" + (i + 1) + ".m4a");
    a.play().then(function () { note.textContent = ""; }, function (e) {
      note.textContent = e && e.name === "NotAllowedError"
        ? "Click Play step to hear this step."
        : "Narration audio not found: run tools/videokit/videokit.sh animation <project>.";
      label();
    });
  }
  function label() {
    if (narrBtn) narrBtn.textContent = (on ? "🔊 Narration: on" : "🔇 Narration: off");
    if (narrBtn) narrBtn.setAttribute("aria-pressed", String(on));
    var playing = current && !current.paused && !current.ended;
    var paused = current && current.paused && !current.ended;
    stepBtn.textContent = playing ? "⏸ Pause step" : paused ? "▶ Resume step" : "▶ Play step";
    stepBtn.disabled = step < 0;
  }

  if (narrBtn) narrBtn.addEventListener("click", function () {
    on = !on;
    try { localStorage.setItem("vk-narration", on ? "on" : "off"); } catch (e) {}
    if (on) { if (step >= 0) play(step); } else stop();
    label();
  });
  stepBtn.addEventListener("click", function () {
    if (current && !current.ended) {
      if (current.paused) current.play(); else current.pause();
    } else play(step);
  });

  function changed() {
    var i = stepFor(box.textContent);
    if (i === step) return;
    step = i;
    if (!pageOwnsAudio) { stop(); if (on) play(i); }
    label();
  }
  new MutationObserver(changed).observe(box, { childList: true, subtree: true, characterData: true });
  changed();
  label();
})();
</script>
<!-- /videokit:narration -->
</body>
</html>
