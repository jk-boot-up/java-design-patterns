]

[docs.session]
objectives = [
    "Define a higher-order function.",
    "Pass behaviour into a method as a `Predicate`.",
    "Return functions from functions, and combine them.",
    "Compose functions and explain why order matters.",
]
walkthrough = """
Run `./gradlew run` and compare act one's three loops with act two's one.
Open `Catalogue`: `filter` takes a function, `priceBelow` returns one. End on
act four's 31.00 and 32.00.
"""
exercises = [
    "Add `priceBetween(low, high)` using `priceBelow` and `negate`.",
    "Rewrite `filter` with `stream().filter(...)`.",
    "Add a price rule that rounds to the nearest .99.",
]

[docs.explained]
sentence = """
A higher-order function takes a function or returns one, so behaviour can be
passed in, made to order, and combined.
"""
verdict = """
Use higher-order functions when the same code shape repeats with a small part
changing. Pass that part in, build rules from small named functions, and
mind the order when composing.
"""
recognise = [
    "Method parameters typed `Predicate`, `Function` or `Comparator`.",
    "Factory methods that return lambdas.",
    "Chains of `and`, `andThen` and `thenComparing`.",
]

[spec]
purpose = """
Teach Higher-Order Functions with an online store's catalogue: three copied
filter loops, one filter taking a predicate, predicates made to order and
combined, price rules composed in two orders, and advice on naming.
"""
nongoals = [
    "Not a tour of streams. One plain loop keeps the idea visible.",
]
problem = """
Code copied for each question, differing only in a small piece of behaviour.
"""
roles = [
    ["Takes a function", "`Catalogue.filter`"],
    ["Returns functions", "`priceBelow`, `inCategory`, `inStock`, `percentOff`, `amountOff`"],
    ["The old way", "`CopyPasteFilters`"],
    ["The data", "`Product`"],
    ["Entry point", "`HigherOrderDemo`, five acts"],
]
requirements = [
    "**Same answers:** `filter` with a test matches the copied loop.",
    "**Composable:** predicates combine with `and` and `negate`.",
    "**Ordered:** composed price rules give different results in different orders.",
    "**Every printed result is asserted** in `DemoRunsTest`.",
]

