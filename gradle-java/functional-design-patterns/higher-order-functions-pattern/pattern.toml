# pattern.toml for the Higher-Order Functions project. See tools/patternkit.

[project]
slug = "higher-order-functions"
category = "functional-design-patterns"
title = "Higher-Order Functions"
package = "higherorder"
main_class = "HigherOrderDemo"
tagline = "Pass behaviour, not copies"
bold = "Write functions that take other functions, or return them, so one piece of code can serve many questions and small rules can be combined into bigger ones."
domain_note = ""
thumb_lines = ["HIGHER-ORDER", "FUNCTIONS"]
thumb_code = "filter(all, priceBelow(10))"
youtube_title = "Higher-Order Functions"
youtube_tags = ["higher order functions", "lambdas", "predicate", "function composition", "functional programming", "java"]

[readme]
intro = """
A higher-order function is a function that takes another function as an
argument, or returns one as its result. In Java, the functions are lambdas or
method references, typed as interfaces such as `Predicate` and `Function`.

Taking a function lets one method do many jobs: one `filter` loop, with the
test passed in, replaces a separate loop for every question. Returning a
function lets you make rules to order, like `priceBelow(10)`, and combine
them with `and`, `or` and `andThen`. Java's streams are built entirely on this
idea.
"""
analogy = """
Think of a coffee machine that takes pods. The machine does the hard part,
heat and pressure, once. The pod decides the drink. You do not buy a new
machine for each flavour; you pass a different pod in. And a pod can be made
to order: a strength and a flavour, combined.
"""
scenario = """
The online store's catalogue page answers questions such as "under 10",
"in stock" and "mugs". Each question had its own method with its own loop,
identical except for the one test in the middle. Every new question, such as
"mugs under 10 that are in stock", meant copying the loop again.
"""
costs = [
    "**Names matter more.** A long chain of anonymous lambdas can hide the rule it implements; name the important ones, like `priceBelow`.",
    "**Harder stack traces.** An error inside a lambda shows a generated name, not a method you wrote.",
    "**Order is meaning.** Joined rules run in order, and 20% off then 5 off is not the same as 5 off then 20% off.",
]
too_much = """
One loop with one test needs no function passed in. Higher-order functions
pay off when the same shape of code is repeated with only a small piece
changing.
"""
met_before = [
    "`stream().filter(...)`, `map(...)` and `sorted(Comparator.comparing(...))`.",
    "`Predicate.and`, `Function.andThen` and `Comparator.thenComparing`.",
    "Callbacks and event listeners, which pass a function to be called later.",
]
where = """
This project is in [functional-design-patterns](..), next to
[Railway-Oriented Programming](../railway-oriented-pattern), whose `flatMap`
is itself a higher-order function.
"""

[[act]]
title = "A loop for every question"
summary = "under10, inStock and mugs are 3 methods with 3 identical loops; a combined question would need a 4th."
detail = """
The catalogue has three methods: products under 10, products in stock, and
mugs. Each has its own loop, and the three loops are identical except for the
one test in the middle. A new question, such as mugs under 10 that are in
stock, would mean copying the loop a fourth time.
"""
speech = """
First demo: a loop for every question. [[slnc 400]] The catalogue can list products under ten. [[slnc 300]] Products in stock. [[slnc 300]] And mugs. [[slnc 600]]
Each question has its own method, with its own loop. [[slnc 300]] The three loops are identical, except for one test in the middle. [[slnc 600]]
A new question, like cheap mugs that are in stock, means copying the loop again.
"""
rows = { loops = "active wrong" }
console = [
    ["3 methods, 3 identical loops", "bad"],
    ["a new question: a 4th copy", "bad"],
]

[[act]]
title = "Pass the test in"
summary = "One filter method takes the test as a function: filter(all, p -> p.price() < 10) gives the same answer as the copied loop."
detail = """
Now there is one `filter` method, with one loop, and the test is passed in as
a function. `filter(all, p -> p.price() < 10)` returns the blue mug, the mini
lamp and the tea towel, the same answer as before. A function that takes
another function is a higher-order function.
"""
speech = """
Second demo: one loop, and the test is passed in. [[slnc 400]] There is now one filter method. [[slnc 300]] It takes the list, and a function that says yes or no for each product. [[slnc 600]]
Pass in, price below ten. [[slnc 300]] The blue mug, the mini lamp, and the tea towel. [[slnc 300]] The same answer as before. [[slnc 600]]
A function that takes another function is called a higher-order function.
"""
rows = { filter = "active ok" }
console = [
    ["price < 10: Blue mug, Mini lamp, Tea towel", "ok"],
    ["same answers, one loop", "ok"],
]

[[act]]
title = "Functions that make functions"
summary = "priceBelow(10).and(inCategory(\"mug\")).and(inStock()) finds the Blue mug; priceBelow(20).and(inStock().negate()) finds the Travel mug."
detail = """
A function can also return a function. `priceBelow(10)` returns a test made
to order, and tests combine with `and` and `negate`. Mugs under 10 that are in
stock is `priceBelow(10).and(inCategory("mug")).and(inStock())`: the blue
mug. Products under 20 that are sold out: the travel mug. New questions, and
no new loop.
"""
speech = """
Third demo: functions that make functions. [[slnc 400]] Price below ten returns a test, made to order. [[slnc 300]] So does, in category mug. [[slnc 300]] And, in stock. [[slnc 600]]
Tests can be joined with and. [[slnc 300]] Price below ten, and a mug, and in stock. [[slnc 300]] The blue mug. [[slnc 600]]
Price below twenty, and not in stock. [[slnc 300]] The travel mug. [[slnc 500]]
New questions, built from small parts. [[slnc 300]] And no new loop.
"""
rows = { rules = "active ok", filter = "active ok" }
console = [
    ["cheap, mug, in stock: Blue mug", "ok"],
    ["under 20, sold out: Travel mug", "ok"],
]

[[act]]
title = "Price rules as values"
summary = "Desk lamp 45.00: 20% off then 5 off is 31.00; 5 off then 20% off is 32.00."
detail = """
Price rules are functions too: `percentOff(20)` and `amountOff(5)`. They are
joined with `andThen`. For the 45.00 desk lamp, 20% off then 5 off gives
31.00, and 5 off then 20% off gives 32.00. The order of the functions matters,
and the code makes the order plain.
"""
speech = """
Fourth demo: price rules are functions too. [[slnc 400]] Twenty percent off is a function. [[slnc 300]] Five off is another. [[slnc 300]] They can be joined, one after the other. [[slnc 600]]
The desk lamp costs forty-five. [[slnc 300]] Twenty percent off, then five off. [[slnc 300]] Thirty-one. [[slnc 500]]
Five off, then twenty percent off. [[slnc 300]] Thirty-two. [[slnc 600]]
The order matters. [[slnc 300]] And the code makes the order plain.
"""
rows = { rules = "active ok" }
console = [
    ["20% then 5 off: 31.00", "ok"],
    ["5 off then 20%: 32.00", "amber"],
]

[[act]]
title = "The bill"
summary = "Anonymous lambdas can hide rules and show generated names in stack traces; name the important functions and keep them short."
detail = """
Small functions need good names. A chain of anonymous lambdas can hide the
business rule it implements, and an error inside one shows a generated name
in the stack trace. Give important functions names, like `priceBelow` and
`inStock`, and keep each one short.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] Small functions need good names. [[slnc 600]]
A long chain of unnamed functions can hide the rule it implements. [[slnc 300]] And an error inside one shows a made-up name in the error report. [[slnc 600]]
So give important functions real names, like price below, and in stock. [[slnc 300]] And keep each one short.
"""
rows = { rules = "active amber" }
console = [
    ["anonymous lambdas hide rules", "amber"],
    ["name them: priceBelow, inStock", "ok"],
]

[animation]
subtitle = "One filter loop takes tests as functions; small tests and price rules combine."
boxes = [
    ["loops", "Copied loops", "one per question"],
    ["filter", "filter(list, test)", "one loop"],
    ["rules", "Tests and price rules", "made to order, combined"],
]

[docs.problem]
scenario = """
The catalogue answers questions like "under 10", "in stock" and "mugs".
"""
naive = """
Each question had its own copy of the same loop, differing only in the test.
"""
deliver = [
    "Three copied loops.",
    "One `filter` taking a `Predicate`.",
    "Functions returning predicates, combined with `and` and `negate`.",
    "Price rules joined with `andThen`, where order matters.",
    "Advice on naming.",
    "Every printed result asserted by a test.",
]

