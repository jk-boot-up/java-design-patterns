[[scene]]
key = "01-poster"
kind = "poster"
title = "Higher-Order Functions"
narration = """
Hello, and welcome. [[slnc 400]] This video explains Higher-Order Functions, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] A higher-order function is a function that takes another function. [[slnc 300]] Or gives one back. [[slnc 500]] That lets one piece of code serve many questions. [[slnc 300]] And lets small rules be joined into bigger ones. [[slnc 600]]
Think of a coffee machine that takes pods. [[slnc 300]] The machine does the hard part once. [[slnc 300]] The pod decides the drink. [[slnc 300]] You do not buy a new machine for each flavour. [[slnc 300]] You pass a different pod in. [[slnc 700]]
In this video, the domain is an online shop's catalogue page, and its prices. [[slnc 500]]
By the end, you will hear how copied loops pile up. [[slnc 300]] How passing a test in replaces them. [[slnc 300]] How to make and join tests to order. [[slnc 300]] And why the order of price rules matters.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["The catalogue answers questions:", "under 10, in stock, mugs.", "", "One method and one loop", "per question."]
narration = """
Here is the scenario. [[slnc 400]] The shop's catalogue page answers questions. [[slnc 300]] Under ten. [[slnc 300]] In stock. [[slnc 300]] Mugs. [[slnc 500]]
Each question had its own method, and its own loop. [[slnc 500]]
The loops were identical, except for one test in the middle.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["Take a function:", "pass the behaviour in.", "", "Return a function:", "make rules to order.", "", "Combine them."]
narration = """
Let's name the pattern. [[slnc 400]] A function can take a function. [[slnc 300]] So the part that changes is passed in. [[slnc 500]]
A function can return a function. [[slnc 300]] So rules can be made to order. [[slnc 500]]
And functions can be joined, into bigger rules.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["filter: one loop, test passed in", "priceBelow, inStock: make tests", "percentOff, amountOff: make price rules", "and, andThen: join them"]
narration = """
Here is who does what. [[slnc 400]] Filter has the one loop, and takes the test as a function. [[slnc 500]]
Price below, and in stock, make tests to order. [[slnc 300]] Percent off, and amount off, make price rules. [[slnc 500]]
And, and and-then, join them together.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["stream().filter and map", "Comparator.comparing", "Predicate.and, Function.andThen", "Callbacks and listeners"]
narration = """
You have probably met this pattern already. [[slnc 400]] Java streams take functions in filter and map. [[slnc 500]]
Comparators are made by functions, and joined with then-comparing. [[slnc 500]]
And every callback or event listener is a function, passed in to be called later.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Code repeats with one", "small part changing.", "", "Pass that part in.", "Name your functions.", "Mind the order."]
narration = """
So, when should you use it? [[slnc 400]] When the same code repeats, with one small part changing. [[slnc 500]]
Pass that part in. [[slnc 300]] Give important functions names. [[slnc 300]] And mind the order when you join them.
"""

