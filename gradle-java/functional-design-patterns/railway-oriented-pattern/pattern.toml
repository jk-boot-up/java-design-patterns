[[scene]]
key = "01-poster"
kind = "poster"
title = "Railway-Oriented Programming"
narration = """
Hello, and welcome. [[slnc 400]] This video explains Railway-Oriented Programming, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] Picture two railway tracks, side by side. [[slnc 300]] One for success, one for failure. [[slnc 300]] Each step of a task runs on the success track. [[slnc 300]] If a step fails, the train switches to the failure track. [[slnc 300]] And every later step is skipped. [[slnc 600]]
Think of an airport baggage belt. [[slnc 300]] If the scanner rejects a bag, it is pushed onto a side belt that runs straight to the end. [[slnc 300]] No later station sees it. [[slnc 300]] And no bag can vanish without reaching one end or the other. [[slnc 700]]
In this video, the domain is an online shop's checkout, with four steps. [[slnc 500]]
By the end, you will hear how a forgotten exception became an error page. [[slnc 300]] How results keep the steps in a straight line. [[slnc 300]] How a failure skips the rest. [[slnc 300]] And where the railway stops helping.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["Checkout: validate, reserve,", "charge, email.", "", "Each step threw an exception.", "", "One was never caught."]
narration = """
Here is the scenario. [[slnc 400]] The shop's checkout has four steps. [[slnc 300]] Check the cart. [[slnc 300]] Reserve the stock. [[slnc 300]] Charge the card. [[slnc 300]] Email the confirmation. [[slnc 500]]
Each step threw its own exception when something went wrong. [[slnc 500]]
And when a new one was added, nobody caught it.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["Each step returns a Result.", "", "Chain with flatMap.", "First failure skips the rest.", "", "fold handles both tracks."]
narration = """
Let's name the pattern. [[slnc 400]] Each step returns a result, success or failure. [[slnc 500]]
The steps are chained with flat map. [[slnc 300]] The first failure skips the rest. [[slnc 500]]
And at the end, fold makes the caller handle both tracks.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["Result: Success or Failure", "flatMap: next step, if still on track", "map: a step that cannot fail", "recover: a way back", "fold: leave the railway"]
narration = """
Here is who does what. [[slnc 400]] Result is either a success, or a failure. [[slnc 500]]
Flat map runs the next step, only while still on the success track. [[slnc 300]] Map runs a step that can never fail. [[slnc 500]]
Recover offers a way back after a failure. [[slnc 300]] And fold leaves the railway, handling both tracks.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Optional.flatMap", "CompletableFuture.thenCompose", "Vavr Try and Either", "Kotlin and Rust Result"]
narration = """
You have probably met this pattern already. [[slnc 400]] Java's optional has map and flat map. [[slnc 300]] It is a railway whose failure track has no reason. [[slnc 500]]
Completable futures chain the same way. [[slnc 300]] The Vavr library has try and either. [[slnc 500]]
And Kotlin and Rust both have a result type built in.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Chains of steps that can fail.", "", "Return Results.", "Recover on purpose.", "Exceptions for the unexpected."]
narration = """
So, when should you use it? [[slnc 400]] For chains of steps that can each fail, for business reasons. [[slnc 500]]
Return results. [[slnc 300]] Recover on purpose. [[slnc 300]] And keep exceptions for the truly unexpected.
"""

