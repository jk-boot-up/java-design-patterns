# pattern.toml for the Currying project. See tools/patternkit.

[project]
slug = "currying"
category = "functional-design-patterns"
title = "Currying"
package = "currying"
main_class = "CurryingDemo"
tagline = "Fix some arguments now, the rest later"
bold = "Turn a function of several arguments into a chain of one-argument functions, so the arguments known early can be fixed once, leaving a smaller function for the ones that change."
domain_note = ""
thumb_lines = ["CURRYING"]
thumb_code = "CURRIED.apply(EU).apply(STANDARD)"
youtube_title = "Currying and Partial Application"
youtube_tags = ["currying", "partial application", "functional programming", "lambdas", "function", "java"]

[readme]
intro = """
Currying turns a function that takes several arguments into a chain of
functions that each take one. Instead of `price(zone, service, weight)`, you
have a function that takes a zone and returns a function that takes a
service, which returns a function that takes a weight.

The point is partial application: supplying some arguments now and the rest
later. A warehouse that always ships to the EU by standard post fixes those
two once, and is left with a simple function of weight alone. The name comes
from the logician Haskell Curry.
"""
analogy = """
Think of a coffee shop loyalty card that already knows your usual: oat milk,
large. At the counter you only say "latte" or "flat white". The usual choices
were fixed once, when the card was set up; only the part that changes is given
each time.
"""
scenario = """
The online store's shipping price depends on the zone, the service and the
weight. The EU warehouse only ever ships to the EU by standard post, yet
every call it made spelled out "EU, STANDARD" before the one argument that
actually changed: the weight.
"""
costs = [
    "**Noisy in Java.** The type `Function<Zone, Function<Service, Function<Double, Double>>>` and chains of `.apply` are hard to read.",
    "**Order is fixed.** Currying fixes arguments first to last, so they must be ordered from least to most changing; the wrong order gave nonsense.",
    "**Often a lambda is clearer.** `kg -> price(EU, STANDARD, kg)` does the same partial application in plain sight.",
]
too_much = """
When a function is always called with all its arguments, currying adds only
noise. It pays off when some arguments are known long before others, and the
smaller function is passed around or reused.
"""
met_before = [
    "Every function in Haskell and F# is curried.",
    "`Function<A, Function<B, R>>` in Java libraries such as Vavr, with `curried()`.",
    "Configured objects and factories: fixing settings once, then calling with the changing part.",
]
where = """
This project is in [functional-design-patterns](..), next to
[Higher-Order Functions](../higher-order-functions-pattern): a curried function
is a function that returns a function.
"""

[[act]]
title = "Repeated arguments"
summary = "The EU warehouse calls price(EU, STANDARD, kg) for 0.5, 2 and 10 kg: 7.00, 10.00, 26.00, repeating EU and STANDARD every time."
detail = """
The EU warehouse prices three parcels: half a kilo, two kilos and ten kilos.
Each call is `price(EU, STANDARD, weight)`: 7.00, 10.00 and 26.00. The zone and
service never change, but every call must repeat them, and every call could
get them wrong.
"""
speech = """
First demo: the same arguments, again and again. [[slnc 400]] The shipping price needs a zone, a service, and a weight. [[slnc 600]]
The EU warehouse prices three parcels. [[slnc 300]] Half a kilo, seven. [[slnc 300]] Two kilos, ten. [[slnc 300]] Ten kilos, twenty-six. [[slnc 600]]
Every call repeats, EU, and standard. [[slnc 300]] Only the weight changes.
"""
rows = { price = "active amber" }
console = [
    ["price(EU, STANDARD, 0.5) = 7.00", "muted"],
    ["price(EU, STANDARD, 2.0) = 10.00", "muted"],
    ["EU, STANDARD repeated every time", "amber"],
]

[[act]]
title = "A curried function"
summary = "euStandard = CURRIED.apply(EU).apply(STANDARD); euStandard.apply(2.0) is 10.00, the same as price(EU, STANDARD, 2.0)."
detail = """
The curried version takes one argument at a time. Applying it to EU returns a
function that wants a service; applying that to STANDARD returns a function
that wants only a weight. Call it `euStandard`. `euStandard.apply(2.0)` is
10.00, exactly what the three-argument call gave.
"""
speech = """
Second demo: a curried function. [[slnc 400]] It takes one argument at a time. [[slnc 600]]
Give it the zone, EU. [[slnc 300]] It gives back a function that wants a service. [[slnc 500]]
Give that one, standard. [[slnc 300]] It gives back a function that wants only a weight. [[slnc 300]] Call it, EU standard. [[slnc 600]]
EU standard, for two kilos. [[slnc 300]] Ten. [[slnc 300]] Exactly the same as before.
"""
rows = { curried = "active ok", ready = "active ok" }
console = [
    ["euStandard = CURRIED(EU)(STANDARD)", "muted"],
    ["euStandard(2.0) = 10.00", "ok"],
]

[[act]]
title = "Ready-made functions"
summary = "One function per zone is built at start-up: 2 kg standard is UK 5.00, EU 10.00, WORLD 20.00; EU express mapped over parcels gives 14, 20, 52."
detail = """
At start-up, the shop builds one ready-made function per zone for standard
post. A two-kilo parcel costs 5.00 to the UK, 10.00 to the EU and 20.00 to the
rest of the world. And because a ready-made function takes one argument, it
drops straight into `map`: checkout's parcels, EU express, cost 14.00, 20.00
and 52.00.
"""
speech = """
Third demo: ready-made functions. [[slnc 400]] At start-up, the shop builds one function per zone, for standard post. [[slnc 600]]
A two kilo parcel. [[slnc 300]] UK, five. [[slnc 300]] EU, ten. [[slnc 300]] Rest of the world, twenty. [[slnc 600]]
A ready-made function takes just one argument. [[slnc 300]] So it fits straight into map. [[slnc 500]]
Checkout's three parcels, EU express. [[slnc 300]] Fourteen, twenty, and fifty-two.
"""
rows = { ready = "active ok" }
console = [
    ["2 kg: UK 5.00, EU 10.00, WORLD 20.00", "ok"],
    ["EU express: [14.00, 20.00, 52.00]", "ok"],
]

[[act]]
title = "Argument order matters"
summary = "discount(percent, price) curried and given 20 is a 20%-off function: 45 becomes 36.00; with (price, percent), 20 fixes the price and gives 11.00."
detail = """
A helper, `curry`, turns any two-argument function into a curried one, fixing
the first argument first. With `discount(percent, price)`, applying 20 makes a
"20% off" function, and 45.00 becomes 36.00. Written the other way round,
`(price, percent)`, applying 20 fixes the price instead, and "applying 45"
gives 11.00, nonsense. Order arguments from least to most often changing.
"""
speech = """
Fourth demo: argument order matters. [[slnc 400]] Currying fixes the first argument first. [[slnc 600]]
A discount takes a percentage, then a price. [[slnc 300]] Fix twenty. [[slnc 300]] You have a twenty percent off function. [[slnc 300]] Forty-five becomes thirty-six. [[slnc 600]]
Now write it the other way round. [[slnc 300]] Price first, then percentage. [[slnc 300]] Fixing twenty now fixes the price. [[slnc 500]]
Apply forty-five, and you get eleven. [[slnc 300]] Nonsense. [[slnc 600]]
Put the arguments that change least, first.
"""
rows = { curried = "active amber" }
console = [
    ["(percent, price): 20% off 45 = 36.00", "ok"],
    ["(price, percent): gives 11.00", "bad"],
]

[[act]]
title = "The bill"
summary = "The type is Function<Zone, Function<Service, Function<Double, Double>>>; a plain lambda kg -> price(EU, STANDARD, kg) gives the same 10.00."
detail = """
Java makes currying noisy: the curried type is
`Function<Zone, Function<Service, Function<Double, Double>>>`, and calls are
chains of `.apply`. A plain lambda, `kg -> price(EU, STANDARD, kg)`, gives the
same 10.00 and is often clearer. Use currying where functions are built in
stages and passed around; use a lambda where one fixed call is enough.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] Java makes currying noisy. [[slnc 300]] The type is a function, returning a function, returning a function. [[slnc 600]]
A plain lambda can do the same job. [[slnc 300]] Weight goes in, and it calls price with EU, and standard. [[slnc 300]] Same answer, ten. [[slnc 500]]
And it is often clearer.
"""
rows = { curried = "active amber", price = "active ok" }
console = [
    ["Function<Zone, Function<Service, ...>>", "amber"],
    ["kg -> price(EU, STANDARD, kg): 10.00", "ok"],
]

