[[scene]]
key = "01-poster"
kind = "poster"
title = "Currying"
narration = """
Hello, and welcome. [[slnc 400]] This video explains Currying, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] Currying turns a function that takes several arguments into a chain of functions that each take one. [[slnc 300]] So the arguments you know early can be fixed once. [[slnc 300]] Leaving a smaller function, for the part that changes. [[slnc 600]]
Think of a coffee shop loyalty card that already knows your usual. [[slnc 300]] Oat milk, large. [[slnc 300]] At the counter you only say which drink. [[slnc 300]] The usual choices were fixed once. [[slnc 700]]
In this video, the domain is an online shop's shipping price, which depends on the zone, the service, and the weight. [[slnc 500]]
By the end, you will hear how repeated arguments pile up. [[slnc 300]] How a curried function fixes them once. [[slnc 300]] Why argument order matters. [[slnc 300]] And when a plain lambda is clearer.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["price(zone, service, weight).", "", "The EU warehouse always uses", "EU and STANDARD.", "", "Only the weight changes."]
narration = """
Here is the scenario. [[slnc 400]] The shipping price depends on the zone, the service, and the weight. [[slnc 500]]
The EU warehouse only ever ships to the EU, by standard post. [[slnc 500]]
Yet every call spelled out both, before the weight.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["One argument at a time.", "", "Each step returns a function", "that wants the next one.", "", "Fix early arguments once."]
narration = """
Let's name the pattern. [[slnc 400]] The function takes one argument at a time. [[slnc 500]]
Each step returns a function that wants the next argument. [[slnc 500]]
So the early arguments are fixed once. [[slnc 300]] This fixing is called partial application.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["price: all arguments at once", "CURRIED: zone, then service, then weight", "curry: makes any two-argument", "function curried"]
narration = """
Here is who does what. [[slnc 400]] Price takes all three arguments at once. [[slnc 500]]
Curried takes a zone, then a service, then a weight, one at a time. [[slnc 500]]
And the curry helper turns any two-argument function into a curried one.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Haskell and F#", "Vavr's curried()", "Factories and configured objects"]
narration = """
You have probably met this pattern already. [[slnc 400]] In Haskell and F sharp, every function is curried. [[slnc 500]]
The Vavr library adds a curried method to Java functions. [[slnc 500]]
And any factory that fixes settings once, then takes the changing part, is doing partial application.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Some arguments known early.", "", "Least-changing first.", "Reuse the smaller function.", "A lambda if clearer."]
narration = """
So, when should you use it? [[slnc 400]] When some arguments are known long before the others. [[slnc 500]]
Put the least-changing arguments first. [[slnc 300]] Reuse and pass around the smaller function. [[slnc 300]] And use a plain lambda when it reads better.
"""

