    { id = "l", label = "«record» Lens<S, A>", sub = ["get: S -> A", "set: (S, A) -> S", "+ modify(s, change)", "+ andThen(inner)"], col = 0, row = 0, colour = "accent" },
    { id = "o", label = "«record» Order", sub = ["id, customer, lines"], col = 1, row = 0, colour = "client" },
    { id = "c", label = "«record» Customer", sub = ["name, address"], col = 1, row = 1, colour = "client" },
