    { id = "b", label = "CUSTOMER_ADDRESS", sub = "customer -> address", col = 1, row = 0, colour = "accent" },
    { id = "c", label = "ADDRESS_POSTCODE", sub = "address -> postcode", col = 2, row = 0, colour = "accent" },
    { id = "d", label = "ORDER_POSTCODE", sub = "order -> postcode", col = 3, row = 0, colour = "green" },
]
edges = [
    { from = "a", to = "b", label = "andThen" },
    { from = "b", to = "c", label = "andThen" },
    { from = "c", to = "d", label = "" },
]

[[diagram]]
name = "class-diagram"
kind = "class"
title = "Lenses — classes"
