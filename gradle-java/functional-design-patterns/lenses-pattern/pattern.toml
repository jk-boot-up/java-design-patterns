[poster]
headline = [["LENSES", "text"]]
before = { code = "new Order(..., new Customer(...))", note = "street and city swapped", tag = "BEFORE" }
after = { code = "ORDER_POSTCODE.set(order, p)", note = "one line, old order intact", tag = "AFTER" }
taglines = [["Change deep inside, safely", "gold"]]

[[scene]]
key = "01-poster"
kind = "poster"
title = "Lenses for Immutable Updates"
narration = """
Hello, and welcome. [[slnc 400]] This video explains Lenses, for updating immutable data, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] Immutable objects can never be changed, only replaced. [[slnc 300]] A lens is a pair of functions for one part of such an object. [[slnc 300]] One reads the part. [[slnc 300]] The other returns a new object, with the part replaced. [[slnc 300]] And lenses can be joined, to reach deep inside. [[slnc 600]]
Think of a set of nesting dolls, glued shut. [[slnc 300]] To change the smallest doll, you must make new outer dolls around a new inner one. [[slnc 300]] A lens is a tool that does that for you. [[slnc 700]]
In this video, the domain is an online shop's orders. [[slnc 300]] An order holds a customer, who holds a delivery address. [[slnc 500]]
By the end, you will hear how rebuilding by hand went wrong. [[slnc 300]] How one lens works. [[slnc 300]] How lenses join. [[slnc 300]] And what they cost.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["Orders are immutable records:", "order, customer, address.", "", "Changing a postcode rebuilt", "all three by hand."]
narration = """
Here is the scenario. [[slnc 400]] The shop keeps orders as immutable records, three levels deep. [[slnc 300]] An order, holding a customer, holding an address. [[slnc 500]]
When a customer corrected a postcode, the code rebuilt all three, by hand. [[slnc 500]]
And in one place, the street and city were swapped.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["A lens: get and set", "for one part.", "", "Set returns a new whole.", "", "Lenses join to reach deep."]
narration = """
Let's name the pattern. [[slnc 400]] A lens has a get and a set, for one part of an object. [[slnc 500]]
Set returns a new whole, and leaves the old one alone. [[slnc 500]]
And lenses join, to reach deep inside.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["Lens: get, set, modify, andThen", "ADDRESS_POSTCODE: one field", "ORDER_POSTCODE: three joined", "Order, Customer, Address: the data"]
narration = """
Here is who does what. [[slnc 400]] A lens has get, set, modify, and and-then. [[slnc 500]]
The address postcode lens focuses on one field. [[slnc 300]] The order postcode lens is three lenses joined. [[slnc 500]]
And the order, customer, and address records are the data.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Monocle in Scala", "Arrow Optics in Kotlin", "Immer in JavaScript", "Lombok @With"]
narration = """
You have probably met this pattern already. [[slnc 400]] Scala has a lens library called Monocle. [[slnc 300]] Kotlin has Arrow Optics. [[slnc 500]]
JavaScript developers use Immer for the same job. [[slnc 500]]
And Lombok can generate with methods, the simple, one-level version.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Deeply nested immutable data.", "", "One lens per field.", "Join for deep paths.", "Test the three laws.", "Flat? Use a with method."]
narration = """
So, when should you use it? [[slnc 400]] For immutable data, nested several levels deep. [[slnc 500]]
Write one small lens per field. [[slnc 300]] Join them for deep paths. [[slnc 300]] Test the three lens laws. [[slnc 300]] And for flat data, a simple with method is enough.
"""

