Hello, and welcome. [[slnc 400]] This video explains Railway-Oriented Programming, with the Vavr library, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] Picture two railway tracks, one for success, one for failure. [[slnc 300]] Each step runs on the success track. [[slnc 300]] A failure switches to the other track, and every later step is skipped. [[slnc 500]] Vavr is an open-source functional library for Java that provides these tracks. [[slnc 600]]
Think of an airport baggage belt. [[slnc 300]] A rejected bag goes onto a side belt that runs to the end. [[slnc 700]]
In this video, the domain is an online shop's checkout. [[slnc 500]]
By the end, you will hear how Vavr's either type chains the steps. [[slnc 300]] How try catches a library's exception. [[slnc 300]] And how validation reports every problem at once.
