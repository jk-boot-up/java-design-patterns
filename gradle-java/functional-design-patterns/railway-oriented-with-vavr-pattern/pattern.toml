[docs.prerequisites]
required = [
    "Java basics: lambdas, method references, records.",
    "The Railway-Oriented idea, ideally from the plain Java version of this pattern.",
]
not_required = [
    "Earlier Vavr experience. The dependencies page explains the types used.",
]

[docs.dependencies]
intro = """
This project uses Vavr, which the plain Java version of Railway-Oriented
Programming does not. Skipping it loses none of the pattern: the plain
version teaches all of it with nothing installed.
"""
what = [
    ["Vavr", "Vavr is a functional library for Java. Either holds a Left or a Right; by convention Left is the failure and Right the success, and flatMap and map work on the Right, passing a Left straight through. fold turns either side into one answer. orElse supplies another Either when the first is a Left. Try.of runs code that may throw and holds the result or the exception; toEither turns it into an Either. Validation holds a valid value or errors; combine checks several Validations and collects all their errors."],
]
why = """
The plain version builds the idea. This version shows the library Java
developers most often use for it, and the Validation type that removes the
railway's one-error limit.
"""
install_note = "Only a JDK, version 21. Gradle downloads the rest, and the version is pinned:"
versions = [
    ["Java", "21"],
    ["Vavr", "1.0.1"],
]
costs = [
    "A library and its conventions to learn.",
]

[docs.session]
objectives = [
    "Chain steps with Vavr's Either and flatMap.",
    "Wrap throwing code with Try and toEither.",
    "Recover with orElse.",
    "Collect all errors with Validation.combine.",
]
walkthrough = """
Run `./gradlew run`. Open `CheckoutSteps.checkout`: four flatMaps. Open
`charge`: Try around the library. End on act five's two answers for the same
form.
"""
exercises = [
    "Add a coupon step that can fail, returning Either.",
    "Recover only from out-of-stock failures, and let others through.",
    "Add a postcode check to the Validation.",
]

[docs.explained]
sentence = """
With Vavr, the railway is Either: steps chained with flatMap, exceptions
brought on with Try, and every problem collected with Validation when needed.
"""
verdict = """
Use Either for chains of steps that can fail, Try at the edge where code
throws, and Validation for forms where every problem should be reported.
"""
recognise = [
    "Methods returning `Either<Failure, T>`.",
    "`Try.of(...).toEither()` around library calls.",
    "`Validation.combine(...).ap(...)` for form checks.",
]

