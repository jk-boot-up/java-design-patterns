# pattern.toml for the Railway-Oriented Programming with Vavr project. See tools/patternkit.

[project]
slug = "railway-oriented-with-vavr"
category = "functional-design-patterns"
title = "Railway-Oriented Programming with Vavr"
package = "railwayvavr"
main_class = "VavrRailwayDemo"
tagline = "Either, Try and Validation"
bold = "Build the checkout railway with Vavr: Either for the two tracks, Try to move a throwing library onto them, and Validation to collect every problem in a form instead of stopping at the first."
youtube_description = """Railway-Oriented Programming in Java with Vavr, an open-source functional library that provides the two tracks, using an online store checkout. Each step runs on the success track and a failure switches to the other track so every later step is skipped. We wrap a throwing library, chain the steps with Vavr's Either, skip on failure and catch exceptions with Try, recover with map and orElse, and use Validation to report every problem in a form at once. Keep failures on their own track, and when checking a form, collect them all."""
domain_note = ""
thumb_lines = ["RAILWAY-ORIENTED", "WITH VAVR"]
thumb_code = "Either<Failure, Cart>"
youtube_title = "Railway-Oriented Programming with Vavr"
youtube_tags = ["railway oriented programming", "vavr", "either", "validation", "functional java", "java"]

[readme]
intro = """
This is the library version of Railway-Oriented Programming. The plain Java
version, a separate project in this category, writes its own sealed Result
type. Here Vavr, the best-known functional library for Java, provides the
types. `Either<Failure, Cart>` is the railway: Left is the failure track,
Right the success track, and `flatMap` runs the next step only on the success
track.

Vavr adds two things the plain version did not have. `Try` wraps code that
throws, such as a payment company's client library, and `toEither()` puts its
exception onto the failure track. And `Validation` checks several fields
independently and collects every problem, which the plain version named as
the railway's limit.
"""
analogy = """
Think of an airport baggage belt with inspection points: a rejected bag is
pushed onto a side belt that runs to the end. That is Either. Try is a
station that catches a bag falling off the belt and puts it on the side belt
instead of on the floor. Validation is a customs desk that checks every item
in a bag and lists all the problems at once.
"""
scenario = """
The online store's checkout has four steps: check the cart, reserve stock,
charge the card, email the confirmation. The payment company's client library
reports a declined card by throwing an exception, and a controller that forgot
to catch it showed customers an internal server error.
"""
run_note = """
Nothing to install beyond a Java 21 JDK: Vavr is a library, downloaded by
Gradle.
"""
twin = """
The plain Java version got the idea right: steps return success or failure,
flatMap skips the rest after the first failure, map lifts plain steps, and
there is a way back; and it named the limit, that a chain reports only the
first problem. What it left out is a standard library for it. Vavr's Either
is the railway, used across many codebases. Try brings code that throws onto
the railway. And Validation removes the limit the plain version admitted: an
empty cart with no card now reports both problems at once.
"""
technologies = [
    ["Vavr", "1.0.1", "Either, Try and Validation"],
]
costs = [
    "**A library to learn and carry.** Either, Try and Validation each have their own methods.",
    "**Left and Right.** Which side is failure is a convention, easy to mix up at first.",
    "**Two tools for two jobs.** Either stops at the first failure; Validation collects them all; choose on purpose.",
]
too_much = """
For one or two steps, an if statement is clearer than a library. Vavr pays off
in code with many steps that can fail for business reasons, or many fields to
check.
"""
met_before = [
    "Vavr's `Either`, `Try` and `Validation` in Java codebases.",
    "Kotlin's `Result` and Arrow's `Either`.",
    "Scala's `Either` and `Try`, which Vavr is modelled on.",
]
where = """
This project is in [functional-design-patterns](..). It is the library
version of the plain Java Railway-Oriented Programming project in the same
category, which is left unchanged.
"""

[[act]]
title = "A throwing library"
summary = "The payment library throws \"card declined\"; nothing makes the caller handle it."
detail = """
The payment company's client library reports a declined card by throwing an
exception. Nothing in Java makes the caller handle it, and a controller that
forgot to catch it answers 500, an internal server error.
"""
speech = """
First demo: a library that throws. [[slnc 400]] The payment company's library reports a declined card by throwing an exception. [[slnc 600]]
Nothing forces the caller to handle it. [[slnc 300]] A controller that forgot, shows the customer an internal error.
"""
rows = { charge = "active wrong" }
console = [
    ["threw \"card declined\"", "bad"],
]

[[act]]
title = "Either"
summary = "Each step returns Either<Failure, Cart>, chained with flatMap: 2 mugs and a good card are confirmed, and all four steps ran."
detail = """
Each step returns Vavr's `Either<Failure, Cart>`, and the checkout is one
chain of `flatMap` calls. Two mugs with a good card stay on the success track
through all four steps, and the order is confirmed.
"""
speech = """
Second demo: Vavr's either type. [[slnc 400]] Each step returns either a failure, on the left, or a cart, on the right. [[slnc 600]]
The steps are chained with flat map. [[slnc 500]]
Two mugs, a good card. [[slnc 300]] All four steps run. [[slnc 300]] Order confirmed.
"""
rows = { validate = "active ok", reserve = "active ok", charge = "active ok", email = "active ok" }
console = [
    ["200 order ORD-1 confirmed", "ok"],
]

[[act]]
title = "Skipping, and Try"
summary = "An empty cart fails at validate and skips the rest; a declined card fails at charge, because Try.of(...).toEither() caught the library's exception."
detail = """
An empty cart fails at validate, on the Left, and the other three steps are
skipped. A declined card fails at charge: the step wraps the library call in
`Try.of`, and `toEither()` turns its exception into a Left, so the failure
travels the railway like any other.
"""
speech = """
Third demo: the failure track. [[slnc 400]] An empty cart fails at the first step. [[slnc 300]] The other three are skipped. [[slnc 600]]
A declined card fails at charge. [[slnc 300]] The library threw an exception. [[slnc 300]] Vavr's try caught it, and put it on the failure track. [[slnc 500]]
So it is handled like any other failure.
"""
rows = { validate = "active ok", charge = "active wrong", email = "active amber" }
console = [
    ["empty cart: 422 (at validate)", "amber"],
    ["declined: 422 (at charge), via Try", "amber"],
]

[[act]]
title = "map and orElse"
summary = "20% tax with map gives 23.98 for 2 mugs; an out-of-stock lamp becomes a back-order with orElse."
detail = """
A step that cannot fail, adding 20% tax, rides along with `map`: two mugs come
to 23.98. And `orElse` offers a way back: when the lamp is out of stock, the
checkout's failure is replaced by a back-order.
"""
speech = """
Fourth demo: plain steps, and a way back. [[slnc 400]] Adding tax cannot fail, so it rides along with map. [[slnc 300]] Twenty-three ninety-eight. [[slnc 600]]
The lamp is out of stock. [[slnc 300]] Or else turns the failure into a back-order.
"""
rows = { reserve = "active amber", email = "active ok" }
console = [
    ["with tax: 23.98", "ok"],
    ["lamp: back-order", "ok"],
]

[[act]]
title = "Validation"
summary = "An empty cart with no card: the Either chain reports only the empty cart; Validation.combine reports both problems."
detail = """
A cart that is empty and has no card. The Either chain stops at the first
failure and reports only the empty cart. Vavr's `Validation` checks each
field on its own and `combine` collects the results: "the cart is empty and
no card given", both at once, so the customer can fix everything together.
"""
speech = """
Fifth demo: collecting every problem. [[slnc 400]] A cart that is empty, and has no card. [[slnc 600]]
The either chain stops at the first failure. [[slnc 300]] It reports only the empty cart. [[slnc 600]]
Vavr's validation checks every field, and combines the results. [[slnc 300]] The cart is empty, and no card given. [[slnc 300]] Both at once.
"""
rows = { validate = "active ok" }
console = [
    ["Either: 1 problem", "amber"],
    ["Validation: both problems", "ok"],
]

