# pattern.toml for the Extension Object project. See tools/patternkit.

[project]
slug = "extension-object"
category = "foundational-design-patterns"
title = "Extension Object"
package = "extensionobject"
main_class = "ExtensionObjectDemo"
tagline = "Attach roles, don't grow classes"
bold = "Keep the core class small, let other code attach extra roles to individual objects, and let clients ask whether an object has the role they need."
youtube_description = """Extension Object pattern in Java, explained with an online store that sells downloadable e-books, kettles with a warranty, plain mugs, and later coffee subscriptions. The core class stays small, other code attaches extra roles to individual objects, and code that needs a role asks whether the object has it, like visas added to a passport that a border guard checks without the passport ever being reprinted. We watch one product class grow a field for everything, shrink it to a core with roles, ask for a role safely, and add a new role without touching the core. We finish with the bill."""
domain_note = ""
thumb_lines = ["EXTENSION", "OBJECT"]
thumb_code = "p.extension(Warranty.class)"
youtube_title = "Extension Object"
youtube_tags = ["extension object", "design patterns", "roles", "open closed principle", "java"]

[readme]
intro = """
Extension Object is a pattern for adding new abilities to objects without
changing their class. The core class stays small. Other code attaches extra
roles, called extensions, to individual objects: this product has a warranty,
that one can be downloaded. Code that needs a role asks the object for it by
type, and gets either the extension or an answer that says "not supported".

It stops a central class from growing a field for every feature any object
has ever needed, and lets different teams add their own roles without editing
a class that everyone depends on.
"""
analogy = """
Think of a passport. The passport itself holds only the basics: your name,
your photo, your nationality. When you travel, other countries add visas to its
pages, each one issued by a different authority. A border guard does not read
every page; they ask one question: is there a valid visa for here? And no
country ever has to reprint your passport to add its visa.
"""
scenario = """
The online store's product class grew a field for every feature: a download
link and download limit for e-books, a warranty for electricals, gift wrap, an
age limit. A plain mug left most of them empty, and every new feature meant
editing the class the whole shop depends on. Now the subscriptions team wants
to sell coffee beans every four weeks.
"""
costs = [
    "**No compile-time guarantee.** An e-book added without its download role compiles, sells, and delivers nothing.",
    "**Abilities are hidden.** Reading the product class no longer tells you what a product can do.",
    "**Lookups by type.** Every client asks \"do you have this?\" and must handle \"no\".",
]
too_much = """
When every object of a class has the same few abilities, ordinary fields and
methods are simpler and checked by the compiler. Extension objects are for
abilities that only some objects have, that keep arriving, and that different
parts of a system own.
"""
met_before = [
    "Eclipse's `IAdaptable.getAdapter(Class)`, which asks an object for another role.",
    "`Optional`-returning lookups such as `unwrap(Class)` in JDBC and JPA.",
    "Entity-component systems in games, where an entity is a bag of components.",
    "Product attribute tables in shop platforms, where each product has only the attributes it needs.",
]
where = """
This project is in [foundational-design-patterns](..), next to
[Role Object](../role-object-pattern), which is a close cousin:
there the added roles are objects with their own behaviour, wrapped around a
core.
"""

[[act]]
title = "One class, every field"
summary = "FatProduct has 8 fields and a mug leaves 5 of them empty; subscriptions would mean a 9th field in the class everyone depends on."
detail = """
`FatProduct` has a field for everything: download link and limit, warranty,
gift wrap, age limit. A mug uses three of its eight fields and leaves five
empty. Selling subscriptions would mean a ninth field, added to the one class
that every part of the shop depends on.
"""
speech = """
First demo: one product class, with a field for every feature. [[slnc 400]] A download link, and a download limit, for e-books. [[slnc 300]] A warranty, for electricals. [[slnc 300]] Gift wrap. [[slnc 300]] An age limit. [[slnc 600]]
The product class has eight fields. [[slnc 300]] A plain mug leaves five of them empty. [[slnc 500]]
Now the shop wants to sell subscriptions. [[slnc 300]] That means a ninth field, in the class that every part of the shop depends on.
"""
rows = { fat = "active wrong" }
console = [
    ["FatProduct: 8 fields", "amber"],
    ["a mug leaves 5 of them empty", "bad"],
    ["subscriptions: a 9th field", "bad"],
]

[[act]]
title = "A small core, with roles"
summary = "Product has 3 fields; the e-book carries a Download role, the kettle a Warranty, the mug none."
detail = """
`Product` now holds only a code, a name and a price. Extra roles are attached
to individual products with `with`: the e-book gets a `Download` role, the
kettle a `Warranty`. The mug gets nothing. The product class knows nothing
about downloads or warranties.
"""
speech = """
Second demo: a small core product, with extra roles attached. [[slnc 400]] The product class now has three fields. [[slnc 300]] A code, a name, and a price. [[slnc 600]]
Extra roles are attached to individual products. [[slnc 300]] The e-book gets a download role. [[slnc 300]] The kettle gets a warranty role. [[slnc 300]] The mug gets nothing. [[slnc 500]]
The product class itself knows nothing about downloads, or warranties.
"""
rows = { product = "active ok", download = "active ok", warranty = "active ok" }
console = [
    ["e-book: [Download]", "ok"],
    ["kettle: [Warranty]; mug: []", "ok"],
    ["Product: 3 fields", "ok"],
]

[[act]]
title = "Asking for a role"
summary = "After payment, checkout asks each product for its roles: it emails the e-book link and registers the kettle's 2-year warranty."
detail = """
After payment, `Checkout` asks each product: do you have a `Download` role? A
`Warranty`? The e-book answers with a download link, which is emailed with its
limit of three downloads. The kettle's two-year warranty is registered. The mug
answers "no" to both, so nothing extra happens.
"""
speech = """
Third demo: checkout asks each product, do you have this role? [[slnc 400]] Like a border guard asking for the right visa. [[slnc 500]]
The e-book has a download role. [[slnc 300]] So checkout emails a download link, with a limit of three downloads. [[slnc 500]]
The kettle has a warranty role. [[slnc 300]] So checkout registers a two-year warranty. [[slnc 500]]
The mug says no to both. [[slnc 300]] Nothing extra happens.
"""
rows = { checkout = "active ok", download = "active ok", warranty = "active ok" }
console = [
    ["EBOOK-1: email link (3 downloads)", "ok"],
    ["KETTLE-1: register a 2-year warranty", "ok"],
    ["MUG-1: nothing extra", "muted"],
]

[[act]]
title = "A new role"
summary = "The subscriptions team adds a Subscription role; coffee beans are delivered every 4 weeks, with Product.java unchanged."
detail = """
The subscriptions team writes its own `Subscription` record and attaches it to
the coffee beans. Checkout schedules a delivery every four weeks. `Product`
did not change; the team owns its own role.
"""
speech = """
Fourth demo: a new role, added without editing the product class. [[slnc 400]] The subscriptions team writes its own small role. [[slnc 300]] A subscription, with how often to deliver. [[slnc 500]]
It is attached to the coffee beans. [[slnc 300]] Checkout schedules a delivery every four weeks. [[slnc 500]]
The product class did not change at all.
"""
rows = { subscription = "active ok", checkout = "active ok", product = "active ok" }
console = [
    ["BEANS-1: a delivery every 4 weeks", "ok"],
    ["Product.java unchanged", "ok"],
]

[[act]]
title = "The bill"
summary = "An e-book added without its Download role compiles and sells: 0 actions after payment, and the customer gets nothing."
detail = """
Nothing checks that a product has the roles it should. A second e-book is
added without its `Download` role. It compiles and sells; after payment there
are zero actions, and the customer receives nothing. And reading `Product` no
longer tells anyone what a product can do.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] Nothing checks that a product has the roles it should. [[slnc 500]]
A second e-book is added, without its download role. [[slnc 300]] The compiler does not complain. [[slnc 300]] The e-book sells. [[slnc 300]] After payment, nothing happens. [[slnc 300]] The customer paid, and got nothing. [[slnc 600]]
And reading the product class no longer tells you what a product can do.
"""
rows = { product = "active wrong", checkout = "active amber" }
console = [
    ["EBOOK-2 without Download: 0 actions", "bad"],
    ["the compiler did not complain", "amber"],
]

[animation]
subtitle = "A small product carries only the roles attached to it; checkout asks for each role and acts on the ones it finds."
boxes = [
    ["fat", "FatProduct", "a field for every feature"],
    ["product", "Product", "code, name, price"],
    ["download", "Download role", "link, download limit"],
    ["warranty", "Warranty role", "years"],
    ["subscription", "Subscription role", "every N weeks, added later"],
    ["checkout", "Checkout", "asks: do you have this role?"],
]

[docs.problem]
scenario = """
The store sells e-books, electricals, mugs and, soon, subscriptions. Each
needs different extra information and actions after payment.
"""
naive = """
`FatProduct` has a field for every feature. A mug leaves five of eight empty,
and every new feature is another field in the class the whole shop depends on.
"""
deliver = [
    "The fat class shown: 8 fields, 5 empty for a mug.",
    "A 3-field core product with roles attached per object.",
    "Checkout acting on the roles it finds and ignoring the rest.",
    "A new role added with no change to the product class.",
    "The cost shown: a missing role that compiles and delivers nothing.",
    "Every printed result asserted by a test.",
]

[docs.prerequisites]
required = [
    "Java basics: classes, records, maps.",
    "`Optional` and `Class` objects such as `Warranty.class`, at a beginner level.",
]
not_required = [
    "Generics beyond `<T>` in one method signature.",
]

[docs.session]
objectives = [
    "Recognise a class that grows a field for every feature.",
    "Attach roles to individual objects and look them up by type.",
    "Handle a missing role as \"not supported\".",
    "Explain what is lost: compile-time checks and discoverability.",
]
walkthrough = """
Run `./gradlew run` and open `FatProduct`, counting the empty fields for a mug.
Then open `Product`: three fields, `with` and `extension`. Finish in
`Checkout.afterPayment`, where each role is asked for and acted on.
"""
exercises = [
    "Add a `GiftWrap` role and make checkout print a wrapping note.",
    "Write a startup check that every product in the `ebooks` category has a Download role.",
    "Let a role have behaviour: give `Warranty` a method that works out its expiry date.",
    "List every product that has a Warranty role.",
]

[docs.explained]
sentence = """
An extension object lets code attach extra roles to individual objects and
lets clients ask for a role by type, so a core class stays small while new
abilities keep arriving.
"""
verdict = """
Use it when abilities belong to some objects and not others, keep arriving,
and are owned by different teams. Check at startup that objects have the roles
they must, and keep a list of the roles that exist so developers can find them.
"""
recognise = [
    "Methods like `getExtension(Class)`, `getAdapter(Class)` or `unwrap(Class)`.",
    "A map from a type to an object inside a core class.",
    "Client code that does `.extension(X.class).ifPresent(...)`.",
]

[spec]
purpose = """
Teach Extension Object with an online store's products: a fat product class (8
fields, 5 empty for a mug), then a 3-field core with Download, Warranty and
Subscription roles attached per product, checkout acting on the roles it
finds, and the cost of a missing role.
"""
nongoals = [
    "Not a plug-in framework. Roles are attached in code.",
    "Not persistence of roles.",
]
problem = """
A central class that grows a field for every feature some of its objects need
fills with empty fields and must be edited for every new feature.
"""
roles = [
    ["The pattern", "`Product` (`with`, `extension`)"],
    ["The roles", "`Extensions.Download`, `Warranty`, `Subscription`"],
    ["The client", "`Checkout`"],
    ["The naive version", "`FatProduct`"],
    ["Entry point", "`ExtensionObjectDemo`, five acts"],
]
requirements = [
    "**Small core:** `Product` has three fields.",
    "**Per-object roles:** roles attach to individual products.",
    "**Missing is not an error:** an absent role is an empty Optional.",
    "**Open to new roles:** a subscription needs no change to Product.",
    "**Every printed result is asserted** in `DemoRunsTest`.",
]

