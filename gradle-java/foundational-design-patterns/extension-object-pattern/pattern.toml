[[scene]]
key = "01-poster"
kind = "poster"
title = "Extension Object"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Extension Object pattern, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] With an extension object, the core class stays small. [[slnc 300]] Other code attaches extra roles to individual objects. [[slnc 300]] And code that needs a role asks the object whether it has it. [[slnc 600]]
Think of a passport. [[slnc 300]] It holds only the basics: your name, and your photo. [[slnc 300]] Other countries add visas to its pages. [[slnc 300]] A border guard asks one question: is there a visa for here? [[slnc 300]] And no country has to reprint your passport. [[slnc 700]]
In this video, the domain is an online shop. [[slnc 300]] It sells e-books that can be downloaded, kettles with a warranty, plain mugs, and later, coffee subscriptions. [[slnc 500]]
By the end, you will hear how a product class fills up with empty fields. [[slnc 300]] How attached roles fix it. [[slnc 300]] How a new role needs no change to the core. [[slnc 300]] And what the pattern costs.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["E-books: a download link.", "Kettles: a warranty.", "Mugs: nothing extra.", "", "Every feature became a field", "on one product class."]
narration = """
Here is the scenario. [[slnc 400]] The shop sells very different things. [[slnc 500]]
E-books need a download link. [[slnc 300]] Kettles need a warranty. [[slnc 300]] Mugs need nothing extra at all. [[slnc 600]]
Every one of those features became a field on one product class. [[slnc 300]] And the whole shop depends on that class.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["Keep the core class small.", "", "Attach roles to individual objects.", "", "Ask for a role by type:", "you get it, or \"not supported\"."]
narration = """
Let's name the pattern. [[slnc 400]] Keep the core class small. [[slnc 500]]
Attach extra roles to the individual objects that need them. [[slnc 300]] This e-book can be downloaded. [[slnc 300]] That kettle has a warranty. [[slnc 500]]
Code that needs a role asks for it by type. [[slnc 300]] It gets the role, or an answer that says: not supported.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["Product: code, name, price, roles", "Download, Warranty, Subscription:", "the roles, owned by different teams", "Checkout: asks and acts", "FatProduct: the old way"]
narration = """
Here is who does what. [[slnc 400]] Product holds a code, a name, a price, and whatever roles are attached to it. [[slnc 500]]
Download, warranty, and subscription are the roles. [[slnc 300]] Each is a small record, owned by a different team. [[slnc 500]]
Checkout asks each product for the roles it knows about, and acts on the ones it finds. [[slnc 500]]
And fat product is the old way, kept for comparison.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["getAdapter(Class) in Eclipse", "unwrap(Class) in JDBC and JPA", "Entity-component systems in games", "Product attributes in shop platforms"]
narration = """
You have probably met this pattern already. [[slnc 400]] Eclipse asks objects for other roles with a method called get adapter. [[slnc 500]]
J D B C and J P A have a method called unwrap, which asks for a more specific role. [[slnc 500]]
Games build characters as a bag of components. [[slnc 300]] And shop platforms give each product only the attributes it needs.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Abilities belong to some objects,", "keep arriving, and have", "different owners.", "", "Check required roles at startup.", "Keep a list of roles that exist."]
narration = """
So, when should you use it? [[slnc 400]] When abilities belong to some objects and not others. [[slnc 300]] When new ones keep arriving. [[slnc 300]] And when different teams own them. [[slnc 500]]
Check at startup that objects have the roles they must. [[slnc 300]] And keep a list of the roles that exist, so developers can find them. [[slnc 500]]
When every object has the same abilities, plain fields are simpler.
"""

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Check every e-book", "has its Download role."]
narration = """
That's the Extension Object pattern. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Keep the core small, and attach roles to the objects that need them. [[slnc 500]]
The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs offline, with nothing installed except a Java development kit. [[slnc 500]]
Here is one exercise to try. [[slnc 300]] Write a startup check that every e-book has its download role. [[slnc 500]]
If this helped, a like really does help other people find it. [[slnc 300]] And subscribe, if you'd like the rest of the series. [[slnc 400]] Thanks for watching.
"""
