# pattern.toml for the Immutable Object project. See tools/patternkit.

[project]
slug = "immutable-object"
category = "foundational-design-patterns"
title = "Immutable Object"
package = "immutable"
main_class = "ImmutableObjectDemo"
tagline = "Never change it, make a new one"
bold = "An object that can never change after it is made can be shared with anyone, read at any moment, and used as a key, because nobody can alter it behind your back."
domain_note = ""
thumb_lines = ["IMMUTABLE", "OBJECT"]
thumb_code = "record Address(...)"
youtube_title = "Immutable Object"
youtube_tags = ["immutable object", "java records", "immutability", "thread safety", "value object", "java"]

[readme]
intro = """
An immutable object is one whose state cannot change after it is created. It
has no setters, all its fields are final, and anything it holds that could
change, such as a list or a map, is copied in and handed out read-only. To
"change" it, you make a new object with the difference, and the old one stays
exactly as it was.

That one rule removes a whole family of bugs: objects changed through another
reference, objects seen half-changed, and objects lost inside a hash set. In
Java, a `record` gives you most of it for free.
"""
analogy = """
Think of a printed till receipt, and compare it with the whiteboard behind a
café counter. Anyone with a cloth can rub out a price on the whiteboard, and a
customer reading it at that moment might see half the old menu and half the
new. A receipt never changes. If something about your purchase changes, the
shop prints a new receipt, and the old one still says exactly what it said.
"""
scenario = """
The online store passes addresses and price lists around everywhere: an order
keeps the address it ships to, checkout reads the price list, and a set records
addresses with failed deliveries. All of them were ordinary objects with
setters, shared by reference.
"""
costs = [
    "**Every change is a copy.** Changing one price in a 1000-item list makes a new list of 1000 entries.",
    "**More methods.** Each field you might change needs a `with...` method that builds the new object.",
    "**Deep care.** A final field that points at a mutable list is not immutable; the list must be copied in and handed out read-only.",
    "**Some things must change.** A shopping cart or a counter changes all the time; forcing it to be immutable can make code harder, not easier.",
]
too_much = """
Objects that exist to be changed, such as a builder, a cart being filled or an
entity tracked by a database library, are usually clearer as mutable objects
with one owner. Make values immutable: addresses, prices, dates, identifiers,
settings, messages.
"""
met_before = [
    "`String`, `Integer`, `LocalDate` and `BigDecimal` are all immutable.",
    "Java `record`s, and `List.of`, `Map.of`, `List.copyOf`.",
    "The Value Object pattern in domain-driven design.",
    "Immutable state in React and Redux, and in functional languages.",
]
where = """
This project is in [foundational-design-patterns](..). It is the building block
behind [Value Object](../../domain-driven-design-patterns/value-object-pattern)
and [Money](../../enterprise-design-patterns/money-pattern).
"""

[[act]]
title = "Shared, then changed"
summary = "ORD-1 holds Priya's profile address object; she updates her profile, and the placed order now ships to York."
detail = """
Order `ORD-1` is placed and keeps a reference to Priya's profile address,
`4 Mill Lane, Leeds`. Later she moves and updates her profile for future
orders, calling `setStreet` and `setCity`. There was only ever one address
object, so `ORD-1` now says `12 High Street, York`, for a parcel she ordered
before moving.
"""
speech = """
First demo: one address, shared, then changed. [[slnc 400]] Priya places order one. [[slnc 300]] The order keeps her profile address: four Mill Lane, Leeds. [[slnc 500]]
But it does not keep a copy. [[slnc 300]] It keeps the same object that her profile uses. [[slnc 600]]
Later, Priya moves house. [[slnc 300]] She updates her profile, for future orders. [[slnc 500]]
Order one now ships to twelve High Street, York. [[slnc 300]] An order she placed before she moved.
"""
rows = { profile = "active amber", order = "active wrong" }
console = [
    ["ORD-1 ships to: 4 Mill Lane, Leeds", "muted"],
    ["Priya updates her profile", "amber"],
    ["ORD-1 now ships to: 12 High Street, York", "bad"],
]

[[act]]
title = "Changed while being read"
summary = "A 10% sale is applied one price at a time; a checkout reading in between totals £62.00, neither £65.00 nor £58.50."
detail = """
The shared `MutablePriceList` holds a kettle at £30, a mug at £10 and a teapot
at £25: £65.00 for the basket. A ten percent sale is applied one price at a
time. A checkout that reads after the first change sees the new kettle and the
old mug and teapot: £62.00. After the sale the basket is £58.50. The customer
paid a price that never existed.
"""
speech = """
Second demo: a price list changed while someone reads it. [[slnc 400]] A kettle, a mug and a teapot come to sixty-five pounds. [[slnc 500]]
A ten percent sale is applied, one price at a time. [[slnc 300]] First the kettle. [[slnc 300]] Then the mug. [[slnc 300]] Then the teapot. [[slnc 600]]
A checkout reads the list just after the kettle changed. [[slnc 300]] It sees the new kettle, and the old mug and teapot. [[slnc 300]] Sixty-two pounds. [[slnc 500]]
That is neither the old price, nor the sale price. [[slnc 300]] The customer paid a price that never existed.
"""
rows = { prices = "active wrong", checkout = "active wrong" }
console = [
    ["before the sale: £65.00", "muted"],
    ["read mid-change: £62.00", "bad"],
    ["after the sale: £58.50", "muted"],
]

[[act]]
title = "Lost in a set"
summary = "An address in a HashSet has its spelling tidied; the set no longer finds it, though its size is 1."
detail = """
Tom's address goes into a `HashSet` of failed deliveries. A hash set files each
object under a number worked out from its contents. Then someone tidies the
spelling, `Road` to `Rd`. The object's number changes, but it is still filed
under the old one, so `contains` answers false, while the set's size is still
one.
"""
speech = """
Third demo: a changed object is lost in a set. [[slnc 400]] Tom's address goes into a set of failed deliveries. [[slnc 500]]
A hash set files each object under a number, worked out from what the object contains. [[slnc 300]] Like a filing cabinet, sorted by the first letter of a name. [[slnc 600]]
Then someone tidies the spelling. [[slnc 300]] Road becomes R D. [[slnc 500]]
Now the set cannot find it. [[slnc 300]] Contains says false. [[slnc 300]] But the set's size is still one. [[slnc 300]] It is filed in the wrong drawer.
"""
rows = { set = "active wrong" }
console = [
    ["added, then spelling tidied", "amber"],
    ["contains it: false", "bad"],
    ["size: 1", "bad"],
]

[[act]]
title = "Immutable objects"
summary = "A new address leaves ORD-2 alone; a sale list is built on the side and swapped in whole (£65.00 then £58.50); copied input and set lookups hold."
detail = """
`Address` is a record with no setters. `withStreet` and `withCity` return a
new address, so Priya's profile moves to York and `ORD-2` still ships to
Leeds. `PriceList` is immutable too: `withSale(10)` builds a whole new list on
the side while checkout keeps reading £65.00, then `Shop.publish` swaps it in
with one step, and checkout reads £58.50. There is no moment in between. The
constructor copies the map it is given, so changing that map later has no
effect, and an immutable address in a set is always found.
"""
speech = """
Fourth demo: immutable objects. [[slnc 400]] Now the address has no setters. [[slnc 300]] A change makes a new address, and leaves the old one alone. [[slnc 500]]
Priya's profile moves to York. [[slnc 300]] Order two still ships to Leeds. [[slnc 600]]
The price list is immutable too. [[slnc 300]] The sale builds a whole new list, on the side. [[slnc 300]] Checkout keeps reading sixty-five pounds. [[slnc 500]]
Then the shop swaps in the new list, in one single step. [[slnc 300]] Checkout reads fifty-eight fifty. [[slnc 300]] There is no moment in between. [[slnc 600]]
The list also copies whatever it was built from. [[slnc 300]] So changing that later does nothing. [[slnc 300]] And an address that cannot change is never lost in a set.
"""
rows = { profile = "active ok", order = "active ok", prices = "active ok", shop = "active ok", checkout = "active ok", set = "active ok" }
console = [
    ["ORD-2 still ships to 4 Mill Lane, Leeds", "ok"],
    ["sale built on the side: still £65.00", "ok"],
    ["one swap: £58.50, never a mix", "ok"],
    ["set contains 9 Park Road: true", "ok"],
]

[[act]]
title = "The bill"
summary = "Changing 1 price in a 1000-item list makes a new list of 1000 entries; each changeable field needs a with method."
detail = """
Every change is a copy. Changing one price in a catalogue of a thousand items
makes a new list of a thousand entries. And every field you might want to
change needs its own `with...` method. For values that are small or change
rarely, this is cheap; for something that changes constantly, it may not be.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] Every change is a copy. [[slnc 300]] Change one price, in a list of a thousand items. [[slnc 300]] You get a new list, of a thousand entries. [[slnc 600]]
And every field that might change needs its own with method, to build the new object. [[slnc 500]]
For small values that change rarely, that is cheap. [[slnc 300]] For something that changes all the time, think twice.
"""
rows = { prices = "active amber" }
console = [
    ["1 price changed: 1000 entries copied", "amber"],
    ["a with...() method per field", "amber"],
]

