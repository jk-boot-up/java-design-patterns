[docs.problem]
scenario = """
Orders keep shipping addresses, checkout reads a shared price list, and a set
records addresses with failed deliveries. All are ordinary objects with
setters, passed around by reference.
"""
naive = """
`MutableAddress` and `MutablePriceList` can be changed by anyone holding them.
An order's address moves when the profile changes, a sale is seen half-applied,
and a tidied address vanishes from a hash set.
"""
deliver = [
    "The three failures shown: a placed order's address changing, a £62.00 basket mid-sale, and a set that cannot find its only member.",
    "An immutable `Address` record with `with` methods.",
    "An immutable `PriceList` that copies its input, hands out a read-only view, and is replaced whole.",
    "The cost shown: 1000 entries copied to change one price.",
    "Every printed number asserted by a test.",
]

[docs.prerequisites]
required = [
    "Java basics: classes, fields, constructors, `final`.",
    "What a reference is: two variables can point at the same object.",
    "`HashSet` and `HashMap` at the level of putting things in and finding them.",
]
not_required = [
    "Threads. The half-applied sale is shown step by step, without threads.",
    "Any library. Records and `Map.copyOf` are part of Java.",
]

[docs.session]
objectives = [
    "Explain how a change through one reference is seen through another.",
    "Write an immutable class: no setters, final fields, copied collections.",
    "Replace an object whole instead of changing it in place.",
    "Say when immutability costs more than it saves.",
]
walkthrough = """
Run `./gradlew run` and read acts one to three before any code: each is a bug
learners have met without knowing its name. Then open `Address.java` (a
record, four lines) and `PriceList.java`, and point out the two lines that make
it safe: `Map.copyOf` in the constructor, and `with...` returning a new list.
"""
exercises = [
    "Add a postcode to `Address`, with a `withPostcode` method.",
    "Make `PriceList.withPrice` refuse a negative price. Where should the check go?",
    "Add a list of tags to `Address` and make sure the record stays immutable.",
    "Find a class in another project in this course that could be a record. Convert it.",
]

[docs.explained]
sentence = """
An immutable object never changes after it is made; to change something, you
make a new object, so every holder of the old one keeps seeing exactly what
it saw.
"""
verdict = """
Make every value immutable by default: addresses, prices, dates, identifiers,
messages, settings. Use records, copy collections in with `List.copyOf` and
`Map.copyOf`, and replace whole objects instead of editing them. Keep mutation
for the few objects that exist to change, and give each of those one owner.
"""
recognise = [
    "`record` declarations and classes with only `final` fields.",
    "`with...` methods that return a new object.",
    "`List.copyOf`, `Map.copyOf`, `Collections.unmodifiableList` in constructors or getters.",
    "An `AtomicReference` or `volatile` field swapped to a new object instead of edited.",
]

[spec]
purpose = """
Teach Immutable Object with an online store: a shared address that changes a
placed order, a price list read mid-sale at £62.00, and an address lost in a
hash set; then an immutable Address record, an immutable PriceList replaced
whole (£65.00 then £58.50, never a mix), copied input, and the cost of copying
1000 entries to change one.
"""
nongoals = [
    "Not threads. The half-applied change is shown in steps; the swap uses AtomicReference so it is safe with threads too.",
    "Not persistent collections. Libraries that share structure between copies are named only.",
]
problem = """
Objects that can be changed through any reference are changed behind their
holders' backs, seen half-changed, and lost in hash-based collections.
"""
roles = [
    ["The pattern", "`Address`, `PriceList`"],
    ["Replacing whole", "`Shop`"],
    ["The naive versions", "`MutableAddress`, `MutablePriceList`"],
    ["Holders", "`Orders.OldOrder`, `Orders.Order`"],
    ["Entry point", "`ImmutableObjectDemo`, five acts"],
]
requirements = [
    "**No setters:** `Address` and `PriceList` have none; `with` methods return new objects.",
    "**Copied in, read-only out:** the price list copies its input and rejects changes to `prices()`.",
    "**Replaced whole:** `Shop.publish` swaps the list in one step.",
    "**The failures are real:** £62.00 mid-sale and a set that cannot find its member, asserted.",
    "**Every printed number is asserted** in `DemoRunsTest`.",
]

