[[scene]]
key = "01-poster"
kind = "poster"
title = "Immutable Object"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Immutable Object pattern, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] An immutable object is one that can never change after it is made. [[slnc 300]] To change something, you make a new object with the difference. [[slnc 300]] The old one stays exactly as it was, for everyone still holding it. [[slnc 600]]
Think of a whiteboard menu behind a café counter, and a printed till receipt. [[slnc 300]] Anyone with a cloth can change the whiteboard, even while you are reading it. [[slnc 300]] A receipt never changes. [[slnc 300]] If something changes, the shop prints a new one. [[slnc 700]]
In this video, the domain is an online shop. [[slnc 300]] It passes addresses and price lists around everywhere. [[slnc 300]] Orders keep a shipping address, and checkout reads the price list. [[slnc 500]]
By the end, you will hear three bugs that changeable objects cause. [[slnc 300]] How to write an object that cannot change. [[slnc 300]] How to replace a price list in one step. [[slnc 300]] And what immutability costs.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["Orders keep a shipping address.", "Checkout reads the price list.", "A set holds failed deliveries.", "", "All ordinary objects with setters,", "shared by reference."]
narration = """
Here is the scenario. [[slnc 400]] Each order keeps the address it ships to. [[slnc 300]] Checkout reads the shop's price list. [[slnc 300]] And a set records addresses where a delivery failed. [[slnc 600]]
All of these are ordinary objects with setters. [[slnc 300]] A setter is a method that changes a field, such as set city. [[slnc 500]]
And they are shared by reference. [[slnc 300]] That means two parts of the program can hold the very same object. [[slnc 300]] Not two copies. [[slnc 300]] One object.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["No setters. Final fields.", "", "Copy lists and maps in;", "hand them out read-only.", "", "To change: make a new object.", "To publish: swap it in whole."]
narration = """
Let's name the pattern. [[slnc 400]] No setters, and every field is final. [[slnc 500]]
If the object holds a list or a map, copy it in when the object is made. [[slnc 300]] And hand it out read-only. [[slnc 500]]
To change something, make a new object with the difference. [[slnc 500]]
And when many readers share the current version, such as the shop's price list, swap in the new object in one step.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["Address: a record, with...() methods", "PriceList: copied map, read-only", "Shop: swaps the current list", "MutableAddress, MutablePriceList:", "the old way"]
narration = """
Here is who does what. [[slnc 400]] Address is a Java record. [[slnc 300]] Its with street and with city methods return a new address. [[slnc 500]]
Price list copies the prices it is given, and hands them out read-only. [[slnc 300]] A sale returns a whole new price list. [[slnc 500]]
Shop holds the current price list, and swaps in a new one in one step. [[slnc 500]]
And the mutable address and mutable price list are the old way, kept for comparison.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["String, Integer, LocalDate", "Java records", "List.of, Map.copyOf", "Value Object and Money", "React and Redux state"]
narration = """
You have used immutable objects since your first Java program. [[slnc 400]] String is immutable. [[slnc 300]] So are Integer, Local Date, and Big Decimal. [[slnc 500]]
Java records make writing your own easy. [[slnc 300]] And List dot of, and Map dot copy of, give you lists and maps that cannot change. [[slnc 500]]
The Value Object and Money patterns in this course are built on this idea. [[slnc 300]] And so is state in React and Redux.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Make values immutable by default:", "addresses, prices, dates, IDs.", "", "Replace whole; never edit shared.", "", "Keep mutation for things that", "exist to change, with one owner."]
narration = """
So, when should you use it? [[slnc 400]] Make every value immutable by default. [[slnc 300]] Addresses, prices, dates, IDs, messages, settings. [[slnc 500]]
Replace objects whole, instead of editing something that is shared. [[slnc 500]]
And keep mutation for the few objects that exist to change, such as a cart being filled. [[slnc 300]] Give each of those exactly one owner.
"""

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add delivery notes", "and keep Address immutable."]
narration = """
That's the Immutable Object pattern. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Never change a shared object. [[slnc 300]] Make a new one. [[slnc 500]]
The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs offline, with nothing installed except a Java development kit. [[slnc 500]]
Here is one exercise to try. [[slnc 300]] Add a list of delivery notes to the address. [[slnc 300]] And make sure it stays immutable. [[slnc 500]]
If this helped, a like really does help other people find it. [[slnc 300]] And subscribe, if you'd like the rest of the series. [[slnc 400]] Thanks for watching.
"""
