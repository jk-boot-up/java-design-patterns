# pattern.toml for the Marker Interface project. See tools/patternkit.

[project]
slug = "marker-interface"
category = "foundational-design-patterns"
title = "Marker Interface"
package = "markerinterface"
main_class = "MarkerInterfaceDemo"
tagline = "An empty interface that says a lot"
bold = "Mark a type with an empty interface, so code and the compiler can tell what kind of thing it is, instead of trusting free-text tags."
youtube_description = """Marker Interface pattern in Java, explained with an online store that ships milk and yoghurt with ice packs, mugs in bubble wrap, and kettles with nothing special. A marker interface has no methods at all; its name is the whole message, so a class that implements Perishable is saying it must travel cold, and the compiler can check it, like a printed keep-cold sticker the chilled van insists on. We watch free-text tags get misspelt, replace them with a marker interface, let the compiler do the checking, and see the mark passed on to subclasses. We finish with the bill."""
domain_note = ""
thumb_lines = ["MARKER", "INTERFACE"]
thumb_code = "implements Perishable"
youtube_title = "Marker Interface"
youtube_tags = ["marker interface", "java interfaces", "annotations", "type safety", "design patterns"]

[readme]
intro = """
A marker interface is an interface with no methods at all. Its name is the
whole message: a class that implements `Perishable` is saying "I must travel
cold". Code can ask `item instanceof Perishable`, and, more usefully, a method
can accept only `Perishable` things, so the compiler refuses anything else.

Java itself uses markers: `Serializable` and `Cloneable` are the famous ones.
They are the typed alternative to tags, flags and strings, which are easy to
misspell and impossible for the compiler to check.
"""
analogy = """
Think of the stickers on a delivery box. A handwritten note saying "keep cold"
can be misspelt, smudged, or written in a way nobody recognises. A printed,
standard "keep cold" sticker is the same everywhere, recognised at a glance,
and the chilled van only accepts boxes that carry it.
"""
scenario = """
The online store sells milk, cream and yoghurt that must travel with ice packs,
mugs that need bubble wrap, and kettles that need nothing special. Care
instructions were free-text tags typed in by whoever added the product. One
milk was tagged "Perishable" with a capital P, and some cream "perishible".
Both went out in a plain box.
"""
costs = [
    "**Yes or no only.** A marker cannot say how cold; that needs a method (then it is no longer a marker) or an annotation with a value.",
    "**Cannot be taken off.** A subclass inherits the mark and has no way to remove it.",
    "**Casts appear.** Code that receives a `Perishable` sometimes has to cast it back to a product.",
]
too_much = """
When the extra information needs values (a maximum temperature, a hazard
class), or must be read by tools and frameworks rather than by the compiler,
an annotation such as `@Chilled(maxC = 5)` fits better. Markers are for simple
yes-or-no facts about a type that the compiler should check.
"""
met_before = [
    "`java.io.Serializable`, `java.lang.Cloneable` and `java.util.RandomAccess`.",
    "`java.rmi.Remote`, marking objects that can be called over the network.",
    "Annotations such as `@FunctionalInterface` and `@Entity`, the other way to mark a type.",
]
where = """
This project is in [foundational-design-patterns](..), next to
[Extension Object](../extension-object-pattern), which attaches roles to
individual objects at run time. A marker belongs to the whole type and is fixed
when the code compiles.
"""

[[act]]
title = "Free-text tags"
summary = "MILK-1 tagged \"perishable\" gets ice packs; MILK-2 \"Perishable\" and CREAM-1 \"perishible\" go in a plain box."
detail = """
`TaggedProduct` keeps care instructions as a list of strings. The packer looks
for exactly "perishable". The first milk gets ice packs. The second, tagged
with a capital P, and the cream, tagged with a spelling mistake, go out in a
plain box. Nothing complained.
"""
speech = """
First demo: care instructions as free-text tags. [[slnc 400]] Whoever adds a product types its tags. [[slnc 300]] The packer looks for the word perishable, and adds ice packs. [[slnc 600]]
The first milk is tagged perishable. [[slnc 300]] Ice packs. [[slnc 500]]
The second milk is tagged Perishable, with a capital P. [[slnc 300]] Plain box. [[slnc 500]]
The cream is tagged with a spelling mistake. [[slnc 300]] Plain box. [[slnc 600]]
Two of three dairy products shipped warm, and nothing complained.
"""
rows = { tags = "active wrong", packer = "active wrong" }
console = [
    ["MILK-1: ice packs  [perishable]", "ok"],
    ["MILK-2: plain box  [Perishable]", "bad"],
    ["CREAM-1: plain box  [perishible]", "bad"],
]

[[act]]
title = "A marker interface"
summary = "Milk implements Perishable and gets ice packs, the mug is Fragile and gets bubble wrap, the kettle gets a plain box."
detail = """
`Perishable` and `Fragile` are empty interfaces. `Milk` implements
`Perishable`, `Mug` implements `Fragile`, `Kettle` implements neither. The
packer asks `instanceof`: milk gets ice packs, the mug bubble wrap, the kettle
a plain box. A misspelt interface name simply would not compile.
"""
speech = """
Second demo: a marker interface. [[slnc 400]] Perishable is now an interface with no methods at all. [[slnc 300]] Its name is the whole message. [[slnc 600]]
Milk implements Perishable. [[slnc 300]] A mug implements Fragile. [[slnc 300]] A kettle implements neither. [[slnc 500]]
The packer asks each product: are you perishable? [[slnc 300]] Are you fragile? [[slnc 500]]
Milk gets ice packs. [[slnc 300]] The mug gets bubble wrap. [[slnc 300]] The kettle gets a plain box. [[slnc 500]]
And a spelling mistake in the interface name would not even compile.
"""
rows = { marker = "active ok", packer = "active ok", milk = "active ok", mug = "active ok" }
console = [
    ["MILK-1: ice packs", "ok"],
    ["MUG-1: bubble wrap", "ok"],
    ["KETTLE-1: plain box", "ok"],
]

[[act]]
title = "The compiler checks"
summary = "sendChilled accepts only Perishable things: milk is taken; passing a kettle does not compile."
detail = """
`Packer.sendChilled` takes a `Perishable` parameter. Milk is accepted by the
chilled van. Writing `sendChilled(kettle)` does not compile, because a kettle
is not `Perishable`. The rule is enforced before the program runs.
"""
speech = """
Third demo: the compiler checks who can use the chilled courier. [[slnc 400]] The courier's send method only accepts things that are perishable. [[slnc 500]]
Milk: the chilled van takes it. [[slnc 500]]
A kettle: the code does not even compile. [[slnc 300]] The mistake is caught before the program ever runs.
"""
rows = { courier = "active ok", milk = "active ok" }
console = [
    ["chilled van takes MILK-1", "ok"],
    ["sendChilled(kettle): does not compile", "ok"],
]

[[act]]
title = "The mark is passed on"
summary = "YoghurtMultipack extends Yoghurt and gets ice packs, although its team never wrote Perishable."
detail = """
Another team writes `YoghurtMultipack extends Yoghurt`. They never mention
`Perishable`, but `Yoghurt` implements it, so the multipack is perishable too
and gets ice packs.
"""
speech = """
Fourth demo: the mark is passed on to subclasses. [[slnc 400]] Another team writes a yoghurt multipack. [[slnc 300]] It extends yoghurt. [[slnc 500]]
The team never wrote the word perishable. [[slnc 300]] But yoghurt is perishable, so the multipack is too. [[slnc 300]] It gets ice packs.
"""
rows = { yoghurt = "active ok", packer = "active ok" }
console = [
    ["YOG-6: ice packs", "ok"],
    ["its team never wrote Perishable", "muted"],
]

[[act]]
title = "The bill"
summary = "A marker cannot say how cold (that needs a method or an annotation), and a subclass cannot remove the mark."
detail = """
A marker answers yes or no. It cannot say how cold: that needs a method, which
makes it no longer a marker, or an annotation like `@Chilled(maxC = 5)`. And a
subclass cannot take the mark off: a dried yoghurt snack extending `Yoghurt`
would still get ice packs.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] A marker says yes or no, and nothing more. [[slnc 300]] It cannot say how cold. [[slnc 300]] For that you need a method, or an annotation with a value. [[slnc 600]]
And a subclass cannot take the mark off. [[slnc 300]] A dried yoghurt snack, extending yoghurt, would still get ice packs.
"""
rows = { marker = "active amber" }
console = [
    ["cannot say how cold", "amber"],
    ["cannot be removed by a subclass", "amber"],
]

[animation]
subtitle = "Empty interfaces mark products as perishable or fragile; the packer and the compiler both read the mark."
boxes = [
    ["tags", "Free-text tags", "\"perishable\", \"Perishable\", ..."],
    ["marker", "Perishable, Fragile", "empty interfaces"],
    ["milk", "Milk", "Perishable"],
    ["mug", "Mug", "Fragile"],
    ["yoghurt", "YoghurtMultipack", "inherits Perishable"],
    ["packer", "Packer", "ice packs, bubble wrap"],
    ["courier", "Chilled courier", "accepts Perishable only"],
]

[docs.problem]
scenario = """
Products need different care in transit: cold, padded, or nothing special.
"""
naive = """
`TaggedProduct` stores care instructions as free text. A capital letter or a
typo means the packer misses the tag, and dairy goes out warm.
"""
deliver = [
    "Tags shown failing on case and spelling.",
    "Empty marker interfaces and a packer that reads them.",
    "A method that only accepts perishable items, checked by the compiler.",
    "A mark inherited by a subclass.",
    "The limits shown: no values, no removal.",
    "Every printed result asserted by a test.",
]

[docs.prerequisites]
required = [
    "Java basics: interfaces, `instanceof`, inheritance.",
]
not_required = [
    "Annotations. They are compared as the alternative.",
]

[docs.session]
objectives = [
    "Say what a marker interface is and why it has no methods.",
    "Use a marker in `instanceof` and as a parameter type.",
    "Explain why the compiler catches what tags cannot.",
    "Choose between a marker and an annotation.",
]
walkthrough = """
Run `./gradlew run` and read act one aloud: a capital letter ships milk warm.
Open `Markers`: two interfaces, no methods. Then show `sendChilled(Perishable)`
and try passing a kettle in the IDE to see the compiler error.
"""
exercises = [
    "Add a `Hazardous` marker for batteries and a packer rule for it.",
    "Replace `Perishable` with an annotation `@Chilled(maxC = 5)`. What does the compiler stop checking?",
    "Write a test that every class in the dairy package is Perishable.",
]

[docs.explained]
sentence = """
A marker interface is an empty interface whose name tells code and the
compiler something about a type, replacing free-text tags that can be
misspelt.
"""
verdict = """
Use markers for simple yes-or-no facts about a type that the compiler should
check, especially as method parameter types. Use an annotation when the fact
needs values or is read by frameworks.
"""
recognise = [
    "`implements Serializable`, `Cloneable`, `RandomAccess`.",
    "Interfaces with no methods whose name is an adjective.",
    "Methods whose parameter type is such an interface.",
]

[spec]
purpose = """
Teach Marker Interface with an online store's packing: free-text tags failing
on case and spelling, then empty Perishable and Fragile interfaces read by a
packer, a chilled courier that only accepts Perishable at compile time, a mark
inherited by a subclass, and the limits of yes-or-no marks.
"""
nongoals = [
    "Not annotation processing. Annotations are named as the alternative.",
    "Not cold-chain rules. Temperatures are not modelled.",
]
problem = """
Care instructions kept as free text are misspelt and missed, and nothing checks
them.
"""
roles = [
    ["The markers", "`Markers.Perishable`, `Markers.Fragile`"],
    ["The marked", "`Products.Milk`, `Mug`, `Yoghurt`, `YoghurtMultipack`"],
    ["The readers", "`Packer.pack`, `Packer.sendChilled`"],
    ["The naive version", "`TaggedProduct`"],
    ["Entry point", "`MarkerInterfaceDemo`, five acts"],
]
requirements = [
    "**Empty:** markers declare no methods, asserted by a test.",
    "**Checked:** `sendChilled` accepts only `Perishable`.",
    "**Inherited:** a subclass of a perishable product is perishable.",
    "**Every printed result is asserted** in `DemoRunsTest`.",
]

