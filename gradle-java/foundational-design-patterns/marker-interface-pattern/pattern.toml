[poster]
headline = [["MARKER", "text"], ["INTERFACE", "text"]]
before = { code = "tags: \"perishible\"", note = "shipped warm", tag = "BEFORE" }
after = { code = "implements Perishable", note = "checked by the compiler", tag = "AFTER" }
taglines = [["An empty interface that says a lot", "gold"]]

[[scene]]
key = "01-poster"
kind = "poster"
title = "Marker Interface"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Marker Interface pattern, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] A marker interface is an interface with no methods at all. [[slnc 300]] Its name is the whole message. [[slnc 300]] A class that implements Perishable is saying: I must travel cold. [[slnc 300]] And the compiler can check it. [[slnc 600]]
Think of the stickers on a delivery box. [[slnc 300]] A handwritten note saying keep cold can be misspelt, or missed. [[slnc 300]] A printed, standard sticker is recognised at a glance. [[slnc 300]] And the chilled van only accepts boxes that carry it. [[slnc 700]]
In this video, the domain is an online shop. [[slnc 300]] It sells milk and yoghurt that need ice packs, mugs that need bubble wrap, and kettles that need nothing special. [[slnc 500]]
By the end, you will hear how free-text tags fail. [[slnc 300]] How a marker interface fixes it. [[slnc 300]] How the compiler joins in. [[slnc 300]] And what a marker cannot do.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["Milk, cream, yoghurt: ice packs.", "Mugs: bubble wrap.", "Kettles: nothing special.", "", "Care instructions were", "free-text tags."]
narration = """
Here is the scenario. [[slnc 400]] Milk, cream, and yoghurt must travel with ice packs. [[slnc 300]] Mugs need bubble wrap. [[slnc 300]] Kettles need nothing special. [[slnc 600]]
Care instructions were free-text tags. [[slnc 300]] Whoever added a product typed them in. [[slnc 500]]
And the packer looked for exact words.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["An interface with no methods.", "The name is the message.", "", "Ask: instanceof Perishable.", "Accept: sendChilled(Perishable)."]
narration = """
Let's name the pattern. [[slnc 400]] Declare an interface with no methods. [[slnc 300]] Its name is the message: Perishable. [[slnc 500]]
Classes that must travel cold implement it. [[slnc 500]]
Code can ask whether something is perishable. [[slnc 300]] And a method can accept only perishable things, so the compiler refuses everything else.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["Perishable, Fragile: the markers", "Milk, Mug, Yoghurt: marked products", "Packer: reads the marks", "Chilled courier: perishables only", "TaggedProduct: the old way"]
narration = """
Here is who does what. [[slnc 400]] Perishable and Fragile are the markers: two empty interfaces. [[slnc 500]]
Milk, mug, and yoghurt are the marked products. [[slnc 500]]
The packer reads the marks and adds ice packs or bubble wrap. [[slnc 300]] The chilled courier only accepts perishables. [[slnc 500]]
And tagged product is the old way, kept for comparison.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["java.io.Serializable", "java.lang.Cloneable", "java.util.RandomAccess", "Annotations: the other way to mark"]
narration = """
You have met this pattern in Java itself. [[slnc 400]] Serializable is a marker. [[slnc 300]] So are Cloneable and Random Access. [[slnc 500]]
None of them has a method. [[slnc 300]] Their names are the message. [[slnc 500]]
And annotations, such as Functional Interface, are the other way to mark a type.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Simple yes-or-no facts about", "a type, checked by the compiler.", "", "Need a value, like how cold?", "Use an annotation."]
narration = """
So, when should you use it? [[slnc 400]] For simple yes-or-no facts about a type, that the compiler should check. [[slnc 300]] Especially as the type of a method parameter. [[slnc 500]]
When the fact needs a value, such as how cold, use an annotation instead. [[slnc 300]] You lose the compiler's check, but you gain the value.
"""

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a Hazardous marker", "for batteries."]
narration = """
That's the Marker Interface pattern. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Put the fact in the type, and let the compiler check it. [[slnc 500]]
The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs offline, with nothing installed except a Java development kit. [[slnc 500]]
Here is one exercise to try. [[slnc 300]] Add a hazardous marker for batteries, and a packing rule for it. [[slnc 500]]
If this helped, a like really does help other people find it. [[slnc 300]] And subscribe, if you'd like the rest of the series. [[slnc 400]] Thanks for watching.
"""
