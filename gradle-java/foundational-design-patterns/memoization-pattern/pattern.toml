[poster]
headline = [["MEMOIZATION", "text"]]
before = { code = "best(25)", note = "9,749,473 calls", tag = "BEFORE" }
after = { code = "memo.computeIfAbsent(n, ...)", note = "26 calls", tag = "AFTER" }
taglines = [["Work it out once, remember it", "gold"]]

[[scene]]
key = "01-poster"
kind = "poster"
title = "Memoization"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Memoization pattern, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] Memoization means remembering the answer a function gave for each question. [[slnc 300]] The next time it is asked the same question, it answers from memory, instead of working it out again. [[slnc 600]]
Think of a shop assistant asked, twenty times a day, how much delivery to Leeds costs. [[slnc 300]] The first time, they phone the courier. [[slnc 300]] Then they write the answer on a sticky note by the till. [[slnc 300]] After that, they just read the note. [[slnc 700]]
In this video, the domain is an online shop. [[slnc 300]] It sells mugs with multi-buy offers, and shows a shipping quote on every product page. [[slnc 500]]
By the end, you will hear how a plain method can take ten million calls. [[slnc 300]] How memoization brings it down to twenty-six. [[slnc 300]] When it is not safe. [[slnc 300]] And what it costs.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["Mugs: 1 for £4, 2 for £7,", "3 for £10, 5 for £15.", "", "What is the cheapest way to", "buy 25?", "", "And a shipping quote on every page."]
narration = """
Here is the scenario. [[slnc 400]] The shop sells mugs with multi-buy offers. [[slnc 300]] One for four pounds. [[slnc 300]] Two for seven. [[slnc 300]] Three for ten. [[slnc 300]] Five for fifteen. [[slnc 600]]
A customer orders twenty-five. [[slnc 300]] What is the cheapest way to combine the offers? [[slnc 500]]
And every product page also asks the carrier for a shipping quote, which takes two hundred milliseconds.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["Before working out an answer:", "look it up.", "", "After working it out:", "write it down.", "", "Only if the answer depends on", "nothing but the question."]
narration = """
Let's name the pattern. [[slnc 400]] Before working out an answer, look it up in a memo. [[slnc 300]] A memo is just a map, from question to answer. [[slnc 500]]
After working it out, write it down. [[slnc 500]]
And only do this when the answer depends on nothing but the question. [[slnc 300]] Not on the time, not on a rate, not on anything else.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["MultiBuy.plain: the slow way", "MultiBuy.memoized: same code + a map", "Memo: wraps any function", "ShippingQuotes: the carrier", "Euros: not safe to memoize"]
narration = """
Here is who does what. [[slnc 400]] Multi buy plain is the slow way. [[slnc 300]] Multi buy memoized is the same code, plus a map. [[slnc 500]]
Memo is a small wrapper that adds a memo to any function. [[slnc 500]]
Shipping quotes stands in for the slow carrier. [[slnc 300]] And euros is the example that is not safe to memoize.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Map.computeIfAbsent", "Dynamic programming", "Caffeine, @Cacheable", "useMemo in React"]
narration = """
You have probably met this pattern already. [[slnc 400]] In Java, map dot compute if absent is memoization in one line. [[slnc 500]]
Dynamic programming, in algorithm courses, is memoization of recursive problems. [[slnc 500]]
Caching libraries such as Caffeine, and Spring's cacheable annotation, build on it. [[slnc 300]] So does use memo, in React.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Expensive, pure functions,", "asked the same questions again.", "", "Can the answer go out of date?", "Use a cache with expiry", "and a size limit."]
narration = """
So, when should you use it? [[slnc 400]] For expensive functions that are pure, and are asked the same questions again. [[slnc 300]] Especially recursive ones. [[slnc 500]]
If the answer can go out of date, or there are huge numbers of different questions, use a real cache instead. [[slnc 300]] One with an expiry time, and a size limit.
"""

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Fix the euro memo", "by adding the date to the key."]
narration = """
That's the Memoization pattern. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Work it out once, write it down, and only trust the note while the answer cannot change. [[slnc 500]]
The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs offline, with nothing installed except a Java development kit. [[slnc 500]]
Here is one exercise to try. [[slnc 300]] Fix the euro memo, by adding the date to its key. [[slnc 500]]
If this helped, a like really does help other people find it. [[slnc 300]] And subscribe, if you'd like the rest of the series. [[slnc 400]] Thanks for watching.
"""
