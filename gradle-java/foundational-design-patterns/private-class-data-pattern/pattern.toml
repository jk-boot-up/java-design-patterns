]

[docs.prerequisites]
required = [
    "Java basics: classes, fields, `final`, records.",
]
not_required = [
    "Reflection. The demo uses it once to count setters; you do not need to understand it.",
]

[docs.session]
objectives = [
    "Explain how a class can damage its own data.",
    "Move protected fields into a private, final data object.",
    "Keep working state that must change beside it.",
    "Tell this pattern apart from a fully immutable object.",
]
walkthrough = """
Run `./gradlew run` and read act one: the same invoice printed twice gives two
different totals. Open `LooseInvoice.printWithStaffDiscount` and find the line
that does it. Then open `Invoice`: one private record, one counter.
"""
exercises = [
    "Add a `VAT rate` to InvoiceData and a method that prints the total with VAT.",
    "Try writing `data.netPence = 0` inside Invoice and read the compiler's message.",
    "Add a credit note: a new Invoice with a negative total, rather than changing the old one.",
]

[docs.explained]
sentence = """
Private class data moves the values a class must never change into a private,
unchangeable data object, so not even the class's own methods can overwrite
them.
"""
verdict = """
Use it for classes that hold important figures alongside working state, or to
lock down a group of fields in older code. When everything should be
unchangeable, make the whole object immutable instead.
"""
recognise = [
    "A class holding a `private final SomethingData data` field.",
    "Records or final-field classes named `...Data`, `...State` or `...Details` inside another class.",
    "Getters that forward to `data.x()`.",
]

[spec]
purpose = """
Teach Private Class Data with an online store's invoices: a print method that
subtracts a staff discount from its own total (£100 to £90 to £81), then the
figures in a private final record so prints show £90.00 each time, no setters,
and a print counter kept beside the data.
"""
nongoals = [
    "Not full immutability. Covered by Immutable Object.",
    "Not tax rules. The discount is a plain percentage.",
]
problem = """
A class's own methods can change fields that should never change after
construction.
"""
roles = [
    ["The pattern", "`Invoice` with a private `InvoiceData`"],
    ["The protected data", "`InvoiceData`"],
    ["The naive version", "`LooseInvoice`"],
    ["Entry point", "`PrivateClassDataDemo`, five acts"],
]
requirements = [
    "**Final figures:** `InvoiceData` has final fields and no setters.",
    "**Private:** the data object is not exposed; only its values are read.",
    "**Stable prints:** repeated prints show the same figure.",
    "**Working state allowed:** the print counter changes.",
    "**Every printed result is asserted** in `DemoRunsTest`.",
]

