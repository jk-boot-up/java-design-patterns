# pattern.toml for the Private Class Data project. See tools/patternkit.

[project]
slug = "private-class-data"
category = "foundational-design-patterns"
title = "Private Class Data"
package = "privateclassdata"
main_class = "PrivateClassDataDemo"
tagline = "Protect the data from its own class"
bold = "Put the figures a class must never change into a private, unchangeable data object, so not even the class's own methods can overwrite them."
domain_note = ""
thumb_lines = ["PRIVATE", "CLASS DATA"]
thumb_code = "private final InvoiceData data"
youtube_title = "Private Class Data"
youtube_tags = ["private class data", "encapsulation", "design patterns", "immutability", "java"]

[readme]
intro = """
Private Class Data is a small pattern about protecting a class from itself.
Ordinary encapsulation hides fields from other classes, but the class's own
methods can still change them, by accident or as a shortcut. With private
class data, the values that must never change after construction move into a
separate data object with final fields and no setters. The class holds it
privately and can read it, but not write it.

Anything that is genuinely meant to change, such as a counter, stays an
ordinary field beside it. The class decides, field by field, what may change.
"""
analogy = """
Think of a museum exhibit in a glass case. The staff look after it every day:
they clean the glass, count the visitors, change the label lights. But the
exhibit itself is locked inside, and nobody, not even the staff, can pick it up
and alter it. The things that are meant to change sit outside the glass.
"""
scenario = """
The online store prints invoices, and staff sometimes print one with a staff
discount shown. The invoice's print method took a shortcut: it subtracted the
discount from its own stored total before printing. Printing it twice took the
discount twice, and the invoice itself now said £81 instead of £100.
"""
costs = [
    "**One more class.** Every protected class gains a data class beside it.",
    "**One more hop.** Every read becomes `data.netPence()` instead of `netPence`.",
    "**Ceremony for small classes.** For a class with two fields and no risky methods, final fields alone are enough.",
]
too_much = """
If every field of a class should be unchangeable, make the whole class
immutable instead: final fields, or a record. Private Class Data is for classes
that mix protected figures with working state that must change, or for older
code where you want to lock down a group of fields without rewriting the class.
"""
met_before = [
    "Final fields grouped into a record inside a service or entity.",
    "Configuration objects passed into a class and kept read-only.",
    "The \"memento\" of an object's state, kept apart from the object.",
]
where = """
This project is in [foundational-design-patterns](..), next to
[Immutable Object](../immutable-object-pattern), which makes a whole object
unchangeable. Private Class Data protects part of an object and lets the rest
change.
"""

[[act]]
title = "A method changes its own figures"
summary = "Printing INV-7 with a 10% staff discount shows £90.00, then £81.00; the invoice itself now says £81.00."
detail = """
`LooseInvoice` keeps its total as an ordinary field. Its
`printWithStaffDiscount` method subtracts the discount from that field before
printing. The first print shows £90.00. The second takes ten percent again and
shows £81.00. The invoice, issued for £100.00, now says £81.00.
"""
speech = """
First demo: the invoice's own method changes its figures. [[slnc 400]] Invoice seven is for one hundred pounds. [[slnc 300]] It is printed with a ten percent staff discount shown. [[slnc 600]]
The print method takes a shortcut. [[slnc 300]] It takes the discount off the stored total, then prints it. [[slnc 500]]
First print: ninety pounds. [[slnc 300]] Second print: eighty-one pounds. [[slnc 600]]
The invoice itself now says eighty-one pounds. [[slnc 300]] It was issued for one hundred.
"""
rows = { loose = "active wrong" }
console = [
    ["first print:  £90.00", "ok"],
    ["second print: £81.00", "bad"],
    ["the invoice now says £81.00", "bad"],
]

[[act]]
title = "Private class data"
summary = "The figures move into a private InvoiceData record; printed three times, it shows £90.00 each time and still says £100.00."
detail = """
`Invoice` keeps its number, customer and total in a private `InvoiceData`
record. The print method works out the discounted figure in a local variable.
Printed three times, it shows £90.00 each time, and the invoice still says
£100.00.
"""
speech = """
Second demo: the figures live in a private data object. [[slnc 400]] The invoice's number, customer, and total move into a small record. [[slnc 300]] The invoice keeps that record privately. [[slnc 600]]
Now the print method works out the discount in a local variable. [[slnc 300]] It cannot change the stored total. [[slnc 500]]
Print it three times. [[slnc 300]] Ninety pounds, every time. [[slnc 300]] And the invoice still says one hundred.
"""
rows = { invoice = "active ok", data = "active ok" }
console = [
    ["print 1, 2, 3: £90.00", "ok"],
    ["the invoice still says £100.00", "ok"],
]

[[act]]
title = "Nothing can write"
summary = "InvoiceData has 0 setters and final fields; the loose invoice's shortcut would not compile."
detail = """
`InvoiceData` is a record: its fields are final and it has no setters. The
invoice can read `data.netPence()` but has no way to write it. The loose
invoice's shortcut, assigning a new total, would simply not compile.
"""
speech = """
Third demo: nothing can write the figures, not even the invoice itself. [[slnc 400]] The data record has no setters. [[slnc 300]] Its fields are final, which means they are set once, and never again. [[slnc 600]]
So the shortcut from the first demo would not even compile. [[slnc 300]] The mistake is stopped before the program ever runs.
"""
rows = { data = "active ok" }
console = [
    ["InvoiceData setters: 0", "ok"],
    ["the shortcut would not compile", "ok"],
]

[[act]]
title = "Working state beside the data"
summary = "The invoice counts its prints (3) while its figures stay at £100.00."
detail = """
Not everything must be frozen. The invoice keeps an ordinary `timesPrinted`
counter beside its data, and it reads three. The figures are unchanged at
£100.00. The class decides, field by field, which values may change.
"""
speech = """
Fourth demo: working state can still change, beside the data. [[slnc 400]] The invoice counts how many times it was printed. [[slnc 300]] That counter is an ordinary field, and it says three. [[slnc 500]]
The figures in the data object have not moved. [[slnc 300]] Still one hundred pounds. [[slnc 500]]
Like the museum case: the visitor count changes, the exhibit does not.
"""
rows = { invoice = "active ok", counter = "active ok", data = "active ok" }
console = [
    ["times printed: 3", "ok"],
    ["figures unchanged: £100.00", "ok"],
]

[[act]]
title = "The bill"
summary = "One more class and one more hop on every read; for a small class with no risky methods it is ceremony."
detail = """
Every protected class gains a data class, and every read goes through it:
`data.netPence()` instead of `netPence`. For a class with two fields and no
risky methods, final fields alone would do.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] There is one more class, the data record. [[slnc 300]] And every read takes one more hop, through the data object. [[slnc 600]]
For a small class with no risky methods, that is just ceremony. [[slnc 300]] Final fields alone would be enough.
"""
rows = { data = "active amber" }
console = [
    ["every read: data.netPence()", "amber"],
    ["small, safe classes: ceremony", "amber"],
]

[animation]
subtitle = "The invoice's figures sit in a private, unchangeable data object; printing reads them but cannot change them."
boxes = [
