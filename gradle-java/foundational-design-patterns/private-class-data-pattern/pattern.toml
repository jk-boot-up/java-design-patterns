[[scene]]
key = "01-poster"
kind = "poster"
title = "Private Class Data"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Private Class Data pattern, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] Private class data moves the values a class must never change into a separate, private data object. [[slnc 300]] That object cannot be changed. [[slnc 300]] So not even the class's own methods can overwrite those values. [[slnc 600]]
Think of a museum exhibit in a glass case. [[slnc 300]] The staff clean the glass and count the visitors every day. [[slnc 300]] But nobody, not even the staff, can pick up the exhibit and alter it. [[slnc 700]]
In this video, the domain is an online shop. [[slnc 300]] It prints invoices, and staff sometimes print one with a staff discount shown. [[slnc 500]]
By the end, you will hear how a class can damage its own data. [[slnc 300]] How a private data object stops it. [[slnc 300]] How working state can still change. [[slnc 300]] And when this is just ceremony.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["Invoice INV-7: £100.00.", "", "Staff print it with a 10%", "staff discount shown.", "", "The print method took a shortcut."]
narration = """
Here is the scenario. [[slnc 400]] Invoice seven is for one hundred pounds. [[slnc 500]]
Staff can print it with a ten percent staff discount shown, for their own records. [[slnc 500]]
The print method took a shortcut. [[slnc 300]] Let's see what that did.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["Values that must never change:", "a private data object with", "final fields and no setters.", "", "Working state that may change:", "ordinary fields beside it."]
narration = """
Let's name the pattern. [[slnc 400]] Find the values that must never change after the object is made. [[slnc 300]] Move them into a small data object, with final fields and no setters. [[slnc 300]] Keep it private. [[slnc 500]]
Values that are meant to change, such as a counter, stay ordinary fields beside it. [[slnc 500]]
The class can read its data. [[slnc 300]] It cannot write it.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["Invoice: prints, counts prints", "InvoiceData: number, customer, total", "timesPrinted: may change", "LooseInvoice: the old way"]
narration = """
Here is who does what. [[slnc 400]] The invoice prints itself, and counts how often. [[slnc 500]]
Invoice data is a record holding the number, the customer, and the total. [[slnc 300]] Set once, never changed. [[slnc 500]]
Times printed is the ordinary field beside it. [[slnc 500]]
And loose invoice is the old way, kept for comparison.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["private final ...Data data;", "Read-only configuration objects", "Records inside services", "and entities"]
narration = """
You have probably met this pattern already. [[slnc 400]] Any class holding a private final field of some data type, and reading from it, is using it. [[slnc 500]]
Read-only configuration objects passed into a service are the same idea. [[slnc 500]]
And records kept inside services and entities, to group the values that must not change.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Important figures beside", "working state that changes.", "", "Locking down fields in", "older code.", "", "Everything fixed? Make the", "whole object immutable."]
narration = """
So, when should you use it? [[slnc 400]] When a class holds important figures alongside working state that must change. [[slnc 500]]
Or when you want to lock down a group of fields in older code, without rewriting the class. [[slnc 500]]
And when every value should be fixed, skip this. [[slnc 300]] Make the whole object immutable instead.
"""

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Try writing to the data", "and read the compiler's answer."]
narration = """
That's the Private Class Data pattern. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Protect the figures that must not change, even from their own class. [[slnc 500]]
The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs offline, with nothing installed except a Java development kit. [[slnc 500]]
