before = { code = "new SellingCustomer(...)", note = "a new object, 0 orders", tag = "BEFORE" }
after = { code = "account.addRole(seller)", note = "same account, 12 orders", tag = "AFTER" }
taglines = [["One identity, many hats", "gold"]]

[[scene]]
key = "01-poster"
kind = "poster"
title = "Role Object"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Role Object pattern, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] With role objects, one core object holds who someone is. [[slnc 300]] Each thing they do for a while, such as buying or selling, is a separate role object. [[slnc 300]] Roles are added and removed as life changes, and the identity stays the same. [[slnc 600]]
Think of one person who is a parent, a nurse, and a weekend football coach. [[slnc 300]] The same person, all along. [[slnc 300]] When they stop coaching, the club removes that role. [[slnc 300]] Nobody has to create a new person. [[slnc 700]]
In this video, the domain is an online shop. [[slnc 300]] Its customers can also sell on its marketplace, and earn money by referring friends. [[slnc 500]]
By the end, you will hear why subclasses break when someone's role changes. [[slnc 300]] How role objects fix it. [[slnc 300]] How to drop a role. [[slnc 300]] And what it costs.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["Customers can also sell,", "and earn by referring friends.", "", "Each kind was a subclass:", "Customer, SellingCustomer, ..."]
narration = """
Here is the scenario. [[slnc 400]] Customers of the shop can also become sellers on its marketplace. [[slnc 300]] And they can join an affiliate scheme, earning a small commission for referring others. [[slnc 600]]
The shop modelled each kind as a subclass. [[slnc 300]] A subclass is a class that extends another. [[slnc 300]] Customer, and selling customer extends customer. [[slnc 500]]
Then Priya, who had twelve orders, opened a shop.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["A core object: who someone is.", "", "A role object for each thing", "they do for a while.", "", "Add and remove roles;", "the identity stays."]
narration = """
Let's name the pattern. [[slnc 400]] A core object holds who someone is. [[slnc 300]] Here, the account. [[slnc 500]]
Each thing they do for a while is a separate role object, with its own data and behaviour. [[slnc 300]] Buyer, seller, affiliate. [[slnc 500]]
Roles are added and removed as life changes. [[slnc 300]] The core object, and its identity, stay the same.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["Account: ID, name, its roles", "Role: points back at its account", "Buyer, Seller, Affiliate: the roles", "Customer, SellingCustomer: the old way"]
narration = """
Here is who does what. [[slnc 400]] The account holds an ID, a name, and the roles it plays right now. [[slnc 500]]
Role is a small base class. [[slnc 300]] Every role remembers which account it belongs to. [[slnc 500]]
Buyer, seller, and affiliate are the roles, each with its own data and methods. [[slnc 500]]
And customer and selling customer are the old way, kept for comparison.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Marketplace accounts: buyer,", "seller, admin", "Party and PartyRole data models", "Actors and roles in games"]
narration = """
You have probably met this pattern already. [[slnc 400]] Marketplace accounts can be a buyer, a seller, and an admin, all at once. [[slnc 500]]
Enterprise data models often have a party, a person or a company, playing roles such as customer, supplier, and employee. [[slnc 500]]
And games give one character different roles over time.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Roles come and go,", "combine freely, and bring", "their own behaviour.", "", "Identity on the core.", "Decide what happens to a", "role's data when it goes."]
narration = """
So, when should you use it? [[slnc 400]] When roles come and go during an object's life, combine freely, and bring their own behaviour. [[slnc 500]]
Keep the identity on the core object. [[slnc 300]] Give each role its own data. [[slnc 300]] And decide what should happen to that data when a role is removed. [[slnc 500]]
When an object's kind never changes, a subclass or a simple field is clearer.
"""

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Keep the shop name", "for when selling resumes."]
narration = """
That's the Role Object pattern. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] One identity, many hats, and the hats come and go. [[slnc 500]]
The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs offline, with nothing installed except a Java development kit. [[slnc 500]]
Here is one exercise to try. [[slnc 300]] Keep Priya's shop name when selling is suspended, so it can be restored later. [[slnc 500]]
If this helped, a like really does help other people find it. [[slnc 300]] And subscribe, if you'd like the rest of the series. [[slnc 400]] Thanks for watching.
"""
