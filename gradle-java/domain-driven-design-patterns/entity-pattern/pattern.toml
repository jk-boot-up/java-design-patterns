    { id = "e", label = "email", sub = "old -> new -> work", col = 0, row = 1, colour = "amber" },
    { id = "p", label = "points", sub = "0 -> 80", col = 1, row = 1, colour = "amber" },
    { id = "o", label = "orders", sub = "found by C-17", col = 2, row = 1, colour = "green" },
]
edges = [
    { from = "e", to = "i", label = "belongs to" },
    { from = "p", to = "i", label = "belongs to" },
    { from = "o", to = "i", label = "keyed by" },
]

[[diagram]]
name = "class-diagram"
kind = "class"
title = "Entity — classes"
caption = "The identity is a small value; the entity compares by it."
nodes = [
    { id = "c", label = "Customer", sub = ["- final CustomerId id", "- email, points, history", "+ changeEmail(e)", "equals/hashCode: id only"], col = 0, row = 0, colour = "accent" },
    { id = "i", label = "«record» CustomerId", sub = ["value"], col = 1, row = 0, colour = "green" },
    { id = "r", label = "«record» CustomerRecord", sub = ["name, email, points", "equals: all fields"], col = 2, row = 0, colour = "red" },
]
edges = [
    { from = "c", to = "i", label = "has" },
]

[[diagram]]
name = "data-flow-diagram"
kind = "flow"
title = "Entity — an email change"
caption = "By value, a new customer; by identity, the same one."
nodes = [
    { id = "a", label = "Priya, old email", sub = "record", col = 0, row = 0, colour = "client" },
    { id = "b", label = "Priya, new email", sub = "a different record", col = 2, row = 0, colour = "red" },
    { id = "c", label = "C-17, old email", sub = "entity", col = 0, row = 1, colour = "client" },
