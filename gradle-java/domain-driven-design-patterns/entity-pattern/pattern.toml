# pattern.toml for the Entity project. See tools/patternkit.

[project]
slug = "entity"
category = "domain-driven-design-patterns"
title = "Entity"
package = "entity"
main_class = "EntityDemo"
tagline = "Same thing, even when it changes"
bold = "Some things are defined by who they are, not by their current details: give them an identity that never changes, and compare them by that identity alone."
domain_note = ""
thumb_lines = ["ENTITY"]
thumb_code = "equals: same id"
youtube_title = "Entity"
youtube_tags = ["entity", "domain driven design", "ddd", "identity", "equals hashcode", "java"]

[readme]
intro = """
Entity is one of the building blocks of domain-driven design. An entity is
something the business cares about as an individual, followed through time: a
customer, an order, a parcel. Its details change (a new email, more points,
a new address), but it stays the same thing. So it is given an identity, such
as a customer ID, that is assigned once and never changes, and two entity
objects are equal when their identities are equal, whatever their details say.

Its opposite is a value object, such as an amount of money or an address,
which has no identity and is equal to any other with the same values.
"""
analogy = """
Think of a car. Over the years it is resprayed, gets new tyres, new number
plates, and a new owner. It is still the same car, because its chassis number,
stamped into the frame at the factory, never changes. Two cars of the same
model and colour, side by side, are still two different cars.
"""
scenario = """
The online store kept customers as records compared by all their fields. When
Priya changed her email, the shop treated her as a new customer: her orders
could not be found by the new record, and the mailing list held two of her.
And a father and son sharing a name and a family email were treated as one
person.
"""
costs = [
    "**Equal is not up to date.** A cached copy and the live customer are equal, because they share an ID, even when their details differ.",
    "**IDs must be managed.** Every entity needs an ID that is unique, assigned once and never reused.",
    "**Not for everything.** Treating values (amounts, addresses) as entities adds IDs nobody needs.",
]
too_much = """
When the business does not care which one it is, only what it is (£10 is
£10, whichever coin), use a value object instead. Entities are for things
followed individually through time.
"""
met_before = [
    "JPA `@Entity` classes with an `@Id` field.",
    "Database primary keys.",
    "`equals` and `hashCode` written over an ID field only.",
]
where = """
This project is in [domain-driven-design-patterns](..), next to its opposite,
[Value Object](../value-object-pattern), and to
[Aggregate](../aggregate-pattern), which groups entities under one root.
"""

[[act]]
title = "Defined by values"
summary = "Priya's old and new records are not equal; her orders are not found; the mailing list holds 2 of her."
detail = """
`CustomerRecord` is a record, compared by all its fields. When Priya changes
her email, the new record is not equal to the old one. Her orders, stored
under the old record, cannot be found with the new one, and a set of
customers now contains two Priyas.
"""
speech = """
First demo: a customer defined by its values. [[slnc 400]] The customer is a record, compared by every field: name, email, and points. [[slnc 600]]
Priya changes her email. [[slnc 300]] Now the old record and the new one are not equal. [[slnc 500]]
Her orders were stored under the old record. [[slnc 300]] Looked up with the new one: nothing found. [[slnc 500]]
And the mailing list now has two customers. [[slnc 300]] Both of them are Priya.
"""
rows = { record = "active wrong", orders = "active wrong" }
console = [
    ["old and new records equal: false", "bad"],
    ["her orders by the new record: null", "bad"],
    ["mailing list: 2, both Priya", "bad"],
]

[[act]]
title = "Defined by identity"
summary = "Customer C-17 changes email and stays C-17: her orders are found and the mailing list holds 1."
detail = """
`Customer` has a `CustomerId`, set when the account is opened. Its `equals`
and `hashCode` use only the ID. Priya changes her email and is still `C-17`:
her orders are found, and the mailing list holds one customer.
"""
speech = """
Second demo: an entity, a customer defined by its identity. [[slnc 400]] The customer now has an ID, C 17, given when the account was opened. [[slnc 500]]
Two customer objects are equal when their IDs are equal. [[slnc 300]] Nothing else is compared. [[slnc 600]]
Priya changes her email. [[slnc 300]] She is still C 17. [[slnc 300]] Her orders are found. [[slnc 300]] And the mailing list holds one customer.
"""
rows = { entity = "active ok", orders = "active ok" }
console = [
    ["C-17 Priya <priya@new.example>", "ok"],
    ["her orders: ORD-1, ORD-2", "ok"],
    ["mailing list: 1", "ok"],
]

[[act]]
title = "Look-alikes are different"
summary = "Father and son with the same name and email are equal as records, different as entities C-42 and C-43."
detail = """
A father and son are both called Tom Reed and share a family email. As
records they are equal, so the shop would merge their orders. As entities
they are `C-42` and `C-43`: different customers, however alike they look.
"""
speech = """
Third demo: two people who look the same are still two people. [[slnc 400]] A father and his son are both called Tom Reed. [[slnc 300]] They share a family email. [[slnc 600]]
As records, they are equal. [[slnc 300]] The shop would mix up their orders. [[slnc 500]]
As entities, they are C 42 and C 43. [[slnc 300]] Two different customers.
"""
rows = { record = "active wrong", entity = "active ok" }
console = [
    ["as records, equal: true", "bad"],
    ["as entities C-42 and C-43: false", "ok"],
]

[[act]]
title = "A life story"
summary = "Priya's history shows three emails; she has 80 points; her ID never changed."
detail = """
An entity is followed through time. Priya's history shows the account opened
with her old email, then two changes. She has earned 80 points. Through all
of it, her ID stayed `C-17`.
"""
speech = """
Fourth demo: an entity has a life story. [[slnc 400]] Priya's account was opened with her old email. [[slnc 300]] Then she changed it. [[slnc 300]] Then she changed it again, to her work email. [[slnc 300]] She earned eighty points along the way. [[slnc 600]]
Three emails. [[slnc 300]] One customer. [[slnc 300]] The ID never changed.
"""
rows = { entity = "active ok", history = "active ok" }
console = [
    ["opened with priya@old.example", "muted"],
    ["-> priya@new.example -> priya@work.example", "muted"],
    ["one customer, 80 points, same ID", "ok"],
]

[[act]]
title = "The bill"
summary = "A cached copy and the live customer are equal, yet their emails differ; IDs must be unique and never reused."
detail = """
Equal is not the same as up to date. A copy of Priya made for a cache and the
live customer are equal, because they share `C-17`, even though the copy still
has her work email and the live one her final email. And every entity needs an
ID that is unique and never reused.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] Equal is not the same as up to date. [[slnc 500]]
A cached copy of Priya, and the live Priya, are equal. [[slnc 300]] They share the same ID. [[slnc 300]] But the copy has an old email, and the live one a new email. [[slnc 600]]
And every entity needs an ID that is unique, and never reused.
"""
rows = { entity = "active amber" }
console = [
    ["cached copy equals live: true", "amber"],
    ["but emails differ", "amber"],
]

[animation]
subtitle = "A customer keeps one ID for life; its details change, and it is compared by that ID alone."
boxes = [
    ["record", "CustomerRecord", "equal when all values match"],
    ["entity", "Customer C-17", "equal when IDs match"],
    ["orders", "Orders lookup", "keyed by customer"],
    ["history", "Life story", "every change recorded"],
]

[docs.problem]
scenario = """
Customers change their details over time, and some share names and emails.
"""
naive = """
`CustomerRecord` compares all fields. An email change makes a "new" customer
whose orders cannot be found, and two look-alike people become one.
"""
deliver = [
    "A value-compared customer losing its orders after an email change.",
    "An entity with an ID, compared by ID only.",
    "Look-alike customers kept apart.",
    "A history of changes under one ID.",
    "The cost shown: a stale copy that is still equal.",
    "Every printed result asserted by a test.",
]

[docs.prerequisites]
required = [
    "Java basics: classes, records, `equals` and `hashCode`.",
    "`HashMap` and `HashSet` at the level of putting in and finding.",
]
not_required = [
    "JPA or a database.",
    "The rest of domain-driven design.",
]

[docs.session]
objectives = [
    "Tell an entity from a value object.",
    "Give an entity an identity that never changes.",
    "Write equals and hashCode over the identity only.",
    "Explain what equality does not tell you about an entity.",
]
walkthrough = """
Run `./gradlew run` and read acts one and two side by side: the same email
change, two outcomes. Open `Customer.equals` and `hashCode`: one field each.
Then ask learners to name three things in a shop that are entities and three
that are values.
"""
exercises = [
    "Make `Order` an entity with an `OrderId`.",
    "Add a method that says whether two customer objects hold the same details, separate from equals.",
    "Generate IDs with a counter. What goes wrong after the program restarts?",
]

[docs.explained]
sentence = """
An entity is an object defined by an identity that never changes, compared by
that identity alone, so it stays the same thing while its details change.
"""
verdict = """
Model things the business follows individually through time as entities:
customers, orders, parcels. Give each a never-changing ID, compare by it, and
keep everything else in value objects.
"""
recognise = [
    "A final `id` field and `equals` that compares only it.",
    "`@Entity` and `@Id` in JPA code.",
    "Methods that change details (`changeEmail`) but never the ID.",
]

[spec]
purpose = """
Teach Entity with an online store's customers: value-compared records losing
orders and duplicating Priya after an email change and merging two Tom Reeds,
then a Customer entity compared by C-17, look-alikes kept apart, a history of
changes, and the cost that equal copies can be out of date.
"""
nongoals = [
    "Not persistence. Customers live in memory.",
    "Not ID generation strategies. IDs are given by hand.",
]
problem = """
Comparing customers by all their values makes a changed customer a stranger
and makes two look-alike customers the same person.
"""
roles = [
    ["The pattern", "`Customer`"],
    ["The identity", "`CustomerId`"],
    ["The naive version", "`CustomerRecord`"],
    ["Entry point", "`EntityDemo`, five acts"],
]
requirements = [
    "**Identity-based equality:** `equals` and `hashCode` use the ID only.",
    "**Never-changing ID:** the ID is final and required.",
    "**Changing details:** email and points change; history is recorded.",
    "**Every printed result is asserted** in `DemoRunsTest`.",
]

