[poster]
headline = [["CONTEXT MAP", "text"], ["SHARED KERNEL", "text"]]
before = { code = "convert(SalesAddress)", note = "the flat was lost", tag = "BEFORE" }
after = { code = "kernel.Address", note = "one address, both teams", tag = "AFTER" }
taglines = [["Draw the borders, share a little", "gold"]]

[[scene]]
key = "01-poster"
kind = "poster"
title = "Context Map and Shared Kernel"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Context Map and Shared Kernel patterns, from domain-driven design, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] A big system is split into parts, each with its own model and team. [[slnc 300]] A context map writes down how those parts relate. [[slnc 300]] A shared kernel is a tiny piece of model that two parts share, and change only together. [[slnc 600]]
Think of two neighbouring houses with a shared garden wall. [[slnc 300]] Each family runs its own house. [[slnc 300]] But neither can move the wall without asking the other. [[slnc 300]] And a street map shows who shares what with whom. [[slnc 700]]
In this video, the domain is an online shop. [[slnc 300]] Sales takes orders. [[slnc 300]] Shipping prints labels. [[slnc 300]] And the catalogue supplies prices. [[slnc 500]]
By the end, you will hear how two copies of an address lost a flat number. [[slnc 300]] How a shared kernel fixes it. [[slnc 300]] How to keep a map that is checked. [[slnc 300]] And what sharing costs.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["Sales: takes orders.", "Shipping: prints labels.", "Catalogue: supplies prices.", "", "Sales and shipping each kept", "their own Address class."]
narration = """
Here is the scenario. [[slnc 400]] The shop has three parts, called contexts. [[slnc 300]] Sales takes orders. [[slnc 300]] Shipping prints labels. [[slnc 300]] The catalogue supplies prices. [[slnc 600]]
Sales and shipping both need addresses. [[slnc 300]] Each kept its own address class. [[slnc 300]] And a converter copied one into the other.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["Context map: which parts exist,", "and how each pair relates.", "", "Shared kernel: a tiny model", "two parts own together.", "", "Check the map against the code."]
narration = """
Let's name the patterns. [[slnc 400]] A context map lists the parts of the system, and how each pair relates. [[slnc 300]] Who supplies whom. [[slnc 300]] Who shares what. [[slnc 500]]
A shared kernel is one of those relationships. [[slnc 300]] A tiny model that two parts own together, and change only by agreement. [[slnc 500]]
And the map is kept as code, and checked against the imports on every build.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["kernel: Address, Money", "sales, shipping, catalog: contexts", "ContextMap: relationships + check", "before.Separate: the old way"]
narration = """
Here is who does what. [[slnc 400]] The kernel package holds address and money, shared by sales and shipping. [[slnc 500]]
Sales, shipping, and catalogue are the contexts, each a package with its own code. [[slnc 500]]
The context map class lists the relationships, and checks that the imports agree. [[slnc 300]] And the before package is the old way, kept for comparison.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["A shared common library", "Context map diagrams", "Architecture tests on imports"]
narration = """
You have probably met these patterns already. [[slnc 400]] A small shared common library, used by two services, is a shared kernel. [[slnc 500]]
Architecture documents often draw context maps, with arrows marked upstream and downstream. [[slnc 500]]
And architecture tests that say which packages may import which keep the map honest.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["More than one team or model?", "Draw a map, keep it as code.", "", "Share a kernel only for the", "few things that must match.", "Keep it tiny."]
narration = """
So, when should you use them? [[slnc 400]] As soon as a system has more than one team, or more than one model, draw a context map. [[slnc 300]] Keep it as code, and check it. [[slnc 500]]
Share a kernel only for the few concepts that must match exactly. [[slnc 300]] Keep it tiny, and change it together.
"""

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a postcode to the", "kernel's Address."]
narration = """
That's the Context Map and Shared Kernel patterns. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Draw the borders, check them, and share only a little. [[slnc 500]]
The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs offline, with nothing installed except a Java development kit. [[slnc 500]]
