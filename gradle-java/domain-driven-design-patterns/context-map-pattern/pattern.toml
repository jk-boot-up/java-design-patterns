# pattern.toml for the Context Map and Shared Kernel project. See tools/patternkit.

[project]
slug = "context-map"
category = "domain-driven-design-patterns"
title = "Context Map and Shared Kernel"
package = "contextmap"
main_class = "ContextMapDemo"
tagline = "Draw the borders, share a little"
bold = "Write down how the parts of a system relate, check the code against that map, and where two parts must agree exactly, share a tiny kernel that both own."
youtube_description = """Context Map and Shared Kernel patterns from domain-driven design in Java: a context map writes down how the parts of a big system relate, and a shared kernel is a tiny piece of model two parts share and change only together, like a garden wall between neighbouring houses. Explained with an online store where Sales takes orders, Shipping prints labels and the Catalogue supplies prices. We watch two copies of an address lose a flat number, fix it with a shared kernel, draw the context map, and check it automatically. We finish with what sharing costs."""
domain_note = ""
thumb_lines = ["CONTEXT MAP", "SHARED KERNEL"]
thumb_code = "kernel -> sales, shipping"
youtube_title = "Context Map and Shared Kernel"
youtube_tags = ["context map", "shared kernel", "domain driven design", "ddd", "bounded context", "java"]

[readme]
intro = """
In domain-driven design, a large system is split into bounded contexts: parts
such as sales, shipping and the catalogue, each with its own model and team. A
context map is the drawing of how those parts relate: who supplies whom, who
must conform to whom, who translates. Shared Kernel is one of those
relationships: a small piece of model, such as an address and an amount of
money, that two contexts share and change only by agreement.

The map is most useful when it is not just a drawing. Kept as code, it can be
checked against the program's actual imports on every build.
"""
analogy = """
Think of two neighbouring houses that share a garden wall and a gate. Each
family runs its own house as it likes, but the wall and the gate belong to
both, and neither can knock them down or move them without asking the other.
A street map shows which houses share what with whom, so nobody is surprised.
"""
scenario = """
The online store has a sales context that takes orders, a shipping context
that prints labels, and a catalogue that supplies prices. Sales and shipping
each kept their own Address class, and a converter copied one into the other.
When sales added a flat number, the converter dropped it, and parcels waited
at the main door of blocks of flats.
"""
costs = [
    "**A kernel changes slowly.** Every change to it needs both teams to agree, test and release together.",
    "**Kernels grow.** It is tempting to add \"just one more\" shared class; keep it to a handful.",
    "**A map to maintain.** The map is only useful while it matches the code, which is why it is checked.",
]
too_much = """
A small program built by one team has one context and needs no map. And when
two contexts only need to exchange data, not share a model, a published
language (an agreed message format) or an anti-corruption layer keeps them
more independent than a shared kernel.
"""
met_before = [
    "A shared `common` or `core` library used by two services.",
    "Context map diagrams in architecture documents, with arrows marked upstream and downstream.",
    "ArchUnit or module rules that say which packages may depend on which.",
]
where = """
This project is in [domain-driven-design-patterns](..), next to
[Bounded Context](../bounded-context-pattern), which defines the parts, and
[Anti-Corruption Layer](../anti-corruption-layer-pattern), another
relationship a context map can show.
"""

[[act]]
title = "Two copies of an address"
summary = "Sales' address has a flat number; the converter to shipping's address drops it: the label says 4 Mill Lane, Leeds."
detail = """
In the `before` package, sales has `SalesAddress` with a flat, and shipping
has `ShippingAddress` without one. A converter copies between them. Priya
types "Flat 2, 4 Mill Lane, Leeds"; the shipping label reads "4 Mill Lane,
Leeds". The flat was lost between the two contexts.
"""
speech = """
First demo: sales and shipping each keep their own address. [[slnc 400]] Sales added a flat number to its address. [[slnc 300]] Shipping's address never had one. [[slnc 500]]
A converter copies one into the other. [[slnc 500]]
Priya types: flat two, four Mill Lane, Leeds. [[slnc 300]] The shipping label says: four Mill Lane, Leeds. [[slnc 600]]
The flat number was lost between the two parts of the shop. [[slnc 300]] The parcel waits at the main door.
"""
rows = { sales = "active amber", converter = "active wrong", shipping = "active wrong" }
console = [
    ["typed: Flat 2, 4 Mill Lane, Leeds", "muted"],
    ["label: 4 Mill Lane, Leeds", "bad"],
    ["the flat was lost", "bad"],
]

[[act]]
title = "A shared kernel"
summary = "Sales and shipping share kernel.Address and kernel.Money: the order is £38.00 and the label keeps Flat 2."
detail = """
A small `kernel` package holds `Address` and `Money`, owned by both teams.
Sales places `ORD-1` for £38.00 with a kernel address; shipping prints the
label from the same address: "Flat 2, 4 Mill Lane, Leeds, insured for
£38.00". The converter is gone.
"""
speech = """
Second demo: a shared kernel. [[slnc 400]] A small shared package holds two classes: address, and money. [[slnc 300]] Both teams own it together. [[slnc 600]]
Sales places order one, for thirty-eight pounds. [[slnc 300]] Shipping prints the label from the very same address. [[slnc 500]]
Flat two, four Mill Lane, Leeds. [[slnc 300]] Insured for thirty-eight pounds. [[slnc 300]] There is no converter to lose anything.
"""
rows = { kernel = "active ok", sales = "active ok", shipping = "active ok" }
console = [
    ["sales: ORD-1 for £38.00", "ok"],
    ["label: Flat 2, 4 Mill Lane, Leeds", "ok"],
    ["no converter", "ok"],
]

[[act]]
title = "The context map"
summary = "Three relationships: catalogue supplies sales; the kernel is shared by sales and by shipping; shipping does not know sales."
detail = """
`ContextMap.RELATIONSHIPS` writes down how the contexts relate: the catalogue
is sales' supplier (sales asks it for prices); sales and shipping share the
kernel. Shipping does not know that sales exists.
"""
speech = """
Third demo: the context map. [[slnc 400]] It writes down who depends on whom, and how. [[slnc 500]]
The catalogue supplies sales: sales asks it for prices. [[slnc 300]] Sales and shipping share the kernel: address and money. [[slnc 500]]
And shipping does not know that sales exists. [[slnc 300]] It only knows the kernel.
"""
rows = { map = "active ok", catalog = "active ok", kernel = "active ok" }
console = [
    ["catalog -> sales: customer/supplier", "ok"],
    ["kernel -> sales: shared kernel", "ok"],
    ["kernel -> shipping: shared kernel", "ok"],
]

[[act]]
title = "The map, checked"
summary = "Scanning imports finds 0 the map does not allow; shipping importing sales is reported."
detail = """
The map also lists what each context may import. `ContextMap.surprises` reads
every source file: zero imports the map does not allow. When someone adds an
import of `sales.Sales` to shipping, the check reports it, so the drawing and
the code cannot drift apart.
"""
speech = """
Fourth demo: the map is checked against the code. [[slnc 400]] A small check reads every source file, and looks at what it imports. [[slnc 500]]
Imports the map does not allow: zero. [[slnc 600]]
Then someone takes a shortcut. [[slnc 300]] In shipping, they import the sales order. [[slnc 500]]
The check reports it: shipping imports sales, which the map does not allow.
"""
rows = { check = "active ok", shipping = "active amber" }
console = [
    ["imports the map does not allow: 0", "ok"],
    ["shipping adds: import ...sales.Sales", "amber"],
    ["check: not allowed by the map", "ok"],
]

[[act]]
title = "The bill"
summary = "Adding a postcode to Address needs both teams; keep the kernel to 2 classes."
detail = """
A shared kernel changes slowly: adding a postcode to `Address` needs both
teams to agree, test and release together. The answer is to keep it tiny,
here two classes, and leave everything else inside its own context.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] A shared kernel changes slowly. [[slnc 300]] Adding a postcode to the address needs both teams to agree, test, and release together. [[slnc 600]]
So keep the kernel tiny. [[slnc 300]] Here, two classes. [[slnc 300]] Everything else stays inside its own context.
"""
rows = { kernel = "active amber" }
console = [
    ["a kernel change: both teams", "amber"],
    ["keep it tiny: 2 classes", "amber"],
]

[animation]
subtitle = "Sales and shipping share a tiny kernel; the catalogue supplies sales; a map of these relationships is checked against the code."
boxes = [
    ["sales", "Sales", "takes orders"],
    ["shipping", "Shipping", "prints labels"],
    ["converter", "Address converter", "the old way, drops the flat"],
    ["kernel", "Shared kernel", "Address, Money"],
    ["catalog", "Catalogue", "supplies prices"],
    ["map", "Context map", "who depends on whom"],
    ["check", "Import check", "code must match the map"],
]

[docs.problem]
scenario = """
Sales takes orders, shipping prints labels, and the catalogue supplies prices.
Sales and shipping both need addresses and amounts of money.
"""
naive = """
Each context keeps its own Address, and a converter copies between them. A
flat number added in sales is dropped on the way to shipping.
"""
deliver = [
    "The converter shown losing the flat.",
    "A two-class shared kernel used by both contexts.",
    "A context map written as code.",
    "An import check that the code matches the map.",
    "Every printed result asserted by a test.",
]

[docs.prerequisites]
required = [
    "Java basics: packages, imports, records.",
    "The idea of a bounded context: a part of the system with its own model.",
]
not_required = [
    "Microservices. The contexts here are packages in one program.",
]

[docs.session]
objectives = [
    "Explain what a context map shows.",
    "Decide when two contexts should share a kernel.",
    "Keep a kernel small and jointly owned.",
    "Check the code against the map.",
]
walkthrough = """
Run `./gradlew run` and read act one: the flat lost in the converter. Open the
`kernel` package: two records. Then open `ContextMap`: three relationships and
a list of allowed imports. Add the shortcut import to shipping and watch the
test fail.
"""
exercises = [
    "Add a postcode to the kernel's Address. Which contexts must change?",
    "Add a payments context that sales depends on through an anti-corruption layer, and put it on the map.",
    "Make the map print itself as a list a new team member could read on day one.",
]

[docs.explained]
sentence = """
A context map records how the parts of a system relate; a shared kernel is a
tiny model two parts share and change only together.
"""
verdict = """
Draw a context map as soon as a system has more than one team or model, and
keep it as code that is checked. Share a kernel only for the few concepts that
must match exactly, keep it tiny, and change it by agreement.
"""
recognise = [
    "A small shared `kernel`, `common` or `shared` package used by two areas.",
    "Architecture tests listing which packages may import which.",
    "Diagrams with arrows labelled upstream, downstream, conformist or ACL.",
]

[spec]
purpose = """
Teach Context Map and Shared Kernel with an online store: sales and shipping
each keeping an Address and losing a flat number in a converter, then a
two-class shared kernel, a context map as code (catalogue supplies sales;
kernel shared by sales and shipping), and an import check that reports a
shortcut from shipping to sales.
"""
nongoals = [
    "Not services or networks. Contexts are packages.",
    "Not the full catalogue of context relationships. Three are shown.",
]
problem = """
Two contexts keeping their own copies of the same concept lose information
when they convert between them, and nobody can see which parts depend on
which.
"""
roles = [
    ["The kernel", "`kernel.Address`, `kernel.Money`"],
    ["The contexts", "`sales.Sales`, `shipping.Shipping`, `catalog.Catalog`"],
    ["The map", "`ContextMap`"],
    ["The naive version", "`before.Separate`"],
    ["Entry point", "`ContextMapDemo`, five acts"],
]
requirements = [
    "**One Address:** sales and shipping use the kernel's.",
    "**Tiny kernel:** two classes.",
    "**Map as code:** relationships and allowed imports in one class.",
    "**Checked:** a test fails on an import the map does not allow.",
    "**Every printed result is asserted** in `DemoRunsTest`.",
]

[[diagram]]
name = "architecture-diagram"
