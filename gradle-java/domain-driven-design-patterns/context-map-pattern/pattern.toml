kind = "class"
title = "Context Map — classes"
caption = "Two kernel records used by both contexts."
nodes = [
    { id = "a", label = "«record» kernel.Address", sub = ["flat, street, city", "+ label()"], col = 1, row = 0, colour = "amber" },
    { id = "m", label = "«record» kernel.Money", sub = ["pence", "+ plus(Money)"], col = 1, row = 1, colour = "amber" },
    { id = "s", label = "sales.Sales", sub = ["+ placeOrder(id, address, skus)"], col = 0, row = 0, colour = "accent" },
    { id = "h", label = "shipping.Shipping", sub = ["+ label(parcel, address, money)"], col = 2, row = 0, colour = "accent" },
    { id = "cm", label = "ContextMap", sub = ["RELATIONSHIPS", "+ surprises(src)"], col = 0, row = 1, colour = "green" },
]
edges = [
    { from = "s", to = "a", label = "uses" },
    { from = "h", to = "a", label = "uses" },
