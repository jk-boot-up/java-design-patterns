    { id = "s", label = "Sales", sub = "orders", col = 1, row = 0, colour = "accent" },
    { id = "k", label = "Shared kernel", sub = "Address, Money", col = 1, row = 1, colour = "amber" },
    { id = "h", label = "Shipping", sub = "labels", col = 2, row = 1, colour = "accent" },
]
