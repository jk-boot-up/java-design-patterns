[[scene]]
key = "01-poster"
kind = "poster"
title = "Domain Service"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Domain Service pattern, from domain-driven design, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] Some business rules involve several objects, and belong to none of them. [[slnc 300]] A domain service is a class for such a rule. [[slnc 300]] It holds no data of its own, and it is named in the business's own words. [[slnc 600]]
Think of a referee at a football match. [[slnc 300]] Whether a tackle was a foul involves two players and the rules. [[slnc 300]] Neither player decides. [[slnc 300]] The referee applies the rules, the same way every time. [[slnc 700]]
In this video, the domain is an online shop. [[slnc 300]] Gold customers get ten percent off. [[slnc 300]] A coupon gives five pounds off baskets over forty pounds. [[slnc 300]] And the two do not add up. [[slnc 500]]
By the end, you will hear how copies of a rule drift apart. [[slnc 300]] How a domain service fixes it. [[slnc 300]] How it explains itself. [[slnc 300]] And how services can empty your objects.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["Gold customers: 10% off.", "Coupon SAVE5: £5 off over £40.", "", "They do not add up:", "the bigger discount wins.", "", "Web and app each had a copy."]
narration = """
Here is the scenario. [[slnc 400]] Gold customers get ten percent off. [[slnc 300]] The coupon save five gives five pounds off baskets over forty pounds. [[slnc 500]]
The rule is: they do not add up. [[slnc 300]] The bigger discount wins. [[slnc 500]]
The web checkout had a copy of this rule. [[slnc 300]] So did the phone app.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["A rule that spans several objects", "and belongs to none of them:", "", "its own class, in the domain,", "stateless, named in business words."]
narration = """
Let's name the pattern. [[slnc 400]] Find a rule that needs several domain objects, and belongs to none of them. [[slnc 500]]
Give it its own class, in the domain. [[slnc 300]] Keep it stateless: no data kept between calls. [[slnc 300]] And name it in the business's own words. [[slnc 500]]
Everything that needs the rule calls that one class.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["PricingService: the rule", "Customer, Basket, Coupon: the facts", "Price: the total and the reason", "Copies: the old way"]
narration = """
Here is who does what. [[slnc 400]] The pricing service holds the discount rule. [[slnc 500]]
Customer, basket, and coupon are the domain objects. [[slnc 300]] Each keeps its own facts, such as the basket's subtotal. [[slnc 500]]
Price is what the service returns: a total, and the reason for it. [[slnc 300]] And copies holds the old way, kept for comparison.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Pricing, tax and shipping", "calculators", "Transfers between two accounts", "Policies: RefundPolicy"]
narration = """
You have probably met this pattern already. [[slnc 400]] Pricing, tax, and shipping calculators that take several objects are domain services. [[slnc 500]]
So is a transfer that moves money or stock between two accounts. [[slnc 500]]
And so are policies, such as a refund policy, named after the business decision they make.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["The rule belongs to one object?", "Put it there.", "", "It spans several? A domain service,", "stateless and well named.", "", "Workflow steps: application services."]
narration = """
So, when should you use it? [[slnc 400]] If a rule belongs to one object, put it on that object. [[slnc 500]]
If it genuinely spans several, give it a domain service. [[slnc 300]] Stateless, and well named. [[slnc 500]]
And keep workflow steps, such as load, call, save, and send an email, out of it. [[slnc 300]] Those belong in an application service.
"""

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add free delivery", "for gold customers."]
narration = """
That's the Domain Service pattern. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] A rule nobody owns gets its own home, and everyone uses that one. [[slnc 500]]
The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs offline, with nothing installed except a Java development kit. [[slnc 500]]
Here is one exercise to try. [[slnc 300]] Add free delivery for gold customers over fifty pounds. [[slnc 300]] Then decide: does it belong in the service, or on an object? [[slnc 500]]
If this helped, a like really does help other people find it. [[slnc 300]] And subscribe, if you'd like the rest of the series. [[slnc 400]] Thanks for watching.
"""
