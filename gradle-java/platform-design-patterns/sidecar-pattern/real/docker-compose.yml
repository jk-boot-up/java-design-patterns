# Five containers, and the count is half the lesson.
#
# Two of them are the shop: checkout and refunds. One is the payment provider.
# The other two are proxies, one for each service, and they are the third row
# of Tier 1's bill made literal -- twice as many things to start, to patch, to
# version and to look at during an incident.
#
# The important line in this file is `network_mode: "service:checkout"`. It puts
# the proxy inside the service's network namespace, so the two containers share
# one network stack and one set of ports. That is why the payments service can
# be configured with `http://localhost:8081` and mean it. It is also the closest
# thing Compose has to a Kubernetes Pod, which is where §43 picks the story up.
#
# Image tags are pinned in ../../docs/pinned-versions.md. Nothing here says
# `latest`, so this file will still do what the README says it does next year.
services:

  # ---- the supplier at the other end -----------------------------------------
  gateway:
    build: ./gateway
    container_name: sidecar-demo-gateway
    volumes:
      # A certificate generated by demo.sh a moment ago, signed by nobody. The
      # provider is HTTPS-only, which is what makes the transport a concern the
      # proxies genuinely have to handle rather than one we claim they do.
      - ./build/certs:/certs:ro
    ports:
      # Published only so the demo script can read the provider's own tally and
      # reset it between acts. Neither service uses this address; they could not,
      # because neither of them knows it exists.
      - "19443:9443"

  # ---- checkout, and the proxy beside it ------------------------------------
  checkout:
    build: ./payments
    container_name: sidecar-demo-checkout
    environment:
      SHOP_SERVICE_NAME: checkout
    ports:
      # Both the service (8080) and its proxy (8081) are published here, because
      # the proxy has no network of its own to publish from. That asymmetry is
      # the shared namespace showing through.
      - "18080:8080"
      - "18081:8081"
    depends_on:
      - gateway

  sidecar-checkout:
    image: nginx:1.31.5-alpine
    container_name: sidecar-demo-checkout-proxy
    network_mode: "service:checkout"
    environment:
      SERVICE_NAME: checkout
      # Substitute SERVICE_NAME and leave every other $variable alone. Without
      # this filter, envsubst would also replace nginx's own runtime variables
      # -- $upstream_status, $request_time -- with empty strings, and the access
      # log would come out blank with nothing complaining.
      NGINX_ENVSUBST_FILTER: SERVICE_NAME
    volumes:
      - ./sidecar/payments-sidecar.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - checkout

  # ---- refunds, and the proxy beside it -------------------------------------
  #
  # Identical to checkout in every respect but its name, and mounting the same
  # single config file. That is the claim: one policy, two services, one place
  # to edit it. There is no second copy of this file to forget about.
  refunds:
    build: ./payments
    container_name: sidecar-demo-refunds
    environment:
      SHOP_SERVICE_NAME: refunds
    ports:
      - "18090:8080"
      - "18091:8081"
    depends_on:
      - gateway

  sidecar-refunds:
    image: nginx:1.31.5-alpine
    container_name: sidecar-demo-refunds-proxy
    network_mode: "service:refunds"
    environment:
      SERVICE_NAME: refunds
      NGINX_ENVSUBST_FILTER: SERVICE_NAME
    volumes:
      - ./sidecar/payments-sidecar.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - refunds
