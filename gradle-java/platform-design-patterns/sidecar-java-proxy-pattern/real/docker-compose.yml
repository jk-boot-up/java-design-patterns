# Four containers, and two of them are never running at the same time.
#
# There is the payment provider, there is checkout, and then there are two
# proxies -- one nginx, one Java -- which both bind port 8081 inside checkout's
# network namespace. Two processes cannot hold one port, and that is not a
# limitation of this file: it is the swap window the README and Act 5 are about.
# Whichever of them is bound is the thing checkout is talking to, and checkout
# has no way of finding out which.
#
# The important line is `network_mode: "service:checkout"` on both proxies. It
# puts the proxy inside the service's network namespace, so the two containers
# share one network stack and one set of ports, which is why the payments
# service can be configured with `http://localhost:8081` and mean it. It is also
# the closest thing Compose has to a Kubernetes Pod, which is where §43 picks
# the story up.
#
# `demo.sh` starts services by name rather than running `up` on the whole file,
# so that only one proxy is ever up. Image tags are pinned in
# ../../docs/pinned-versions.md; nothing here says `latest`.
services:

  # ---- the supplier at the other end -----------------------------------------
  gateway:
    build: ./gateway
    container_name: sidecar-java-proxy-gateway
    volumes:
      # A certificate generated by demo.sh a moment ago, signed by nobody. The
      # provider is HTTPS-only, which is what makes the transport a concern each
      # proxy genuinely has to handle -- including the forty-line one.
      - ./build/certs:/certs:ro
    ports:
      # Published only so the demo script can read the provider's own ledger of
      # arrival times and reset it between acts. checkout does not use this
      # address; it could not, because it does not know it exists.
      - "19443:9443"

  # ---- checkout, started once and never restarted ----------------------------
  checkout:
    build: ./payments
    container_name: sidecar-java-proxy-checkout
    environment:
      SHOP_SERVICE_NAME: checkout
    ports:
      # Both the service (8080) and whatever proxy is bound (8081) are published
      # here, because a proxy sharing this namespace has no network of its own
      # to publish from. That asymmetry is the shared namespace showing through.
      - "18080:8080"
      - "18081:8081"
    depends_on:
      - gateway

  # ---- proxy one: twenty-two lines of somebody else's configuration ----------
  #
  # This is §41's proxy, mounting §41's configuration file unchanged. It retries
  # by moving to the next entry in an upstream group, and that move is immediate
  # -- which is correct for a pool of machines and wrong in front of a single
  # supplier having a bad three hundred milliseconds.
  sidecar-nginx:
    image: nginx:1.31.5-alpine
    container_name: sidecar-java-proxy-nginx
    network_mode: "service:checkout"
    environment:
      SERVICE_NAME: checkout
      # Substitute SERVICE_NAME and leave every other $variable alone. Without
      # this filter, envsubst would also replace nginx's own runtime variables
      # -- $upstream_status, $request_time -- with empty strings, and the access
      # log would come out blank with nothing complaining.
      NGINX_ENVSUBST_FILTER: SERVICE_NAME
    volumes:
      - ./sidecar/payments-sidecar.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - checkout

  # ---- proxy two: forty lines of yours ---------------------------------------
  #
  # Same namespace, same port, same policy, different language. Note what is not
  # here and is not needed: no link to checkout, no shared volume with it, no
  # environment variable telling checkout that anything changed. The only thing
  # these two containers have in common is a port number.
  sidecar-java:
    build: ./javaproxy
    container_name: sidecar-java-proxy-java
    network_mode: "service:checkout"
    environment:
      SERVICE_NAME: checkout
      PROVIDER_URL: https://gateway:9443/pay
    depends_on:
      - checkout
