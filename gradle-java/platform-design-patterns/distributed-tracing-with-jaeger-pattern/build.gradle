plugins {
    id 'java'
    id 'application'
}

group = 'com.jk.explore'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // OpenTelemetry, the vendor-neutral tracing library. The API is what the services call
    // (start a span, end a span, inject and extract the traceparent header); the SDK decides
    // what is kept and batches it; the OTLP exporter sends each batch to the collector over
    // HTTP. 1.66.0 is the newest release; the BOM keeps the three in step.
    implementation platform('io.opentelemetry:opentelemetry-bom:1.66.0')
    implementation 'io.opentelemetry:opentelemetry-api'
    implementation 'io.opentelemetry:opentelemetry-sdk'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'

    // Jackson reads the JSON that Jaeger's query API sends back. 3.2.3 is the newest release;
    // the 3.x line lives under the tools.jackson group.
    implementation 'tools.jackson.core:jackson-databind:3.2.3'

    // Testcontainers starts and stops the Jaeger container for us. 2.0.5 is the newest
    // release. There is no Jaeger module, so the plain container type from the core library
    // is used, told which two ports Jaeger listens on.
    implementation 'org.testcontainers:testcontainers:2.0.5'

    // Testcontainers logs through SLF4J. The simple binding is switched off in
    // src/main/resources so the demo's own output is the only output.
    implementation 'org.slf4j:slf4j-simple:2.0.17'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.jk.explore.tracingjaeger.JaegerTracingDemo'
}

test {
    useJUnitPlatform()
    testLogging {
        showStandardStreams = false
    }
}
