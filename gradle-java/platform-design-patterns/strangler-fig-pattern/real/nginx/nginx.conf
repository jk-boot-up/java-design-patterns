# The router. Two upstreams, and one file of routes that is edited to move a capability.
#
# Nothing in this file names a capability. That is in routes.conf, which demo.sh
# replaces and reloads: `nginx -s reload` swaps the configuration in without
# dropping a connection and without restarting any service.
events {}
http {
    upstream legacy { server legacy:8080; }
    upstream fresh  { server fresh:8080; }

    server {
        listen 8082;

        # Stock has not moved. It is legacy's, in every version of routes.conf.
        location /api/orders/stock { proxy_pass http://legacy; }

        # The shadow copy: the new service receives a duplicate of the request and its
        # answer is thrown away. The customer only ever sees the answer that was served.
        location = /internal-shadow {
            internal;
            proxy_pass http://fresh$request_uri;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }

        include /etc/nginx/routes/routes.conf;
    }
}
