# Checkout, and the proxy beside it, as one Pod.
#
# Read the two lists. `containers` holds the service, and it is the same image as
# in Docker Compose. `initContainers` holds the proxy, with one extra line:
# `restartPolicy: Always`. That line makes it a *native sidecar*: it starts
# before the service, must be running before the service starts, and keeps
# running beside it for the life of the Pod.
#
# What is missing matters as much: no `network_mode`, no `depends_on`, no shared
# network configured anywhere. The two containers reach each other on
# `localhost` because they are in one Pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
spec:
  replicas: 1
  selector:
    matchLabels: {app: checkout}
  template:
    metadata:
      labels: {app: checkout}
    spec:
      initContainers:
        - name: sidecar
          image: nginx:1.31.5-alpine
          imagePullPolicy: Never
          restartPolicy: Always               # a native sidecar
          env:
            - {name: SERVICE_NAME, value: checkout}
            - {name: NGINX_ENVSUBST_FILTER, value: SERVICE_NAME}
          volumeMounts:
            - name: sidecar-config
              mountPath: /etc/nginx/templates/default.conf.template
              subPath: default.conf.template
          startupProbe:
            httpGet: {path: /healthz, port: 8081}
            periodSeconds: 1
      containers:
        - name: checkout
          image: sidecar-k8s-payments:demo
          imagePullPolicy: Never
          env:
            - {name: SHOP_SERVICE_NAME, value: checkout}
          readinessProbe:
            httpGet: {path: /about, port: 8080}
            periodSeconds: 1
      volumes:
        - name: sidecar-config
          configMap:
            name: sidecar-config
