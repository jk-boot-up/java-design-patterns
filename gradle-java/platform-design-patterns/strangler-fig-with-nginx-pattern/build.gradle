plugins {
    id 'java'
    id 'application'
}

group = 'com.jk.explore'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Testcontainers starts and stops the NGINX container for us, and lets NGINX, inside
    // its container, reach the two shop services running in this program. 2.0.5 is the
    // newest release. There is no NGINX module in the 2.x line, so the plain container
    // type from the core library is used.
    implementation 'org.testcontainers:testcontainers:2.0.5'

    // Testcontainers logs through SLF4J. The simple binding is switched off in
    // src/main/resources so the demo's own output is the only output.
    implementation 'org.slf4j:slf4j-simple:2.0.17'

    // The two shop services are the JDK's own built-in HTTP server, com.sun.net.httpserver,
    // and the customer's browser is the JDK's HttpURLConnection. Neither needs a library.

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.jk.explore.stranglerfignginx.StranglerFigNginxDemo'
}

test {
    useJUnitPlatform()
    testLogging {
        showStandardStreams = false
    }
}
