apiVersion: v1
kind: ConfigMap
metadata:
  name: checkout-v1-conf
data:
  default.conf: |
    server {
      listen 80;
      default_type text/plain;
      location / { return 200 "v1"; }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: checkout-v2-conf
data:
  default.conf: |
    server {
      listen 80;
      default_type text/plain;
      location = /big { return 500 "v2 broke on big orders"; }
      location / { return 200 "v2"; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-v1
spec:
  replicas: 2
  selector:
    matchLabels: {app: checkout, version: v1}
  template:
    metadata:
      labels: {app: checkout, version: v1}
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 80}]
          readinessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 1
          volumeMounts: [{name: conf, mountPath: /etc/nginx/conf.d}]
      volumes: [{name: conf, configMap: {name: checkout-v1-conf}}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-v2
spec:
  replicas: 2
  selector:
    matchLabels: {app: checkout, version: v2}
  template:
    metadata:
      labels: {app: checkout, version: v2}
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 80}]
          readinessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 1
          volumeMounts: [{name: conf, mountPath: /etc/nginx/conf.d}]
      volumes: [{name: conf, configMap: {name: checkout-v2-conf}}]
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
spec:
  type: NodePort
  selector: {app: checkout, version: v1}
  ports: [{port: 80, targetPort: 80, nodePort: 30080}]
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-preview
spec:
  type: NodePort
  selector: {app: checkout, version: v2}
  ports: [{port: 80, targetPort: 80, nodePort: 30081}]
