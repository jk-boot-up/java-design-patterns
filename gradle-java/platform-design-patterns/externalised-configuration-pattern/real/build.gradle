// Settings shared by both Tier 2 services.
//
// Every version here comes from the category catalogue at
// `platform-design-patterns/gradle/libs.versions.toml`. Nothing in this file
// names a version directly, because eight projects each choosing their own
// Spring Boot is exactly the drift the catalogue exists to stop.
//
// The plugins are declared here with `apply false` so the version is resolved
// once, and then applied inside each subproject. A `plugins` block has to be
// the first thing in the file, which is why the comment above it is the only
// thing that comes before.

plugins {
    alias(libs.plugins.springBoot) apply false
    alias(libs.plugins.springDependencyManagement) apply false
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'

    group = 'com.jk.explore'
    version = '1.0.0'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    repositories {
        mavenCentral()
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:${libs.versions.springCloud.get()}"
        }
    }

    // Both services run from `real/` rather than from their own subdirectory.
    //
    // This is not cosmetic. The config server's native backend is configured
    // with `search-locations: file:./config-repo`, and a relative path is
    // resolved against the process working directory -- which Gradle would
    // otherwise set to `config-server/`, where there is no config-repo. The
    // server would then start perfectly happily and serve an empty document,
    // and the failure would surface one service away, as a checkout service
    // that will not start because `delivery.freeOver` is null.
    //
    // That is worth knowing even though it is fixed here, because it is the
    // characteristic shape of a configuration bug: the thing that breaks is
    // never the thing that is wrong.
    tasks.named('bootRun') {
        workingDir = rootProject.projectDir
    }
}
