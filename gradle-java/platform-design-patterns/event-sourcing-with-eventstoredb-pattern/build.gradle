plugins {
    id 'java'
    id 'application'
}

group = 'com.jk.explore'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // The KurrentDB Java client. KurrentDB is the new name of EventStoreDB; this client is
    // the renamed successor of com.eventstore:db-client-java. 1.2.1 is the newest release.
    // It talks to the server over gRPC on one port, 2113.
    implementation 'io.kurrent:kurrentdb-client:1.2.1'

    // Testcontainers starts and stops the KurrentDB container for us. 2.0.5 is the newest
    // release. There is no KurrentDB module, so the plain container type from the core
    // library is used, told which port to expose and which health check to wait for.
    implementation 'org.testcontainers:testcontainers:2.0.5'

    // Testcontainers and the KurrentDB client log through SLF4J. The simple binding is
    // switched off in src/main/resources so the demo's own output is the only output.
    implementation 'org.slf4j:slf4j-simple:2.0.17'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.jk.explore.eventsourcingeventstoredb.EventSourcingWithKurrentDemo'
}

test {
    useJUnitPlatform()
    testLogging {
        showStandardStreams = false
    }
}
