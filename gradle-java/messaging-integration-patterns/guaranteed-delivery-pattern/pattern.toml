[[scene]]
key = "01-poster"
kind = "poster"
title = "Guaranteed Delivery"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Guaranteed Delivery pattern, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] With guaranteed delivery, every message is stored safely on disk before it is accepted. [[slnc 300]] It is marked as done only after it has been delivered. [[slnc 300]] And after a crash, everything not marked as done is delivered again. [[slnc 600]]
Think of recorded delivery at the post office. [[slnc 300]] Each parcel is written in a ledger before you get your receipt. [[slnc 300]] The recipient signs when it arrives. [[slnc 300]] If a van breaks down, the ledger says exactly what to send out again. [[slnc 700]]
In this video, the domain is an online shop. [[slnc 300]] It sends an order confirmation email for every order, through a queue in front of a slow email provider. [[slnc 500]]
By the end, you will hear how messages in memory are lost. [[slnc 300]] How a journal on disk keeps them. [[slnc 300]] How acknowledgements work. [[slnc 300]] And why guaranteed means at least once.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["A confirmation email per order.", "", "A queue in front of a slow", "email provider.", "", "The queue lived in memory."]
narration = """
Here is the scenario. [[slnc 400]] Every order gets a confirmation email. [[slnc 500]]
The emails wait in a queue, because the email provider is slow. [[slnc 500]]
And that queue lived only in the server's memory.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["Store it on disk, then say", "\"accepted\".", "", "Deliver it, then write", "\"acknowledged\".", "", "After a crash: replay the rest."]
narration = """
Let's name the pattern. [[slnc 400]] Write each message to disk, and make sure it has reached the disk. [[slnc 300]] Only then tell the sender: accepted. [[slnc 500]]
When it is delivered, write a second line: acknowledged. [[slnc 500]]
After a crash, read the file, and deliver every message that was never acknowledged.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["Journal: send, acknowledge,", "unacknowledged", "EmailSender: the receiver", "MemoryQueue: the old way"]
narration = """
Here is who does what. [[slnc 400]] The journal writes messages and acknowledgements to one file, and finds what is still waiting. [[slnc 500]]
The email sender stands in for the slow email provider. [[slnc 500]]
And the memory queue is the old way, kept for comparison.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Durable queues in RabbitMQ", "Persistent messages in JMS", "Kafka's replicated log", "Transactional outbox"]
narration = """
You have probably met this pattern already. [[slnc 400]] RabbitMQ has durable queues and persistent messages. [[slnc 300]] So does J M S. [[slnc 500]]
Kafka writes every message to a log, copied across machines. [[slnc 500]]
And the transactional outbox stores messages in the database first, for the same reason.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Messages that must not be lost:", "orders, payments, confirmations.", "", "Expect duplicates.", "Trim what is acknowledged.", "", "Cheap to lose? Skip it."]
narration = """
So, when should you use it? [[slnc 400]] For messages that must not be lost. [[slnc 300]] Orders, payments, and confirmations. [[slnc 500]]
Expect duplicates, and make receivers cope with them. [[slnc 300]] Trim what has been acknowledged. [[slnc 500]]
And for messages that are cheap to lose, such as live price updates, skip it.
"""

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Make the email sender", "ignore duplicates."]
narration = """
That's the Guaranteed Delivery pattern. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Write it down before you say yes, and cross it off only when it has arrived. [[slnc 500]]
The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs offline, with nothing installed except a Java development kit. [[slnc 500]]
Here is one exercise to try. [[slnc 300]] Make the email sender skip any email it has already sent. [[slnc 500]]
If this helped, a like really does help other people find it. [[slnc 300]] And subscribe, if you'd like the rest of the series. [[slnc 400]] Thanks for watching.
"""
