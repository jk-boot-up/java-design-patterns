]
not_required = [
    "JMS or RabbitMQ. Queues are in memory.",
]

[docs.session]
objectives = [
    "Explain why replies arrive out of order.",
    "Correlate replies with a unique request ID.",
    "Use a return address to share a service between requesters.",
    "Handle replies that never arrive.",
]
walkthrough = """
Run `./gradlew run` and read act one's swapped answers. Open `Requester`: the
waiting table, `send`, and the listener that looks up each reply's
correlation ID. End on act five and ask how checkout could find out whether the
lost reservation happened.
"""
exercises = [
    "Remove timed-out requests from the waiting table automatically.",
    "Add a 'status of request' query so checkout can ask about WEB-24.",
    "Make the inventory service reply twice by mistake. What should the requester do with the second reply?",
]

[docs.explained]
sentence = """
Request-Reply with a correlation identifier gives each request a unique ID
and a return address, and each reply the ID it answers, so replies are matched
whatever order they arrive in.
"""
verdict = """
Use it whenever services talk through queues and one needs an answer from
another. Always set an ID, a return address and a timeout, clean up the
waiting table, and design for not knowing the outcome of a lost reply.
"""
recognise = [
    "`correlationId` and `replyTo` headers on messages.",
    "A map from request ID to a future or callback.",
    "Temporary reply queues per requester.",
]

[spec]
purpose = """
Teach Request-Reply with Correlation Identifier with an online store's stock
reservations over queues: replies matched by order swapping kettle and mug
answers, then IDs and correlation identifiers, return addresses for web and
app, twenty in flight all matched, and a lost reply left waiting.
"""
nongoals = [
    "Not a message broker. Queues are in memory.",
    "Not idempotency. Duplicate replies are an exercise.",
]
problem = """
When replies come back over a queue in a different order from the requests,
matching them by position gives each question the wrong answer.
"""
roles = [
    ["The pattern", "`Requester` (IDs, return address, waiting table)"],
    ["The service", "`InventoryService`"],
    ["The messages", "`Message`"],
    ["The naive version", "`InOrderRequester`"],
    ["Entry point", "`RequestReplyDemo`, five acts"],
]
requirements = [
    "**Correlated:** every reply names its request's ID.",
    "**Return address:** replies go to the requester's own queue.",
    "**Any order:** twenty concurrent requests are all matched.",
    "**Timeouts:** a lost reply is reported, not waited on for ever.",
    "**Every printed result is asserted** in `DemoRunsTest`.",
]

