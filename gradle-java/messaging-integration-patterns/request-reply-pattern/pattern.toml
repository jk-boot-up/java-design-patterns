[[scene]]
key = "01-poster"
kind = "poster"
title = "Request-Reply with Correlation Identifier"
narration = """
Hello, and welcome. [[slnc 400]] This video explains Request-Reply with a Correlation Identifier, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] When services talk through queues, each request gets a unique ID, and says where the reply should go. [[slnc 300]] Each reply names the ID of the request it answers. [[slnc 300]] So replies can come back in any order, and still be matched. [[slnc 600]]
Think of a theatre cloakroom. [[slnc 300]] You hand in your coat, and get a numbered ticket. [[slnc 300]] Coats come back in any order. [[slnc 300]] You take the one whose number matches your ticket. [[slnc 700]]
In this video, the domain is an online shop. [[slnc 300]] Checkout reserves stock by sending requests over a queue to an inventory service, which works on several at once. [[slnc 500]]
By the end, you will hear how matching replies by order goes wrong. [[slnc 300]] How IDs and return addresses fix it. [[slnc 300]] How many requests can be in flight. [[slnc 300]] And what a lost reply costs.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["Checkout -> request queue ->", "inventory service.", "", "Kettles: a slow system.", "Mugs: a fast one.", "", "Replies come back in any order."]
narration = """
Here is the scenario. [[slnc 400]] Checkout asks the inventory service to reserve stock. [[slnc 300]] It sends each request over a queue. [[slnc 500]]
The inventory service works on several at once. [[slnc 300]] Kettles are checked in a slow warehouse system. [[slnc 300]] Mugs, in a fast one. [[slnc 500]]
So the replies come back in whatever order they finish.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["Each request: a unique ID", "and a return address.", "", "Each reply: the ID it answers,", "the correlation identifier.", "", "Match replies in a waiting table."]
narration = """
Let's name the pattern. [[slnc 400]] Give each request a unique ID, and a return address: the queue its reply should go to. [[slnc 500]]
Each reply carries the ID of the request it answers. [[slnc 300]] That is the correlation identifier. [[slnc 500]]
The requester keeps a table of questions waiting for answers, and matches each reply by its ID.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["Requester: IDs, reply queue, waiting table", "InventoryService: replies to replyTo", "Message: id, correlationId, replyTo", "InOrderRequester: the old way"]
narration = """
Here is who does what. [[slnc 400]] The requester gives out IDs, owns a reply queue, and keeps the waiting table. [[slnc 500]]
The inventory service reads the requests, and sends each reply to the queue the request named. [[slnc 500]]
A message carries its ID, the ID it answers, its return address, and a body. [[slnc 300]] And the in-order requester is the old way, kept for comparison.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["JMSCorrelationID, JMSReplyTo", "RabbitMQ correlation_id, reply_to", "Tracking numbers on replies"]
narration = """
You have probably met this pattern already. [[slnc 400]] J M S messages have a correlation ID and a reply-to header. [[slnc 500]]
RabbitMQ has the same two properties. [[slnc 500]]
And every email that quotes your order number is a reply with a correlation identifier.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Services that talk through queues", "and need answers.", "", "Always: an ID, a return address,", "a timeout, and clean-up.", "", "Plan for unknown outcomes."]
narration = """
So, when should you use it? [[slnc 400]] Whenever services talk through queues, and one needs an answer from another. [[slnc 500]]
Always set an ID, a return address, and a timeout. [[slnc 300]] Clean up the waiting table. [[slnc 500]]
And design for the case where a reply is lost, and you do not know what happened.
"""

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Clean up timed-out", "requests automatically."]
narration = """
That's Request-Reply with a Correlation Identifier. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Number every question, and make every answer quote the number. [[slnc 500]]
The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs offline, with nothing installed except a Java development kit. [[slnc 500]]
