# pattern.toml for the Request-Reply with Correlation Identifier project. See tools/patternkit.

[project]
slug = "request-reply"
category = "messaging-integration-patterns"
title = "Request-Reply with Correlation Identifier"
package = "requestreply"
main_class = "RequestReplyDemo"
tagline = "Match every answer to its question"
bold = "Give every request over a queue a unique ID and a return address, and make every reply name the ID it answers, so replies can arrive in any order and still be matched."
youtube_description = """Request-Reply pattern with a Correlation Identifier in Java, explained with an online store checkout that reserves stock by sending requests over a queue to an inventory service that works on several at once. Each request gets a unique ID and says where the reply should go, and each reply quotes that ID, so replies can return in any order and still be matched, like numbered cloakroom tickets. We watch replies matched by arrival order go wrong, add correlation IDs and return addresses, and keep many requests in flight at once. We finish with the bill."""
domain_note = ""
thumb_lines = ["REQUEST-REPLY", "CORRELATION ID"]
thumb_code = "reply.correlationId()"
youtube_title = "Request-Reply with Correlation Identifier"
youtube_tags = ["request reply", "correlation identifier", "return address", "enterprise integration patterns", "messaging", "java"]

[readme]
intro = """
Request-Reply over messaging is how one service asks another a question when
they only talk through queues. Three Enterprise Integration Patterns work
together. The request carries a return address, the queue the answer should
go to. It carries a unique ID. And the reply carries a correlation identifier,
the ID of the request it answers.

Replies can then come back in any order, from a service working on many
requests at once, and each is matched to the right question. Several
requesters can share one service, each receiving only its own replies.
"""
analogy = """
Think of a theatre cloakroom. You hand in your coat and get a numbered
ticket. The attendant brings coats back in whatever order they find them, but
you only take the one whose number matches your ticket. And if your coat
never comes back, you are left holding a ticket, not knowing whether it was
hung up or lost.
"""
scenario = """
The online store's checkout asks the inventory service to reserve stock by
sending requests over a queue. The inventory service works on several requests
at once: kettles are checked in a slow warehouse system, mugs in a fast one.
Checkout assumed the replies came back in the order it asked, and a refusal
for kettles was taken as the answer about mugs.
"""
costs = [
    "**Replies that never come.** A lost reply leaves the request in the waiting table until something times it out.",
    "**Unknown outcomes.** After a timeout, the requester cannot tell whether the stock was reserved or not.",
    "**More plumbing.** IDs, reply queues, a waiting table and a listener, where a method call had none.",
]
too_much = """
When a direct call over HTTP is possible and the service answers quickly, a
plain request and response is simpler. Messaging request-reply is for
services that only talk through queues, or where requests must survive the
service being briefly unavailable.
"""
met_before = [
    "JMS's `JMSCorrelationID` and `JMSReplyTo` headers.",
    "RabbitMQ's `correlation_id` and `reply_to` properties.",
    "Tracking numbers and order references on any reply you receive by email.",
]
where = """
This project is in [messaging-integration-patterns](..), next to
[Message Channel](../message-channel-pattern), the queues the requests and
replies travel on, and near
[Asynchronous Request-Reply](../../micro-services-design-patterns/async-request-reply-pattern),
the same idea over HTTP.
"""

[[act]]
title = "Replies matched by order"
summary = "Checkout asks about kettles then mugs; the mug reply arrives first and is taken as the kettle's: kettle RESERVED, mug REFUSED."
detail = """
`InOrderRequester` sends "reserve KETTLE-1 x 5" and then "reserve MUG-1 x 2",
and takes replies in the order they arrive. The mug check is fast and replies
first: "RESERVED 2 x MUG-1" is taken as the kettle's answer. The kettle's
real answer, "REFUSED", because only four exist, is taken as the mug's.
"""
speech = """
First demo: two requests, with replies assumed to come back in the same order. [[slnc 400]] Checkout asks to reserve five kettles. [[slnc 300]] Then two mugs. [[slnc 600]]
The mug check is fast, so its reply comes back first. [[slnc 300]] Checkout takes it as the kettle's answer: reserved. [[slnc 500]]
Then the kettle's real answer arrives: refused, because only four exist. [[slnc 300]] Checkout takes that as the mug's answer. [[slnc 300]] Both are wrong.
"""
rows = { checkout = "active wrong", inventory = "active amber" }
console = [
    ["KETTLE-1 x 5 -> RESERVED 2 x MUG-1", "bad"],
    ["MUG-1 x 2 -> REFUSED 5 x KETTLE-1", "bad"],
]

[[act]]
title = "Correlation IDs"
summary = "Requests WEB-1 and WEB-2 carry IDs; replies name them: kettle REFUSED, mug RESERVED, whatever order they arrive in."
detail = """
`Requester.send` gives each request a unique ID, WEB-1 and WEB-2, and keeps
it in a waiting table. The inventory service copies the ID into its reply as
the correlation identifier. The mug reply still arrives first, but it names
WEB-2, so each answer goes to the right question.
"""
speech = """
Second demo: correlation IDs. [[slnc 400]] Each request now carries a unique ID. [[slnc 300]] The kettle request is web one. [[slnc 300]] The mug request is web two. [[slnc 600]]
The inventory service copies that ID into its reply. [[slnc 500]]
The mug reply still arrives first. [[slnc 300]] But it says: I answer web two. [[slnc 300]] So the kettle is refused, and the mugs are reserved. [[slnc 300]] Both correct.
"""
rows = { checkout = "active ok", inventory = "active ok", pending = "active ok" }
console = [
    ["WEB-1 KETTLE-1 x 5 -> REFUSED", "ok"],
    ["WEB-2 MUG-1 x 2 -> RESERVED", "ok"],
]

[[act]]
title = "Return addresses"
summary = "The phone app and web checkout share the inventory service; each reply goes to the queue named in its request."
detail = """
A second requester, the phone app, uses the same inventory service. Each
request names its own reply queue as its return address, so the app's teapot
reservation (APP-1) comes back to the app and the web's (WEB-3) to the web.
"""
speech = """
Third demo: return addresses. [[slnc 400]] The phone app uses the same inventory service as the web checkout. [[slnc 500]]
Each request says where its reply should go. [[slnc 300]] The app's own queue, or the web's own queue. [[slnc 600]]
The app's teapot reservation comes back to the app. [[slnc 300]] The web's comes back to the web.
"""
rows = { app = "active ok", checkout = "active ok", inventory = "active ok" }
console = [
    ["phone app APP-1 -> RESERVED 1 x TEAPOT-1", "ok"],
    ["web WEB-3 -> RESERVED 2 x TEAPOT-1", "ok"],
]

[[act]]
title = "Many in flight"
summary = "20 requests sent before any reply: all 20 answered and matched; 0 left waiting."
detail = """
Checkout sends twenty requests before a single reply has come back. The
inventory service works on them in parallel and replies in whatever order it
finishes. All twenty are matched to their requests, and none is left waiting.
"""
speech = """
Fourth demo: many requests in flight at once. [[slnc 400]] Checkout sends twenty requests, before a single reply has come back. [[slnc 500]]
The replies arrive in whatever order the inventory service finishes them. [[slnc 600]]
All twenty are answered, and matched. [[slnc 300]] None is left waiting.
"""
rows = { checkout = "active ok", inventory = "active ok", pending = "active ok" }
console = [
    ["20 sent: 20 answered and matched", "ok"],
    ["requests still waiting: 0", "ok"],
]

[[act]]
title = "The bill"
summary = "A reply is lost: WEB-24 gets no reply after 500 ms and stays in the waiting table; was it reserved?"
detail = """
The inventory service's reply to WEB-24 is lost. Checkout waits 500
milliseconds and gives up, but the request is still in the waiting table
until something cleans it up. And checkout cannot tell whether the mug was
reserved or not.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] A reply is lost on the way back. [[slnc 500]]
Checkout waits half a second, and gives up. [[slnc 300]] But the request is still in its waiting table. [[slnc 300]] Someone must time it out, and clean up. [[slnc 600]]
And was the mug reserved, or not? [[slnc 300]] Checkout cannot tell.
"""
rows = { checkout = "active wrong", pending = "active amber" }
console = [
    ["WEB-24: no reply after 500 ms", "bad"],
    ["still waiting: 1", "amber"],
    ["reserved or not? unknown", "amber"],
]

[animation]
subtitle = "Checkout and the app send requests with IDs and return addresses; the inventory service's replies name the request they answer."
boxes = [
    ["checkout", "Web checkout", "WEB-1, WEB-2, ..."],
    ["app", "Phone app", "APP-1"],
    ["inventory", "Inventory service", "replies in any order"],
    ["pending", "Waiting table", "ID -> question"],
]

[docs.problem]
scenario = """
Checkout reserves stock by sending requests to the inventory service over a
queue; the service works on several at once.
"""
naive = """
`InOrderRequester` takes replies in arrival order and matches them to
requests by position, swapping the kettle and mug answers.
"""
deliver = [
    "Wrong matches shown when replies are taken in order.",
    "Unique IDs and correlation identifiers matching replies correctly.",
    "Return addresses separating two requesters' replies.",
    "Twenty requests in flight, all matched.",
    "A lost reply timing out and staying in the waiting table.",
