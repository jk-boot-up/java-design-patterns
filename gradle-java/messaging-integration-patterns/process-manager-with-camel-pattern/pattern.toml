[[scene]]
key = "01-poster"
kind = "poster"
title = "Process Manager with Apache Camel"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Process Manager pattern, built with Apache Camel's saga step, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] A process manager runs a journey of several steps, from one place. [[slnc 300]] It decides each next step, and makes sure every journey ends in a known state. [[slnc 500]] Apache Camel is an open-source library for moving messages. [[slnc 300]] Its saga step runs such journeys, and undoes earlier steps when a later one fails. [[slnc 600]]
Think of a travel agent booking a flight, a hotel, and a car. [[slnc 300]] The agent notes how to cancel each booking. [[slnc 300]] If the car fails, the agent cancels the hotel and the flight, and rings the customer. [[slnc 700]]
In this video, the domain is an online shop's orders, which reserve stock, take payment, and ship. [[slnc 500]]
By the end, you will hear how a declined card stranded stock. [[slnc 300]] How a saga owns each journey. [[slnc 300]] How Camel runs the undo steps. [[slnc 300]] And what a saga costs.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["Reserve stock, take payment, ship.", "", "Each step handed on to the next.", "", "A declined card left", "a kettle reserved for ever."]
narration = """
Here is the scenario. [[slnc 400]] Each order reserves stock, takes payment, and ships. [[slnc 500]]
Each step simply handed on to the next. [[slnc 500]]
When a card was declined, the kettle reserved for it was never given back.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern, in Camel"
body = ["saga(): one route owns the journey.", "", "Each step names its undo.", "", "Camel calls the undo steps,", "then completion or cancellation."]
narration = """
Let's name the pattern, in Camel's words. [[slnc 400]] The saga step makes one route own the whole journey. [[slnc 500]]
Each step that changes something names its undo step. [[slnc 500]]
When a step fails, Camel calls the undo steps, then the cancellation route. [[slnc 300]] When all goes well, the completion route.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["ShopRoutes: the saga and its routes", "Services: reserve, pay, ship, release", "InMemorySagaService: tracks sagas", "Order: the message"]
narration = """
Here is who does what. [[slnc 400]] Shop routes declares the saga, and its completion and undo routes. [[slnc 500]]
The services do the work. [[slnc 300]] Reserve, pay, ship, and release. [[slnc 500]]
The saga service keeps track of each journey while the program runs. [[slnc 300]] And the order is the message.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Camel Saga with an LRA coordinator", "Temporal and Axon", "Travel bookings"]
narration = """
You have probably met this already. [[slnc 400]] Camel's saga, often with a separate coordinator service. [[slnc 500]]
Workflow engines, such as Temporal and Axon. [[slnc 500]]
And every travel booking, where a failed step cancels the earlier ones.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["A journey across services,", "each changing something.", "", "An undo for every step.", "A durable coordinator", "in production."]
narration = """
So, when should you use it? [[slnc 400]] When a journey crosses several services, and each one changes something. [[slnc 500]]
Write an undo for every step. [[slnc 300]] Remember that undo is not rewind. [[slnc 300]] And use a durable coordinator in production.
"""

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add an undo", "step for shipping."]
narration = """
That's the Process Manager, with Apache Camel's saga. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] One place owns the journey, and every step knows how to undo itself. [[slnc 500]]
The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs offline, with nothing installed except a Java development kit. [[slnc 500]]
Here is one exercise to try. [[slnc 300]] Add an undo step for shipping, that books a return label. [[slnc 500]]
If this helped, a like really does help other people find it. [[slnc 300]] And subscribe, if you'd like the rest of the series. [[slnc 400]] Thanks for watching.
"""
