plugins {
    id 'java'
    id 'application'
}

group = 'com.jk.explore'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Apache Camel 4.20.0, the newest generally available release. camel-core holds the routing engine and the route DSL;
    // camel-spring-rabbitmq is the component that reads from and writes to a RabbitMQ queue.
    implementation platform('org.apache.camel:camel-bom:4.20.0')
    implementation 'org.apache.camel:camel-core'
    implementation 'org.apache.camel:camel-spring-rabbitmq'

    // The RabbitMQ Java client 5.36.0, the newest release, used directly by the demo to put orders
    // on a queue and to look at how many are sitting on each one. Camel does the routing; this only looks.
    implementation 'com.rabbitmq:amqp-client:5.36.0'

    // Testcontainers 2.0.5 starts and stops the RabbitMQ container for the demo itself.
    // In the 2.x line every module carries the `testcontainers-` prefix.
    implementation 'org.testcontainers:testcontainers-rabbitmq:2.0.5'

    // Camel and Testcontainers log through SLF4J; the simple binding is set to `error`.
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.17'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.jk.explore.camelrouter.CamelRouterDemo'
}

test {
    useJUnitPlatform()
}
