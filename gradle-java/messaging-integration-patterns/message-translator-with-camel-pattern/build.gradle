plugins {
    id 'java'
    id 'application'
}

group = 'com.jk.explore'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Apache Camel 4.22.1, the newest generally available release. camel-core holds the routing engine,
    // the route language and the in-memory direct: endpoints; the three data formats read CSV, JSON and XML.
    implementation platform('org.apache.camel:camel-bom:4.22.1')
    implementation 'org.apache.camel:camel-core'
    implementation 'org.apache.camel:camel-csv'
    implementation 'org.apache.camel:camel-jackson'
    implementation 'org.apache.camel:camel-xpath'

    // Camel logs through SLF4J; the simple binding is set to show errors only (src/main/resources).
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.17'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.jk.explore.translatorcamel.CamelTranslatorDemo'
}

test {
    useJUnitPlatform()
}
