[[scene]]
key = "01-poster"
kind = "poster"
title = "Message Translator with Apache Camel"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Message Translator pattern, built with Apache Camel, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] A message translator turns a message from one format into another. [[slnc 300]] So a receiver only ever sees the one format it understands. [[slnc 500]] Apache Camel is an open-source library for moving messages, and it has translators built in. [[slnc 600]]
Think of an international post room. [[slnc 300]] A desk sees which language each letter is in, and passes it to that language's translator. [[slnc 300]] Every translator writes the same standard form, for the office upstairs. [[slnc 700]]
In this video, the domain is an online shop's warehouse, taking orders from its web form and from marketplaces. [[slnc 500]]
By the end, you will hear how Camel refuses a foreign format. [[slnc 300]] How each format becomes a route. [[slnc 300]] How a normalizer picks the right one. [[slnc 300]] And what the framework costs.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["Web form: key=value.", "Marketplace A: CSV.", "Marketplace B: JSON.", "Later, marketplace C: XML.", "", "The warehouse needs one format."]
narration = """
Here is the scenario. [[slnc 400]] The shop's web form sends key and value text. [[slnc 300]] Marketplace A sends CSV. [[slnc 300]] Marketplace B sends JSON. [[slnc 300]] And later, marketplace C sends XML. [[slnc 600]]
The warehouse must only ever see one standard order.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern, in Camel"
body = ["A translator is a route.", "", "A data format reads the text.", "", "A normalizer route sends each", "message on by format name."]
narration = """
Let's name the pattern, in Camel's words. [[slnc 400]] Each translator is a route. [[slnc 500]]
A data format reads the text into Java objects. [[slnc 500]]
And a normalizer route sends each message to the translator whose name matches its format.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["ShopRoutes: every route", "Translators: field mapping", "OrderMessage: the standard order", "Warehouse: receives only that"]
narration = """
Here is who does what. [[slnc 400]] Shop routes holds every route, the normalizer, the translators, and the warehouse. [[slnc 500]]
The translators class maps each format's fields to the standard names. [[slnc 500]]
Order message is the standard order. [[slnc 300]] And the warehouse receives nothing else.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Camel in Spring Boot and Quarkus", "Spring Integration transformers", "MuleSoft DataWeave"]
narration = """
You have probably met this already. [[slnc 400]] Camel routes run inside many Spring Boot and Quarkus services. [[slnc 500]]
Spring Integration calls translators, transformers. [[slnc 500]]
And MuleSoft's DataWeave is the same idea, in another tool.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Many formats and transports.", "Translators added over time.", "", "A few stable formats?", "The plain version is simpler."]
narration = """
So, when should you use Camel for this? [[slnc 400]] When there are many formats and transports, and translators arrive over time. [[slnc 500]]
For a few formats that rarely change, the plain Java version is simpler, and easier to debug.
"""

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Send unknown", "formats to a dead-letter route."]
narration = """
That's the Message Translator, with Apache Camel. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Each format gets its own route, and the receiver only ever sees one shape. [[slnc 500]]
The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs offline, with nothing installed except a Java development kit. [[slnc 500]]
Here is one exercise to try. [[slnc 300]] Send orders in an unknown format to a dead-letter route. [[slnc 500]]
If this helped, a like really does help other people find it. [[slnc 300]] And subscribe, if you'd like the rest of the series. [[slnc 400]] Thanks for watching.
"""
