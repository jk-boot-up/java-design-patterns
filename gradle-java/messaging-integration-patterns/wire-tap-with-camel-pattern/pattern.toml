# pattern.toml for the Wire Tap with Apache Camel project. See tools/patternkit.

[project]
slug = "wire-tap-with-camel"
category = "messaging-integration-patterns"
title = "Wire Tap with Apache Camel"
package = "wiretapcamel"
main_class = "CamelWireTapDemo"
tagline = "wireTap(): a copy on the side"
bold = "Build the wire tap with Apache Camel: wireTap() sends a copy of every payment to an audit route on its own thread, and onPrepare() makes sure the copy is truly a copy."
youtube_description = """Wire Tap pattern in Java: a wire tap sends a copy of every message to a side channel while sender and receiver carry on as if nothing were listening, like a camera over a shop till that must only ever see a copy of the receipt. Explained with Apache Camel, using an online store's payments and the auditors who want a copy of each one. We tap every payment with one Camel step, discover that masking the card number in the tap also changed the real payment because it was not a copy after all, fix it with onPrepare, and watch the audit stop. We finish with the bill."""
domain_note = ""
thumb_lines = ["WIRE TAP", "WITH CAMEL"]
thumb_code = "wireTap(\"direct:audit\")"
youtube_title = "Wire Tap with Apache Camel"
youtube_tags = ["wire tap", "apache camel", "enterprise integration patterns", "auditing", "onprepare", "java"]

[readme]
intro = """
This is the framework version of the Wire Tap pattern. The plain Java
version, a separate project in this category, builds the tap by hand. Here
Apache Camel provides it: one `wireTap("direct:audit")` step in the payments
route sends a copy of every message to an audit route, while the payment
service carries on as if nothing were listening.

Camel's tap runs on its own thread, so a slow audit does not slow payments.
It also has a trap the plain version did not: by default the tap is handed the
same message object, so a tap that changes it changes the real message.
`onPrepare()` fixes that by giving the tap its own copy.
"""
analogy = """
Think of a shop's CCTV camera over the till. It watches every sale without
the cashier doing anything differently, and the recording goes to a separate
room. But if the camera room could reach through and change the receipt in
the customer's hand, that would be a problem; the camera must only ever see
a copy.
"""
scenario = """
The online store's payment service handled charges and refunds. Logging had
been typed into it by hand, it missed the refund path, and it wrote full card
numbers. Auditors want a masked copy of every payment message, without
changing checkout or the payment service.
"""
run_note = """
Nothing to install beyond a Java 21 JDK: Camel runs inside the program on its
in-memory `direct:` endpoints.
"""
twin = """
The plain Java version got the idea right: a copy of every message goes to a
side channel, the sender and receiver are unchanged, taps can be attached and
detached, and a slow tap on the same thread slows everything. What it left out
is what Camel does differently: its tap runs on a thread pool, so a slow audit
no longer slows payments but lags behind instead, with copies waiting in
memory; it hands the tap the same object unless you ask for a copy; and a
failing tap never breaks the main route. The plain version could not show
the shared-object trap, because it copied by design.
"""
technologies = [
    ["Apache Camel", "4.22.1", "wireTap(), onPrepare() and route control"],
    ["SLF4J simple", "2.0.17", "Camel's logging, switched off"],
]
costs = [
    "**Shared object by default.** Without `onPrepare()`, the audit's masking changed the real payment instruction.",
    "**Copies in memory.** A slow tap lags behind; copies still waiting are lost if the program stops. A real audit should tap to a durable queue.",
    "**Silent failures.** A failing tap never reaches the sender, so its errors must be watched separately.",
]
too_much = """
If one service needs a log line, logging inside it is simpler. The wire tap
pays off when a copy of traffic is needed on the side, by auditors or a
dashboard, without touching sender or receiver.
"""
met_before = [
    "Camel's `wireTap()` and Spring Integration's `wire-tap` interceptor.",
    "Port mirroring on network switches.",
    "Kafka consumers that read a topic purely for auditing or analytics.",
]
where = """
This project is in [messaging-integration-patterns](..). It is the framework
version of the plain Java Wire Tap project in the same category, which is left
unchanged.
"""

[[act]]
title = "A tap on the route"
summary = "wireTap(\"direct:audit\") copies all 4 payments, the refund included, with cards masked; payment handles all 4, unchanged."
detail = """
One step, `wireTap("direct:audit")`, goes into the payments route. Every
message, the refund included, is copied to the audit route, which masks the
card number and records a line: four of four. The payment service handles all
four payments as before, and neither checkout nor the payment service changed.
"""
speech = """
First demo: a wire tap on the payments route. [[slnc 400]] One step is added to the route. [[slnc 300]] It sends a copy of every message to the audit. [[slnc 600]]
All four payments are copied. [[slnc 300]] The refund too. [[slnc 300]] Card numbers are masked in the audit. [[slnc 500]]
The payment service handles all four, as before. [[slnc 300]] It was not changed.
"""
rows = { tap = "active ok", audit = "active ok", payment = "active ok" }
console = [
    ["audit: 4 of 4, cards masked", "ok"],
    ["payment handled 4", "ok"],
]

[[act]]
title = "Not a copy after all"
summary = "The tap was handed the same object: checkout's own ORD-1 message now reads card **** 1234."
detail = """
Camel's tap is handed the same message object as the main route, not a copy.
The audit's masking therefore changed the real payment instruction: checkout's
own ORD-1 message now reads card **** 1234. In a real payment system, that is
a charge that fails.
"""
speech = """
Second demo: the tap was not handed a copy. [[slnc 400]] Camel gave the audit the very same message object. [[slnc 600]]
So when the audit masked the card number, it masked the real one. [[slnc 500]]
Checkout's own payment message now shows only the last four digits. [[slnc 300]] A real charge would fail.
"""
rows = { tap = "active wrong", payment = "active wrong" }
console = [
    ["ORD-1 now: card **** 1234", "bad"],
]

[[act]]
title = "onPrepare: a real copy"
summary = "With onPrepare(copy), the audit still gets 4 lines and checkout's ORD-1 keeps its full card number."
detail = """
`onPrepare()` runs on the tap's message before it is sent. Replacing the body
there with a fresh copy gives the audit its own object. The audit still gets
four masked lines, and checkout's ORD-1 message keeps its full card number.
"""
speech = """
Third demo: give the tap its own copy. [[slnc 400]] Camel has a step for this, called on prepare. [[slnc 300]] It runs just before the copy is sent. [[slnc 600]]
There, the message is copied. [[slnc 500]]
The audit still gets four masked lines. [[slnc 300]] And checkout's message keeps its full card number.
"""
rows = { tap = "active ok", audit = "active ok", payment = "active ok" }
console = [
    ["audit lines: 4", "ok"],
    ["ORD-1 card unchanged", "ok"],
]

[[act]]
title = "The audit stops"
summary = "With the audit route stopped, ORD-4 is still charged; the failed copy never reaches checkout or payment."
detail = """
The audit route is stopped, as it might be for maintenance. ORD-4 is sent:
the tap's copy fails, but that failure stays on the tap's side. ORD-4 is
charged, and neither checkout nor the payment service ever hears about it.
"""
speech = """
Fourth demo: the audit stops. [[slnc 400]] The audit route is switched off, for maintenance. [[slnc 600]]
Another order is paid. [[slnc 300]] The copy to the audit fails. [[slnc 500]]
But the order is still charged. [[slnc 300]] Checkout and the payment service never hear about it.
"""
rows = { audit = "active wrong", payment = "active ok" }
console = [
    ["audit stopped", "muted"],
    ["ORD-4 still charged", "ok"],
]

[[act]]
title = "The bill"
summary = "An audit taking 100 ms per copy: 4 payments take under 0.3 s, but the audit lags behind and catches up later; waiting copies live only in memory."
detail = """
The audit is made slow: 100 milliseconds per copy. Four payments still take
under 0.3 seconds, not the 0.4 seconds four slow copies add up to, because the
tap runs on its own thread. The price is lag: the audit catches up only later,
and copies waiting in memory are lost if the program stops. A real audit
should tap to a durable queue.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] The audit is made slow. [[slnc 300]] A tenth of a second, for every copy. [[slnc 600]]
Four payments still finish quickly. [[slnc 300]] The tap runs on its own thread. [[slnc 500]]
But the audit falls behind, and only catches up later. [[slnc 300]] And copies still waiting are only in memory. [[slnc 300]] If the program stops, they are lost. [[slnc 600]]
For a real audit, tap to a durable queue.
"""
rows = { audit = "active amber", payment = "active ok" }
console = [
    ["4 payments: under 0.3 s", "ok"],
    ["audit lags, catches up later", "amber"],
]

[animation]
subtitle = "Checkout sends payments through a route; the wire tap copies each one to the audit on its own thread."
boxes = [
    ["tap", "wireTap()", "copy on the side"],
    ["payment", "Payment service", "charges and refunds"],
    ["audit", "Audit route", "masks cards, records"],
]

