[docs.prerequisites]
required = [
    "Java basics: classes, lists, threads in outline.",
    "The Wire Tap idea, ideally from the plain Java version of this pattern.",
]
not_required = [
    "Docker or a broker. Camel runs in memory.",
]

[docs.dependencies]
intro = """
This project uses Apache Camel, which the plain Java version of Wire Tap does
not. Skipping it loses none of the pattern: the plain version teaches all of
it with nothing installed.
"""
what = [
    ["Apache Camel", "Camel is a library for moving messages. A route begins with from and lists steps. wireTap sends a copy of the current message to another endpoint on a separate thread and carries on at once. onPrepare runs a piece of code on that copy just before it is sent; it is where the copy is made independent. The route controller can stop and start a route while the program runs."],
]
why = """
The plain version shows the idea. This version shows what a real integration
library does differently: a tap on its own thread, and a shared-object trap
that must be closed on purpose.
"""
install_note = "Only a JDK, version 21. Gradle downloads the rest, and the versions are pinned:"
versions = [
    ["Java", "21"],
    ["Apache Camel (core)", "4.22.1"],
    ["SLF4J simple", "2.0.17"],
]
costs = [
    "More than ten library files on the classpath.",
    "A thread pool whose waiting copies are lost if the program stops.",
]

[docs.session]
objectives = [
    "Add a `wireTap()` to a Camel route.",
    "Explain why the tap shares the message object, and fix it with `onPrepare()`.",
    "Show that a failing tap does not affect the main route.",
    "Explain the lag of an asynchronous tap.",
]
walkthrough = """
Run `./gradlew run`. Compare act two's masked ORD-1 with act three's full card
number. Open `ShopRoutes`: the only difference is the `onPrepare` line. End
on act five's lag.
"""
exercises = [
    "Make `PaymentMessage` immutable and remove `onPrepare`; explain why the trap disappears.",
    "Tap to a SEDA queue with a size limit, and see what happens when it fills.",
    "Add a second tap for a sales dashboard that sums net takings.",
]

[docs.explained]
sentence = """
With Camel, a wire tap is one `wireTap()` step that copies each message to a
side route on its own thread; `onPrepare()` makes the copy independent.
"""
verdict = """
Use `wireTap()` for auditing and monitoring without touching sender or
receiver. Always make the copy independent, watch the tap's errors
separately, and tap to a durable queue when no copy may be lost.
"""
recognise = [
    "`.wireTap(\"...\")` in a route.",
    "`.onPrepare(...)` after a wire tap.",
    "An audit or metrics route fed from a tap.",
]

[spec]
purpose = """
Teach Wire Tap with Apache Camel: a tap copying every payment, the shared
object trap, onPrepare giving an independent copy, a stopped audit not
affecting payments, and a slow audit lagging behind.
"""
nongoals = [
    "Not a real broker or durable audit store. Everything runs in memory.",
]
problem = """
A copy of every message is needed on the side without changing the sender or
the receiver.
"""
roles = [
    ["The routes and the tap", "`ShopRoutes`"],
    ["The side channel", "`Audit`"],
    ["The receiver", "`PaymentService`"],
    ["The message", "`PaymentMessage`"],
    ["Entry point", "`CamelWireTapDemo`, five acts"],
]
requirements = [
    "**Every message:** charges and refunds are all copied.",
    "**Independent:** with `onPrepare`, the original is never changed.",
    "**Isolated:** a stopped audit never fails a payment.",
    "**Every printed result is asserted** in `DemoRunsTest`.",
]

