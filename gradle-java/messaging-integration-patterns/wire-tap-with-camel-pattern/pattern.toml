[[scene]]
key = "01-poster"
kind = "poster"
title = "Wire Tap with Apache Camel"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Wire Tap pattern, built with Apache Camel, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] A wire tap sends a copy of every message to a side channel. [[slnc 300]] The sender and the receiver carry on as if nothing were listening. [[slnc 500]] Apache Camel is an open-source library for moving messages, and it has a wire tap built in. [[slnc 600]]
Think of a security camera over a shop till. [[slnc 300]] It records every sale, and the cashier does nothing differently. [[slnc 300]] But the camera must only ever see a copy of the receipt, never change the real one. [[slnc 700]]
In this video, the domain is an online shop's payments, and the auditors who want a copy of each one. [[slnc 500]]
By the end, you will hear how one step taps every payment. [[slnc 300]] A trap where the tap changes the real message. [[slnc 300]] How to fix it. [[slnc 300]] And what a tap on its own thread costs.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["Logging typed into payments", "by hand.", "", "It missed refunds.", "It showed full card numbers.", "", "Auditors want a masked copy."]
narration = """
Here is the scenario. [[slnc 400]] Logging had been typed into the payment service by hand. [[slnc 500]]
It missed the refunds. [[slnc 300]] And it wrote out full card numbers. [[slnc 500]]
Auditors want a masked copy of every payment, without changing checkout, or the payment service.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern, in Camel"
body = ["wireTap(endpoint): a copy,", "on its own thread.", "", "onPrepare: make it a real copy.", "", "The main route carries on."]
narration = """
Let's name the pattern, in Camel's words. [[slnc 400]] The wire tap step sends a copy to another route, on its own thread. [[slnc 500]]
On prepare makes sure it really is a copy. [[slnc 500]]
And the main route carries on, without waiting.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["ShopRoutes: the routes and tap", "Audit: masks and records", "PaymentService: the real work", "PaymentMessage: the message"]
narration = """
Here is who does what. [[slnc 400]] Shop routes holds the payments route, with its tap. [[slnc 500]]
The audit masks each card number, and records a line. [[slnc 500]]
The payment service does the real work. [[slnc 300]] And the payment message is what flows through.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Camel wireTap()", "Spring Integration wire-tap", "Switch port mirroring", "Audit consumers on Kafka"]
narration = """
You have probably met this already. [[slnc 400]] Camel's wire tap, and Spring Integration's. [[slnc 500]]
Network switches that mirror a port, so traffic can be watched. [[slnc 500]]
And services that read a Kafka topic, only to audit it.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["A copy on the side, for audit", "or monitoring.", "", "Always copy the message.", "Watch the tap's errors.", "Durable queue if none may be lost."]
narration = """
So, when should you use it? [[slnc 400]] When auditors or a dashboard need a copy of traffic, without touching the sender or receiver. [[slnc 500]]
Always make the copy independent. [[slnc 300]] Watch the tap's errors separately. [[slnc 300]] And tap to a durable queue, when no copy may be lost.
"""

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Make the", "message immutable."]
narration = """
That's the Wire Tap, with Apache Camel. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Copy every message to the side, and make sure it really is a copy. [[slnc 500]]
The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs offline, with nothing installed except a Java development kit. [[slnc 500]]
Here is one exercise to try. [[slnc 300]] Make the payment message immutable, and see why the trap disappears. [[slnc 500]]
If this helped, a like really does help other people find it. [[slnc 300]] And subscribe, if you'd like the rest of the series. [[slnc 400]] Thanks for watching.
"""
