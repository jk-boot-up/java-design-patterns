# pattern.toml for the Process Manager project. See tools/patternkit.

[project]
slug = "process-manager"
category = "messaging-integration-patterns"
title = "Process Manager"
package = "processmanager"
main_class = "ProcessManagerDemo"
tagline = "One place that knows the whole journey"
bold = "Put one component in charge of a multi-step process: it keeps each instance's state, sends it to the next step, and decides what happens after every reply, including the unhappy paths."
youtube_description = """Process Manager pattern in Java, explained with an online store where each order must be reserved, paid for and shipped. A process manager takes charge of a multi-step process: it tracks where each case is, sends it to the next step, and decides what happens after every reply, including when something goes wrong, like a wedding planner who calls a backup florist. We watch a simple chain of steps lose track, let a process manager run each order, add a branch, and handle the unhappy path. We finish with the bill."""
domain_note = ""
thumb_lines = ["PROCESS", "MANAGER"]
thumb_code = "on reply: decide next step"
youtube_title = "Process Manager"
youtube_tags = ["process manager", "orchestration", "enterprise integration patterns", "workflow", "messaging", "java"]

[readme]
intro = """
Process Manager is one of the Enterprise Integration Patterns. When a piece
of work passes through several services, and the route depends on what
happens along the way, one component takes charge. It keeps the state of each
process instance, sends the instance to the next step, receives the reply, and
decides the step after that: continue, take a different branch, or undo what
was done.

The services never call each other; they only answer the process manager.
So the whole route, including failures, lives in one place that can also say
where every instance is right now.
"""
analogy = """
Think of a wedding planner. The caterer, the florist and the venue never talk
to each other; they each talk to the planner. The planner knows exactly where
everything stands. When the florist cannot deliver, the planner calls the
backup florist. When the venue cancels, the planner cancels the caterer too.
"""
scenario = """
The online store fulfils an order in three steps: reserve stock, take
payment, ship. Each service simply passed the order on to the next. When a
card was declined, the chain stopped at payments; the warehouse never heard,
and the kettle stayed reserved for ever. And nobody could say where a given
order was.
"""
costs = [
    "**One brain.** Every route and branch lives in one class, which grows with every new step.",
    "**State must survive.** Held in memory, every order in progress is forgotten on a restart; real process managers store their state.",
    "**A central dependency.** If the process manager is down, no process moves.",
]
too_much = """
When the steps are always the same and never fail in ways that need undoing,
a simple chain or a routing slip is enough. And when services are owned by
different teams that prefer to react to each other's events, choreography
avoids a central brain, at the price of nobody seeing the whole journey.
"""
met_before = [
    "Workflow engines such as Camunda, Temporal and AWS Step Functions.",
    "Orchestrated sagas in microservices.",
    "Order management systems that track every order's status.",
]
where = """
This project is in [messaging-integration-patterns](..), next to
[Routing Slip](../routing-slip-pattern), which attaches a fixed route to the
message instead, and near [Saga](../../micro-services-design-patterns/saga-pattern),
a process manager's close relative for undoing work across services.
"""

[[act]]
title = "Steps chained together"
summary = "A declined card stops the chain at payments; the warehouse never hears, so stock shows 1 of 3 though only one kettle shipped."
detail = """
`Chained.fulfil` reserves, charges and ships in a line, each step handing on
to the next. ORD-1 ships. ORD-3's card is declined, so the chain stops at
payments, but the kettle it reserved is never released: stock shows 1 of 3
although only one kettle was shipped. And nothing records where ORD-3 is.
"""
speech = """
First demo: each step hands on to the next. [[slnc 400]] The warehouse reserves a kettle, and hands on to payments. [[slnc 300]] Payments charges, and hands on to shipping. [[slnc 600]]
Order one ships. [[slnc 500]]
Order three's card is declined. [[slnc 300]] The chain stops at payments. [[slnc 300]] But the warehouse never hears, so its kettle stays reserved. [[slnc 500]]
Only one kettle shipped, yet two are gone from stock. [[slnc 300]] And where is order three now? [[slnc 300]] Nobody knows.
"""
rows = { warehouse = "active wrong", payments = "active wrong" }
console = [
    ["ORD-3 card declined: stopped at payments", "bad"],
    ["stock 1 of 3; only 1 shipped", "bad"],
    ["where is ORD-3? nobody knows", "bad"],
]

[[act]]
title = "A process manager"
summary = "The manager runs ORD-1: main RESERVED, PAID, SHIPPED, then DONE."
detail = """
`ProcessManager` starts each order and handles every reply. For ORD-1 it
asks the main warehouse to reserve, gets RESERVED, asks payments, gets PAID,
asks shipping, gets SHIPPED, and marks the order DONE. The services never
talk to each other.
"""
speech = """
Second demo: a process manager runs each order's journey. [[slnc 400]] The services no longer call each other. [[slnc 300]] They only answer the manager. [[slnc 600]]
For order one, the manager asks the main warehouse to reserve. [[slnc 300]] Reserved. [[slnc 300]] It asks payments to charge. [[slnc 300]] Paid. [[slnc 300]] It asks shipping to ship. [[slnc 300]] Shipped. [[slnc 500]]
Order one is done.
"""
rows = { manager = "active ok", warehouse = "active ok", payments = "active ok", shipping = "active ok" }
console = [
    ["ORD-1: main RESERVED, PAID, SHIPPED", "ok"],
    ["-> DONE", "ok"],
]

[[act]]
title = "A branch"
summary = "ORD-2's sofa is out of stock at main; the manager asks the partner warehouse, which reserves it; the order completes."
detail = """
ORD-2 is a sofa. The main warehouse replies OUT_OF_STOCK, so the manager
decides the next step is the partner warehouse. It replies RESERVED, and the
order is paid and shipped.
"""
speech = """
Third demo: the manager decides the next step. [[slnc 400]] Order two is a sofa. [[slnc 300]] The main warehouse replies: out of stock. [[slnc 600]]
The manager decides: try the partner warehouse. [[slnc 300]] Reserved. [[slnc 500]]
The order is paid, shipped, and done.
"""
rows = { manager = "active ok", warehouse = "active amber", partner = "active ok" }
console = [
    ["ORD-2: main OUT_OF_STOCK", "amber"],
    ["partner RESERVED, PAID, SHIPPED -> DONE", "ok"],
]

[[act]]
title = "The unhappy path"
summary = "ORD-3's card is declined; the manager releases the kettle (stock back to 2 of 3) and emails the customer."
detail = """
ORD-3's card is declined. The manager knows the order reserved a kettle at
the main warehouse, so it releases it, emails the customer, and marks the
order cancelled. Stock is back to 2 of 3.
"""
speech = """
Fourth demo: the unhappy path is part of the process. [[slnc 400]] Order three's card is declined. [[slnc 500]]
The manager knows this order reserved a kettle. [[slnc 300]] So it tells the warehouse to release it. [[slnc 300]] And it emails the customer. [[slnc 600]]
The order is cancelled, cleanly. [[slnc 300]] The kettle is back in stock.
"""
rows = { manager = "active ok", payments = "active wrong", warehouse = "active ok", emails = "active ok" }
console = [
    ["ORD-3: RESERVED, DECLINED, RELEASED", "amber"],
    ["cancelled; stock 2 of 3", "ok"],
    ["email: your card was declined", "ok"],
]

[[act]]
title = "The bill"
summary = "The manager can say where every order is; but every route lives in one class, and its state is lost on a restart."
detail = """
The manager can answer "where is every order?" in one line. But every route
and branch lives in one class that grows with each new step, and its state is
in memory: a restart would forget every order in progress. Real process
managers keep their state in a database.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] The manager can say where every order is, in one line. [[slnc 500]]
But every route, and every branch, lives in one class. [[slnc 300]] It grows with each new step. [[slnc 500]]
And its state is in memory. [[slnc 300]] A restart would forget every order in progress. [[slnc 300]] Real process managers store their state.
"""
rows = { manager = "active amber" }
console = [
    ["ORD-1=DONE, ORD-2=DONE, ORD-3=CANCELLED", "ok"],
    ["one class holds every route", "amber"],
    ["state in memory: lost on restart", "amber"],
]

[animation]
subtitle = "A process manager takes each order through reserve, pay and ship, deciding the next step from every reply."
boxes = [
    ["manager", "Process manager", "state per order"],
    ["warehouse", "Main warehouse", "reserve, release"],
    ["partner", "Partner warehouse", "backup stock"],
    ["payments", "Payments", "charge"],
    ["shipping", "Shipping", "ship"],
    ["emails", "Emails", "tell the customer"],
]

[docs.problem]
scenario = """
Orders are fulfilled in three steps: reserve stock, take payment, ship.
Some steps fail and must be undone or retried elsewhere.
"""
naive = """
`Chained` passes each order along a line. A declined card stops the line, the
reserved stock is never released, and nobody knows where the order is.
"""
deliver = [
    "The chain shown leaking stock on a declined card.",
    "A process manager taking an order through every step.",
    "A branch to a partner warehouse.",
    "A failure path that releases stock and emails the customer.",
    "The status of every order in one place, and the cost of a central brain.",
    "Every printed result asserted by a test.",
]

[docs.prerequisites]
required = [
    "Java basics: classes, maps, `switch`.",
]
not_required = [
    "A workflow engine. The manager is one class.",
]

[docs.session]
objectives = [
    "Explain why a chain of services loses track of failures.",
    "Keep per-instance state and decide the next step from replies.",
    "Put unhappy paths inside the process.",
    "Weigh a central process manager against choreography.",
]
walkthrough = """
Run `./gradlew run` and read act one's stock count. Open
`ProcessManager.step`: every reply comes back here, and a `switch` decides
what happens next. End on act five and ask what must be stored so a restart
does not lose orders.
"""
exercises = [
    "Store the manager's state in a map that is saved to a file, and restart it mid-order.",
    "Add a step: send a delivery-slot email after shipping.",
    "If the partner warehouse is used, charge an extra £5 delivery. Where does that rule go?",
]

[docs.explained]
sentence = """
A process manager keeps each instance of a multi-step process, sends it to
the next step, and decides what to do after every reply, including undoing
work when a step fails.
"""
verdict = """
Use a process manager when routes branch and failures must be undone. Store
its state, keep each step's service unaware of the others, and use a workflow
engine when processes are long or many.
"""
recognise = [
    "A class or service with a state per order and a handler per reply type.",
    "Workflow definitions in Camunda, Temporal or Step Functions.",
    "Compensating actions (release, refund) triggered centrally.",
]

[spec]
purpose = """
Teach Process Manager with an online store's order fulfilment: a chain that
leaks stock when a card is declined, then a process manager taking orders
through reserve, pay and ship, branching to a partner warehouse, releasing
stock and emailing on a decline, and reporting every order's state.
"""
nongoals = [
    "Not persistence of process state. It is an exercise.",
    "Not asynchronous messaging. Replies are returned directly for clarity.",
]
problem = """
When each step of a process hands on to the next, failures part-way through
leave earlier steps undone, and nobody can see where an order is.
"""
roles = [
    ["The pattern", "`ProcessManager`"],
    ["The services", "`Services.Warehouse`, `Payments`, `Shipping`, `Emails`"],
    ["The work", "`Order`"],
    ["The naive version", "`Chained`"],
    ["Entry point", "`ProcessManagerDemo`, five acts"],
]
requirements = [
    "**One owner:** only the manager decides the next step.",
    "**Branches:** out of stock at main tries the partner.",
    "**Undo:** a declined card releases the reserved stock.",
    "**Visible:** every order's state can be listed.",
    "**Every printed result is asserted** in `DemoRunsTest`.",
]

