[[scene]]
key = "01-poster"
kind = "poster"
title = "Process Manager"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Process Manager pattern, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] A process manager takes charge of a process with several steps. [[slnc 300]] It keeps track of where each case is, sends it to the next step, and decides what happens after every reply. [[slnc 300]] Including when something goes wrong. [[slnc 600]]
Think of a wedding planner. [[slnc 300]] The caterer, the florist, and the venue only talk to the planner. [[slnc 300]] When the florist cannot deliver, the planner calls a backup. [[slnc 300]] When the venue cancels, the planner cancels the caterer too. [[slnc 700]]
In this video, the domain is an online shop. [[slnc 300]] Each order must be reserved, paid for, and shipped. [[slnc 500]]
By the end, you will hear how a simple chain of steps loses track. [[slnc 300]] How a process manager runs each order. [[slnc 300]] How it handles branches and failures. [[slnc 300]] And what a central brain costs.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["Reserve stock -> take payment -> ship.", "", "Each service passed the order on.", "", "Cards get declined.", "Warehouses run out."]
narration = """
Here is the scenario. [[slnc 400]] Each order is fulfilled in three steps. [[slnc 300]] Reserve the stock. [[slnc 300]] Take payment. [[slnc 300]] Ship. [[slnc 600]]
Each service simply passed the order on to the next. [[slnc 500]]
But cards get declined, and warehouses run out.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["One component owns the process.", "", "It keeps each order's state,", "sends it to the next step,", "and decides after every reply.", "", "Services never call each other."]
narration = """
Let's name the pattern. [[slnc 400]] One component owns the process. [[slnc 500]]
It keeps each order's state. [[slnc 300]] It sends the order to the next step. [[slnc 300]] And after every reply, it decides what happens next. [[slnc 500]]
The services never call each other. [[slnc 300]] They only answer the process manager.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["ProcessManager: state and decisions", "Warehouse, partner, payments,", "shipping, emails: one job each", "Chained: the old way"]
narration = """
Here is who does what. [[slnc 400]] The process manager holds each order's state, and decides every next step. [[slnc 500]]
The main warehouse, the partner warehouse, payments, shipping, and emails each do one job, and answer. [[slnc 500]]
And chained is the old way, kept for comparison.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Camunda, Temporal", "AWS Step Functions", "Orchestrated sagas", "Order management systems"]
narration = """
You have probably met this pattern already. [[slnc 400]] Workflow engines such as Camunda, Temporal, and Step Functions are process managers you configure. [[slnc 500]]
Orchestrated sagas in microservices are the same idea. [[slnc 500]]
And every order management system that tracks each order's status is one.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Routes that branch.", "Failures that must be undone.", "", "Store the state.", "Long or many processes?", "Use a workflow engine."]
narration = """
So, when should you use it? [[slnc 400]] When routes branch, and failures must be undone. [[slnc 500]]
Store the manager's state, so a restart forgets nothing. [[slnc 500]]
And when processes are long, or many, use a workflow engine rather than writing your own.
"""

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Save the manager's", "state and restart it."]
narration = """
That's the Process Manager pattern. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Let one place own the whole journey, including the unhappy paths. [[slnc 500]]
The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs offline, with nothing installed except a Java development kit. [[slnc 500]]
Here is one exercise to try. [[slnc 300]] Save the manager's state to a file, and restart it in the middle of an order. [[slnc 500]]
If this helped, a like really does help other people find it. [[slnc 300]] And subscribe, if you'd like the rest of the series. [[slnc 400]] Thanks for watching.
