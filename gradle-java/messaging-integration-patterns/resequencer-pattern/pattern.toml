# pattern.toml for the Resequencer project. See tools/patternkit.

[project]
slug = "resequencer"
category = "messaging-integration-patterns"
title = "Resequencer"
package = "resequencer"
main_class = "ResequencerDemo"
tagline = "Put the messages back in order"
bold = "When numbered messages can arrive out of order, hold the early ones and release each sequence strictly in order, with a limit so a lost message cannot block everything for ever."
youtube_description = """Resequencer pattern in Java: when numbered messages arrive out of order, a resequencer holds the early ones, releases each sequence strictly in order, and has a limit so a lost message cannot block everything forever, like reading a letter sent in five muddled envelopes. Explained with an online store order page that shows status updates: placed, paid, packed, shipped and delivered. We watch updates applied as they arrive go wrong, hold and release them in order, and keep one sequence per order. We finish with the bill."""
domain_note = ""
thumb_lines = ["RESEQUENCER"]
thumb_code = "#1, #3, #2 -> #1, #2, #3"
youtube_title = "Resequencer"
youtube_tags = ["resequencer", "message ordering", "enterprise integration patterns", "messaging", "java"]

[readme]
intro = """
Resequencer is one of the Enterprise Integration Patterns. Messaging systems
often deliver messages out of order: several consumers work in parallel, one
message is retried, another takes a slower path. When order matters, each
message carries a sequence number, and a resequencer sits in front of the
receiver. It passes on a message only when it is the next one expected, and
holds early arrivals until the gap before them is filled.

Each sequence, such as each order's updates, is resequenced on its own, and a
limit decides when to give up waiting for a message that is never coming.
"""
analogy = """
Think of a long letter sent in five numbered envelopes, which the post
delivers in a muddle: 1, 3, 2, 5, 4. You read envelope 1, put 3 aside, read 2
when it arrives, then 3, and so on. But if envelope 3 is lost for good, at
some point you have to stop waiting and read on without it.
"""
scenario = """
The online store's order service sends status updates for each order:
placed, paid, packed, shipped, delivered. They pass through several parallel
workers, so they reach the customer's order page out of order. The page
applied them as they arrived: Priya's order showed packed before paid, and
finished on shipped, although the parcel had been delivered.
"""
costs = [
    "**A lost message blocks.** When #3 never arrives, #4 and #5 wait; without a limit they wait for ever.",
    "**A limit means gaps.** Skipping ahead means the page never shows PACKED.",
    "**Buffers use memory.** Early messages must be held somewhere, for every open sequence.",
]
too_much = """
When messages are independent, or only the latest matters and each carries a
full state with a timestamp, you can apply the newest and ignore older ones.
And when a single partition or queue already guarantees order, as Kafka does
per key, a resequencer is not needed.
"""
met_before = [
    "Apache Camel's `resequence`.",
    "TCP, which puts network packets back in order using sequence numbers.",
    "Kafka's ordering per partition key, which avoids the need.",
]
where = """
This project is in [messaging-integration-patterns](..), next to
[Splitter and Aggregator](../splitter-aggregator-pattern), which also
collects related messages before passing them on.
"""

[[act]]
title = "Applied as they arrive"
summary = "Updates arrive #1, #3, #2, #5, #4; the customer sees PACKED before PAID and ends on SHIPPED, not DELIVERED."
detail = """
The five updates for ORD-1 arrive as #1, #3, #2, #5, #4. The order page
applies each as it comes: the customer sees PLACED, PACKED, PAID, DELIVERED,
SHIPPED, and the page ends on SHIPPED although the parcel was delivered.
"""
speech = """
First demo: status updates applied as they arrive. [[slnc 400]] Five updates for Priya's order. [[slnc 300]] Placed, paid, packed, shipped, delivered. [[slnc 600]]
They arrive in a muddle: one, three, two, five, four. [[slnc 500]]
The page shows each as it comes. [[slnc 300]] Packed before paid. [[slnc 300]] Delivered, then shipped. [[slnc 500]]
The page ends on shipped. [[slnc 300]] But the parcel was delivered.
"""
rows = { workers = "active amber", page = "active wrong" }
console = [
    ["arrival: #1, #3, #2, #5, #4", "muted"],
    ["saw: PLACED, PACKED, PAID, DELIVERED, SHIPPED", "bad"],
    ["final: SHIPPED, but it was DELIVERED", "bad"],
]

[[act]]
title = "A resequencer"
summary = "With a resequencer the customer sees PLACED, PAID, PACKED, SHIPPED, DELIVERED, and ends on DELIVERED."
detail = """
A `Resequencer` in front of the page releases each update only when it is the
next number expected. The customer now sees the statuses in their true order,
and the page ends on DELIVERED.
"""
speech = """
Second demo: a resequencer puts them back in order. [[slnc 400]] It sits in front of the page. [[slnc 300]] It only passes on the next number it expects. [[slnc 600]]
The customer now sees: placed, paid, packed, shipped, delivered. [[slnc 500]]
The page ends on delivered.
"""
rows = { resequencer = "active ok", page = "active ok" }
console = [
    ["saw: PLACED, PAID, PACKED, SHIPPED, DELIVERED", "ok"],
    ["final: DELIVERED", "ok"],
]

[[act]]
title = "Hold and release"
summary = "#3 arrives early and is held; #2 releases 2 and 3; #5 is held until #4 releases both."
detail = """
The trace shows the resequencer at work. #1 is released at once. #3 arrives
early and is held. When #2 arrives, it is released, followed by the held #3.
#5 is held until #4 arrives, and then both are released.
"""
speech = """
Third demo: early messages wait, and late ones release them. [[slnc 400]] Number one is released at once. [[slnc 500]]
Number three arrives early. [[slnc 300]] It is held. [[slnc 500]]
Number two arrives. [[slnc 300]] It is released, and so is the three that was waiting. [[slnc 500]]
Number five is held, until four arrives. [[slnc 300]] Then both go through.
"""
rows = { resequencer = "active ok", buffer = "active amber" }
console = [
    ["received #3; holding [3]", "amber"],
    ["released #2, then #3", "ok"],
    ["received #5; holding [5]; released #4, #5", "ok"],
]

[[act]]
title = "One sequence per order"
summary = "Interleaved updates for ORD-2 and ORD-3 are each released in their own order."
detail = """
Every order has its own sequence and its own buffer. Updates for ORD-2 and
ORD-3 arrive mixed together; each order's updates are released in that
order's own sequence, without waiting for the other.
"""
speech = """
Fourth demo: each order has its own sequence. [[slnc 400]] Updates for two orders arrive, all mixed together. [[slnc 600]]
Each order's updates are released in that order's own sequence. [[slnc 300]] Neither order waits for the other.
"""
rows = { resequencer = "active ok", page = "active ok" }
console = [
    ["ORD-3 PLACED, ORD-2 PLACED, ORD-2 PAID,", "ok"],
    ["ORD-3 PAID, ORD-3 PACKED", "ok"],
]

[[act]]
title = "The bill"
summary = "#3 is lost: #4 is held and the page stays on PAID; when #5 arrives the gap is skipped and the page shows DELIVERED."
detail = """
For ORD-4, update #3 is lost. #4 arrives and is held; the page still says
PAID. When #5 arrives, two updates are waiting, which is this resequencer's
limit, so it gives up on #3 and releases #4 and #5: the page shows DELIVERED,
and PACKED is never shown. Without a limit, the page would wait for ever.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] Another order's update number three is lost. [[slnc 500]]
Number four arrives, and is held. [[slnc 300]] The page still says paid. [[slnc 500]]
Number five arrives. [[slnc 300]] Now two are waiting, the limit. [[slnc 300]] The resequencer gives up on three, and releases four and five. [[slnc 600]]
The page says delivered. [[slnc 300]] Packed was never shown. [[slnc 300]] And without a limit, the page would have waited for ever.
"""
rows = { resequencer = "active amber", buffer = "active wrong" }
console = [
    ["#3 lost: held #4, page says PAID", "amber"],
    ["limit reached: skip #3, page DELIVERED", "amber"],
]

[animation]
subtitle = "Status updates arrive out of order; the resequencer holds early ones and releases each order's updates in sequence."
boxes = [
    ["workers", "Parallel workers", "deliver in a muddle"],
    ["resequencer", "Resequencer", "next expected number"],
    ["buffer", "Held updates", "early arrivals"],
    ["page", "Order page", "shows the status"],
]

[docs.problem]
scenario = """
Order status updates pass through parallel workers and reach the order page
out of order.
"""
naive = """
The page applies updates as they arrive, showing packed before paid and ending
on shipped for a delivered parcel.
"""
deliver = [
    "Wrong statuses shown when applying in arrival order.",
    "A resequencer releasing updates in sequence.",
    "A trace of holding and releasing.",
    "Independent sequences per order.",
    "A lost update and a limit that skips the gap.",
    "Every printed result asserted by a test.",
]

[docs.prerequisites]
required = [
    "Java basics: records, maps, `TreeMap`.",
]
not_required = [
    "A message broker. Arrival order is a list.",
]

[docs.session]
objectives = [
    "Explain why messages arrive out of order.",
    "Resequence by a sequence number per key.",
    "Handle a gap that never fills.",
    "Say when ordering can be avoided instead.",
]
walkthrough = """
Run `./gradlew run` and read act one's statuses aloud. Open
`Resequencer.accept` and `release`: a buffer per order and a next-expected
number. End on act five: what should a real shop show for the missing PACKED?
"""
exercises = [
    "Give up on a gap after 2 seconds instead of after 2 held messages.",
    "When a gap is skipped, log which numbers were missed.",
    "Ignore any update with a number already released (a duplicate).",
]

[docs.explained]
sentence = """
A resequencer holds messages that arrive early and releases each sequence
strictly in order, giving up on a gap after a limit.
"""
verdict = """
Use a resequencer when order matters and delivery cannot guarantee it. Number
messages per key, bound the buffer, decide what to do about gaps, and prefer a
transport that keeps order per key when you can choose one.
"""
recognise = [
    "Sequence numbers or versions on messages for one entity.",
    "A buffer keyed by entity with a next-expected counter.",
    "`resequence` in Camel routes.",
]

[spec]
purpose = """
Teach Resequencer with an online store's order status updates: updates
applied as they arrive ending on SHIPPED for a delivered parcel, then a
resequencer releasing PLACED to DELIVERED in order, holding and releasing,
independent sequences per order, and a lost update skipped after a limit.
"""
nongoals = [
    "Not time-based limits. They are an exercise.",
    "Not a message broker.",
]
problem = """
Updates that arrive out of order and are applied as they come show customers
the wrong status.
"""
roles = [
    ["The pattern", "`Resequencer`"],
    ["The messages", "`StatusUpdate`"],
    ["The receiver", "`OrderPage`"],
    ["Entry point", "`ResequencerDemo`, five acts"],
]
requirements = [
    "**In order:** each order's updates are released by sequence number.",
    "**Independent:** orders do not wait for each other.",
    "**Bounded:** a gap is skipped when the limit is reached.",
    "**Every printed result is asserted** in `DemoRunsTest`.",
]

[[diagram]]
name = "architecture-diagram"
kind = "flow"
title = "Resequencer — the pieces"
caption = "Out of order in, in order out."
nodes = [
    { id = "w", label = "Parallel workers", sub = "#1, #3, #2, #5, #4", col = 0, row = 0, colour = "client" },
    { id = "r", label = "Resequencer", sub = "next expected: #2", col = 1, row = 0, colour = "accent" },
    { id = "b", label = "Held", sub = "#3", col = 1, row = 1, colour = "amber" },
    { id = "p", label = "Order page", sub = "#1, #2, #3, ...", col = 2, row = 0, colour = "green" },
]
edges = [
    { from = "w", to = "r", label = "any order" },
    { from = "r", to = "b", label = "early" },
    { from = "r", to = "p", label = "in order" },
]

[[diagram]]
name = "class-diagram"
kind = "class"
title = "Resequencer — classes"
caption = "A buffer and a counter per order."
nodes = [
    { id = "r", label = "Resequencer", sub = ["- expected: order -> next #", "- held: order -> TreeMap", "+ accept(update)", "- release(order)"], col = 0, row = 0, colour = "accent" },
    { id = "u", label = "«record» StatusUpdate", sub = ["orderId, seq, status"], col = 1, row = 0, colour = "client" },
    { id = "p", label = "OrderPage", sub = ["+ apply(update)", "+ status(order)"], col = 2, row = 0, colour = "green" },
]
edges = [
    { from = "r", to = "u", label = "holds" },
    { from = "r", to = "p", label = "releases to" },
]

[[diagram]]
name = "data-flow-diagram"
kind = "flow"
title = "Resequencer — #3 before #2"
caption = "Held, then released behind #2."
nodes = [
    { id = "a", label = "#3 PACKED arrives", sub = "expected #2", col = 0, row = 0, colour = "amber" },
    { id = "b", label = "held", sub = "[3]", col = 1, row = 0, colour = "amber" },
    { id = "c", label = "#2 PAID arrives", sub = "", col = 0, row = 1, colour = "client" },
    { id = "d", label = "release #2, #3", sub = "next expected #4", col = 2, row = 1, colour = "green" },
]
edges = [
    { from = "a", to = "b", label = "" },
    { from = "c", to = "d", label = "" },
    { from = "b", to = "d", label = "" },
]

[[diagram]]
name = "sequence-diagram"
kind = "sequence"
title = "Resequencer — releasing a run"
caption = "The missing number unlocks the ones behind it."
participants = ["Workers", "Resequencer", "Order page"]
steps = [
    ["Workers", "Resequencer", "#5 DELIVERED"],
    ["note", "Resequencer", "hold [5]"],
    ["Workers", "Resequencer", "#4 SHIPPED"],
    ["Resequencer", "Order page", "#4 SHIPPED"],
    ["Resequencer", "Order page", "#5 DELIVERED"],
]

[[diagram]]
name = "uml-diagram"
kind = "sequence"
title = "1. Applied as they arrive"
caption = "The page goes backwards."
participants = ["Workers", "Order page"]
steps = [
    ["Workers", "Order page", "#5 DELIVERED"],
    ["Workers", "Order page", "#4 SHIPPED"],
    ["note", "Order page", "ends on SHIPPED"],
]

[[diagram]]
name = "uml-diagram-2"
kind = "sequence"
title = "2. A lost update"
caption = "The limit gives up on the gap."
participants = ["Workers", "Resequencer", "Order page"]
steps = [
    ["Workers", "Resequencer", "#4 (hold, waiting for #3)"],
    ["Workers", "Resequencer", "#5 (2 held: limit)"],
    ["Resequencer", "Order page", "#4, #5"],
]

[poster]
headline = [["RESEQUENCER", "text"]]
before = { code = "#1, #3, #2, #5, #4", note = "ends on SHIPPED", tag = "BEFORE" }
after = { code = "#1, #2, #3, #4, #5", note = "ends on DELIVERED", tag = "AFTER" }
taglines = [["Put the messages back in order", "gold"]]

[[scene]]
key = "01-poster"
kind = "poster"
title = "Resequencer"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Resequencer pattern, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] When numbered messages can arrive out of order, a resequencer holds the early ones. [[slnc 300]] It releases each sequence strictly in order. [[slnc 300]] And it has a limit, so a lost message cannot block everything for ever. [[slnc 600]]
Think of a long letter sent in five numbered envelopes, delivered in a muddle. [[slnc 300]] You read envelope one, put three aside, and wait for two. [[slnc 300]] And if three is lost for good, at some point you read on without it. [[slnc 700]]
In this video, the domain is an online shop. [[slnc 300]] Its order page shows status updates: placed, paid, packed, shipped, and delivered. [[slnc 500]]
By the end, you will hear what goes wrong when updates are applied as they arrive. [[slnc 300]] How a resequencer fixes it. [[slnc 300]] How it handles many orders. [[slnc 300]] And what a lost message costs.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["PLACED, PAID, PACKED,", "SHIPPED, DELIVERED.", "", "Updates pass through parallel", "workers, and arrive in a muddle."]
narration = """
Here is the scenario. [[slnc 400]] Each order goes through five statuses. [[slnc 300]] Placed, paid, packed, shipped, delivered. [[slnc 600]]
The updates pass through several workers, running in parallel. [[slnc 300]] So they reach the order page in a muddle. [[slnc 500]]
Each update carries a number, one to five.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["Number the messages.", "", "Release only the next number", "expected; hold early ones.", "", "One sequence per order.", "A limit for gaps."]
narration = """
Let's name the pattern. [[slnc 400]] Number each message, per order. [[slnc 500]]
Release only the number that is expected next. [[slnc 300]] Hold anything that arrives early. [[slnc 500]]
Keep a separate sequence for each order. [[slnc 300]] And set a limit, for gaps that will never fill.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["StatusUpdate: order, number, status", "Resequencer: expected numbers, held updates", "OrderPage: shows the status"]
narration = """
Here is who does what. [[slnc 400]] A status update carries the order, its number, and the status. [[slnc 500]]
The resequencer keeps, for each order, the next number it expects, and the updates it is holding. [[slnc 500]]
And the order page shows whatever it is given.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Camel resequence", "TCP packet sequence numbers", "Kafka: order per partition key"]
narration = """
You have probably met this pattern already. [[slnc 400]] Apache Camel has a resequence step. [[slnc 500]]
The internet's T C P protocol puts packets back in order, using sequence numbers. [[slnc 500]]
And Kafka keeps messages in order per key, which is one way to avoid needing a resequencer.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Order matters, and delivery", "does not keep it.", "", "Number per key. Bound the buffer.", "Plan for gaps.", "", "Can the transport keep order?", "Use that."]
narration = """
So, when should you use it? [[slnc 400]] When order matters, and delivery does not keep it. [[slnc 500]]
Number messages per key. [[slnc 300]] Put a limit on the buffer. [[slnc 300]] And decide what to do about gaps. [[slnc 500]]
And if you can choose a transport that keeps order per key, prefer that.
"""

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Give up on a gap", "after two seconds."]
narration = """
That's the Resequencer pattern. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Hold what comes early, release in order, and never wait for ever. [[slnc 500]]
The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs offline, with nothing installed except a Java development kit. [[slnc 500]]
Here is one exercise to try. [[slnc 300]] Give up on a gap after two seconds, instead of after two held messages. [[slnc 500]]
If this helped, a like really does help other people find it. [[slnc 300]] And subscribe, if you'd like the rest of the series. [[slnc 400]] Thanks for watching.
"""
