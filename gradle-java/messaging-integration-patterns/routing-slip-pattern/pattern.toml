# pattern.toml for the Routing Slip project. See tools/patternkit.

[project]
slug = "routing-slip"
category = "messaging-integration-patterns"
title = "Routing Slip"
package = "routingslip"
main_class = "RoutingSlipDemo"
tagline = "The message carries its own route"
bold = "Decide the steps a message needs once, when it enters, attach them to the message as a slip, and let each step pass it on to the next address on the slip."
youtube_description = """Routing Slip pattern in Java: the steps a message needs are worked out once when it arrives and attached to it as a list, and each step does its work and passes it to the next, like a circulation slip clipped to an office magazine. Explained with an online store whose orders need different steps: gift wrap for gifts, age checks for knives, customs for orders abroad. We watch one fixed pipeline run every step for every order, attach routing slips, let steps pass orders on, and add a new step. We finish with the bill."""
domain_note = ""
thumb_lines = ["ROUTING", "SLIP"]
thumb_code = "[validate, charge, pack]"
youtube_title = "Routing Slip"
youtube_tags = ["routing slip", "enterprise integration patterns", "message routing", "pipeline", "java"]

[readme]
intro = """
Routing Slip is one of the Enterprise Integration Patterns. When different
messages need different sequences of processing steps, the route is worked
out once, as the message enters, and attached to the message as a list: its
routing slip. Each step does its work, crosses itself off, and passes the
message to whatever the slip says comes next.

Steps stay independent: none knows what comes after it. New steps are added
by changing the rules that write slips, not the steps. The route is fixed
when the message sets off, which is both the simplicity and the limit of the
pattern.
"""
analogy = """
Think of the circulation slip clipped to a magazine in an office: "Pass to
Anna, then Ben, then Carl, then return to the library." Each person reads it,
crosses their name off, and passes it to the next name. Nobody needs to know
the whole list; they only look at the next name. But if Ben is away, the slip
cannot decide on its own to skip to Carl.
"""
scenario = """
The online store processes orders through steps: validate, age check for
restricted items, customs for orders abroad, charge, gift wrap for gifts, and
pack. Every order went through one fixed pipeline of all six steps, and each
step began by asking whether it applied to this order at all.
"""
costs = [
    "**Fixed at the start.** A slip can stop when a step fails, but it cannot choose a different route from what happened on the way.",
    "**The route travels with the message.** Anyone who can change the message can change its route.",
    "**Rules in one place.** The code that writes slips must know every step and when it applies.",
]
too_much = """
When every message needs the same steps, a fixed pipeline is simpler. When the
route must change depending on results along the way, use a process manager,
which decides after each step instead of before the first.
"""
met_before = [
    "Apache Camel's `routingSlip`.",
    "Approval workflows where a document carries its list of approvers.",
    "Circulation slips on office post and magazines.",
]
where = """
This project is in [messaging-integration-patterns](..), next to
[Process Manager](../process-manager-pattern), which decides each next step
from the last reply, and [Recipient List](../recipient-list-pattern), which
sends copies to several places at once rather than one after another.
"""

[[act]]
title = "One fixed pipeline"
summary = "4 orders through all 6 steps: 24 visits, 15 of which did any work; every step asks whether it applies."
detail = """
`FixedPipeline` sends every order through validate, age check, customs,
charge, gift wrap and pack. Four orders make 24 step visits, but only 15 do
any work: a UK order has no customs, a plain order no gift wrap. Every step
starts with its own "does this apply to me?" check.
"""
speech = """
First demo: one fixed pipeline, for every order. [[slnc 400]] Six steps. [[slnc 300]] Validate, age check, customs, charge, gift wrap, and pack. [[slnc 600]]
Four orders go through all six. [[slnc 300]] Twenty-four visits. [[slnc 300]] Only fifteen did any work. [[slnc 500]]
A UK order needs no customs. [[slnc 300]] A plain order needs no gift wrap. [[slnc 300]] So every step starts by asking: does this even apply to me?
"""
rows = { pipeline = "active wrong" }
console = [
    ["4 orders x 6 steps = 24 visits", "amber"],
    ["15 did any work", "bad"],
]

[[act]]
title = "Routing slips"
summary = "Each order gets its own slip: ORD-1 [validate, charge, pack], ORD-2 adds gift-wrap, ORD-3 age-check, ORD-4 customs."
detail = """
`RoutingSlip.slipFor` writes each order's route once, from what the order is.
A plain UK order gets validate, charge, pack. The gift adds gift-wrap. The
age-restricted order adds age-check. The order to France adds customs.
"""
speech = """
Second demo: a routing slip. [[slnc 400]] As each order enters, its route is worked out once, and attached to it. [[slnc 600]]
Order one is a plain UK order: validate, charge, pack. [[slnc 300]] Order two is a gift: gift wrap is added. [[slnc 300]] Order three is age restricted: an age check is added. [[slnc 300]] Order four is going to France: customs is added.
"""
rows = { slip = "active ok" }
console = [
    ["ORD-1: validate, charge, pack", "ok"],
    ["ORD-2: + gift-wrap", "ok"],
    ["ORD-3: + age-check; ORD-4: + customs", "ok"],
]

[[act]]
title = "Steps pass it on"
summary = "Each step does its job and hands on to the next on the slip: 15 visits in all, every one doing work."
detail = """
Each order now visits only the steps on its slip. Each step does its job and
passes the order to the next address on the slip. Fifteen visits in all, and
every one does work. ORD-2 went validate, charge, gift-wrap, pack; no step
knows which comes after it.
"""
speech = """
Third demo: each step does its job, and passes the order to the next name on the slip. [[slnc 400]] Order two goes: validate, charge, gift wrap, pack. [[slnc 600]]
Fifteen visits in all. [[slnc 300]] Every one does work. [[slnc 500]]
And no step knows which step comes after it.
"""
rows = { slip = "active ok", steps = "active ok" }
console = [
    ["15 visits, every one doing work", "ok"],
    ["ORD-2: validate, charge, gift-wrap, pack", "ok"],
]

[[act]]
title = "A new step"
summary = "A rule adds fraud-check for orders over £500: ORD-4's slip gains it, ORD-1's is unchanged; no step changed."
detail = """
A fraud check is needed for orders over £500. One rule is added where slips
are written. ORD-4, worth £620, now has fraud-check before charge; ORD-1's
slip is unchanged, and none of the steps was touched.
"""
speech = """
Fourth demo: a new step. [[slnc 400]] Orders over five hundred pounds now need a fraud check. [[slnc 500]]
One rule is added, where the slips are written. [[slnc 300]] Order four is worth six hundred and twenty pounds, so its slip gains a fraud check, before charge. [[slnc 500]]
Order one's slip is unchanged. [[slnc 300]] No step was changed at all.
"""
rows = { slip = "active ok", steps = "active ok" }
console = [
    ["ORD-4: validate, customs, fraud-check,", "ok"],
    ["       charge, pack", "ok"],
    ["ORD-1: unchanged", "ok"],
]

[[act]]
title = "The bill"
summary = "ORD-5 fails its age check: the route stops, with charge and pack still on the slip; it cannot choose another route."
detail = """
ORD-5, a kitchen knife, fails its age check. The slip can stop there, with
charge and pack still on it, but it cannot choose a different route, such as
"ask for ID, then continue". Deciding routes from what happened on the way is
a job for a process manager.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] The route is fixed when the order sets off. [[slnc 500]]
Order five, a kitchen knife, fails its age check. [[slnc 300]] The route stops there, with charge and pack still on the slip. [[slnc 600]]
It cannot choose a new route, such as: ask for ID, then carry on. [[slnc 300]] That needs a process manager.
"""
rows = { slip = "active wrong", steps = "active amber" }
console = [
    ["ORD-5 stopped at age-check", "amber"],
    ["still on the slip: [charge, pack]", "amber"],
    ["cannot re-route: use a process manager", "amber"],
]

[animation]
subtitle = "Each order carries a slip listing its steps; every step does its job and passes the order to the next name on the slip."
boxes = [
    ["pipeline", "Fixed pipeline", "every step, every order"],
    ["slip", "Routing slip", "written once at the start"],
    ["steps", "Steps", "validate, age-check, customs, charge, gift-wrap, pack"],
]

[docs.problem]
scenario = """
Orders need different sets of processing steps depending on whether they are
gifts, age-restricted or going abroad.
"""
naive = """
`FixedPipeline` sends every order through all six steps, and each step checks
whether it applies: 24 visits for 15 pieces of work.
"""
deliver = [
    "Wasted visits counted in a fixed pipeline.",
    "A routing slip written per order.",
    "Steps passing orders along their slips.",
    "A new step added through the slip rules.",
    "A failed step stopping a slip that cannot re-route.",
    "Every printed result asserted by a test.",
]

[docs.prerequisites]
required = [
    "Java basics: classes, lists, `Deque`, lambdas.",
]
not_required = [
    "A message broker. Steps are called in turn.",
]

[docs.session]
objectives = [
    "Explain how a routing slip differs from a fixed pipeline.",
    "Write slips from a message's properties.",
    "Keep steps unaware of what follows them.",
    "Say when a process manager is needed instead.",
]
walkthrough = """
Run `./gradlew run` and compare act one's 24 visits with act three's 15.
Open `RoutingSlip.slipFor`: the only place routes are decided. Then `route`:
pop the next step, run it, repeat. End on act five.
"""
exercises = [
    "Add a 'loyalty-points' step for registered customers.",
    "Put the slip into the message as text and have a separate service read it.",
    "Rewrite act five with a process manager that asks for ID and then continues.",
]

[docs.explained]
sentence = """
A routing slip is a list of processing steps worked out when a message enters
and carried with it, so each step can pass the message on to the next one on
the list.
"""
verdict = """
Use routing slips when messages need different, predictable sequences of
steps. Keep the slip-writing rules in one place, keep steps independent, and
switch to a process manager when routes must change along the way.
"""
recognise = [
    "A list of step names or addresses carried in a message header.",
    "`routingSlip(...)` in Camel routes.",
    "Steps that forward to \"the next one on the list\".",
]

[spec]
purpose = """
Teach Routing Slip with an online store's order processing: a fixed pipeline
of six steps making 24 visits for 15 pieces of work, then slips written per
order, steps passing orders along, a fraud check added by one rule, and a
failed age check that stops but cannot re-route.
"""
nongoals = [
    "Not a message broker. Steps are called in sequence.",
    "Not dynamic re-routing. That is Process Manager.",
]
problem = """
A fixed pipeline sends every message through every step, and each step must
check whether it applies.
"""
roles = [
    ["The pattern", "`RoutingSlip`"],
    ["The message", "`OrderMessage` (carries the slip)"],
    ["The steps", "`Steps`"],
    ["The naive version", "`FixedPipeline`"],
    ["Entry point", "`RoutingSlipDemo`, five acts"],
]
requirements = [
    "**Written once:** each order's slip is decided when it enters.",
    "**Independent steps:** no step names the next one.",
    "**Open to new steps:** a rule adds fraud-check.",
    "**Every printed result is asserted** in `DemoRunsTest`.",
]

