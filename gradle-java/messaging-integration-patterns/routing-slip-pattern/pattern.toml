[[scene]]
key = "01-poster"
kind = "poster"
title = "Routing Slip"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Routing Slip pattern, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] With a routing slip, the steps a message needs are worked out once, when it arrives. [[slnc 300]] The list is attached to the message. [[slnc 300]] Each step does its work, and passes the message to the next step on the list. [[slnc 600]]
Think of the circulation slip clipped to a magazine in an office. [[slnc 300]] Pass to Anna, then Ben, then Carl. [[slnc 300]] Each person reads it, crosses their name off, and passes it on. [[slnc 300]] Nobody needs to know the whole list. [[slnc 700]]
In this video, the domain is an online shop. [[slnc 300]] Its orders need different steps: gift wrap for gifts, age checks for knives, customs for orders abroad. [[slnc 500]]
By the end, you will hear what a fixed pipeline wastes. [[slnc 300]] How routing slips fix it. [[slnc 300]] How to add a step. [[slnc 300]] And what a slip cannot do.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["validate, age check, customs,", "charge, gift wrap, pack.", "", "Most orders need only some.", "", "Every order went through all six."]
narration = """
Here is the scenario. [[slnc 400]] The shop has six processing steps. [[slnc 300]] Validate, age check, customs, charge, gift wrap, and pack. [[slnc 600]]
Most orders need only some of them. [[slnc 500]]
But every order went through all six, one after another.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["When a message enters:", "write its list of steps.", "", "Attach the list to the message.", "", "Each step: do the work, pass to", "the next step on the list."]
narration = """
Let's name the pattern. [[slnc 400]] When a message enters, write down the list of steps it needs. [[slnc 500]]
Attach the list to the message. [[slnc 300]] That is its routing slip. [[slnc 500]]
Each step does its work, and passes the message to the next step on the slip. [[slnc 300]] No step needs to know what comes after it.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["RoutingSlip: writes slips, runs steps", "OrderMessage: carries its slip", "Steps: one job each", "FixedPipeline: the old way"]
narration = """
Here is who does what. [[slnc 400]] The routing slip class writes each order's slip, and runs its steps in turn. [[slnc 500]]
The order message carries its slip, and a record of where it has been. [[slnc 500]]
The steps each do one job. [[slnc 300]] And the fixed pipeline is the old way, kept for comparison.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Camel routingSlip", "Approval workflows with a list", "of approvers", "Office circulation slips"]
narration = """
You have probably met this pattern already. [[slnc 400]] Apache Camel has a routing slip step. [[slnc 500]]
Approval workflows often attach a list of approvers to a document. [[slnc 500]]
And offices have used circulation slips for as long as there have been offices.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Different messages, different", "but predictable steps.", "", "Slip rules in one place.", "", "Route must change on the way?", "Use a process manager."]
narration = """
So, when should you use it? [[slnc 400]] When different messages need different, but predictable, sequences of steps. [[slnc 500]]
Keep the rules that write slips in one place. [[slnc 300]] Keep the steps independent. [[slnc 500]]
And when the route must change, depending on what happens along the way, use a process manager instead.
"""

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a loyalty-points", "step."]
narration = """
That's the Routing Slip pattern. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Let each message carry its own route, and each step just pass it on. [[slnc 500]]
The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs offline, with nothing installed except a Java development kit. [[slnc 500]]
