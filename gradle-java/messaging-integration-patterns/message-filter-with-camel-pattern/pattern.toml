[[scene]]
key = "01-poster"
kind = "poster"
title = "Message Filter with Apache Camel"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Message Filter pattern, built with Apache Camel, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] A message filter sits in front of a receiver. [[slnc 300]] It lets through only the messages that receiver wants, and drops the rest. [[slnc 500]] Apache Camel is an open-source library for moving messages, and it has a filter step built in. [[slnc 600]]
Think of a company post room. [[slnc 300]] Each department gives it a rule, such as, only letters marked gift wrap. [[slnc 300]] The post room applies the rules. [[slnc 300]] And a good one keeps a tray of letters nobody wanted. [[slnc 700]]
In this video, the domain is an online shop, whose checkout announces every order to its services. [[slnc 500]]
By the end, you will hear how a filter step works in Camel. [[slnc 300]] How to change a rule while everything runs. [[slnc 300]] And why a discard channel matters.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["Checkout announces 10 orders.", "", "Gift-wrap wants gift orders.", "Loyalty wants registered", "customers over £50."]
narration = """
Here is the scenario. [[slnc 400]] Checkout announces ten orders. [[slnc 500]]
The gift-wrap service only wants gift orders. [[slnc 300]] The loyalty service only wants registered customers, spending over fifty pounds. [[slnc 500]]
Without filters, each service was handed all ten.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern, in Camel"
body = ["filter(rule) in front", "of each receiver.", "", "Rules in the Simple language.", "", "Rejects to a discard channel."]
narration = """
Let's name the pattern, in Camel's words. [[slnc 400]] A filter step, with a rule, in front of each receiver. [[slnc 500]]
The rule is written in Camel's Simple language. [[slnc 500]]
And rejected messages go to a discard channel, where they can be counted.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["ShopRoutes: the routes and rules", "Rules: the changing threshold", "OrderEvent: the message", "Received: what each service got"]
narration = """
Here is who does what. [[slnc 400]] Shop routes holds every route, and every rule. [[slnc 500]]
Rules holds the threshold, which can change while the routes run. [[slnc 500]]
Order event is the message. [[slnc 300]] And received records what each service was given.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Camel filter()", "Spring Integration @Filter", "JMS message selectors", "Email rules"]
narration = """
You have probably met this already. [[slnc 400]] Camel's filter step, and Spring Integration's filter. [[slnc 500]]
Message selectors in Java messaging. [[slnc 500]]
And the rules in your email, that sort or discard incoming mail.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Many services, same messages.", "Rules that change.", "", "Keep rules short.", "Add a discard channel."]
narration = """
So, when should you use Camel for this? [[slnc 400]] When many services subscribe to the same messages, and the rules change. [[slnc 500]]
Keep each rule short. [[slnc 300]] And add a discard channel, so nothing is lost without a trace.
"""

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a discard", "channel to the gift filter."]
