plugins {
    id 'java'
    id 'application'
}

group = 'com.jk.explore'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // The official NATS client for Java, 2.26.3.
    implementation 'io.nats:jnats:2.26.3'
    // Testcontainers 2.0.5 starts and stops the NATS server image for the demo itself.
    implementation 'org.testcontainers:testcontainers:2.0.5'
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.16'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.jk.explore.eventbusnats.EventBusNatsDemo'
}

test {
    useJUnitPlatform()
}
