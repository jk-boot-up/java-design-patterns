title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern, in RabbitMQ"
body = ["A durable queue.", "Persistent messages.", "Publisher confirms.", "Acknowledge after the work."]
narration = """
Let's name the pattern, in RabbitMQ's words. [[slnc 400]] A durable queue, which survives a restart. [[slnc 300]] Persistent messages, written to disk. [[slnc 500]]
Publisher confirms, so the sender knows each message is stored. [[slnc 300]] And acknowledgements, sent only after the work is done.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["Broker: RabbitMQ in a container", "Outbox: sends, waits for confirms", "EmailSender: sends, then acks", "Poll: waits for real conditions"]
narration = """
Here is who does what. [[slnc 400]] The broker class starts RabbitMQ in a container, and can restart it. [[slnc 500]]
The outbox sends each email, and waits for the confirm. [[slnc 500]]
The email sender sends each email, and then acknowledges it. [[slnc 300]] And poll waits for real conditions, never a fixed time.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["RabbitMQ confirms and acks", "Kafka acks=all", "Amazon SQS delete after processing"]
narration = """
You have probably met this already. [[slnc 400]] RabbitMQ's confirms and acknowledgements. [[slnc 500]]
Kafka, which waits for every copy of a message to be stored. [[slnc 500]]
And Amazon SQS, where a message stays until the receiver deletes it.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Messages someone would miss:", "orders, payments, emails.", "", "All four settings.", "Expect duplicates.", "Replicate in production."]
narration = """
So, when should you use it? [[slnc 400]] For messages someone would miss. [[slnc 300]] Orders, payments, confirmations. [[slnc 500]]
Use all four settings. [[slnc 300]] Expect duplicates, and make receivers cope. [[slnc 300]] And copy queues across brokers in production.
"""

