# pattern.toml for the Guaranteed Delivery with RabbitMQ project. See tools/patternkit.

[project]
slug = "guaranteed-delivery-with-rabbitmq"
category = "messaging-integration-patterns"
title = "Guaranteed Delivery with RabbitMQ"
package = "guaranteedrabbit"
main_class = "RabbitGuaranteedDeliveryDemo"
tagline = "Persistent, confirmed, acknowledged"
bold = "Guarantee delivery with a real RabbitMQ broker: persistent messages on a durable queue, publisher confirms so the sender knows each message is stored, and acknowledgements so a message leaves the queue only after it has been handled."
youtube_description = """Guaranteed Delivery pattern in Java with a real RabbitMQ broker, using an online store's order confirmation emails. A message, once accepted, must never be lost, not when the program crashes and not when the broker restarts, and RabbitMQ can give that guarantee if you ask correctly, like recorded delivery with a receipt at each end. We watch a durable queue lose transient messages, make them persistent and confirmed, acknowledge only after sending, and crash before the acknowledgement to see a message delivered twice. Store it, confirm it, and acknowledge it only when the work is done."""
domain_note = ""
thumb_lines = ["GUARANTEED DELIVERY", "WITH RABBITMQ"]
thumb_code = "PERSISTENT + confirm + ack"
youtube_title = "Guaranteed Delivery with RabbitMQ"
youtube_tags = ["guaranteed delivery", "rabbitmq", "publisher confirms", "acknowledgements", "at least once", "java"]

[readme]
intro = """
This is the real-infrastructure version of the Guaranteed Delivery pattern.
The plain Java version, a separate project in this category, writes its own
journal file to disk. Here a real RabbitMQ broker, started in a container by
the demo itself, does the storing, and the demo restarts the broker to show
what survives.

Three settings together make the guarantee. The queue is durable, so the
queue survives a restart. Each message is sent as persistent, so the message
itself is written to disk. And the sender turns on publisher confirms, so it
waits until the broker says the message is safely stored. On the receiving
side, each message is acknowledged only after the email has been sent.
"""
analogy = """
Think of sending an important letter by recorded delivery. The post office
logs it when you hand it over and gives you a receipt, which is the confirm.
The letter is signed for at the other end, which is the acknowledgement. If
the van breaks down, the letter is still in the sorting office. And if the
recipient signs, then drops the letter unread, a second copy may arrive: the
service guarantees at least one delivery, not exactly one.
"""
scenario = """
The online store sends a confirmation email for every order. The emails wait
on a queue while the email provider is slow. When the broker restarted for an
update, ten queued emails vanished, and ten customers never heard that their
order had been received.
"""
test_note = """
Every number the demo prints is asserted against a real broker. Waits are
bounded polls on real conditions, never fixed sleeps. Without a container
runtime, the broker test is skipped rather than failed.
"""
run_note = """
This project needs a running container runtime, such as Docker Desktop: the
demo starts a real RabbitMQ 4.3.6 broker in a container and removes it again.
Without one, it prints a sentence saying what to start, rather than failing.
"""
twin = """
The plain Java version got the idea exactly right: write every message down
before accepting it, remove it only when acknowledged, and accept that a
crash between sending and acknowledging means a duplicate. What it left out
is how a real broker divides that work, and the traps in its settings. A
durable queue alone is not enough: messages sent as not persistent vanished
on restart although the queue survived. The sender only knows a message is
safe once the broker confirms it. RabbitMQ 4 refuses shared queues that are
not durable at all. And the broker marks a message it delivers again as
redelivered, which a receiver can use to check before sending twice.
"""
technologies = [
    ["RabbitMQ", "4.3.6 (container image)", "the broker: durable queue, persistence, confirms, acknowledgements"],
    ["RabbitMQ Java client", "5.36.0", "publishing, confirms, getting and acknowledging"],
    ["Testcontainers", "2.0.5", "starts and stops the broker container from the demo"],
    ["Docker", "24 or later", "runs the container"],
    ["SLF4J simple", "2.0.17", "library logging, switched off"],
]
costs = [
    "**Slower sends.** Every email waits for a disk write and a confirm before checkout moves on.",
    "**Duplicates remain.** A receiver that dies after sending but before acknowledging causes a second email.",
    "**Another system.** The broker must be run, backed up and watched; one node is still one disk, so production uses replicated queues.",
]
too_much = """
For messages that can be recreated or safely lost, such as live price
updates, persistence and confirms only add cost. Guaranteed delivery is for
messages whose loss someone would notice: orders, payments, confirmations.
"""
met_before = [
    "RabbitMQ durable queues, persistent messages, confirms and manual acks.",
    "Kafka's `acks=all` with replicated partitions.",
    "Amazon SQS, which keeps a message until it is deleted by the receiver.",
]
where = """
This project is in [messaging-integration-patterns](..). It is the
real-infrastructure version of the plain Java Guaranteed Delivery project in
the same category, which is left unchanged.
"""

[[act]]
title = "Durable queue, transient messages"
summary = "10 emails on a durable queue but sent as not persistent: after a broker restart the queue is there, with 0 waiting."
detail = """
The queue is durable, but the ten emails are sent as not persistent. Before
the restart, ten are waiting. The demo restarts the broker: the queue is
still there, and nothing is in it. A durable queue is not enough; each
message must be marked persistent too.
"""
speech = """
First demo: a durable queue, but messages that are not persistent. [[slnc 400]] The queue itself is written to disk. [[slnc 300]] The messages are not. [[slnc 600]]
Ten emails are waiting. [[slnc 300]] The broker restarts. [[slnc 500]]
The queue is still there. [[slnc 300]] It is empty. [[slnc 600]]
A durable queue is not enough. [[slnc 300]] Each message must be marked persistent too.
"""
rows = { outbox = "active amber", broker = "active wrong" }
console = [
    ["before restart: waiting 10", "muted"],
    ["after restart: waiting 0", "bad"],
]

[[act]]
title = "Persistent and confirmed"
summary = "Persistent messages with publisher confirms: each is confirmed after it is stored; after a restart, 10 are waiting."
detail = """
Now each email is sent as persistent, and the sender turns on publisher
confirms: it waits for the broker to say each message is stored on disk.
After the broker restarts, all ten emails are still waiting.
"""
speech = """
Second demo: persistent messages, and publisher confirms. [[slnc 400]] Each email is now marked persistent. [[slnc 300]] And the sender waits for the broker to confirm it is stored. [[slnc 600]]
The broker restarts. [[slnc 500]]
All ten emails are still waiting.
"""
rows = { outbox = "active ok", broker = "active ok" }
console = [
    ["each send confirmed after storing", "ok"],
    ["after restart: waiting 10", "ok"],
]

[[act]]
title = "Acknowledged after sending"
summary = "The sender acknowledges each email after sending it: 6 sent, 4 still waiting; a new sender takes the rest, 10 of 10, each once."
detail = """
The email sender takes messages with manual acknowledgement: it sends each
email, then tells the broker it is done. It sends six and stops; four are
still waiting. A new sender takes the rest: ten of ten sent, each once, and
the queue is empty.
"""
speech = """
Third demo: acknowledged after sending. [[slnc 400]] The email sender tells the broker each email is done, only after sending it. [[slnc 600]]
It sends six, and stops. [[slnc 300]] Four are still waiting. [[slnc 500]]
A new sender takes the rest. [[slnc 300]] Ten of ten, each sent once.
"""
rows = { sender = "active ok", broker = "active ok" }
console = [
    ["6 sent and acked; 4 waiting", "ok"],
    ["10 of 10, each once", "ok"],
]

[[act]]
title = "A crash before the acknowledgement"
summary = "The sender dies after sending MAIL-11 but before acknowledging it: RabbitMQ redelivers it, marked redelivered, and the customer gets it twice."
detail = """
The sender takes MAIL-11, sends it, and dies before acknowledging. RabbitMQ
sees the connection drop and puts MAIL-11 back on the queue. The next sender
gets it again, marked as redelivered, and the customer receives it twice.
Guaranteed delivery means at least once; the redelivered flag lets a receiver
check before sending again.
"""
speech = """
Fourth demo: a crash before the acknowledgement. [[slnc 400]] The sender sends email eleven. [[slnc 300]] Then it dies, before saying it is done. [[slnc 600]]
The broker puts the email back on the queue. [[slnc 300]] The next sender gets it again. [[slnc 300]] Marked as redelivered. [[slnc 500]]
The customer receives it twice. [[slnc 500]]
Guaranteed delivery means at least once. [[slnc 300]] The redelivered mark lets a receiver check first.
"""
rows = { sender = "active wrong", broker = "active ok" }
console = [
    ["MAIL-11 redelivered", "amber"],
    ["customer gets it 2 times", "bad"],
]

[[act]]
title = "The bill"
summary = "Every email waits for a disk write and a confirm; and the broker is one more system to run, back up and watch."
detail = """
Every email now waits for a disk write and a confirm from the broker before
checkout moves on. And the broker is one more system to run, back up and
watch; a single node is still a single disk, so production uses replicated
queues across several nodes.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] Every email now waits for a disk write, and a confirm, before checkout moves on. [[slnc 600]]
And the broker is one more system to run, back up, and watch. [[slnc 300]] One broker is still one disk. [[slnc 300]] Production copies queues across several brokers.
"""
rows = { broker = "active amber" }
console = [
    ["a disk write and a confirm per email", "amber"],
    ["one more system to run", "amber"],
]

