[[scene]]
key = "01-poster"
kind = "poster"
title = "Guaranteed Delivery with RabbitMQ"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Guaranteed Delivery pattern, with a real RabbitMQ broker, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] Guaranteed delivery means a message, once accepted, is never lost. [[slnc 300]] Not when the program crashes. [[slnc 300]] Not when the broker restarts. [[slnc 500]] RabbitMQ is an open-source message broker, a separate program that holds messages, and it can give that guarantee if you ask for it correctly. [[slnc 600]]
Think of recorded delivery at the post office. [[slnc 300]] You get a receipt when you hand the letter over. [[slnc 300]] And it is signed for at the other end. [[slnc 700]]
In this video, the domain is an online shop's order confirmation emails. [[slnc 500]]
By the end, you will hear which RabbitMQ settings make the guarantee. [[slnc 300]] What happens when one is missing. [[slnc 300]] And why a guaranteed message can still arrive twice.
"""

