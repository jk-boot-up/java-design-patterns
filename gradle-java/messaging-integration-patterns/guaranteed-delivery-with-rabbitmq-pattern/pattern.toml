Here is the scenario. [[slnc 400]] The shop's confirmation emails wait on a queue, while the email provider is slow. [[slnc 500]]
The broker restarted, for an update. [[slnc 500]]
Ten emails vanished. [[slnc 300]] Ten customers never heard that their order was received.
"""

[[scene]]
key = "03-acts"
