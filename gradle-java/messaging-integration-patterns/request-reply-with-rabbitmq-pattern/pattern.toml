[[scene]]
key = "01-poster"
kind = "poster"
title = "Request-Reply with RabbitMQ"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Request-Reply pattern, with a real RabbitMQ broker, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] Request-reply is asking a question with one message, and getting the answer in another. [[slnc 300]] Each request says where to send the answer. [[slnc 300]] And carries a reference, so the answer can be matched to it. [[slnc 500]] RabbitMQ is an open-source message broker, and it has both of these built into every message. [[slnc 600]]
Think of letters to a supplier, each with your address and a reference number. [[slnc 300]] The answers come back in any order, but each names your reference. [[slnc 700]]
In this video, the domain is an online shop's checkout, asking an inventory service to reserve items. [[slnc 500]]
By the end, you will hear how replies get mixed up. [[slnc 300]] How references and return addresses fix it. [[slnc 300]] And what to do about a reply that never comes.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["Checkout asks inventory", "to reserve items.", "", "Cached items are answered first.", "", "Web and phone app both ask."]
narration = """
Here is the scenario. [[slnc 400]] Checkout asks the inventory service to reserve items, and waits for the answer. [[slnc 500]]
The inventory service answers items in its cache first. [[slnc 300]] So replies can come back in a different order. [[slnc 500]]
And the web checkout and the phone app both ask.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern, in RabbitMQ"
body = ["replyTo: where to answer.", "correlationId: which question.", "", "expiration: drop it if", "nobody takes it in time."]
narration = """
Let's name the pattern, in RabbitMQ's words. [[slnc 400]] Reply to, says where to send the answer. [[slnc 300]] Correlation identifier, says which question it answers. [[slnc 500]]
And expiration tells the broker to drop a request, if nobody takes it in time.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
