# pattern.toml for the Request-Reply with RabbitMQ project. See tools/patternkit.

[project]
slug = "request-reply-with-rabbitmq"
category = "messaging-integration-patterns"
title = "Request-Reply with RabbitMQ"
package = "requestreplyrabbit"
main_class = "RabbitRequestReplyDemo"
tagline = "replyTo and correlationId, for real"
bold = "Ask and answer over a real RabbitMQ broker: each request carries a return address and a correlation ID, the inventory service replies to that address with that ID, and an expiry on the request makes sure an abandoned request is never handled late."
domain_note = ""
thumb_lines = ["REQUEST-REPLY", "WITH RABBITMQ"]
thumb_code = "replyTo + correlationId"
youtube_title = "Request-Reply with RabbitMQ"
youtube_tags = ["request reply", "rabbitmq", "correlation id", "reply to", "direct reply-to", "java"]

[readme]
intro = """
This is the real-infrastructure version of the Request-Reply pattern. The
plain Java version, a separate project in this category, builds channels in
memory. Here a real RabbitMQ broker, started in a container by the demo
itself, carries the requests and the replies.

RabbitMQ has the pattern's two ideas built into every message: a `replyTo`
property, the return address, and a `correlationId` property, which the
replier copies so the requester can match the answer to its question. It also
offers direct reply-to, a way to receive replies without declaring any reply
queue, and per-message expiry, which the last act uses to deal honestly with
a reply that never comes.
"""
analogy = """
Think of sending several letters to a supplier, each asking about a
different item. On each you write your address and a reference number. The
supplier answers in whatever order suits them, but writes your reference on
each reply, so you know which question it answers. And if you write "ignore
after Friday", a letter that sat unopened does not get acted on the week
after.
"""
scenario = """
The online store's checkout asks the inventory service to reserve items and
waits for the answer. The inventory service answers items it has cached
first, so replies can come back in a different order from the requests. The
web checkout and the phone app both ask, and each must get its own answers.
"""
test_note = """
Every number the demo prints is asserted against a real broker. Waits are
bounded polls on real conditions, never fixed sleeps. Without a container
runtime, the broker test is skipped rather than failed.
"""
run_note = """
This project needs a running container runtime, such as Docker Desktop: the
demo starts a real RabbitMQ 4.3.6 broker in a container and removes it again.
Without one, it prints a sentence saying what to start, rather than failing.
"""
twin = """
The plain Java version got the idea right: replies can overtake each other,
so each carries a correlation ID; each requester names its own return
address; many requests can be in flight; and a missing reply must be timed
out. What it left out is what a real broker adds and demands. The return
address and ID are standard message properties. RabbitMQ's direct reply-to
lets the phone app receive replies with no reply queue at all. Publishing does
not wait, so a service can look before a request has even arrived, and the
demo must wait for real conditions. And per-message expiry answers the
question the plain version could not: whether an abandoned request would
still be handled late.
"""
technologies = [
    ["RabbitMQ", "4.3.6 (container image)", "the broker: queues, replyTo, correlationId, expiry, direct reply-to"],
    ["RabbitMQ Java client", "5.36.0", "publishing, consuming, basicGet"],
    ["Testcontainers", "2.0.5", "starts and stops the broker container from the demo"],
    ["Docker", "24 or later", "runs the container"],
    ["SLF4J simple", "2.0.17", "library logging, switched off"],
]
costs = [
    "**A waiting table.** The requester must remember what it asked, time out missing replies and clean up.",
    "**Expiry is a choice.** Without an expiry, a request abandoned by the requester may still be handled later.",
    "**Another system.** The broker must be running for anyone to ask anything.",
]
too_much = """
If a caller needs an answer at once and the service is always reachable, a
plain HTTP call is simpler. Request-reply over a broker pays off when callers
and services are decoupled, replies can be slow, and many requests are in
flight.
"""
met_before = [
    "RabbitMQ RPC tutorials and Spring AMQP's `RabbitTemplate.convertSendAndReceive`.",
    "JMS `JMSReplyTo` and `JMSCorrelationID`.",
    "Email threads, where a reply carries a reference to the original.",
]
where = """
This project is in [messaging-integration-patterns](..). It is the
real-infrastructure version of the plain Java Request-Reply project in the
same category, which is left unchanged.
"""

[[act]]
title = "Replies taken in arrival order"
summary = "Two requests, no IDs: the mug is answered first from the cache and taken as the kettle's reply: KETTLE -> RESERVED 2 x MUG-1."
detail = """
Checkout asks for five kettles and then two mugs, without correlation IDs,
and takes replies in the order they come back. The inventory service answers
the mug first, from its cache. So the kettle request is paired with the mug
reply, RESERVED 2 x MUG-1, and the mug request with the kettle refusal.
"""
speech = """
First demo: replies taken in the order they come back. [[slnc 400]] Checkout asks for five kettles, then two mugs. [[slnc 600]]
The inventory service answers the mugs first, from its cache. [[slnc 500]]
Checkout takes the first reply as the kettle's answer. [[slnc 300]] So it believes its kettles were reserved. [[slnc 300]] They were refused.
"""
rows = { requester = "active wrong", inventory = "active amber" }
console = [
    ["KETTLE x 5 -> RESERVED 2 x MUG-1", "bad"],
    ["MUG x 2 -> REFUSED 5 x KETTLE-1", "bad"],
]

[[act]]
title = "Correlation IDs"
summary = "WEB-1 and WEB-2 carry correlation IDs: each reply is matched, the kettle REFUSED and the mug RESERVED."
detail = """
Now each request carries a correlation ID, and the inventory service copies it
onto the reply. The mug reply still comes first, but its ID says it answers
WEB-2. WEB-1, the kettles, is refused; WEB-2, the mugs, is reserved.
"""
speech = """
Second demo: correlation identifiers. [[slnc 400]] Each request carries a reference. [[slnc 300]] The inventory service copies it onto the reply. [[slnc 600]]
The mug reply still comes first. [[slnc 300]] But its reference says which request it answers. [[slnc 500]]
The kettles are refused. [[slnc 300]] The mugs are reserved. [[slnc 300]] Each answer matched to its question.
"""
rows = { requester = "active ok", inventory = "active ok" }
console = [
    ["WEB-1 KETTLE x 5 -> REFUSED", "ok"],
    ["WEB-2 MUG x 2 -> RESERVED", "ok"],
]

[[act]]
title = "Return addresses"
summary = "The phone app uses RabbitMQ's direct reply-to and the web checkout its own exclusive queue; each gets its own reply."
detail = """
Each request names where its reply should go. The phone app uses RabbitMQ's
direct reply-to, `amq.rabbitmq.reply-to`, which needs no reply queue declared
at all. The web checkout uses its own exclusive, server-named queue. One
inventory service, and each reply goes where its request said.
"""
speech = """
Third demo: return addresses. [[slnc 400]] Each request names where its reply should go. [[slnc 600]]
The phone app uses a RabbitMQ feature called direct reply-to. [[slnc 300]] It needs no reply queue at all. [[slnc 500]]
The web checkout uses its own private queue. [[slnc 500]]
One inventory service. [[slnc 300]] Each reply goes to the address in its request.
"""
rows = { requester = "active ok", inventory = "active ok" }
console = [
    ["APP-1 -> RESERVED 1 x TEAPOT-1 (direct reply-to)", "ok"],
    ["WEB-3 -> RESERVED 2 x TEAPOT-1 (own queue)", "ok"],
]

[[act]]
title = "Many in flight"
summary = "20 requests are sent before any reply; the service handles 20, all are matched, and none is left waiting."
detail = """
Twenty requests are sent before any reply comes back. The inventory service
handles all twenty, and every reply is matched by its correlation ID. None is
left in the requester's waiting table.
"""
speech = """
Fourth demo: many requests in flight at once. [[slnc 400]] Twenty requests are sent, before a single reply. [[slnc 600]]
The service handles all twenty. [[slnc 300]] Every reply is matched by its reference. [[slnc 300]] None is left waiting.
"""
rows = { requester = "active ok", inventory = "active ok" }
console = [
    ["20 sent, 20 matched", "ok"],
    ["still waiting: 0", "ok"],
]

[[act]]
title = "A reply that never comes"
summary = "WEB-24 gets no reply in 0.5 s and must be timed out; its 0.5 s expiry means RabbitMQ drops it, so the service later handles 0."
detail = """
The inventory service is busy. WEB-24 waits half a second, gets no reply, and
sits in the waiting table until the requester times it out. Was the mug
reserved? Because the request was sent with a half-second expiry, RabbitMQ
dropped it from the queue: when the service returns, it handles nothing. The
mug was not reserved late behind the requester's back.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] The inventory service is busy. [[slnc 300]] Request twenty-four waits half a second. [[slnc 300]] No reply. [[slnc 600]]
The requester must time it out, and clean up. [[slnc 500]]
But was the mug reserved later? [[slnc 300]] The request was sent with an expiry of half a second. [[slnc 300]] So RabbitMQ dropped it. [[slnc 500]]
When the service comes back, there is nothing to handle. [[slnc 300]] Without the expiry, nobody could tell.
"""
rows = { requester = "active amber", inventory = "active amber" }
console = [
    ["WEB-24: no reply after 0.5 s", "amber"],
    ["expired in the queue: service handles 0", "ok"],
]

[animation]
subtitle = "Requests carry replyTo and correlationId through a real RabbitMQ broker; replies come back to each requester."
boxes = [
