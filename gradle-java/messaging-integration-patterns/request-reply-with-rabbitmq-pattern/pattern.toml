    ["inventory", "Inventory service", "replies, cached items first"],
]

[docs.problem]
scenario = """
Checkout and the phone app ask the inventory service to reserve items over a
broker, and replies can come back out of order.
"""
naive = """
Taking replies in arrival order pairs answers with the wrong questions.
"""
deliver = [
    "Mismatched replies without IDs.",
    "Correlation IDs matching every reply.",
    "Return addresses, including direct reply-to.",
    "Twenty requests in flight.",
    "A timed-out request expiring in the queue.",
    "Every printed result asserted by a test, skipped without Docker.",
]

[docs.prerequisites]
required = [
    "Java basics: maps, lambdas.",
    "The Request-Reply idea, ideally from the plain Java version of this pattern.",
]
not_required = [
    "Earlier RabbitMQ experience. The dependencies page explains the words used.",
]
install = [
    "A running container runtime such as Docker Desktop. The demo starts and removes RabbitMQ itself.",
]

[docs.dependencies]
intro = """
This project uses a real RabbitMQ broker, run in a container by
Testcontainers, which the plain Java version of Request-Reply does not.
Skipping it loses none of the pattern: the plain version teaches all of it
with nothing installed.
"""
what = [
    ["RabbitMQ", "RabbitMQ is a message broker: a separate program that holds messages. Every message can carry properties. replyTo names the queue a reply should go to. correlationId is a reference the replier copies onto its reply. expiration tells the broker to drop the message if nobody has taken it within that many milliseconds. amq.rabbitmq.reply-to is direct reply-to: a special address a client can consume from, so replies reach it without any reply queue being declared. An exclusive queue belongs to one connection and disappears with it."],
    ["Testcontainers", "Testcontainers is a Java library that starts a container, here the RabbitMQ image, from inside a program, and removes it afterwards."],
]
why = """
The plain version shows the idea. This version shows the message properties a
real broker provides for it, and the two things a real broker forces into the
open: that publishing does not wait, and that an abandoned request needs an
expiry.
"""
versions = [
    ["Java", "21"],
    ["Docker", "running; 24 or later"],
    ["RabbitMQ image", "rabbitmq:4.3.6"],
    ["RabbitMQ Java client", "5.36.0"],
    ["Testcontainers", "2.0.5"],
]
costs = [
    "A container runtime, and a first run that downloads the broker image.",
    "A waiting table and time-outs in every requester.",
]

[docs.session]
objectives = [
    "Send requests with `replyTo` and `correlationId`.",
    "Match replies to requests by ID.",
    "Use direct reply-to or an exclusive queue as a return address.",
    "Use message expiry so an abandoned request is never handled late.",
]
walkthrough = """
Run `./gradlew run` with Docker running. Compare act one's wrong pairs with act
two's right ones. Open `Requester.send`: two properties. End on act five's
expiry.
"""
exercises = [
    "Remove the expiry in act five and show the mug being reserved late.",
    "Replace the requester with Spring AMQP's `convertSendAndReceive`.",
    "Run two inventory services and see replies still matched.",
]

[docs.explained]
sentence = """
With RabbitMQ, request-reply uses the `replyTo` and `correlationId` properties,
and an expiry so a request nobody waits for is dropped.
"""
verdict = """
Use request-reply over a broker when callers and services are decoupled and
replies may be slow. Always set a correlation ID, time out in the requester,
and give requests an expiry that matches that time-out.
"""
recognise = [
    "`AMQP.BasicProperties.Builder().replyTo(...).correlationId(...)`.",
    "`amq.rabbitmq.reply-to` or a server-named exclusive queue.",
    "A map of waiting requests keyed by correlation ID.",
]

[spec]
purpose = """
Teach Request-Reply with a real RabbitMQ broker: mismatched replies without
IDs, correlation IDs, return addresses with direct reply-to, many requests in
flight, and an abandoned request expiring in the queue.
"""
nongoals = [
    "Not Spring AMQP. The plain RabbitMQ client is used so each property is visible.",
]
problem = """
Replies over a broker can come back in any order, to many requesters, or not
at all.
"""
roles = [
    ["The broker in a container", "`Broker`"],
    ["The caller", "`Requester`"],
    ["The replier", "`InventoryService`"],
    ["Waiting for real conditions", "`Poll`"],
    ["Entry point", "`RabbitRequestReplyDemo`, five acts"],
]
requirements = [
    "**Matched:** every reply with an ID reaches the request with that ID.",
    "**Addressed:** each reply goes to its request's `replyTo`.",
    "**Expired:** an abandoned request is never handled.",
    "**No Docker, no crash:** without a runtime the demo prints advice.",
]

