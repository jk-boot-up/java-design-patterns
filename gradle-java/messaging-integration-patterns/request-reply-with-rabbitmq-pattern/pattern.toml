narration = """
Here is who does what. [[slnc 400]] The requester sends each question, and matches each answer by its reference. [[slnc 500]]
The inventory service answers, copying the reference. [[slnc 500]]
The broker class runs RabbitMQ in a container. [[slnc 300]] And poll waits for real conditions.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["RabbitMQ RPC", "Spring AMQP convertSendAndReceive", "JMS reply-to and correlation", "Email threads"]
narration = """
You have probably met this already. [[slnc 400]] RabbitMQ's remote procedure call examples. [[slnc 300]] And Spring's send and receive methods. [[slnc 500]]
Java messaging has reply-to and correlation fields too. [[slnc 500]]
And every email reply carries a reference to the message it answers.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Callers and services decoupled,", "replies may be slow.", "", "Always an ID.", "Time out in the requester.", "Expire the request too."]
narration = """
So, when should you use it? [[slnc 400]] When callers and services are decoupled, and replies may be slow. [[slnc 500]]
Always set a reference. [[slnc 300]] Time out in the requester. [[slnc 300]] And give each request an expiry that matches that time-out.
"""

