[poster]
headline = [["MESSAGE", "text"], ["TRANSLATOR", "text"]]
before = { code = "if (csv) ... else if (json) ...", note = "in the warehouse", tag = "BEFORE" }
after = { code = "normalize(raw) -> OrderMessage", note = "one shape inside", tag = "AFTER" }
taglines = [["Many formats in, one format out", "gold"]]

[[scene]]
key = "01-poster"
kind = "poster"
title = "Message Translator / Normalizer"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Message Translator and Normalizer patterns, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] A message translator turns a message in one format into the format your system uses. [[slnc 300]] A normalizer recognises which format each message is in, and picks the right translator. [[slnc 300]] So everything inside your system arrives in one standard shape. [[slnc 600]]
Think of interpreters at an international meeting. [[slnc 300]] Each delegate speaks their own language. [[slnc 300]] An interpreter for each language turns it into the one working language. [[slnc 300]] When a new country joins, you hire one more interpreter. [[slnc 700]]
In this video, the domain is an online shop. [[slnc 300]] It takes orders from its own web form, and from marketplaces that each send orders in their own format. [[slnc 500]]
By the end, you will hear what happens when the warehouse reads every format. [[slnc 300]] How translators and a normalizer fix it. [[slnc 300]] How to add a marketplace. [[slnc 300]] And what gets lost in translation.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["Web form: order=W-1;sku=...", "Marketplace A: CSV", "Marketplace B: JSON, own field names", "", "The warehouse read them all."]
narration = """
Here is the scenario. [[slnc 400]] Orders come from the shop's web form, as key-value text. [[slnc 300]] From marketplace A, as comma-separated values. [[slnc 300]] And from marketplace B, as JSON, with its own names for every field. [[slnc 600]]
The warehouse read all three itself.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["One translator per format.", "", "A normalizer recognises the format", "and picks the translator.", "", "Inside: one canonical message."]
narration = """
Let's name the patterns. [[slnc 400]] Write one small translator for each format. [[slnc 300]] Each turns its format into one canonical message: the shop's standard order. [[slnc 500]]
Put a normalizer at the edge. [[slnc 300]] It recognises which format each message is in, and hands it to the right translator. [[slnc 500]]
Inside the shop, there is only one kind of order.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["OrderMessage: the canonical order", "Translators: web, A, B, C", "Normalizer: recognise, pick", "Warehouse: sees one shape"]
narration = """
Here is who does what. [[slnc 400]] Order message is the canonical order: ID, product, quantity, and price in pence. [[slnc 500]]
The translators turn each format into it. [[slnc 500]]
The normalizer recognises the format, and picks the translator. [[slnc 300]] And the warehouse only ever sees order messages.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Camel data formats, unmarshal", "Spring Integration transformers", "Canonical data models", "One mapper per provider"]
narration = """
You have probably met these patterns already. [[slnc 400]] Apache Camel and Spring Integration have transformers and data formats for exactly this. [[slnc 500]]
Large companies define a canonical data model, one standard shape for each kind of message. [[slnc 500]]
And any shop that integrates with several payment or shipping providers has one mapper for each.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Several senders, several formats.", "", "One translator per format.", "Design the canonical message.", "Check what each one drops."]
narration = """
So, when should you use them? [[slnc 400]] Whenever several senders use different formats. [[slnc 500]]
Keep one small translator for each format. [[slnc 300]] Design the canonical message carefully. [[slnc 300]] And check what each translation drops. [[slnc 500]]
With one sender whose format you control, simply agree on the format.
"""

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Carry the gift note", "through."]
narration = """
That's the Message Translator and Normalizer patterns. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Translate at the edge, so the inside speaks one language. [[slnc 500]]
The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs offline, with nothing installed except a Java development kit. [[slnc 500]]
Here is one exercise to try. [[slnc 300]] Add a note field to the standard order, and carry the gift note through. [[slnc 500]]
If this helped, a like really does help other people find it. [[slnc 300]] And subscribe, if you'd like the rest of the series. [[slnc 400]] Thanks for watching.
"""
