    { id = "a", label = "{id:B-9, item:TEAPOT-1, ...}", sub = "marketplace B", col = 0, row = 0, colour = "client" },
    { id = "b", label = "starts with {", sub = "normalizer: JSON", col = 1, row = 0, colour = "accent" },
    { id = "c", label = "B-9, TEAPOT-1, 1, 2500", sub = "OrderMessage", col = 2, row = 0, colour = "green" },
    { id = "d", label = "gift_note", sub = "no field: dropped", col = 2, row = 1, colour = "red" },
]
edges = [
    { from = "a", to = "b", label = "" },
    { from = "b", to = "c", label = "MARKET_B" },
    { from = "b", to = "d", label = "", dashed = true },
]

[[diagram]]
name = "sequence-diagram"
kind = "sequence"
title = "Message Translator — normalizing an order"
