[poster]
headline = [["RECIPIENT", "text"], ["LIST", "text"]]
before = { code = "send to all 4 warehouses", note = "20 deliveries, 8 needed", tag = "BEFORE" }
after = { code = "recipientsFor(order)", note = "8 deliveries, all needed", tag = "AFTER" }
