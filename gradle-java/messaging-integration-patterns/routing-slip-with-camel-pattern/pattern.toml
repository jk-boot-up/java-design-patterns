# pattern.toml for the Routing Slip with Apache Camel project. See tools/patternkit.

[project]
slug = "routing-slip-with-camel"
category = "messaging-integration-patterns"
title = "Routing Slip with Apache Camel"
package = "routingslipcamel"
main_class = "CamelRoutingSlipDemo"
tagline = "routingSlip(): each order carries its route"
bold = "Build the routing slip with Apache Camel: each order's list of steps is written once into a header, routingSlip() follows it, and dynamicRouter() shows what to use when the next step must be decided on the way."
domain_note = ""
thumb_lines = ["ROUTING SLIP", "WITH CAMEL"]
thumb_code = "routingSlip(header(\"slip\"))"
youtube_title = "Routing Slip with Apache Camel"
youtube_tags = ["routing slip", "apache camel", "enterprise integration patterns", "dynamic router", "workflow", "java"]

[readme]
intro = """
This is the framework version of the Routing Slip pattern. The plain Java
version, a separate project in this category, walks the slip by hand. Here
Apache Camel does it: the list of steps each order needs is written once into
a message header, and `routingSlip(header("slip"))` sends the order through
those steps in turn. No step knows which step comes after it.

Camel also has a close relative, `dynamicRouter()`, which decides each next
step on the way, from what has just happened. The last act shows it doing
what a slip cannot.
"""
analogy = """
Think of a hospital patient's treatment card. At reception, the card is
filled in with the departments this patient must visit: X-ray, then blood
test, then the doctor. Each department does its part and sends the patient
on to the next name on the card. No department needs to know the whole plan.
"""
scenario = """
The online store sent every order through the same six steps: validate, age
check, customs, charge, gift wrap and pack. Four orders made twenty-four
visits, and only fifteen did any work; every step began by asking "does this
apply to me?"
"""
run_note = """
Nothing to install beyond a Java 21 JDK: Camel runs inside the program on its
in-memory `direct:` endpoints.
"""
twin = """
The plain Java version got the idea right: the route is decided once, carried
with the message, and followed step by step, so steps are independent and a
new step is one rule where slips are written. What it left out is what Camel
provides: the slip as a plain header of endpoint addresses that Camel follows
for you, steps that could be queues or services anywhere, and the sibling
`dynamicRouter()` that decides each next step on the way. The plain version
could only say that a slip cannot change course; this one shows the tool that
can.
"""
technologies = [
    ["Apache Camel", "4.22.1", "routingSlip(), dynamicRouter() and direct: endpoints"],
    ["SLF4J simple", "2.0.17", "Camel's logging, switched off"],
]
costs = [
    "**Fixed at the start.** When ORD-5 failed its age check, the slip could only stop; charge and pack were still on it.",
    "**Endpoint names in a header.** A typo in a step name is found only when an order reaches it.",
    "**More to carry.** More than ten library files instead of none.",
]
too_much = """
If every message needs the same steps, a plain route is simpler. A routing
slip pays off when different messages need different sets of steps, known at
the start.
"""
met_before = [
    "Camel's `routingSlip()` and `dynamicRouter()`.",
    "Treatment cards in hospitals, and job travellers in factories.",
    "Workflow engines where a document carries its approval chain.",
]
where = """
This project is in [messaging-integration-patterns](..). It is the framework
version of the plain Java Routing Slip project in the same category, which is
left unchanged.
"""

[[act]]
title = "One fixed pipeline"
summary = "Every order visits all 6 steps: 4 orders make 24 visits, of which 15 do any work."
detail = """
First, the old way as a Camel route: every order is sent to all six steps in
turn. Four orders make twenty-four visits, and only fifteen of them do any
work. The rest are steps checking whether they apply, and finding they do not.
"""
speech = """
First demo: one fixed pipeline for every order. [[slnc 400]] Every order visits all six steps. [[slnc 600]]
Four orders, twenty-four visits. [[slnc 300]] Only fifteen of them did any work. [[slnc 500]]
The rest were steps checking whether they applied, and finding they did not.
"""
rows = { pipeline = "active wrong" }
console = [
    ["24 visits, 15 did any work", "bad"],
]

[[act]]
title = "The slip"
summary = "The slip is written once per order: ORD-2 gets gift-wrap, ORD-3 age-check, ORD-4 customs."
detail = """
A slip writer looks at each order once, as it sets off, and lists the steps it
needs. ORD-1 needs validate, charge and pack. ORD-2, a gift, adds gift wrap.
ORD-3, age-restricted, adds an age check. ORD-4, going abroad, adds customs.
The list is stored in a header as endpoint addresses.
"""
speech = """
Second demo: the slip. [[slnc 400]] As each order sets off, the slip writer lists the steps it needs. [[slnc 600]]
Order one needs validate, charge and pack. [[slnc 300]] Order two is a gift, so it adds gift wrap. [[slnc 300]] Order three is age restricted, so it adds an age check. [[slnc 300]] Order four goes abroad, so it adds customs. [[slnc 600]]
The list travels with the order, in a header.
"""
rows = { writer = "active ok" }
console = [
    ["ORD-2: validate, charge, gift-wrap, pack", "ok"],
    ["ORD-4: validate, customs, charge, pack", "ok"],
]

[[act]]
title = "Camel follows the slip"
summary = "routingSlip(header(\"slip\")) makes 15 visits, all doing work; ORD-2 went validate, charge, gift-wrap, pack."
detail = """
`routingSlip(header("slip"))` sends each order to the steps on its slip, in
turn. The four orders now make fifteen visits, every one doing work. ORD-2
went validate, charge, gift wrap, pack. No step knows which step comes after
it.
"""
speech = """
Third demo: Camel follows the slip. [[slnc 400]] The routing slip step reads the header, and sends the order to each step in turn. [[slnc 600]]
Fifteen visits in all. [[slnc 300]] Every one doing work. [[slnc 500]]
And no step knows which step comes after it.
"""
rows = { slip = "active ok", steps = "active ok" }
console = [
    ["15 visits, 15 doing work", "ok"],
    ["ORD-2: validate, charge, gift-wrap, pack", "ok"],
]

[[act]]
title = "A new step"
summary = "A fraud-check rule for orders over £500 is added to the slip writer: ORD-4 now goes through fraud-check; no route or step changed."
detail = """
A fraud check is needed for orders over £500. One rule is added to the slip
writer. ORD-4, worth £640, now goes validate, customs, fraud check, charge,
pack. No route and no other step changed.
"""
speech = """
Fourth demo: a new step. [[slnc 400]] Orders over five hundred pounds need a fraud check. [[slnc 600]]
One rule is added, where slips are written. [[slnc 500]]
Order four now goes through the fraud check, before it is charged. [[slnc 300]] No route, and no other step, changed.
"""
rows = { writer = "active ok", steps = "active ok" }
console = [
    ["ORD-4: ... customs, fraud-check, charge ...", "ok"],
]

[[act]]
title = "The bill, and a dynamic router"
summary = "ORD-5 fails its age check: the slip stops with charge and pack unvisited; Camel's dynamicRouter() instead sends it to notify-customer."
detail = """
ORD-5's customer is too young. The age check fails, and the slip simply
stops, with charge and pack still on it; a slip cannot choose a new route
from what happened on the way. Camel's `dynamicRouter()` can: it decides each
next step as it goes, and sends ORD-5 from the failed age check to a
notify-customer step.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] Order five's customer is too young. [[slnc 300]] The age check fails. [[slnc 600]]
The slip just stops. [[slnc 300]] Charge and pack are still on it. [[slnc 300]] A slip cannot change course, because it was written at the start. [[slnc 600]]
Camel has a relative, the dynamic router. [[slnc 300]] It decides each next step as it goes. [[slnc 300]] It sends order five to a step that tells the customer why.
"""
rows = { slip = "active amber", steps = "active amber" }
console = [
    ["slip stops; still on it: charge, pack", "amber"],
    ["dynamicRouter: -> notify-customer", "ok"],
]

[animation]
subtitle = "Each order's steps are written into a slip; Camel follows the slip from step to step."
boxes = [
    ["pipeline", "Fixed pipeline", "every step, every order"],
    ["writer", "Slip writer", "lists the steps once"],
    ["slip", "routingSlip()", "follows the list"],
    ["steps", "Steps", "validate ... pack"],
]

[docs.problem]
scenario = """
Orders need different sets of steps: validate, age check, customs, charge,
gift wrap and pack.
"""
naive = """
One fixed pipeline makes every order visit every step, and every step check
whether it applies.
"""
deliver = [
    "A fixed pipeline with wasted visits.",
    "A slip written once per order.",
    "Camel's `routingSlip()` following it.",
    "A new step added as one rule.",
    "The fixed-at-start limit, and `dynamicRouter()` deciding on the way.",
    "Every printed result asserted by a test.",
]

[docs.prerequisites]
required = [
    "Java basics: records, lists.",
    "The Routing Slip idea, ideally from the plain Java version of this pattern.",
]
not_required = [
    "Docker or a broker. Camel runs in memory.",
]

[docs.dependencies]
intro = """
This project uses Apache Camel, which the plain Java version of Routing Slip
does not. Skipping it loses none of the pattern: the plain version teaches all
of it with nothing installed.
"""
what = [
    ["Apache Camel", "Camel is a library for moving messages. A route begins with from and lists steps. routingSlip reads a list of endpoint addresses, here from a header called slip, and sends the message to each in turn. dynamicRouter calls a method before every step; the method looks at the message and at the step just finished, and returns the next endpoint, or nothing to finish."],
]
why = """
The plain version shows the idea. This version shows how a routing library
carries a slip, and the tool it offers when the route must change on the way.
"""
install_note = "Only a JDK, version 21. Gradle downloads the rest, and the versions are pinned:"
versions = [
    ["Java", "21"],
    ["Apache Camel (core)", "4.22.1"],
    ["SLF4J simple", "2.0.17"],
]
costs = [
    "More than ten library files on the classpath.",
    "Endpoint names in strings, checked only when used.",
]

[docs.session]
objectives = [
    "Write a slip into a header and follow it with `routingSlip()`.",
    "Add a step by changing only the slip writer.",
    "Explain why a slip cannot change course.",
    "Use `dynamicRouter()` to decide steps on the way.",
]
walkthrough = """
Run `./gradlew run`. Compare act one's 24 visits with act three's 15. Open
`ShopRoutes`: the routing slip is two lines. End on act five's two routes for
ORD-5.
"""
exercises = [
    "Add a loyalty-points step for registered customers.",
    "Make the dynamic router send international orders to customs.",
    "Put a typo in one slip entry and read Camel's error.",
]

[docs.explained]
sentence = """
With Camel, a routing slip is a header listing each order's steps, and
`routingSlip()` sends the order through them in turn.
"""
verdict = """
Use a routing slip when messages need different steps, known at the start. When
the next step depends on what has just happened, use `dynamicRouter()` or a
process manager instead.
"""
recognise = [
    "`.routingSlip(header(\"...\"))`.",
    "A header holding comma-separated endpoint addresses.",
    "`.dynamicRouter(method(...))` returning the next endpoint.",
]

[spec]
purpose = """
Teach Routing Slip with Apache Camel: a fixed pipeline with wasted visits, a
slip written once per order, routingSlip() following it, a new step added as
one rule, and the fixed-at-start limit contrasted with dynamicRouter().
"""
nongoals = [
    "Not a real broker. Camel's direct endpoints run in memory.",
]
problem = """
Different orders need different steps; one fixed pipeline wastes work in
every step.
"""
roles = [
    ["The routes", "`ShopRoutes`"],
    ["Writes each slip", "`SlipWriter`"],
    ["The steps", "`Steps`"],
    ["Decides on the way", "`ShopRoutes.NextStep`"],
    ["Entry point", "`CamelRoutingSlipDemo`, five acts"],
]
requirements = [
    "**Only needed steps:** slip routing makes 15 visits, all useful.",
    "**One rule:** the fraud check is added in `SlipWriter` only.",
    "**Stops:** a failed age check leaves charge and pack unvisited.",
    "**Every printed result is asserted** in `DemoRunsTest`.",
]

