[[scene]]
key = "01-poster"
kind = "poster"
title = "Routing Slip with Apache Camel"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Routing Slip pattern, built with Apache Camel, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] A routing slip is a list of steps, written once, that travels with a message. [[slnc 300]] Each step does its job, and passes the message to the next step on the list. [[slnc 500]] Apache Camel is an open-source library for moving messages, and it follows slips for you. [[slnc 600]]
Think of a hospital treatment card. [[slnc 300]] Reception writes down the departments this patient must visit. [[slnc 300]] Each department does its part, and sends the patient to the next name on the card. [[slnc 700]]
In this video, the domain is an online shop's order processing. [[slnc 500]]
By the end, you will hear how Camel follows each order's slip. [[slnc 300]] How to add a step with one rule. [[slnc 300]] And what to use when the next step must be decided on the way.
"""

