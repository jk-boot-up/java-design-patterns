key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["Validate, age check, customs,", "charge, gift wrap, pack.", "", "Every order visited all six.", "", "24 visits, 15 useful."]
narration = """
Here is the scenario. [[slnc 400]] The shop has six steps. [[slnc 300]] Validate, age check, customs, charge, gift wrap, and pack. [[slnc 500]]
Every order visited all six. [[slnc 500]]
Four orders made twenty-four visits. [[slnc 300]] Only fifteen did any work.
"""

