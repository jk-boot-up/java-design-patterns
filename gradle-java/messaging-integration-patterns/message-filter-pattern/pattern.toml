[docs.session]
objectives = [
    "Explain why receivers on a shared channel get too much.",
    "Write a filter that keeps a receiver unaware of it.",
    "Chain filters.",
    "Decide what should happen to dropped messages.",
]
walkthrough = """
Run `./gradlew run` and read act one. Open `MessageFilter`: a rule, a next
step, a counter. Show that `Channel` and the receivers never mention filters.
End on act five: where should the dropped fifteen go?
"""
exercises = [
    "Send dropped messages to a discard channel and print them.",
    "Add a filter that only lets through each customer's first order of the day.",
    "Replace the two chained filters with one using `and`. What is lost?",
]

[docs.explained]
sentence = """
A message filter stands between a channel and a receiver and passes on only
the messages that match its rule, so the receiver sees only what it wants.
"""
verdict = """
Use filters to give receivers on a shared channel only what they need. Keep
each rule small, chain them for combinations, and always count or keep what
they drop.
"""
recognise = [
    "`filter(...)` steps in Camel routes, Spring Integration flows or Kafka Streams.",
    "Subscription filters on cloud topics.",
    "Wrappers around consumers that check a condition before passing on.",
]

[spec]
purpose = """
Teach Message Filter with an online store's orders channel: the gift-wrap
service opening 10 orders to wrap 2, then a gifts-only filter, chained
registered and over-£50 filters for loyalty, a raised threshold with no other
change, and 15 dropped messages kept nowhere.
"""
nongoals = [
    "Not a message broker. Channels are in memory.",
    "Not discard channels. They are an exercise.",
]
problem = """
On a shared channel every receiver gets every message, and each repeats its
own checks to ignore most of them.
"""
roles = [
    ["The pattern", "`MessageFilter`"],
    ["The channel", "`Channel`"],
    ["The messages", "`OrderEvent`"],
    ["The receivers", "`Services`"],
    ["Entry point", "`MessageFilterDemo`, five acts"],
]
requirements = [
    "**Invisible:** sender and receiver do not know about the filter.",
    "**Chainable:** filters compose.",
    "**Counted drops:** every filter counts what it drops.",
    "**Every printed result is asserted** in `DemoRunsTest`.",
]

