# pattern.toml for the Message Filter project. See tools/patternkit.

[project]
slug = "message-filter"
category = "messaging-integration-patterns"
title = "Message Filter"
package = "messagefilter"
main_class = "MessageFilterDemo"
tagline = "Only the messages you want"
bold = "Put a filter between a channel and a receiver that passes on only the messages matching its rule, so neither the sender nor the receiver has to know about it."
youtube_description = """Message Filter pattern in Java: a filter sits between the channel and one receiver and passes on only the messages that match its rule, without sender or receiver knowing, like an email spam filter. Explained with an online store that publishes every order on one channel while a gift-wrap service and a loyalty service each care about only some of them. We watch everything go to everyone, put a filter in front of each receiver, chain filters together, and change a rule. We finish with the bill: never lose track of what a filter drops."""
domain_note = ""
thumb_lines = ["MESSAGE", "FILTER"]
thumb_code = "new MessageFilter(gift, next)"
youtube_title = "Message Filter"
youtube_tags = ["message filter", "enterprise integration patterns", "publish subscribe", "messaging", "java"]

[readme]
intro = """
Message Filter is one of the Enterprise Integration Patterns. On a
publish-subscribe channel, every subscriber receives every message, even
the ones it does not care about. A message filter sits between the channel
and one receiver, checks each message against a rule, and passes on only the
ones that match. Everything else is dropped.

The sender keeps sending everything, the receiver sees only what it wants,
and the rule lives in one small, replaceable place. Filters can be chained to
combine rules.
"""
analogy = """
Think of the spam filter on your email. The world sends you everything; the
filter decides what reaches your inbox. Senders do not know it exists, and you
never have to open the junk. But a good spam filter does not delete mail: it
puts it in a spam folder, because sometimes the rule is wrong.
"""
scenario = """
Every order the online store takes is published on an orders channel. The
gift-wrap service only cares about gift orders, and the loyalty service only
about registered customers spending over £50. Both were handed every order and
had to open and ignore most of them, each repeating its own checks.
"""
costs = [
    "**Dropped means gone.** Fifteen messages were dropped across the demo's filters, and none was kept anywhere.",
    "**Silent mistakes.** A wrong rule drops real orders without any error.",
    "**Another hop.** Each filter is one more step every message passes through.",
]
too_much = """
When the receiver genuinely needs to see every message, a filter is pointless.
And when many receivers need very different subsets, a content-based router,
or separate channels per kind of message, may be clearer than many filters.
"""
met_before = [
    "Apache Camel's `filter` and Spring Integration's `<int:filter>`.",
    "Subscription filters in cloud messaging, such as SNS or Azure Service Bus.",
    "Kafka Streams' `filter` step.",
    "Email rules and spam filters.",
]
where = """
This project is in [messaging-integration-patterns](..), next to
[Content-Based Router](../content-based-router-pattern), which sends each
message to one of several places instead of keeping or dropping it, and
[Dead Letter Channel](../dead-letter-channel-pattern), a home for messages
that cannot be delivered.
"""

[[act]]
title = "Everything to everyone"
summary = "The gift-wrap service is handed 10 orders and wraps 2: 8 deliveries it had to open and ignore."
detail = """
`GiftWrapUnfiltered` subscribes to the orders channel and is handed all ten
orders. It checks each one and wraps the two gift orders, ORD-2 and ORD-4.
Eight deliveries were opened only to be ignored, and every other service
repeats checks of its own.
"""
speech = """
First demo: every service is handed every order. [[slnc 400]] Ten orders are published. [[slnc 300]] The gift-wrap service receives all ten. [[slnc 600]]
It opens each one, and checks: is this a gift? [[slnc 300]] Two are: orders two and four. [[slnc 500]]
Eight deliveries it had to open, and ignore. [[slnc 300]] And every other service repeats its own checks.
"""
rows = { channel = "active amber", gift = "active wrong" }
console = [
    ["handed 10 orders, wrapped ORD-2, ORD-4", "amber"],
    ["8 opened and ignored", "bad"],
]

[[act]]
title = "A filter"
summary = "A gifts-only filter in front of the gift-wrap service: it receives ORD-2 and ORD-4; 8 dropped."
detail = """
A `MessageFilter` with the rule "gift orders only" subscribes to the channel
in front of the gift-wrap service. The service receives exactly ORD-2 and
ORD-4; the filter dropped eight. Checkout still sends every order and knows
nothing about the filter.
"""
speech = """
Second demo: a message filter, in front of the gift-wrap service. [[slnc 400]] The filter has one rule: gift orders only. [[slnc 600]]
The gift-wrap service now receives exactly two orders. [[slnc 300]] The filter dropped the other eight. [[slnc 500]]
Checkout still sends every order. [[slnc 300]] It does not know the filter exists.
"""
rows = { channel = "active ok", filter = "active ok", gift = "active ok" }
console = [
    ["gift-wrap receives: ORD-2, ORD-4", "ok"],
    ["the filter dropped 8", "muted"],
]

[[act]]
title = "Chained filters"
summary = "Registered, then over £50: the loyalty service receives ORD-1, ORD-4 and ORD-6; 3 guests and 4 small orders dropped."
detail = """
Two filters are chained in front of the loyalty service: registered customers
only, then orders over £50. It receives ORD-1, ORD-4 and ORD-6. The first
filter dropped three guest orders, the second four orders under £50.
"""
speech = """
Third demo: filters can be chained. [[slnc 400]] The loyalty service wants registered customers only. [[slnc 300]] And only orders over fifty pounds. [[slnc 600]]
Two filters, one after the other. [[slnc 300]] The first drops three guest orders. [[slnc 300]] The second drops four small orders. [[slnc 500]]
The loyalty service receives orders one, four, and six.
"""
rows = { filter = "active ok", filter2 = "active ok", loyalty = "active ok" }
console = [
    ["loyalty receives: ORD-1, ORD-4, ORD-6", "ok"],
    ["dropped: 3 guests, then 4 under £50", "muted"],
]

[[act]]
title = "A changed rule"
summary = "Raising the threshold to £60 leaves ORD-1 and ORD-4; checkout and the loyalty service are unchanged."
detail = """
The bonus threshold rises to £60. Only the filter's rule changes; now the
loyalty service receives ORD-1 and ORD-4. Checkout and the loyalty service
were not touched.
"""
speech = """
Fourth demo: the rule changes, and nothing else does. [[slnc 400]] The bonus threshold rises to sixty pounds. [[slnc 500]]
Only the filter's rule changes. [[slnc 300]] The loyalty service now receives orders one and four. [[slnc 500]]
Checkout and the loyalty service were not changed.
"""
rows = { filter2 = "active amber", loyalty = "active ok" }
console = [
    ["over £60: ORD-1, ORD-4", "ok"],
    ["sender and receiver unchanged", "ok"],
]

[[act]]
title = "The bill"
summary = "15 messages were dropped across the filters and none was kept; a wrong rule would drop orders silently."
detail = """
Across the filters in this demo, fifteen messages were dropped and none was
kept anywhere. If a rule is wrong, real orders vanish without an error. Count
the drops, or send dropped messages to a discard channel, like a spam folder.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] A dropped message is gone. [[slnc 300]] Fifteen messages were dropped by the filters in this demo. [[slnc 300]] None was kept anywhere. [[slnc 600]]
If a rule is wrong, real orders vanish, with no error. [[slnc 500]]
So count the drops, or send them somewhere to be checked, like a spam folder.
"""
rows = { filter = "active amber", filter2 = "active amber" }
console = [
    ["15 messages dropped, none kept", "amber"],
    ["count them, or keep them somewhere", "amber"],
]

