# pattern.toml for the Polling Consumer with RabbitMQ project. See tools/patternkit.

[project]
slug = "polling-consumer-with-rabbitmq"
category = "messaging-integration-patterns"
title = "Polling Consumer with RabbitMQ"
package = "pollingrabbit"
main_class = "RabbitPollingConsumerDemo"
tagline = "basicGet when ready, or push with a limit"
bold = "Let the label printer take orders from a real RabbitMQ queue only when it is ready, by polling with basicGet, and compare it with RabbitMQ's own answer: push with a prefetch limit."
domain_note = ""
thumb_lines = ["POLLING CONSUMER", "WITH RABBITMQ"]
thumb_code = "basicGet vs basicQos(5)"
youtube_title = "Polling Consumer with RabbitMQ"
youtube_tags = ["polling consumer", "rabbitmq", "basicget", "prefetch", "backpressure", "java"]

[readme]
intro = """
This is the real-infrastructure version of the Polling Consumer pattern. The
plain Java version, a separate project in this category, simulates a queue
and ticks of a clock. Here a real RabbitMQ broker, started in a container by
the demo itself, holds the orders.

RabbitMQ can hand messages to a receiver in two ways. It can push them as fast
as it can, which is `basicConsume`, or the receiver can ask for one at a time,
which is `basicGet`: the polling consumer. The demo shows both, the cost of
each, and RabbitMQ's own middle way: push, but with a prefetch limit, so the
broker never hands over more than the receiver can hold.
"""
analogy = """
Think of a busy restaurant kitchen. A waiter could keep shoving every order
through the hatch as it comes, until the rail overflows. Or the chef could walk
out and ask for the next order when ready, which means many wasted trips when
the dining room is empty. Most kitchens do something in between: the waiter
keeps a few tickets on the rail, and adds one each time the chef finishes one.
"""
scenario = """
The online store's warehouse label printer prints a label for each order. Its
memory holds only ten jobs. During a sale, fifty orders arrive in a burst,
and when the printer runs out of paper it must stop taking work without any
orders being lost.
"""
test_note = """
Every number the demo prints is asserted against a real broker. Waits are
bounded polls on real conditions, never fixed sleeps. Without a container
runtime, the broker test is skipped rather than failed.
"""
run_note = """
This project needs a running container runtime, such as Docker Desktop: the
demo starts a real RabbitMQ 4.3.6 broker in a container and removes it again.
Without one, it prints a sentence saying what to start, rather than failing.
"""
twin = """
The plain Java version got the idea right: a consumer that asks when it is
ready is never overwhelmed, pausing is simply not asking, and polling a quiet
queue wastes requests while a slow poll adds waiting. What it left out is how a
real broker behaves. Without a limit, RabbitMQ pushed all fifty orders into
the printer's memory at once, and would have sent all fifty again after a
crash. Every empty `basicGet` is a real request to the broker. And RabbitMQ
has a better middle way than long polling: push with a prefetch limit, so the
receiver holds at most a set number and the broker waits for acknowledgements
before sending more.
"""
technologies = [
    ["RabbitMQ", "4.3.6 (container image)", "the broker: basicGet, basicConsume and prefetch"],
    ["RabbitMQ Java client", "5.36.0", "polling, consuming and acknowledging"],
    ["Testcontainers", "2.0.5", "starts and stops the broker container from the demo"],
    ["Docker", "24 or later", "runs the container"],
    ["SLF4J simple", "2.0.17", "library logging, switched off"],
]
costs = [
    "**Waiting between polls.** An order that arrives just after a poll waits a whole interval.",
    "**Empty requests.** A quiet minute of polling every tenth of a second was 600 empty requests to the broker.",
    "**Prefetch is a tuning knob.** Too low and the receiver idles between deliveries; too high and it is back to being flooded.",
]
too_much = """
If the receiver can always keep up, plain push is simplest. Polling pays off
when the receiver must control exactly when it takes work; for most
receivers, push with a prefetch limit gives the same protection with less
waste.
"""
met_before = [
    "RabbitMQ `basicGet` and `basicQos` prefetch.",
    "Amazon SQS `ReceiveMessage` with long polling.",
    "Kafka consumers, which always poll, with `max.poll.records`.",
]
where = """
This project is in [messaging-integration-patterns](..). It is the
real-infrastructure version of the plain Java Polling Consumer project in the
same category, which is left unchanged.
"""

[[act]]
title = "Push with no limit"
summary = "RabbitMQ pushes all 50 orders into the printer's memory at once; after a crash all 50 are back on the queue."
detail = """
The printer subscribes with no prefetch limit. A burst of fifty orders
arrives, and RabbitMQ pushes all fifty into the printer's memory at once,
although its buffer holds ten. When the printer crashes, all fifty,
unacknowledged, go back on the queue to be sent again.
"""
speech = """
First demo: RabbitMQ pushes orders at the printer, with no limit. [[slnc 400]] A burst of fifty orders arrives. [[slnc 600]]
The broker pushes all fifty into the printer's memory, at once. [[slnc 300]] Its buffer holds ten. [[slnc 600]]
The printer crashes. [[slnc 300]] All fifty go back on the queue, to be sent again.
"""
rows = { broker = "active amber", printer = "active wrong" }
console = [
    ["pushed 50 at once", "bad"],
    ["after the crash: 50 back on the queue", "amber"],
]

[[act]]
title = "A polling consumer"
summary = "The printer polls with basicGet, up to 5 each tick: 50 of 50 printed in 10 ticks, never more than 5 in hand."
detail = """
Now the printer polls: each tick, it asks the broker for up to five orders
with `basicGet`, prints them and acknowledges each. Fifty orders are printed
in ten ticks, and it never holds more than five.
"""
speech = """
Second demo: a polling consumer. [[slnc 400]] Each tick, the printer asks the broker for up to five orders. [[slnc 600]]
It prints them, and acknowledges each one. [[slnc 500]]
Fifty orders, in ten ticks. [[slnc 300]] Never more than five in hand.
"""
rows = { broker = "active ok", printer = "active ok" }
console = [
    ["50 of 50 in 10 ticks", "ok"],
    ["never more than 5 in hand", "ok"],
]

[[act]]
title = "Pausing is not polling"
summary = "Paper runs out after one tick: 5 printed, 15 safely waiting on the queue; once paper is loaded, 20 of 20 printed."
detail = """
Twenty more orders arrive. After one tick the paper runs out, so the printer
stops polling: five are printed and fifteen wait safely on the queue. When
paper is loaded and polling resumes, all twenty are printed and none is lost.
"""
speech = """
Third demo: pausing is simply not polling. [[slnc 400]] Twenty orders arrive. [[slnc 300]] After one tick, the paper runs out. [[slnc 600]]
The printer stops asking. [[slnc 300]] Five printed. [[slnc 300]] Fifteen wait safely on the queue. [[slnc 500]]
Paper is loaded. [[slnc 300]] Polling resumes. [[slnc 300]] Twenty of twenty, none lost.
"""
rows = { broker = "active ok", printer = "active amber" }
console = [
    ["out of paper: printed 5, waiting 15", "amber"],
    ["resumed: 20 of 20", "ok"],
]

[[act]]
title = "When nothing is happening"
summary = "A quiet minute polled every 0.1 s is 600 empty requests; push with prefetch 5 holds 5 and costs no requests when quiet."
detail = """
In a quiet minute, polling every tenth of a second makes six hundred requests
to the broker, all empty. RabbitMQ's middle way is push with a prefetch limit:
with a limit of five, the printer holds five of the twenty orders waiting, and
the broker sends more only as it acknowledges. A quiet queue then costs no
requests at all.
"""
speech = """
Fourth demo: when nothing is happening. [[slnc 400]] A quiet minute, asking every tenth of a second. [[slnc 300]] Six hundred requests to the broker. [[slnc 300]] All empty. [[slnc 600]]
RabbitMQ has a middle way. [[slnc 300]] Push, but with a limit, called prefetch. [[slnc 500]]
With a limit of five, the printer holds five orders. [[slnc 300]] The broker sends more only as it finishes them. [[slnc 500]]
And a quiet queue costs no requests at all.
"""
rows = { broker = "active ok", printer = "active ok" }
console = [
    ["600 empty polls in a quiet minute", "bad"],
    ["prefetch 5: holds 5, no empty requests", "ok"],
]

[[act]]
title = "The bill"
summary = "With polling, an order can wait a whole interval, and every empty poll is a request; RabbitMQ advises consuming with a prefetch limit."
detail = """
With polling, an order that arrives just after a poll waits a whole interval,
and every empty poll is a request to the broker. RabbitMQ's own advice is to
consume with a prefetch limit, keeping `basicGet` for the cases where the
receiver must control exactly when it takes work.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] With polling, an order that arrives just after a poll waits a whole interval. [[slnc 500]]
And every empty poll is a request to the broker. [[slnc 600]]
RabbitMQ's own advice is to push with a prefetch limit. [[slnc 300]] Keep polling for when the receiver must decide exactly when to take work.
"""
rows = { printer = "active amber" }
console = [
    ["waits up to one interval", "amber"],
    ["prefer push with prefetch", "ok"],
]

