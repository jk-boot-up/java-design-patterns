    "Unlimited push flooding the printer.",
    "Polling with `basicGet`, five per tick.",
    "Pausing by not polling, with nothing lost.",
    "Empty polls counted, and push with prefetch as the middle way.",
    "The costs named.",
    "Every printed result asserted by a test, skipped without Docker.",
]

[docs.prerequisites]
required = [
    "Java basics: lists, loops.",
    "The Polling Consumer idea, ideally from the plain Java version of this pattern.",
]
not_required = [
    "Earlier RabbitMQ experience. The dependencies page explains the words used.",
]
install = [
    "A running container runtime such as Docker Desktop. The demo starts and removes RabbitMQ itself.",
]

[docs.dependencies]
intro = """
This project uses a real RabbitMQ broker, run in a container by
Testcontainers, which the plain Java version of Polling Consumer does not.
Skipping it loses none of the pattern: the plain version teaches all of it
with nothing installed.
"""
what = [
    ["RabbitMQ", "RabbitMQ is a message broker: a separate program that holds messages on queues. basicGet asks for one message now, and gets nothing if the queue is empty: that is polling. basicConsume asks the broker to push messages as they arrive. basicQos sets the prefetch: the most unacknowledged messages the broker will push to one receiver; zero means no limit. An acknowledgement tells the broker a message is finished; unacknowledged messages go back on the queue if the receiver disappears."],
    ["Testcontainers", "Testcontainers is a Java library that starts a container, here the RabbitMQ image, from inside a program, and removes it afterwards."],
]
why = """
The plain version shows the idea. This version shows what a real broker does
when it is allowed to push without a limit, what each poll costs, and the
limit RabbitMQ offers instead.
"""
versions = [
    ["Java", "21"],
    ["Docker", "running; 24 or later"],
    ["RabbitMQ image", "rabbitmq:4.3.6"],
    ["RabbitMQ Java client", "5.36.0"],
    ["Testcontainers", "2.0.5"],
]
costs = [
    "A container runtime, and a first run that downloads the broker image.",
    "A prefetch value to choose and tune.",
]

[docs.session]
objectives = [
    "Poll a queue with `basicGet` and acknowledge each message.",
    "Explain what unlimited push does to a slow receiver.",
    "Use `basicQos` to push with a limit.",
    "Weigh polling intervals against empty requests.",
]
walkthrough = """
Run `./gradlew run` with Docker running. Compare act one's 50 in hand with act
two's 5. Open `LabelPrinter`: `poll` and `subscribe`. End on act four's 600
empty polls and the prefetch of 5.
"""
exercises = [
    "Try prefetch 1 and prefetch 50, and describe the difference.",
    "Poll every second instead of every tenth, and count the empty polls.",
    "Replace the polling loop with Spring AMQP's `receive()`.",
]

[docs.explained]
sentence = """
With RabbitMQ, a polling consumer asks for messages with `basicGet` when it is
ready; push with a prefetch limit gives the same protection with less waste.
"""
verdict = """
Poll when the receiver must decide exactly when to take work. Otherwise
consume with a prefetch limit, sized to what the receiver can hold.
"""
recognise = [
    "`channel.basicGet(queue, false)` in a loop.",
    "`channel.basicQos(n)` before `basicConsume`.",
    "Scheduled jobs that drain a queue.",
]

[spec]
purpose = """
Teach Polling Consumer with a real RabbitMQ broker: unlimited push flooding a
label printer, polling with basicGet, pausing by not polling, empty polls
counted, and push with prefetch as RabbitMQ's middle way.
"""
nongoals = [
    "Not real time. Ticks are loop iterations, not a clock.",
]
problem = """
A receiver pushed more work than it can hold is overwhelmed, and loses it on a
crash.
"""
roles = [
    ["The broker in a container", "`Broker`"],
    ["The receiver", "`LabelPrinter`"],
    ["The sender", "`Orders`"],
    ["Waiting for real conditions", "`Poll`"],
    ["Entry point", "`RabbitPollingConsumerDemo`, five acts"],
]
requirements = [
    "**Bounded:** polling never holds more than five.",
    "**Nothing lost:** a pause leaves orders on the queue.",
    "**Limited push:** prefetch 5 holds exactly five.",
    "**No Docker, no crash:** without a runtime the demo prints advice.",
]

