plugins {
    id 'java'
    id 'application'
}

group = 'com.jk.explore'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // The RabbitMQ Java client 5.36.0: publishing, publisher confirms, consuming and acknowledging.
    implementation 'com.rabbitmq:amqp-client:5.36.0'

    // Testcontainers 2.0.5 starts and stops the RabbitMQ container for the demo itself.
    implementation 'org.testcontainers:testcontainers-rabbitmq:2.0.5'

    // The client and Testcontainers log through SLF4J; the simple binding is switched off.
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.17'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.jk.explore.pollingrabbit.RabbitPollingConsumerDemo'
}

test {
    useJUnitPlatform()
}
