narration = """
Here is who does what. [[slnc 400]] The queue holds the orders. [[slnc 500]]
The polling consumer asks the queue for up to five, each tick, and can be paused. [[slnc 500]]
The label printer prints. [[slnc 300]] And pushing at the printer is the old way, kept for comparison.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Kafka consumer poll()", "Amazon SQS long polling", "Spring Integration pollers", "Checking email with IMAP"]
narration = """
You have probably met this pattern already. [[slnc 400]] Kafka consumers call poll, in a loop. [[slnc 500]]
Amazon's simple queue service offers long polling. [[slnc 300]] Spring Integration has pollers. [[slnc 500]]
And an email program that checks for new mail every few minutes is a polling consumer.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["The consumer must set its pace,", "handle bursts, or pause safely.", "", "Take only what you can handle.", "Use long polling."]
narration = """
So, when should you use it? [[slnc 400]] When a consumer must set its own pace, handle bursts, or pause safely. [[slnc 500]]
Take only what you can handle. [[slnc 300]] Use long polling to avoid empty requests. [[slnc 500]]
And accept that a message may wait a little, for the next poll.
"""

