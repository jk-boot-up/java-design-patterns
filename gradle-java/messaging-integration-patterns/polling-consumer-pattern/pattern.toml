narration = """
Here is the scenario. [[slnc 400]] The warehouse label printer prints five labels every tenth of a second. [[slnc 300]] It can hold ten jobs waiting. [[slnc 600]]
Orders arrive in bursts. [[slnc 300]] And each order was pushed straight at the printer, the moment it arrived.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["Messages wait in a queue.", "", "When ready, the consumer asks", "for as many as it can handle.", "", "Pausing is simply not asking."]
narration = """
Let's name the pattern. [[slnc 400]] Messages wait in a queue. [[slnc 500]]
When the consumer is ready, it asks for as many as it can handle. [[slnc 300]] No more. [[slnc 500]]
And to pause, the consumer simply stops asking. [[slnc 300]] Nothing is lost.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
