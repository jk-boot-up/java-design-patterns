narration = """
Hello, and welcome. [[slnc 400]] This video explains the Polling Consumer pattern, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] A polling consumer decides when to take messages. [[slnc 300]] Each time it is ready, it asks the queue for as many as it can handle. [[slnc 300]] Everything else waits safely in the queue. [[slnc 600]]
Think of a post office box, instead of home delivery. [[slnc 300]] Nobody rings your doorbell while you are in the shower. [[slnc 300]] Letters wait in the box until you go and collect them. [[slnc 700]]
In this video, the domain is an online shop's warehouse. [[slnc 300]] Its label printer can only print so fast, and orders arrive in bursts. [[slnc 500]]
By the end, you will hear what happens when orders are pushed at the printer. [[slnc 300]] How polling fixes it. [[slnc 300]] How to pause safely. [[slnc 300]] And how often to ask.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
