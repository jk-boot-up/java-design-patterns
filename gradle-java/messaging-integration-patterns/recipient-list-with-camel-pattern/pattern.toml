after = { code = "recipientList(method(table))", note = "only where needed: 10", tag = "AFTER" }
taglines = [["Only where it is needed", "gold"]]

[[scene]]
key = "01-poster"
kind = "poster"
title = "Recipient List with Apache Camel"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Recipient List pattern, built with Apache Camel, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] A recipient list works out, for each message, who should get it. [[slnc 300]] Then sends a copy to each of them, and to nobody else. [[slnc 500]] Apache Camel is an open-source library for moving messages, and it has this step built in. [[slnc 600]]
Think of an office clerk who writes on each letter the names of the people it concerns. [[slnc 300]] The post room makes one copy per name. [[slnc 700]]
In this video, the domain is an online shop, sending orders to its warehouses. [[slnc 500]]
By the end, you will hear how Camel sends each order only where it is needed. [[slnc 300]] How rules add recipients. [[slnc 300]] And what happens when one recipient fails.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["Orders went to every warehouse.", "", "5 orders x 4 warehouses", "= 20 deliveries.", "", "Most were useless."]
narration = """
Here is the scenario. [[slnc 400]] The shop sent every order to every warehouse. [[slnc 500]]
Five orders, four warehouses. [[slnc 300]] Twenty deliveries. [[slnc 500]]
Most of them for items that warehouse did not even stock.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern, in Camel"
body = ["recipientList() asks a table", "for each message.", "", "The table returns addresses.", "", "Camel sends one copy to each."]
narration = """
Let's name the pattern, in Camel's words. [[slnc 400]] The recipient list step asks a routing table, for each message. [[slnc 500]]
The table returns a list of addresses. [[slnc 500]]
And Camel sends one copy to each address.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["ShopRoutes: the routes", "RoutingTable: who gets what", "Warehouses: the destinations", "Order: the message"]
narration = """
Here is who does what. [[slnc 400]] Shop routes holds the routes. [[slnc 500]]
The routing table decides who gets each order. [[slnc 300]] That part is plain Java, because it is the shop's business. [[slnc 500]]
The warehouses are the destinations. [[slnc 300]] And the order is the message.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Camel recipientList()", "Spring Integration routers", "Email To and Cc", "Warehouse order splitting"]
narration = """
You have probably met this already. [[slnc 400]] Camel's recipient list, and Spring Integration's recipient list router. [[slnc 500]]
The To and Cc lines of an email, chosen for each message. [[slnc 500]]
And order systems that split each order across warehouses.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Who needs a message depends", "on what is in it.", "", "Keep the table in plain code.", "Plan for a failed recipient."]
narration = """
So, when should you use it? [[slnc 400]] When who needs a message depends on what is in it. [[slnc 500]]
Keep the routing table in plain code. [[slnc 300]] And decide in advance what happens when one recipient fails.
"""

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Send failed", "copies to a retry route."]
narration = """
That's the Recipient List, with Apache Camel. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Work out who needs each message, and send it only to them. [[slnc 500]]
The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs offline, with nothing installed except a Java development kit. [[slnc 500]]
