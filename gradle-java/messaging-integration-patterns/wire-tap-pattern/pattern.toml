# pattern.toml for the Wire Tap project. See tools/patternkit.

[project]
slug = "wire-tap"
category = "messaging-integration-patterns"
title = "Wire Tap"
package = "wiretap"
main_class = "WireTapDemo"
tagline = "See the traffic without touching it"
bold = "Attach a tap to a channel that sends a copy of every message to a second listener, such as an audit log, while the real message carries on untouched."
youtube_description = """Wire Tap pattern in Java, explained with an online store checkout that sends charges and refunds to the payment service. A wire tap attached to a channel sends a copy of every message to a second listener, such as an audit log, while the real message carries on untouched, like a call recorded for training that pauses when a card number is read out. We see why typing logging into services goes wrong, add a wire tap, attach and detach it while running, and add a second tap. We finish with the bill: watch the traffic from the channel, never from inside the services."""
domain_note = ""
thumb_lines = ["WIRE TAP"]
thumb_code = "channel.attach(audit)"
youtube_title = "Wire Tap"
youtube_tags = ["wire tap", "enterprise integration patterns", "auditing", "monitoring", "messaging", "java"]

[readme]
intro = """
Wire Tap is one of the Enterprise Integration Patterns. To see what is
flowing through a channel (for auditing, debugging or a dashboard) you attach
a tap to the channel itself. Every message is still delivered to its real
destination, and a copy goes to the tap's listener. Neither the sender nor the
receiver is changed, and taps can be attached and detached while the system
runs.

The copies must be treated with care: a tap sees everything, including
sensitive data, and a slow tap must not slow down the real traffic.
"""
analogy = """
Think of "calls may be recorded for training purposes". The customer and the
agent talk exactly as they would anyway; a recorder quietly keeps a copy.
Recording can be switched on and off without changing how anyone speaks. And
when the customer reads out their card number, the recording is paused,
because the copy must not keep what it has no business keeping.
"""
scenario = """
The online store's checkout sends payment messages (charges and refunds) to
the payment service. To investigate a disputed refund, someone typed logging
into the payment service's charge code. The refund path never got any, and the
log that did exist was full of complete card numbers.
"""
costs = [
    "**A tap sees everything.** Card numbers must be masked before anything is copied.",
    "**A slow tap slows the real traffic.** A 100 ms tap made four payments take over 0.4 seconds, until it ran on its own thread.",
    "**More copies to store.** Audit logs grow, and must be kept safe and eventually deleted.",
]
too_much = """
When you only need a count or a timing, a metric in the channel itself is
lighter than copying whole messages. And for occasional debugging on a
developer's laptop, a breakpoint is simpler than a tap.
"""
met_before = [
    "Apache Camel's `wireTap` and Spring Integration's `wire-tap` interceptor.",
    "Kafka consumers in a separate group that read a topic for auditing.",
    "Network port mirroring for monitoring tools.",
    "Call recording in customer service centres.",
]
where = """
This project is in [messaging-integration-patterns](..), next to
[Message Channel](../message-channel-pattern), the channel a tap is attached
to, and [Message Filter](../message-filter-pattern).
"""

[[act]]
title = "Logging typed in by hand"
summary = "Logging was added to the payment service's charge path only: 4 messages sent, 3 logged, with full card numbers."
detail = """
Someone added logging inside `PaymentService`'s charge path. Four messages
are sent; three are logged, because the refund path has no logging. And the
log lines contain complete card numbers.
"""
speech = """
First demo: logging typed into the payment service, by hand. [[slnc 400]] Four payment messages are sent. [[slnc 300]] Three charges, and one refund. [[slnc 600]]
Only three appear in the log. [[slnc 300]] Nobody added logging to the refund code. [[slnc 500]]
And the lines that are there show the full card number.
"""
rows = { payment = "active wrong", checkout = "active ok" }
console = [
    ["4 messages sent, 3 in the log", "bad"],
    ["... card 4929123412341234", "bad"],
]

[[act]]
title = "A wire tap"
summary = "An audit tap on the channel copies all 4 messages with masked cards; payment handles all 4; neither service changed."
detail = """
An `AuditLog` is attached to the channel as a wire tap. Every message, charge
or refund, is copied to it with the card masked to its last four digits, and
the payment service handles all four as before. Neither checkout nor the
payment service was changed.
"""
speech = """
Second demo: a wire tap, on the channel itself. [[slnc 400]] An audit log is attached to the channel. [[slnc 300]] Every message is copied to it, charges and refunds alike. [[slnc 600]]
The copies show only the last four digits of each card. [[slnc 500]]
The payment service handles all four messages, exactly as before. [[slnc 300]] Neither service was changed.
"""
rows = { channel = "active ok", audit = "active ok", payment = "active ok" }
console = [
    ["audit: CHARGE ORD-1 £63.44 **** 1234", "ok"],
    ["audit: REFUND ORD-1 £30.00 **** 1234", "ok"],
    ["4 of 4 copied; nothing changed", "ok"],
]

[[act]]
title = "Attach and detach"
summary = "The tap is detached after the investigation; ORD-4 flows as normal and the audit keeps its 4 lines."
detail = """
When the investigation is over, the tap is detached. ORD-4 flows through as
normal, and the audit log still holds its four lines. Taps come and go
without touching the services.
"""
speech = """
Third demo: attach while investigating, detach afterwards. [[slnc 400]] The investigation is over. [[slnc 300]] The tap is detached. [[slnc 500]]
Order four flows through, exactly as normal. [[slnc 300]] The audit log still holds its four lines.
"""
rows = { channel = "active ok", audit = "active amber" }
console = [
    ["tap detached", "muted"],
    ["ORD-4 flows as normal", "ok"],
]

[[act]]
title = "A second tap"
summary = "A sales meter tapped onto the channel shows net takings of £58.42."
detail = """
A second kind of tap, `SalesMeter`, adds up charges and subtracts refunds for
a dashboard. It sees the same traffic and reports net takings of £58.42.
"""
speech = """
Fourth demo: a second tap, for a sales dashboard. [[slnc 400]] It adds up the charges, and takes off the refunds. [[slnc 500]]
Net takings: fifty-eight pounds forty-two. [[slnc 300]] Again, no service changed.
"""
rows = { meter = "active ok", channel = "active ok" }
console = [
    ["net takings: £58.42", "ok"],
]

[[act]]
title = "The bill"
summary = "A 100 ms tap makes 4 payments take over 0.4 s; on its own thread, under 0.05 s. Mask everything a tap copies."
detail = """
Taps run in the channel's path. A tap that takes 100 milliseconds per copy,
such as one writing to a remote log, makes four payments take over 0.4
seconds. Run on its own thread, the same tap costs the payments under 0.05
seconds. And a tap sees everything, so sensitive data must be masked before
it is copied.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] A tap that takes a tenth of a second per copy slows the real payments. [[slnc 300]] Four payments take over four tenths of a second. [[slnc 600]]
Run the same tap on its own thread, and the payments take under five hundredths of a second. [[slnc 600]]
And a tap sees everything. [[slnc 300]] Mask card numbers, before anything is copied.
"""
rows = { audit = "active wrong", channel = "active amber" }
console = [
    ["slow tap: 4 payments over 0.4 s", "bad"],
    ["on its own thread: under 0.05 s", "ok"],
    ["mask before copying", "amber"],
]

[animation]
subtitle = "Payment messages flow from checkout to payment; taps on the channel copy each one for an audit log and a sales meter."
boxes = [
    ["checkout", "Checkout", "sends payments"],
    ["channel", "Channel", "with taps attached"],
    ["payment", "Payment service", "charges, refunds"],
    ["audit", "Audit log", "copies, cards masked"],
    ["meter", "Sales meter", "net takings"],
]

[docs.problem]
scenario = """
Checkout sends charge and refund messages to the payment service, and someone
needs to see them to investigate a disputed refund.
"""
naive = """
Logging typed into the payment service's charge path misses refunds and
records full card numbers.
"""
deliver = [
    "Hand-added logging shown missing a message and exposing cards.",
    "An audit tap copying every message with masked cards.",
    "A tap detached with no change to the flow.",
    "A second tap feeding a sales meter.",
    "A slow tap measured, and fixed with its own thread.",
    "Every printed result asserted by a test.",
]

[docs.prerequisites]
required = [
    "Java basics: records, lambdas, `Consumer`.",
]
not_required = [
    "A message broker. The channel is a small class.",
]

[docs.session]
objectives = [
    "Explain why observing traffic should not mean editing services.",
    "Attach and detach a tap.",
    "Mask sensitive fields in copies.",
    "Keep a slow tap off the main path.",
]
walkthrough = """
Run `./gradlew run` and read act one: a missing message and a full card
number. Open `Channel.send`: taps first, then the destination. End on act
five and compare the two timings.
"""
exercises = [
    "Make the audit tap write to a file, on its own thread.",
    "Add a tap that only copies refunds over £20.",
    "Mask the order ID too, and decide whether that makes the audit useless.",
]

[docs.explained]
sentence = """
A wire tap copies every message on a channel to a second listener, while the
original is delivered unchanged, so traffic can be observed without touching
senders or receivers.
"""
verdict = """
Use wire taps for auditing, debugging and dashboards. Mask sensitive data
before copying, run slow taps on their own thread, and detach taps you no
longer need.
"""
recognise = [
    "`wireTap(...)` in Camel routes or interceptors in Spring Integration.",
    "A separate consumer group reading a topic for auditing.",
    "Audit logs that are fed from the messaging layer, not from services.",
]

[spec]
purpose = """
Teach Wire Tap with an online store's payment messages: hand-added logging
missing a refund and exposing cards, then an audit tap copying 4 of 4 with
masked cards, a tap detached, a sales meter tap (£58.42), and a slow tap
slowing payments until it runs on its own thread.
"""
nongoals = [
    "Not a real payment system or card storage.",
    "Not log shipping. The audit log is a list.",
]
problem = """
Adding logging to services by hand to see their messages changes them, misses
paths, and copies sensitive data.
"""
roles = [
    ["The channel", "`Channel` (`attach`, `detach`)"],
    ["The taps", "`WireTaps.AuditLog`, `SalesMeter`, `Async`"],
    ["The receiver", "`PaymentService`"],
    ["The messages", "`PaymentMessage`"],
    ["Entry point", "`WireTapDemo`, five acts"],
]
requirements = [
    "**Untouched flow:** the destination handles every message as before.",
    "**Every message copied:** 4 of 4.",
    "**Masked:** cards show only the last four digits.",
    "**Off the main path:** an async tap does not slow payments.",
    "**Every printed result is asserted** in `DemoRunsTest`.",
]

