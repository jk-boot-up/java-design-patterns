[[scene]]
key = "01-poster"
kind = "poster"
title = "Content Enricher"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Content Enricher pattern, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] A content enricher takes a message that is missing some details. [[slnc 300]] It looks those details up once, adds them to the message, and passes the fuller message on. [[slnc 300]] So the receivers never have to look anything up themselves. [[slnc 600]]
Think of a post office sorting room. [[slnc 300]] A letter arrives with only a family name and a street. [[slnc 300]] A clerk finds the house number and the postcode in the directory, writes them on the envelope, and sends it on. [[slnc 300]] The postman who delivers it never needs the directory. [[slnc 700]]
In this video, the domain is an online shop. [[slnc 300]] When a customer pays, checkout sends a message saying an order was placed. [[slnc 300]] A warehouse packs the parcel, and an email service sends a confirmation. [[slnc 500]]
By the end, you will hear why a thin message makes every receiver do extra work. [[slnc 300]] How one enricher in the middle fixes it. [[slnc 300]] What to do with an order that cannot be filled in. [[slnc 300]] And what the pattern costs.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["Checkout sends: order, items,", "and a customer ID. Nothing else.", "", "The warehouse needs an address.", "The email service needs a name.", "", "Who fills in the gaps?"]
narration = """
Here is the scenario. [[slnc 400]] When a customer pays, checkout sends a short message. [[slnc 300]] It holds the order number, the items, and a customer ID. [[slnc 300]] An ID is just a short code that points to a customer, like C 17. [[slnc 600]]
Two services receive the message. [[slnc 300]] The warehouse needs the delivery address. [[slnc 300]] The email service needs the customer's name. [[slnc 500]]
Neither is in the message. [[slnc 300]] So who fills in the gaps?
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["Put one step between the sender", "and the receivers.", "", "It looks the details up once,", "adds them to the message,", "and passes it on."]
narration = """
Let's name the pattern. [[slnc 400]] Put one step in the middle, between the sender and the receivers. [[slnc 500]]
That step takes the thin message. [[slnc 300]] It looks up the missing details, once. [[slnc 300]] It adds them to the message. [[slnc 300]] And it passes the fuller message on. [[slnc 500]]
That step is the content enricher. [[slnc 300]] The receivers only read.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["OrderPlaced: the thin message", "CustomerDirectory: the customer service", "ContentEnricher: adds the details", "EnrichedOrder: the full message", "Warehouse, Email: only read"]
narration = """
Here is who does what. [[slnc 400]] Order placed is the thin message from checkout. [[slnc 300]] The customer directory stands in for the customer service. [[slnc 300]] It knows every customer's name, address and loyalty tier. [[slnc 500]]
The content enricher asks the directory, and builds an enriched order. [[slnc 300]] That is the same order, with the customer's details added. [[slnc 500]]
The warehouse and the email service only read the enriched order. [[slnc 300]] They never call the customer service at all.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Apache Camel: enrich()", "Spring Integration: enricher", "Kafka Streams: join orders", "with a customer table", "API gateways adding user details"]
narration = """
You have probably met this pattern already. [[slnc 400]] Apache Camel has a step called enrich. [[slnc 300]] Spring Integration has an enricher. [[slnc 500]]
In Kafka Streams, joining a stream of orders with a table of customers is the same idea. [[slnc 500]]
And an API gateway that adds a user's details to each request, after checking their login, is enriching the request.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Use it when several receivers", "need the same missing details.", "", "Park what cannot be filled in.", "", "Let receivers ask for things", "that must be current, like stock."]
narration = """
So, when should you use it? [[slnc 400]] Use a content enricher when several receivers need the same details, and the sender does not have them. [[slnc 500]]
Send any message it cannot fill in to a problem list, with the reason. [[slnc 500]]
And skip it for details that must be current at the moment of acting, such as stock levels or prices. [[slnc 300]] For those, the receiver should ask the owning service when it acts.
"""

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a loyalty service", "and count the lookups."]
narration = """
That's the Content Enricher pattern. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] When a message is too thin for its receivers, fill it in once, in the middle. [[slnc 500]]
The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs offline, with nothing installed except a Java development kit. [[slnc 500]]
Here is one exercise to try. [[slnc 300]] Add a third receiver, a loyalty service that needs the tier. [[slnc 300]] Then count the lookups, with and without the enricher. [[slnc 500]]
If this helped, a like really does help other people find it. [[slnc 300]] And subscribe, if you'd like the rest of the series. [[slnc 400]] Thanks for watching.
"""
