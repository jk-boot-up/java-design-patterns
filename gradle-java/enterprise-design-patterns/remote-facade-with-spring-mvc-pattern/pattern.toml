    "Java basics: records.",
    "HTTP methods, JSON and status codes.",
    "The Remote Facade idea, ideally from the plain Java version of this pattern.",
]
not_required = [
    "Earlier Spring experience. The dependencies page explains the annotations used.",
]

[docs.dependencies]
intro = """
This project uses Spring MVC through Spring Boot, which the plain Java
version of Remote Facade does not. Skipping it loses none of the pattern: the
plain version teaches all of it with nothing installed.
"""
what = [
    ["Spring MVC and Jackson", "A @RestController method's return value becomes the response; Jackson turns a Java record into JSON. @RequestBody turns a request's JSON into a record. @ExceptionHandler catches an exception from the controller and decides the response; ProblemDetail is Spring's standard problem report, sent as application/problem+json."],
    ["A servlet filter", "A filter runs for every request before any controller. Here MobileNetwork adds 80 milliseconds, to play a mobile network's round trip."],
]
why = """
The plain version builds the facade by hand. This version shows how most Java
services offer one, with JSON and standard error reports for free.
"""
install_note = "Only a JDK, version 21. Gradle downloads the rest, and the version is pinned:"
versions = [
    ["Java", "21"],
    ["Spring Boot (webmvc starter)", "4.1.1"],
]
costs = [
    "A framework to run for what could be a few handlers.",
]

[docs.session]
objectives = [
    "Measure the cost of chatty remote calls.",
    "Return a screen as one JSON record.",
    "Make a change all-or-nothing and report refusals as ProblemDetail.",
    "Keep business rules on the fine-grained objects.",
]
walkthrough = """
Run `./gradlew run`. Compare act one's five round trips with act two's one.
Open `OrderFacade`: two methods and an exception handler. End on act three's
half-changed order and the facade's 422.
"""
exercises = [
    "Add a small `GET /order-slot` for the widget, and discuss where it belongs.",
    "Add an ETag to the summary so an unchanged screen costs almost nothing.",
    "Give the fine-grained API an exception handler too.",
]

[docs.explained]
sentence = """
With Spring MVC, a remote facade is a thin controller that offers remote
callers coarse, screen-sized calls, over fine-grained objects inside.
"""
verdict = """
Offer screen-sized calls to remote callers, especially over slow networks.
Make changes all-or-nothing, report refusals as ProblemDetail, keep rules on
the domain objects, and add small calls where a screen really needs little.
"""
recognise = [
    "Endpoints named summary or details returning a whole screen.",
    "Record DTOs returned from `@RestController` methods.",
    "`@ExceptionHandler` methods returning `ProblemDetail`.",
]

[spec]
purpose = """
Teach Remote Facade with Spring MVC: five chatty round trips, one JSON summary,
an all-or-nothing change with a problem report, rules kept inside, and the
over-fetching cost.
"""
nongoals = [
    "Not a real mobile network. A filter adds 80 ms per request.",
]
problem = """
Fine-grained calls across a slow network cost a round trip each and can leave
changes half done.
"""
roles = [
    ["The pattern", "`OrderFacade`"],
    ["The fine-grained API", "`FineGrainedController`"],
    ["The domain object", "`Order`"],
    ["The slow network", "`MobileNetwork`"],
    ["Entry point", "`SpringRemoteFacadeDemo`, five acts"],
]
requirements = [
