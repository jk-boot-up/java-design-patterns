# pattern.toml for the Remote Facade with Spring MVC project. See tools/patternkit.

[project]
slug = "remote-facade-with-spring-mvc"
category = "enterprise-design-patterns"
title = "Remote Facade with Spring MVC"
package = "remotefacademvc"
main_class = "SpringRemoteFacadeDemo"
tagline = "One call for the screen, as JSON"
bold = "Give the phone app a coarse-grained Spring MVC facade: one GET returns the whole order screen as JSON, one PUT changes the whole delivery all-or-nothing, and a refusal comes back as a standard problem report."
domain_note = ""
thumb_lines = ["REMOTE FACADE", "WITH SPRING MVC"]
thumb_code = "GET /order-summary"
youtube_title = "Remote Facade with Spring MVC"
youtube_tags = ["remote facade", "spring mvc", "rest api", "json", "problem details", "java"]

[readme]
intro = """
This is the framework version of the Remote Facade pattern. The plain Java
version, a separate project in this category, builds the facade on the JDK's
HTTP server and writes its own text format. Here Spring MVC does it, with
Jackson turning Java records into JSON, in a real Spring Boot service called
over HTTP.

Inside the server, the order keeps its small methods and its business rule
about valid delivery slots. The facade, `OrderFacade`, is a thin controller for
remote callers: `GET /order-summary` returns everything the order screen needs
in one JSON document, and `PUT /order-delivery` changes address and slot
together, or not at all. A refusal comes back as a standard problem report,
HTTP 422. To show why round trips matter, a filter adds 80 milliseconds to
every request, as a mobile network would.
"""
analogy = """
Think of ordering at a restaurant. You could call the waiter over five times:
once for a drink, once for a starter, once for a main. Or you give the whole
order in one visit. The kitchen still works dish by dish, but the trip across
the room happens once.
"""
scenario = """
The online store's phone app showed an order screen by asking the server for
each fact separately: the customer, the items, the total, the address, the
delivery slot. On a mobile network each question took about 80 milliseconds.
Changing a delivery took two calls, and when the second failed, the order was
left half changed.
"""
test_note = """
Every result the demo prints is asserted, with a real Spring MVC service on a
local port, called over HTTP. Timings are thresholds, and the 80 ms network
delay is added on purpose by a filter.
"""
run_note = """
Nothing to install beyond a Java 21 JDK: the Spring Boot service starts inside
the program, on a local port.
"""
twin = """
The plain Java version got the idea right: one coarse call for a screen, one
call for a whole change, fine-grained objects inside, and the costs of
over-fetching and a growing facade. What it left out is how a framework
supplies the parts: Jackson turns a Java record into JSON with no formatting
code, a refused change becomes a standard application/problem+json report
with status 422, and the fine-grained API, with no error handling at all,
answers a plain 500. Measuring round trips over real HTTP makes the cost of
chatty calls concrete.
"""
technologies = [
    ["Spring Boot", "4.1.1", "the embedded web server"],
    ["Spring MVC", "with Spring Boot 4.1.1", "@RestController, @RequestBody, @ExceptionHandler, ProblemDetail"],
    ["Jackson", "with Spring Boot 4.1.1", "records to and from JSON"],
]
costs = [
    "**Sometimes too much.** A widget that shows only the slot fetched 130 bytes of summary where 8 would do.",
    "**A method per screen.** Each new screen may want its own facade method.",
    "**One more layer.** The facade must be kept in step with the order and the screens.",
]
too_much = """
Inside one process, calls are cheap, and fine-grained objects are the right
shape. A remote facade pays off across a network, especially a slow one, where
every round trip costs.
"""
met_before = [
    "REST endpoints that return a whole screen, such as order summaries.",
    "Backends for frontends, which give each app its own coarse API.",
    "GraphQL, which lets the client ask for a whole screen in one request.",
]
where = """
This project is in [enterprise-design-patterns](..). It is the framework
version of the plain Java Remote Facade project in the same category, which
is left unchanged.
"""

[[act]]
title = "A call for every fact"
summary = "The phone app makes 5 separate GETs for customer, items, total, address and slot: over 0.4 s on a mobile network."
detail = """
The phone app asks the fine-grained endpoints for each fact of the order
screen: customer Priya, the items, the total of £46.00, the address and the
slot. Five round trips, each paying the mobile network's 80 milliseconds:
over 0.4 seconds before the screen can be drawn.
"""
speech = """
First demo: the phone app asks for each fact separately. [[slnc 400]] The customer. [[slnc 300]] The items. [[slnc 300]] The total. [[slnc 300]] The address. [[slnc 300]] The delivery slot. [[slnc 600]]
Five trips across a mobile network. [[slnc 300]] Almost half a second, before the screen can be drawn.
"""
rows = { phone = "active wrong", fine = "active amber" }
console = [
    ["5 round trips", "amber"],
    ["over 0.4 s", "bad"],
]

[[act]]
title = "The whole screen as JSON"
summary = "GET /order-summary returns one JSON document with everything, in 1 round trip, under 0.2 s."
detail = """
The facade's `GET /order-summary` returns one JSON document, built by Jackson
from a Java record: the order number, customer, items, total, address and
slot. One round trip, under 0.2 seconds.
"""
speech = """
Second demo: a remote facade. [[slnc 400]] One call returns everything the order screen needs, as one JSON document. [[slnc 600]]
One trip across the network. [[slnc 300]] Under a fifth of a second.
"""
rows = { phone = "active ok", facade = "active ok" }
console = [
    ["GET /order-summary: all six facts", "ok"],
    ["1 round trip, under 0.2 s", "ok"],
]

[[act]]
title = "All or nothing"
summary = "Two small PUTs leave a new address with the old slot (the slot PUT got 500); the facade's one PUT is refused with 422 and nothing changes, then succeeds with a valid slot."
detail = """
With small calls, the address changes, then the slot change is refused, and
the fine-grained API, with no error handling, answers 500. The order is left
half changed: new address, old slot. The facade's one `PUT /order-delivery`
checks the slot before changing anything: Sunday is refused with 422 and the
order is unchanged; Tuesday succeeds and both change together.
"""
speech = """
Third demo: a change, all or nothing. [[slnc 400]] With small calls, the address changes first. [[slnc 300]] Then the new slot is refused. [[slnc 500]]
The order is left half changed. [[slnc 300]] New address, old slot. [[slnc 600]]
The facade takes the whole change in one call. [[slnc 300]] Sunday is refused, and nothing changes. [[slnc 500]]
Tuesday is accepted, and both change together.
"""
rows = { fine = "active wrong", facade = "active ok" }
console = [
    ["small calls: new address, old slot", "bad"],
    ["facade, Sunday: 422, unchanged", "ok"],
    ["facade, Tuesday: 200, both changed", "ok"],
]

[[act]]
title = "Fine-grained inside"
summary = "The facade calls Order's small methods in-process; the slot rule lives on Order, and refusals return application/problem+json."
detail = """
Inside the server, nothing became coarse. The facade calls the Order's small
methods in-process, where calls are cheap, and the rule about valid slots
stays on the Order. The refusal came back as a standard problem report, with
the content type application/problem+json.
"""
speech = """
Fourth demo: inside, the order stays fine-grained. [[slnc 400]] The facade calls the order's small methods, inside the server, where calls are cheap. [[slnc 500]]
The rule about valid slots lives on the order. [[slnc 300]] And a refusal comes back as a standard problem report.
"""
rows = { facade = "active ok" }
console = [
    ["rules stay on Order", "ok"],
    ["application/problem+json", "muted"],
]

[[act]]
title = "The bill"
summary = "A widget showing only the slot fetches 130 bytes of summary instead of 8, and each new screen may want its own facade method."
detail = """
A small widget that shows only the delivery slot needs 8 bytes from the small
call, but 130 from the summary. And each new screen may want its own facade
method, so the facade grows with the app.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] A small widget shows only the delivery slot. [[slnc 300]] The small call sends eight bytes. [[slnc 300]] The summary sends a hundred and thirty. [[slnc 600]]
And every new screen may want its own facade method.
"""
rows = { facade = "active amber" }
console = [
    ["slot widget: 8 bytes vs 130", "amber"],
]

[animation]
subtitle = "The phone app calls a Spring MVC facade across a slow network; the order stays fine-grained inside."
boxes = [
    ["phone", "Phone app", "across a mobile network"],
    ["fine", "Fine-grained endpoints", "/order/customer ..."],
    ["facade", "OrderFacade", "/order-summary, /order-delivery"],
]

