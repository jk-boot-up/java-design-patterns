[poster]
headline = [["SPECIAL", "text"], ["CASE", "text"]]
before = { code = "if (customer == null)", note = "one check missed: crash", tag = "BEFORE" }
after = { code = "new Guest()", note = "answers every question", tag = "AFTER" }
taglines = [["Give the odd case its own class", "gold"]]

[[scene]]
key = "01-poster"
kind = "poster"
title = "Special Case"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Special Case pattern, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] When there is no ordinary object to return, such as no customer logged in, return an object for that special case instead of nothing. [[slnc 300]] It answers every question in the way that fits. [[slnc 600]]
Think of the badges at a conference. [[slnc 300]] Delegates get a badge with their name. [[slnc 300]] Walk-in visitors get a visitor badge. [[slnc 300]] Every door reads a badge the same way. [[slnc 300]] Nobody has to stop and ask: do you have a badge at all? [[slnc 700]]
In this video, the domain is an online shop. [[slnc 300]] Its checkout serves registered customers, guests without an account, and old orders from deleted accounts. [[slnc 500]]
By the end, you will hear how null checks crash a checkout. [[slnc 300]] How special cases remove them. [[slnc 300]] How to ask for behaviour instead of type. [[slnc 300]] And what special cases can hide.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["Registered customers: discount,", "loyalty points, newsletter.", "", "Guests: no account.", "Old orders: deleted accounts.", "", "The lookup returned null."]
narration = """
Here is the scenario. [[slnc 400]] Registered customers get a member discount, loyalty points, and the newsletter. [[slnc 500]]
Guests check out without an account. [[slnc 300]] And some old orders belong to accounts that were deleted. [[slnc 500]]
For guests and deleted accounts, the customer lookup returned null. [[slnc 300]] Nothing at all.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["Never return null for a normal", "situation.", "", "Return an object for it:", "Guest, Former customer.", "", "Same interface, sensible answers."]
narration = """
Let's name the pattern. [[slnc 400]] Never return null for a situation that is normal. [[slnc 500]]
Return an object for that special case instead. [[slnc 300]] A guest. [[slnc 300]] A former customer. [[slnc 500]]
Each one implements the same interface as an ordinary customer. [[slnc 300]] And answers every question in the way that fits.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["Customer: the questions checkout asks", "RegisteredCustomer: the ordinary case", "Guest, Unknown: the special cases", "Directory.find: never returns null"]
narration = """
Here is who does what. [[slnc 400]] Customer is the interface: the questions checkout asks. [[slnc 500]]
Registered customer is the ordinary case. [[slnc 500]]
Guest and unknown are the special cases. [[slnc 300]] Small records that give the right answers. [[slnc 500]]
And the directory's find method never returns null.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Collections.emptyList()", "Anonymous users in web frameworks", "\"Deleted user\" on forums", "Null Object: the simplest special case"]
narration = """
You have probably met this pattern already. [[slnc 400]] Collections dot empty list is a special case for no items. [[slnc 500]]
Web frameworks represent visitors who are not logged in as an anonymous user, not as null. [[slnc 500]]
Forums show deleted user in place of a removed account. [[slnc 300]] And the Null Object pattern is the simplest special case of all: one that does nothing.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Normal, meaningful situations:", "guests, deleted accounts.", "", "Real errors stay errors:", "throw, or return Optional."]
narration = """
So, when should you use it? [[slnc 400]] For situations that are normal, and have a sensible meaning. [[slnc 300]] A guest checking out. [[slnc 300]] An order from a deleted account. [[slnc 500]]
Keep real errors as errors. [[slnc 300]] If a missing value is a bug, throw an exception, or return an optional, and let the caller decide.
"""

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a Staff", "special case."]
narration = """
That's the Special Case pattern. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Give the odd but normal case its own object, and stop returning null. [[slnc 500]]
The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs offline, with nothing installed except a Java development kit. [[slnc 500]]
Here is one exercise to try. [[slnc 300]] Add a staff special case, with a twenty percent discount and no points. [[slnc 500]]
If this helped, a like really does help other people find it. [[slnc 300]] And subscribe, if you'd like the rest of the series. [[slnc 400]] Thanks for watching.
"""
