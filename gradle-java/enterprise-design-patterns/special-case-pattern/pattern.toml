# pattern.toml for the Special Case project. See tools/patternkit.

[project]
slug = "special-case"
category = "enterprise-design-patterns"
title = "Special Case"
package = "specialcase"
main_class = "SpecialCaseDemo"
tagline = "Give the odd case its own class"
bold = "Instead of returning null for a guest or a missing account, return an object for that special case, which answers every question in the right way for it."
youtube_description = """Special Case pattern in Java: when there is no ordinary object to return, you return an object for that special case that answers every question in the way that fits, like a conference visitor badge that every door reads the same way. Explained with an online store checkout that serves registered customers, guests without an account, and old orders from deleted accounts. We watch null checks crash a checkout, add a guest special case and an unknown-customer case, and ask for behaviour instead of checking types. We finish with what special cases can hide."""
domain_note = ""
thumb_lines = ["SPECIAL", "CASE"]
thumb_code = "new Guest()"
youtube_title = "Special Case"
youtube_tags = ["special case pattern", "null object", "enterprise patterns", "martin fowler", "java"]

[readme]
intro = """
Special Case is one of Martin Fowler's enterprise application patterns. When a
lookup has nothing ordinary to return (no customer is logged in, or the
account was deleted), it returns an object for that particular situation
instead of `null`. The object implements the same interface as the ordinary
case, and answers every question in the way that fits: a guest has no
loyalty points, a former customer cannot be emailed.

Callers stop writing `if (customer == null)`, and a forgotten check can no
longer crash the program. Null Object is the simplest special case, one that
does nothing; Special Case allows several, each with its own meaning.
"""
analogy = """
Think of the name badges at a conference. Registered delegates get a printed
badge with their name. Walk-in visitors get a "Visitor" badge, and people
whose registration was cancelled but who turn up anyway get a "Guest of the
organisers" badge. Every door and every stall reads a badge the same way; nobody
has to stop and ask "wait, do you have a badge at all?"
"""
scenario = """
The online store looks customers up at checkout. Guests have no account, and
some old orders belong to accounts that have since been deleted. In both cases
the lookup returned `null`, and checkout checked for null in four places. The
loyalty points line forgot, and the first guest to check out crashed the page.
"""
costs = [
    "**Mistakes can hide.** A mistyped ID quietly becomes \"Former customer\" and checkout carries on, instead of failing loudly.",
    "**Every case, every method.** Each new method on `Customer` must be written for `Guest` and `Unknown` too.",
    "**More classes.** One per special situation.",
]
too_much = """
When a missing value really is an error, say so: throw, or return an `Optional`
and make the caller decide. Special cases are for situations that are normal
and have a sensible meaning, like a guest checkout, not for bugs.
"""
met_before = [
    "`Collections.emptyList()`, a special case for \"no items\".",
    "Anonymous users in web frameworks, such as Spring Security's `AnonymousAuthenticationToken`.",
    "\"Unknown\" or \"Deleted user\" shown in place of a removed account on forums and shops.",
]
where = """
This project is in [enterprise-design-patterns](..). Its simplest form, a
single do-nothing object, is the
[Null Object](../../foundational-design-patterns/null-object-pattern) pattern.
"""

[[act]]
title = "Null checks everywhere"
summary = "Priya pays £38.00; a guest checking out causes a NullPointerException because the points line forgot its check."
detail = """
`Directory.findOrNull` returns `null` for a guest. `Checkout.withNullChecks`
checks for null when reading the name, the discount and the marketing flag,
but not before adding loyalty points. Priya, a registered customer, pays
£38.00 after her member discount. The first guest causes a
`NullPointerException`.
"""
speech = """
First demo: no customer means null, and null checks everywhere. [[slnc 400]] Null is Java's way of saying: there is no object here. [[slnc 500]]
Priya is a registered customer. [[slnc 300]] She pays thirty-eight pounds, after her member discount. [[slnc 500]]
Then a guest checks out. [[slnc 300]] There is no account, so the lookup returns null. [[slnc 300]] Checkout checked for null when reading the name, the discount, and the newsletter flag. [[slnc 300]] But the loyalty points line forgot. [[slnc 600]]
The page crashes, with a null pointer exception.
"""
rows = { lookup = "active amber", checkout = "active wrong" }
console = [
    ["Priya pays £38.00", "ok"],
    ["a guest: NullPointerException", "bad"],
    ["the points line forgot its check", "bad"],
]

[[act]]
title = "A guest special case"
summary = "The lookup returns a Guest; checkout has no ifs; the guest pays £40.00 with 0 points."
detail = """
`Directory.find` never returns null. With no ID it returns a `Guest`, which
implements `Customer`: name "Guest", no discount, no points, no newsletter.
`Checkout.run` has no null checks. Priya pays £38.00 and earns points; the
guest pays £40.00 and earns none.
"""
speech = """
Second demo: a guest special case. [[slnc 400]] The lookup never returns null any more. [[slnc 300]] With no account, it returns a guest object. [[slnc 500]]
The guest answers every question checkout asks. [[slnc 300]] Its name is Guest. [[slnc 300]] Its discount is zero. [[slnc 300]] It earns no points, and gets no newsletter. [[slnc 600]]
Checkout has no if statements at all. [[slnc 300]] Priya pays thirty-eight pounds. [[slnc 300]] The guest pays forty pounds, with no points. [[slnc 300]] Nothing crashes.
"""
rows = { lookup = "active ok", guest = "active ok", checkout = "active ok" }
console = [
    ["Priya pays £38.00, points 196", "ok"],
    ["Guest pays £40.00, points 0", "ok"],
    ["checkout has no ifs", "ok"],
]

[[act]]
title = "An unknown customer"
summary = "An old order by deleted account C-99 shows \"Former customer\" and the report runs."
detail = """
An old order belongs to `C-99`, an account that was deleted. The lookup
returns an `Unknown` special case that remembers the old ID. The order history
report runs, shows "Former customer", and still records who it was.
"""
speech = """
Third demo: a second special case. [[slnc 400]] An old order belongs to account C 99. [[slnc 300]] That account was deleted. [[slnc 500]]
The lookup returns an unknown customer. [[slnc 300]] Its name is Former customer. [[slnc 300]] It remembers the old ID. [[slnc 500]]
The order history report runs, with no crash, and still says who it was.
"""
rows = { lookup = "active ok", unknown = "active ok" }
console = [
    ["Former customer pays £25.00", "ok"],
    ["Unknown[formerId=C-99]", "ok"],
]

[[act]]
title = "Behaviour, not type checks"
summary = "Newsletter: Priya yes, Guest no, Former customer no; no instanceof anywhere."
detail = """
The newsletter step asks each customer `canReceiveMarketing()`. Priya says yes;
the guest and the former customer say no. Nowhere does code ask
`instanceof Guest`: each case answers for itself.
"""
speech = """
Fourth demo: ask for behaviour, not for the type. [[slnc 400]] The newsletter step asks each customer one question. [[slnc 300]] Can you receive marketing? [[slnc 500]]
Priya: yes. [[slnc 300]] The guest: no. [[slnc 300]] The former customer: no. [[slnc 600]]
Nowhere does the code ask: are you a guest? [[slnc 300]] Each case answers for itself.
"""
rows = { registered = "active ok", guest = "active ok", unknown = "active ok" }
console = [
    ["Priya: newsletter yes", "ok"],
    ["Guest: newsletter no", "ok"],
    ["Former customer: newsletter no", "ok"],
]

[[act]]
title = "The bill"
summary = "A mistyped ID, C-71, quietly becomes \"Former customer\"; every new Customer method needs writing three times."
detail = """
Special cases can hide mistakes. A mistyped ID, `C-71`, quietly becomes a
former customer and checkout carries on, where a crash would at least have
been noticed. And each new method on `Customer` must be written for every
special case too.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] A special case can hide a mistake. [[slnc 300]] Someone mistypes an ID: C 71 instead of C 17. [[slnc 300]] It quietly becomes a former customer, and checkout carries on. [[slnc 600]]
And every new method on customer must now be written three times. [[slnc 300]] Once for registered customers, once for guests, and once for unknown customers.
"""
rows = { lookup = "active amber", unknown = "active amber" }
console = [
    ["\"C-71\": Former customer, carries on", "amber"],
    ["every new method, three times", "amber"],
]

[animation]
subtitle = "The customer lookup never returns null: a guest or an unknown customer answers every question in its own sensible way."
boxes = [
    ["lookup", "Customer lookup", "never null"],
    ["registered", "Priya", "5% off, earns points"],
    ["guest", "Guest", "no discount, no points"],
    ["unknown", "Former customer", "deleted account"],
    ["checkout", "Checkout", "no null checks"],
]

[docs.problem]
scenario = """
Checkout serves registered customers, guests without accounts, and old orders
from deleted accounts.
"""
naive = """
The lookup returns `null` for guests and deleted accounts, and checkout checks
for null in four places. The points line forgot, and the first guest crashed
checkout.
"""
deliver = [
    "The crash shown: a NullPointerException for a guest.",
    "A Guest special case with no discount, no points and no newsletter.",
    "An Unknown special case for deleted accounts that keeps the old ID.",
    "Checkout with no null checks and no type checks.",
    "The cost shown: a mistyped ID hidden as a former customer.",
    "Every printed result asserted by a test.",
]

[docs.prerequisites]
required = [
    "Java basics: interfaces, classes, records.",
    "What `null` is and what a `NullPointerException` means.",
]
not_required = [
    "The Null Object pattern, though it helps.",
]

[docs.session]
objectives = [
    "Explain why null checks spread and why one missing check crashes.",
    "Write a special case that implements the ordinary interface.",
    "Tell a special case from an error.",
    "Tell Special Case from Null Object.",
]
walkthrough = """
Run `./gradlew run` and open `Checkout.withNullChecks`: find the one line
without a check. Then open `SpecialCases`: two small records. Show that
`Checkout.run` has no `if` at all, and end on act five: when should a missing
account be an error instead?
"""
exercises = [
    "Add a `Staff` special case with a 20% discount and no points.",
    "Make `find` throw for IDs that do not match the pattern `C-` plus digits, so mistypes fail loudly.",
    "Add a method `deliveryName()` and implement it for all three kinds of customer.",
]

[docs.explained]
sentence = """
A special case is an object that stands in for an unusual but normal
situation, such as a guest or a deleted account, and answers every question
the ordinary object would, in the way that fits.
"""
verdict = """
Return special cases for situations that are normal and meaningful, so callers
never check for null. Keep real errors as errors, and make sure every special
case implements every method sensibly.
"""
recognise = [
    "Classes named `Guest...`, `Unknown...`, `Missing...`, `Anonymous...` or `Empty...`.",
    "Lookups documented as \"never returns null\".",
    "`Collections.emptyList()` and similar ready-made empty values.",
]

[spec]
purpose = """
Teach Special Case with an online store's checkout: a null lookup causing a
NullPointerException for a guest, then Guest and Unknown special cases so
checkout has no null checks (Priya £38.00, guest £40.00, former customer
£25.00), behaviour instead of type checks, and a mistyped ID hidden as a
former customer.
"""
nongoals = [
    "Not accounts or login. Customers are looked up by ID in a map.",
    "Not Optional. It is named as the alternative for real errors.",
]
problem = """
Returning null for guests and missing accounts forces null checks everywhere,
and one forgotten check crashes checkout.
"""
roles = [
    ["The contract", "`Customer`"],
    ["The ordinary case", "`RegisteredCustomer`"],
    ["The special cases", "`SpecialCases.Guest`, `SpecialCases.Unknown`"],
    ["The lookup", "`Directory.find` (never null), `findOrNull` (the old way)"],
    ["Entry point", "`SpecialCaseDemo`, five acts"],
]
requirements = [
    "**Never null:** `find` returns a Customer for every input.",
    "**No checks:** `Checkout.run` has no null or type checks.",
    "**Meaningful cases:** guest and unknown each answer every method sensibly.",
    "**Every printed result is asserted** in `DemoRunsTest`.",
]

