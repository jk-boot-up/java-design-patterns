[poster]
headline = [["SINGLE TABLE", "text"], ["INHERITANCE WITH JPA", "text"]]
before = { code = "@Inheritance(TABLE_PER_CLASS)", note = "a UNION over 3 tables", tag = "BEFORE" }
after = { code = "@Inheritance(SINGLE_TABLE)", note = "one plain select", tag = "AFTER" }
taglines = [["One annotation, and the SQL behind it", "gold"]]

[[scene]]
key = "01-poster"
kind = "poster"
title = "Single Table Inheritance with JPA"
narration = """
Hello, and welcome. [[slnc 400]] This video explains Single Table Inheritance, with JPA and Hibernate, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] Single table inheritance stores several related classes in one database table. [[slnc 300]] A type column says which class each row is. [[slnc 500]] JPA is the Java standard for storing objects in tables, and Hibernate is the open-source library that does the work. [[slnc 600]]
Think of a single stock book, with a column for each kind of detail, and a word at the start of each line saying what kind of item it is. [[slnc 700]]
In this video, the domain is an online shop's products: books, electronics, and food. [[slnc 500]]
By the end, you will hear the SQL Hibernate writes for two strategies. [[slnc 300]] How each row comes back as its own class. [[slnc 300]] And a rule the database can no longer keep.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["Books, electronics, food.", "", "A table for each kind.", "", "\"Everything under £10\"", "searched every table."]
narration = """
Here is the scenario. [[slnc 400]] The shop sells books, electronics, and food, each with its own details. [[slnc 500]]
With a table for each kind, a question about all products had to search every table. [[slnc 500]]
And every new kind made those questions bigger.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern, in JPA"
body = ["@Inheritance(SINGLE_TABLE).", "", "@DiscriminatorColumn: the type.", "@DiscriminatorValue: per class.", "", "Hibernate writes the SQL."]
narration = """
Let's name the pattern, in JPA's words. [[slnc 400]] The inheritance annotation, set to single table. [[slnc 500]]
A discriminator column holds the type. [[slnc 300]] Each class has its own discriminator value. [[slnc 500]]
And Hibernate writes all the SQL.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["Product: the one table", "Book, Electronics, Food, GiftCard", "CatalogItem: table per class", "SqlLog: sees every statement"]
narration = """
Here is who does what. [[slnc 400]] Product is mapped to the one table. [[slnc 300]] Book, electronics, food and gift card are its subclasses. [[slnc 500]]
Catalog item is the comparison, with a table for each class. [[slnc 500]]
And the SQL log sees every statement Hibernate sends.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["JPA @Inheritance", "Rails single table inheritance", "Tables with a dtype column"]
narration = """
You have probably met this already. [[slnc 400]] The inheritance annotation, in JPA entities. [[slnc 500]]
Ruby on Rails, which does the same with a type column. [[slnc 500]]
And database tables with a column called D type, and many empty cells.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Types share most columns.", "Queries span them all.", "", "Read Hibernate's SQL.", "Rules in Java.", "JOINED when cells run empty."]
narration = """
So, when should you use it? [[slnc 400]] When the types share most columns, and questions span all of them. [[slnc 500]]
Read the SQL Hibernate writes. [[slnc 300]] Keep subclass rules in Java. [[slnc 300]] And move to the joined strategy when empty cells start to dominate.
"""

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Try the", "JOINED strategy."]
narration = """
That's Single Table Inheritance, with JPA. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] One table and a type column, and always look at the SQL. [[slnc 500]]
The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs offline, with nothing installed except a Java development kit. [[slnc 500]]
Here is one exercise to try. [[slnc 300]] Switch to the joined strategy, and read the SQL it writes. [[slnc 500]]
If this helped, a like really does help other people find it. [[slnc 300]] And subscribe, if you'd like the rest of the series. [[slnc 400]] Thanks for watching.
