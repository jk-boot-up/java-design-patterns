[[scene]]
key = "01-poster"
kind = "poster"
title = "Single Table Inheritance"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Single Table Inheritance pattern, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] Single table inheritance stores several related classes in one database table. [[slnc 300]] A type column says which class each row is. [[slnc 300]] And each row leaves empty the columns that belong to other types. [[slnc 600]]
Think of one travel expenses form for every kind of trip. [[slnc 300]] A section for car journeys, one for trains, one for flights. [[slnc 300]] You fill in yours and leave the rest blank. [[slnc 300]] And finance keeps one pile of forms. [[slnc 700]]
In this video, the domain is an online shop. [[slnc 300]] It sells books, food, and electronics. [[slnc 300]] Each has a code, a name, and a price, and one field of its own. [[slnc 500]]
By the end, you will hear why a table per type makes simple questions slow. [[slnc 300]] How one table fixes it. [[slnc 300]] How each row becomes the right class. [[slnc 300]] And what it costs.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["Books: an ISBN.", "Food: a best-before date.", "Electronics: a warranty.", "", "All: a code, a name, a price.", "", "One table per type."]
narration = """
Here is the scenario. [[slnc 400]] Books have an ISBN. [[slnc 300]] Food has a best-before date. [[slnc 300]] Electronics have a warranty. [[slnc 500]]
All of them share a code, a name, and a price. [[slnc 500]]
In the database, each type had its own table. [[slnc 300]] In Java, they are classes that share an interface.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["One table for every type.", "", "A type column: which class.", "A column for every field.", "", "Unused columns stay empty."]
narration = """
Let's name the pattern. [[slnc 400]] Store every type in one table. [[slnc 500]]
Add a type column, saying which class each row is. [[slnc 300]] And a column for every field any type has. [[slnc 500]]
Each row fills in its own columns, and leaves the rest empty. [[slnc 300]] When loading, the type column decides which class to build.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["Product: the shared interface", "Book, Food, Electronics, GiftCard", "ProductTable: saves and loads", "TablePerType: the old way", "H2: an in-memory database"]
narration = """
Here is who does what. [[slnc 400]] Product is the shared interface. [[slnc 300]] Book, food, electronics, and gift card implement it. [[slnc 500]]
Product table saves them all into one table, and loads each row back as the right class. [[slnc 500]]
Table per type is the old way, kept for comparison. [[slnc 300]] And H2 is a real database, running in memory.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["JPA: SINGLE_TABLE inheritance", "@DiscriminatorColumn", "Rails: the type column", "product_type in shop platforms"]
narration = """
You have probably met this pattern already. [[slnc 400]] J P A offers single table inheritance, with a discriminator column for the type. [[slnc 500]]
Ruby on Rails uses a column called type for the same thing. [[slnc 500]]
And many shop platforms keep every product in one table, with a product type column.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Types share most fields and", "are queried together.", "", "Few type-specific fields.", "CHECK constraints for type rules.", "", "Many empty columns? Switch."]
narration = """
So, when should you use it? [[slnc 400]] When the types share most of their fields, and are often queried together. [[slnc 500]]
Keep type-specific fields few. [[slnc 300]] Add check constraints for rules like: a book must have an ISBN. [[slnc 500]]
And when the table fills with empty columns, switch to a table per class.
"""

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a CHECK that", "every book has an ISBN."]
narration = """
That's the Single Table Inheritance pattern. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Many classes, one table, and a type column to tell them apart. [[slnc 500]]
The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs offline once its libraries are downloaded, with nothing else installed except a Java development kit. [[slnc 500]]
