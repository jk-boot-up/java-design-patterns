# pattern.toml for the Single Table Inheritance project. See tools/patternkit.

[project]
slug = "single-table-inheritance"
category = "enterprise-design-patterns"
title = "Single Table Inheritance"
package = "singletable"
main_class = "SingleTableDemo"
tagline = "Many classes, one table"
bold = "Store every subclass in one table, with a type column that says which class each row becomes, and leave the columns another type needs empty."
youtube_description = """Single Table Inheritance pattern in Java, explained with an online store that sells books, food and electronics, each with a code, a name, a price and one field of its own. Several related classes are stored in one database table, a type column says which class each row is, and each row leaves the other types' columns empty, like one expenses form with a section for every kind of trip. We see why a table per type makes simple questions slow, move to one table, turn each row back into its own class, and add a new type. We finish with the bill."""
domain_note = ""
thumb_lines = ["SINGLE TABLE", "INHERITANCE"]
thumb_code = "type = 'BOOK'"
youtube_title = "Single Table Inheritance"
youtube_tags = ["single table inheritance", "orm", "jpa inheritance", "enterprise patterns", "sql", "java"]

[readme]
intro = """
Single Table Inheritance is one of Martin Fowler's enterprise application
patterns for storing a class hierarchy in a relational database. Every
subclass (book, food, electronics) is stored in the same table. A type column
says which class each row is, and there is a column for every field any
subclass has; a row simply leaves empty the columns that do not apply to it.

A question about all products is one query on one table, and each row is
turned back into the right class when it is loaded. The price is empty cells,
and rules the database can no longer enforce.
"""
analogy = """
Think of one travel expenses form used for every kind of trip. It has a
section for car journeys (miles driven), one for trains (ticket number) and
one for flights (flight code). You fill in the section for your trip and leave
the others blank. The finance team keeps one pile of forms, and a stamp in the
corner says which kind each one is.
"""
scenario = """
The online store sells books, food and electronics. Each shares a code, a
name and a price, and each has one field of its own: an ISBN, a best-before
date, a warranty. They were stored in one table per type, so any question
about all products, such as "everything under £10", had to ask every table.
"""
costs = [
    "**Empty cells.** Every row leaves most type-specific columns empty: 15 of 20 in the demo.",
    "**Weaker rules.** A book's ISBN cannot be `NOT NULL`, because food and kettles leave that column empty; the database accepts a book without one.",
    "**One wide table.** Every new type adds columns everyone else carries.",
]
too_much = """
When subclasses differ a lot, with many fields of their own, the table fills
with empty columns; Class Table Inheritance (a table per class, joined) or
Concrete Table Inheritance (a full table per concrete class) fit better. And
when types are rarely queried together, separate tables are simpler.
"""
met_before = [
    "JPA's `@Inheritance(strategy = SINGLE_TABLE)` with `@DiscriminatorColumn`.",
    "Ruby on Rails' `type` column on ActiveRecord models.",
    "Product tables in shop platforms with a `product_type` column.",
]
where = """
This project is in [enterprise-design-patterns](..), next to
[Table Data Gateway](../table-data-gateway-pattern), which is the simplest way
to put a table's SQL in one place.
"""
technologies = [["H2 Database", "2.5.252", "an in-memory SQL database, so the demo runs real SQL with nothing installed"]]

[[act]]
title = "A table per type"
summary = "Everything under £10 needs 3 queries, one per table: breakfast tea and a desk lamp."
detail = """
`TablePerType` keeps `book`, `food` and `electronics` in separate tables. To
list everything under £10 it asks all three: three queries for breakfast tea
and a desk lamp. A fourth product type means a fourth table, and every
question about all products grows again.
"""
speech = """
First demo: a table for every product type. [[slnc 400]] Books in one table, food in another, electronics in a third. [[slnc 600]]
A customer asks for everything under ten pounds. [[slnc 300]] The shop has to ask all three tables. [[slnc 300]] Three queries, to find breakfast tea and a desk lamp. [[slnc 600]]
Add a fourth type, and every question about all products needs a fourth query.
"""
rows = { book = "active amber", food = "active amber", electronics = "active amber" }
console = [
    ["under £10: [breakfast tea, desk lamp]", "ok"],
    ["3 queries, one per table", "bad"],
]

[[act]]
title = "One table for all"
summary = "One product table with a type column: everything under £10 is 1 query."
detail = """
`ProductTable` keeps every product in one table: shared columns for code,
name and price, a `type` column, and one column for each type-specific field.
Everything under £10 is now one query on one table.
"""
speech = """
Second demo: single table inheritance. [[slnc 400]] Every product now lives in one table. [[slnc 500]]
It has the shared columns: code, name, and price. [[slnc 300]] A type column, saying book, food, or electronics. [[slnc 300]] And one column for each type's own field. [[slnc 600]]
Everything under ten pounds is now one query, on one table.
"""
rows = { table = "active ok" }
console = [
    ["under £10: [breakfast tea, desk lamp]", "ok"],
    ["1 query", "ok"],
]

[[act]]
title = "Each row becomes its own class"
summary = "Loading reads the type column: BOOK-1 becomes a Book, KETTLE-1 an Electronics, TEA-1 a Food, each with its own packing note."
detail = """
When rows are loaded, the type column decides which class to build. `BOOK-1`
becomes a `Book` whose packing note shows its ISBN; `KETTLE-1` becomes
`Electronics` with a 2-year warranty card; `TEA-1` becomes `Food` with its
best-before date.
"""
speech = """
Third demo: each row comes back as its own class. [[slnc 400]] When a row is loaded, its type column says which class to build. [[slnc 500]]
Book one becomes a book, and its packing slip shows its ISBN. [[slnc 300]] The kettle becomes electronics, with a two-year warranty card. [[slnc 300]] The tea becomes food, with its best-before date.
"""
rows = { table = "active ok", classes = "active ok" }
console = [
    ["BOOK-1 -> Book: ISBN 978-1-00", "ok"],
    ["KETTLE-1 -> Electronics: 2-year warranty", "ok"],
    ["TEA-1 -> Food: best before 2027-03-01", "ok"],
]

[[act]]
title = "A new type"
summary = "Gift cards need one class and one new column, value_pence; existing rows are untouched."
detail = """
Gift cards are added with a `GiftCard` class and one new column,
`value_pence`, added to the same table. Existing rows are untouched; they
simply leave the new column empty. `GIFT-1` loads as a `GiftCard`.
"""
speech = """
Fourth demo: a new type. [[slnc 400]] The shop starts selling gift cards. [[slnc 300]] That needs one new class, and one new column, for the card's value. [[slnc 500]]
Existing rows are untouched. [[slnc 300]] They just leave the new column empty. [[slnc 500]]
Gift card one loads as a gift card: activate fifty pounds on dispatch.
"""
rows = { table = "active amber", classes = "active ok" }
console = [
    ["ADD COLUMN value_pence", "amber"],
    ["GIFT-1 -> GiftCard: activate £50", "ok"],
]

[[act]]
title = "The bill"
summary = "15 of 20 type-specific cells are empty; a book without an ISBN is saved because the column cannot be NOT NULL."
detail = """
With five products and four type-specific columns, 15 of 20 cells are empty.
And the database can no longer keep type rules: the ISBN column cannot be
`NOT NULL`, because food and kettles leave it empty, so a book with no ISBN is
saved without complaint.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] Five products, four type-specific columns. [[slnc 300]] Fifteen of the twenty cells are empty. [[slnc 600]]
And the database can no longer keep type rules. [[slnc 300]] The ISBN column cannot be required, because food and kettles leave it empty. [[slnc 300]] So a book with no ISBN is saved, without complaint.
"""
rows = { table = "active wrong" }
console = [
    ["15 of 20 type cells are empty", "amber"],
    ["a book without an ISBN was saved", "bad"],
]

[animation]
subtitle = "Books, food, electronics and gift cards share one table; a type column says which class each row becomes."
boxes = [
    ["book", "book table", "the old way"],
    ["food", "food table", "the old way"],
    ["electronics", "electronics table", "the old way"],
    ["table", "product table", "type column + every field"],
    ["classes", "Book, Food, Electronics, GiftCard", "built from the type column"],
]

[docs.problem]
scenario = """
The store sells books, food and electronics, each with shared fields and one
field of its own.
"""
naive = """
`TablePerType` keeps a table per type, so every question about all products
asks every table.
"""
deliver = [
    "Three queries for one question with a table per type.",
    "One table with a type column, and one query.",
    "Rows loaded as the right class.",
    "A new type added with one class and one column.",
    "Empty cells and a missing NOT NULL rule shown.",
    "Every printed result asserted by a test, against a real in-memory database.",
]

[docs.prerequisites]
required = [
    "Java basics: records, sealed interfaces, `switch` on types.",
    "A little SQL: tables, columns, `SELECT`, `NULL`.",
]
not_required = [
    "JPA or Hibernate. The mapping is written by hand so it can be read.",
]

[docs.session]
objectives = [
    "Explain how a class hierarchy can be stored in one table.",
    "Use a type column to build the right class when loading.",
    "Add a type with a new column.",
    "Name the costs: empty cells and weaker constraints.",
]
walkthrough = """
Run `./gradlew run` and compare act one's three queries with act two's one.
Open `ProductTable.create` to see the single wide table, then `load`, where the
type column picks the class. Finish on act five: ask how the book without an
ISBN could be stopped.
"""
exercises = [
    "Add a CHECK constraint that a BOOK row must have an ISBN. Does H2 enforce it?",
    "Store the same products with Class Table Inheritance: a shared table and one per type, joined. Compare the queries.",
    "Add a `Clothing` type with a size column.",
]

[docs.explained]
sentence = """
Single table inheritance stores every subclass in one table with a type
column and a column for every field, leaving unused columns empty.
"""
verdict = """
Use it when subclasses share most of their fields and are often queried
together. Keep type-specific fields few, add CHECK constraints for type rules,
and switch to another inheritance mapping when the table fills with empty
columns.
"""
recognise = [
    "A `type`, `kind` or `dtype` column in a table.",
    "`@Inheritance(strategy = SINGLE_TABLE)` in JPA code.",
    "Many nullable columns that are filled only for some rows.",
]

[spec]
purpose = """
Teach Single Table Inheritance with an online store's products in H2: a table
per type needing 3 queries, then one table with a type column needing 1,
rows loaded as the right class, gift cards added with one column, and the
costs: 15 of 20 cells empty and a book saved without an ISBN.
"""
nongoals = [
    "Not an ORM. The mapping is hand-written.",
    "Not the other inheritance mappings. They are exercises.",
]
problem = """
Storing each subclass in its own table makes every question about all of them
ask every table.
"""
roles = [
    ["The pattern", "`ProductTable`"],
    ["The classes", "`Products.Book`, `Food`, `Electronics`, `GiftCard`"],
    ["The naive version", "`TablePerType`"],
    ["Entry point", "`SingleTableDemo`, five acts"],
]
requirements = [
    "**One table:** all types in `product`, with a `type` column.",
    "**Right class back:** loading builds the class the type column names.",
    "**Real SQL:** every statement runs against H2.",
    "**Every printed result is asserted** in `DemoRunsTest`.",
]

