[[scene]]
key = "01-poster"
kind = "poster"
title = "Money"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Money pattern, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] The Money pattern keeps a price as a whole number of the smallest coin, such as pence, together with its currency. [[slnc 300]]
Never as a number with a decimal point. [[slnc 300]] So every sum is exact, pounds are never added to dollars, and nothing is rounded unless you ask. [[slnc 600]]
Think of the cash drawer in a shop. [[slnc 300]] It does not hold nineteen point nine nine of anything. [[slnc 300]] It holds coins: one thousand nine hundred and ninety-nine pence, all of them pounds. [[slnc 300]] You can count coins exactly, and share them out exactly. [[slnc 700]]
In this video, the domain is an online shop. [[slnc 300]] It adds up baskets, charges VAT, gives discounts, and sells in pounds, dollars and yen. [[slnc 500]]
By the end, you will hear why ten pence plus twenty pence is not thirty pence in a double. [[slnc 300]] How the Money class fixes it. [[slnc 300]] Why rounding is a decision. [[slnc 300]] And how to split ten pounds three ways without losing a penny.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["The shop adds baskets, charges VAT,", "splits discounts across lines,", "and sells in £, $ and ¥.", "", "Every price was a double.", "", "What could go wrong?"]
narration = """
Here is the scenario. [[slnc 400]] The online shop adds up baskets. [[slnc 300]] It charges VAT, which is a tax added to the price. [[slnc 300]] It spreads a basket discount across the lines. [[slnc 300]] And it sells in pounds, dollars and yen. [[slnc 600]]
The first version kept every price in a double. [[slnc 300]] A double is Java's ordinary number type for values with a decimal point. [[slnc 500]]
Every test passed. [[slnc 300]] So what could go wrong?
"""

[[scene]]
key = "03-doubles"
kind = "console"
title = "Act One — Prices as Doubles"
body = """ONE. Prices as doubles.
  10p + 20p = 0.30000000000000004
  is it 0.30? false
  1000 items at 10p: 99.9999999999986
  cut off to pence: 9999, not 10000
  $10 + £10 = 20.0"""
narration = """
First demo: prices as doubles. [[slnc 400]] A ten pence sticker plus a twenty pence sticker. [[slnc 300]] The total prints as zero point three, followed by fifteen zeros and a four. [[slnc 300]] Is it equal to zero point three? [[slnc 300]] No. [[slnc 600]]
Next, a thousand items at ten pence, added one by one. [[slnc 300]] The total is ninety-nine point nine nine nine, and some more nines. [[slnc 300]] Turn that into pence by cutting off the fraction, as a lot of code does, and you get nine thousand nine hundred and ninety-nine pence. [[slnc 300]] A penny short. [[slnc 600]]
And ten dollars plus ten pounds is simply twenty. [[slnc 300]] Nobody asked which currency.
"""

[[scene]]
key = "04-why"
kind = "quote"
title = "Why A Double Gets It Wrong"
body = ["A double stores numbers in binary.", "", "One tenth has no exact binary form,", "just as one third has no exact", "decimal form: 0.3333...", "", "So 0.1 is stored as very nearly 0.1."]
narration = """
Why does this happen? [[slnc 400]] A double stores numbers in binary: ones and zeros. [[slnc 500]]
Some fractions cannot be written exactly in binary. [[slnc 300]] One tenth is one of them. [[slnc 500]]
You already know this problem from ordinary numbers. [[slnc 300]] One third, written as a decimal, is zero point three three three, going on forever. [[slnc 300]] You have to stop somewhere, so it is never quite exact. [[slnc 500]]
In the same way, a double stores ten pence as very, very nearly ten pence. [[slnc 300]] Add enough of them, and the tiny errors add up to a missing penny.
"""

[[scene]]
key = "05-pattern"
kind = "bullets"
title = "The Pattern"
body = ["Store the smallest coin as a", "whole number: £19.99 is 1999.", "", "Keep the currency with it.", "", "Round only when told how."]
narration = """
Now, the pattern. [[slnc 400]] Store the amount as a whole number of the smallest coin. [[slnc 300]] Nineteen pounds ninety-nine becomes one thousand nine hundred and ninety-nine pence. [[slnc 300]] Whole numbers add and multiply exactly. [[slnc 600]]
Keep the currency with the amount, in the same object. [[slnc 600]]
And only round when someone says how. [[slnc 500]]
That object is called Money.
"""

[[scene]]
key = "06-money"
kind = "console"
title = "Act Two — Prices as Money"
body = """TWO. Prices as Money.
  10p + 20p = £0.30, equal: true
  1000 items at 10p: £100.00
    stored as 10000 pence
  3 mugs at £9.49, a teapot at £24.99,
  2 coasters at £4.99: £63.44"""
narration = """
Second demo: prices as Money. [[slnc 400]] Ten pence plus twenty pence is exactly thirty pence. [[slnc 300]] Equal to thirty pence? [[slnc 300]] Yes. [[slnc 600]]
A thousand items at ten pence is exactly one hundred pounds, stored as ten thousand pence. [[slnc 600]]
And a real basket. [[slnc 300]] Three mugs at nine pounds forty-nine. [[slnc 300]] A teapot at twenty-four ninety-nine. [[slnc 300]] Two coasters at four ninety-nine. [[slnc 300]] The total is sixty-three pounds forty-four, with no rounding anywhere.
"""

[[scene]]
key = "07-currency"
kind = "console"
title = "Act Three — Currencies"
body = """THREE. Currencies travel with the amount.
  £10.00 + $10.00: refused,
    cannot combine GBP with USD
  a Japanese price: ¥1500
  £9.999: refused, too many digits"""
narration = """
Third demo: currencies. [[slnc 400]] Every Money carries its currency. [[slnc 300]] So ten pounds plus ten dollars is refused, with a clear message: cannot combine pounds with dollars. [[slnc 600]]
The currency also knows how many digits it has after the point. [[slnc 300]] Pounds have two. [[slnc 300]] Japanese yen have none. [[slnc 300]] So fifteen hundred yen prints as fifteen hundred, with no pennies. [[slnc 600]]
And a price like nine pounds nine hundred and ninety-nine thousandths is refused at the door. [[slnc 300]] Instead of being quietly rounded somewhere later.
"""

[[scene]]
key = "08-rounding"
kind = "console"
title = "Act Four — Rounding Is A Choice"
body = """FOUR. Rounding is a choice, made once.
  VAT at 20% on 10 items at 99p
    rounded on each line: £2.00
    rounded once on the total: £1.98
  difference: £0.02"""
narration = """
Fourth demo: rounding. [[slnc 400]] Some sums really do fall between two pennies. [[slnc 300]] Twenty percent VAT on ninety-nine pence is nineteen point eight pence. [[slnc 500]]
Money will not round that by itself. [[slnc 300]] The code must say how. [[slnc 600]]
And where you round matters. [[slnc 300]] Ten items at ninety-nine pence. [[slnc 300]] Round the VAT on each line, and it comes to two pounds. [[slnc 300]] Round once, on the total, and it comes to one pound ninety-eight. [[slnc 600]]
Neither is wrong. [[slnc 300]] But they differ by two pence. [[slnc 300]] A shop must choose one rule, and use it everywhere. [[slnc 300]] Money makes that choice visible.
"""

[[scene]]
key = "09-split"
kind = "console"
title = "Act Five — Splitting"
body = """FIVE. Splitting without losing a penny.
  £10 ÷ 3: £3.33 x 3 = £9.99
  allocate(1, 1, 1):
    £3.34, £3.33, £3.33 = £10.00
  a £5.00 discount over the cart:
    £2.25, £1.97, £0.78 = £5.00"""
narration = """
Fifth demo: splitting. [[slnc 400]] Three friends share a ten pound bill. [[slnc 300]] Divide by three, and each pays three pounds thirty-three. [[slnc 300]] But three of those is nine pounds ninety-nine. [[slnc 300]] A penny has vanished. [[slnc 600]]
Money has a method called allocate. [[slnc 300]] It rounds each share down, then hands out the leftover pennies one at a time. [[slnc 300]] So the shares are three thirty-four, three thirty-three and three thirty-three. [[slnc 300]] Exactly ten pounds. [[slnc 600]]
The cart uses the same method to spread a five pound discount across its lines, by value. [[slnc 300]] Two twenty-five, one ninety-seven, and seventy-eight pence. [[slnc 300]] Exactly five pounds.
"""

[[scene]]
key = "10-roles"
kind = "bullets"
title = "The Pieces"
body = ["Money: whole pence + currency.", "Currency: £, $ or ¥, and its digits.", "Cart: lines priced in Money.", "NaiveCart: the doubles, kept to compare.", "", "Money never changes:", "every sum returns a new Money."]
narration = """
Let's name the pieces. [[slnc 400]] Money holds two things: a whole number of the smallest coin, and a currency. [[slnc 300]] Currency knows its symbol, and how many digits it has. [[slnc 300]] Cart holds lines, each priced in Money. [[slnc 300]] And the naive cart, with its doubles, is kept only so you can compare. [[slnc 600]]
One more detail. [[slnc 300]] A Money never changes. [[slnc 300]] Adding two amounts gives you a new Money, and leaves both originals alone. [[slnc 300]] So a price can be shared safely, anywhere.
"""

[[scene]]
key = "11-bill"
kind = "console"
title = "Act Six — The Bill"
body = """SIX. The bill.
  a price is now a class:
    £19.99 is stored as 1999 and GBP
  pounds to dollars needs a rate
    and a date: not Money's job"""
narration = """
Finally, the bill. [[slnc 400]] A price is now a class, not a plain number. [[slnc 300]] So every database, message and screen has to convert it. [[slnc 300]] Nineteen ninety-nine is stored as one thousand nine hundred and ninety-nine, plus the letters G B P. [[slnc 600]]
And Money does not convert currencies. [[slnc 300]] Turning pounds into dollars needs an exchange rate, and a date. [[slnc 300]] That is a separate job. [[slnc 500]]
Both costs are small, compared with a shop whose totals are a penny out.
"""

[[scene]]
key = "12-recognise"
kind = "bullets"
title = "How To Recognise It"
body = ["A class named Money, Amount or Price", "with an amount and a currency.", "", "priceInPence, amountMinor, cents.", "", "BigDecimal with a RoundingMode,", "never a double, near a price."]
narration = """
How can you spot this pattern in code someone else wrote? [[slnc 400]] Look for a class named Money, Amount or Price, holding an amount and a currency. [[slnc 300]] Look for fields like price in pence, or amount in cents, stored as whole numbers. [[slnc 300]] Or Java's big decimal type with a rounding rule, and never a double, anywhere near a price. [[slnc 500]]
Payment services like Stripe work the same way. [[slnc 300]] They take nineteen ninety-nine as one thousand nine hundred and ninety-nine, plus a currency.
"""

[[scene]]
key = "13-verdict"
kind = "bullets"
title = "The Verdict"
body = ["Use Money for every price, fee", "and balance.", "", "Store whole units + currency.", "Round once, by a named rule.", "Split with allocate.", "In production, use a library."]
narration = """
So, here is the verdict. [[slnc 400]] Use Money for every price, fee and balance. [[slnc 500]] Store whole units, plus a currency. [[slnc 300]] Round only at a decided point, with a named rule. [[slnc 300]] And split amounts with allocate, so no penny is ever lost. [[slnc 500]]
In a real system, use a tested library, such as Moneta, from the Java Money standard. [[slnc 300]] But write your own once, like this, to understand it.
"""

