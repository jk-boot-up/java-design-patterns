# pattern.toml for the Money project. See tools/patternkit.

[project]
slug = "money"
category = "enterprise-design-patterns"
title = "Money"
package = "money"
main_class = "MoneyDemo"
tagline = "Never keep a price in a double"
bold = "A price is not a number. It is an amount of the smallest coin, plus a currency, and it should never round without being asked."
youtube_description = """Money pattern in Java, explained with an online store that adds up baskets, charges VAT, gives discounts, and sells in pounds, dollars and yen. A price is kept as a whole number of the smallest coin, such as pence, together with its currency, never as a decimal number, so every sum is exact, like counting coins in a cash drawer. We hear why ten pence plus twenty pence is not thirty in a double, replace doubles with Money, refuse to add pounds to dollars, treat rounding as a decision, and split ten pounds three ways without losing a penny. We finish with the bill."""
domain_note = ""
thumb_lines = ["MONEY"]
thumb_code = "Money.of(\"19.99\", GBP)"
youtube_title = "Money"
youtube_tags = ["money pattern", "java money", "floating point", "rounding", "enterprise patterns"]

[readme]
intro = """
Money is one of Martin Fowler's enterprise application patterns. Instead of
keeping a price in a `double`, you keep it in a small class that holds a whole
number of the smallest coin (pence, cents) together with its currency. The
class adds, multiplies and splits amounts exactly, refuses to mix currencies,
and makes every rounding decision visible.

It is one of the simplest patterns in this course, and one of the most useful:
almost every business system handles money, and most of them have a bug that
this class would have prevented.
"""
analogy = """
Think of a cash drawer in a shop. The drawer never holds "nineteen point nine
nine" of anything. It holds coins and notes: one thousand nine hundred and
ninety-nine pence, all of them pounds. You can count them exactly, you can
share them out exactly, and nobody puts a dollar in the pound drawer by
accident.

A `double` is more like a measuring jug. It is good for flour or water, where
"about 300 millilitres" is fine. It is the wrong tool for pennies, where
"about" is a bug.
"""
scenario = """
The online store adds up baskets, charges VAT, splits basket discounts across
the lines, and sells in pounds, dollars and yen. The first version kept every
price in a `double`. It worked in every test anybody wrote, and then a report
showed ten thousand pence of stickers as nine thousand nine hundred and ninety-nine.
"""
costs = [
    "**A price is a class, not a number.** Every place that stores, sends or shows one must convert it: to a whole number and a currency code for the database, and to text for the screen.",
    "**Rounding must be decided.** Money refuses to round silently, so someone has to choose where rounding happens (each line, or once on the total) and how.",
    "**Currency conversion is still yours.** Turning pounds into dollars needs a rate and a date. That is a separate job, deliberately left out of Money.",
    "**A little more code.** A few dozen lines for the class and its tests.",
]
too_much = """
Very rarely. If a program only ever shows a price that someone else already
worked out, a string may be enough. As soon as the program adds, multiplies,
splits or compares prices, use Money, or an existing library such as
JSR 354 (Moneta) or Joda-Money.
"""
met_before = [
    "`java.math.BigDecimal`, the usual building block for money in Java.",
    "JSR 354, the Java Money and Currency API, and its reference implementation Moneta.",
    "Payment APIs such as Stripe, which take amounts as whole numbers of the smallest unit (`amount: 1999`, `currency: \"gbp\"`).",
    "Database columns like `price_pence INTEGER` next to a `currency CHAR(3)` column.",
]
where = """
This project is in [enterprise-design-patterns](..), next to
[Value Object](../../domain-driven-design-patterns/value-object-pattern), which
Money is the best-known example of.
"""

[[act]]
title = "Prices as doubles"
summary = "10p + 20p is 0.30000000000000004; 1000 × 10p becomes 9999 pence; pounds and dollars add without complaint."
detail = """
The naive cart keeps every price in a `double`. A 10p sticker and a 20p sticker
come to `0.30000000000000004`, which is not equal to `0.30`. A double stores
numbers in binary, and one tenth has no exact binary form, just as one third
has no exact decimal form. Adding ten pence a thousand times gives
`99.9999999999986`, and a careless conversion to pence, cutting off the
fraction, gives 9999 pence instead of 10000. Nothing crashed, and every small
test passed. And ten dollars plus ten pounds is simply `20.0`: a double has no
idea which currency it holds.
"""
narration = "The naive cart keeps prices as doubles. Ten pence plus twenty pence comes out as zero point three, then fifteen zeros and a four. A thousand items at ten pence becomes nine thousand nine hundred and ninety-nine pence. And ten dollars plus ten pounds is just twenty."
rows = { naive = "active wrong" }
console = [
    ["a 10p sticker and a 20p sticker: total 0.30000000000000004", "bad"],
    ["is it 0.30? false", "bad"],
    ["1000 items at 10p, added one by one: 99.9999999999986", "bad"],
    ["turned into pence by cutting off the fraction: 9999 pence, not 10000", "bad"],
    ["10 dollars + 10 pounds = 20.0, with nobody asking which is which", "amber"],
]

[[act]]
title = "Prices as Money"
summary = "10p + 20p is exactly £0.30; 1000 × 10p is £100.00, stored as 10000 pence; a real cart totals £63.44."
detail = """
`Money` stores a whole number of the smallest unit and a currency: £19.99 is
1999 and GBP. Whole numbers add and multiply exactly, so 10p plus 20p is
exactly £0.30, and a thousand ten-pences are exactly £100.00, stored as 10000
pence. A cart of three mugs at £9.49, a teapot at £24.99 and two coasters at
£4.99 comes to £63.44, with no rounding anywhere.
"""
narration = "Money keeps a whole number of pence and a currency. Ten pence plus twenty pence is exactly thirty pence. A thousand ten-pences are exactly one hundred pounds. The cart comes to sixty-three pounds forty-four."
rows = { money = "active ok", cart = "active ok" }
console = [
    ["10p + 20p = £0.30, equal to 30p: true", "ok"],
    ["1000 items at 10p: £100.00, stored as 10000 pence", "ok"],
    ["3 mugs at £9.49, a teapot at £24.99, 2 coasters at £4.99: £63.44", "ok"],
]

[[act]]
title = "Currencies travel with the amount"
summary = "£10 + $10 is refused; yen have no pennies; £9.999 is refused."
detail = """
Because each Money carries its currency, adding pounds to dollars is refused
with a clear message instead of producing a meaningless number. The currency
also knows its digits: pounds have two after the point, yen have none, so
¥1500 prints as ¥1500. And an amount with more digits than the currency allows,
such as £9.999, is refused at the door instead of being quietly rounded.
"""
narration = "Each amount carries its currency. Ten pounds plus ten dollars is refused. Yen have no pennies, so fifteen hundred yen prints as fifteen hundred. And nine pounds 999 is refused, because pounds have only two digits."
rows = { money = "active amber", currency = "active ok" }
console = [
    ["£10.00 + $10.00: refused, cannot combine GBP with USD", "amber"],
    ["a Japanese price has no pennies: ¥1500", "ok"],
    ["£9.999: refused, 9.999 has more digits than GBP allows", "amber"],
]

[[act]]
title = "Rounding is a choice, made once"
summary = "20% VAT on ten 99p items: £2.00 rounded per line, £1.98 rounded once on the total."
detail = """
Some sums do fall between two pennies: 20% of 99p is 19.8p. Money will not
round that by itself; the caller must say how. And *where* you round matters.
Rounding the VAT on each of ten lines gives 20p ten times, £2.00. Rounding once,
on the £9.90 total, gives £1.98. Neither is wrong, but they differ by two
pence, and a shop must pick one rule and use it everywhere. Money makes that
choice visible in the code instead of leaving it to whatever a double does.
"""
narration = "Twenty percent VAT on 99 pence is 19.8 pence, so something must round. Rounded on each of ten lines, the VAT is two pounds. Rounded once on the total, it is one pound ninety-eight. Money makes you choose, and shows the choice."
rows = { money = "active amber", cart = "active ok" }
console = [
    ["VAT at 20% on 10 items at 99p, rounded on each line: £2.00", "amber"],
    ["the same VAT, rounded once on the total:            £1.98", "amber"],
    ["difference: £0.02, and Money made the rounding visible", "ok"],
]

[[act]]
title = "Splitting without losing a penny"
summary = "£10 ÷ 3 is £3.33 × 3 = £9.99; allocate gives £3.34, £3.33, £3.33 = £10.00; a £5 discount spreads as £2.25, £1.97, £0.78."
detail = """
Dividing £10 by three gives £3.33 each, and £3.33 three times is £9.99: a penny
disappears. `allocate` splits by ratio instead. Each share is rounded down, and
the pennies left over are handed out one at a time, so £10 becomes £3.34, £3.33
and £3.33, which add back to exactly £10.00. The cart uses the same method to
spread a £5.00 basket discount across its lines in proportion to their value:
£2.25, £1.97 and £0.78, exactly £5.00. Refunds, tax lines and split payments
all need this.
"""
narration = "Ten pounds divided by three is 3.33 each, and three of those is 9.99: a penny lost. Allocate hands out the leftover penny: 3.34, 3.33 and 3.33, exactly ten pounds. A five pound discount spreads over the cart as 2.25, 1.97 and 78 pence."
rows = { money = "active ok", allocation = "active ok", cart = "active ok" }
console = [
    ["£10 shared by 3 friends, each paying a third: £3.33 x 3 = £9.99, a penny short", "bad"],
    ["allocate(1, 1, 1): £3.34, £3.33, £3.33 = £10.00", "ok"],
    ["a £5.00 basket discount spread over the cart's lines by value: £2.25, £1.97, £0.78 = £5.00", "ok"],
]

[[act]]
title = "The bill"
summary = "A price is now a class that must be converted at every edge, and currency conversion is still a separate job."
detail = """
Money is not free. A price is now a class, so every database table, message
and screen must convert it: £19.99 is stored as 1999 and GBP. And Money says
nothing about exchange rates: converting pounds to dollars needs a rate and a
date, which is a different concern, deliberately left out. Both costs are
small compared with a shop whose totals are off by a penny.
"""
narration = "The bill: a price is now a class, so every database, message and screen must convert it. Nineteen ninety-nine is stored as 1999 and GBP. And converting pounds to dollars still needs a rate and a date."
rows = { money = "active amber" }
console = [
    ["a price is now a class, not a number: every place that stores,", "muted"],
    ["sends or shows one must convert, e.g. £19.99 is stored as 1999 and GBP", "muted"],
    ["converting pounds to dollars needs a rate and a date: Money does not do it", "amber"],
]

[animation]
subtitle = "Six acts, the same ones the demo prints. Red is the double going wrong; green is Money getting it right."
boxes = [
    ["naive", "NaiveCart", "prices as doubles, no currency"],
    ["cart", "Cart", "lines in Money, one currency"],
    ["money", "Money", "whole pence + currency, exact"],
    ["currency", "Currency", "GBP 2 digits, USD 2, JPY 0"],
    ["allocation", "allocate()", "splits without losing a penny"],
]

[docs.problem]
scenario = """
The online store adds baskets, charges VAT, spreads discounts across lines and
sells in three currencies. Prices were kept as `double`s, and a report showed
one thousand 10p stickers as £99.99.
"""
naive = """
`NaiveCart` stores each price as a `double` and adds them up. It is short and
reads naturally, and small tests pass. It is wrong in three ways: binary
doubles cannot hold most decimal prices exactly, a double has no currency, and
it rounds silently wherever the arithmetic lands.
"""
deliver = [
    "The double failures shown with exact printed values: 0.30000000000000004, 99.9999999999986 and 9999 pence.",
    "A `Money` class holding whole minor units and a currency, adding, multiplying and comparing exactly.",
    "Mixing currencies refused; amounts with too many digits refused.",
    "Rounding only when asked, with the per-line versus once-on-the-total difference shown.",
    "`allocate` splitting by ratio with shares that always add back to the whole, checked over a range.",
    "Every printed number asserted by a test.",
]

[docs.prerequisites]
required = [
    "Java basics: classes, methods, `long` and `double`.",
    "What `equals` and `hashCode` are for.",
]
not_required = [
    "Any money library. The class is written from scratch so every line can be read.",
    "Accounting knowledge beyond what VAT and a discount are.",
]

[docs.session]
objectives = [
    "Explain why a `double` cannot hold 0.1 exactly, in one sentence.",
    "Store a price as whole minor units and a currency.",
    "Say where rounding should happen, and why it must be a decision.",
    "Split an amount by ratio without losing a penny.",
]
walkthrough = """
Run `./gradlew run` and read act one aloud before looking at any code: the
learners should see 0.30000000000000004 before they are told why. Then open
`Money.java`: two fields, a handful of methods, every one short. Spend the most
time on `allocate`, because it is the part people get wrong, and on the two
VAT totals in act four, because they start the useful argument about where
rounding belongs.
"""
exercises = [
    "Add `negate()` and use it to represent a refund. What should `allocate` do with a negative amount?",
    "Add EUR. Which lines of `Money` did you have to change?",
    "Change act four to use `RoundingMode.HALF_EVEN`. Does either total change? Why might a bank prefer it?",
    "Write a test that a £0.01 amount allocated to three shares gives 1p, 0p, 0p.",
]

[docs.explained]
sentence = """
Money keeps a price as a whole number of the smallest coin plus its currency,
so arithmetic is exact, currencies cannot be mixed, and rounding only happens
when someone decides it should.
"""
verdict = """
Use Money for every price, cost, fee and balance. Store whole minor units and a
currency code, round only at a decided point with a named rule, and split with
`allocate`. Reach for a library (Moneta, Joda-Money) in production; write one
yourself once, to understand it.
"""
recognise = [
    "A class or record named `Money`, `Amount` or `Price` with an amount and a currency.",
    "Fields like `amountMinor`, `priceInPence` or `cents` stored as `long`.",
    "`BigDecimal` with an explicit `RoundingMode`, never `double`, near prices.",
    "A method that splits an amount and hands out the remainder.",
]

[spec]
purpose = """
Teach Money with an online store: prices as doubles giving 0.30000000000000004,
99.9999999999986 and 9999 pence, then a Money class of whole pence and a
currency that adds exactly, refuses to mix currencies and too many digits,
rounds only when asked (showing £2.00 against £1.98 of VAT), and splits £10
three ways and a £5 discount across a cart without losing a penny.
"""
nongoals = [
    "Not currency conversion. Rates and dates are a separate concern.",
    "Not a money library. Moneta and Joda-Money are named, not used.",
    "Not persistence. Storing Money is described, not built.",
]
problem = """
Prices kept as doubles are inexact, have no currency, and round silently.

**What this project must deliver:** the double failures with exact printed values, a Money class of whole minor units and a currency, currency and digit checks, explicit rounding with the per-line difference, and allocation that never loses a penny.
"""
roles = [
    ["The pattern", "`Money`, `Currency`"],
    ["Using it", "`Cart`"],
    ["The naive version", "`NaiveCart`"],
    ["Entry point", "`MoneyDemo`, six acts"],
]
requirements = [
    "**Exact:** whole minor units in a `long`; no `double` anywhere in `Money`.",
    "**Currencies never mix:** combining two is refused with a clear message.",
    "**No silent rounding:** multiplying by a rate requires a `RoundingMode`.",
    "**Allocation is complete:** shares add back to the whole, asserted over 286 amounts and 4 ratio sets.",
    "**Every printed number is asserted** in `DemoRunsTest`.",
]

