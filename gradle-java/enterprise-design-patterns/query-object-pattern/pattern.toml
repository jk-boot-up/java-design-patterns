[poster]
headline = [["QUERY", "text"], ["OBJECT", "text"]]
before = { code = "\"WHERE \" + ... + \" AND \"", note = "broken, unsafe", tag = "BEFORE" }
after = { code = "q.and(inStock())", note = "placeholders, testable", tag = "AFTER" }
taglines = [["A search you can hold, test and reuse", "gold"]]

[[scene]]
key = "01-poster"
kind = "poster"
title = "Query Object"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Query Object pattern, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] A query object holds a search as an object, made of small criteria. [[slnc 300]] It can write itself as safe SQL for the database. [[slnc 300]] And it can run over a plain list in memory, for testing. [[slnc 600]]
Think of a library request form. [[slnc 300]] You fill in boxes: subject, author, year. [[slnc 300]] Whatever you write in the author box is treated as a name, never as an instruction. [[slnc 300]] And last week's form can be copied, with one more box ticked. [[slnc 700]]
In this video, the domain is an online shop. [[slnc 300]] Its search page lets customers filter products by category, price, and name. [[slnc 500]]
By the end, you will hear how gluing SQL together from strings goes wrong. [[slnc 300]] How a query object fixes it. [[slnc 300]] How to test a query without a database. [[slnc 300]] And what it costs.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["Filter by category, maximum price,", "and part of the name.", "", "Any filter may be empty.", "", "The page glued SQL together", "from strings."]
narration = """
Here is the scenario. [[slnc 400]] Customers can filter products by category, by maximum price, and by part of the name. [[slnc 300]] Any of those may be left empty. [[slnc 600]]
The search page built its database query by gluing text together. [[slnc 300]] A bit of SQL for each filter that was filled in.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["A search is an object made", "of criteria.", "", "It writes SQL with placeholders,", "values kept apart.", "", "It can also run in memory."]
narration = """
Let's name the pattern. [[slnc 400]] Hold the search as an object, made of criteria. [[slnc 300]] Category is kitchen. [[slnc 300]] Price at most thirty pounds. [[slnc 500]]
The object writes its own SQL, with a placeholder for every value. [[slnc 300]] The values travel separately, so customer text never becomes SQL. [[slnc 500]]
And the same object can run over a list in memory, so tests do not need a database.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["Criterion: SQL, values, Java test", "ProductQuery: holds criteria", "toSql, params: for the database", "runOn: for tests", "StringSql: the old way"]
narration = """
Here is who does what. [[slnc 400]] A criterion knows three things. [[slnc 300]] Its bit of SQL, its values, and how to test a product in Java. [[slnc 500]]
Product query holds a list of criteria. [[slnc 300]] It joins their SQL, collects their values, or runs them over a list. [[slnc 500]]
And string SQL is the old way, kept for comparison.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["JPA Criteria API", "Spring Data Specification", "QueryDSL, jOOQ", "Saved searches in shops"]
narration = """
You have probably met this pattern already. [[slnc 400]] J P A has a Criteria A P I. [[slnc 300]] Spring Data has specifications. [[slnc 500]]
QueryDSL and jOOQ build SQL from Java objects. [[slnc 500]]
And every shop that lets you save a search is keeping a query object for you.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Searches built from optional", "filters, saved or combined.", "", "Always placeholders.", "Test criteria in memory.", "Prefer a library for big ones."]
narration = """
So, when should you use it? [[slnc 400]] When searches are built from optional filters, saved, combined, or run in more than one place. [[slnc 500]]
Always use placeholders for values. [[slnc 300]] Test criteria in memory. [[slnc 500]]
And when your queries grow large, use a library such as JPA Criteria, or jOOQ, instead of growing your own language.
"""

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a minimum", "price criterion."]
narration = """
That's the Query Object pattern. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Hold a search as criteria, never as glued-together text. [[slnc 500]]
The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs offline, with nothing installed except a Java development kit. [[slnc 500]]
Here is one exercise to try. [[slnc 300]] Add a minimum price criterion, and search for a price range. [[slnc 500]]
If this helped, a like really does help other people find it. [[slnc 300]] And subscribe, if you'd like the rest of the series. [[slnc 400]] Thanks for watching.
"""
