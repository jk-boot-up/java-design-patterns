    { id = "s", label = "StringSql", sub = ["+ build(...): String"], col = 0, row = 1, colour = "red" },
]
edges = [
    { from = "q", to = "c", label = "holds" },
    { from = "c", to = "p", label = "tests" },
]

[[diagram]]
