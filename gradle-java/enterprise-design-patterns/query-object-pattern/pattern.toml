    { id = "q", label = "ProductQuery", sub = "a list of criteria", col = 1, row = 0, colour = "accent" },
    { id = "s", label = "SQL + values", sub = "for the database", col = 2, row = 0, colour = "green" },
    { id = "m", label = "runOn(list)", sub = "for tests", col = 2, row = 1, colour = "amber" },
]
