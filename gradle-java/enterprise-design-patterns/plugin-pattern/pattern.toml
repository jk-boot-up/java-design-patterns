# pattern.toml for the Plugin project. See tools/patternkit.

[project]
slug = "plugin"
category = "enterprise-design-patterns"
title = "Plugin"
package = "plugin"
main_class = "PluginDemo"
tagline = "Choose implementations by configuration"
bold = "Let the code name only interfaces, and let one configuration file per environment say which class plays each part."
youtube_description = """Plugin pattern in Java: the code asks for what it needs by interface, a configuration file per environment names the class that plays each part, and one factory creates it, like a theatre cast sheet that names tonight's actors without changing the script. Explained with an online store that runs in development, staging and production, where only production may charge real cards or send real emails. We watch scattered environment choices go wrong, load plugins from configuration, add an environment with no code, and catch mistakes at startup. We finish with what you give up."""
domain_note = ""
thumb_lines = ["PLUGIN"]
thumb_code = "factory.get(Emailer.class)"
youtube_title = "Plugin"
youtube_tags = ["plugin pattern", "enterprise patterns", "configuration", "environments", "martin fowler", "java"]

[readme]
intro = """
Plugin is one of Martin Fowler's enterprise application patterns. The code
asks for an interface, such as `PaymentGateway`, and never names the class
that implements it. A configuration file for each environment (development,
staging, production) says which class to use, and one factory reads the file
and creates the object.

Choosing a different implementation for an environment becomes a change to a
text file, made in one place, instead of an `if` statement repeated wherever
the service is needed.
"""
analogy = """
Think of a theatre. The script says "Hamlet enters". It never says which actor.
A cast sheet on the noticeboard says who plays each part tonight: the lead
actor in the evening, the understudy at the matinee. To change who plays
Hamlet, you change the sheet, not the script.
"""
scenario = """
The online store runs in three environments: development on laptops, staging
for testing, and production for real customers. Real card payments and real
emails must only happen in production. Each place in the code that needed a
payment gateway or an emailer chose one itself with an `if` on the environment
name. When staging was added, the payment choice was updated and the email
choice was missed, and staging emailed real customers.
"""
costs = [
    "**Errors at startup, not compile time.** A misspelt class name compiles fine and fails when the shop starts.",
    "**Invisible wiring.** \"Find usages\" of an implementation shows nothing, because it is only named in text files.",
    "**Reflection.** Classes are created from their names, which needs a public no-argument constructor.",
    "**Config files to keep in step.** One per environment, each listing every plugin.",
]
too_much = """
When there is only one implementation, or the choice never changes between
environments, just create the object. And a dependency injection framework
such as Spring already provides this pattern with profiles; use it rather than
writing your own factory in an application that has one.
"""
met_before = [
    "Java's `ServiceLoader` and `META-INF/services` files.",
    "Spring profiles and `@ConditionalOnProperty`, which choose beans per environment.",
    "JDBC drivers, logging back ends such as SLF4J bindings, and servlet containers loading web apps.",
]
where = """
This project is in [enterprise-design-patterns](..), next to
[Service Stub](../service-stub-pattern), which is what a plugin often swaps
in for development and testing.
"""

[[act]]
title = "Choices scattered in code"
summary = "In staging, the gateway choice gives the fake gateway, but the email choice falls through to the REAL emailer."
detail = """
`ScatteredChoices` has one method per service, each with its own `if` on the
environment name. When "staging" was added, the payment choice treated it
correctly and returned the fake gateway. The email choice only knew "dev", so
staging fell through to the real SMTP emailer and emailed Priya for real.
"""
speech = """
First demo: each place picks its own implementation, from the environment name. [[slnc 400]] The shop runs in development, staging, and production. [[slnc 300]] Only production should charge real cards, or send real emails. [[slnc 600]]
When staging was added, the payment code was updated. [[slnc 300]] Staging uses the fake gateway. [[slnc 500]]
The email code was missed. [[slnc 300]] It only knew about development. [[slnc 300]] So staging fell through to the real emailer, and sent a real customer an email.
"""
rows = { code = "active wrong", fake = "active ok", smtp = "active wrong" }
console = [
    ["staging: fake gateway approved £63.44", "ok"],
    ["staging: REAL email to priya@example.com", "bad"],
]

[[act]]
title = "Plugins from configuration"
summary = "plugins-dev.properties and plugins-prod.properties name the classes; dev gets fakes, prod gets the real services."
detail = """
Each environment has a file, `plugins-<env>.properties`, mapping an interface
name to a class name. `PluginFactory` reads it and creates the class.
`Checkout` only names `PaymentGateway` and `Emailer`. In dev it receives the
fake gateway and the sandbox emailer; in prod, the real card gateway and SMTP.
"""
speech = """
Second demo: plugins, chosen by configuration. [[slnc 400]] Each environment has one small file. [[slnc 300]] It says which class plays each part. [[slnc 300]] Payment gateway: the fake one. [[slnc 300]] Emailer: the sandbox one. [[slnc 600]]
One factory reads the file and creates the objects. [[slnc 300]] Checkout only ever names the interfaces. [[slnc 500]]
In development, the gateway is fake and the emails stay in a sandbox. [[slnc 300]] In production, the card is really charged, and the email is really sent.
"""
rows = { config = "active ok", factory = "active ok", fake = "active ok", sandbox = "active ok" }
console = [
    ["dev: fake gateway, sandbox inbox", "ok"],
    ["prod: REAL card, REAL email", "ok"],
    ["Checkout names only interfaces", "ok"],
]

[[act]]
title = "A new environment"
summary = "Staging is a two-line file: fake gateway and sandbox emailer; no Java changed."
detail = """
Staging is added again, this time as `plugins-staging.properties`: two lines,
fake gateway and sandbox emailer. No Java code changes, and there is no second
place to forget. Priya's email stays in the sandbox inbox.
"""
speech = """
Third demo: a new environment is a new file, not new code. [[slnc 400]] Staging gets its own file. [[slnc 300]] Two lines. [[slnc 300]] Fake gateway, sandbox emailer. [[slnc 600]]
No Java changes at all. [[slnc 300]] And there is no second place to forget. [[slnc 500]]
Priya's email stays in the sandbox inbox.
"""
rows = { config = "active ok", sandbox = "active ok" }
console = [
    ["staging: fake gateway approved £63.44", "ok"],
    ["staging: sandbox inbox kept email", "ok"],
    ["2 lines of config; no Java changed", "ok"],
]

[[act]]
title = "Caught at startup"
summary = "A demo file misspells SandboxEmailer; the startup check reports it before any customer arrives."
detail = """
The demo environment's file misspells `SandboxEmailer` as `SandboxEmaler`.
`PluginFactory.check` creates every configured plugin once when the shop
starts, and reports "cannot create ... SandboxEmaler for Emailer", before the
first customer ever reaches checkout.
"""
speech = """
Fourth demo: a bad entry is caught when the shop starts. [[slnc 400]] Someone misspells a class name in the demo environment's file. [[slnc 500]]
When the shop starts, the factory tries to create every plugin, once. [[slnc 300]] It reports: cannot create sandbox emaler, for the emailer. [[slnc 600]]
The mistake is found before the first customer, not by the first customer.
"""
rows = { factory = "active amber", config = "active wrong" }
console = [
    ["startup check: cannot create", "bad"],
    ["  ...$SandboxEmaler for Emailer", "bad"],
    ["found before the first customer", "ok"],
]

[[act]]
title = "The bill"
summary = "A misspelt class is a startup error, not a compile error; find usages of SandboxEmailer shows nothing."
detail = """
The compiler cannot see the wiring. A misspelt class name compiles and only
fails at startup. And searching the code for usages of `SandboxEmailer` finds
nothing, because it is only named in text files.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] The compiler cannot see the wiring. [[slnc 300]] A misspelt class name is a startup error, not a compile error. [[slnc 600]]
And if a developer searches the code for who uses the sandbox emailer, they find nothing. [[slnc 300]] It is only named in text files.
"""
rows = { config = "active amber" }
console = [
    ["misspelling: a startup error", "amber"],
    ["find usages: nothing", "amber"],
]

[animation]
subtitle = "Checkout names only interfaces; a configuration file per environment says which class plays each part."
boxes = [
    ["code", "Scattered ifs", "each picks its own"],
    ["config", "plugins-<env>.properties", "interface = class"],
    ["factory", "PluginFactory", "reads, creates, checks"],
    ["fake", "FakeGateway", "dev, staging"],
    ["sandbox", "SandboxEmailer", "dev, staging"],
    ["smtp", "SmtpEmailer", "prod only"],
]

[docs.problem]
scenario = """
The store runs in development, staging and production. Real payments and
emails must only happen in production.
"""
naive = """
`ScatteredChoices` picks each implementation with an `if` on the environment
name. Adding staging updated one choice and missed another, and staging sent a
real email.
"""
deliver = [
    "The missed choice shown: staging sending a real email.",
    "A configuration file per environment and a factory that reads it.",
    "Staging added as a file with no code change.",
    "A startup check that reports a misspelt class name.",
    "Every printed result asserted by a test.",
]

[docs.prerequisites]
required = [
    "Java basics: interfaces, classes.",
    "What a `.properties` file is: lines of `key=value`.",
]
not_required = [
    "Reflection in depth. One call, `Class.forName(...)`, is explained where it is used.",
    "Spring or any framework.",
]

[docs.session]
objectives = [
    "Explain the risk of choosing implementations with scattered ifs.",
    "Wire implementations from a configuration file.",
    "Add an environment without changing code.",
    "Check plugins at startup, and name what is lost.",
]
walkthrough = """
Run `./gradlew run` and read act one: a real email from staging. Open the three
`plugins-*.properties` files side by side. Then open `PluginFactory.get`: read
a line, create a class. End with `check`, and ask why it matters that it runs
at startup.
"""
exercises = [
    "Add a `TaxService` interface with a flat-rate and a real implementation, and configure both.",
    "Replace `PluginFactory` with Java's `ServiceLoader`. What changes in the files?",
    "Make the factory refuse to start production if any plugin name contains \"Fake\" or \"Sandbox\".",
]

[docs.explained]
sentence = """
Plugin lets the code ask only for interfaces while a configuration file per
environment names the class for each one, and a single factory creates them.
"""
verdict = """
Use it when implementations differ between environments or deployments. Keep
all the wiring in one factory, check every plugin at startup, and in a Spring
application use profiles instead of writing your own.
"""
recognise = [
    "`Class.forName(...)` next to a properties file.",
    "`META-INF/services` files and `ServiceLoader`.",
    "Spring profiles and `@Profile`.",
]

[spec]
purpose = """
Teach Plugin with an online store's environments: scattered ifs sending a
real email from staging, then per-environment properties files read by one
factory (dev fakes, prod real services), staging added as a file, a misspelt
class caught at startup, and the cost of invisible wiring.
"""
nongoals = [
    "Not a dependency injection framework.",
    "Not real payments or email. Implementations print what they would do.",
]
problem = """
Implementation choices scattered through the code as ifs on the environment
name drift apart, and a missed one sends real emails from a test environment.
"""
roles = [
    ["The pattern", "`PluginFactory`"],
    ["The configuration", "`plugins-dev`, `-staging`, `-prod`, `-demo.properties`"],
    ["The interfaces", "`Services.PaymentGateway`, `Services.Emailer`"],
    ["The implementations", "`Implementations`"],
    ["The naive version", "`ScatteredChoices`"],
    ["Entry point", "`PluginDemo`, five acts"],
]
requirements = [
    "**Interfaces only:** `Checkout` never names an implementation.",
    "**One place:** only `PluginFactory` creates plugins.",
    "**Safe environments:** dev and staging never get the real services, asserted.",
    "**Checked at startup:** every real environment passes; the demo's typo is reported.",
    "**Every printed result is asserted** in `DemoRunsTest`.",
]

