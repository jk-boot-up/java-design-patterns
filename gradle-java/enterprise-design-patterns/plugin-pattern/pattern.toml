[poster]
headline = [["PLUGIN", "text"]]
before = { code = "if (env.equals(\"dev\"))", note = "staging emailed customers", tag = "BEFORE" }
after = { code = "factory.get(Emailer.class)", note = "one file per environment", tag = "AFTER" }
taglines = [["Choose implementations by configuration", "gold"]]

[[scene]]
key = "01-poster"
kind = "poster"
title = "Plugin"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Plugin pattern, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] With plugins, the code only asks for what it needs by interface, such as a payment gateway. [[slnc 300]] A configuration file for each environment says which class plays that part. [[slnc 300]] And one factory creates it. [[slnc 600]]
Think of a theatre. [[slnc 300]] The script says Hamlet enters, but never which actor. [[slnc 300]] A cast sheet on the noticeboard says who plays each part tonight. [[slnc 300]] To change the actor, you change the sheet, not the script. [[slnc 700]]
In this video, the domain is an online shop. [[slnc 300]] It runs in development, staging, and production. [[slnc 300]] Only production may charge real cards, or send real emails. [[slnc 500]]
By the end, you will hear how scattered choices went wrong. [[slnc 300]] How plugins fix it. [[slnc 300]] How to add an environment without code. [[slnc 300]] And what you give up.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["Development, staging, production.", "", "Real card payments and real", "emails: production only.", "", "Each place chose its own", "implementation with an if."]
narration = """
Here is the scenario. [[slnc 400]] The shop runs in three environments. [[slnc 300]] Development on laptops. [[slnc 300]] Staging, for testing. [[slnc 300]] And production, for real customers. [[slnc 600]]
Real card payments and real emails must only happen in production. [[slnc 500]]
Every place in the code that needed a payment gateway or an emailer chose one itself, with an if statement on the environment's name.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["The code asks for interfaces.", "", "One file per environment:", "interface = class.", "", "One factory reads it, creates", "the objects, checks at startup."]
narration = """
Let's name the pattern. [[slnc 400]] The code only asks for interfaces. [[slnc 300]] Payment gateway. [[slnc 300]] Emailer. [[slnc 500]]
Each environment has one configuration file. [[slnc 300]] Each line says: this interface, that class. [[slnc 500]]
One factory reads the file, creates the objects, and checks them all when the shop starts.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["PaymentGateway, Emailer: interfaces", "Card, Fake, Smtp, Sandbox: classes", "plugins-<env>.properties: the cast sheet", "PluginFactory: reads and creates", "ScatteredChoices: the old way"]
narration = """
Here is who does what. [[slnc 400]] Payment gateway and emailer are the interfaces. [[slnc 500]]
Card gateway, fake gateway, SMTP emailer, and sandbox emailer are the classes that can play those parts. [[slnc 500]]
The properties files are the cast sheets, one per environment. [[slnc 500]]
The plugin factory reads the right sheet and creates the objects. [[slnc 300]] And scattered choices is the old way, kept for comparison.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Java's ServiceLoader", "Spring profiles", "JDBC drivers", "SLF4J logging bindings"]
narration = """
You have probably met this pattern already. [[slnc 400]] Java's service loader finds implementations listed in files. [[slnc 500]]
Spring profiles choose different beans for different environments. [[slnc 500]]
And J D B C drivers, and logging libraries such as SLF4J, pick their implementation the same way.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Implementations that differ", "between environments.", "", "All wiring in one factory.", "Check every plugin at startup.", "", "Using Spring? Use profiles."]
narration = """
So, when should you use it? [[slnc 400]] When implementations differ between environments or deployments. [[slnc 500]]
Keep all the wiring in one factory. [[slnc 300]] Check every plugin when the program starts. [[slnc 500]]
And if you already use Spring, use its profiles, rather than writing your own factory.
"""

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Refuse to start production", "with any fake plugin."]
narration = """
That's the Plugin pattern. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] The code names the part, and a file per environment names the actor. [[slnc 500]]
The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs offline, with nothing installed except a Java development kit. [[slnc 500]]
Here is one exercise to try. [[slnc 300]] Make the factory refuse to start production if any plugin is a fake. [[slnc 500]]
If this helped, a like really does help other people find it. [[slnc 300]] And subscribe, if you'd like the rest of the series. [[slnc 400]] Thanks for watching.
"""
