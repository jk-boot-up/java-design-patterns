plugins {
    id 'java'
    id 'application'
}

group = 'com.jk.explore'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Versions come from Spring Boot 4.1.1's own bill of materials, so
    // Hibernate, H2 and the JPA API are the ones that release was tested with.
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.1')
    implementation 'org.hibernate.orm:hibernate-core'
    runtimeOnly 'com.h2database:h2'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.jk.explore.identitymapjpa.CustomerJpaDemo'
}

test {
    useJUnitPlatform()
}
