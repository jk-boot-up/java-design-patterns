plugins {
    id 'java'
    id 'application'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.jk.explore'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot 4.1.1, the newest generally available release, with Spring JDBC: JdbcTemplate, row mappers,
    // exception translation and a HikariCP connection pool.
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'

    // H2, an in-memory database, so the demo needs nothing installed.
    runtimeOnly 'com.h2database:h2'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.jk.explore.tdgjdbc.JdbcTemplateGatewayDemo'
}

bootJar {
    mainClass = 'com.jk.explore.tdgjdbc.JdbcTemplateGatewayDemo'
}

test {
    useJUnitPlatform()
}
