[[scene]]
key = "01-poster"
kind = "poster"
title = "Table Data Gateway with JdbcTemplate"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Table Data Gateway pattern, with Spring's JdbcTemplate, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] A table data gateway is one class that holds all the SQL for one table. [[slnc 300]] Everyone else asks it, instead of writing their own. [[slnc 500]] JdbcTemplate is part of the open-source Spring framework, and it takes care of the database plumbing. [[slnc 600]]
Think of a library's front desk. [[slnc 300]] Nobody walks into the stacks. [[slnc 300]] You ask the desk, and it fetches and returns books the same careful way every time. [[slnc 700]]
In this video, the domain is an online shop's product table. [[slnc 500]]
By the end, you will hear how hand-written database code leaks. [[slnc 300]] How the gateway keeps SQL in one place. [[slnc 300]] And what errors, and stock, look like with Spring.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["Product page, stock report,", "checkout: each wrote its own JDBC.", "", "One never closed its connections.", "", "A rename broke them all."]
narration = """
Here is the scenario. [[slnc 400]] The product page, the stock report, and checkout each wrote their own database code. [[slnc 500]]
One page borrowed connections, and never gave them back. [[slnc 500]]
And a renamed column broke them all at once.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern, with JdbcTemplate"
body = ["One gateway per table.", "", "JdbcTemplate: borrow, run, return.", "Row mappers: rows to records.", "Spring exceptions."]
narration = """
Let's name the pattern, with Spring. [[slnc 400]] One gateway class for each table. [[slnc 500]]
JdbcTemplate borrows a connection, runs the SQL, and always returns it. [[slnc 300]] A row mapper turns each row into a record. [[slnc 500]]
And errors come back as Spring's own exceptions.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
