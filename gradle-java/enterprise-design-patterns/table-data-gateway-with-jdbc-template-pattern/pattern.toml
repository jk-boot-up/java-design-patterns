narration = """
You have probably met this already. [[slnc 400]] Spring repository classes, built on JdbcTemplate. [[slnc 500]]
Spring Data JDBC and jOOQ, which generate or check the SQL for you. [[slnc 500]]
And data access objects, the older name for the same idea.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
