# pattern.toml for the Table Data Gateway with Spring JdbcTemplate project. See tools/patternkit.

[project]
slug = "table-data-gateway-with-jdbc-template"
category = "enterprise-design-patterns"
title = "Table Data Gateway with JdbcTemplate"
package = "tdgjdbc"
main_class = "JdbcTemplateGatewayDemo"
tagline = "One class of SQL, Spring does the plumbing"
bold = "Keep all the product table's SQL in one gateway class built on Spring's JdbcTemplate, which borrows and returns connections, maps rows to records, and turns database errors into meaningful exceptions."
domain_note = ""
thumb_lines = ["TABLE DATA GATEWAY", "WITH JDBCTEMPLATE"]
thumb_code = "jdbc.query(sql, rowMapper)"
youtube_title = "Table Data Gateway with Spring JdbcTemplate"
youtube_tags = ["table data gateway", "jdbctemplate", "spring jdbc", "sql", "data access", "java"]

[readme]
intro = """
This is the framework version of the Table Data Gateway pattern. The plain
Java version, a separate project in this category, writes JDBC by hand inside
its gateway. Here Spring's JdbcTemplate does the plumbing, with an in-memory H2
database and a real HikariCP connection pool, so nothing has to be installed.

The gateway, a Spring `@Repository`, still owns every piece of SQL for the
product table. JdbcTemplate borrows a connection for each call and always
gives it back, `DataClassRowMapper` fills the `Row` record by column name, and
Spring translates database errors into its own exception types, such as
`BadSqlGrammarException` and `DuplicateKeyException`, whatever the database.
"""
analogy = """
Think of a library's front desk. Nobody walks into the stacks: you ask the
desk, and the desk fetches and returns books the same careful way every time.
If the library moves a shelf, only the desk staff need to know.
"""
scenario = """
The online store's product page, stock report and checkout each wrote their
own JDBC against the product table. One page borrowed database connections
and never gave them back, and every page broke at once when a column was
renamed.
"""
test_note = """
Every result the demo prints is asserted, with Spring's JdbcTemplate, a
HikariCP pool and an in-memory H2 database.
"""
run_note = """
Nothing to install beyond a Java 21 JDK: Spring Boot, the connection pool and
an in-memory H2 database all run inside the program.
"""
twin = """
The plain Java version got the idea right: all of one table's SQL in one
class, callers receiving plain rows, and a schema change fixed in one place.
What it left out is the plumbing a framework takes over, and why it matters.
Hand-written JDBC that forgot to close drained a real pool of two
connections, and the third page failed after 0.25 seconds; JdbcTemplate
served four requests on the same pool without a leak. Spring also translates
errors: a renamed column became BadSqlGrammarException, and a repeated key
DuplicateKeyException, the same on any database.
"""
technologies = [
    ["Spring Boot", "4.1.1", "starts the pool and the database"],
    ["Spring JDBC", "with Spring Boot 4.1.1", "NamedParameterJdbcTemplate, DataClassRowMapper, exception translation"],
    ["HikariCP", "with Spring Boot 4.1.1", "the connection pool, sized to 2"],
    ["H2", "with Spring Boot 4.1.1", "the in-memory database"],
]
costs = [
    "**Rows, not objects with rules.** A Row is data only; \"low on stock\" must be decided by each caller.",
    "**A method per question.** The gateway grows with every question anyone asks the table.",
    "**SQL is still text.** Mistakes appear only when the query runs, as a BadSqlGrammarException.",
]
too_much = """
For one or two queries, calling JdbcTemplate directly is fine. A gateway pays
off when several parts of the code use the same table and its SQL should
live in one place.
"""
met_before = [
    "Spring `@Repository` classes built on `JdbcTemplate`.",
    "Spring Data JDBC and jOOQ, which generate or type the SQL.",
    "DAO classes, the older name for the same idea.",
]
where = """
This project is in [enterprise-design-patterns](..). It is the framework
version of the plain Java Table Data Gateway project in the same category,
which is left unchanged.
"""

[[act]]
title = "Hand-written JDBC that leaks"
summary = "A page that never closes its connection runs twice on a pool of 2; the third call fails after 0.25 s because the pool is empty."
detail = """
A product page writes its own JDBC and forgets to close the connection it
borrowed from the pool. The pool holds two connections. The page works twice,
and the third time it waits a quarter of a second for a connection that will
never come back, and fails.
"""
speech = """
First demo: every page writes its own database code. [[slnc 400]] One page borrows a connection from the pool, and never gives it back. [[slnc 600]]
The pool holds two connections. [[slnc 300]] The page works twice. [[slnc 500]]
The third time, there are none left. [[slnc 300]] After a quarter of a second, it fails.
"""
rows = { pages = "active wrong", pool = "active wrong" }
console = [
    ["page 1, page 2: served, not closed", "amber"],
    ["page 3: FAILED, pool empty", "bad"],
]

[[act]]
title = "A gateway on JdbcTemplate"
summary = "The gateway serves the product page 4 times on the same pool of 2, the stock report and a cheaper-than-£10 list; no leaks."
detail = """
Now all the product SQL lives in one gateway built on JdbcTemplate. The
product page is asked four times on the same pool of two, and works every
time, because JdbcTemplate always returns the connection. The stock report
finds one product out of stock, and the cheaper-than-£10 list is the mug and
the tea towel, each row mapped to a Row record by column name.
"""
speech = """
Second demo: a table data gateway, built on JdbcTemplate. [[slnc 400]] All the product table's SQL, in one class. [[slnc 600]]
The product page is asked four times, on the same pool of two. [[slnc 300]] It works every time. [[slnc 300]] JdbcTemplate always gives the connection back. [[slnc 600]]
One product is out of stock. [[slnc 300]] And under ten pounds, the mug and the tea towel.
"""
rows = { gateway = "active ok", pool = "active ok" }
console = [
    ["4 requests on a pool of 2: fine", "ok"],
    ["under £10: mug, tea towel", "ok"],
]

[[act]]
title = "Errors that mean something"
summary = "A renamed column gives BadSqlGrammarException; a second MUG-1 gives DuplicateKeyException, whatever the database."
detail = """
The column is renamed behind the gateway's back, and the next query fails
with Spring's BadSqlGrammarException rather than a vendor's error code. A
second product with the key MUG-1 fails with DuplicateKeyException. The same
exception types come back whatever database is used, so callers can react to
them.
"""
speech = """
Third demo: errors that mean something. [[slnc 400]] A column is renamed, behind the gateway's back. [[slnc 300]] The next query fails, with Spring's bad SQL error. [[slnc 600]]
A second mug with the same code. [[slnc 300]] A duplicate key error. [[slnc 500]]
The same kinds of error, whatever the database. [[slnc 300]] So callers can react to them.
"""
rows = { gateway = "active amber" }
console = [
    ["renamed column: BadSqlGrammarException", "amber"],
    ["second MUG-1: DuplicateKeyException", "amber"],
]

[[act]]
title = "Stock in one statement"
summary = "4 customers try for 2 desk lamps: 2 are taken and stock ends at 0, with UPDATE ... WHERE quantity > 0."
detail = """
Four customers try for the two desk lamps. The gateway takes stock in one
statement, UPDATE ... WHERE quantity > 0, and reports whether a row changed.
Two are taken, stock ends at zero, and it can never go below.
"""
speech = """
Fourth demo: stock taken in one statement. [[slnc 400]] Four customers try for two desk lamps. [[slnc 600]]
The gateway takes one only if the quantity is above zero, in the same statement. [[slnc 500]]
Two are taken. [[slnc 300]] Stock ends at zero. [[slnc 300]] It can never go below.
"""
rows = { gateway = "active ok" }
console = [
    ["4 tries, 2 lamps: 2 taken, stock 0", "ok"],
]

[[act]]
title = "The bill"
summary = "A Row is data only, the gateway grows a method per question, and its SQL is still text checked only when it runs."
detail = """
A Row is only data: whether a product is low on stock is still decided by
each caller. The gateway grows a method for every question anyone asks the
table. And its SQL is still text, checked only when it runs.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] A row is only data. [[slnc 300]] Whether a product is low on stock is still decided by each caller. [[slnc 600]]
The gateway grows a method for every question. [[slnc 300]] And its SQL is still text, only checked when it runs.
"""
rows = { gateway = "active amber" }
console = [
    ["rows, not rules", "amber"],
    ["SQL checked only at run time", "amber"],
]

[animation]
subtitle = "Pages ask one gateway; JdbcTemplate borrows and returns connections from a pool of two."
boxes = [
    ["pages", "Pages", "product, report, checkout"],
    ["gateway", "ProductGateway", "all the SQL"],
    ["pool", "HikariCP pool", "2 connections"],
]

[docs.problem]
scenario = """
The product page, stock report and checkout each wrote their own JDBC.
"""
naive = """
Hand-written JDBC leaks connections when a close is forgotten, and scatters
SQL that breaks together on a schema change.
"""
deliver = [
    "A connection leak draining a real pool.",
    "A gateway on JdbcTemplate with row mapping.",
    "Spring's translated exceptions.",
