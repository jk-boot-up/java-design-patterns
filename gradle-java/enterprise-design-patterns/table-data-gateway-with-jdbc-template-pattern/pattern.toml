]

[docs.dependencies]
intro = """
This project uses Spring's JDBC support, which the plain Java version of Table
Data Gateway does not. Skipping it loses none of the pattern: the plain
version teaches all of it with nothing installed.
"""
what = [
    ["Spring JDBC", "JdbcTemplate runs SQL for you: it borrows a connection, runs the statement, reads the results and always returns the connection. NamedParameterJdbcTemplate lets SQL use named parameters such as :sku. A row mapper turns each result row into an object; DataClassRowMapper fills a record by matching column names. Spring translates database errors into its DataAccessException family, such as BadSqlGrammarException and DuplicateKeyException."],
    ["HikariCP and H2", "HikariCP is the connection pool Spring Boot uses: a fixed set of open database connections that code borrows and returns. H2 is a small database, here running entirely in memory, created from schema.sql at start."],
]
why = """
The plain version writes the plumbing by hand. This version shows what most
Spring code uses, and the leaks and error codes it takes off your hands.
"""
install_note = "Only a JDK, version 21. Gradle downloads the rest, and the versions are pinned:"
versions = [
    ["Java", "21"],
    ["Spring Boot (jdbc starter, H2)", "4.1.1"],
]
costs = [
    "A framework to start, even for a few queries.",
]

[docs.session]
objectives = [
    "Write a table data gateway with NamedParameterJdbcTemplate.",
    "Map rows to records with DataClassRowMapper.",
    "Explain why JdbcTemplate cannot leak connections.",
    "Catch Spring's translated exceptions.",
]
walkthrough = """
Run `./gradlew run`. Compare act one's failed third page with act two's four
requests. Open `ProductGateway`: every method is one call. Open
`ScatteredJdbc`: the missing close.
"""
exercises = [
    "Add a method for products low on stock, and discuss where \"low\" belongs.",
    "Use SimpleJdbcInsert for the insert.",
    "Point the gateway at PostgreSQL and check the same exceptions come back.",
]

[docs.explained]
sentence = """
With JdbcTemplate, a table data gateway keeps one table's SQL in one class
while Spring handles connections, row mapping and error translation.
"""
verdict = """
Use a JdbcTemplate gateway when several parts of the code share a table and
you want plain SQL with safe plumbing. Map to records, catch Spring's
exceptions, and keep business rules out of the gateway.
"""
recognise = [
    "`@Repository` classes holding `JdbcTemplate` calls.",
    "`jdbc.query(sql, params, rowMapper)`.",
    "`catch (DuplicateKeyException e)`.",
]

[spec]
purpose = """
Teach Table Data Gateway with Spring JdbcTemplate: a leaking hand-written page,
a gateway serving the same pool safely, translated exceptions, an atomic
stock update, and the cost of rows without rules.
"""
nongoals = [
    "Not an ORM. Plain SQL through JdbcTemplate.",
]
problem = """
Hand-written JDBC scattered across callers leaks connections and breaks
together.
"""
roles = [
    ["The pattern", "`ProductGateway`"],
    ["The data", "`Row`"],
    ["The old way", "`ScatteredJdbc`"],
    ["Entry point", "`JdbcTemplateGatewayDemo`, five acts"],
]
requirements = [
    "**No leaks:** four gateway calls succeed on a pool of two.",
    "**Translated:** a bad column gives BadSqlGrammarException.",
    "**Atomic:** stock never goes below zero.",
    "**Every printed result is asserted** in `DemoRunsTest`.",
]

