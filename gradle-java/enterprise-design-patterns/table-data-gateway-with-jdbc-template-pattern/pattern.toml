narration = """
Here is who does what. [[slnc 400]] The product gateway holds all the SQL for the product table. [[slnc 500]]
A row is one product's data. [[slnc 500]]
Scattered JDBC is the old way, with its missing close. [[slnc 300]] And the pool holds just two connections, to make the leak visible.
"""

[[scene]]
key = "06-recognise"
