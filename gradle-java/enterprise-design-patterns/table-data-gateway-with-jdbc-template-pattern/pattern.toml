narration = """
So, when should you use it? [[slnc 400]] When several parts of the code share a table. [[slnc 500]]
Keep plain SQL, and let Spring handle the plumbing. [[slnc 300]] Map rows to records. [[slnc 300]] And keep business rules out of the gateway.
"""

