[poster]
headline = [["PAGE", "text"], ["CONTROLLER", "text"]]
before = { code = "if (path.equals(...))", note = "one change broke a page", tag = "BEFORE" }
after = { code = "/basket -> BasketController", note = "each page on its own", tag = "AFTER" }
taglines = [["One controller per page", "gold"]]

[[scene]]
key = "01-poster"
kind = "poster"
title = "Page Controller"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Page Controller pattern, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] A page controller is a small class for one page of a web site. [[slnc 300]] It reads that page's input, decides what to do, and sends the reply. [[slnc 300]] Every page gets its own. [[slnc 600]]
Think of a department store with a separate desk for each service. [[slnc 300]] A returns desk, a gift-wrapping desk, a café till. [[slnc 300]] Each knows only its own job. [[slnc 300]] But a store-wide rule has to be taught at every desk. [[slnc 700]]
In this video, the domain is an online shop's web site. [[slnc 300]] It has a product page, a basket, and a checkout, served by a real web server running on the same computer. [[slnc 500]]
By the end, you will hear how one handler for every page lets changes leak. [[slnc 300]] How page controllers fix it. [[slnc 300]] How to add a page. [[slnc 300]] And the check that gets forgotten.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["/product: show a product.", "/basket: add to the basket.", "/checkout: pay.", "", "All served by one handler,", "in one long method."]
narration = """
Here is the scenario. [[slnc 400]] The shop's web site has three addresses. [[slnc 300]] Product shows a product. [[slnc 300]] Basket adds something to the basket. [[slnc 300]] Checkout takes payment. [[slnc 600]]
All three were served by one handler. [[slnc 300]] One long method, that looked at the address and chose what to do.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["One small controller per page.", "", "It reads its own input,", "makes its own decisions,", "sends its own reply.", "", "The server maps address -> controller."]
narration = """
Let's name the pattern. [[slnc 400]] Give each page its own small controller. [[slnc 500]]
The controller reads that page's input. [[slnc 300]] It makes that page's decisions. [[slnc 300]] And it sends that page's reply. [[slnc 500]]
The web server keeps a simple map: this address goes to that controller.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["HttpServer: address -> controller", "ProductController: /product", "BasketController: /basket", "CheckoutController: /checkout", "OneHandler: the old way"]
narration = """
Here is who does what. [[slnc 400]] The JDK's built-in web server maps each address to a controller. [[slnc 500]]
Product controller serves the product page. [[slnc 300]] Basket controller serves the basket, and checks the login. [[slnc 300]] Checkout controller serves checkout. [[slnc 500]]
And one handler is the old way, kept for comparison.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["A JSP or PHP file per page", "One servlet per URL", "Spring MVC @Controller classes", "HttpServer.createContext"]
narration = """
You have probably met this pattern already. [[slnc 400]] Classic web sites with one JSP or PHP file per page are page controllers. [[slnc 500]]
So are servlets mapped one per address. [[slnc 500]]
And Spring M V C controller classes, with a method for each page, are the modern form.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Simple sites with mostly", "independent pages.", "", "Many shared checks?", "Use a Front Controller", "or filters."]
narration = """
So, when should you use it? [[slnc 400]] For simple sites, where the pages are mostly independent. [[slnc 500]]
As soon as many pages share checks, logging, or layout, move those into a front controller, or into filters. [[slnc 300]] Then they run for every page, and cannot be forgotten.
"""

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add the missing", "login check to checkout."]
narration = """
That's the Page Controller pattern. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] One small controller per page, and each page looks after itself. [[slnc 500]]
The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs offline, with nothing installed except a Java development kit. [[slnc 500]]
Here is one exercise to try. [[slnc 300]] Add the missing login check to checkout, and a test that proves it. [[slnc 500]]
If this helped, a like really does help other people find it. [[slnc 300]] And subscribe, if you'd like the rest of the series. [[slnc 400]] Thanks for watching.
"""
