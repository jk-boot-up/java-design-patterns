# pattern.toml for the Page Controller project. See tools/patternkit.

[project]
slug = "page-controller"
category = "enterprise-design-patterns"
title = "Page Controller"
package = "pagecontroller"
main_class = "PageControllerDemo"
tagline = "One controller per page"
bold = "Give every page of a web site its own small controller that reads that page's input, decides what to do and sends the reply, instead of one handler for everything."
youtube_description = """Page Controller pattern in Java, explained with an online store web site that has a product page, a basket and a checkout, served by a real web server. A page controller is a small class for one page: it reads that page's input, decides what to do, and sends the reply, like separate desks in a department store that each know only their own job. We watch one handler for every page let changes leak between pages, give each page its own controller, keep errors on their own page, and add a new page. We finish with the bill: a check every page needs is easy to forget."""
domain_note = ""
thumb_lines = ["PAGE", "CONTROLLER"]
thumb_code = "/basket -> BasketController"
youtube_title = "Page Controller"
youtube_tags = ["page controller", "web patterns", "http", "enterprise patterns", "front controller", "java"]

[readme]
intro = """
Page Controller is one of Martin Fowler's web presentation patterns. Each page
or action of a web site, such as the product page or the basket, gets its own
controller: a small class that reads that page's input, decides what to do,
and sends the reply. The web server maps each address to its controller.

Each page's logic lives in one place, errors stay on their page, and adding a
page means adding a class. The price is that checks every page needs, such as
"is the customer logged in?", are repeated in each controller.
"""
analogy = """
Think of a department store with a separate desk for each service: a returns
desk, a gift-wrapping desk, a café till. Each desk knows only its own job, and
a queue at one does not slow the others. But a store-wide rule, "check the
receipt", has to be taught at every desk, and one desk will eventually forget.
"""
scenario = """
The online store's web site has a product page, a basket and a checkout. They
were all served by one handler that chose what to do by looking at the
address, in one long method. Someone added quantity parsing at the top of it
for the basket, and the product page, which has no quantity, started failing.
"""
costs = [
    "**Shared checks are repeated.** The login check is written in each controller that needs it; checkout's author forgot.",
    "**Common code needs a home.** Logging, headers and error pages end up copied or in a base class.",
    "**Many small classes.** One per page or action.",
]
too_much = """
When most pages share a lot of handling (authentication, logging, layout,
error pages), a Front Controller that runs the shared steps once and then
hands over to page commands is a better fit. Page Controller suits sites where
pages are simple and mostly independent.
"""
met_before = [
    "Classic JSP and PHP pages, where each file handles one page.",
    "Servlets mapped one per URL in `web.xml`.",
    "Spring MVC `@Controller` classes with one handler method per page.",
    "`HttpServer.createContext(path, handler)` in the JDK.",
]
where = """
This project is in [enterprise-design-patterns](..), next to
[Front Controller](../front-controller-pattern), which puts the shared steps
in one place and fixes this pattern's forgotten-check problem, and near
[MVC](../../architectural-design-patterns/mvc-pattern), where controllers
first appeared.
"""

[[act]]
title = "One handler for every page"
summary = "The basket works, but the product page returns 500: quantity parsing added for the basket runs for every page."
detail = """
`OneHandler` serves every address from one method. Quantity parsing was added
at the top for the basket. The basket answers `200 basket: 2 x MUG-1`, but the
product page has no quantity, and now returns `500 server error:
NumberFormatException`.
"""
speech = """
First demo: one handler for every page. [[slnc 400]] The product page, the basket, and every other address go through one long method. [[slnc 500]]
Someone added a line at the top, to read the quantity, for the basket. [[slnc 500]]
The basket works: two mugs. [[slnc 500]]
But the product page has no quantity. [[slnc 300]] It now fails with a server error. [[slnc 300]] A change for one page broke another.
"""
rows = { one = "active wrong", basket = "active ok", product = "active wrong" }
console = [
    ["/basket?add=MUG-1&qty=2  -> 200", "ok"],
    ["/product?sku=KETTLE-1   -> 500", "bad"],
    ["  NumberFormatException", "bad"],
]

[[act]]
title = "A controller per page"
summary = "ProductController, BasketController and CheckoutController each serve one address; the product page and basket both work."
detail = """
Each address now has its own controller, registered with the JDK's web server:
`/product` to `ProductController`, `/basket` to `BasketController`,
`/checkout` to `CheckoutController`. The product page shows the kettle, and
the basket takes two mugs.
"""
speech = """
Second demo: a page controller for each page. [[slnc 400]] The product page has its own small class. [[slnc 300]] So does the basket. [[slnc 300]] So does checkout. [[slnc 500]]
The web server sends each address to its controller. [[slnc 500]]
The product page shows the steel kettle, thirty pounds. [[slnc 300]] The basket takes two mugs. [[slnc 300]] Both work.
"""
rows = { product = "active ok", basket = "active ok", server = "active ok" }
console = [
    ["/product?sku=KETTLE-1   -> 200", "ok"],
    ["  steel kettle, £30.00", "ok"],
    ["/basket?add=MUG-1&qty=2 -> 200", "ok"],
]

[[act]]
title = "Errors stay on their page"
summary = "An unknown product is 404 from the product page; qty=two is 400 from the basket; the product page still works."
detail = """
Each controller reads and checks its own input. An unknown product gives
`404 no product SOFA-9`, from the product controller only. A quantity of "two"
gives `400 quantity must be a number`, from the basket only. The product page
for the mug still answers 200.
"""
speech = """
Third demo: each page handles its own input, and its own errors. [[slnc 400]] A customer asks for a product that does not exist. [[slnc 300]] The product page answers four oh four: no such product. [[slnc 500]]
Someone types the word two as a quantity. [[slnc 300]] The basket answers four hundred: quantity must be a number. [[slnc 500]]
And the product page for the mug still works.
"""
rows = { product = "active amber", basket = "active amber" }
console = [
    ["/product?sku=SOFA-9 -> 404", "ok"],
    ["/basket ... qty=two -> 400", "ok"],
    ["/product?sku=MUG-1  -> 200", "ok"],
]

[[act]]
title = "A new page"
summary = "ReviewsController is one new class and one registration line: /reviews answers 4.5 stars from 12 customers."
detail = """
A reviews page is added: one new class, `ReviewsController`, and one line
registering `/reviews`. No other controller is opened, and the page answers
"4.5 stars from 12 customers".
"""
speech = """
Fourth demo: a new page is a new class, and one line. [[slnc 400]] The shop adds a reviews page. [[slnc 300]] One new controller, and one line telling the server about it. [[slnc 500]]
The reviews page answers: four point five stars, from twelve customers. [[slnc 300]] No other controller was touched.
"""
rows = { reviews = "active ok", server = "active ok" }
console = [
    ["/reviews?sku=KETTLE-1 -> 200", "ok"],
    ["  4.5 stars from 12 customers", "ok"],
]

[[act]]
title = "The bill"
summary = "Not logged in: the basket says 401, but checkout says 200, because its author forgot the login check."
detail = """
Checks that every page needs are written in every controller. The basket
repeats the login check and answers `401 please log in`. The checkout
controller's author forgot it, so checkout answers 200 to a visitor who is not
logged in. Front Controller exists to fix exactly this.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] Checks that every page needs are written in every controller. [[slnc 500]]
A visitor who is not logged in opens the basket. [[slnc 300]] Four oh one: please log in. [[slnc 500]]
The same visitor opens checkout. [[slnc 300]] Two hundred: pay with the card on file. [[slnc 300]] Checkout's author forgot the login check. [[slnc 600]]
The Front Controller pattern exists to fix exactly this.
"""
rows = { basket = "active ok", checkout = "active wrong" }
console = [
    ["/basket, not logged in   -> 401", "ok"],
    ["/checkout, not logged in -> 200", "bad"],
    ["checkout forgot the login check", "bad"],
]

[animation]
subtitle = "Each page of the shop has its own small controller; the web server sends each address to its controller."
boxes = [
    ["one", "One handler", "every page, one method"],
    ["server", "JDK web server", "address -> controller"],
    ["product", "ProductController", "/product"],
    ["basket", "BasketController", "/basket, checks login"],
    ["checkout", "CheckoutController", "/checkout, forgot login"],
    ["reviews", "ReviewsController", "/reviews, added later"],
]

[docs.problem]
scenario = """
The shop's web site has a product page, a basket and a checkout, served over
HTTP.
"""
naive = """
`OneHandler` serves every page from one method. Code added at the top for one
page (quantity parsing for the basket) runs for all of them, and the product
page fails with a 500.
"""
deliver = [
    "The shared-method failure shown: a 500 on the product page.",
    "One controller per page, registered with the JDK's HTTP server.",
    "Input errors answered by the page they belong to (404, 400).",
    "A new page added as one class and one line.",
    "The cost shown: a forgotten login check on checkout.",
    "Every response asserted by a test, over real HTTP on localhost.",
]

[docs.prerequisites]
required = [
    "Java basics: classes, interfaces, exceptions.",
    "HTTP basics: a path, a query string, status codes 200, 400, 401, 404, 500.",
]
not_required = [
    "Servlets or Spring MVC. The JDK's own `HttpServer` is used.",
]

[docs.session]
objectives = [
    "Explain how one shared handler lets changes leak between pages.",
    "Write a controller per page with its own input handling.",
    "Add a page without touching the others.",
    "Name the cost that leads to Front Controller.",
]
walkthrough = """
Run `./gradlew run` and read act one: a change for the basket broke the
product page. Open `OneHandler` and find the line. Then open `Controllers`:
four small classes. End on act five and search the four classes for
`loggedIn`: which one is missing it?
"""
exercises = [
    "Add the login check to CheckoutController, and a test that fails without it.",
    "Move the login check into a base class. What happens to controllers that do not need it?",
    "Add a `/search?q=` page that lists matching products.",
]

[docs.explained]
sentence = """
A page controller is a small class for one page or action of a web site that
reads that page's input, decides what to do and sends the reply.
"""
verdict = """
Use page controllers for simple sites whose pages are mostly independent. As
soon as many pages share checks, logging or layout, move those into a Front
Controller or filters so they cannot be forgotten.
"""
recognise = [
    "One class or file per URL: `ProductController`, `product.jsp`, `product.php`.",
    "`createContext(\"/basket\", ...)` or one servlet per path.",
    "The same login check at the top of many controllers.",
]

[spec]
purpose = """
Teach Page Controller with an online store's web pages on the JDK's HTTP
server: one shared handler failing the product page with a 500, then a
controller per page, errors answered by their own page (404, 400), a reviews
page added as one class, and a forgotten login check on checkout.
"""
nongoals = [
    "Not HTML. Replies are plain text.",
    "Not real sessions. A cookie header stands in for a login.",
]
problem = """
One handler for every page lets a change made for one page break another, and
keeps every page's logic in one long method.
"""
roles = [
    ["The pattern", "`Controllers.ProductController`, `BasketController`, `CheckoutController`, `ReviewsController`"],
    ["The web server", "JDK `HttpServer`, `Web`"],
    ["The naive version", "`OneHandler`"],
    ["Entry point", "`PageControllerDemo`, five acts"],
]
requirements = [
    "**Real HTTP:** every request goes over localhost to the JDK's server.",
    "**One page, one class:** each address maps to its own controller.",
    "**Local errors:** 404 and 400 come from the page they belong to.",
    "**Honest cost:** the forgotten login check is shown and asserted.",
    "**Every response is asserted** in `DemoRunsTest`.",
]

