]

[docs.problem]
scenario = """
Checkout turns postcodes into addresses with a paid external service that
needs the network.
"""
naive = """
Developers call the real service for every test checkout: £2.50 and 20 seconds
a day, no work possible offline, and no way to test an outage.
"""
deliver = [
    "The cost of developing against the real service shown.",
    "A stub behind the same gateway interface: free, instant, offline.",
    "Unknown postcodes and outages played on demand.",
    "A contract check that finds the stub's small-letters difference.",
    "Every printed result asserted by a test.",
]

[docs.prerequisites]
required = [
    "Java basics: interfaces, `Optional`, exceptions.",
]
not_required = [
    "HTTP or any real postcode service.",
    "WireMock or Pact. They are named, not used.",
]

[docs.session]
objectives = [
    "Put an external service behind a gateway interface.",
    "Write a stub that answers like the real service.",
    "Use the stub to test failures on demand.",
    "Keep the stub honest with a contract check.",
]
walkthrough = """
Run `./gradlew run` and read act one: money and time spent on lookups. Open
`AddressGateway` (one method) and `PostcodeStub` (a map and a switch). Finish
on act four: show that `ContractCheck` is the only thing that noticed the
small-letters difference.
"""
exercises = [
    "Fix the stub so it refuses small letters, like the real service.",
    "Make checkout turn postcodes into capitals before looking them up. Does the contract check still find a difference?",
    "Give the stub a 'slow' mode that takes 3 seconds, and add a timeout to checkout.",
]

[docs.explained]
sentence = """
A service stub is a small in-memory stand-in for an external service, behind
the same gateway interface, used in development and tests and checked against
the real service regularly.
"""
verdict = """
Stub services that are slow, paid, unreliable or unavailable offline. Keep
them behind a gateway interface, let them play failures on demand, and run a
contract check against the real service on a schedule.
"""
recognise = [
    "Classes named `...Stub`, `Fake...` or `InMemory...` implementing a gateway.",
    "WireMock or MockServer mappings in a test folder.",
    "A \"sandbox\" or \"test mode\" setting for an external provider.",
]

[spec]
purpose = """
Teach Service Stub with an online store's postcode lookup: the real service
costing £2.50 and 20 s a day and failing offline, a stub behind the same
gateway, unknown postcodes and outages on demand, and a contract check that
finds the stub accepting small letters the real service refuses.
"""
nongoals = [
    "Not HTTP. The real service is simulated in memory.",
    "Not a contract-testing framework. Pact is named, not used.",
]
problem = """
Developing and testing against a paid, slow, networked service costs money
and time, fails offline, and cannot produce failures on demand.
"""
roles = [
    ["The gateway", "`AddressGateway`"],
    ["The pattern", "`PostcodeStub`"],
    ["The real service", "`PostcodeService`"],
    ["Keeping it honest", "`ContractCheck`"],
    ["The client", "`Checkout`"],
    ["Entry point", "`ServiceStubDemo`, five acts"],
]
requirements = [
    "**Same interface:** stub and real service both implement `AddressGateway`.",
    "**Free and offline:** the stub costs nothing and needs no network.",
    "**Failures on demand:** unknown postcodes and outages can be played.",
    "**Checked:** the contract check reports the one difference.",
    "**Every printed result is asserted** in `DemoRunsTest`.",
]

