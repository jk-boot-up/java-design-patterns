after = { code = "new PostcodeStub()", note = "free, instant, offline", tag = "AFTER" }
taglines = [["Develop without the real service", "gold"]]

[[scene]]
key = "01-poster"
kind = "poster"
title = "Service Stub"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Service Stub pattern, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] A service stub is a small, free stand-in for an outside service, such as a paid address lookup. [[slnc 300]] It sits behind the same interface, and answers like the real one. [[slnc 300]] You use it while developing and testing. [[slnc 600]]
Think of a flight simulator. [[slnc 300]] Pilots practise in it every day, for free. [[slnc 300]] It can give them an engine failure on demand. [[slnc 300]] But it is only useful while it behaves like the real plane, so it is checked against the real aircraft. [[slnc 700]]
In this video, the domain is an online shop. [[slnc 300]] At checkout, it turns a postcode into an address, using a paid outside service. [[slnc 500]]
By the end, you will hear what developing against the real service costs. [[slnc 300]] How a stub fixes it. [[slnc 300]] How to test failures on demand. [[slnc 300]] And how to keep a stub honest.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["Checkout: postcode to address.", "", "An outside postcode service:", "5p and 400 ms per lookup,", "needs the network."]
narration = """
Here is the scenario. [[slnc 400]] At checkout, the customer types a postcode, and the shop fills in the address. [[slnc 500]]
To do that, it asks an outside postcode service. [[slnc 300]] Each lookup costs five pence. [[slnc 300]] It takes four hundred milliseconds. [[slnc 300]] And it needs the network. [[slnc 500]]
Developers were calling it for every test checkout.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["Put the service behind a", "gateway interface.", "", "In development and tests:", "a stub, in memory.", "", "Weekly: compare stub and real."]
narration = """
Let's name the pattern. [[slnc 400]] Put the outside service behind a small gateway interface. [[slnc 500]]
In development and in tests, plug in a stub. [[slnc 300]] A small class, in memory, that answers like the real service. [[slnc 500]]
And regularly, ask the stub and the real service the same questions, to check they still agree.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["AddressGateway: the interface", "PostcodeService: the real one", "PostcodeStub: the stand-in", "ContractCheck: keeps it honest", "Checkout: the client"]
narration = """
Here is who does what. [[slnc 400]] Address gateway is the interface: a postcode in, an address out. [[slnc 500]]
Postcode service is the real, paid service. [[slnc 300]] Postcode stub is the stand-in, with a few postcodes, and a switch to pretend it is down. [[slnc 500]]
The contract check compares the two. [[slnc 300]] And checkout is the client, which knows only the interface.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["WireMock, MockServer", "Payment sandboxes and test modes", "LocalStack for cloud services", "Pact contract tests"]
narration = """
You have probably met this pattern already. [[slnc 400]] WireMock and MockServer stand in for web services during tests. [[slnc 500]]
Payment providers offer sandboxes and test modes. [[slnc 300]] LocalStack stands in for cloud services on a laptop. [[slnc 500]]
And Pact, and other contract-testing tools, check that stubs still match the real thing.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Stub services that are slow,", "paid, unreliable or online-only.", "", "Let stubs play failures.", "Run a contract check on", "a schedule."]
narration = """
So, when should you use it? [[slnc 400]] Stub outside services that are slow, paid, unreliable, or only available online. [[slnc 500]]
Let the stub play failures on demand. [[slnc 300]] And run a contract check against the real service on a schedule. [[slnc 500]]
Do not stub your own code just to make tests quicker. [[slnc 300]] Stub what is genuinely outside your control.
"""

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Fix the stub so the", "contract check passes."]
narration = """
That's the Service Stub pattern. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Develop against a free stand-in, and check it against the real thing. [[slnc 500]]
The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs offline, with nothing installed except a Java development kit. [[slnc 500]]
Here is one exercise to try. [[slnc 300]] Fix the stub so it refuses small letters, and watch the contract check pass. [[slnc 500]]
If this helped, a like really does help other people find it. [[slnc 300]] And subscribe, if you'd like the rest of the series. [[slnc 400]] Thanks for watching.
"""
