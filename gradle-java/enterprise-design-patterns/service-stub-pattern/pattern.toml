# pattern.toml for the Service Stub project. See tools/patternkit.

[project]
slug = "service-stub"
category = "enterprise-design-patterns"
title = "Service Stub"
package = "servicestub"
main_class = "ServiceStubDemo"
tagline = "Develop without the real service"
bold = "Put an external service behind a gateway interface, and during development and testing plug in a small, free, in-memory stub that behaves like it, checked regularly against the real thing."
domain_note = ""
thumb_lines = ["SERVICE", "STUB"]
thumb_code = "new PostcodeStub()"
youtube_title = "Service Stub"
youtube_tags = ["service stub", "testing", "gateway", "enterprise patterns", "contract testing", "java"]

[readme]
intro = """
Service Stub is one of Martin Fowler's enterprise application patterns. When
your code depends on an external service that is slow, costs money per call,
or needs the network, you put that service behind a gateway interface. In
development and in tests you plug in a stub: a small in-memory class that
implements the same interface and answers like the real service would.

The stub is free and instant, works offline, and can be told to behave badly
on purpose, so the awkward cases can be tested. Because it is a copy of
someone else's behaviour, it must be checked against the real service from
time to time.
"""
analogy = """
Think of a flight simulator. Pilots practise in it every day: it costs nothing
to fly, and it can give them an engine failure on demand, which nobody would
arrange on a real aircraft. But the simulator is only useful while it behaves
like the real plane, so it is checked against the real aircraft's data.
"""
scenario = """
At checkout, the online store turns a postcode into an address using an
external postcode service. Each lookup costs 5 pence and takes 400
milliseconds, and it needs the network. Developers called it for every test
checkout, paid for it, waited for it, and could not work on the train.
"""
costs = [
    "**A second copy to keep in step.** The stub is someone else's behaviour, rewritten; when the real service changes, the stub does not.",
    "**It only knows what you told it.** A handful of postcodes, not millions.",
    "**Stubs can lie.** Here the stub accepted small letters, which the real service refuses; only the contract check noticed.",
]
too_much = """
When the real service is free, fast, reliable and available offline, such as
a library inside your own program, call it directly. And do not stub your own
database or your own code just to make tests fast; stub what is genuinely
outside your control.
"""
met_before = [
    "WireMock and MockServer, which stand in for HTTP services.",
    "Payment providers' test modes and sandbox accounts.",
    "LocalStack, which stands in for cloud services on a laptop.",
    "Pact and other contract-testing tools, which check that stubs still match the real thing.",
]
where = """
This project is in [enterprise-design-patterns](..). It is a close relative of
the [Test Double](../../testing-design-patterns/test-double-pattern) family:
a service stub is a long-lived fake for a whole external service, used for
development as well as tests.
"""

[[act]]
title = "The real service in development"
summary = "50 test checkouts cost £2.50 and 20 seconds of waiting; offline, the lookup is unavailable."
detail = """
Developers call the real `PostcodeService` for every test checkout. Fifty in a
day cost £2.50 in lookup fees and twenty seconds of waiting. On a train with no
signal, the lookup is unavailable and nothing can be tried.
"""
speech = """
First demo: developing against the real postcode service. [[slnc 400]] Every lookup costs five pence, and takes four hundred milliseconds. [[slnc 500]]
A developer tries fifty test checkouts in a day. [[slnc 300]] Two pounds fifty in lookup fees. [[slnc 300]] Twenty seconds of waiting. [[slnc 600]]
Then they get on a train with no signal. [[slnc 300]] The lookup is unavailable, and they cannot work at all.
"""
rows = { checkout = "active amber", real = "active wrong" }
console = [
    ["50 test checkouts: £2.50, 20 s waiting", "bad"],
    ["no signal: lookup unavailable", "bad"],
]

[[act]]
title = "A service stub"
summary = "PostcodeStub implements the same AddressGateway: 50 checkouts, £0.00, no network, no waiting."
detail = """
Checkout already depends only on `AddressGateway`. `PostcodeStub` implements
it with a small in-memory map of postcodes. The same fifty checkouts cost
nothing, need no network, and wait for nothing.
"""
speech = """
Second demo: a service stub. [[slnc 400]] Checkout only knows a small interface: the address gateway. [[slnc 300]] A postcode in, an address out. [[slnc 500]]
The stub implements that interface, with a few postcodes kept in memory. [[slnc 500]]
Four Mill Lane, Leeds, comes back instantly. [[slnc 300]] Fifty checkouts cost nothing, need no network, and wait for nothing.
"""
rows = { checkout = "active ok", stub = "active ok" }
console = [
    ["deliver to 4 Mill Lane, Leeds", "ok"],
    ["50 checkouts: £0.00, no network", "ok"],
]

[[act]]
title = "Awkward cases on demand"
summary = "The stub answers an unknown postcode and can pretend to be down; checkout asks the customer to type the address."
detail = """
A stub can be told what to do. An unknown postcode makes checkout ask the
customer to type their address. A stub switched to "down" makes checkout say
the lookup is unavailable and fall back to typing. Neither can be ordered from
the real service at the moment you want to test it.
"""
speech = """
Third demo: the stub plays the awkward cases, on demand. [[slnc 400]] An unknown postcode. [[slnc 300]] Checkout asks the customer to type their address. [[slnc 500]]
A service that is down. [[slnc 300]] The stub can pretend. [[slnc 300]] Checkout says the lookup is unavailable, and asks the customer to type it. [[slnc 600]]
You cannot ask the real service to go down, just when you want to test it.
"""
rows = { stub = "active amber", checkout = "active ok" }
console = [
    ["unknown postcode: please type your address", "ok"],
    ["service down: please type your address", "ok"],
]

[[act]]
title = "The contract check"
summary = "Asked the same postcodes, stub and real agree except \"ls1 4ap\": the stub finds it, the real service errors."
detail = """
`ContractCheck` asks the stub and the real service the same questions, and
lists where they disagree. It runs weekly, not in every test. It finds one
difference: for "ls1 4ap" in small letters, the stub finds the address and the
real service refuses the format. Code tested only against the stub would have
broken in production.
"""
speech = """
Fourth demo: a contract check. [[slnc 400]] Once a week, the stub and the real service are asked the same questions. [[slnc 300]] Any difference is reported. [[slnc 600]]
One postcode, typed in small letters. [[slnc 300]] The stub finds the address. [[slnc 300]] The real service refuses it: invalid format. [[slnc 600]]
Checkout, tested only against the stub, would have broken in production.
"""
rows = { contract = "active amber", stub = "active wrong", real = "active ok" }
console = [
    ["\"ls1 4ap\": stub found, real error", "bad"],
    ["the stub accepts small letters", "amber"],
]

[[act]]
title = "The bill"
summary = "The stub is a second, simpler copy of someone else's service: it must be kept in step and knows only what you gave it."
detail = """
A stub is a second, simpler copy of a service you do not own. Every change on
their side must be copied to it, and it only knows the postcodes you put in.
The contract check is what keeps it honest.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] A stub is a second, simpler copy of someone else's service. [[slnc 500]]
It must be kept in step with the real one. [[slnc 300]] And it only knows the postcodes you gave it. [[slnc 500]]
The contract check is what keeps it honest.
"""
rows = { stub = "active amber" }
console = [
    ["a second copy to keep in step", "amber"],
    ["knows only what you gave it", "amber"],
]

