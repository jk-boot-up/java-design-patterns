# pattern.toml for the Remote Facade project. See tools/patternkit.

[project]
slug = "remote-facade"
category = "enterprise-design-patterns"
title = "Remote Facade"
package = "remotefacade"
main_class = "RemoteFacadeDemo"
tagline = "Fewer, bigger calls across the network"
bold = "Keep objects fine-grained inside the server, but give remote callers a coarse-grained front that answers a whole screen or makes a whole change in one call."
domain_note = ""
thumb_lines = ["REMOTE", "FACADE"]
thumb_code = "GET /order-summary"
youtube_title = "Remote Facade"
youtube_tags = ["remote facade", "api design", "latency", "enterprise patterns", "martin fowler", "java"]

[readme]
intro = """
Remote Facade is one of Martin Fowler's distribution patterns. Inside a
program, small methods are good design and calling them is almost free. Across
a network, every call is a round trip that can cost tens of milliseconds. A
remote facade is a coarse-grained front for remote callers: one call returns
everything a screen needs, and one call makes a whole change, all or nothing.

The facade holds no business rules. It calls the fine-grained objects
in-process, where calls are cheap, and packs the result into one reply.
"""
analogy = """
Think of ordering from a shop by post. You would not send five letters, one
asking the price, one asking the colours, one asking the delivery date, and
wait days for each reply. You send one letter with every question, and the
shop replies with one letter that answers them all. And to order, you fill in
one order form, not a letter per item.
"""
scenario = """
The online store's phone app shows an order screen: customer, items, total,
delivery address and delivery slot. The server published the order's small
methods one by one over HTTP, so the app made five round trips to draw one
screen, 400 milliseconds on a mobile network. Changing the address and the
slot took two calls, and when the second failed the order was left half
changed.
"""
costs = [
    "**Sometimes too much.** A widget that shows only the slot downloads the whole summary: 73 bytes instead of 8 in the demo, far more in real life.",
    "**One more layer.** Each new screen may want its own facade method, and the facade must be kept in step with the screens.",
    "**Not a place for rules.** It is tempting to put business logic in the facade; it belongs on the domain objects.",
]
too_much = """
Inside one program, fine-grained calls are cheap and a facade adds nothing.
And when many different clients need very different shapes of data, a query
language such as GraphQL, or a Backend for Frontend per client, may fit
better than one facade.
"""
met_before = [
    "\"Summary\" or \"details\" endpoints in REST APIs that return a whole screen's data.",
    "Session facades in older Java EE applications.",
    "Backend for Frontend services, one coarse API per app.",
    "GraphQL, which lets the client ask for a whole screen in one request.",
]
where = """
This project is in [enterprise-design-patterns](..). It is the network-sized
cousin of the [Facade](../../structural/facade-pattern) pattern, and pairs
with [Data Transfer Object](../data-transfer-object-pattern), if present, for
the shape of the reply.
"""

[[act]]
title = "Many small remote calls"
summary = "The app asks for customer, items, total, address and slot separately: 5 round trips, 400 ms on a mobile network."
detail = """
`FineGrainedApi` publishes each of the order's small methods as its own HTTP
address. To draw the order screen the phone app calls all five: customer,
items, total, address, slot. That is five round trips, 400 milliseconds at 80
each on a mobile network.
"""
speech = """
First demo: the phone app asks for each fact separately. [[slnc 400]] The customer's name. [[slnc 200]] The items. [[slnc 200]] The total. [[slnc 200]] The address. [[slnc 200]] The delivery slot. [[slnc 600]]
Each question is one trip across the network, and back. [[slnc 300]] On a mobile network, about eighty milliseconds each. [[slnc 500]]
Five round trips. [[slnc 300]] Four hundred milliseconds, just to draw one screen.
"""
rows = { phone = "active amber", fine = "active wrong" }
console = [
    ["GET /order/customer, /items, /total,", "muted"],
    ["    /address, /slot", "muted"],
    ["5 round trips, 400 ms", "bad"],
]

[[act]]
title = "One facade call"
summary = "GET /order-summary returns the whole screen in one reply: 1 round trip, 80 ms."
detail = """
`OrderFacade.summary` reads all six facts from the order in-process and packs
them into one reply. The app calls `/order-summary` once: one round trip, 80
milliseconds, and the whole screen can be drawn.
"""
speech = """
Second demo: a remote facade. [[slnc 400]] The server offers one bigger call: the order summary. [[slnc 500]]
It answers with everything the screen needs, in one reply. [[slnc 300]] Order number, customer, items, total, address, and slot. [[slnc 600]]
One round trip. [[slnc 300]] Eighty milliseconds.
"""
rows = { phone = "active ok", facade = "active ok" }
console = [
    ["GET /order-summary", "muted"],
    ["ORD-1 | Priya | kettle, 2 x mug | £46.00", "ok"],
    ["1 round trip, 80 ms", "ok"],
]

[[act]]
title = "A change in one call"
summary = "Two small calls leave a new address with the old slot; the facade call either changes both or neither."
detail = """
Changing delivery with small calls: the address call succeeds, then the slot
call fails because "Sun 9-12" is not a slot. The order is left with the new
address and the old slot. The facade call `/order-change-delivery` goes to one
order method that checks the slot first: with a bad slot nothing changes; with
a good one, both change.
"""
speech = """
Third demo: a change in one call, all or nothing. [[slnc 400]] Priya moves, and wants a Sunday delivery. [[slnc 500]]
With small calls, the address change works. [[slnc 300]] Then the slot fails: there are no Sunday slots. [[slnc 300]] The order is left half changed: new address, old slot. [[slnc 600]]
With the facade, it is one call. [[slnc 300]] The slot is checked first. [[slnc 300]] It fails, and nothing changes. [[slnc 500]]
With a Tuesday slot, both change together.
"""
rows = { fine = "active wrong", facade = "active ok", order = "active ok" }
console = [
    ["small calls: address changed, slot ERROR", "bad"],
    ["  new address, old slot", "bad"],
    ["facade: nothing changed", "ok"],
    ["facade, Tue 9-12: delivery changed", "ok"],
]

[[act]]
title = "Fine-grained inside"
summary = "The facade makes 6 small in-process calls in under 5 ms; the slot rule stays on Order."
detail = """
Inside the server, the order keeps its small methods. The facade made six of
those calls in-process, in well under five milliseconds. The rule about valid
slots stays on `Order`; the facade only packs and unpacks.
"""
speech = """
Fourth demo: inside, the order stays fine-grained. [[slnc 400]] The facade calls the order's small methods, six of them. [[slnc 300]] In-process, that takes well under five milliseconds. [[slnc 600]]
And the rules stay on the order. [[slnc 300]] Which slots exist is decided by the order, not the facade. [[slnc 300]] The facade only packs and unpacks.
"""
rows = { facade = "active ok", order = "active ok" }
console = [
    ["6 small calls in-process: under 5 ms", "ok"],
    ["slot rules stay on Order", "ok"],
]

[[act]]
title = "The bill"
summary = "A widget showing only the slot downloads 73 bytes instead of 8; each new screen may want its own facade method."
detail = """
A widget that shows only the delivery slot downloads 8 bytes with the small
call, and 73 with the summary. And the facade is one more layer: each new
screen may want its own method.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] A small widget shows only the delivery slot. [[slnc 300]] With the small call, it downloads eight bytes. [[slnc 300]] With the summary, seventy-three. [[slnc 600]]
And the facade is one more layer. [[slnc 300]] Each new screen may want its own facade method.
"""
rows = { facade = "active amber" }
console = [
    ["slot only: 8 bytes vs 73", "amber"],
    ["a facade method per screen", "amber"],
]

[animation]
subtitle = "The phone app makes one coarse call to the facade; inside the server, the facade calls the fine-grained order."
boxes = [
    ["phone", "Phone app", "80 ms per round trip"],
    ["fine", "Fine-grained API", "one address per fact"],
    ["facade", "OrderFacade", "summary, changeDelivery"],
    ["order", "Order", "small methods, the rules"],
]

[docs.problem]
scenario = """
A phone app shows and changes an order over a mobile network, where every
round trip costs about 80 milliseconds.
"""
naive = """
`FineGrainedApi` exposes each small method of `Order` over HTTP. One screen
takes five round trips, and a two-call change can fail half way.
"""
deliver = [
    "Five round trips (400 ms) for one screen, shown over real HTTP.",
    "A summary call answering the whole screen in one trip.",
    "A delivery change that is all or nothing.",
    "The rules kept on the domain object.",
    "The cost shown: 73 bytes where 8 would do.",
    "Every printed result asserted by a test.",
]

[docs.prerequisites]
required = [
    "Java basics: classes, exceptions.",
    "HTTP basics: a request, a response, a status code.",
]
not_required = [
    "Servlets or Spring. The JDK's `HttpServer` is used.",
    "Real mobile networks. Round trips are counted and multiplied by 80 ms.",
]

[docs.session]
objectives = [
    "Explain why chatty remote calls are slow.",
    "Design a coarse call around what a screen needs.",
    "Make a remote change all or nothing.",
    "Keep business rules out of the facade.",
]
walkthrough = """
Run `./gradlew run` and compare the round trips in acts one and two. Open
`FineGrainedApi` and `OrderFacade` side by side. Spend time on act three: the
half-changed order is the bug learners will meet in real APIs.
"""
exercises = [
    "Add a `/order-summary?fields=slot` option. What have you started building?",
    "Add a cancel action to the facade that refuses if the order has shipped.",
    "Count round trips for a list screen of 20 orders, with small calls and with a facade.",
]

[docs.explained]
sentence = """
A remote facade gives remote callers coarse-grained calls, a whole screen or
a whole change at once, over fine-grained objects that stay unchanged inside.
"""
verdict = """
Put a remote facade in front of any fine-grained model that is called over a
network. Shape calls around screens and whole changes, keep rules on the
domain objects, and consider a Backend for Frontend or GraphQL when clients
need very different shapes.
"""
recognise = [
    "`/summary`, `/details` or `/overview` endpoints returning many fields at once.",
    "Service methods named for a screen or a whole task.",
    "Session facades and BFF services.",
]

[spec]
purpose = """
Teach Remote Facade with an online store's order screen over the JDK's HTTP
server: five fine-grained round trips (400 ms), then one summary call (80 ms),
a two-call change left half done against a one-call change that is all or
nothing, rules kept on the order, and the extra bytes a summary costs.
"""
nongoals = [
    "Not JSON. Replies are plain text.",
    "Not real latency. Round trips are counted and multiplied by 80 ms.",
]
problem = """
Publishing an object's small methods over the network makes screens slow and
lets multi-step changes fail half way.
"""
roles = [
    ["The pattern", "`OrderFacade`"],
    ["The domain object", "`Order`"],
    ["The naive version", "`FineGrainedApi`"],
    ["The remote caller", "`Http.Phone`"],
    ["Entry point", "`RemoteFacadeDemo`, five acts"],
]
requirements = [
    "**Real HTTP:** every remote call goes over localhost.",
    "**One trip per screen:** the summary answers the whole screen.",
    "**All or nothing:** a bad delivery change changes nothing.",
    "**No rules in the facade:** slot validation lives on `Order`.",
    "**Every printed result is asserted** in `DemoRunsTest`.",
]

