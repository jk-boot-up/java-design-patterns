taglines = [["Fewer, bigger calls across the network", "gold"]]

[[scene]]
key = "01-poster"
kind = "poster"
title = "Remote Facade"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Remote Facade pattern, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] A remote facade is a front for callers across a network. [[slnc 300]] One call returns everything a screen needs. [[slnc 300]] One call makes a whole change, all or nothing. [[slnc 300]] Inside, the objects stay small and simple. [[slnc 600]]
Think of ordering from a shop by post. [[slnc 300]] You would not send five letters, one per question, and wait days for each reply. [[slnc 300]] You send one letter with every question, and get one letter back. [[slnc 700]]
In this video, the domain is an online shop's phone app. [[slnc 300]] It shows an order screen: the customer, the items, the total, the address, and the delivery slot. [[slnc 500]]
By the end, you will hear why many small calls over a network are slow. [[slnc 300]] How a facade fixes it. [[slnc 300]] How a change can be all or nothing. [[slnc 300]] And what it costs.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["The phone app's order screen:", "customer, items, total,", "address, delivery slot.", "", "About 80 ms per round trip", "on a mobile network."]
narration = """
Here is the scenario. [[slnc 400]] The shop's phone app shows an order. [[slnc 300]] The customer, the items, the total, the delivery address, and the delivery slot. [[slnc 600]]
The app talks to the server over a mobile network. [[slnc 300]] Every request is a round trip: there and back. [[slnc 300]] About eighty milliseconds each.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["Remote callers get coarse calls:", "a whole screen, a whole change.", "", "Inside, objects stay fine-grained.", "", "The facade packs and unpacks;", "the rules stay on the objects."]
narration = """
Let's name the pattern. [[slnc 400]] Give callers across the network a few big calls. [[slnc 300]] A whole screen at once. [[slnc 300]] A whole change at once. [[slnc 500]]
Inside the server, keep the objects small, with their small methods. [[slnc 500]]
The facade only gathers and packs. [[slnc 300]] The business rules stay on the objects.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["Order: small methods, the rules", "OrderFacade: summary, changeDelivery", "Phone: counts its round trips", "FineGrainedApi: the old way"]
narration = """
Here is who does what. [[slnc 400]] The order has small methods, and holds the rules, such as which delivery slots exist. [[slnc 500]]
The order facade offers two big calls: the summary, and change delivery. [[slnc 500]]
The phone is the remote caller, and counts its round trips. [[slnc 300]] And the fine-grained A P I is the old way, kept for comparison.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["/summary and /details endpoints", "Session facades in Java EE", "Backend for Frontend services", "GraphQL"]
narration = """
You have probably met this pattern already. [[slnc 400]] Web A P Is with summary or details endpoints, that return a whole screen at once. [[slnc 500]]
Older Java enterprise applications had session facades. [[slnc 500]]
Backend for frontend services give each app its own coarse A P I. [[slnc 300]] And GraphQL lets the app ask for a whole screen in one request.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Any fine-grained model called", "over a network.", "", "Shape calls around screens", "and whole changes.", "Keep rules on the objects."]
narration = """
So, when should you use it? [[slnc 400]] In front of any fine-grained model that is called over a network. [[slnc 500]]
Shape the calls around screens, and around whole changes. [[slnc 300]] Keep the rules on the domain objects. [[slnc 500]]
Inside one program, you do not need it. [[slnc 300]] Small calls there are almost free.
"""

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a cancel call", "to the facade."]
narration = """
That's the Remote Facade pattern. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Across a network, make fewer, bigger calls, and keep the small ones inside. [[slnc 500]]
The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs offline, with nothing installed except a Java development kit. [[slnc 500]]
Here is one exercise to try. [[slnc 300]] Add a cancel call to the facade, that refuses if the order has shipped. [[slnc 500]]
If this helped, a like really does help other people find it. [[slnc 300]] And subscribe, if you'd like the rest of the series. [[slnc 400]] Thanks for watching.
"""
