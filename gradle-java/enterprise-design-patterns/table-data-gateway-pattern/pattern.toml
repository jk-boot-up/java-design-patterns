after = { code = "products.findBySku(sku)", note = "SQL in one class", tag = "AFTER" }
taglines = [["One class speaks SQL for a table", "gold"]]

[[scene]]
key = "01-poster"
kind = "poster"
title = "Table Data Gateway"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Table Data Gateway pattern, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] A table data gateway is one class for each database table. [[slnc 300]] It holds every piece of SQL for that table. [[slnc 300]] The rest of the program asks it plain questions, and never writes SQL itself. [[slnc 600]]
Think of a bank. [[slnc 300]] Customers do not walk into the vault. [[slnc 300]] They ask at the counter. [[slnc 300]] When the vault is reorganised, only the counter staff learn the new layout. [[slnc 700]]
In this video, the domain is an online shop. [[slnc 300]] It keeps its products in a database table: a code, a name, a price, and how many are in stock. [[slnc 500]]
By the end, you will hear how SQL spread across a program breaks. [[slnc 300]] How a gateway fixes it. [[slnc 300]] How a change is made in one place. [[slnc 300]] And what the pattern costs.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["A product table: code, name,", "price, stock.", "", "The product page, the stock report", "and checkout each wrote", "their own SQL against it."]
narration = """
Here is the scenario. [[slnc 400]] The shop's products live in a database table. [[slnc 300]] Each row has a code, a name, a price, and a stock count. [[slnc 600]]
Three parts of the shop use it. [[slnc 300]] The product page shows stock. [[slnc 300]] The stock report counts what has run out. [[slnc 300]] Checkout takes items out of stock. [[slnc 500]]
Each one wrote its own SQL.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["One class per table: the gateway.", "", "It holds all of that table's SQL.", "", "Callers ask plain questions", "and get plain records back."]
narration = """
Let's name the pattern. [[slnc 400]] Give each table one class: the gateway. [[slnc 500]]
The gateway holds every piece of SQL for that table. [[slnc 300]] Finding, counting, inserting, updating. [[slnc 500]]
Everyone else asks it plain questions, and gets plain records back. [[slnc 300]] Nobody else writes SQL for that table.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["ProductGateway: the table's SQL", "Row: one product, as data", "Pages: the callers", "H2: an in-memory database", "scattered package: the old way"]
narration = """
Here is who does what. [[slnc 400]] Product gateway holds all of the product table's SQL. [[slnc 500]]
Row is a record: one product, as plain data. [[slnc 500]]
Pages holds the three callers: the product page, the stock report, and checkout. [[slnc 500]]
H2 is a real database that runs inside the program, in memory. [[slnc 300]] And the scattered package is the old way, kept for comparison.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["DAO classes: ProductDao", "JdbcTemplate, one class per table", "MyBatis mappers"]
narration = """
You have probably met this pattern already. [[slnc 400]] Classes called D A O, data access objects, such as product D A O, are table data gateways. [[slnc 500]]
So is Spring's J D B C template, wrapped in one class per table. [[slnc 300]] And MyBatis mapper interfaces.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["More than one part of the program", "touches a table.", "", "Keep SQL inside; return records.", "", "Rows need behaviour?", "Move to Repository."]
narration = """
So, when should you use it? [[slnc 400]] As soon as more than one part of a program touches a table. [[slnc 500]]
Keep SQL, connections, and result sets inside the gateway. [[slnc 300]] Return plain records. [[slnc 500]]
And when rows start needing behaviour, such as rules about stock, move on to a repository or a data mapper.
"""

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add insert and delete", "to the gateway."]
narration = """
That's the Table Data Gateway pattern. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] One class speaks SQL for each table, and everyone else just asks it. [[slnc 500]]
The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs offline once its libraries are downloaded, with nothing else installed except a Java development kit. [[slnc 500]]
Here is one exercise to try. [[slnc 300]] Add insert and delete to the gateway, with tests. [[slnc 500]]
If this helped, a like really does help other people find it. [[slnc 300]] And subscribe, if you'd like the rest of the series. [[slnc 400]] Thanks for watching.
"""
