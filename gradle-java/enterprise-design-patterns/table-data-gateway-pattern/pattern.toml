# pattern.toml for the Table Data Gateway project. See tools/patternkit.

[project]
slug = "table-data-gateway"
category = "enterprise-design-patterns"
title = "Table Data Gateway"
package = "tabledatagateway"
main_class = "TableDataGatewayDemo"
tagline = "One class speaks SQL for a table"
bold = "Give each database table one class that holds all of its SQL, so the rest of the program asks plain questions and never writes SQL itself."
youtube_description = """Table Data Gateway pattern in Java: a table data gateway is one class per table that holds all of that table's SQL, and the rest of the program asks it plain questions, like bank customers who ask at the counter and never enter the vault. Explained with an online store products table holding a code, a name, a price and the stock. We watch SQL spread through every caller break on a rename, move it into one gateway, fix the rename in one place, and decide where the SQL should live. We finish with the bill."""
domain_note = ""
thumb_lines = ["TABLE DATA", "GATEWAY"]
thumb_code = "products.findBySku(sku)"
youtube_title = "Table Data Gateway"
youtube_tags = ["table data gateway", "jdbc", "sql", "enterprise patterns", "martin fowler", "java"]

[readme]
intro = """
Table Data Gateway is one of Martin Fowler's enterprise application patterns.
For each database table there is one class, the gateway, that holds every
piece of SQL for that table: finding rows, inserting, updating, deleting. The
rest of the program calls plain methods such as `findBySku` or `takeStock`,
and gets plain records back. It never sees SQL, connections or result sets.

When the table changes, only its gateway changes. It is the simplest of the
patterns for separating database code from the rest of an application.
"""
analogy = """
Think of a bank. Customers do not walk into the vault and count the notes
themselves. They go to the counter and ask: pay in this, give me that, what is
my balance. When the bank reorganises its vault, only the counter staff need
to learn the new layout; the customers ask exactly the same questions.
"""
scenario = """
The online store keeps products in a database table with a code, a name, a
price and a stock count. The product page, the stock report and checkout
each wrote their own SQL against it. When the database team renamed the
`stock` column to `quantity`, all three broke at once.
"""
costs = [
    "**Rows, not objects with rules.** A gateway returns data; business rules such as \"low on stock\" end up in each caller.",
    "**It grows.** Every new question anyone asks the table becomes another method on the gateway.",
    "**One class per table.** Queries that join several tables do not have an obvious home.",
]
too_much = """
When a table is used in exactly one place, a query in that place is fine. And
when the rows carry real behaviour, Active Record or Data Mapper, which return
objects rather than rows, fit better.
"""
met_before = [
    "DAO classes (Data Access Objects), such as `ProductDao`.",
    "Spring's `JdbcTemplate` wrapped in one class per table.",
    "MyBatis mapper interfaces, one per table.",
]
where = """
This project is in [enterprise-design-patterns](..), next to
[Repository](../repository-pattern), which works with whole domain objects
instead of rows, and [Query Object](../query-object-pattern), which builds the
questions a gateway or repository can answer.
"""
technologies = [["H2 Database", "2.5.252", "an in-memory SQL database, so the demo runs real SQL with nothing installed"]]

[[act]]
title = "SQL in every caller"
summary = "The page, report and checkout each write their own SQL; after stock is renamed to quantity, all three fail with Column \"STOCK\" not found."
detail = """
`ProductPage`, `StockReport` and `CheckoutSql` each hold their own SQL for the
product table. They work: the kettle has 4 in stock, one product is out of
stock, checkout takes one kettle. Then the database team renames the `stock`
column to `quantity`, and all three fail with `Column "STOCK" not found`.
"""
speech = """
First demo: every caller writes its own SQL. [[slnc 400]] The product page, the stock report, and checkout each talk to the product table directly. [[slnc 500]]
They work. [[slnc 300]] The kettle has four in stock. [[slnc 300]] One product is out of stock. [[slnc 300]] Checkout takes a kettle. [[slnc 600]]
Then the database team renames the stock column to quantity. [[slnc 500]]
The product page fails. [[slnc 300]] The stock report fails. [[slnc 300]] Checkout fails. [[slnc 300]] All three say: column stock not found.
"""
rows = { page = "active wrong", report = "active wrong", checkout = "active wrong", table = "active amber" }
console = [
    ["kettle: 4 in stock; 1 out of stock", "ok"],
    ["stock renamed to quantity...", "amber"],
    ["page, report, checkout: FAILED", "bad"],
    ["  Column \"STOCK\" not found", "bad"],
]

[[act]]
title = "A table data gateway"
summary = "ProductGateway holds the table's SQL; the same three callers ask it plain questions and get Row records back."
detail = """
`ProductGateway` holds every piece of SQL for the product table:
`findBySku`, `cheaperThan`, `countOutOfStock`, `takeStock`. The page, report
and checkout now call those methods and receive `Row` records. Everything
works as before, and one new question, products cheaper than £10, returns the
tea towel and the mug.
"""
speech = """
Second demo: a table data gateway. [[slnc 400]] One class now holds every piece of SQL for the product table. [[slnc 500]]
The page asks it: find the product with this code. [[slnc 300]] The report asks: how many are out of stock? [[slnc 300]] Checkout says: take one of these. [[slnc 600]]
They get plain records back. [[slnc 300]] Everything works as before. [[slnc 300]] And a new question, products cheaper than ten pounds, returns the tea towel and the mug.
"""
rows = { gateway = "active ok", page = "active ok", report = "active ok", checkout = "active ok" }
console = [
    ["kettle: 4 in stock; 1 out of stock", "ok"],
    ["checkout took 1: 3 in stock", "ok"],
    ["cheaper than £10: [tea towel, mug]", "ok"],
]

[[act]]
title = "A rename, fixed once"
summary = "After the same rename, the gateway is told the new column name in one place, and all three callers work."
detail = """
The column is renamed again. This time the column's name lives in one place,
the gateway, which is told its new name once. The product page, the stock
report and checkout work without any change: 3 in stock, 1 out of stock, then
2 after checkout.
"""
speech = """
Third demo: the same rename, fixed in one place. [[slnc 400]] Stock is renamed to quantity again. [[slnc 500]]
This time, the column's name lives in exactly one place: the gateway. [[slnc 300]] It is told the new name, once. [[slnc 600]]
The page, the report, and checkout do not change at all. [[slnc 300]] And they all work.
"""
rows = { gateway = "active ok", table = "active amber", page = "active ok", report = "active ok", checkout = "active ok" }
console = [
    ["gateway told the new name, once", "ok"],
    ["page, report, checkout: all work", "ok"],
    ["checkout took 1: 2 in stock", "ok"],
]

[[act]]
title = "Where the SQL lives"
summary = "Old way: 3 classes mention the product table; new way: 0 callers do, and 1 gateway class does."
detail = """
Scanning the source: three classes in the old `scattered` package mention the
product table. In the new code, no caller does; only the gateway does. Callers
receive plain `Row` records, with no connections, result sets or SQL.
"""
speech = """
Fourth demo: where the SQL lives now. [[slnc 400]] In the old code, three classes talked to the product table. [[slnc 500]]
In the new code, none of the callers do. [[slnc 300]] Only the gateway. [[slnc 500]]
The callers get plain records. [[slnc 300]] No database connections, and no SQL.
"""
rows = { gateway = "active ok" }
console = [
    ["old way: 3 classes with product SQL", "amber"],
    ["new way: 0 callers, 1 gateway", "ok"],
]

[[act]]
title = "The bill"
summary = "A Row is data only, so rules like \"low on stock\" live in callers; the gateway grows a method per question."
detail = """
A `Row` is data only. A rule such as "low on stock means fewer than five" has
nowhere to live but the callers, where it will be written more than once. And
the gateway grows a method for every question anyone asks the table.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] The gateway returns rows, which are just data. [[slnc 300]] A rule like low on stock has nowhere to live, except in each caller. [[slnc 600]]
And the gateway grows a new method for every question anyone asks the table.
"""
rows = { gateway = "active amber" }
console = [
    ["a Row is data only", "amber"],
    ["a method for every question", "amber"],
]

[animation]
subtitle = "One gateway class holds all of the product table's SQL; the page, report and checkout ask it plain questions."
boxes = [
    ["page", "Product page", "shows stock"],
    ["report", "Stock report", "counts out of stock"],
    ["checkout", "Checkout", "takes stock"],
    ["gateway", "ProductGateway", "all the table's SQL"],
    ["table", "product table", "H2, in memory"],
]

[docs.problem]
scenario = """
Three parts of the store read and update the product table.
"""
naive = """
The product page, stock report and checkout each hold their own SQL. Renaming
one column breaks all three.
"""
deliver = [
    "Scattered SQL shown failing after a column rename.",
    "A gateway class holding every statement for the table.",
    "The rename fixed in one place.",
    "A scan showing which classes mention the table.",
    "Every printed result asserted by a test, against a real in-memory database.",
]

[docs.prerequisites]
required = [
    "Java basics: classes, records, exceptions.",
    "A little SQL: `SELECT`, `UPDATE`, `WHERE`.",
]
not_required = [
    "A database server. H2 runs inside the program, in memory.",
    "JDBC in depth. `PreparedStatement` and `ResultSet` appear only inside the gateway.",
]

[docs.session]
objectives = [
    "Explain why SQL spread across callers is fragile.",
    "Write a gateway with one method per question.",
    "Return plain records instead of result sets.",
    "Say when to move on to Repository or Data Mapper.",
]
walkthrough = """
Run `./gradlew run` and read act one: three failures from one rename. Open
the `scattered` package and find the word "stock" in each file. Then open
`ProductGateway` and show that it is now the only place the column is named.
"""
exercises = [
    "Add `insert(Row)` and `delete(sku)` to the gateway, with tests.",
    "Add an `order_line` table and its own gateway.",
    "Move the \"low on stock\" rule into a method. Where should it go?",
]

[docs.explained]
sentence = """
A table data gateway is one class per table that holds all of that table's
SQL, so the rest of the program asks plain questions and gets plain records
back.
"""
verdict = """
Use a gateway as soon as more than one part of a program touches a table. Keep
SQL, connections and result sets inside it, return records, and move to
Repository or Data Mapper when rows start needing behaviour.
"""
recognise = [
    "Classes named `...Dao`, `...Gateway` or `...Table`, one per table.",
    "Methods like `findBy...`, `insert`, `update`, `delete` returning records or DTOs.",
    "Callers with no `java.sql` imports.",
]

[spec]
purpose = """
Teach Table Data Gateway with an online store's product table in H2: three
callers with their own SQL all failing after a column rename, then one gateway
holding every statement, the rename fixed in one place, a source scan showing
where SQL lives, and the cost of returning plain rows.
"""
nongoals = [
    "Not an ORM. Hibernate and JPA are not used.",
    "Not transactions or connection pools.",
]
problem = """
SQL written in every caller couples each of them to the table's exact shape,
so one schema change breaks them all.
"""
roles = [
    ["The pattern", "`ProductGateway`"],
    ["The callers", "`Pages`"],
    ["The table", "`Database`"],
    ["The naive version", "`scattered.ProductPage`, `StockReport`, `CheckoutSql`"],
    ["Entry point", "`TableDataGatewayDemo`, five acts"],
]
requirements = [
    "**One place:** only `ProductGateway` holds SQL for the product table.",
    "**Plain results:** callers receive `Row` records.",
    "**Real SQL:** every statement runs against H2.",
    "**Every printed result is asserted** in `DemoRunsTest`.",
]

