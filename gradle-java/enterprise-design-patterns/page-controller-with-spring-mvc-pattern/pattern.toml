[[scene]]
key = "01-poster"
kind = "poster"
title = "Page Controller with Spring MVC"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Page Controller pattern, with Spring MVC, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] A page controller gives each page of a web application its own controller. [[slnc 300]] It reads that page's input, does that page's work, and handles that page's errors. [[slnc 500]] Spring MVC is the open-source web framework most Java applications use. [[slnc 600]]
Think of a department store, with a counter for each department. [[slnc 300]] Each counter answers its own questions. [[slnc 300]] The front doors, where bags are checked, are shared. [[slnc 700]]
In this video, the domain is an online shop's pages: product, basket, reviews and checkout. [[slnc 500]]
By the end, you will hear why one handler for every page breaks. [[slnc 300]] How Spring finds a controller for each page. [[slnc 300]] And where checks every page needs should live.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["One handler served every page.", "", "Basket code ran for every page.", "", "Each new page edited", "the shared handler."]
narration = """
Here is the scenario. [[slnc 400]] One handler served every page of the shop. [[slnc 500]]
Code added for the basket ran for every page, and the product page crashed. [[slnc 500]]
And each new page meant editing the one handler everyone shared.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern, in Spring MVC"
body = ["@RestController per page.", "@GetMapping for its path.", "", "Spring converts the input.", "", "An interceptor for shared checks."]
narration = """
Let's name the pattern, in Spring's words. [[slnc 400]] A rest controller for each page, with a get mapping for its path. [[slnc 500]]
Spring converts each page's input, and answers bad request when it cannot. [[slnc 500]]
And an interceptor holds the checks many pages share.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["ProductController, BasketController", "ReviewsController, CheckoutController", "LoginInterceptor: the shared check", "OldFrontHandler: the old way"]
narration = """
Here is who does what. [[slnc 400]] Product, basket, reviews and checkout each have their own controller. [[slnc 500]]
The login interceptor checks login, before the pages that need it. [[slnc 500]]
And the old front handler is the old way, one handler for everything.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Spring @Controller classes", "PHP, JSP, Razor Pages", "Django and Rails controllers"]
narration = """
You have probably met this already. [[slnc 400]] Spring controller classes. [[slnc 500]]
PHP files, Java server pages, and Razor pages, one file per page. [[slnc 500]]
And the controllers of Django and Rails.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Pages with their own input,", "logic and errors.", "", "Let Spring check input.", "Shared checks in one place."]
narration = """
So, when should you use it? [[slnc 400]] When pages grow their own input, logic and errors. [[slnc 500]]
Let Spring check the input. [[slnc 300]] And put every shared check in one place, never in each page.
"""

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a", "wishlist page."]
narration = """
That's the Page Controller, with Spring MVC. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Each page its own controller, and every shared check in one place. [[slnc 500]]
The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs offline, with nothing installed except a Java development kit. [[slnc 500]]
Here is one exercise to try. [[slnc 300]] Add a wishlist page, as a new controller. [[slnc 500]]
If this helped, a like really does help other people find it. [[slnc 300]] And subscribe, if you'd like the rest of the series. [[slnc 400]] Thanks for watching.
"""
