    "Java basics: classes, annotations.",
    "HTTP requests, query parameters and status codes.",
    "The Page Controller idea, ideally from the plain Java version of this pattern.",
]
not_required = [
    "Earlier Spring experience. The dependencies page explains the annotations used.",
]

[docs.dependencies]
intro = """
This project uses Spring MVC through Spring Boot, which the plain Java
version of Page Controller does not. Skipping it loses none of the pattern:
the plain version teaches all of it with nothing installed.
"""
what = [
    ["Spring MVC", "Spring MVC routes web requests to Java methods. @RestController marks a class whose methods answer requests. @GetMapping gives the path a method answers. @RequestParam reads a query parameter and converts it to the parameter's type, answering 400 if it cannot. A ResponseStatusException carries the status to answer with. A HandlerInterceptor runs before the controllers it is registered for, and can stop the request."],
    ["Spring Boot", "Spring Boot starts an embedded web server and finds the controllers by their annotations."],
]
why = """
The plain version registers handlers by hand. This version shows how most
Java web applications are organised, and where Spring puts the checks that
every page needs.
"""
install_note = "Only a JDK, version 21. Gradle downloads the rest, and the version is pinned:"
versions = [
    ["Java", "21"],
    ["Spring Boot (webmvc starter)", "4.1.1"],
]
costs = [
    "A framework and its conventions to learn.",
]

[docs.session]
objectives = [
    "Write one @RestController per page.",
    "Let Spring convert and check request parameters.",
    "Answer 404 with a ResponseStatusException.",
    "Move shared checks into a HandlerInterceptor.",
]
walkthrough = """
Run `./gradlew run`. Open `ProductController`: one method. Open `ShopApp`: the
interceptor registered for two paths. Compare act five's 200 and 401.
"""
exercises = [
    "Register the interceptor for every path except /product and /reviews.",
    "Add a wishlist page as a new controller.",
    "Return an HTML view with a template instead of plain text.",
]

[docs.explained]
sentence = """
With Spring MVC, a page controller is a @RestController per page, found by
annotation, with shared checks in a HandlerInterceptor.
"""
verdict = """
Give each page its own controller, let Spring handle input conversion and
status errors, and put every check that many pages share in an interceptor or
filter, never in each page.
"""
recognise = [
    "`@RestController` classes, one per screen or resource.",
    "`@GetMapping(\"/...\")` with `@RequestParam` parameters.",
    "`WebMvcConfigurer.addInterceptors(...)`.",
]

[spec]
purpose = """
Teach Page Controller with Spring MVC: one handler crashing for every page, a
controller per page, Spring's input conversion and status errors, a new page,
and a forgotten login check fixed with an interceptor.
"""
nongoals = [
    "Not HTML templates. Pages answer with plain text.",
]
problem = """
One handler for every page mixes every page's code and breaks them together.
"""
roles = [
    ["The page controllers", "`ProductController`, `BasketController`, `ReviewsController`, `CheckoutController`"],
    ["The old way", "`OldFrontHandler`"],
    ["The shared check", "`LoginInterceptor`"],
    ["Entry point", "`SpringPageControllerDemo`, five acts"],
]
requirements = [
    "**Per page:** each path is answered by its own controller.",
    "**Checked input:** a non-numeric quantity gets 400.",
    "**Shared check:** checkout needs login once the interceptor is on.",
    "**Every printed result is asserted** in `DemoRunsTest`.",
]

