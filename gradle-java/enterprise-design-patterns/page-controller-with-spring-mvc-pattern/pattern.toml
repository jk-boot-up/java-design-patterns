# pattern.toml for the Page Controller with Spring MVC project. See tools/patternkit.

[project]
slug = "page-controller-with-spring-mvc"
category = "enterprise-design-patterns"
title = "Page Controller with Spring MVC"
package = "pagecontrollermvc"
main_class = "SpringPageControllerDemo"
tagline = "A controller per page, found by Spring"
bold = "Give each page of the shop its own Spring MVC controller, let Spring convert and check each page's input, add pages without opening the others, and keep checks every page needs in one HandlerInterceptor."
youtube_description = """Page Controller pattern in Java, explained with Spring MVC, the web framework most Java applications use, and an online store's product, basket, reviews and checkout pages. Each page gets its own controller that reads its input, does its work and handles its errors, like department counters in one store sharing the front doors. We watch one handler for every page break, let Spring find a controller for each page, have Spring check the input, and add a new page. We finish with the bill and where checks every page needs should live: in one interceptor."""
domain_note = ""
thumb_lines = ["PAGE CONTROLLER", "WITH SPRING MVC"]
thumb_code = "@GetMapping(\"/product\")"
youtube_title = "Page Controller with Spring MVC"
youtube_tags = ["page controller", "spring mvc", "controller", "interceptor", "spring boot", "java"]

[readme]
intro = """
This is the framework version of the Page Controller pattern. The plain Java
version, a separate project in this category, registers a handler object per
page on the JDK's HTTP server. Here Spring MVC does it: each page is a class
marked `@RestController`, its address is an `@GetMapping`, and Spring finds
every controller by its annotations. The demo runs a real Spring Boot web
server and calls it over HTTP.

Spring also takes over the chores each page used to do by hand. It converts
request parameters to the types the method asks for and answers 400 when it
cannot, and it turns an exception with a status into the right response.
Checks that every page needs, such as being logged in, go in a
`HandlerInterceptor` registered once, so no page's author can forget them.
"""
analogy = """
Think of a department store with a counter for each department: shoes,
kitchenware, toys. Each counter knows its own products and answers its own
questions. The doors at the front, where everyone's bag is checked, are
shared by every counter.
"""
scenario = """
The online store's pages were served by one handler that grew a branch for
every page. Quantity parsing added for the basket ran for every page, so the
product page crashed, and each new page meant editing the one handler
everyone shared.
"""
test_note = """
Every result the demo prints is asserted, with a real Spring MVC application
on a local port, called over HTTP.
"""
run_note = """
Nothing to install beyond a Java 21 JDK: the Spring Boot web server starts
inside the program, on a local port.
"""
twin = """
The plain Java version got the idea right: one controller per page, each
owning its input and errors, a new page as a new class, and shared checks
repeated on every page as the cost. What it left out is how a framework
carries it. Spring finds each controller by its annotation, converts
parameters and answers 400 for "two" as a quantity with no code in the page,
and turns a ResponseStatusException into a 404. And it removes the plain
version's cost: a HandlerInterceptor registered once for the basket and
checkout pages makes the forgotten login check impossible to forget.
"""
technologies = [
    ["Spring Boot", "4.1.1", "the embedded web server"],
    ["Spring MVC", "with Spring Boot 4.1.1", "@RestController, @GetMapping, @RequestParam conversion, HandlerInterceptor"],
]
costs = [
    "**Shared checks need a home.** Without an interceptor, checkout's author forgot the login check, and anyone could see the checkout page.",
    "**Many small classes.** A controller per page spreads the application over many files.",
    "**Framework conventions to learn.** Annotations, mappings and error handling are Spring's, not Java's.",
]
too_much = """
For a handful of pages with little logic, one small controller is fine. A
controller per page pays off as pages grow their own input, logic and errors.
"""
met_before = [
    "Spring MVC `@Controller` and `@RestController` classes.",
    "Pages in PHP, JSP and ASP.NET Razor Pages, one file per page.",
    "Django and Rails views and controllers per page.",
]
where = """
This project is in [enterprise-design-patterns](..). It is the framework
version of the plain Java Page Controller project in the same category,
which is left unchanged.
"""

[[act]]
title = "One handler for every page"
summary = "A single handler serves every page; quantity parsing added for the basket makes the product page answer 500."
detail = """
One handler serves every page under /old. Quantity parsing was added at the
top for the basket, which works, but it now runs for every page: the product
page, which has no quantity, crashes with 500.
"""
speech = """
First demo: one handler for every page. [[slnc 400]] The basket works. [[slnc 600]]
But the code that reads the quantity was added at the top, for the basket. [[slnc 300]] It runs for every page. [[slnc 500]]
The product page has no quantity. [[slnc 300]] It crashes, with a server error.
"""
rows = { old = "active wrong" }
console = [
    ["/old/basket: 200", "ok"],
    ["/old/product: 500", "bad"],
]

[[act]]
title = "A controller per page"
summary = "ProductController and BasketController each own one page: the kettle is £30.00, the basket holds 2 mugs."
detail = """
Now each page has its own `@RestController` with its own `@GetMapping`. The
product page shows the steel kettle at £30.00; the basket page adds two mugs.
Neither knows about the other.
"""
speech = """
Second demo: a controller for each page. [[slnc 400]] The product page has its own class. [[slnc 300]] So does the basket. [[slnc 600]]
The kettle costs thirty pounds. [[slnc 300]] The basket holds two mugs. [[slnc 500]]
Neither page knows about the other.
"""
rows = { product = "active ok", basket = "active ok" }
console = [
    ["/product: 200 steel kettle, £30.00", "ok"],
    ["/basket: 200 basket: 2 x MUG-1", "ok"],
]

[[act]]
title = "Input checked by Spring"
summary = "An unknown product gets 404 from a ResponseStatusException; qty=two gets 400, because Spring could not make it an int."
detail = """
An unknown product, SOFA-9, gets 404: the controller throws a
ResponseStatusException and Spring turns it into the response. A quantity of
"two" gets 400 without any code in the basket page: Spring could not convert
it to the int the method asks for.
"""
speech = """
Third demo: each page's input, checked by Spring. [[slnc 400]] An unknown product. [[slnc 300]] Not found. [[slnc 600]]
A quantity written as the word two. [[slnc 300]] Bad request. [[slnc 300]] Spring could not turn it into a number. [[slnc 300]] The basket page wrote no code for that.
"""
rows = { product = "active ok", basket = "active ok" }
console = [
    ["SOFA-9: 404", "ok"],
    ["qty=two: 400", "ok"],
]

[[act]]
title = "A new page"
summary = "A ReviewsController is added; /reviews works, and no other controller was opened."
detail = """
A reviews page is added as one new class, ReviewsController. Spring finds it
by its annotation, and /reviews shows 4.5 stars from twelve customers. No
other controller was opened.
"""
speech = """
Fourth demo: a new page. [[slnc 400]] Reviews are added as one new class. [[slnc 600]]
Spring finds it by its annotation. [[slnc 300]] Four and a half stars, from twelve customers. [[slnc 500]]
No other page was touched.
"""
rows = { reviews = "active ok" }
console = [
    ["/reviews: 200, 4.5 stars", "ok"],
]

[[act]]
title = "The bill, and an interceptor"
summary = "Checkout's author forgot the login check: 200 when logged out. One HandlerInterceptor for /basket and /checkout gives 401, then 200 when logged in."
detail = """
The checkout page's author forgot the login check that the basket repeats, so
a customer who is not logged in sees the checkout page. Spring's answer is a
HandlerInterceptor registered once for /basket and /checkout: not logged in
gets 401, logged in gets the page. Shared checks belong in one place.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] Some checks every page needs. [[slnc 300]] The checkout page's author forgot the login check. [[slnc 300]] Anyone can see it. [[slnc 600]]
Spring has a place for shared checks, called an interceptor. [[slnc 300]] It is registered once, for the basket and the checkout. [[slnc 500]]
Not logged in. [[slnc 300]] Please log in. [[slnc 300]] Logged in. [[slnc 300]] The checkout page.
"""
rows = { checkout = "active amber" }
console = [
    ["/checkout, logged out: 200", "bad"],
    ["with interceptor: 401", "ok"],
]

[animation]
subtitle = "Requests reach one Spring MVC controller per page; an interceptor does the shared login check."
boxes = [
    ["old", "One old handler", "every page"],
    ["product", "ProductController", "/product"],
    ["basket", "BasketController", "/basket"],
    ["reviews", "ReviewsController", "/reviews"],
    ["checkout", "CheckoutController", "/checkout"],
]

