plugins {
    id 'java'
    id 'application'
}

group = 'com.jk.explore'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Debezium 3.6.3.Final, the newest generally available release. The embedded engine runs
    // the Postgres connector inside this program's own JVM, so there is no Kafka Connect
    // container and no Debezium Server container: only Postgres and Kafka.
    implementation 'io.debezium:debezium-embedded:3.6.3.Final'
    implementation 'io.debezium:debezium-connector-postgres:3.6.3.Final'

    // The Kafka client, 4.3.1, the same release as the broker image the demo runs. Debezium
    // 3.6.3 is built against 4.3.0 of the same line, and Gradle picks 4.3.1 for both.
    implementation 'org.apache.kafka:kafka-clients:4.3.1'

    // The Postgres JDBC driver. 42.7.13 is the newest release, speaks to Postgres 18, and is
    // the version Debezium 3.6.3 itself is built with.
    implementation 'org.postgresql:postgresql:42.7.13'

    // Testcontainers starts and stops both containers for us, each on a port it picks at
    // random. 2.0.5 is the newest release; in the 2.x line every module carries the
    // `testcontainers-` prefix.
    implementation 'org.testcontainers:testcontainers-kafka:2.0.5'
    implementation 'org.testcontainers:testcontainers-postgresql:2.0.5'

    // Debezium, Kafka and Testcontainers log through SLF4J. Without a binding they print a
    // warning; the simple binding is turned off in src/main/resources.
    implementation 'org.slf4j:slf4j-simple:2.0.17'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.jk.explore.transactionaloutboxdebezium.OutboxWithDebeziumDemo'
}

test {
    useJUnitPlatform()
}
