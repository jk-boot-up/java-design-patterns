plugins {
    id 'java'
    id 'application'
}

group = 'com.jk.explore'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // The PostgreSQL JDBC driver: how the Orders service talks to its own database.
    // 42.7.13 is the newest release.
    implementation 'org.postgresql:postgresql:42.7.13'

    // The MongoDB Java driver, synchronous flavour: how the Catalog service talks to
    // its own database. 5.12.0 is the newest release.
    implementation 'org.mongodb:mongodb-driver-sync:5.12.0'

    // Testcontainers starts and stops both databases for us, each in its own container,
    // on a random free port. 2.0.5 is the newest release; in the 2.x line each database
    // has its own module, named testcontainers-<database>.
    implementation 'org.testcontainers:testcontainers-postgresql:2.0.5'
    implementation 'org.testcontainers:testcontainers-mongodb:2.0.5'

    // Testcontainers and the MongoDB driver log through SLF4J. The simple binding is
    // turned off in src/main/resources, so the demo's own output is the only output.
    implementation 'org.slf4j:slf4j-simple:2.0.17'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.jk.explore.databaseperservicecontainers.DatabasePerServiceWithContainersDemo'
}

test {
    useJUnitPlatform()
    testLogging {
        showStandardStreams = false
    }
}
