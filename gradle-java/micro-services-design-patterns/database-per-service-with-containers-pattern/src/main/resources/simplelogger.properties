# Testcontainers and the MongoDB driver both log through SLF4J. The demo's output is the
# lesson, and a machine with no container runtime is meant to get one readable sentence
# rather than the several screens of stack trace the libraries would otherwise print. So
# their logging is turned off and the demo says everything a reader needs itself.
org.slf4j.simpleLogger.defaultLogLevel=off
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showLogName=false
