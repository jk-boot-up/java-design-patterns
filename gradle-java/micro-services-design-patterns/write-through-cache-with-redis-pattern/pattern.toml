[[scene]]
key = "01-poster"
kind = "poster"
title = "Write-Through Cache with Redis"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Write-Through Cache pattern, with a real Redis and a real PostgreSQL database, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] In a write-through cache, every write goes to the database, and then to the cache, before it is finished. [[slnc 300]] So the cache never shows something the database does not have. [[slnc 500]] Redis is an open-source in-memory store, often used as a cache shared by many servers. [[slnc 600]]
Think of a shop's price list in the back office, and the price tags on the shelves. [[slnc 300]] Whoever changes a price updates the list, then the tag, before doing anything else. [[slnc 700]]
In this video, the domain is an online shop's prices, shown on product pages and charged at checkout. [[slnc 500]]
By the end, you will hear how a forgotten cache shows the wrong price. [[slnc 300]] How write-through fixes it. [[slnc 300]] And why two real systems can still disagree.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["Pages read prices from Redis.", "Checkout reads PostgreSQL.", "", "The nightly job wrote", "only to PostgreSQL."]
narration = """
Here is the scenario. [[slnc 400]] Product pages read prices from Redis. [[slnc 300]] Checkout reads the database. [[slnc 500]]
The nightly price job wrote new prices only to the database. [[slnc 500]]
Customers saw one price, and paid another.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["Every write: database, then Redis.", "", "Every read: Redis.", "", "Give cached values an expiry."]
narration = """
Let's name the pattern. [[slnc 400]] Every write goes to the database, then to Redis. [[slnc 500]]
Every read comes from Redis. [[slnc 500]]
And cached values get an expiry time, to limit how long they can be wrong.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["PriceStore: writes through", "PriceDb: PostgreSQL, the truth", "Redis: the shared cache", "Infra: the containers"]
narration = """
Here is who does what. [[slnc 400]] The price store writes through, and reads from the cache. [[slnc 500]]
The price database is PostgreSQL, the record of truth. [[slnc 300]] Redis is the shared cache. [[slnc 500]]
And the infra class starts both in containers.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Redis in front of a database", "Hazelcast and Ignite map stores", "CPU write-through caches"]
narration = """
You have probably met this already. [[slnc 400]] Redis, in front of a database, in many web shops. [[slnc 500]]
Hazelcast and Apache Ignite, which can write through for you. [[slnc 500]]
And the caches inside a processor.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Read far more than written.", "Stale values are costly.", "", "Database first.", "Give an expiry.", "Plan for disagreement."]
narration = """
So, when should you use it? [[slnc 400]] For data read far more often than it is written, where a stale value is costly. [[slnc 500]]
Write the database first. [[slnc 300]] Give cached values an expiry. [[slnc 300]] And plan for the moment the cache cannot be written.
"""

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Try a", "2-second expiry."]
narration = """
That's the Write-Through Cache, with Redis. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Write the truth, then the cache, and put a limit on how long they can disagree. [[slnc 500]]
The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It needs Docker running, and starts Redis and PostgreSQL for you. [[slnc 500]]
Here is one exercise to try. [[slnc 300]] Set a two-second expiry, and watch the page correct itself. [[slnc 500]]
If this helped, a like really does help other people find it. [[slnc 300]] And subscribe, if you'd like the rest of the series. [[slnc 400]] Thanks for watching.
"""
