# pattern.toml for the Write-Through Cache with Redis project. See tools/patternkit.

[project]
slug = "write-through-cache-with-redis"
category = "micro-services-design-patterns"
title = "Write-Through Cache with Redis"
package = "writethroughredis"
main_class = "RedisWriteThroughDemo"
tagline = "Database, then Redis, on every write"
bold = "Write every price to PostgreSQL and then to a real, shared Redis cache before the write returns, read pages from Redis, and see the one thing the plain version could not: two systems that no transaction spans."
youtube_description = """Write-Through Cache pattern in Java with a real Redis cache and a real PostgreSQL database, using an online store's prices. Every write goes to the database and then to the cache before it is finished, so the cache never shows something the database does not have, like updating the back-office price list and then the shelf tag. We watch a write round the cache go stale, write through instead, serve reads from Redis, and handle the moment when one of the two refuses a write. We finish with the bill: put a limit on how long they can disagree."""
domain_note = ""
thumb_lines = ["WRITE-THROUGH CACHE", "WITH REDIS"]
thumb_code = "db.write(); redis.set()"
youtube_title = "Write-Through Cache with Redis and PostgreSQL"
youtube_tags = ["write-through cache", "redis", "postgresql", "caching", "consistency", "java"]

[readme]
intro = """
This is the real-infrastructure version of the Write-Through Cache pattern.
The plain Java version, a separate project in this category, keeps the
database and the cache as maps in one program. Here the database is a real
PostgreSQL and the cache a real Redis, each started in a container by the
demo itself.

Every price write goes through one store: PostgreSQL first, then Redis, before
the write returns, so product pages, which read Redis, never show a price the
database does not have. Because Redis is a separate server, every instance of
the shop sees the same cache. But because they are two separate systems, no
transaction covers both, and the last acts show what that costs.
"""
analogy = """
Think of a shop with a price list in the back office and price tags on the
shelves. The rule is that whoever changes a price updates the back-office list
first and then walks out and changes the tag, before doing anything else. The
tags are what customers read. But if the shop floor is locked when someone
tries to change a tag, the list and the tag disagree until someone notices.
"""
scenario = """
The online store shows prices on product pages from a cache and charges at
checkout from the database. A nightly job wrote new prices straight into the
database and forgot the cache, so customers saw one price and paid another.
"""
test_note = """
Every number the demo prints is asserted against real Redis and PostgreSQL.
Without a container runtime, the test is skipped rather than failed.
"""
run_note = """
This project needs a running container runtime, such as Docker Desktop: the
demo starts real Redis 8.10.2 and PostgreSQL 18.6 containers and removes them
again. Without one, it prints a sentence saying what to start, rather than
failing.
"""
twin = """
The plain Java version got the idea right: every write goes through the
cache, the database first, so a refused database write leaves both unchanged,
and reads come from the cache. What it left out is what changes when the
cache is a real server. Two app instances now share one cache, and Redis
counts its own hits. And the two stores are separate systems: when Redis was
unreachable during a write, PostgreSQL kept the new price and Redis the old
one, because no transaction spans both. A time-to-live on each cached price
bounds how long they can disagree.
"""
technologies = [
    ["Redis", "8.10.2 (container image)", "the shared cache"],
    ["PostgreSQL", "18.6 (container image)", "the record of truth"],
    ["Jedis", "8.0.1", "the Redis client"],
    ["PostgreSQL JDBC driver", "42.7.13", "talking to PostgreSQL"],
    ["Testcontainers", "2.0.5", "starts, pauses and stops the containers"],
    ["Docker", "24 or later", "runs the containers"],
]
costs = [
    "**No shared transaction.** With Redis unreachable mid-write, the database said £25.00 and the cache £27.00.",
    "**Every write waits twice.** A thousand price updates meant a thousand PostgreSQL writes and a thousand Redis writes.",
    "**The cache fills.** All thousand prices sat in Redis, though most will never be viewed; set a time-to-live.",
]
too_much = """
If prices are read rarely, reading the database directly is simpler. A
write-through cache pays off for data read far more often than written, where
showing a stale value is costly.
"""
met_before = [
    "Application-level write-through with Redis or Memcached in front of a database.",
    "Hazelcast and Apache Ignite, whose map stores can write through for you.",
    "CPU caches with a write-through policy.",
]
where = """
This project is in [micro-services-design-patterns](..). It is the
real-infrastructure version of the plain Java Write-Through Cache project in
the same category, which is left unchanged.
"""

[[act]]
title = "Round the cache"
summary = "The nightly job writes £27.00 straight into PostgreSQL: the page, from Redis, says £30.00 and checkout, from PostgreSQL, charges £27.00."
detail = """
The kettle is £30.00, cached in Redis. The nightly job writes the new price,
£27.00, straight into PostgreSQL and forgets Redis. The product page, reading
Redis, shows £30.00; checkout, reading PostgreSQL, charges £27.00.
"""
speech = """
First demo: a price change goes round the cache. [[slnc 400]] The kettle costs thirty pounds, and that price is in Redis. [[slnc 600]]
The nightly job writes twenty-seven pounds, straight into the database. [[slnc 300]] It forgets Redis. [[slnc 600]]
The product page still says thirty. [[slnc 300]] Checkout charges twenty-seven.
"""
rows = { job = "active wrong", redis = "active wrong", postgres = "active ok" }
console = [
    ["page (Redis): £30.00", "bad"],
    ["checkout (PostgreSQL): £27.00", "muted"],
]

[[act]]
title = "Write through"
summary = "PriceStore writes PostgreSQL, then Redis, before returning: page, checkout and a second app instance all show £27.00."
detail = """
Now every write goes through `PriceStore.put`: PostgreSQL first, then Redis,
before it returns. The page and checkout both say £27.00, and so does a second
instance of the shop reading the same Redis, because the cache is a shared
server.
"""
speech = """
Second demo: write-through. [[slnc 400]] Every price write now goes through one store. [[slnc 300]] The database first, then Redis, before it returns. [[slnc 600]]
The page says twenty-seven. [[slnc 300]] Checkout says twenty-seven. [[slnc 500]]
And a second copy of the shop, reading the same Redis, says twenty-seven too.
"""
rows = { store = "active ok", redis = "active ok", postgres = "active ok" }
console = [
    ["page £27.00, checkout £27.00", "ok"],
    ["second instance: £27.00", "ok"],
]

[[act]]
title = "Reads from Redis"
summary = "100 page views: 0 database reads, and Redis's own counter shows 100 cache hits."
detail = """
A hundred product-page views read the price from Redis. PostgreSQL is not read
at all, and Redis's own statistics count exactly a hundred cache hits.
"""
speech = """
Third demo: reads come from Redis. [[slnc 400]] A hundred people view the product page. [[slnc 600]]
The database is not read at all. [[slnc 300]] Redis's own counter shows a hundred cache hits.
"""
rows = { redis = "active ok" }
console = [
    ["100 views: 0 database reads", "ok"],
    ["Redis: 100 cache hits", "ok"],
]

[[act]]
title = "When one of the two refuses"
summary = "A refused PostgreSQL write leaves both at £27.00; but with Redis unreachable, PostgreSQL saves £25.00 while Redis keeps £27.00."
detail = """
With PostgreSQL read-only for maintenance, the write fails first and Redis is
never touched: both still say £27.00. The other way round is the problem. The
demo freezes Redis during a write: PostgreSQL saves £25.00, Redis cannot be
written, and when it returns the page shows £27.00 against the database's
£25.00. They are two systems, and no transaction spans both; a time-to-live
on each cached price bounds how long they can disagree.
"""
speech = """
Fourth demo: when one of the two refuses. [[slnc 400]] The database is read-only, for maintenance. [[slnc 300]] The write fails first, and Redis is never touched. [[slnc 300]] They still agree. [[slnc 600]]
Now the other way round. [[slnc 300]] Redis cannot be reached, during a write. [[slnc 500]]
The database saves twenty-five pounds. [[slnc 300]] Redis keeps twenty-seven. [[slnc 500]]
Two systems. [[slnc 300]] No transaction covers both. [[slnc 300]] An expiry time on each cached price limits how long they can disagree.
"""
rows = { redis = "active wrong", postgres = "active ok" }
console = [
    ["database refused: both £27.00", "ok"],
    ["Redis unreachable: page £27.00, db £25.00", "bad"],
]

[[act]]
title = "The bill"
summary = "1,000 price updates mean 1,000 PostgreSQL writes and 1,000 Redis writes, and 1,000 more prices sit in Redis though most are never viewed."
detail = """
The nightly job updates a thousand prices: a thousand PostgreSQL writes and a
thousand Redis writes, every write waiting for both. And Redis now holds a
thousand more prices, though most will never be viewed.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] The nightly job updates a thousand prices. [[slnc 300]] A thousand database writes, and a thousand Redis writes. [[slnc 600]]
And Redis now holds a thousand more prices. [[slnc 300]] Most will never be viewed.
"""
rows = { redis = "active amber", postgres = "active amber" }
console = [
    ["1000 + 1000 writes", "amber"],
    ["1000 more prices in Redis", "amber"],
]

