plugins {
    id 'java'
    id 'application'
}

group = 'com.jk.explore'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // The Kafka client, 4.3.1, the same release as the broker image the demo runs.
    implementation 'org.apache.kafka:kafka-clients:4.3.1'

    // The Postgres JDBC driver. 42.7.13 is the newest release and speaks to Postgres 18.
    implementation 'org.postgresql:postgresql:42.7.13'

    // Testcontainers starts and stops both containers for us, each on a port it picks at
    // random. 2.0.5 is the newest release; in the 2.x line every module carries the
    // `testcontainers-` prefix.
    implementation 'org.testcontainers:testcontainers-kafka:2.0.5'
    implementation 'org.testcontainers:testcontainers-postgresql:2.0.5'

    // Kafka and Testcontainers log through SLF4J. Without a binding they print a warning;
    // the simple binding is turned off in src/main/resources.
    implementation 'org.slf4j:slf4j-simple:2.0.17'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.jk.explore.idempotentconsumerkafka.KafkaIdempotentConsumerDemo'
}

test {
    useJUnitPlatform()
}
