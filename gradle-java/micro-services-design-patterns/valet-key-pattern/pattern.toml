# pattern.toml for the Valet Key project. See tools/patternkit.

[project]
slug = "valet-key"
category = "micro-services-design-patterns"
title = "Valet Key"
package = "valetkey"
main_class = "ValetKeyDemo"
tagline = "A key that opens one door, briefly"
bold = "Instead of carrying every upload yourself, give the client a signed key that lets it do one specific thing directly with the storage service, for a few minutes."
youtube_description = """Valet Key pattern in Java, explained with an online store where customers add photos to their product reviews. Instead of carrying every upload itself, the shop gives the client a signed key that allows one specific thing, directly with the storage service, for a few minutes, like a car's valet key that starts the engine but will not open the boot. We hear what carrying uploads through the app costs, hand out a valet key, show it allows only what it says, and watch it expire. We finish with the bill."""
domain_note = ""
thumb_lines = ["VALET KEY"]
thumb_code = "PUT ...?expires=...&sig=..."
youtube_title = "Valet Key"
youtube_tags = ["valet key", "signed url", "presigned url", "cloud patterns", "microservices", "java"]

[readme]
intro = """
Valet Key is a cloud design pattern. When clients need to upload or download
large files, sending them through your application server wastes its
bandwidth and threads. Instead, the application gives the client a valet key:
a token, usually a signed URL, that allows exactly one kind of access to one
file in the storage service, up to a size limit, for a short time. The client
then talks to the storage service directly.

The storage service checks the signature, the path, the method, the size and
the expiry. The key cannot be used for anything else, and it stops working on
its own.
"""
analogy = """
Think of the valet key some cars come with. You hand it to the car park
attendant. It opens the door and starts the engine, but it will not open the
boot or the glovebox. The attendant parks the car without you carrying it
there yourself, and the key is only good for that job.
"""
scenario = """
The online store lets customers add photos to their product reviews. Every
photo was uploaded to the shop's app server, which then sent it on to the file
storage service. Ten 2 MB photos meant 40 MB passing through the app server:
20 in from customers, 20 out to storage.
"""
costs = [
    "**Whoever holds the key can use it.** A key pasted into a public chat worked for a stranger until it expired.",
    "**No easy take-backs.** A signed key cannot normally be revoked before it expires; keep them short-lived.",
    "**The storage must check keys.** Signatures, paths, sizes and expiry all have to be validated there.",
    "**Keys leak into logs.** URLs with signatures must be kept out of logs and analytics.",
]
too_much = """
For small files, or when the application must inspect every byte (virus
scanning, resizing) before storing it, uploading through the app is simpler.
Valet keys pay off for large or numerous files that the app does not need to
touch.
"""
met_before = [
    "Amazon S3 presigned URLs.",
    "Azure Storage shared access signatures (SAS).",
    "Google Cloud Storage signed URLs.",
    "Expiring download links in emails.",
]
where = """
This project is in [micro-services-design-patterns](..), next to
[Gateway Offloading](../gateway-offloading-pattern), another way to take work
off application servers.
"""

[[act]]
title = "Carried by the app"
summary = "10 customers upload a 2 MB photo each through the app server: it carries 40.0 MB."
detail = """
`Shop.uploadThroughApp` receives each photo and sends it on to storage with
the shop's master credential. Ten 2 MB photos make the app server carry
40 MB: every byte in from a customer and out again to storage.
"""
speech = """
First demo: review photos carried through the shop's app server. [[slnc 400]] Ten customers each upload a two megabyte photo. [[slnc 500]]
Each photo goes to the app server. [[slnc 300]] The app server sends it on to storage. [[slnc 600]]
The app server carried forty megabytes. [[slnc 300]] Every byte came in, and went out again.
"""
rows = { customer = "active amber", shop = "active wrong", storage = "active ok" }
console = [
    ["10 photos x 2 MB", "muted"],
    ["the app server carried 40.0 MB", "bad"],
]

[[act]]
title = "A valet key"
summary = "The shop signs a key for PUT /reviews/R-11/photo.jpg, 5 minutes, up to 5 MB; the browser uploads directly: 201 stored."
detail = """
`Shop.valetKey` signs a URL allowing one PUT to `/reviews/R-11/photo.jpg`, for
five minutes, up to 5 MB. The customer's browser uploads the photo straight to
storage, which checks the signature and stores it. The app server carried
only the key: under 200 bytes.
"""
speech = """
Second demo: a valet key. [[slnc 400]] The shop signs a short permission. [[slnc 300]] You may upload one photo, to this address, within five minutes, up to five megabytes. [[slnc 600]]
The customer's browser sends the photo straight to storage. [[slnc 300]] Storage checks the signature, and stores it. [[slnc 500]]
The app server carried under two hundred bytes. [[slnc 300]] Just the key.
"""
rows = { shop = "active ok", customer = "active ok", storage = "active ok" }
console = [
    ["key: PUT /reviews/R-11, 5 min, 5 MB", "muted"],
    ["direct upload: 201 stored", "ok"],
    ["app server carried under 200 bytes", "ok"],
]

[[act]]
title = "Only what it allows"
summary = "The key cannot read the photo (403), cannot write R-3 (403), cannot upload 6 MB (413); no key at all is 401."
detail = """
The key allows exactly one thing. Using it to read the photo is refused, 403.
Changing the path to overwrite review R-3 breaks the signature, 403. A 6 MB
file is over its limit, 413. And storage without any key refuses, 401.
"""
speech = """
Third demo: the key allows that, and nothing else. [[slnc 400]] Use it to read the photo? [[slnc 300]] Refused. [[slnc 500]]
Change the address, to overwrite someone else's review? [[slnc 300]] Refused: the signature no longer matches. [[slnc 500]]
Upload a six megabyte file? [[slnc 300]] Refused: too large. [[slnc 500]]
And with no key at all, storage says no.
"""
rows = { storage = "active ok", customer = "active amber" }
console = [
    ["read with it: 403", "ok"],
    ["other review: 403", "ok"],
    ["6 MB: 413; no key: 401", "ok"],
]

[[act]]
title = "Expiry"
summary = "A key valid for 0.2 s used after 0.4 s: 403 key expired."
detail = """
A key is issued for two tenths of a second and used after four tenths. Storage
refuses it: key expired. Keys stop working on their own.
"""
speech = """
Fourth demo: the key runs out. [[slnc 400]] A key is signed for two tenths of a second. [[slnc 300]] It is used after four tenths. [[slnc 500]]
Refused: key expired. [[slnc 300]] Nobody had to switch it off.
"""
rows = { storage = "active ok" }
console = [
    ["valid 0.2 s, used at 0.4 s: 403 expired", "ok"],
]

[[act]]
title = "The bill"
summary = "A key copied into a public chat works for a stranger (201) until it expires; keep keys short, narrow and out of logs."
detail = """
A key is copied into a public chat, and a stranger uses it: storage accepts,
because the key is valid. It cannot be taken back before it expires. Keep keys
short-lived and narrow, and keep signed URLs out of logs.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] Whoever holds the key can use it. [[slnc 500]]
A key is pasted into a public chat. [[slnc 300]] A stranger uses it. [[slnc 300]] Storage accepts: the key is valid. [[slnc 600]]
It cannot be taken back before it expires. [[slnc 300]] So keep keys short-lived, narrow, and out of your logs.
"""
rows = { customer = "active wrong", storage = "active amber" }
console = [
    ["a stranger uses the key: 201", "bad"],
    ["short-lived, narrow, out of logs", "amber"],
]

[animation]
subtitle = "The shop signs a narrow, short-lived key; the customer uses it to upload straight to storage, which checks it."
boxes = [
    ["customer", "Customer's browser", "has a photo"],
    ["shop", "Shop app server", "signs keys"],
    ["storage", "File storage", "checks keys, stores files"],
]

[docs.problem]
scenario = """
Customers upload photos to their product reviews; files live in a separate
storage service.
"""
naive = """
Every photo is uploaded to the app server and sent on to storage: 40 MB
through the app for ten photos.
"""
deliver = [
    "Bytes carried by the app server counted.",
    "A signed key allowing one upload directly to storage.",
    "Wrong method, path and size refused.",
    "An expired key refused.",
    "The leaked-key risk shown.",
    "Every printed result asserted by a test, over real HTTP.",
]

[docs.prerequisites]
required = [
    "Java basics: classes, exceptions, byte arrays.",
    "HTTP basics: PUT, GET and status codes.",
]
not_required = [
    "Cryptography. HMAC is used as a black box: same secret, same signature.",
    "Any cloud account. Storage is a local server.",
]

[docs.session]
objectives = [
    "Explain why big uploads should not pass through app servers.",
    "Sign a narrow, short-lived permission.",
    "Check a key's signature, method, path, size and expiry.",
    "Name the risks of bearer keys.",
]
walkthrough = """
Run `./gradlew run` and compare act one's 40 MB with act two's key. Open
`Signer.sign` (what is signed) and `Storage.handle` (what is checked). End on
act five: how short should a key live?
"""
exercises = [
    "Add a download key for GET, valid for one minute.",
    "Allow a key to be used only once by remembering signatures already used.",
    "Put the customer's user ID into the signed text, and check it at storage.",
]

[docs.explained]
sentence = """
A valet key is a signed, narrow, short-lived permission that lets a client do
one specific thing directly with a storage service, so the application does
not carry the data itself.
"""
verdict = """
Use valet keys for large or numerous uploads and downloads that the app does
not need to touch. Sign the method, path, size and expiry, keep lifetimes
short, and keep signed URLs out of logs.
"""
recognise = [
    "URLs with `X-Amz-Signature`, `sig=` or `se=` parameters.",
    "An endpoint that returns an upload URL instead of accepting the file.",
    "Expiring download links.",
]

[spec]
purpose = """
Teach Valet Key with an online store's review photos over real HTTP: 40 MB
carried by the app for ten photos, then HMAC-signed keys allowing one PUT
directly to storage, refusals for the wrong method, path and size, an expired
key, and a leaked key working for a stranger.
"""
nongoals = [
    "Not a cloud storage product. Storage is a local server.",
    "Not key revocation. It is discussed, not built.",
]
problem = """
Carrying every upload through the app server spends its bandwidth and
threads on bytes it never needs to look at.
"""
roles = [
    ["The pattern", "`Shop.valetKey` and `Signer`"],
    ["The checker", "`Storage`"],
    ["The client", "`Customer`"],
    ["The naive version", "`Shop.uploadThroughApp`"],
    ["Entry point", "`ValetKeyDemo`, five acts"],
]
requirements = [
    "**Direct:** uploads with a key never pass through the app.",
    "**Narrow:** method, path and size are part of the signature or limits.",
    "**Short-lived:** expired keys are refused.",
    "**Every printed result is asserted** in `DemoRunsTest`.",
]

