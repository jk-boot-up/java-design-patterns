[[scene]]
key = "01-poster"
kind = "poster"
title = "Valet Key"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Valet Key pattern, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] Instead of carrying every upload yourself, you give the client a signed key. [[slnc 300]] The key lets it do one specific thing, directly with the storage service, for a few minutes. [[slnc 600]]
Think of the valet key some cars come with. [[slnc 300]] It opens the door, and starts the engine. [[slnc 300]] But it will not open the boot, or the glovebox. [[slnc 300]] The attendant parks the car, and the key is only good for that job. [[slnc 700]]
In this video, the domain is an online shop. [[slnc 300]] Customers add photos to their product reviews. [[slnc 500]]
By the end, you will hear what carrying uploads costs. [[slnc 300]] How a valet key works. [[slnc 300]] What it will not allow. [[slnc 300]] And its one big risk.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["Customers add photos to reviews.", "", "Photos went to the app server,", "which sent them on to storage."]
narration = """
Here is the scenario. [[slnc 400]] Customers can add photos to their product reviews. [[slnc 500]]
Each photo was uploaded to the shop's app server. [[slnc 300]] The app server then sent it on to the file storage service.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["The app signs a key:", "one method, one file, a size,", "an expiry.", "", "The client uses it directly.", "Storage checks every part."]
narration = """
Let's name the pattern. [[slnc 400]] The app signs a key. [[slnc 300]] It names one action, one file, a size limit, and an expiry time. [[slnc 500]]
The client uses the key to talk to storage directly. [[slnc 500]]
Storage checks every part of it, and refuses anything else.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["Shop: signs valet keys", "Signer: a shared secret", "Storage: checks and stores", "Customer: uploads directly"]
narration = """
Here is who does what. [[slnc 400]] The shop's app server signs valet keys. [[slnc 500]]
The signer uses a secret that only the shop and the storage service know. [[slnc 500]]
Storage checks each key, and stores the file. [[slnc 300]] And the customer's browser uploads directly.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Amazon S3 presigned URLs", "Azure shared access signatures", "Google Cloud signed URLs", "Expiring download links"]
narration = """
You have probably met this pattern already. [[slnc 400]] Amazon S3 has presigned URLs. [[slnc 300]] Azure has shared access signatures. [[slnc 300]] Google Cloud has signed URLs. [[slnc 500]]
And every download link that stops working after a day is a valet key.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Large or many files the app", "does not need to touch.", "", "Sign method, path, size, expiry.", "Short lifetimes.", "Keep keys out of logs."]
narration = """
So, when should you use it? [[slnc 400]] For large, or many, files that the app does not need to look at. [[slnc 500]]
Sign the method, the path, the size, and the expiry. [[slnc 300]] Keep lifetimes short. [[slnc 300]] And keep signed addresses out of your logs.
"""

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Make a key that", "works only once."]
narration = """
That's the Valet Key pattern. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Hand out a key that opens one door, briefly, and let the bytes go direct. [[slnc 500]]
The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs offline, with nothing installed except a Java development kit. [[slnc 500]]
