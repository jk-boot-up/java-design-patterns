[[scene]]
key = "01-poster"
kind = "poster"
title = "Backpressure with Project Reactor"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Backpressure pattern, built with Project Reactor, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] Backpressure lets a slow consumer tell a fast producer how much it can take. [[slnc 300]] So work does not pile up in between. [[slnc 500]] Project Reactor is an open-source library for streams of data, and every stream in it carries this demand. [[slnc 600]]
Think of a kitchen where the chef calls, two more tickets, and the waiter hands over exactly two. [[slnc 300]] A waiter who ignores the chef is stopped before the rail overflows. [[slnc 700]]
In this video, the domain is an online shop's search indexer, reading a supplier's product feed. [[slnc 500]]
By the end, you will hear what Reactor does with a source that ignores demand. [[slnc 300]] How to ask in batches. [[slnc 300]] And how to keep only the latest update.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["A supplier feed: 10,000 products,", "as fast as it can.", "", "The indexer: 1 ms each.", "", "Stock levels by the thousand."]
narration = """
Here is the scenario. [[slnc 400]] A supplier's feed sends ten thousand products, as fast as it can. [[slnc 500]]
The search indexer takes a millisecond for each. [[slnc 500]]
And stock-level updates arrive by the thousand, though only the current one matters.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern, in Reactor"
body = ["Subscribers request items.", "Sources send no more.", "", "limitRate: ask in batches.", "onBackpressure...: what to do", "when nobody is asking."]
narration = """
Let's name the pattern, in Reactor's words. [[slnc 400]] Subscribers request items. [[slnc 300]] Sources send no more than requested. [[slnc 500]]
Limit rate asks in batches, for you. [[slnc 500]]
And the on backpressure operators say what to do with items produced while nobody is asking.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["Flux: the feed", "BaseSubscriber: the indexer, asking", "limitRate: asking in batches", "onBackpressureLatest: newest only"]
narration = """
Here is who does what. [[slnc 400]] A flux is the feed, a stream of products. [[slnc 500]]
A base subscriber is the indexer, asking for ten at a time. [[slnc 500]]
Limit rate asks in batches for you. [[slnc 300]] And on backpressure latest keeps only the newest stock level.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Spring WebFlux", "RxJava, Akka Streams, Kotlin Flow", "java.util.concurrent.Flow"]
narration = """
You have probably met this already. [[slnc 400]] Spring WebFlux is built on Reactor. [[slnc 500]]
RxJava, Akka Streams, and Kotlin Flow share the same ideas. [[slnc 500]]
And the JDK has the same interfaces, in its Flow class.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Streams between fast and", "slow parts.", "", "Prefer sources that can wait.", "Bound or drop on purpose."]
narration = """
So, when should you use it? [[slnc 400]] Whenever data streams between fast and slow parts of a system. [[slnc 500]]
Prefer sources that can wait. [[slnc 300]] And when one cannot, bound it, drop, or keep the latest, on purpose.
"""

