spring.main.banner-mode=off
logging.level.root=ERROR

# One compartment for everything, and then one each for the feed and for checkout.
# A wait of zero means a full compartment refuses at once instead of queueing the caller.
resilience4j.bulkhead.instances.shared.max-concurrent-calls=4
resilience4j.bulkhead.instances.shared.max-wait-duration=0
resilience4j.bulkhead.instances.feed.max-concurrent-calls=2
resilience4j.bulkhead.instances.feed.max-wait-duration=0
resilience4j.bulkhead.instances.checkout.max-concurrent-calls=4
resilience4j.bulkhead.instances.checkout.max-wait-duration=0

# A compartment with its own threads: two running, one waiting, and the next is refused.
resilience4j.thread-pool-bulkhead.instances.feedpool.core-thread-pool-size=2
resilience4j.thread-pool-bulkhead.instances.feedpool.max-thread-pool-size=2
resilience4j.thread-pool-bulkhead.instances.feedpool.queue-capacity=1
