# The Fabric8 client logs through SLF4J. The demo's output is the lesson, so the client is
# kept quiet unless something is genuinely broken: only errors are printed, to standard
# error, and a normal run prints nothing from the library at all.
org.slf4j.simpleLogger.defaultLogLevel=error
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showLogName=false
