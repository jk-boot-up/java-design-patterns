spring.main.banner-mode=off
logging.level.root=ERROR
server.port=0
# A route that takes longer than this is answered with 504 by the gateway itself.
spring.cloud.gateway.server.webflux.httpclient.response-timeout=300ms
# The default error handler logs a stack trace for a refused connection; the demo prints the status instead.
logging.level.org.springframework.boot.webflux=OFF
logging.level.org.springframework.boot.autoconfigure.web.reactive.error=OFF
logging.level.org.springframework.web.HttpLogging=OFF
logging.level.io.netty=OFF
