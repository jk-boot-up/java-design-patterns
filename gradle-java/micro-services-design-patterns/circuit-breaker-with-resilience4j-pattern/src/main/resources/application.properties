spring.main.banner-mode=off
logging.level.root=ERROR

# The breaker for the recommendations call: judge the last four calls, trip at half failing,
# and stay open until the demo (or, in production, the wait duration) lets a probe through.
resilience4j.circuitbreaker.instances.recommendations.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.recommendations.sliding-window-size=4
resilience4j.circuitbreaker.instances.recommendations.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.recommendations.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.recommendations.wait-duration-in-open-state=1h
resilience4j.circuitbreaker.instances.recommendations.permitted-number-of-calls-in-half-open-state=1
resilience4j.circuitbreaker.instances.recommendations.ignore-exceptions=java.lang.IllegalArgumentException

# The same settings without the ignore list, to show what the list is for.
resilience4j.circuitbreaker.instances.strict.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.strict.sliding-window-size=4
resilience4j.circuitbreaker.instances.strict.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.strict.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.strict.wait-duration-in-open-state=1h
