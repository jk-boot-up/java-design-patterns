The queue was first come, first served.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["Each message has a priority.", "", "Highest priority first,", "then oldest first.", "", "Keep a share for routine work."]
narration = """
Let's name the pattern. [[slnc 400]] Each message carries a priority. [[slnc 500]]
Workers take the highest priority first. [[slnc 300]] Within the same priority, the oldest first. [[slnc 500]]
