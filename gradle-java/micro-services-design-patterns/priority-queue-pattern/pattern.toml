# pattern.toml for the Priority Queue project. See tools/patternkit.

[project]
slug = "priority-queue"
category = "micro-services-design-patterns"
title = "Priority Queue"
package = "priorityqueue"
main_class = "PriorityQueueDemo"
tagline = "Urgent work goes first"
bold = "Let urgent messages overtake routine ones in the queue, and keep a share of capacity for routine work so it is never starved."
youtube_description = """Priority Queue pattern in Java: urgent messages overtake routine ones however long those have waited, while a share of capacity is kept so routine work still gets done, like airport fast-track with an officer always on the ordinary lane. Explained with an online store warehouse where pickers work through orders and same-day orders must catch the courier's van. We watch first come, first served miss the van, add a priority queue, survive a flood of standard orders, and prevent starvation with a reserved share. We finish with the bill."""
domain_note = ""
thumb_lines = ["PRIORITY", "QUEUE"]
thumb_code = "same-day first"
youtube_title = "Priority Queue"
youtube_tags = ["priority queue", "message priority", "cloud patterns", "starvation", "microservices", "java"]

[readme]
intro = """
Priority Queue is a cloud design pattern for work queues. Messages carry a
priority, and consumers take the highest-priority message first, however
long lower-priority ones have been waiting. It can be one queue that orders by
priority, or separate queues per priority, each with its own consumers.

Urgent work is never stuck behind a backlog of routine work. The danger is the
opposite: if urgent work never stops coming, routine work never gets done,
so a share of capacity is kept for it.
"""
analogy = """
Think of the fast-track lane at airport security. Passengers with a tight
connection skip the long queue. But the airport keeps at least one officer on
the ordinary lane, or those passengers would miss their flights too. And if
every ticket came with fast track, the fast lane would just be another queue.
"""
scenario = """
The online store's warehouse pickers work through a queue of orders, ten a
minute. Same-day orders must be picked before the courier's van leaves at 9:05.
On a busy morning, a hundred standard orders arrived at 9:00 and five same-day
orders at 9:01. First come, first served, the same-day orders were picked at
9:10, and the van left without them.
"""
costs = [
    "**Starvation.** With twelve same-day orders a minute and capacity for ten, standard orders were never picked, until a share was reserved.",
    "**Priorities get abused.** Once people learn that urgent jumps the queue, everything becomes urgent.",
    "**More to run.** Several queues or a priority rule, reserved shares, and settings to watch.",
]
too_much = """
When all work has the same deadline, one first-in-first-out queue is simpler
and fairer. Priorities pay off when some work has a real, earlier deadline
than the rest.
"""
met_before = [
    "`java.util.PriorityQueue` and `PriorityBlockingQueue`.",
    "RabbitMQ priority queues and separate SQS queues per priority.",
    "Hospital triage and airport fast-track lanes.",
]
where = """
This project is in [micro-services-design-patterns](..), and near
[Scheduler](../../concurrency-design-patterns/scheduler-pattern), which applies
the same idea to threads waiting for a shared resource.
"""

[[act]]
title = "First come, first served"
summary = "100 standard orders at 9:00, 5 same-day at 9:01, 10 picked a minute: the last same-day order is picked at 9:10, after the van left."
detail = """
Pickers take ten orders a minute from a first-in-first-out queue. A hundred
standard orders arrive at 9:00 and five same-day orders at 9:01. The same-day
orders wait behind every standard one, and the last is picked at 9:10: the
van left at 9:05.
"""
speech = """
First demo: one queue, first come, first served. [[slnc 400]] The pickers do ten orders a minute. [[slnc 500]]
At nine o'clock, a hundred standard orders arrive. [[slnc 300]] At one minute past, five same-day orders. [[slnc 300]] The van leaves at five past. [[slnc 600]]
The same-day orders wait behind all hundred. [[slnc 300]] The last one is picked at ten past nine. [[slnc 300]] The van has gone.
"""
rows = { queue = "active wrong", pickers = "active amber" }
console = [
    ["100 standard at 9:00; 5 same-day at 9:01", "muted"],
    ["last same-day picked at 9:10", "bad"],
    ["the van left at 9:05", "bad"],
]

[[act]]
title = "A priority queue"
summary = "Same-day first: all 5 picked by 9:01, in time for the van."
detail = """
The queue now orders by priority: same-day before standard, then oldest
first. All five same-day orders are picked in the 9:01 minute, in time for the
van, and the standard orders carry on straight after.
"""
speech = """
Second demo: a priority queue. [[slnc 400]] Same-day orders now go first. [[slnc 300]] Then, oldest first. [[slnc 600]]
All five same-day orders are picked by one minute past nine. [[slnc 300]] In time for the van. [[slnc 500]]
The standard orders carry on straight after.
"""
rows = { queue = "active ok", pickers = "active ok" }
console = [
    ["same-day picked by 9:01", "ok"],
    ["standard orders straight after", "ok"],
]

[[act]]
title = "A flood of standard orders"
summary = "Even with 1,000 standard orders queued ahead, same-day orders are picked by 9:01."
detail = """
A thousand standard orders arrive first. It makes no difference to the
same-day orders: they overtake the whole backlog and are still picked by 9:01.
"""
speech = """
Third demo: a flood of standard orders makes no difference. [[slnc 400]] This time, a thousand standard orders arrive first. [[slnc 500]]
The same-day orders overtake all of them. [[slnc 300]] Still picked by one minute past nine.
"""
rows = { queue = "active ok" }
console = [
    ["1000 standard ahead: same-day by 9:01", "ok"],
]

[[act]]
title = "Starvation, and a reserved share"
summary = "12 same-day orders a minute against 10 picks: 0 of 20 standard orders picked; reserving 2 picks a minute gets all 20 done."
detail = """
In a rush, twelve same-day orders arrive every minute, more than the pickers'
ten. With strict priority, none of the twenty standard orders is picked in
ten minutes. Keeping two picks a minute for the oldest standard orders gets
all twenty done.
"""
speech = """
Fourth demo: too many urgent orders starve the rest. [[slnc 400]] Twelve same-day orders arrive every minute. [[slnc 300]] The pickers can do ten. [[slnc 600]]
With strict priority, standard orders are never picked. [[slnc 300]] Zero of twenty, in ten minutes. [[slnc 600]]
Now keep two picks a minute for the oldest standard orders. [[slnc 300]] All twenty are picked.
"""
rows = { queue = "active amber", pickers = "active amber" }
console = [
    ["strict: standard picked 0 of 20", "bad"],
    ["2 reserved per minute: 20 of 20", "ok"],
]

[[act]]
title = "The bill"
summary = "Sellers learn that same-day jumps the queue and mark every order same-day; priorities need rules about who may set them."
detail = """
Marketplace sellers notice that same-day orders jump the queue, and start
marking every order same-day. Now nothing is urgent. Priorities need rules
about who may set them, and more queues and settings to watch.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] If everything is urgent, nothing is. [[slnc 500]]
Marketplace sellers learn that same-day jumps the queue. [[slnc 300]] So they mark every order same-day. [[slnc 600]]
Priorities need rules about who may set them. [[slnc 300]] And more queues, and settings, to watch.
"""
rows = { queue = "active wrong" }
console = [
    ["every order marked same-day", "bad"],
    ["rules for who sets priority", "amber"],
]

[animation]
subtitle = "Pickers take ten orders a minute; same-day orders overtake standard ones, with a share kept for standard work."
boxes = [
    ["queue", "Order queue", "same-day first"],
    ["pickers", "Pickers", "10 a minute"],
]

[docs.problem]
scenario = """
Pickers work through orders ten a minute; same-day orders must reach the van
by 9:05.
"""
naive = """
A first-in-first-out queue makes same-day orders wait behind every standard
order, and they miss the van.
"""
deliver = [
    "Same-day orders missing the van with a FIFO queue.",
    "A priority queue getting them picked in the first minute.",
    "The same result with a thousand standard orders queued.",
    "Starvation shown, and fixed with a reserved share.",
    "The abuse risk named.",
    "Every printed result asserted by a test.",
]

[docs.prerequisites]
required = [
    "Java basics: records, `Queue`, `Comparator`.",
]
not_required = [
    "A message broker. Time is counted in minutes.",
]

[docs.session]
objectives = [
    "Explain when a FIFO queue fails a deadline.",
    "Order a queue by priority, then age.",
    "Prevent starvation with a reserved share.",
    "Decide who is allowed to set priorities.",
]
walkthrough = """
Run `./gradlew run` and compare act one's 9:10 with act two's 9:01. Open
`Picking.priority`: one comparator. End on act four's two numbers: 0 of 20 and
20 of 20.
"""
exercises = [
    "Add a third priority, express, above same-day.",
    "Promote standard orders older than 15 minutes instead of reserving picks.",
    "Only allow same-day on orders placed before 11:00.",
]

[docs.explained]
sentence = """
A priority queue lets urgent messages overtake routine ones, with a share of
capacity kept so routine work still gets done.
"""
verdict = """
Use priorities when some work has a genuinely earlier deadline. Order by
priority then age, reserve capacity or age waiting work to prevent
starvation, and control who can mark work urgent.
"""
recognise = [
    "`PriorityQueue` or `PriorityBlockingQueue` with a comparator.",
    "Separate queues named `high`, `normal`, `low`.",
    "Message headers carrying a priority.",
]

[spec]
purpose = """
Teach Priority Queue with an online store's warehouse picking: same-day orders
missing a 9:05 van behind 100 standard orders, then a priority queue picking
them by 9:01 even behind 1,000, starvation of standard orders in a same-day
rush fixed with a reserved share, and the abuse of priorities.
"""
nongoals = [
    "Not real time or a message broker. Minutes are simulated.",
]
problem = """
A first-come queue makes urgent work wait behind routine work, so deadlines
are missed.
"""
roles = [
    ["The pattern", "`Picking.priority`"],
    ["The worker", "`Picking.run`"],
    ["The work", "`Order`"],
    ["The naive version", "`Picking.fifo`"],
    ["Entry point", "`PriorityQueueDemo`, five acts"],
]
requirements = [
    "**Urgent first:** same-day orders are picked before standard ones.",
    "**Age second:** within a priority, oldest first.",
    "**No starvation:** a reserved share serves standard orders.",
    "**Every printed result is asserted** in `DemoRunsTest`.",
]

