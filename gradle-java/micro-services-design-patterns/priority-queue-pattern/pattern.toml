Hello, and welcome. [[slnc 400]] This video explains the Priority Queue pattern, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] In a priority queue, urgent messages overtake routine ones. [[slnc 300]] However long the routine ones have been waiting. [[slnc 300]] And a share of capacity is kept, so routine work still gets done. [[slnc 600]]
Think of the fast-track lane at airport security. [[slnc 300]] Passengers with a tight connection skip the long queue. [[slnc 300]] But at least one officer stays on the ordinary lane. [[slnc 300]] And if every ticket came with fast track, the fast lane would just be another queue. [[slnc 700]]
In this video, the domain is an online shop's warehouse. [[slnc 300]] Pickers work through the orders, and same-day orders must catch the courier's van. [[slnc 500]]
By the end, you will hear how same-day orders missed the van. [[slnc 300]] How a priority queue fixes it. [[slnc 300]] How to stop routine work being starved. [[slnc 300]] And what happens when everything is urgent.
