RabbitMQ supports priorities on queues. [[slnc 300]] And many systems run separate high and low priority queues. [[slnc 500]]
Hospital triage and airport fast-track lanes work the same way.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Some work has a real,", "earlier deadline.", "", "Priority, then age.", "Reserve a share.", "Control who sets priority."]
narration = """
So, when should you use it? [[slnc 400]] When some work has a real, earlier deadline than the rest. [[slnc 500]]
Order by priority, then by age. [[slnc 300]] Reserve a share for routine work. [[slnc 300]] And control who is allowed to mark work as urgent.
"""

