spring.main.banner-mode=off
logging.level.root=ERROR

# Three attempts, waiting 1 ms and then 2 ms, and only for a gateway timeout: a declined card
# will decline again, so it is never retried.
resilience4j.retry.instances.payments.max-attempts=3
resilience4j.retry.instances.payments.wait-duration=1ms
resilience4j.retry.instances.payments.enable-exponential-backoff=true
resilience4j.retry.instances.payments.exponential-backoff-multiplier=2
resilience4j.retry.instances.payments.retry-exceptions=com.jk.explore.retryr4j.GatewayTimeout

# The same, but retrying every exception, to show what the list above prevents.
resilience4j.retry.instances.everything.max-attempts=3
resilience4j.retry.instances.everything.wait-duration=1ms
