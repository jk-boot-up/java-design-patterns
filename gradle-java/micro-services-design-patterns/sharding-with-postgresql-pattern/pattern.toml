# pattern.toml for the Sharding with PostgreSQL project. See tools/patternkit.

[project]
slug = "sharding-with-postgresql"
category = "micro-services-design-patterns"
title = "Sharding with PostgreSQL"
package = "shardingpostgres"
main_class = "PostgresShardingDemo"
tagline = "Three real databases, one router"
bold = "Split the shop's orders across three real PostgreSQL databases by customer number, route every query to the right one, and see what no single database can do for you any more."
domain_note = ""
thumb_lines = ["SHARDING", "WITH POSTGRESQL"]
thumb_code = "customer % 3 -> database"
youtube_title = "Sharding with PostgreSQL"
youtube_tags = ["sharding", "postgresql", "horizontal scaling", "consistent hashing", "databases", "java"]

[readme]
intro = """
This is the real-infrastructure version of the Sharding pattern. The plain
Java version, a separate project in this category, keeps each shard as a list
in one program. Here each shard is a real PostgreSQL database in its own
container, started by the demo itself, and a small router in the application
decides which database holds each customer and sends every query there.

Real databases make the costs concrete. A question about everyone must be
asked of every database and the answers added up by the application. A rule
that PostgreSQL enforces perfectly inside one database, such as a unique
coupon, no longer holds across shards. And adding a shard means moving data,
far less of it with consistent hashing than with a simple modulo.
"""
analogy = """
Think of a large library that splits its members across three branches by
membership number. Each branch keeps only its own members' records, so no
branch is overwhelmed. Asking about one member means phoning one branch;
asking how many books are overdue across the city means phoning all three and
adding up. And each branch can only stop its own members borrowing the same
book twice.
"""
scenario = """
On Black Friday the online store takes about 2,500 orders a minute, more than
one database can handle. Every read and every write of every order landed on
that one database.
"""
test_note = """
Every number the demo prints is asserted against real PostgreSQL databases.
Without a container runtime, the database test is skipped rather than failed.
"""
run_note = """
This project needs a running container runtime, such as Docker Desktop: the
demo starts real PostgreSQL 18.6 databases in containers and removes them
again. Without one, it prints a sentence saying what to start, rather than
failing.
"""
twin = """
The plain Java version got the idea right: split by a key, send one-customer
questions to one shard, ask every shard for questions about everyone, and pay
for resharding by moving customers. What it left out is what real databases
make visible. Each shard is its own server with its own connection and
tables. Cross-shard questions are merged by application code, not SQL. A
UNIQUE constraint only holds inside one database, so a one-use coupon was
accepted twice. No transaction spans two shards. And consistent hashing moves
630 customers where a modulo moves 1,874.
"""
technologies = [
    ["PostgreSQL", "18.6 (container image)", "three separate databases, one per shard"],
    ["PostgreSQL JDBC driver", "42.7.13", "talking to each database"],
    ["Testcontainers", "2.0.5", "starts and stops the database containers"],
    ["Docker", "24 or later", "runs the containers"],
]
costs = [
    "**Rules stop at the shard's edge.** A UNIQUE coupon was accepted on two shards; cross-shard rules are the application's job.",
    "**Questions about everyone ask everyone.** Every shard is queried and the answers merged in code.",
    "**Resharding moves data.** A fourth shard by modulo moved 1,874 of 2,500 customers; consistent hashing 630.",
]
too_much = """
While one database, perhaps with read replicas, keeps up, sharding only adds
work. Shard when writes outgrow the largest single database you can run.
"""
met_before = [
    "Citus, Vitess and other sharding layers for PostgreSQL and MySQL.",
    "MongoDB and Cassandra, which shard by a key built in.",
    "Consistent hashing in caches such as Memcached clients.",
]
where = """
This project is in [micro-services-design-patterns](..). It is the
real-infrastructure version of the plain Java Sharding project in the same
category, which is left unchanged.
"""

[[act]]
title = "One database"
summary = "One PostgreSQL holds all 2,500 orders; every read and write of Black Friday lands on it."
detail = """
All 2,500 orders go into a single PostgreSQL database. It holds them all, and
every read and write of Black Friday lands on that one server.
"""
speech = """
First demo: one database for every order. [[slnc 400]] Two and a half thousand orders go into one PostgreSQL database. [[slnc 600]]
Every read, and every write, of Black Friday lands on that one server.
"""
rows = { one = "active wrong" }
console = [
    ["one database: 2500 orders", "amber"],
]

[[act]]
title = "Three shards"
summary = "Three PostgreSQL databases, split by customer modulo 3: 833, 834 and 833 orders; customer 17 on shard-2, 42 on shard-0."
detail = """
Now there are three PostgreSQL databases, each in its own container. The
router puts each customer on the database numbered by customer number modulo
three. They hold 833, 834 and 833 orders. Customer 17 lives on shard 2, and
customer 42 on shard 0.
"""
speech = """
Second demo: three shards. [[slnc 400]] Three separate PostgreSQL databases. [[slnc 300]] The router picks one for each customer, from the customer number. [[slnc 600]]
They hold eight hundred and thirty-three, eight hundred and thirty-four, and eight hundred and thirty-three orders. [[slnc 500]]
Customer seventeen lives on shard two. [[slnc 300]] Customer forty-two on shard zero.
"""
rows = { router = "active ok", shards = "active ok" }
console = [
    ["shards: 833, 834, 833", "ok"],
    ["customer 17 -> shard-2", "muted"],
]

[[act]]
title = "One customer, one shard"
summary = "Customer 17's orders come from one database: [ORD-17], 1 shard asked."
detail = """
A question about one customer goes to one database only. Customer 17's
orders, ORD-17, come from shard 2; the other two databases are not asked.
"""
speech = """
Third demo: a question about one customer asks one shard. [[slnc 400]] Customer seventeen's orders come from shard two alone. [[slnc 500]]
The other two databases are not asked at all.
"""
rows = { router = "active ok", shards = "active ok" }
console = [
    ["customer 17: [ORD-17]; 1 shard asked", "ok"],
]

[[act]]
title = "Everyone, every shard"
summary = "Orders over £500: 1,250, from 3 databases added up in code; a UNIQUE coupon is accepted on two shards."
detail = """
"How many orders are over £500?" must be asked of all three databases, and the
application adds the answers: 1,250. Worse, rules PostgreSQL enforces inside
one database stop at its edge. The coupon WELCOME10 is UNIQUE in every shard,
yet customer 17 on shard 2 and customer 42 on shard 0 both redeem it: each
database only knows its own rows.
"""
speech = """
Fourth demo: a question about everyone asks every shard. [[slnc 400]] How many orders are over five hundred pounds? [[slnc 300]] All three databases are asked, and the application adds up the answers. [[slnc 300]] One thousand, two hundred and fifty. [[slnc 600]]
Worse. [[slnc 300]] A welcome coupon may only be used once. [[slnc 300]] Each database enforces that. [[slnc 500]]
But customer seventeen and customer forty-two live on different shards. [[slnc 300]] Both use it. [[slnc 300]] Each database only knows its own rows.
"""
rows = { router = "active amber", shards = "active wrong" }
console = [
    ["over £500: 1250, from 3 databases", "amber"],
    ["WELCOME10 accepted twice", "bad"],
]

[[act]]
title = "The bill: resharding"
summary = "A fourth shard by modulo moves 1,874 of 2,500 customers; jump consistent hashing moves 630."
detail = """
Adding a fourth shard with customer modulo four puts 1,874 of the 2,500
customers on a different database, and their orders must be copied across.
Jump consistent hashing moves only 630. And no transaction spans two shards,
while one very busy customer still overloads their one shard.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] A fourth shard is added. [[slnc 600]]
With the simple rule, customer number modulo four, one thousand eight hundred and seventy-four customers must move to another database. [[slnc 500]]
With consistent hashing, only six hundred and thirty. [[slnc 600]]
And no transaction covers two shards. [[slnc 300]] One very busy customer still overloads their own shard.
"""
rows = { shards = "active amber" }
console = [
    ["modulo 4: 1874 must move", "bad"],
    ["jump hash: 630 must move", "ok"],
]

[animation]
subtitle = "A router sends each customer's orders to one of three real PostgreSQL databases."
boxes = [
    ["one", "One database", "every order"],
    ["router", "ShardRouter", "customer % 3"],
    ["shards", "Three PostgreSQL shards", "833, 834, 833"],
]

