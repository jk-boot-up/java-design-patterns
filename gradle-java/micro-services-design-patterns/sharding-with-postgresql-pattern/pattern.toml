    "Java basics: JDBC in outline, loops.",
    "The Sharding idea, ideally from the plain Java version of this pattern.",
]
not_required = [
    "Earlier PostgreSQL experience. Plain SQL is used.",
]
install = [
    "A running container runtime such as Docker Desktop. The demo starts and removes the databases itself.",
]

[docs.dependencies]
intro = """
This project uses real PostgreSQL databases, run in containers by
Testcontainers, which the plain Java version of Sharding does not. Skipping it
loses none of the pattern: the plain version teaches all of it with nothing
installed.
"""
what = [
    ["PostgreSQL", "PostgreSQL is a relational database. Here there are three separate PostgreSQL servers, each with the same two tables. A UNIQUE constraint makes one database refuse a second row with the same value, but it only sees its own rows."],
    ["Testcontainers", "Testcontainers is a Java library that starts containers from inside a program and removes them afterwards. The demo starts the three databases at the same time."],
]
why = """
The plain version shows the idea. This version shows what three real
databases can no longer do together: answer one query, enforce one rule, or
share one transaction.
"""
versions = [
    ["Java", "21"],
    ["Docker", "running; 24 or later"],
    ["PostgreSQL image", "postgres:18.6-alpine"],
    ["PostgreSQL JDBC driver", "42.7.13"],
    ["Testcontainers", "2.0.5"],
]
costs = [
    "A container runtime, and several database containers to start.",
    "Routing, merging and cross-shard rules written in the application.",
]

[docs.session]
objectives = [
    "Route queries to shards by key.",
    "Merge a cross-shard query in code.",
    "Explain why a unique constraint no longer holds across shards.",
    "Compare modulo and consistent hashing for resharding.",
]
walkthrough = """
Run `./gradlew run` with Docker running. Open `ShardRouter`: `shardFor` is one
line; `countOver` loops over every database. End on act four's coupon and act
five's 1,874 against 630.
"""
exercises = [
    "Enforce the one-use coupon with a separate coupons database that every shard asks.",
    "Route with jump hash instead of modulo, and count the orders per shard.",
    "Move the customers that change shard when a fourth database is added.",
]

[docs.explained]
sentence = """
With PostgreSQL, sharding splits the data across separate databases by a key,
and a router in the application sends each query to the right one.
"""
verdict = """
Shard when writes outgrow one database. Choose a key most queries share,
route with consistent hashing, and keep rules that span customers in a place
every shard can see.
"""
recognise = [
    "A `shardFor(key)` method choosing a connection.",
    "Loops over several data sources that merge results.",
    "Sharding layers such as Citus or Vitess.",
]

[spec]
purpose = """
Teach Sharding with real PostgreSQL databases: one database for everything,
three shards behind a router, one-customer and all-customer queries, a unique
rule broken across shards, and resharding by modulo and by consistent
hashing.
"""
nongoals = [
    "Not a sharding layer such as Citus. The router is plain application code.",
]
problem = """
One database cannot take every read and write when load grows past it.
"""
roles = [
    ["The pattern", "`ShardRouter`"],
    ["The databases", "`Shards`"],
    ["Entry point", "`PostgresShardingDemo`, five acts"],
]
requirements = [
    "**Routed:** each customer's orders live on one database.",
    "**One shard:** a one-customer query asks one database.",
    "**Merged:** a cross-shard count asks all three.",
    "**No Docker, no crash:** without a runtime the demo prints advice.",
]

