[[scene]]
key = "01-poster"
kind = "poster"
title = "Sharding with PostgreSQL"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Sharding pattern, with real PostgreSQL databases, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] Sharding splits data across several databases, by a key such as the customer number. [[slnc 300]] So no single database has to take all the load. [[slnc 500]] PostgreSQL is an open-source relational database. [[slnc 300]] Here, three of them each hold a share of the shop's orders. [[slnc 600]]
Think of a library that splits its members across three branches, by membership number. [[slnc 300]] Asking about one member means phoning one branch. [[slnc 300]] Asking about everyone means phoning all three. [[slnc 700]]
In this video, the domain is an online shop's orders on Black Friday. [[slnc 500]]
By the end, you will hear how a router splits the orders. [[slnc 300]] Which questions get easier, and which get harder. [[slnc 300]] And what adding a shard costs.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["Black Friday: 2,500 orders", "a minute.", "", "One database took every", "read and every write."]
narration = """
Here is the scenario. [[slnc 400]] On Black Friday, the shop takes two and a half thousand orders a minute. [[slnc 500]]
One database took every read, and every write. [[slnc 300]] It became the limit.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["Several databases.", "A key decides where each", "row lives.", "", "A router sends each query", "to the right one."]
narration = """
Let's name the pattern. [[slnc 400]] Several databases, each holding a share. [[slnc 500]]
A key, here the customer number, decides where each row lives. [[slnc 500]]
And a router sends each query to the right database.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["ShardRouter: picks the database", "Shards: three PostgreSQL containers", "The application: merges answers"]
narration = """
Here is who does what. [[slnc 400]] The shard router picks the database for each customer, and sends each query there. [[slnc 500]]
The shards are three PostgreSQL databases, in containers. [[slnc 500]]
And the application itself merges answers from several shards.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Citus and Vitess", "MongoDB and Cassandra", "Consistent hashing in caches"]
narration = """
You have probably met this already. [[slnc 400]] Citus, and Vitess, add sharding to PostgreSQL and MySQL. [[slnc 500]]
MongoDB and Cassandra shard by a key, built in. [[slnc 500]]
And cache clients use consistent hashing to pick a server.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Writes outgrow one database.", "", "A key most queries share.", "Consistent hashing.", "Cross-shard rules in one place."]
narration = """
So, when should you use it? [[slnc 400]] When writes outgrow the largest single database you can run. [[slnc 500]]
Choose a key most queries share. [[slnc 300]] Route with consistent hashing. [[slnc 300]] And keep rules that span customers somewhere every shard can see.
"""

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Enforce the", "coupon across shards."]
narration = """
That's Sharding, with PostgreSQL. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Split the data by a key, and remember that each database only knows its own share. [[slnc 500]]
The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It needs Docker running, and starts the databases for you. [[slnc 500]]
Here is one exercise to try. [[slnc 300]] Make the one-use coupon hold across all shards. [[slnc 500]]
If this helped, a like really does help other people find it. [[slnc 300]] And subscribe, if you'd like the rest of the series. [[slnc 400]] Thanks for watching.
"""
