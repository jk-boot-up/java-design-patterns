plugins {
    id 'java'
    id 'application'
}

group = 'com.jk.explore'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // gRPC Java 1.84.0, the newest release: the client with its hedging policy, the server, and a
    // shaded Netty transport. Methods are described by hand with a text marshaller, so no protobuf
    // code generation is needed.
    implementation 'io.grpc:grpc-netty-shaded:1.84.0'
    implementation 'io.grpc:grpc-stub:1.84.0'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.jk.explore.hedgedgrpc.GrpcHedgedRequestsDemo'
}

test {
    useJUnitPlatform()
}
