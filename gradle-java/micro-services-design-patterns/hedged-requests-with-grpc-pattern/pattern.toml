    ["server", "Price server", "1 call in 33 paused"],
]

[docs.problem]
scenario = """
The product page calls the price service over gRPC; one call in thirty-three
takes a second.
"""
naive = """
Waiting on whichever attempt was sent makes the slowest pages take a second.
"""
deliver = [
    "The slow tail measured over real gRPC calls.",
    "A hedging policy in the service config.",
    "Losing attempts cancelled, seen on the server.",
    "Hedging at once doubling the load.",
    "A non-idempotent call hedged by mistake.",
    "Every printed result asserted by a test.",
]

[docs.prerequisites]
required = [
    "Java basics: maps, lists.",
    "The Hedged Requests idea, ideally from the plain Java version of this pattern.",
]
not_required = [
    "Protocol Buffers. Methods are described by hand with a text marshaller.",
]

[docs.dependencies]
intro = """
This project uses gRPC, which the plain Java version of Hedged Requests does
not. Skipping it loses none of the pattern: the plain version teaches all of
it with nothing installed.
"""
what = [
    ["gRPC", "gRPC is a framework for calling methods on another server. A channel is the client's connection. A method descriptor names a method and says how to turn requests and replies into bytes; here a simple text marshaller, instead of the usual Protocol Buffers. A service config is a set of policies for a channel; its hedgingPolicy gives the maximum attempts and the delay before each extra attempt, and applies only to the services or methods it names. enableRetry turns on this retry and hedging support. When an attempt loses, gRPC cancels it, and the server can check Context.current().isCancelled()."],
]
why = """
The plain version shows the idea with futures. This version shows hedging as
the framework feature most teams actually use: a policy, not code.
"""
install_note = "Only a JDK, version 21. Gradle downloads the rest, and the version is pinned:"
versions = [
    ["Java", "21"],
    ["gRPC Java (netty-shaded, stub)", "1.84.0"],
]
costs = [
    "A policy that must be scoped to safe methods.",
    "Extra server load, to be capped with throttling.",
]

[docs.session]
objectives = [
    "Configure a gRPC hedging policy in a service config.",
    "Choose a hedging delay.",
    "Show the server seeing a cancelled attempt.",
    "Scope hedging to methods that are safe to repeat.",
]
walkthrough = """
Run `./gradlew run`. Compare act one's 3 slow lookups with act two's 0. Open
`Channels.hedged`: the whole feature is a map. End on act five's two orders.
"""
exercises = [
    "Add a `retryThrottling` section and make the server slow for every call.",
    "Scope the policy to the Price method only, by method name.",
    "Try a hedging delay of 0.5 s and count slow lookups.",
]

[docs.explained]
sentence = """
With gRPC, hedging is a service-config policy: send another attempt after a
delay, take the first answer, and cancel the rest.
"""
verdict = """
Use gRPC's hedging for cheap, repeatable reads with a rare slow outlier. Scope
it to those methods, choose a delay near the normal worst case, and add
throttling.
"""
recognise = [
    "`\"hedgingPolicy\"` in a service config.",
    "`.defaultServiceConfig(...)` and `.enableRetry()` on a channel.",
    "Servers checking `Context.current().isCancelled()`.",
]

[spec]
purpose = """
Teach Hedged Requests with gRPC: a slow tail over real calls, a hedging
policy in the service config, losing attempts cancelled, hedging at once
doubling the load, and a non-idempotent call hedged by mistake.
"""
nongoals = [
    "Not Protocol Buffers or several replicas. One server, text messages.",
]
problem = """
A rare slow call sets the waiting time of every page that makes it.
"""
roles = [
    ["The policy", "`Channels.hedged`"],
    ["The server", "`PriceServer`"],
    ["The methods", "`Shop`"],
    ["Entry point", "`GrpcHedgedRequestsDemo`, five acts"],
]
requirements = [
    "**Tail cut:** no lookup takes over 0.2 s with hedging.",
    "**Few extra calls:** only slow lookups are hedged.",
    "**Cancelled:** losing attempts never reply.",
    "**Every printed result is asserted** in `DemoRunsTest`.",
]

