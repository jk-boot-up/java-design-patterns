narration = """
You have probably met this already. [[slnc 400]] gRPC's hedging and retry policies. [[slnc 500]]
Cassandra's speculative retry. [[slnc 500]]
And service meshes such as Envoy, which can hedge too.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
