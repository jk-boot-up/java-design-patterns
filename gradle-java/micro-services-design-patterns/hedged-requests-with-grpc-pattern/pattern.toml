# pattern.toml for the Hedged Requests with gRPC project. See tools/patternkit.

[project]
slug = "hedged-requests-with-grpc"
category = "micro-services-design-patterns"
title = "Hedged Requests with gRPC"
package = "hedgedgrpc"
main_class = "GrpcHedgedRequestsDemo"
tagline = "Hedging as a policy, not code"
bold = "Cut the slow tail of price lookups with gRPC's built-in hedging policy: a second attempt after 50 ms, set in the channel's service config, with the losing attempt cancelled by gRPC itself."
domain_note = ""
thumb_lines = ["HEDGED REQUESTS", "WITH GRPC"]
thumb_code = "hedgingPolicy: 0.05s"
youtube_title = "Hedged Requests with gRPC"
youtube_tags = ["hedged requests", "grpc", "tail latency", "service config", "retry", "java"]

[readme]
intro = """
This is the framework version of the Hedged Requests pattern. The plain Java
version, a separate project in this category, writes a hedger with threads
and futures. Here gRPC, the remote-call framework, does it: hedging is a
policy in the client channel's service config, not code in the shop. The
demo runs a real gRPC server on a local port and calls it for real.

The policy says: for calls to this service, if no answer has arrived after
50 milliseconds, send a second attempt, take whichever answers first, and
cancel the other. Because it is configuration, the same policy could be
delivered by a name resolver to every client of the service.
"""
analogy = """
Think of phoning a shop's two branches about the same item. You ring the
first; if nobody picks up within a few rings, you ring the second, take
whichever answers, and hang up on the other. Here the phone itself does this
for you, because someone set it to.
"""
scenario = """
The online store's product page asks the price service for each price. Most
answers take twenty milliseconds, but about one call in thirty-three lands on
a paused worker and takes a whole second, so the slowest pages wait that long.
"""
test_note = """
Every result the demo prints is asserted, against a real gRPC server on a
local port. Timings are printed as thresholds, and waits are bounded polls.
"""
run_note = """
Nothing to install beyond a Java 21 JDK: the gRPC server and client run inside
the program, over a local port.
"""
twin = """
The plain Java version got the idea right: hedge after a delay near the
normal worst case, take the first answer, cancel the other, never hedge what
is unsafe to repeat, and cap the extra load. What it left out is what a real
remote-call framework provides. In gRPC, hedging is a policy in the service
config, with no hedging code in the caller. gRPC cancels the losing attempt
and the server can see the cancellation. And the same policy wrongly applied
to PlaceOrder really does place an order twice, which is why gRPC applies it
per service or per method.
"""
technologies = [
    ["gRPC Java", "1.84.0", "client channel with a hedging policy, server, Netty transport"],
]
costs = [
    "**Only for calls safe to repeat.** Hedging PlaceOrder placed two orders for one click.",
    "**Extra load.** A delay of 0 sent 200 calls for 100 lookups; a 50 ms delay sent only 3 extra.",
    "**Cap it.** Under overload hedges add load; gRPC's `retryThrottling` stops hedging when too many calls fail.",
]
too_much = """
If calls are uniformly fast, or every call is expensive for the server, do
not hedge. Hedging pays off for cheap, repeatable reads with a rare slow
outlier.
"""
met_before = [
    "gRPC's `hedgingPolicy` and `retryPolicy` in a service config.",
    "Cassandra's speculative retry and HDFS hedged reads.",
    "Service meshes such as Envoy, which can hedge too.",
]
where = """
This project is in [micro-services-design-patterns](..). It is the framework
version of the plain Java Hedged Requests project in the same category, which
is left unchanged.
"""

[[act]]
title = "A slow tail"
summary = "100 price lookups over gRPC: 3 take about a second, the rest about 20 ms, so the 99th percentile is a whole second."
detail = """
The product page looks up a hundred prices over a plain gRPC channel. Three
land on a paused worker and take about a second; the rest take about twenty
milliseconds. So the slowest one percent of lookups, and the pages waiting on
them, take a whole second.
"""
speech = """
First demo: one call per price, and a slow tail. [[slnc 400]] The product page looks up a hundred prices, over gRPC. [[slnc 600]]
Three of them take about a second. [[slnc 300]] The rest, about twenty milliseconds. [[slnc 500]]
So the slowest pages wait a whole second.
"""
rows = { page = "active amber", server = "active wrong" }
console = [
    ["3 of 100 took about a second", "bad"],
]

[[act]]
title = "A hedging policy"
summary = "With hedgingPolicy (2 attempts, 0.05 s delay) in the service config: 0 lookups over 0.2 s, and gRPC sent 3 extra calls."
detail = """
The channel is given a service config with a hedging policy: up to two
attempts, the second after 0.05 seconds. The shop's code does not change. Now
none of the hundred lookups takes over 0.2 seconds, and gRPC sent only three
extra calls, one for each slow one.
"""
speech = """
Second demo: gRPC's hedging policy. [[slnc 400]] The channel gets one setting. [[slnc 300]] If no answer after fifty milliseconds, send a second attempt. [[slnc 600]]
The shop's code does not change at all. [[slnc 500]]
Now none of the hundred lookups is slow. [[slnc 300]] And gRPC sent just three extra calls.
"""
rows = { page = "active ok", policy = "active ok", server = "active ok" }
console = [
    ["0 over 0.2 s", "ok"],
    ["extra calls: 3", "ok"],
]

[[act]]
title = "The loser is cancelled"
summary = "The 3 slow attempts that lost see their call cancelled by gRPC and never reply."
detail = """
When the second attempt answers first, gRPC cancels the first. The server can
see this: the three slow attempts, when their pause ends, find their call
cancelled and never send a reply.
"""
speech = """
Third demo: the loser is cancelled. [[slnc 400]] When the second attempt answers first, gRPC cancels the first. [[slnc 600]]
The server can see it. [[slnc 300]] The three slow attempts find their call cancelled. [[slnc 300]] They never reply.
"""
rows = { policy = "active ok", server = "active ok" }
console = [
    ["cancelled, never replied: 3", "ok"],
]

[[act]]
title = "Hedge at once"
summary = "With hedgingDelay 0, 100 lookups send 200 calls: twice the load on the price service."
detail = """
With a hedging delay of zero, gRPC sends both attempts at once, every time. A
hundred lookups send two hundred calls: twice the load on the price service,
to save a few rare slow ones.
"""
speech = """
Fourth demo: hedge at once, with a delay of zero. [[slnc 400]] Every lookup is sent twice, immediately. [[slnc 600]]
A hundred lookups, two hundred calls. [[slnc 300]] Twice the load on the price service.
"""
rows = { policy = "active amber", server = "active amber" }
console = [
    ["100 lookups, 200 calls", "bad"],
]

[[act]]
title = "The bill"
summary = "Hedging PlaceOrder by mistake: the customer sees one confirmation, the server places 2 orders."
detail = """
The same policy, applied by mistake to the orders service, sends PlaceOrder
twice. The customer sees one confirmation; the server has placed two orders.
Hedge only reads, per service or per method, and cap hedges with gRPC's
retry throttling so an overloaded service is not sent more.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] The same policy is applied, by mistake, to placing orders. [[slnc 600]]
The customer sees one confirmation. [[slnc 300]] The server placed two orders. [[slnc 600]]
Hedge only reads. [[slnc 300]] And cap hedging, so an overloaded service is not sent even more.
"""
rows = { policy = "active wrong", server = "active wrong" }
console = [
    ["one click, 2 orders placed", "bad"],
]

