narration = """
So, when should you use it? [[slnc 400]] For cheap reads that are safe to repeat, with a rare slow outlier. [[slnc 500]]
Scope the policy to those methods. [[slnc 300]] Choose a delay near the normal worst case. [[slnc 300]] And add throttling.
"""

