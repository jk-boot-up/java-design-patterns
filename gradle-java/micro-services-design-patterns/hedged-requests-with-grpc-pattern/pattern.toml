[[scene]]
key = "01-poster"
kind = "poster"
title = "Hedged Requests with gRPC"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Hedged Requests pattern, with gRPC, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] If a call has not answered after a short wait, send the same call again. [[slnc 300]] Use whichever answer comes first, and cancel the other. [[slnc 500]] gRPC is an open-source framework for calling other services, and it can hedge for you, as a setting. [[slnc 600]]
Think of phoning two branches of a shop. [[slnc 300]] Ring one. [[slnc 300]] If nobody answers after a few rings, ring the other, and hang up on the first. [[slnc 700]]
In this video, the domain is an online shop's product page, asking a price service for each price. [[slnc 500]]
By the end, you will hear how one setting cuts the slow calls. [[slnc 300]] How gRPC cancels the loser. [[slnc 300]] And why an order must never be hedged.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["The product page asks for prices.", "", "Most answers: 20 ms.", "", "1 call in 33: a whole second."]
narration = """
Here is the scenario. [[slnc 400]] The product page asks the price service for each price, over gRPC. [[slnc 500]]
Most answers take twenty milliseconds. [[slnc 500]]
But about one call in thirty-three lands on a paused worker, and takes a whole second.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern, in gRPC"
body = ["A hedging policy in the", "channel's service config.", "", "maxAttempts: 2", "hedgingDelay: 0.05s", "", "Only for safe methods."]
narration = """
Let's name the pattern, in gRPC's words. [[slnc 400]] A hedging policy, in the channel's service config. [[slnc 500]]
Up to two attempts. [[slnc 300]] The second after fifty milliseconds. [[slnc 500]]
And applied only to methods that are safe to repeat.
"""

[[scene]]
key = "05-roles"
