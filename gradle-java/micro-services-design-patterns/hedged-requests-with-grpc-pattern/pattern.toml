narration = """
Here is who does what. [[slnc 400]] Channels builds a plain gRPC channel, or one with the hedging policy. [[slnc 500]]
The price server answers, and is sometimes slow. [[slnc 500]]
And shop describes the two methods, price and place order.
"""

[[scene]]
key = "06-recognise"
