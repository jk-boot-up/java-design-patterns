[[scene]]
key = "01-poster"
kind = "poster"
title = "Event-Carried State Transfer with Kafka"
narration = """
Hello, and welcome. [[slnc 400]] This video explains Event-Carried State Transfer, with a real Kafka broker, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] When data changes, the new data travels in the event itself. [[slnc 300]] So every service that cares can keep its own copy, and never call the owner back. [[slnc 500]] Kafka is an open-source event platform that keeps events on topics, so a copy can be built from them at any time. [[slnc 600]]
Think of a town noticeboard of address changes. [[slnc 300]] A new postman reads the board once, and knows every current address. [[slnc 700]]
In this video, the domain is an online shop, whose shipping service prints labels, and whose customer service owns the addresses. [[slnc 500]]
By the end, you will hear how a Kafka topic becomes shipping's copy. [[slnc 300]] How keys keep events in order. [[slnc 300]] And how a deletion travels too.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["Shipping prints labels.", "", "The customer service owns addresses.", "", "Shipping called it for every label."]
narration = """
Here is the scenario. [[slnc 400]] The shipping service prints delivery labels. [[slnc 500]]
The customer service owns the addresses. [[slnc 500]]
Shipping used to call it for every label. [[slnc 300]] When it was down, no labels were printed.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern, in Kafka"
body = ["Events carry the address.", "", "Keyed by customer: in order.", "Compacted: the latest per key.", "Tombstones: deletions."]
narration = """
Let's name the pattern, in Kafka's words. [[slnc 400]] Events carry the address. [[slnc 500]]
Keyed by customer, so each customer's events stay in order. [[slnc 300]] On a compacted topic, which keeps the latest per customer. [[slnc 500]]
And tombstones, to say a customer is gone.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["Kafka: the broker, in a container", "CustomerService: the owner", "ShippingCopy: built from events"]
narration = """
Here is who does what. [[slnc 400]] The Kafka class runs a real broker in a container, and sends and reads events. [[slnc 500]]
The customer service owns the addresses. [[slnc 500]]
And shipping's copy is built only from the events on the topic.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Compacted Kafka topics", "Kafka Streams KTables", "Change data capture"]
narration = """
You have probably met this already. [[slnc 400]] Compacted Kafka topics, used as a service's own table. [[slnc 500]]
Kafka Streams tables, which are exactly this local copy. [[slnc 500]]
And change data capture, which publishes every changed database row.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Many services read the data often.", "", "Key by entity.", "Honour tombstones.", "Copy only what you need."]
narration = """
So, when should you use it? [[slnc 400]] When many services read the same data often, and must keep working when its owner is down. [[slnc 500]]
Key events by the entity. [[slnc 300]] Honour tombstones. [[slnc 300]] And copy only the fields you need.
"""

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Keep a consumer", "running."]
narration = """
That's Event-Carried State Transfer, with Kafka. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Put the data in the event, key it by who it is about, and let every service keep its own copy. [[slnc 500]]
The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It needs Docker running, and starts Kafka for you. [[slnc 500]]
