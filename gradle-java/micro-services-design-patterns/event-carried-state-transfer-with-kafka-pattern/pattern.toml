]

[docs.explained]
sentence = """
With Kafka, state events keyed by entity on a compacted topic let any service
build and keep its own copy, in order, with deletions as tombstones.
"""
verdict = """
Carry state on a compacted, keyed Kafka topic when many services need the
data and must work when its owner is down. Key by entity, honour tombstones,
and copy only the fields each service needs.
"""
recognise = [
    "Topics with `cleanup.policy=compact`.",
    "Events keyed by an entity's identifier.",
    "Null-valued events used as deletes.",
]

[spec]
purpose = """
Teach Event-Carried State Transfer with a real Kafka broker: thin events and
call-backs, address events on a compacted keyed topic, a new copy built from
the topic, order kept by key, and a tombstone deleting a customer.
"""
nongoals = [
    "Not Kafka Streams or a cluster. One broker and the plain client are used.",
]
problem = """
Services that call a data owner for every use stop working when it is down.
"""
roles = [
    ["The broker in a container", "`Kafka`"],
    ["The owner", "`CustomerService`"],
    ["The local copy", "`ShippingCopy`"],
    ["Entry point", "`KafkaEventCarriedDemo`, five acts"],
]
requirements = [
    "**Independent:** labels print with the owner down.",
    "**Rebuildable:** a new copy is built by reading the topic.",
    "**Ordered by key:** keyed moves end on the latest address.",
    "**No Docker, no crash:** without a runtime the demo prints advice.",
]

