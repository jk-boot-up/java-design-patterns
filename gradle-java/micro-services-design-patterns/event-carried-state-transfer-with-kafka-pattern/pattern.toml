# pattern.toml for the Event-Carried State Transfer with Kafka project. See tools/patternkit.

[project]
slug = "event-carried-state-transfer-with-kafka"
category = "micro-services-design-patterns"
title = "Event-Carried State Transfer with Kafka"
package = "ecstkafka"
main_class = "KafkaEventCarriedDemo"
tagline = "A compacted topic of addresses"
bold = "Carry each customer's address in events on a real Kafka topic, keyed by customer and compacted, so shipping can build its own copy from the topic, keep each customer's updates in order, and learn of deletions through tombstones."
youtube_description = """Event-Carried State Transfer pattern in Java: the new data travels in the event, so each service keeps its own copy, and Kafka keeps events on topics so a copy can be rebuilt at any time, like a town noticeboard a new postman reads once. Explained with a real Kafka broker, using an online store where a customer service owns addresses and a shipping service prints labels. We replace thin events and call-backs, build a brand-new copy from the topic, keep order within a partition by keying on the customer, and treat deleting as an event. We finish with the bill."""
domain_note = ""
thumb_lines = ["EVENT-CARRIED STATE", "WITH KAFKA"]
thumb_code = "key = customer, compacted"
youtube_title = "Event-Carried State Transfer with Kafka"
youtube_tags = ["event-carried state transfer", "kafka", "compacted topic", "tombstone", "partition key", "java"]

[readme]
intro = """
This is the real-infrastructure version of the Event-Carried State Transfer
pattern. The plain Java version, a separate project in this category, passes
events by method calls and adds version numbers to keep them in order. Here a
real Kafka broker, started in a container by the demo itself, carries the
events.

Kafka changes three things. Events are kept on a topic, so a new copy can be
built by reading the topic from the beginning. Events with the same key go to
the same partition and stay in order, which replaces the version numbers. And
a compacted topic keeps the latest event for each key, with a tombstone, an
event with no value, meaning "this customer is gone".
"""
analogy = """
Think of a town's public noticeboard of address changes. Every move is pinned
up under the person's name, so a new postman can read the board once and know
every current address without asking anyone. Old notices for the same name
are taken down as new ones go up. And when someone leaves town, a notice says
so, and every postman must cross them off.
"""
scenario = """
The online store's shipping service prints delivery labels, and the customer
service owns the addresses. Shipping used to call the customer service for
every label, so when that service was down, no labels could be printed at all.
"""
test_note = """
Every number the demo prints is asserted against a real Kafka broker. Reads
stop when they have caught up with the topic, never after a fixed time.
Without a container runtime, the broker test is skipped rather than failed.
"""
run_note = """
This project needs a running container runtime, such as Docker Desktop: the
demo starts a real Kafka 4.3.1 broker in a container and removes it again.
Without one, it prints a sentence saying what to start, rather than failing.
"""
twin = """
The plain Java version got the idea right: put the address in the event, keep
a local copy, stop calling the owner, accept that the copy lags, and guard
against events arriving out of order. What it left out is what Kafka adds. The
topic is the history, so a brand-new copy is built by reading it from the
start. Keying events by customer keeps each customer's updates in order on
one partition, where the plain version needed version numbers; unkeyed
events on two partitions arrived in the wrong order. A compacted topic keeps
the latest address for each customer. And deleting is an event too: a
tombstone that every copy must honour.
"""
technologies = [
    ["Apache Kafka", "4.3.1 (container image apache/kafka)", "the topics, partitions, compaction and tombstones"],
    ["Kafka Java client", "4.3.1", "producing keyed events and reading topics"],
    ["Testcontainers", "2.0.5", "starts and stops the Kafka container from the demo"],
    ["Docker", "24 or later", "runs the container"],
    ["SLF4J simple", "2.0.17", "library logging, switched off"],
]
costs = [
    "**Order only within a partition.** Events for one customer must share a key, or they can arrive out of order.",
    "**Deleting is work.** A tombstone must be read and honoured by every copy, or personal data lives on.",
    "**More to run and store.** A Kafka cluster, a topic of every address, and a copy in each service.",
]
too_much = """
If only one or two services need the data, and rarely, calling the owner is
simpler. A Kafka topic of state pays off when many services read the data
often and must keep working when its owner is down.
"""
met_before = [
    "Compacted Kafka topics used as the source of a service's local table.",
    "Kafka Streams `KTable`s, which are exactly this local copy.",
    "Change data capture with Debezium, publishing every row change.",
]
where = """
This project is in [micro-services-design-patterns](..). It is the
real-infrastructure version of the plain Java Event-Carried State Transfer
project in the same category, which is left unchanged.
"""

[[act]]
title = "Thin events and call-backs"
summary = "Events say only \"changed\": 100 labels need 100 calls to the customer service, and with it down, 0 of 100 are printed."
detail = """
The customer service publishes events to Kafka that say only that a customer
changed. Shipping reads ten of them, but still has to call the customer
service for every label: a hundred labels, a hundred calls. When the customer
service is down, not one label is printed.
"""
speech = """
First demo: thin events on Kafka, and a call back for every label. [[slnc 400]] Each event says only, this customer changed. [[slnc 600]]
So shipping still asks the customer service for every address. [[slnc 300]] A hundred labels. [[slnc 300]] A hundred calls. [[slnc 600]]
The customer service goes down. [[slnc 300]] Not one label can be printed.
"""
rows = { owner = "active wrong", shipping = "active wrong" }
console = [
    ["100 labels, 100 calls", "amber"],
    ["owner down: 0 of 100", "bad"],
]

[[act]]
title = "The address in the event"
summary = "Address events on a compacted topic keyed by customer: shipping's copy holds 10 addresses and prints 100 of 100 labels with the owner down."
detail = """
Now each event carries the address, keyed by customer, on a compacted topic.
Shipping reads the topic into its own copy: ten addresses. With the customer
service still down, all hundred labels are printed, with no calls at all.
"""
speech = """
Second demo: the event carries the address. [[slnc 400]] Each event is keyed by the customer, on a topic that keeps the latest per customer. [[slnc 600]]
Shipping reads the topic into its own copy. [[slnc 300]] Ten addresses. [[slnc 500]]
The customer service is still down. [[slnc 300]] All hundred labels are printed. [[slnc 300]] No calls at all.
"""
rows = { topic = "active ok", shipping = "active ok", owner = "active amber" }
console = [
    ["copy holds 10 addresses", "ok"],
    ["owner down: 100 of 100, 0 calls", "ok"],
]

[[act]]
title = "A new copy from the topic"
summary = "C1 moves to York; a fresh shipping instance reads 11 events for 10 customers and prints York; the old copy still says Leeds."
detail = """
Customer C1 moves to York. A new shipping instance starts with nothing and
reads the topic from the beginning: eleven events for ten customers, and the
latest event for C1 wins, so its label goes to York. The old copy, which has
not read the new event yet, still says Leeds: copies lag until they read.
"""
speech = """
Third demo: a new copy, from the topic. [[slnc 400]] A customer moves, from Leeds to York. [[slnc 600]]
A brand-new shipping instance starts with nothing. [[slnc 300]] It reads the topic from the beginning. [[slnc 300]] Eleven events, for ten customers. [[slnc 500]]
The latest event wins. [[slnc 300]] Its label goes to York. [[slnc 500]]
The old copy has not read the new event yet. [[slnc 300]] It still says Leeds.
"""
rows = { topic = "active ok", shipping = "active amber" }
console = [
    ["fresh copy: 11 events, 10 customers", "ok"],
    ["C1 -> York; old copy -> Leeds", "amber"],
]

[[act]]
title = "Order within a partition"
summary = "Two moves on different partitions, read partition 1 first, leave Hull; keyed by customer on one partition, they end on Bristol."
detail = """
Customer C2 moves to Hull, then Bristol. Sent without a key to two different
partitions, and read partition 1 first, the older address, Hull, ends up in
the copy. Kafka only keeps order within a partition. Keyed by customer, both
events land on the same partition in order, and the copy ends on Bristol, with
no version numbers needed.
"""
speech = """
Fourth demo: Kafka keeps order only within a partition. [[slnc 400]] A customer moves to Hull, then to Bristol. [[slnc 600]]
Sent to two different partitions, and read in the wrong order, the copy ends on Hull. [[slnc 300]] The older address. [[slnc 600]]
Keyed by the customer, both events go to the same partition, in order. [[slnc 300]] The copy ends on Bristol. [[slnc 300]] No version numbers needed.
"""
rows = { topic = "active amber", shipping = "active ok" }
console = [
    ["two partitions: Hull (old)", "bad"],
    ["keyed, one partition: Bristol", "ok"],
]

[[act]]
title = "Deleting is an event"
summary = "C3 closes the account: a tombstone is sent, and a copy built from the topic holds 9 addresses and no label for C3."
detail = """
Customer C3 closes the account. The customer service sends a tombstone: an
event for C3 with no value. A copy built from the topic now holds nine
addresses, and C3 has no label. Every service holding a copy must read and
honour tombstones, or the address lives on; and the topic and every copy are
more data to store, secure and keep in step.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] Customer three closes the account. [[slnc 600]]
The customer service sends a special event, with no address at all. [[slnc 300]] Kafka calls it a tombstone. [[slnc 500]]
A copy built from the topic now holds nine addresses. [[slnc 300]] Customer three is gone. [[slnc 600]]
Every service with a copy must honour it. [[slnc 300]] Or the address lives on. [[slnc 300]] And every copy is more data to store, and protect.
"""
rows = { topic = "active amber", shipping = "active amber" }
console = [
    ["tombstone for C3", "muted"],
    ["copy holds 9; C3 has no label", "ok"],
]

[animation]
subtitle = "The customer service publishes address events to Kafka; shipping builds its own copy from the topic."
boxes = [
