plugins {
    id 'java'
    id 'application'
}

group = 'com.jk.explore'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // The Apache Kafka client 4.3.1, the newest release: producing keyed events and reading a topic.
    implementation 'org.apache.kafka:kafka-clients:4.3.1'

    // Testcontainers 2.0.5 starts and stops a real Kafka broker in a container for the demo itself.
    implementation 'org.testcontainers:testcontainers-kafka:2.0.5'

    // Kafka and Testcontainers log through SLF4J; the simple binding is switched off.
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.17'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.jk.explore.ecstkafka.KafkaEventCarriedDemo'
}

test {
    useJUnitPlatform()
}
