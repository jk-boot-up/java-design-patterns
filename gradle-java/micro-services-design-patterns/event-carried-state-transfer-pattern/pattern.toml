# pattern.toml for the Event-Carried State Transfer project. See tools/patternkit.

[project]
slug = "event-carried-state-transfer"
category = "micro-services-design-patterns"
title = "Event-Carried State Transfer"
package = "eventcarried"
main_class = "EventCarriedDemo"
tagline = "Put the data in the event"
bold = "Put the changed data itself in the event, so each service that cares can keep its own copy and never has to call the owner back."
domain_note = ""
thumb_lines = ["EVENT-CARRIED", "STATE TRANSFER"]
thumb_code = "AddressChanged(address)"
youtube_title = "Event-Carried State Transfer"
youtube_tags = ["event-carried state transfer", "events", "eventual consistency", "data replication", "microservices", "java"]

[readme]
intro = """
Event-Carried State Transfer is a way of sharing data between services with
events. A thin event only says that something changed, so every listener has
to call the owner back to find out what. With event-carried state transfer,
the event carries the new data itself: not "customer 42 changed", but
"customer 42's address is now 9 Mill Lane, York".

Each listening service keeps its own copy of just the data it needs, kept up
to date by the events. It can then work without calling the owner at all, even
when the owner is down. The price is that the copy is briefly out of date, and
the same data now lives in many places.
"""
analogy = """
Think of moving house. You could send your friends a card saying "I have
moved, ring me for the address", and they would all ring you. Or you send a
card with the new address on it, and each friend writes it in their own
address book. They can post you a letter even when you are not answering the
phone.
"""
scenario = """
The online store's shipping service prints delivery labels. The customer
service owns the customers' addresses. When a customer changed anything, it
sent a thin event, and shipping called it back for the address, once for
every label. A hundred labels meant a hundred calls, and when the customer
service was down, no labels could be printed.
"""
costs = [
    "**Briefly out of date.** A label printed before the event arrives uses the old address.",
    "**Order matters.** Events can arrive late or out of order; without version numbers the older address overwrote the newer one.",
    "**Copies everywhere.** Bigger events, more storage, and personal data such as addresses held by many services.",
]
too_much = """
When a service needs the data rarely, or must always see the very latest
value, calling the owner is simpler and exact. Carry state in events when many
services read the data often and must keep working when the owner is down.
"""
met_before = [
    "Kafka topics carrying full records, often compacted to the latest per key.",
    "Change data capture, such as Debezium, publishing row changes.",
    "Read models in [CQRS](../cqrs-pattern), built from events.",
]
where = """
This project is in [micro-services-design-patterns](..), and near
[Domain Event](../../domain-driven-design-patterns/domain-event-pattern) and
[Event Sourcing](../../platform-design-patterns/event-sourcing-pattern), which
also build on events but for different jobs.
"""

[[act]]
title = "A thin event, and a call back"
summary = "Shipping keeps no addresses: 100 labels mean 100 calls to the customer service, and with it down, 0 of 100 labels are printed."
detail = """
The customer service publishes a thin event that only says a customer
changed. The shipping service keeps nothing, so for every label it calls the
customer service for the address. A hundred labels mean a hundred calls. When
the customer service is down, not a single label can be printed.
"""
speech = """
First demo: a thin event, and a call back. [[slnc 400]] The customer service's event only says, a customer changed. [[slnc 500]]
So the shipping service asks for the address, every time it prints a label. [[slnc 300]] A hundred labels mean a hundred calls. [[slnc 600]]
Now the customer service goes down. [[slnc 300]] Not a single label can be printed.
"""
rows = { customers = "active wrong", shipping = "active wrong" }
console = [
    ["100 labels, 100 calls", "amber"],
    ["customer service down: 0 of 100", "bad"],
]

[[act]]
title = "The event carries the address"
summary = "Each AddressChanged event carries the address; shipping keeps its own copy of 10, prints 100 labels with 0 calls, and still prints all 100 with the customer service down."
detail = """
Now each event carries the new address. Shipping keeps its own copy of the
ten addresses it has heard about. A hundred labels need no calls at all, and
when the customer service goes down, all hundred labels are still printed.
"""
speech = """
Second demo: the event carries the address. [[slnc 400]] Now the event says, customer one's address is now this. [[slnc 500]]
The shipping service writes it into its own copy. [[slnc 300]] It keeps ten addresses. [[slnc 600]]
A hundred labels need no calls at all. [[slnc 300]] And with the customer service down, all hundred labels are still printed.
"""
rows = { events = "active ok", shipping = "active ok", customers = "active amber" }
console = [
    ["100 labels, 0 calls", "ok"],
    ["customer service down: 100 of 100", "ok"],
]

[[act]]
title = "The copy lags behind"
summary = "C1 moves to York; a label printed before the event arrives goes to Leeds, and after the event, to York."
detail = """
Customer C1 moves from Leeds to York. The event is still on its way when
shipping prints a label, so the label goes to the old address in Leeds. Once
the event arrives, labels go to York. The copy is always a little behind the
owner: this is eventual consistency.
"""
speech = """
Third demo: the copy lags behind. [[slnc 400]] A customer moves, from Leeds to York. [[slnc 300]] The event is still on its way. [[slnc 600]]
A label printed now, still goes to Leeds. [[slnc 500]]
Once the event arrives, labels go to York. [[slnc 500]]
The copy is always a little behind the owner. [[slnc 300]] This is called eventual consistency.
"""
rows = { events = "active amber", shipping = "active amber" }
console = [
    ["label now: Leeds", "bad"],
    ["after the event: York", "ok"],
]

[[act]]
title = "Events out of order"
summary = "Two moves arrive in reverse order: without versions the old Hull address wins; with versions, version 2 is ignored after 3, and Bristol wins."
detail = """
Customer C2 moves to Hull, then to Bristol, but the two events arrive in the
wrong order. A copy that simply takes the last event it received ends up
with Hull, the older address. Each event carries a version number, and a copy
that ignores anything older than what it holds keeps Bristol.
"""
speech = """
Fourth demo: events can arrive in the wrong order. [[slnc 400]] A customer moves to Hull, then to Bristol. [[slnc 300]] But the Bristol event arrives first. [[slnc 600]]
A copy that just takes the last event it received, ends up with Hull. [[slnc 300]] The older address. [[slnc 600]]
So each event carries a version number. [[slnc 300]] The copy ignores anything older than what it has. [[slnc 300]] And it keeps Bristol.
"""
rows = { events = "active amber", shipping = "active ok" }
console = [
    ["without versions: Hull", "bad"],
    ["with versions: Bristol", "ok"],
]

[[act]]
title = "The bill"
summary = "Shipping, invoicing and marketing each keep a copy of every address: bigger events, briefly stale copies, and personal data in more places."
detail = """
Every service that cares keeps its own copy. Shipping, invoicing and
marketing each hold every customer's address. Events are bigger, copies are
briefly stale, and personal data now lives in many places, each of which must
protect it and delete it when asked.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] Every service that cares keeps its own copy. [[slnc 500]]
Shipping, invoicing and marketing, each hold every customer's address. [[slnc 500]]
The events are bigger. [[slnc 300]] The copies are briefly out of date. [[slnc 300]] And personal data now lives in many places. [[slnc 300]] Each must protect it, and delete it when asked.
"""
rows = { shipping = "active amber" }
console = [
    ["an address copy in every service", "amber"],
    ["personal data in more places", "bad"],
]

