[docs.prerequisites]
required = [
    "Java basics: records, `Map`.",
    "What an event is: a message saying something happened.",
]
not_required = [
    "A message broker. Events are delivered by method calls, in the order the demo chooses.",
]

[docs.session]
objectives = [
    "Contrast thin notification events with state-carrying events.",
    "Keep a local copy filled from events.",
    "Explain eventual consistency with a concrete stale read.",
    "Guard a copy against out-of-order events with versions.",
]
walkthrough = """
Run `./gradlew run` and compare act one's 0 of 100 with act two's 100 of 100.
Open `ReplicaShipping.on`: one map, one version check. End on act four's two
lines.
"""
exercises = [
    "Add a `CustomerDeleted` event and remove the copy when it arrives.",
    "Let shipping keep only the city and postcode it needs, not the whole address.",
    "Replay all events to rebuild shipping's copy from scratch.",
]

[docs.explained]
sentence = """
Event-Carried State Transfer puts the changed data in the event, so listeners
keep their own copies and never call the owner back.
"""
verdict = """
Carry state in events when many services read the data often and must keep
working when its owner is down. Include a version, accept brief staleness,
copy only the fields each service needs, and remember every copy is data to
protect.
"""
recognise = [
    "Events named `...Changed` carrying full records.",
    "A service's own table of another service's data, filled by a listener.",
    "Compacted Kafka topics used as the source of a local copy.",
]

[spec]
purpose = """
Teach Event-Carried State Transfer with an online store's shipping labels:
thin events forcing a call per label and failing with the owner down, events
carrying the address into a local copy, a stale label during the delay,
versions guarding against out-of-order events, and the cost of copies.
"""
nongoals = [
    "Not a real message broker. Events are delivered directly, in a chosen order.",
]
problem = """
Services that must call the data's owner back for every event depend on it
being up and pay a call for every use.
"""
roles = [
    ["The owner", "`CustomerService`"],
    ["The events", "`Events.CustomerChanged`, `Events.AddressChanged`"],
    ["The pattern: a local copy", "`ReplicaShipping`"],
    ["The old way", "`CallbackShipping`"],
    ["Entry point", "`EventCarriedDemo`, five acts"],
]
requirements = [
    "**No calls:** labels come from the local copy.",
    "**Independent:** labels print with the owner down.",
    "**Ordered by version:** an older event never replaces a newer one.",
    "**Every printed result is asserted** in `DemoRunsTest`.",
]

