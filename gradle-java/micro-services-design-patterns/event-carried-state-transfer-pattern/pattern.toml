[[scene]]
key = "01-poster"
kind = "poster"
title = "Event-Carried State Transfer"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Event-Carried State Transfer pattern, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] When data changes, put the new data in the event itself. [[slnc 300]] Then each service that cares keeps its own copy. [[slnc 300]] And never has to call the owner back. [[slnc 600]]
Think of moving house. [[slnc 300]] You could send friends a card saying, I have moved, ring me for the address. [[slnc 300]] Or you send a card with the new address on it. [[slnc 300]] Each friend writes it in their own address book, and can post you a letter even when you are not answering the phone. [[slnc 700]]
In this video, the domain is an online shop. [[slnc 300]] A customer service owns the addresses, and a shipping service prints delivery labels. [[slnc 500]]
By the end, you will hear why thin events tie services together. [[slnc 300]] How carrying the address sets shipping free. [[slnc 300]] Why the copy is briefly out of date. [[slnc 300]] And how version numbers handle events arriving out of order.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["Shipping prints delivery labels.", "", "The customer service owns addresses.", "", "Its event said only:", "a customer changed."]
narration = """
Here is the scenario. [[slnc 400]] The shipping service prints delivery labels. [[slnc 500]]
The customer service owns the customers' addresses. [[slnc 500]]
Its event only said, a customer changed. [[slnc 300]] So shipping had to ask for the address, every time.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["The event carries the new data.", "", "Listeners keep their own copy.", "", "No calls back to the owner."]
narration = """
Let's name the pattern. [[slnc 400]] The event carries the new data, not just the news that something changed. [[slnc 500]]
Each listening service keeps its own copy, of just the data it needs. [[slnc 500]]
And it never calls the owner back.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["CustomerService: owns addresses", "AddressChanged: carries the address", "ReplicaShipping: keeps its own copy", "CallbackShipping: the old way"]
narration = """
Here is who does what. [[slnc 400]] The customer service owns the addresses, and publishes each change. [[slnc 500]]
The address changed event carries the customer, the new address, and a version number. [[slnc 500]]
The shipping service keeps its own copy, and prints labels from it. [[slnc 300]] The call-back version of shipping is the old way.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Kafka topics with full records", "Change data capture", "CQRS read models"]
narration = """
You have probably met this pattern already. [[slnc 400]] Kafka topics that carry whole records, not just identifiers. [[slnc 500]]
Change data capture tools, which publish every changed database row. [[slnc 500]]
And the read side of CQRS, built from events.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Many services read the data often.", "", "Include a version.", "Accept brief staleness.", "Copy only what you need."]
narration = """
So, when should you use it? [[slnc 400]] When many services read the same data often. [[slnc 300]] And must keep working when its owner is down. [[slnc 500]]
Include a version in every event. [[slnc 300]] Accept that copies are briefly out of date. [[slnc 300]] And copy only the fields each service needs.
"""

