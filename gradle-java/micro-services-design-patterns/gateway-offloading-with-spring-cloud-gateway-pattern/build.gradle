plugins {
    id 'java'
    id 'application'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.jk.explore'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2025.1.3'
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Cloud Gateway (release train 2025.1.3, for Spring Boot 4.1.1): the gateway, its routes and filters,
    // on Reactor Netty, which also compresses responses when asked.
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.jk.explore.offloadgateway.GatewayOffloadingSpringDemo'
}

bootJar {
    mainClass = 'com.jk.explore.offloadgateway.GatewayOffloadingSpringDemo'
}

test {
    useJUnitPlatform()
}
