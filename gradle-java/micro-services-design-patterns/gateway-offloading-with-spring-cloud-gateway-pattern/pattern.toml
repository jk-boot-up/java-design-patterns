[[scene]]
key = "01-poster"
kind = "poster"
title = "Gateway Offloading with Spring Cloud Gateway"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Gateway Offloading pattern, with Spring Cloud Gateway, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] Many services need the same chores on every request. [[slnc 300]] Checking who the caller is, limiting how often they call, compressing the answer. [[slnc 300]] Gateway offloading moves those chores into the gateway in front of them. [[slnc 500]] Spring Cloud Gateway is an open-source gateway, built on Spring. [[slnc 600]]
Think of an office reception desk. [[slnc 300]] Visitors sign in once at the front door. [[slnc 300]] The teams upstairs trust that anyone in the corridor was checked. [[slnc 700]]
In this video, the domain is an online shop, with catalog, cart and orders services. [[slnc 500]]
By the end, you will hear how three copies of a check drifted apart. [[slnc 300]] How one gateway filter replaces them. [[slnc 300]] And why there must be no side door.
"""

