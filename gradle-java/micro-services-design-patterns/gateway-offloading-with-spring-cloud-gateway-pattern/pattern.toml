# pattern.toml for the Gateway Offloading with Spring Cloud Gateway project. See tools/patternkit.

[project]
slug = "gateway-offloading-with-spring-cloud-gateway"
category = "micro-services-design-patterns"
title = "Gateway Offloading with Spring Cloud Gateway"
package = "offloadgateway"
main_class = "GatewayOffloadingSpringDemo"
tagline = "The chores, done once, at a real gateway"
bold = "Put a real Spring Cloud Gateway in front of the shop's catalog, cart and orders services, and move the shared chores into it: the sign-in check, a per-customer rate limit, response compression, and stripping a caller's claim to be someone else."
youtube_description = """Gateway Offloading pattern in Java: checking the caller, limiting how often they call and compressing the answer move into the gateway in front of the services, like an office reception where the teams upstairs trust that everyone in the corridor was checked. Explained with Spring Cloud Gateway, using an online store's catalog, cart and orders services. We watch three copies of a check drift apart, check once at the gateway, add a token-bucket rate limit and compression, and learn that every other door must then be locked. We finish with the bill."""
domain_note = ""
thumb_lines = ["GATEWAY OFFLOADING", "WITH SPRING CLOUD"]
thumb_code = "GlobalFilter + routes"
youtube_title = "Gateway Offloading with Spring Cloud Gateway"
youtube_tags = ["gateway offloading", "spring cloud gateway", "api gateway", "rate limiting", "spring boot", "java"]

[readme]
intro = """
This is the framework version of the Gateway Offloading pattern. The plain
Java version, a separate project in this category, writes a gateway as a
class. Here a real Spring Cloud Gateway runs on a local port in front of three
real back-end services, and every request in the demo is a real HTTP call.

The gateway has one route per service. A global filter, which runs before any
route, does the chores every service needs: it checks the sign-in token,
limits each customer's requests, removes any X-Customer header the caller
sent, and adds the checked customer instead. Reactor Netty, the server
underneath, compresses responses when a property says so. The services
behind hold no sign-in code at all.
"""
analogy = """
Think of an office building with a reception desk. Visitors sign in once at
the front door; the teams upstairs trust that anyone in the corridor has
been checked. Reception also turns away anyone who keeps coming back too
often. That only works if there is no side door.
"""
scenario = """
The online store has three services: catalog, cart and orders. Each checked
the customer's sign-in token itself, with its own copy of the code, and the
orders team's copy forgot to check expiry.
"""
test_note = """
Every result the demo prints is asserted, with real back-end services and a
real Spring Cloud Gateway on local ports, called over HTTP.
"""
run_note = """
Nothing to install beyond a Java 21 JDK: the three services and the gateway
all start inside the program, on local ports.
"""
twin = """
The plain Java version got the idea right: one check at the door, the same
for every service, rate limits and compression in one place, and the side
door and single point of failure as the costs. What it left out is a real
gateway. Here the check is a Spring Cloud Gateway global filter that runs
before any route; compression is a server property, not code; a spoofed
X-Customer header is stripped before the request goes on; and the routes are
real HTTP forwarding to real services. It also names what a single gateway
cannot do alone: its in-memory rate limit counts only on that one instance,
which is why production uses the built-in limiter with Redis.
"""
technologies = [
    ["Spring Cloud Gateway", "release train 2025.1.3 (server-webflux)", "routes and the global filter"],
    ["Spring Boot", "4.1.1", "the gateway application"],
    ["Reactor Netty", "with Spring Boot 4.1.1", "the gateway's server, with response compression"],
    ["JDK HttpServer", "Java 21", "the three back-end services"],
]
costs = [
    "**No side doors.** A call straight to the orders service, claiming to be ben, was answered 200.",
    "**One more hop, one more thing to run.** Every request passes the gateway, and a gateway outage stops every page.",
    "**Shared counts need shared storage.** The in-memory rate limit counts per gateway instance; production uses RequestRateLimiter with Redis.",
]
too_much = """
With one or two services, a shared library does the job without a gateway.
Offloading pays off when many services, often from different teams, need
exactly the same chores.
"""
met_before = [
    "Spring Cloud Gateway global filters and route filters.",
    "Kong, NGINX, Envoy and cloud API gateways with auth and rate-limit plugins.",
    "`server.compression.enabled` on Spring Boot servers.",
]
where = """
This project is in [micro-services-design-patterns](..). It is the framework
version of the plain Java Gateway Offloading project in the same category,
which is left unchanged.
"""

[[act]]
title = "Every service checks for itself"
summary = "Called directly, catalog and cart refuse an expired token with 401, but orders answers 200, because its copy of the check forgot expiry."
detail = """
Three real services each check the sign-in token themselves. An expired token
is refused by catalog and by cart with 401, token expired. The orders
service answers 200, orders for ana, because its copy of the check never looks
at the expiry.
"""
speech = """
First demo: every service checks the sign-in token itself. [[slnc 400]] The customer's token expired a minute ago. [[slnc 600]]
The catalog service refuses it. [[slnc 300]] The cart service refuses it. [[slnc 300]] The orders service lets the customer in. [[slnc 600]]
Its copy of the check forgot about expiry.
"""
rows = { catalog = "active ok", cart = "active ok", orders = "active wrong" }
console = [
    ["catalog, cart: 401 token expired", "ok"],
    ["orders: 200 orders for ana", "bad"],
]

[[act]]
title = "One check at the gateway"
summary = "Through Spring Cloud Gateway, the expired token gets 401 for all three services; a valid one reaches orders: 200 orders for ana."
detail = """
Now every request goes through a Spring Cloud Gateway. Its global filter
checks the token before any route: the expired token is refused with 401 for
catalog, cart and orders alike. A valid token reaches the orders service,
with the customer passed on in the X-Customer header. The services hold no
sign-in code at all.
"""
speech = """
Second demo: Spring Cloud Gateway checks the token, once. [[slnc 400]] A filter runs before any route. [[slnc 600]]
The expired token is refused for all three services. [[slnc 500]]
A valid token gets through. [[slnc 300]] The gateway tells the orders service who the customer is. [[slnc 500]]
The services hold no sign-in code at all.
"""
rows = { gateway = "active ok", catalog = "active ok", cart = "active ok", orders = "active ok" }
console = [
    ["expired -> all three: 401", "ok"],
    ["valid -> orders: 200", "ok"],
]

[[act]]
title = "Rate limiting"
summary = "The gateway allows 5 requests a minute per customer: 8 in a row give 5 passed and 3 refused with 429."
detail = """
The same filter keeps a token bucket for each customer: five requests, refilled
at five a minute. Eight requests in a row: five pass and three are refused
with 429, too many requests. No service had to write a limiter.
"""
speech = """
Third demo: rate limiting at the gateway. [[slnc 400]] Each customer may make five requests a minute. [[slnc 600]]
Eight requests in a row. [[slnc 300]] Five pass. [[slnc 300]] Three are refused, with too many requests. [[slnc 500]]
No service had to write a limiter.
"""
rows = { gateway = "active ok" }
console = [
    ["8 requests: 5 passed, 3 refused (429)", "ok"],
]

[[act]]
title = "Compression"
summary = "The 10,093-byte catalog page comes back gzipped at the gateway, under a fifth of the size; the catalog service knows nothing about it."
detail = """
Reactor Netty, the gateway's server, is told by three properties to compress
JSON responses. The catalog page, 10,093 bytes plain, comes back with
Content-Encoding gzip at under a fifth of the size. The catalog service knows
nothing about compression.
"""
speech = """
Fourth demo: compression at the gateway. [[slnc 400]] The catalog page is about ten thousand bytes. [[slnc 600]]
Three settings on the gateway's server switch compression on. [[slnc 500]]
The page arrives compressed, at under a fifth of its size. [[slnc 300]] The catalog service knows nothing about it.
"""
rows = { gateway = "active ok", catalog = "active ok" }
console = [
    ["catalog: 10093 bytes plain", "muted"],
    ["gzip: under a fifth", "ok"],
]

[[act]]
title = "The bill"
summary = "Through the gateway, a spoofed X-Customer: ben is replaced with ana; straight to orders, the same header gets 200 orders for ben."
detail = """
Through the gateway, a caller with ana's token who adds X-Customer: ben still
gets ana's orders, because the gateway removes the header and sets its own.
But straight to the orders service, the same header is believed: 200, orders
for ben. The services must be reachable only through the gateway, and every
request now passes one more hop.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] Through the gateway, a caller claims to be Ben. [[slnc 300]] The gateway removes the claim, and says Ana. [[slnc 600]]
But straight to the orders service, the same claim is believed. [[slnc 300]] Ben's orders. [[slnc 600]]
The services must be reachable only through the gateway. [[slnc 300]] And every request passes one more hop.
"""
rows = { gateway = "active ok", orders = "active wrong" }
console = [
    ["via gateway, spoofed ben: ana's orders", "ok"],
    ["straight to orders as ben: 200", "bad"],
]

[animation]
subtitle = "Requests pass a real Spring Cloud Gateway, whose filter checks, limits and passes on the customer."
boxes = [
    ["gateway", "Spring Cloud Gateway", "filter: sign-in, limit"],
    ["catalog", "Catalog", "service"],
    ["cart", "Cart", "service"],
    ["orders", "Orders", "service"],
]

