That's Gateway Offloading, with Spring Cloud Gateway. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Do the shared chores once, at the door, and lock every other door. [[slnc 500]]
The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs offline, with nothing installed except a Java development kit. [[slnc 500]]
