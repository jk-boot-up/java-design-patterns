Here is who does what. [[slnc 400]] The sign-in filter does the chores, for every route. [[slnc 500]]
The gateway app holds the routes. [[slnc 500]]
And each shop service just does its own business, trusting the gateway.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
