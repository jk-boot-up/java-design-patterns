[docs.dependencies]
intro = """
This project uses Spring Cloud Gateway, which the plain Java version of
Gateway Offloading does not. Skipping it loses none of the pattern: the plain
version teaches all of it with nothing installed.
"""
what = [
    ["Spring Cloud Gateway", "Spring Cloud Gateway is a gateway built on Spring Boot and the reactive web stack. A route matches requests, here by path, and forwards them to a service's address. A global filter runs for every route, before forwarding; it can refuse a request, or change it, for example by adding or removing headers."],
    ["Reactor Netty", "Reactor Netty is the server underneath the gateway. The Spring Boot properties server.compression.enabled, mime-types and min-response-size make it gzip responses for clients that ask."],
    ["Release trains", "Spring Cloud versions come in release trains that match a Spring Boot line: train 2025.1.3 goes with Spring Boot 4.1.1."],
]
why = """
The plain version shows the idea. This version shows the gateway most Spring
teams actually run, and where each chore lives in it.
"""
install_note = "Only a JDK, version 21. Gradle downloads the rest, and the versions are pinned:"
versions = [
    ["Java", "21"],
    ["Spring Boot", "4.1.1"],
    ["Spring Cloud release train", "2025.1.3"],
]
costs = [
    "A reactive framework to learn for filters.",
    "A gateway to run with high availability.",
]

[docs.session]
objectives = [
    "Define gateway routes to real services.",
    "Write a global filter that checks, limits and passes on the customer.",
    "Switch on response compression by configuration.",
    "Explain why services must not be reachable around the gateway.",
]
walkthrough = """
Run `./gradlew run`. Open `SignInFilter.filter`: check, limit, strip, add.
Open `GatewayApp.routes`: three lines. End on act five's side door.
"""
exercises = [
    "Replace the in-memory limiter with RequestRateLimiter and Redis.",
    "Add a route filter that adds a request identifier header for tracing.",
    "Make the services refuse calls without a secret header only the gateway adds.",
]

[docs.explained]
sentence = """
With Spring Cloud Gateway, offloading puts the shared chores in a global
filter and server settings, so every service behind gets them for free.
"""
verdict = """
Offload generic chores to the gateway when many services need them. Strip
headers the services will trust, share rate-limit state across gateway
instances, block every side door, and run the gateway as the critical piece
it is.
"""
recognise = [
    "`GlobalFilter` beans with an order.",
    "`RouteLocatorBuilder` routes, or `spring.cloud.gateway` route properties.",
    "Services that read the caller from a header set by the gateway.",
]

[spec]
purpose = """
Teach Gateway Offloading with Spring Cloud Gateway: services checking tokens
themselves, one gateway filter checking once, rate limiting, response
compression, and the stripped spoof and side door.
"""
nongoals = [
    "Not JWTs or Redis. Tokens are simple strings; the limiter is in memory.",
]
problem = """
Every service re-implements the same chores, and the copies drift apart.
"""
roles = [
    ["The chores", "`SignInFilter`"],
    ["The routes", "`GatewayApp`"],
    ["The services", "`ShopService`"],
    ["The tokens", "`Tokens`"],
    ["Entry point", "`GatewayOffloadingSpringDemo`, five acts"],
]
requirements = [
    "**One check:** expired tokens get 401 for every route.",
    "**Limited:** five requests per customer per minute.",
    "**No spoofing:** a caller's X-Customer is replaced.",
    "**Every printed result is asserted** in `DemoRunsTest`.",
]

