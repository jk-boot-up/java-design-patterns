narration = """
You have probably met this already. [[slnc 400]] Filters in Spring Cloud Gateway. [[slnc 500]]
Authentication and rate-limit plugins in Kong, NGINX and Envoy. [[slnc 500]]
And the gateways every cloud provider offers.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Many services, same chores.", "", "Strip trusted headers.", "Share limiter state.", "No side doors."]
narration = """
So, when should you use it? [[slnc 400]] When many services need exactly the same chores. [[slnc 500]]
Strip any header the services will trust. [[slnc 300]] Share rate-limit counts across gateways. [[slnc 300]] And leave no side doors.
"""

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
