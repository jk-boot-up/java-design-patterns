narration = """
Let's name the pattern, in Spring Cloud Gateway's words. [[slnc 400]] One route for each service. [[slnc 500]]
A global filter, run before every route, checks sign-in, limits requests, and passes on who the customer is. [[slnc 500]]
And server settings switch on compression.
"""

[[scene]]
key = "05-roles"
