key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["Catalog, cart and orders.", "", "Each checked the token itself.", "", "Orders forgot expiry."]
narration = """
Here is the scenario. [[slnc 400]] The shop has three services. [[slnc 300]] Catalog, cart and orders. [[slnc 500]]
Each one checked the customer's sign-in token itself. [[slnc 500]]
The orders service forgot to check whether the token had expired.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
