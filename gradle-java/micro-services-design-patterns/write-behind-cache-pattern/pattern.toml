[[scene]]
key = "01-poster"
kind = "poster"
title = "Write-Behind Cache"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Write-Behind Cache pattern, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] A write-behind cache keeps each change in fast memory, and answers straight away. [[slnc 300]] A few seconds later, it saves the changes to the database, in one batch. [[slnc 300]] A record that changed ten times is saved only once. [[slnc 600]]
Think of typing a long document on a computer. [[slnc 300]] Every letter appears at once. [[slnc 300]] But the file is saved only every few minutes. [[slnc 300]] And everyone has lost a paragraph to a power cut, just before the save. [[slnc 700]]
In this video, the domain is an online shop. [[slnc 300]] Customers change their shopping carts all the time. [[slnc 300]] Add a mug, make it two, remove the tea, add it back. [[slnc 500]]
By the end, you will hear what it costs to save every change at once. [[slnc 300]] How write-behind turns thirty writes into three. [[slnc 300]] What happens when the database is down. [[slnc 300]] And exactly what is lost in a crash.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["Customers change their carts", "again and again.", "", "Every change was saved to the", "database before the page answered:", "20 milliseconds, every click."]
narration = """
Here is the scenario. [[slnc 400]] Customers change their carts again and again. [[slnc 500]]
Every change was saved to the database before the page answered. [[slnc 300]] A database is the safe, permanent store, but writing to it is slow. [[slnc 300]] Here, twenty milliseconds, on every click. [[slnc 500]]
And most of those saves were replaced a second later, by the next change.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["Change memory; answer at once.", "Mark the record dirty.", "", "Every few seconds, flush:", "save each dirty record once.", "", "Crash before the flush? Lost."]
narration = """
Let's name the pattern. [[slnc 400]] Make the change in memory, and answer at once. [[slnc 300]] Mark the record as dirty. [[slnc 500]]
Every few seconds, flush. [[slnc 300]] Save each dirty record once, with its latest contents. [[slnc 300]] If the database is down, keep it dirty, and try again next time. [[slnc 500]]
And accept one thing. [[slnc 300]] A change made after the last flush is lost if the server crashes.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["CartStore: set and get a cart", "WriteBehindStore: memory + dirty set", "flush(): one write per dirty cart", "Database: slow and safe", "WriteThroughStore: the old way"]
narration = """
Here is who does what. [[slnc 400]] Cart store is the interface: set a quantity, and get a cart. [[slnc 500]]
The write-behind store keeps carts in memory, and a set of dirty carts. [[slnc 300]] Its flush method saves each dirty cart once. [[slnc 500]]
The database is slow and safe. [[slnc 300]] And the write-through store is the old way, kept for comparison.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Your operating system's disk writes", "Redis and Hazelcast write-behind", "Autosave in editors", "Page-view counters saved in batches"]
narration = """
You have probably met this pattern already. [[slnc 400]] Your operating system keeps file writes in memory, and saves them to disk a moment later. [[slnc 500]]
Caches such as Hazelcast offer write-behind as a setting. [[slnc 500]]
Autosave in an editor is the same idea. [[slnc 300]] And so are page view counters, collected in memory, and saved in batches.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Use it for data that changes often", "and can be lost: carts, counters,", "drafts.", "", "Flush often, and on shutdown.", "", "Never for orders, payments, stock."]
narration = """
So, when should you use it? [[slnc 400]] Use write-behind for data that changes often, and can be lost without real harm. [[slnc 300]] Carts, counters, drafts. [[slnc 500]]
Flush often. [[slnc 300]] Flush when the server shuts down cleanly. [[slnc 300]] And retry when the database is down. [[slnc 500]]
Never use it for orders, payments, or stock. [[slnc 300]] Those must be safe the moment the customer is told they worked.
"""

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a flush", "on shutdown."]
narration = """
That's the Write-Behind Cache pattern. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Answer now, save in a moment, and only for what you can afford to lose. [[slnc 500]]
The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs offline, with nothing installed except a Java development kit. [[slnc 500]]
