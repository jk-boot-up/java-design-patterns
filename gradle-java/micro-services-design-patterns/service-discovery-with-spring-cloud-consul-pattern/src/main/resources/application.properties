spring.main.banner-mode=off
logging.level.root=OFF
server.port=0
# Discovery: only instances whose health check passes are returned, and the check runs every second
# so the demo does not wait ten.
spring.cloud.consul.discovery.query-passing=true
spring.cloud.consul.discovery.health-check-interval=1s
spring.cloud.consul.discovery.health-check-timeout=1s
spring.cloud.consul.discovery.ip-address=127.0.0.1
spring.cloud.consul.discovery.prefer-ip-address=true
# Ask Consul every time, so what the demo prints is what Consul says now.
spring.cloud.loadbalancer.cache.enabled=false
management.endpoints.web.exposure.include=health
