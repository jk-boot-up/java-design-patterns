# pattern.toml for the Write-Through Cache project. See tools/patternkit.

[project]
slug = "write-through-cache"
category = "micro-services-design-patterns"
title = "Write-Through Cache"
package = "writethrough"
main_class = "WriteThroughDemo"
tagline = "Change both, together, every time"
bold = "Send every write through the cache, which writes the database first and then itself before returning, so reads from the cache always match the database."
domain_note = ""
thumb_lines = ["WRITE-THROUGH", "CACHE"]
thumb_code = "store.put(sku, price)"
youtube_title = "Write-Through Cache"
youtube_tags = ["write through cache", "caching", "cache consistency", "microservices", "java"]

[readme]
intro = """
Write-Through is a caching pattern. Reads are served from a fast cache, and
every write goes through that same cache: it writes the database, and as soon
as the database accepts, it updates its own copy, before telling the caller
the write is done. Nothing writes to the database around the cache.

Because the cache and the database always change together, a read from the
cache is never out of date. The price is that every write waits for the
database, and the cache fills with everything that was ever written.
"""
analogy = """
Think of a supermarket where the price on the till and the label on the shelf
must match. Under write-through, the person who changes a price in the till
system also changes the shelf label, straight away, before moving on to the
next product. Nobody changes the till price and leaves the label for later,
so a customer never sees one price and pays another.
"""
scenario = """
The online store's product page reads prices from a cache, and checkout
reads them from the database. A nightly job updates prices by writing
straight to the database. One night it cut the kettle to £27.00 and forgot to
clear the cache: the page kept showing £30.00 while checkout charged £27.00.
"""
costs = [
    "**Every write waits.** 1000 nightly price updates spend 20 seconds waiting for the database.",
    "**The cache fills.** Everything written goes into the cache, even products nobody will look at.",
    "**All writes must go through it.** A single job that writes around the cache brings back stale reads.",
]
too_much = """
When writes are frequent and speed matters more than immediate safety,
write-behind is faster. When most written data is rarely read, cache-aside
(load on first read) keeps the cache smaller. Write-through suits data that is
read often and must never be seen out of date, such as prices.
"""
met_before = [
    "Hazelcast and Ehcache `write-through` configuration with a `CacheWriter`.",
    "Spring's `@CachePut`, which updates the cache when a method writes.",
    "CPU caches, which can be configured write-through to main memory.",
]
where = """
This project is in [micro-services-design-patterns](..), next to
[Write-Behind Cache](../write-behind-cache-pattern), which writes the database
later, and [Cache-Aside](../cache-aside-pattern), which loads the cache on
reads.
"""

[[act]]
title = "A write round the cache"
summary = "The price job writes £27.00 straight to the database; the page (cache) shows £30.00 while checkout charges £27.00."
detail = """
`CacheAside` serves the product page from a cache. The nightly price job
writes the kettle's new price, £27.00, straight to the database and forgets
the cache. The product page still shows £30.00; checkout, reading the
database, charges £27.00.
"""
speech = """
First demo: a price change goes round the cache. [[slnc 400]] The product page reads prices from a fast cache. [[slnc 300]] Checkout reads them from the database. [[slnc 600]]
The nightly job cuts the kettle to twenty-seven pounds. [[slnc 300]] It writes straight to the database, and forgets the cache. [[slnc 500]]
The page still shows thirty pounds. [[slnc 300]] Checkout charges twenty-seven. [[slnc 300]] The customer sees one price, and pays another.
"""
rows = { job = "active amber", cache = "active wrong", db = "active ok" }
console = [
    ["page (cache): £30.00", "bad"],
    ["checkout (database): £27.00", "amber"],
]

[[act]]
title = "Write-through"
summary = "The job calls store.put: the database, then the cache, before returning; page and checkout both show £27.00."
detail = """
The job now calls `WriteThroughStore.put`, which writes the database and
then updates the cache before returning. The product page and checkout both
show £27.00.
"""
speech = """
Second demo: write-through. [[slnc 400]] Every write now goes through the cache. [[slnc 500]]
The job asks the store to set the kettle to twenty-seven pounds. [[slnc 300]] The store writes the database. [[slnc 300]] Then it updates its own copy. [[slnc 300]] Only then does it return. [[slnc 600]]
The page says twenty-seven. [[slnc 300]] Checkout says twenty-seven.
"""
rows = { store = "active ok", cache = "active ok", db = "active ok" }
console = [
    ["store.put: database, then cache", "ok"],
    ["page £27.00; checkout £27.00", "ok"],
]

[[act]]
title = "Fast reads"
summary = "100 page views: 0 database reads; all served from the cache."
detail = """
A hundred product page views are all answered from the cache: zero database
reads. The cache already holds the latest price, because every write put it
there.
"""
speech = """
Third demo: reads come from the cache. [[slnc 400]] A hundred people view the kettle. [[slnc 500]]
Database reads: zero. [[slnc 300]] Every view was answered from the cache. [[slnc 300]] And every answer was up to date.
"""
rows = { cache = "active ok", page = "active ok" }
console = [
    ["100 page views: 0 database reads", "ok"],
]

[[act]]
title = "A refused write"
summary = "The database is read-only; the £25.00 write fails and the cache is untouched: both still say £27.00."
detail = """
The database goes read-only for maintenance. The price job tries £25.00; the
database refuses, so the store never updates its cache. Page and database both
still say £27.00: the two never disagree.
"""
speech = """
Fourth demo: a refused write changes nothing. [[slnc 400]] The database is read-only, for maintenance. [[slnc 500]]
The price job tries twenty-five pounds. [[slnc 300]] The database refuses. [[slnc 300]] Because the store writes the database first, it never touches its cache. [[slnc 600]]
Both still say twenty-seven. [[slnc 300]] They never disagree.
"""
rows = { store = "active amber", db = "active wrong", cache = "active ok" }
console = [
    ["£25.00: database is read-only", "amber"],
    ["page and database: both £27.00", "ok"],
]

[[act]]
title = "The bill"
summary = "1000 nightly price updates spend 20 s waiting for the database, and all 1000 sit in the cache."
detail = """
Every write waits for the database. The nightly job's 1000 price updates spend
20 seconds waiting, where write-behind would return at once. And all 1000
prices now sit in the cache, though most of those products will never be
viewed.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] Every write waits for the database. [[slnc 300]] A thousand price updates spend twenty seconds waiting. [[slnc 600]]
And all thousand prices now sit in the cache. [[slnc 300]] Though most of those products will never be viewed.
"""
rows = { store = "active amber", cache = "active amber" }
console = [
    ["1000 updates: 20.0 s waiting", "amber"],
    ["1000 entries cached, few viewed", "amber"],
]

