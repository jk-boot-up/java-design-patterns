]

[docs.session]
objectives = [
    "Explain how writes that bypass a cache make it stale.",
    "Write the database first, then the cache.",
    "Explain why a failed write must not touch the cache.",
    "Choose between write-through, write-behind and cache-aside.",
]
walkthrough = """
Run `./gradlew run` and read act one's two prices. Open
`WriteThroughStore.put`: two lines, in that order. Ask what would happen if
they were swapped, then run act four.
"""
exercises = [
    "Swap the two lines in `put` and write a test that fails because of it.",
    "Only cache products that have been read at least once.",
    "Make the price job update 1000 prices with one batched database write.",
]

[docs.explained]
sentence = """
A write-through cache takes every write, writes the database, then updates
itself before returning, so reads from it always match the database.
"""
verdict = """
Use write-through for data that is read often and must never be stale, and
make it the only way to write that data. Accept slower writes, and limit what
the cache keeps.
"""
recognise = [
    "A store with `put` that writes the database and then the cache.",
    "`@CachePut` on update methods.",
    "Cache configuration with a `CacheWriter` or `write-through: true`.",
]

[spec]
purpose = """
Teach Write-Through Cache with an online store's prices: a job writing round
the cache leaving the page at £30.00 while checkout charges £27.00, then a
write-through store keeping both at £27.00, 100 page views with 0 database
reads, a refused write changing nothing, and 20 s of waiting for 1000 updates.
"""
nongoals = [
    "Not a cache product or eviction.",
    "Not concurrency between writers.",
]
problem = """
When writes go to the database around the cache, the cache keeps serving old
values.
"""
roles = [
    ["The pattern", "`WriteThroughStore`"],
    ["The source of truth", "`Database`"],
    ["The naive version", "`CacheAside` with a forgetful price job"],
    ["Entry point", "`WriteThroughDemo`, five acts"],
]
requirements = [
    "**Never stale:** after any successful write, cache and database agree.",
    "**Database first:** a refused write leaves the cache unchanged.",
    "**Fast reads:** repeated reads hit the cache.",
    "**Every printed result is asserted** in `DemoRunsTest`.",
]

