[[scene]]
key = "01-poster"
kind = "poster"
title = "Backpressure"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Backpressure pattern, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] Backpressure lets a slow consumer tell a fast producer to slow down. [[slnc 300]] So the work waiting in between stays small, instead of filling memory. [[slnc 600]]
Think of a busy restaurant. [[slnc 300]] If the waiters take orders faster than the chefs can cook, the ticket rail overflows. [[slnc 300]] A good kitchen tells the front of house to stop seating tables for a while. [[slnc 300]] The pressure travels back, from the kitchen to the door. [[slnc 700]]
In this video, the domain is an online shop's search indexer. [[slnc 300]] It reads a supplier's product feed, which is much faster than the indexer. [[slnc 500]]
By the end, you will hear how the waiting pile grows without limit. [[slnc 300]] Three ways to push back. [[slnc 300]] And what backpressure costs.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["The supplier sends 1,000 products a second.", "", "The indexer handles 100 a second.", "", "The rest waits in memory."]
narration = """
Here is the scenario. [[slnc 400]] The shop's search indexer reads a supplier's product feed. [[slnc 500]]
The supplier sends a thousand products a second. [[slnc 300]] The indexer can handle a hundred. [[slnc 500]]
Everything it has not reached yet waits in memory.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["The consumer controls the pace.", "", "Bound every buffer.", "Pull in batches.", "Or keep only the latest."]
narration = """
Let's name the pattern. [[slnc 400]] The consumer controls the pace, not the producer. [[slnc 500]]
There are three common ways. [[slnc 300]] Bound the buffer, so the producer waits when it is full. [[slnc 300]] Let the consumer ask for a batch at a time. [[slnc 300]] Or, when only the latest value matters, drop the older ones.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["PullPublisher: sends only on request", "Indexer: asks for 10 at a time", "Conflator: keeps the latest per product", "FeedSimulation: unbounded vs bounded"]
narration = """
Here is who does what. [[slnc 400]] The publisher is the supplier's feed. [[slnc 300]] It sends only as many products as it has been asked for. [[slnc 500]]
The indexer is the subscriber. [[slnc 300]] It asks for ten, indexes them, then asks again. [[slnc 500]]
The conflator keeps one pending stock level per product. [[slnc 300]] And the feed simulation compares an unbounded buffer with a bounded one.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["java.util.concurrent.Flow", "Reactor, RxJava, Akka Streams", "Bounded blocking queues", "TCP flow control"]
narration = """
You have probably met this pattern already. [[slnc 400]] Java's Flow interfaces are the Reactive Streams standard. [[slnc 500]]
Reactor, RxJava and Akka Streams are all built on it. [[slnc 300]] A bounded blocking queue makes the producer wait when it is full. [[slnc 500]]
And the network itself does it. [[slnc 300]] TCP slows the sender when the receiver cannot keep up.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["A fast source can outrun", "a slow sink.", "", "Bound every buffer.", "Prefer pull.", "Drop only stale data."]
narration = """
So, when should you use it? [[slnc 400]] Whenever a fast source can outrun a slow consumer for long. [[slnc 500]]
Bound every buffer. [[slnc 300]] Prefer consumers that ask for work. [[slnc 300]] Drop only data where the latest value is enough. [[slnc 500]]
And make sure the producer can cope with being slowed.
"""

