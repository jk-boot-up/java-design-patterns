    "A reactive library. The JDK's `Flow` interfaces are enough.",
]

[docs.session]
objectives = [
    "Explain what happens when a producer outruns a consumer.",
    "Bound a buffer so the producer waits.",
    "Implement pull with `Flow.Subscription.request(n)`.",
    "Decide when dropping stale data is safe.",
]
walkthrough = """
Run `./gradlew run` and compare act one's 9000 waiting with act two's 500.
Open `Indexer.onNext`: the next `request` is only made when a batch is done.
End on act four's 10 delivered out of 1000.
"""
exercises = [
    "Replace `FeedSimulation`'s bounded buffer with a real `ArrayBlockingQueue` and two threads.",
    "Use the JDK's `SubmissionPublisher` instead of `PullPublisher`.",
    "Drop the oldest product when the buffer is full, instead of making the supplier wait.",
]

[docs.explained]
sentence = """
Backpressure lets a slow consumer control how fast a producer sends, so
waiting work stays bounded instead of filling memory.
"""
verdict = """
Use backpressure wherever a fast source can outrun a slow sink for long:
bound every buffer, prefer consumers that pull, and drop only data where the
latest value is enough. Make sure the producer can cope with being slowed.
"""
recognise = [
    "`Flow.Subscriber` calling `subscription.request(n)`.",
    "Bounded queues whose `put` blocks, or `offer` that returns false.",
    "Operators named `onBackpressureBuffer`, `onBackpressureDrop` or `onBackpressureLatest`.",
]

[spec]
purpose = """
Teach Backpressure with an online store's search indexer reading a fast
supplier feed: an unbounded buffer growing without limit, a bounded buffer
slowing the supplier, a pull-based subscriber with Java's Flow interfaces, a
conflator keeping only the latest stock levels, and the cost of each.
"""
nongoals = [
    "Not real threads or time. Seconds are simulated so results are exact.",
]
problem = """
A producer faster than its consumer fills memory with waiting work until the
service fails.
"""
roles = [
    ["The naive and bounded buffers", "`FeedSimulation.run`"],
    ["The producer that sends only on request", "`PullPublisher`"],
    ["The consumer that asks in batches", "`Indexer`"],
    ["Keep only the latest", "`Conflator`"],
    ["Entry point", "`BackpressureDemo`, five acts"],
]
requirements = [
    "**Bounded:** waiting work never exceeds the buffer's capacity.",
    "**Pull:** the publisher never sends more than was requested.",
    "**Latest only:** the conflator delivers one value per product.",
    "**Every printed result is asserted** in `DemoRunsTest`.",
]

