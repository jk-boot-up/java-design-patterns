# pattern.toml for the Backpressure project. See tools/patternkit.

[project]
slug = "backpressure"
category = "micro-services-design-patterns"
title = "Backpressure"
package = "backpressure"
main_class = "BackpressureDemo"
tagline = "Only send what can be handled"
bold = "Let a slow consumer push back on a fast producer, by bounding what waits, asking for work in batches, or dropping stale updates, instead of buffering until memory runs out."
youtube_description = """Backpressure pattern in Java: Backpressure lets a slow consumer tell a fast producer to slow down, so the work waiting in between stays small instead of filling memory, like a kitchen telling front of house to stop seating tables. Explained with an online store search indexer reading a supplier's product feed that is much faster than the indexer. We watch the waiting pile grow without limit, add a bounded buffer, let the consumer ask only for what it can handle, and keep only the latest item when that is acceptable. We finish with the bill."""
domain_note = ""
thumb_lines = ["BACK", "PRESSURE"]
thumb_code = "request(10)"
youtube_title = "Backpressure"
youtube_tags = ["backpressure", "reactive streams", "flow control", "java flow", "microservices", "java"]

[readme]
intro = """
Backpressure is a way for a slow consumer to tell a fast producer to slow
down. Without it, whatever the consumer cannot handle yet piles up in memory
until the service falls over. With it, the amount of waiting work is bounded:
the producer is made to wait, the consumer asks only for what it can handle,
or old updates are dropped when only the latest matters.

Java has the Reactive Streams interfaces built in, in `java.util.concurrent.Flow`:
a subscriber calls `request(n)`, and the publisher may send at most `n` items.
"""
analogy = """
Think of a kitchen and its waiters. If the waiters keep taking orders faster
than the chefs can cook, the ticket rail overflows and everything is late. A
good kitchen tells the front of house to stop seating tables for a while. The
pressure travels back from the kitchen to the door.
"""
scenario = """
The online store's search indexer reads a supplier's product feed. The
supplier sends a thousand products a second; the indexer handles a hundred.
Everything the indexer has not reached waits in memory. After ten seconds nine
thousand products are waiting, and the pile grows by nine hundred a second.
"""
costs = [
    "**The waiting moves upstream.** The supplier's feed took 100 seconds instead of 10; it must be able to cope with being slowed.",
    "**Dropping loses data.** Keeping only the latest is right for stock levels, wrong for orders.",
    "**Harder code.** Request counts and completion signals are easy to get subtly wrong; use a library where you can.",
]
too_much = """
When the producer is never faster than the consumer, or the volume is small
and bounded, a plain queue is enough. Backpressure pays off when a fast source
can outrun a slow sink for long periods.
"""
met_before = [
    "`java.util.concurrent.Flow` and `SubmissionPublisher`.",
    "Project Reactor, RxJava, Akka Streams and Kafka consumers pulling at their own pace.",
    "A bounded `ArrayBlockingQueue`, whose `put` waits when it is full.",
    "TCP flow control, which slows the sender when the receiver's window is full.",
]
where = """
This project is in [micro-services-design-patterns](..), and near
[Priority Queue](../priority-queue-pattern), which decides the order work is
taken in, where backpressure decides how much is let in.
"""

[[act]]
title = "No backpressure"
summary = "The supplier sends 1,000 products a second, the indexer handles 100: after 10 seconds 9,000 wait in memory, growing by 900 a second."
detail = """
The supplier pushes as fast as it can and the indexer buffers everything it
has not reached yet. After ten seconds, a thousand are indexed and nine
thousand are waiting in memory, a pile that grows by nine hundred every
second. A bigger feed, or a slower indexer, and the service runs out of memory.
"""
speech = """
First demo: no backpressure. [[slnc 400]] The supplier sends a thousand products a second. [[slnc 300]] The indexer handles a hundred. [[slnc 600]]
Everything not yet indexed waits in memory. [[slnc 300]] After ten seconds, nine thousand products are waiting. [[slnc 300]] And the pile grows by nine hundred every second. [[slnc 600]]
A bigger feed, and the service runs out of memory.
"""
rows = { supplier = "active amber", buffer = "active wrong", indexer = "active amber" }
console = [
    ["1000 a second in, 100 a second out", "muted"],
    ["after 10 s: 9000 waiting in memory", "bad"],
    ["growing by 900 a second", "bad"],
]

[[act]]
title = "A bounded buffer"
summary = "A buffer of 500: when it is full the supplier waits. Never more than 500 waiting; all 10,000 indexed in 100 seconds."
detail = """
The buffer now holds at most five hundred products. When it is full, the
supplier has to wait for space. Memory stays flat, never more than five
hundred waiting, and all ten thousand products are indexed in a hundred
seconds, the indexer's own pace.
"""
speech = """
Second demo: a bounded buffer. [[slnc 400]] The buffer holds at most five hundred products. [[slnc 300]] When it is full, the supplier waits. [[slnc 600]]
Never more than five hundred are waiting. [[slnc 300]] All ten thousand are indexed, in a hundred seconds. [[slnc 500]]
The supplier has been slowed to the indexer's pace.
"""
rows = { supplier = "active amber", buffer = "active ok", indexer = "active ok" }
console = [
    ["buffer of 500: never more than 500 waiting", "ok"],
    ["all 10000 indexed in 100 s", "ok"],
]

[[act]]
title = "Ask for what you can handle"
summary = "With Java's Flow interfaces, the indexer requests 10 at a time: all 10,000 indexed, never more than 10 in flight."
detail = """
Instead of the producer pushing, the consumer pulls. Using Java's own `Flow`
interfaces, the indexer calls `request(10)`, indexes those ten, then asks for
ten more. The publisher never sends anything it was not asked for, so at most
ten products are ever in flight.
"""
speech = """
Third demo: the consumer asks for what it can handle. [[slnc 400]] Java has this built in, in the Flow interfaces. [[slnc 600]]
The indexer asks for ten products. [[slnc 300]] It indexes them. [[slnc 300]] Then it asks for ten more. [[slnc 500]]
The supplier never sends anything that was not asked for. [[slnc 300]] All ten thousand are indexed. [[slnc 300]] And never more than ten are in flight.
"""
rows = { supplier = "active ok", indexer = "active ok" }
console = [
    ["indexer: request(10), index, request(10)", "muted"],
    ["10000 indexed, at most 10 in flight", "ok"],
]

[[act]]
title = "Keep only the latest"
summary = "1,000 stock-level updates for 10 products: only 10 are delivered, the latest for each."
detail = """
Some data does not need every value. A warehouse sends a thousand stock-level
updates for ten products. The consumer only needs the current level, so a
conflator keeps one pending value per product and drops the older ones: ten
updates are delivered, the latest for each.
"""
speech = """
Fourth demo: when only the latest value matters, drop the rest. [[slnc 400]] The warehouse sends a thousand stock-level updates, for ten products. [[slnc 600]]
The shop only needs the current stock level. [[slnc 300]] So it keeps one pending value per product. [[slnc 300]] A newer one replaces the older one. [[slnc 500]]
Only ten updates are delivered. [[slnc 300]] The latest for each product.
"""
rows = { buffer = "active ok", indexer = "active ok" }
console = [
    ["1000 updates for 10 products", "muted"],
    ["10 delivered, the latest for each", "ok"],
]

[[act]]
title = "The bill"
summary = "The supplier's feed took 100 seconds instead of 10, so it must cope with being slowed; dropping only suits data where the latest is all that matters."
detail = """
Backpressure does not make the work faster; it moves the waiting upstream. The
supplier's feed took a hundred seconds instead of ten, so the supplier must
be able to cope with being slowed. And dropping is only safe for data where
the latest value is all that matters, never for orders or payments.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] Backpressure does not make the work faster. [[slnc 300]] It moves the waiting upstream. [[slnc 600]]
The supplier's feed took a hundred seconds, instead of ten. [[slnc 300]] So the supplier must cope with being slowed. [[slnc 600]]
And dropping is only safe when the latest value is all that matters. [[slnc 300]] Never for orders, or payments.
"""
rows = { supplier = "active amber" }
console = [
    ["feed took 100 s instead of 10", "amber"],
    ["drop only when the latest is enough", "amber"],
]

