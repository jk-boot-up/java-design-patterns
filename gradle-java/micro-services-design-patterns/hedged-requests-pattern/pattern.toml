"""
deliver = [
    "The slow tail measured: median against 99th percentile.",
    "Hedging after a delay, with its small extra load.",
    "Hedging at once, with its doubled load.",
    "A real race between threads, with the loser cancelled.",
    "The limits named: only repeatable calls, and a cap on hedges.",
    "Every printed result asserted by a test.",
]

[docs.prerequisites]
required = [
    "Java basics: records, `Callable`, `ExecutorService`.",
    "What a percentile is: the 99th percentile is slower than 99% of calls.",
]
not_required = [
    "A network. Replicas are simulated, and in act four they are threads.",
]

[docs.session]
objectives = [
    "Explain tail latency and why the median hides it.",
    "Choose a hedge delay near the normal worst case.",
    "Race two calls and cancel the loser.",
    "Decide which calls may be hedged.",
]
walkthrough = """
Run `./gradlew run` and compare act one's 1000 ms with act two's 70 ms. Open
`Hedger.call`: submit, poll with a timeout, submit again, take the first,
cancel the other. End on act three's 100% extra calls.
"""
exercises = [
    "Rewrite `Hedger` with `CompletableFuture.anyOf` and `orTimeout`.",
    "Add a budget: stop hedging once hedges exceed 5% of recent calls.",
    "Try hedge delays of 10, 50 and 200 ms and compare the tail and the load.",
]

[docs.explained]
sentence = """
Hedged Requests sends a second copy of a slow call to another replica after a
short delay, and uses whichever answer arrives first.
"""
verdict = """
Hedge read-only or otherwise repeatable calls to replicated services with an
occasional slow outlier. Wait about the 95th percentile before hedging, cancel
the loser, and cap hedges so they cannot add much load.
"""
recognise = [
    "Two calls to different replicas, the first answer used.",
    "gRPC `hedgingPolicy`, Cassandra `speculative_retry`.",
    "`CompletableFuture.anyOf` with a delayed second call.",
]

[spec]
purpose = """
Teach Hedged Requests with an online store's product page reading prices from
replicas: a slow tail at the 99th percentile, hedging after 50 ms cutting it
to 70 ms for 3% extra calls, hedging at once doubling the load, a real
threaded race with the loser cancelled, and the limits of hedging.
"""
nongoals = [
    "Not a real network. Latencies are simulated; act four uses real threads with sleeps.",
]
problem = """
A small fraction of slow calls sets the waiting time of a page that needs
many calls, even when the average is fast.
"""
roles = [
    ["The pattern", "`Hedger.call`"],
    ["The replicas", "`Replica`"],
    ["The latency measurement", "`LatencyModel.simulate`"],
    ["Entry point", "`HedgedRequestsDemo`, five acts"],
]
requirements = [
    "**Hedge late:** a backup is only sent when the primary misses the delay.",
    "**First wins:** the first answer is returned.",
    "**Cancel the loser:** the other call is interrupted.",
    "**Every printed result is asserted** in `DemoRunsTest`.",
]

