# pattern.toml for the Hedged Requests project. See tools/patternkit.

[project]
slug = "hedged-requests"
category = "micro-services-design-patterns"
title = "Hedged Requests"
package = "hedgedrequests"
main_class = "HedgedRequestsDemo"
tagline = "Don't wait on the slow one"
bold = "If a call has not answered within a short delay, send the same call to a second replica, use whichever answers first, and cancel the other."
youtube_description = """Hedged Requests pattern in Java: if a call has not answered after a short wait, the same call goes to a second replica, the first answer wins and the other is cancelled, like ringing a shop's other branch when nobody picks up. Explained with an online store product page that asks a price service, running as several replicas, for each price. We see why the average hides slow calls, hedge after fifty milliseconds, hedge at once, and run a real race. We finish with the bill: extra load, and requests that must be safe to send twice."""
domain_note = ""
thumb_lines = ["HEDGED", "REQUESTS"]
thumb_code = "after 50 ms: ask again"
youtube_title = "Hedged Requests"
youtube_tags = ["hedged requests", "tail latency", "p99", "replicas", "microservices", "java"]

[readme]
intro = """
Hedged Requests is a pattern for cutting tail latency: the rare, very slow
calls that make a page feel sluggish even when the average is fast. The client
calls one replica. If no answer arrives within a short delay, usually around
the 95th percentile of normal response times, it sends the same request to a
second replica, takes whichever answer comes first, and cancels the other.

Because the backup is only sent for the few slow calls, the extra load is
small, while the worst waits shrink dramatically. It was made famous by
Google's paper "The Tail at Scale".
"""
analogy = """
Think of calling a shop to ask if something is in stock. Nobody answers after
a few rings, so you call their other branch too. Whichever answers first gets
your question, and you hang up on the other. You only make the second call
when the first is slow, so most of the time you make just one.
"""
scenario = """
The online store's product page asks the price service for each price. There
are several copies of the price service, called replicas. Most answers take
twenty milliseconds, but now and then a replica pauses, for example for
garbage collection, and that call takes a whole second. About one call in
thirty-three is slow, so the 99th percentile is a full second.
"""
costs = [
    "**Only for calls that are safe to repeat.** Hedging a price lookup is fine; hedging \"place order\" could charge the customer twice.",
    "**Extra load.** Each hedge is a second call. With a 50 ms delay it was 3%; sending two at once doubled the load.",
    "**Harmful under overload.** If every replica is slow because they are all busy, hedging makes it worse, so cap hedges at a few percent.",
]
too_much = """
When calls are uniformly fast, or there is only one replica to ask, there is
nothing to hedge. It pays off for read-heavy services with several replicas
and an occasional slow outlier.
"""
met_before = [
    "Google's \"The Tail at Scale\" and Bigtable's hedged reads.",
    "gRPC's hedging policy, configured per method.",
    "Cassandra's speculative retry and HDFS hedged reads.",
    "`CompletableFuture.anyOf` for racing calls in Java.",
]
where = """
This project is in [micro-services-design-patterns](..), and near
[Backpressure](../backpressure-pattern), which warns of the opposite risk:
sending more work than the other side can handle.
"""

[[act]]
title = "One call, and a slow tail"
summary = "1,000 price lookups: the median is 20 ms but the 99th percentile is 1,000 ms, because 1 call in 33 hits a paused replica."
detail = """
Each price is asked for once. The median answer takes twenty milliseconds,
but about one call in thirty-three lands on a paused replica and takes a
whole second. So the 99th percentile is a thousand milliseconds, and a product
page waiting for that price waits a whole second.
"""
speech = """
First demo: one call per price. [[slnc 400]] We look up a thousand prices. [[slnc 500]]
Half the answers take twenty milliseconds or less. [[slnc 300]] But about one call in thirty-three lands on a paused replica. [[slnc 300]] That call takes a whole second. [[slnc 600]]
So the slowest one percent of calls take a full second. [[slnc 300]] And the product page waits for them.
"""
rows = { page = "active amber", a = "active wrong" }
console = [
    ["median 20 ms", "ok"],
    ["99th percentile 1000 ms", "bad"],
]

[[act]]
title = "Hedge after 50 ms"
summary = "If no answer in 50 ms, ask a second replica: the 99th percentile drops to 70 ms, for only 3% extra calls."
detail = """
Now the client waits fifty milliseconds, more than a normal call ever takes.
If there is no answer, it asks a second replica too, and takes the first
answer. The slow calls now finish in seventy milliseconds, fifty waiting plus
twenty for the backup. The 99th percentile falls from a thousand to seventy,
and only thirty-one calls in a thousand needed a second call.
"""
speech = """
Second demo: hedge after fifty milliseconds. [[slnc 400]] Fifty milliseconds is longer than a normal call ever takes. [[slnc 600]]
If there is no answer by then, the client asks a second replica. [[slnc 300]] Whichever answers first, wins. [[slnc 600]]
The slowest calls now take seventy milliseconds. [[slnc 300]] Fifty waiting, and twenty for the backup. [[slnc 500]]
And only three percent of calls needed a second call.
"""
rows = { page = "active ok", a = "active amber", b = "active ok" }
console = [
    ["99th percentile 70 ms, worst 70 ms", "ok"],
    ["extra calls: 31 of 1000 (3%)", "ok"],
]

[[act]]
title = "Hedge at once"
summary = "Always asking two replicas brings the 99th percentile to 20 ms, but doubles the load: 1,000 extra calls."
detail = """
Why wait at all? Sending two calls every time brings the 99th percentile down
to twenty milliseconds, but it doubles the load on the price service: a
thousand extra calls. Twice the work to save fifty milliseconds on a few
calls. Waiting first is the better deal.
"""
speech = """
Third demo: why wait at all? [[slnc 400]] Send every request to two replicas at once. [[slnc 600]]
Now the slowest calls take only twenty milliseconds. [[slnc 300]] But every request is sent twice. [[slnc 300]] The price service does double the work. [[slnc 600]]
Twice the load, to save fifty milliseconds on a few calls. [[slnc 300]] Waiting first is the better deal.
"""
rows = { a = "active amber", b = "active amber" }
console = [
    ["99th percentile 20 ms", "ok"],
    ["extra calls: 1000 of 1000 (100%)", "bad"],
]

[[act]]
title = "A real race"
summary = "With real threads: replica A takes 1 s, replica B 20 ms; the hedged call answers from B in under 0.5 s, and A's call is cancelled."
detail = """
The same idea with real threads. Replica A is paused and would take a second;
replica B answers in twenty milliseconds. The hedger calls A, waits fifty
milliseconds, calls B, and returns B's answer in well under half a second.
Then it cancels A's call, so A does not keep working on an answer nobody needs.
"""
speech = """
Fourth demo: a real race, with real threads. [[slnc 400]] Replica A is paused. [[slnc 300]] It would take a whole second. [[slnc 300]] Replica B answers in twenty milliseconds. [[slnc 600]]
The hedger asks A, and waits fifty milliseconds. [[slnc 300]] No answer, so it asks B too. [[slnc 500]]
B's answer comes back in well under half a second. [[slnc 500]]
Then the hedger cancels the call to A. [[slnc 300]] So A stops working on an answer nobody needs.
"""
rows = { a = "active wrong", b = "active ok", page = "active ok" }
console = [
    ["answer from replica B", "ok"],
    ["time: under 0.5 s", "ok"],
    ["replica A's call cancelled", "amber"],
]

[[act]]
title = "The bill"
summary = "Only hedge calls that are safe to repeat, never \"place order\"; and cap hedges, because under overload they add load."
detail = """
Hedging sends the same request twice, so it is only for calls that are safe to
repeat, like reading a price. Hedging \"place order\" could charge the customer
twice. And if every replica is slow because they are all overloaded, extra
calls make it worse, so hedges are capped at a few percent of requests.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] Hedging sends the same request twice. [[slnc 300]] So only hedge calls that are safe to repeat. [[slnc 500]]
Reading a price, is fine. [[slnc 300]] Placing an order, is not. [[slnc 300]] The customer could be charged twice. [[slnc 600]]
And if every replica is slow because they are all overloaded, extra calls make things worse. [[slnc 300]] So keep hedges to a few percent of requests.
"""
rows = { page = "active amber" }
console = [
    ["never hedge \"place order\"", "bad"],
    ["cap hedges at a few percent", "amber"],
]

[animation]
subtitle = "The product page asks replica A for a price; if A is slow, it asks replica B too."
boxes = [
    ["page", "Product page", "needs a price"],
    ["a", "Price replica A", "sometimes paused"],
    ["b", "Price replica B", "the backup"],
]

[docs.problem]
scenario = """
The product page asks the price service for each price. Most answers take 20
ms, but one call in thirty-three hits a paused replica and takes a second.
"""
naive = """
Waiting for whichever replica was asked means the slowest one percent of
