[[scene]]
key = "01-poster"
kind = "poster"
title = "Hedged Requests"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Hedged Requests pattern, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] If a call has not answered after a short wait, send the same call to a second copy of the service. [[slnc 300]] Use whichever answer comes first. [[slnc 300]] And cancel the other. [[slnc 600]]
Think of phoning a shop to ask if something is in stock. [[slnc 300]] Nobody picks up after a few rings. [[slnc 300]] So you call their other branch too. [[slnc 300]] Whichever answers first gets your question, and you hang up on the other. [[slnc 700]]
In this video, the domain is an online shop's product page. [[slnc 300]] It asks a price service for each price. [[slnc 300]] And there are several copies of that service, called replicas. [[slnc 500]]
By the end, you will hear why the average hides slow calls. [[slnc 300]] How a second call after fifty milliseconds fixes them. [[slnc 300]] Why not to send two calls every time. [[slnc 300]] And which calls must never be hedged.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["The product page asks for prices.", "", "Most answers: 20 ms.", "", "1 call in 33 hits a paused", "replica: 1 second."]
narration = """
Here is the scenario. [[slnc 400]] The product page asks the price service for each price. [[slnc 500]]
Most answers take twenty milliseconds. [[slnc 500]]
But now and then a replica pauses, for example to clean up memory. [[slnc 300]] About one call in thirty-three then takes a whole second.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["Call one replica.", "", "No answer after a short delay?", "Call another.", "", "First answer wins; cancel the other."]
narration = """
Let's name the pattern. [[slnc 400]] Call one replica. [[slnc 500]]
If there is no answer after a short delay, call a second replica with the same request. [[slnc 500]]
The first answer wins. [[slnc 300]] And the other call is cancelled.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["Replica: one copy of the price service", "Hedger: waits, asks again, takes the first", "LatencyModel: measures the slow tail"]
narration = """
Here is who does what. [[slnc 400]] A replica is one copy of the price service. [[slnc 500]]
The hedger makes the call. [[slnc 300]] It waits fifty milliseconds, asks a second replica if needed, takes the first answer, and cancels the other. [[slnc 500]]
And the latency model measures a thousand calls, so we can compare the slowest ones.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Google's \"The Tail at Scale\"", "gRPC hedging policy", "Cassandra speculative retry", "CompletableFuture.anyOf"]
narration = """
You have probably met this pattern already. [[slnc 400]] Google made it famous, in a paper called The Tail at Scale. [[slnc 500]]
gRPC can hedge calls, with a setting per method. [[slnc 300]] And Cassandra calls it speculative retry. [[slnc 500]]
In Java, racing futures with any-of is the same idea.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Several replicas, rare slow calls.", "", "Only calls safe to repeat.", "Wait before hedging.", "Cancel the loser.", "Cap the hedges."]
narration = """
So, when should you use it? [[slnc 400]] When a service has several replicas, and slow calls are rare. [[slnc 500]]
Only hedge calls that are safe to repeat. [[slnc 300]] Wait a little before hedging. [[slnc 300]] Cancel the loser. [[slnc 300]] And cap how many hedges you send.
"""

