[poster]
headline = [["SHARDING", "text"]]
before = { code = "one database", note = "1,500 orders waiting a minute", tag = "BEFORE" }
after = { code = "customer % 3", note = "three shares, each within limits", tag = "AFTER" }
taglines = [["Split the data, split the load", "gold"]]

[[scene]]
key = "01-poster"
kind = "poster"
title = "Sharding"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Sharding pattern, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] Sharding splits one large set of data across several databases, called shards. [[slnc 300]] Each row goes to a shard chosen from a key, such as the customer number. [[slnc 300]] So each database holds, and serves, only its share. [[slnc 600]]
Think of a doctor's surgery that has outgrown one filing cabinet. [[slnc 300]] The records are split into three cabinets: A to H, I to P, and Q to Z. [[slnc 300]] One patient's file is in one cabinet. [[slnc 300]] But a fourth cabinet means refiling many folders. [[slnc 700]]
In this video, the domain is an online shop, on Black Friday. [[slnc 300]] Orders arrive faster than one database can take them. [[slnc 500]]
By the end, you will hear how shards share the load. [[slnc 300]] Which questions are easy, and which are not. [[slnc 300]] And what adding a shard costs.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["One database for every order.", "It takes 1,000 orders a minute.", "", "Black Friday: 2,500 a minute."]
narration = """
Here is the scenario. [[slnc 400]] Every order is saved in one database. [[slnc 300]] It can take a thousand new orders a minute. [[slnc 600]]
On Black Friday, two and a half thousand arrive every minute.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["Several databases: shards.", "", "A shard key picks each row's shard.", "", "One key: one shard.", "Everyone: every shard, merged."]
narration = """
Let's name the pattern. [[slnc 400]] Use several databases, called shards. [[slnc 500]]
A shard key, here the customer number, decides which shard each order goes to. [[slnc 500]]
A question about one customer asks one shard. [[slnc 300]] A question about everyone asks every shard, and merges the answers.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["ShardedOrders: the router", "OrderDatabase: one shard", "Order: the data, with its key"]
narration = """
Here is who does what. [[slnc 400]] Sharded orders is the router. [[slnc 300]] It works out the shard from the customer number, and asks the right database. [[slnc 500]]
An order database is one shard, with its own limit. [[slnc 500]]
And an order carries the customer number, its shard key.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["MongoDB, Elasticsearch shards", "Cassandra and DynamoDB partitions", "Vitess, Citus", "Consistent hashing"]
narration = """
You have probably met this pattern already. [[slnc 400]] MongoDB and Elasticsearch split data into shards. [[slnc 300]] Cassandra and DynamoDB split it into partitions, by a partition key. [[slnc 500]]
Vitess and Citus shard MySQL and Postgres. [[slnc 300]] And consistent hashing is the trick that moves less data when shards are added.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Only when one database", "truly cannot cope.", "", "A key that spreads load and", "matches common questions.", "", "Plan for adding shards."]
narration = """
So, when should you use it? [[slnc 400]] Only when one database truly cannot cope, after a bigger server, caching, and read copies. [[slnc 500]]
Choose a key that spreads the load evenly, and matches your most common questions. [[slnc 500]]
And plan, from day one, for adding shards.
"""

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a fourth shard", "with a lookup table."]
narration = """
That's the Sharding pattern. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Split the data by a key, and each database carries only its share. [[slnc 500]]
The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs offline, with nothing installed except a Java development kit. [[slnc 500]]
Here is one exercise to try. [[slnc 300]] Add a fourth shard using a lookup table, so only new customers go there. [[slnc 500]]
If this helped, a like really does help other people find it. [[slnc 300]] And subscribe, if you'd like the rest of the series. [[slnc 400]] Thanks for watching.
"""
