# pattern.toml for the Priority Queue with RabbitMQ project. See tools/patternkit.

[project]
slug = "priority-queue-with-rabbitmq"
category = "micro-services-design-patterns"
title = "Priority Queue with RabbitMQ"
package = "priorityrabbit"
main_class = "RabbitPriorityQueueDemo"
tagline = "x-max-priority, and its limits"
bold = "Let same-day orders overtake standard ones on a real RabbitMQ priority queue, and see its two limits: priority only reorders messages still waiting on the queue, and it keeps no share for routine work."
youtube_description = """Priority Queue pattern in Java with a real RabbitMQ broker, using an online store warehouse where same-day orders must catch the courier's van. Urgent messages overtake routine ones, and RabbitMQ can make a queue a priority queue, but nobody can overtake someone already in the scanner, as at airport fast-track. We watch first in, first out miss the van, put same-day orders first, survive a flood, and see why prefetch means priority only applies to what is still waiting. We finish with the bill: starvation of routine orders."""
domain_note = ""
thumb_lines = ["PRIORITY QUEUE", "WITH RABBITMQ"]
thumb_code = "x-max-priority: 10"
youtube_title = "Priority Queue with RabbitMQ"
youtube_tags = ["priority queue", "rabbitmq", "x-max-priority", "prefetch", "starvation", "java"]

[readme]
intro = """
This is the real-infrastructure version of the Priority Queue pattern. The
plain Java version, a separate project in this category, sorts orders with a
comparator. Here a real RabbitMQ broker, started in a container by the demo
itself, does the ordering: a queue declared with `x-max-priority` hands out
higher-priority messages first, and each order is sent with a priority.

Two limits of the real thing are shown. RabbitMQ can only reorder messages
that are still waiting on the queue; ones it has already pushed to a consumer
stay in the order they were sent. And it has no built-in share for routine
work, so a steady stream of urgent orders starves the rest unless the shop
builds the share itself.
"""
analogy = """
Think of the fast-track lane at airport security. Passengers with a tight
connection skip the long queue. But anyone who has already been waved into
the scanner area cannot be overtaken any more. And unless the airport keeps
an officer on the ordinary lane, those passengers miss their flights too.
"""
scenario = """
The online store's warehouse pickers take orders ten a minute from a queue.
Same-day orders must be picked before the courier's van leaves at 9:05. On a
busy morning, a hundred standard orders came in first, then five same-day
orders, and with a first-in-first-out queue the van left without them.
"""
test_note = """
Every number the demo prints is asserted against a real broker. Minutes are
counted, not waited for, and waits are bounded polls on real conditions.
Without a container runtime, the broker test is skipped rather than failed.
"""
run_note = """
This project needs a running container runtime, such as Docker Desktop: the
demo starts a real RabbitMQ 4.3.6 broker in a container and removes it again.
Without one, it prints a sentence saying what to start, rather than failing.
"""
twin = """
The plain Java version got the idea right: urgent work overtakes routine work
however long the backlog, and strict priority starves routine work unless a
share is kept for it. What it left out is what happens with a real broker.
Priority is declared on the queue and set on each message. It only applies to
messages still waiting: a picker's handheld with no prefetch limit already
had all a hundred standard orders pushed to it, and the same-day orders
joined the back. A prefetch of one fixes that. And RabbitMQ has no reserved
share, so the shop keeps one with two queues.
"""
technologies = [
    ["RabbitMQ", "4.3.6 (container image)", "priority queues and prefetch"],
    ["RabbitMQ Java client", "5.36.0", "publishing with priority, basicGet, basicConsume"],
    ["Testcontainers", "2.0.5", "starts and stops the broker container from the demo"],
    ["Docker", "24 or later", "runs the container"],
    ["SLF4J simple", "2.0.17", "library logging, switched off"],
]
costs = [
    "**Only while waiting.** Messages already pushed to a consumer are not reordered; keep prefetch small.",
    "**Starvation.** Twelve same-day orders a minute against ten picks meant 0 of 20 standard orders picked; RabbitMQ keeps no share for them.",
    "**Declared up front.** A queue's `x-max-priority` is fixed when it is created; changing it means a new queue.",
]
too_much = """
When all work has the same deadline, a plain queue is simpler and fairer.
Priority queues pay off when some work has a real, earlier deadline.
"""
met_before = [
    "RabbitMQ `x-max-priority` queues and message priority.",
    "Separate high and low priority queues in Amazon SQS.",
    "Hospital triage and airport fast-track lanes.",
]
where = """
This project is in [micro-services-design-patterns](..). It is the
real-infrastructure version of the plain Java Priority Queue project in the
same category, which is left unchanged.
"""

[[act]]
title = "First in, first out"
summary = "100 standard then 5 same-day orders on an ordinary queue: at 10 a minute from 9:00, the last same-day order is picked at 9:11, after the van left."
detail = """
An ordinary RabbitMQ queue hands out orders in the order they arrived. A
hundred standard orders came first, then five same-day orders. Picking ten a
minute from nine o'clock, the last same-day order is picked at 9:11. The van
left at 9:05.
"""
speech = """
First demo: an ordinary queue, first in, first out. [[slnc 400]] A hundred standard orders arrive, then five same-day orders. [[slnc 600]]
The pickers take ten a minute, from nine o'clock. [[slnc 500]]
The last same-day order is picked at eleven minutes past. [[slnc 300]] The van left at five past.
"""
rows = { queue = "active wrong", pickers = "active amber" }
console = [
    ["last same-day picked at 9:11", "bad"],
    ["van left at 9:05", "bad"],
]

[[act]]
title = "A priority queue"
summary = "The queue is declared with x-max-priority 10 and same-day orders sent with priority 9: all 5 are picked by 9:01."
detail = """
Now the queue is declared with `x-max-priority` set to ten, and same-day
orders are sent with priority nine, standard ones with priority one. RabbitMQ
hands out the highest priority first. All five same-day orders are picked in
the first minute, by 9:01.
"""
speech = """
Second demo: a RabbitMQ priority queue. [[slnc 400]] The queue is declared with priorities from zero to ten. [[slnc 300]] Same-day orders are sent with priority nine. [[slnc 600]]
RabbitMQ hands out the highest priority first. [[slnc 500]]
All five same-day orders are picked by one minute past nine.
"""
rows = { queue = "active ok", pickers = "active ok" }
console = [
    ["all 5 same-day by 9:01", "ok"],
]

[[act]]
title = "A flood"
summary = "With 1,000 standard orders queued ahead, same-day orders are still picked by 9:01."
detail = """
A thousand standard orders are queued first. It makes no difference: the
five same-day orders overtake them all and are still picked by 9:01.
"""
speech = """
Third demo: a flood of standard orders. [[slnc 400]] A thousand standard orders are waiting first. [[slnc 600]]
The same-day orders overtake them all. [[slnc 300]] Still picked by one minute past nine.
"""
rows = { queue = "active ok" }
console = [
    ["1000 ahead: same-day by 9:01", "ok"],
]

[[act]]
title = "Only what is still waiting"
summary = "A handheld with no prefetch limit already holds 100 standard orders; same-day ones land at positions 101 to 105. With prefetch 1, SAME-1 is next."
detail = """
A picker's handheld subscribes with no prefetch limit, and RabbitMQ pushes all
a hundred standard orders to it at once. When the same-day orders arrive, they
join the back of the handheld, at positions 101 to 105: priority only
reorders what is still waiting on the queue. With a prefetch of one, only one
order sits in the handheld, and the next one the queue hands out is SAME-1.
"""
speech = """
Fourth demo: priority only reorders what is still waiting. [[slnc 400]] A picker's handheld subscribes with no limit. [[slnc 300]] RabbitMQ pushes all hundred standard orders to it, at once. [[slnc 600]]
Then the same-day orders arrive. [[slnc 300]] They join the back of the handheld. [[slnc 300]] Positions one hundred and one, to one hundred and five. [[slnc 600]]
With a prefetch of one, only one order sits in the handheld. [[slnc 300]] And the next one handed out is same-day.
"""
rows = { queue = "active amber", pickers = "active wrong" }
console = [
    ["no limit: same-day at 101 to 105", "bad"],
    ["prefetch 1: next is SAME-1", "ok"],
]

[[act]]
title = "The bill: starvation"
summary = "12 same-day orders a minute against 10 picks: 0 of 20 standard orders picked; with two queues and 2 picks a minute kept for standard, 20 of 20."
detail = """
In a rush, twelve same-day orders arrive every minute, more than the ten
picks. With strict priority, none of the twenty standard orders is picked in
ten minutes. RabbitMQ has no reserved share, so the shop builds one: standard
orders on their own queue, with two picks a minute kept for it. All twenty
are picked.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] Twelve same-day orders arrive every minute. [[slnc 300]] The pickers can do ten. [[slnc 600]]
With strict priority, standard orders are never picked. [[slnc 300]] Zero of twenty, in ten minutes. [[slnc 600]]
RabbitMQ keeps no share for routine work. [[slnc 300]] So the shop builds one. [[slnc 300]] Standard orders on their own queue, with two picks a minute kept for them. [[slnc 300]] All twenty are picked.
"""
rows = { queue = "active amber", pickers = "active amber" }
console = [
    ["strict priority: 0 of 20 standard", "bad"],
    ["own queue, 2 a minute: 20 of 20", "ok"],
]

