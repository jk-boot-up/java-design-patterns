[[scene]]
key = "01-poster"
kind = "poster"
title = "Priority Queue with RabbitMQ"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Priority Queue pattern, with a real RabbitMQ broker, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] In a priority queue, urgent messages overtake routine ones. [[slnc 300]] However long the routine ones have been waiting. [[slnc 500]] RabbitMQ is an open-source message broker, and it can make a queue a priority queue. [[slnc 600]]
Think of the fast-track lane at airport security. [[slnc 300]] Passengers with a tight connection skip the queue. [[slnc 300]] But nobody can overtake someone already in the scanner. [[slnc 700]]
In this video, the domain is an online shop's warehouse, where same-day orders must catch the courier's van. [[slnc 500]]
By the end, you will hear how RabbitMQ puts same-day orders first. [[slnc 300]] Why a setting called prefetch can undo it. [[slnc 300]] And why routine orders need a share kept for them.
"""

