]
not_required = [
    "An AWS account. LocalStack plays S3 on your machine.",
]
install = [
    "A running container runtime such as Docker Desktop. The demo starts and removes LocalStack itself.",
]

[docs.dependencies]
intro = """
This project uses the AWS SDK and LocalStack, which the plain Java version of
Valet Key does not. Skipping it loses none of the pattern: the plain version
teaches all of it with nothing installed.
"""
what = [
    ["Amazon S3 and presigned URLs", "Amazon S3 is object storage: files, called objects, in buckets. A presigned URL is an ordinary web address with extra query parameters: who signed it, when, for how long, which headers are included, and a signature computed with the signer's secret key using AWS Signature Version 4. Anyone holding the URL can make exactly that request until it expires; S3 recomputes the signature and refuses anything else."],
    ["The AWS SDK presigner", "S3Presigner signs URLs locally, without contacting S3. presignPutObject signs a PUT for one bucket and key; putting a content length in the request makes the size part of the signature."],
    ["LocalStack", "LocalStack is a local stand-in for AWS services, run in a container. Version 4.14.0 is pinned because later images need an account. Signature checking is turned on with S3_SKIP_SIGNATURE_VALIDATION=0. It does not enforce bucket permissions, which is why an unsigned upload got through."],
]
why = """
The plain version shows the idea with its own signing. This version shows the
standard form every cloud offers, signed by the official SDK.
"""
versions = [
    ["Java", "21"],
    ["Docker", "running; 24 or later"],
    ["LocalStack image", "localstack/localstack:4.14.0"],
    ["AWS SDK for Java (s3)", "2.55.7"],
    ["Testcontainers", "2.0.5"],
]
costs = [
    "A container runtime, and a first run that downloads the LocalStack image.",
    "An emulator that differs from real S3 on permissions.",
]

[docs.session]
objectives = [
    "Sign an S3 presigned PUT URL with the AWS SDK.",
    "Upload directly from a client with only the URL.",
    "Explain which changes break the signature.",
    "Keep presigned URLs short-lived and narrow.",
]
walkthrough = """
Run `./gradlew run` with Docker running. Compare act one's 40 MB with act
two's under 2 KB. Open `Storage.presignedPut`: one request, one signature.
End on act three's refusals and the honest note about LocalStack.
"""
exercises = [
    "Sign a GET URL for the uploaded photo and share it for one minute.",
    "Add a content type to the signature and upload with the wrong one.",
    "Run the same code against a real S3 bucket and try the unsigned upload again.",
]

[docs.explained]
sentence = """
With S3, a valet key is a presigned URL: a signed, expiring permission for
one request, checked by the storage service.
"""
verdict = """
Use presigned URLs for large uploads and downloads the app need not see. Sign
the method, object and size, keep lifetimes short, keep URLs out of logs, and
test permissions against the real service.
"""
recognise = [
    "`S3Presigner.presignPutObject(...)` or `presignGetObject(...)`.",
    "URLs with `X-Amz-Signature` and `X-Amz-Expires`.",
    "Upload endpoints that return a URL instead of accepting the file.",
]

[spec]
purpose = """
Teach Valet Key with S3 presigned URLs: uploads through the app server, a
presigned PUT used directly, refusals for method, object and size, expiry, a
leaked URL, and the honest limits of LocalStack.
"""
nongoals = [
    "Not real AWS. LocalStack plays S3 locally.",
]
problem = """
Every upload passing through the app server wastes it on data it never needs.
"""
roles = [
    ["The storage and signing", "`Storage`"],
    ["The client", "`Browser`"],
    ["Entry point", "`S3ValetKeyDemo`, five acts"],
]
requirements = [
    "**Direct:** the browser uploads with only the URL.",
    "**Narrow:** method, object and size are enforced.",
    "**Expiring:** an expired URL is refused.",
    "**No Docker, no crash:** without a runtime the demo prints advice.",
]

