[[scene]]
key = "01-poster"
kind = "poster"
title = "Valet Key with Amazon S3"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Valet Key pattern, with Amazon S3 presigned addresses, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] A valet key gives a client permission to do one thing, directly, for a short time. [[slnc 300]] Without the client ever holding the real credentials. [[slnc 500]] Amazon S3 is cloud object storage, and its presigned addresses are exactly such keys. [[slnc 600]]
Think of a hotel valet key. [[slnc 300]] It starts the car, but does not open the boot. [[slnc 300]] And the valet has it only for the evening. [[slnc 700]]
In this video, the domain is an online shop's review photos. [[slnc 500]]
By the end, you will hear how photos stop passing through the shop's server. [[slnc 300]] What a signed address allows, and refuses. [[slnc 300]] And what happens when one leaks.
"""

