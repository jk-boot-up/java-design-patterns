# pattern.toml for the Valet Key with Amazon S3 project. See tools/patternkit.

[project]
slug = "valet-key-with-s3"
category = "micro-services-design-patterns"
title = "Valet Key with Amazon S3"
package = "valets3"
main_class = "S3ValetKeyDemo"
tagline = "Presigned URLs, for real"
bold = "Let customers upload review photos straight to object storage with S3 presigned URLs, signed by the shop with the AWS SDK: one object, an exact size, a few minutes, and nothing else."
youtube_description = """Valet Key pattern in Java with Amazon S3 presigned URLs, running on LocalStack, using an online store's review photos. A valet key gives a client permission to do one thing directly for a short time without ever holding the real credentials, like a hotel valet key that starts the car but not the boot. We move photos off the shop's server with a presigned URL, show that a signed address allows that and nothing else, and watch the key run out. We finish with the bill, and an honest note on what LocalStack's free edition does not enforce."""
domain_note = ""
thumb_lines = ["VALET KEY", "WITH AMAZON S3"]
thumb_code = "presigner.presignPutObject(...)"
youtube_title = "Valet Key with Amazon S3 Presigned URLs"
youtube_tags = ["valet key", "presigned url", "amazon s3", "aws sdk", "localstack", "java"]

[readme]
intro = """
This is the real-infrastructure version of the Valet Key pattern. The plain
Java version, a separate project in this category, signs keys with its own
HMAC and runs its own storage server. Here the storage speaks the Amazon S3
API, played by LocalStack in a container started by the demo, and the keys are
real S3 presigned URLs, signed by the AWS SDK's presigner exactly as they
would be for Amazon S3.

A presigned URL carries the method, the object, the time it was signed, how
long it lasts, and a signature made with the shop's secret key. The customer's
browser uses it to upload straight to storage; the shop's servers carry only
the URL. The storage checks the signature, so the URL cannot be bent to do
anything else.
"""
analogy = """
Think of a hotel valet key: it starts the car and opens the driver's door, but
not the boot or the glove box, and the valet has it only for the evening.
Here the key is a web address that lets a customer put one photo in one place,
for five minutes.
"""
scenario = """
The online store lets customers add photos to their reviews. Every photo was
sent to the shop's app server, which passed it on to storage, so ten 2 MB
photos meant forty megabytes through a server that only wanted to say where
the photo should go.
"""
test_note = """
Every result the demo prints is asserted against LocalStack's S3, with
signature checking turned on. Without a container runtime, the test is skipped
rather than failed.
"""
run_note = """
This project needs a running container runtime, such as Docker Desktop: the
demo starts LocalStack 4.14.0, which plays Amazon S3, in a container and
removes it again. Without one, it prints a sentence saying what to start,
rather than failing.
"""
twin = """
The plain Java version got the idea right: sign a narrow, short-lived
permission, let the client talk to storage directly, refuse anything the key
does not allow, and accept that a leaked key works until it expires. What it
left out is that this is a standard: S3 presigned URLs, signed by the AWS SDK
with AWS Signature Version 4, and checked by the storage service, not by the
shop. It also shows the limits of a local emulator: LocalStack checks
signatures and expiry, but does not enforce bucket permissions, so an unsigned
upload got through here that real S3 would refuse with 403.
"""
technologies = [
    ["AWS SDK for Java", "2.55.7", "the S3 client and the S3 presigner"],
    ["LocalStack", "4.14.0 (container image)", "plays Amazon S3 locally, with signature checking on"],
    ["Testcontainers", "2.0.5", "starts and stops LocalStack from the demo"],
    ["Docker", "24 or later", "runs the container"],
]
costs = [
    "**A leaked key works until it expires.** A stranger with the pasted URL stored a file.",
    "**Narrow on purpose.** The URL here pins method, object and exact size; a size range needs S3's presigned POST policies.",
    "**An emulator is not the service.** LocalStack let an unsigned upload through that real S3 would refuse; test permissions against the real thing.",
]
too_much = """
For small files, or when the server must inspect every upload before it is
stored, passing it through the app is simpler. Valet keys pay off for large
files and many uploads that the app never needs to see.
"""
met_before = [
    "Amazon S3 presigned URLs and presigned POST policies.",
    "Google Cloud Storage signed URLs and Azure Blob Storage SAS tokens.",
    "Download links in emails that stop working after a day.",
]
where = """
This project is in [micro-services-design-patterns](..). It is the
real-infrastructure version of the plain Java Valet Key project in the same
category, which is left unchanged.
"""

[[act]]
title = "Through the app server"
summary = "10 customers upload a 2 MB photo each through the app server, which carries 40 MB in and out."
detail = """
Each review photo goes to the shop's app server, which writes it to S3 with
its own credentials. Ten 2 MB photos mean forty megabytes through the app
server: every byte in, and every byte out again.
"""
speech = """
First demo: photos carried through the shop's app server. [[slnc 400]] Ten customers each upload a two megabyte photo. [[slnc 600]]
Every byte comes in to the app server. [[slnc 300]] And goes out again, to storage. [[slnc 500]]
Forty megabytes through a server that only needed to say where the photo goes.
"""
rows = { app = "active wrong", storage = "active ok" }
console = [
    ["app server carried 40 MB", "bad"],
]

[[act]]
title = "A presigned URL"
summary = "The shop signs a PUT URL for reviews/R-11/photo.jpg, exactly 2,000,000 bytes, 5 minutes; the browser uploads straight to S3: 200."
detail = """
The shop's server uses the AWS SDK's presigner to sign a URL allowing one PUT
of reviews/R-11/photo.jpg, exactly 2,000,000 bytes, for five minutes. The
browser uploads straight to S3 and gets HTTP 200; the object is stored with
all 2,000,000 bytes. The app server carried only the URL, under 2 KB.
"""
speech = """
Second demo: a valet key, as an S3 presigned address. [[slnc 400]] The shop signs a web address. [[slnc 300]] It allows one upload, of one photo, of exactly this size, for five minutes. [[slnc 600]]
The customer's browser uploads straight to S3. [[slnc 300]] Accepted. [[slnc 300]] Two million bytes stored. [[slnc 500]]
The app server carried only the address.
"""
rows = { app = "active ok", storage = "active ok" }
console = [
    ["PUT via presigned URL: HTTP 200", "ok"],
    ["app carried under 2 KB", "ok"],
]

[[act]]
title = "That, and nothing else"
summary = "The same URL used to read, or edited to R-3, or with a 6 MB body: all 403; an unsigned upload gets through only because LocalStack does not enforce permissions."
detail = """
S3 checks the signature against exactly what is asked. Reading the photo with
the upload URL: 403. Editing the URL to point at review R-3: 403. Sending a 6
MB file with it: 403, because the size was signed. An upload with no
signature at all gets through here only because LocalStack does not enforce
bucket permissions; real S3 would refuse it with 403.
"""
speech = """
Third demo: the key allows that, and nothing else. [[slnc 400]] Use it to read the photo. [[slnc 300]] Refused. [[slnc 500]]
Edit it to point at another review. [[slnc 300]] Refused. [[slnc 500]]
Send a six megabyte file with it. [[slnc 300]] Refused, because the size was signed. [[slnc 600]]
One honest note. [[slnc 300]] An upload with no key at all gets through here, because this local stand-in for S3 does not check permissions. [[slnc 300]] Real S3 refuses it.
"""
rows = { storage = "active ok" }
console = [
    ["read with it: 403", "ok"],
    ["edited to R-3: 403", "ok"],
    ["6 MB body: 403", "ok"],
    ["unsigned: 200 on LocalStack only", "amber"],
]

[[act]]
title = "The key runs out"
summary = "A URL valid for 1 second, used after 2 seconds: 403."
detail = """
The time of signing and the lifetime are part of what is signed. A URL valid
for one second, used after two, is refused with 403.
"""
speech = """
Fourth demo: the key runs out. [[slnc 400]] A key valid for one second is used after two. [[slnc 500]]
Refused.
"""
rows = { storage = "active ok" }
console = [
    ["1 s key after 2 s: 403", "ok"],
]

[[act]]
title = "The bill"
summary = "A URL pasted into a public chat is used by a stranger: 200, and the file is stored."
detail = """
A valid URL is pasted into a public chat, and a stranger uses it: HTTP 200,
and ten bytes are stored. Whoever holds the key can use it until it expires.
Keep keys short-lived and narrow, keep them out of logs, and sign with
credentials that can be revoked if one leaks.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] A valid address is pasted into a public chat. [[slnc 300]] A stranger uses it. [[slnc 300]] Accepted. [[slnc 600]]
Whoever holds the key can use it, until it expires. [[slnc 500]]
Keep keys short-lived and narrow. [[slnc 300]] Keep them out of logs. [[slnc 300]] And sign with credentials you can revoke.
"""
rows = { storage = "active amber" }
console = [
    ["stranger with the key: 200", "bad"],
]

