[[scene]]
key = "01-poster"
kind = "poster"
title = "Materialized View"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Materialized View pattern, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] A materialized view is a ready-made copy of data, shaped for one page. [[slnc 300]] The data comes from several services. [[slnc 300]] The copy is kept up to date by listening to events, so reading it is one quick lookup. [[slnc 600]]
Think of the departures board at a railway station. [[slnc 300]] Nobody phones each train company to find a platform. [[slnc 300]] The board is prepared in advance, and each company sends an update when something changes. [[slnc 300]] Passengers just read the board. [[slnc 700]]
In this video, the domain is an online shop. [[slnc 300]] Its "my orders" page shows each order, the product name, and whether it has shipped. [[slnc 300]] That data lives in three separate services: orders, shipping, and the catalogue. [[slnc 500]]
By the end, you will hear why asking every service on every visit is slow and fragile. [[slnc 300]] How a view built from events fixes it. [[slnc 300]] Why the view can be a moment behind. [[slnc 300]] And how to rebuild it from nothing.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["The \"my orders\" page shows:", "product, quantity, shipped or not.", "", "Orders service: the orders", "Shipping service: shipped?", "Catalogue service: the names"]
narration = """
Here is the scenario. [[slnc 400]] Priya opens her "my orders" page. [[slnc 300]] For each order, it shows the product, the quantity, and whether it has shipped. [[slnc 600]]
That data lives in three services. [[slnc 300]] A service is a small, separate program that owns one kind of data. [[slnc 500]]
The orders service knows her orders. [[slnc 300]] The shipping service knows what has shipped. [[slnc 300]] And the catalogue service knows the product names. [[slnc 500]]
So how does the page get all three?
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["Services publish an event", "for every change.", "", "The view listens and keeps", "rows shaped for the page.", "", "The page reads only the view."]
narration = """
Let's name the pattern. [[slnc 400]] Every service publishes an event whenever its data changes. [[slnc 500]]
A separate view listens to those events. [[slnc 300]] It keeps rows shaped exactly for one page. [[slnc 500]]
The page reads only the view. [[slnc 300]] It never asks the services. [[slnc 500]]
That view is the materialized view. [[slnc 300]] Materialized just means it is actually stored, not worked out each time.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["Services: own the real data", "Event log: every change, in order", "OrderHistoryView: the ready rows", "QueryOnRead: the old way, for contrast"]
narration = """
Here is who does what. [[slnc 400]] The services own the real data. [[slnc 300]] They publish an event for every change. [[slnc 500]]
The event log keeps every event, in order, and delivers them. [[slnc 500]]
The order history view has one method. [[slnc 300]] It takes an event and updates its rows. [[slnc 300]] Placed adds a row. [[slnc 300]] Shipped changes a status. [[slnc 300]] Renamed rewrites a name. [[slnc 500]]
And query on read is the old way, kept for comparison.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["CREATE MATERIALIZED VIEW", "The read side of CQRS", "Search indexes filled from events", "Dashboards built from a copy"]
narration = """
You have probably met this pattern already. [[slnc 400]] Databases such as Postgres have materialized views built in. [[slnc 500]]
The read side of CQRS is the same idea. [[slnc 300]] CQRS means keeping one model for changing data, and another for reading it. [[slnc 500]]
A search index, filled from events, is a materialized view. [[slnc 300]] And so is a dashboard built from a copy of the data.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Use it when a page is read often", "and needs several services.", "", "Keep the events to rebuild.", "", "Must be exact right now?", "Ask the owning service."]
narration = """
So, when should you use it? [[slnc 400]] Use a materialized view when a page is read far more often than its data changes, and it needs data from several services. [[slnc 500]]
Keep the events, so the view can always be rebuilt. [[slnc 500]]
And when an answer must be exactly right at this moment, such as a bank balance before a payment, ask the service that owns it.
"""

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a cancelled event", "and rebuild the view."]
narration = """
That's the Materialized View pattern. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Prepare the answer before anyone asks, and keep it up to date from events. [[slnc 500]]
The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs offline, with nothing installed except a Java development kit. [[slnc 500]]
Here is one exercise to try. [[slnc 300]] Add an order cancelled event. [[slnc 300]] Update the view, and rebuild it from the log. [[slnc 500]]
If this helped, a like really does help other people find it. [[slnc 300]] And subscribe, if you'd like the rest of the series. [[slnc 400]] Thanks for watching.
"""
