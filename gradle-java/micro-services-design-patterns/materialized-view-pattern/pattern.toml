# pattern.toml for the Materialized View project. See tools/patternkit.

[project]
slug = "materialized-view"
category = "micro-services-design-patterns"
title = "Materialized View"
package = "materializedview"
main_class = "MaterializedViewDemo"
tagline = "Prepare the answer before anyone asks"
bold = "When a page needs data from several services, keep a ready-made copy shaped exactly for that page, and update it from events, instead of asking every service on every visit."
youtube_description = """Materialized View pattern in Java, explained with an online store's my-orders page, which shows each order, the product name and whether it has shipped, from three separate services. A materialized view is a ready-made copy of data shaped for one page and kept up to date by listening to events, so reading it is one quick lookup, like a railway departures board. We watch the page ask three services on every visit, build a ready-made view, see it run a moment behind, and rebuild it from the events. We finish with the bill."""
domain_note = ""
thumb_lines = ["MATERIALIZED", "VIEW"]
thumb_code = "view.myOrders(id)"
youtube_title = "Materialized View"
youtube_tags = ["materialized view", "microservices", "cqrs", "read model", "event driven", "java"]

[readme]
intro = """
Materialized View is a microservices pattern for reading data that lives in
several services. Instead of asking each service every time a page is opened,
you keep a separate, ready-made table shaped exactly for that page. The
services publish events when their data changes, and the view listens and
updates itself.

Reading the page is then a single lookup. It is fast, and it keeps working when
one of the services is down. The price is that the view is a copy: it can be a
moment behind, and it has to be kept in step.
"""
analogy = """
Think of the departures board at a railway station. Nobody phones each train
company when a passenger wants to know which platform to go to. The board is
prepared in advance, and each company sends an update when a train is delayed
or changes platform. Passengers just read the board.

For a few seconds after a change, the board can be behind. That is the deal:
instant answers for everyone, in return for a short delay in updates.
"""
scenario = """
The online store's "my orders" page shows each order, the product's name, the
quantity and whether it has shipped. That data lives in three services: orders,
shipping and the catalogue. The page asked all three on every visit: seven
calls for a customer with three orders, and a broken page whenever the
catalogue was down.
"""
costs = [
    "**The view can be behind.** Between an event happening and the view hearing about it, the page shows the old state.",
    "**A copy to keep in step.** Rows are stored twice, and a single change, such as renaming a product, can rewrite many rows.",
    "**Events are required.** The services must publish every change, and the view must never miss one.",
    "**More moving parts.** Something has to run the view, store it, and rebuild it when its shape changes.",
]
too_much = """
When one service already holds everything the page needs, just ask it. And
when the page must be exactly current, such as a bank balance before a
payment, read from the owning service instead of a copy that may be behind.
"""
met_before = [
    "Database materialized views, such as `CREATE MATERIALIZED VIEW` in PostgreSQL.",
    "The read side of CQRS, where commands and queries use different models.",
    "Search indexes such as Elasticsearch, filled from events or change data capture.",
    "Dashboards and reports built from a nightly or streaming copy of the data.",
]
where = """
This project is in [micro-services-design-patterns](..), next to
[API Composition](../api-composition-pattern), which answers the same question
by asking every service at the moment of reading. Materialized View answers it
in advance.
"""

[[act]]
title = "Asking three services"
summary = "One page with 3 orders makes 7 service calls, about 280 ms of waiting; with the catalogue down, the page fails."
detail = """
`QueryOnRead` builds the "my orders" page on every visit. It asks the orders
service for the customer's orders, then, for each order, asks shipping whether
it has shipped and the catalogue for the product's name. Three orders make one
plus two times three: seven calls, about 280 milliseconds at 40 each. When the
catalogue is switched off, the whole page fails with "catalogue service
unavailable".
"""
speech = """
First demo: build the page by asking three services. [[slnc 400]] Priya opens her orders page. [[slnc 300]] She has three orders. [[slnc 500]]
The page asks the orders service for her orders. [[slnc 300]] Then, for each order, it asks shipping whether it has shipped. [[slnc 300]] And it asks the catalogue for the product's name. [[slnc 500]]
That is seven calls, for one page. [[slnc 300]] At forty milliseconds each, about two hundred and eighty milliseconds of waiting. [[slnc 600]]
Now the catalogue goes down. [[slnc 300]] The whole page fails. [[slnc 300]] Even though orders and shipping were fine.
"""
rows = { page = "active wrong", orders = "active amber", shipping = "active amber", catalogue = "active wrong" }
console = [
    ["ORD-1 1 x kettle (shipped)", "muted"],
    ["one page: 7 calls, about 280 ms", "bad"],
    ["catalogue down: the page fails", "bad"],
]

[[act]]
title = "A ready-made view"
summary = "The view hears 7 events and writes 3 rows; the page is served with 0 service calls, catalogue still down."
detail = """
`OrderHistoryView` listens to the events the services publish: order placed,
order shipped, product renamed. From seven events it writes three rows, one per
order, with the product's name and the shipping status already filled in.
Opening the page is now one lookup in that table: zero service calls, and it
works while the catalogue is still down. The rows are exactly the same as the
page built by asking.
"""
speech = """
Second demo: a ready-made view. [[slnc 400]] Each service publishes an event when something changes. [[slnc 300]] An order was placed. [[slnc 300]] An order was shipped. [[slnc 300]] A product got a name. [[slnc 500]]
The view listens. [[slnc 300]] From seven events, it writes three rows, one for each of Priya's orders. [[slnc 300]] Each row already holds the product name and the shipping status. [[slnc 600]]
Now the page reads the view. [[slnc 300]] One lookup. [[slnc 300]] Zero service calls. [[slnc 300]] And the catalogue is still down, but the page works. [[slnc 500]]
The rows are exactly the same as before.
"""
rows = { events = "active ok", view = "active ok", page = "active ok" }
console = [
    ["heard 7 events, wrote 3 rows", "ok"],
    ["page: 0 service calls", "ok"],
    ["catalogue still down: page works", "ok"],
    ["same page as before: true", "ok"],
]

[[act]]
title = "A moment behind"
summary = "ORD-3 ships; until the event is delivered the page says placed, a moment later shipped."
detail = """
Order three ships. The shipping service knows at once, and publishes an event.
Until that event reaches the view, the page still says `placed`. A moment
later, after delivery, it says `shipped`. This delay is called eventual
consistency: the view is not wrong forever, it catches up.
"""
speech = """
Third demo: the view is a moment behind. [[slnc 400]] Order three ships. [[slnc 300]] The shipping service knows straight away, and sends an event. [[slnc 500]]
But the event is still on its way. [[slnc 300]] If Priya opens her page right now, order three still says placed. [[slnc 500]]
A moment later, the event arrives. [[slnc 300]] Now the page says shipped. [[slnc 600]]
This is called eventual consistency. [[slnc 300]] The view is not wrong for ever. [[slnc 300]] It catches up.
"""
rows = { shipping = "active ok", events = "active amber", view = "active amber" }
console = [
    ["ORD-3 ships; 1 event waiting", "amber"],
    ["page right now: ORD-3 (placed)", "amber"],
    ["a moment later: ORD-3 (shipped)", "ok"],
]

[[act]]
title = "Rebuild from the events"
summary = "Replaying all 8 events into an empty view gives exactly the same page."
detail = """
The view is only a copy, so it can be thrown away. `EventLog` keeps every event
in order. Replaying all eight of them into an empty `OrderHistoryView` builds
exactly the same rows. This is how a view is repaired after a bug, or given a
new column: change the code, and rebuild it from the start.
"""
speech = """
Fourth demo: throw the view away, and rebuild it. [[slnc 400]] The view is only a copy. [[slnc 300]] The real data still lives in the services, and every event is kept in a log. [[slnc 500]]
Start with an empty view. [[slnc 300]] Replay all eight events, in order. [[slnc 500]]
The rebuilt page is exactly the same as the old one. [[slnc 600]]
That is how you fix a view after a bug, or add a new column. [[slnc 300]] Change the code, and rebuild from the start.
"""
rows = { events = "active ok", view = "active ok" }
console = [
    ["replayed 8 events into an empty view", "ok"],
    ["rebuilt page equals the old one: true", "ok"],
]

[[act]]
title = "The bill"
summary = "Renaming the kettle changes 1 name in the catalogue but rewrites 2 rows in the view; 3 rows are stored twice."
detail = """
The kettle is renamed "steel kettle". The catalogue changes one name. The view
has copied that name into every order row that bought it, so it rewrites two
rows. All three rows are data the services already hold, stored a second time.
And any page the view serves may be a moment out of date.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] The kettle gets a new name: steel kettle. [[slnc 300]] The catalogue changes one name. [[slnc 500]]
But the view copied that name into every order that bought a kettle. [[slnc 300]] So it has to rewrite two rows. [[slnc 600]]
Every row in the view is data that the services already hold. [[slnc 300]] It is stored twice. [[slnc 500]]
And every page it serves may be a moment out of date.
"""
rows = { catalogue = "active amber", view = "active amber" }
console = [
    ["renamed: 1 name, 2 rows rewritten", "amber"],
    ["3 rows stored twice", "amber"],
    ["pages may be a moment out of date", "amber"],
]

