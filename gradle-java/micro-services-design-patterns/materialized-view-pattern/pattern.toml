]

[docs.session]
objectives = [
    "Explain why asking several services on every read is slow and fragile.",
    "Build a view that updates itself from events.",
    "Explain eventual consistency with the shipped order that still reads placed.",
    "Rebuild a view from the event log.",
]
walkthrough = """
Run `./gradlew run` and start with act one: seven calls and a failed page.
Then open `OrderHistoryView.java` and read its one method, `on`, one event at a
time: placed adds a row, shipped changes a status, renamed rewrites names. Act
three is the one to pause on, because the lag is the price every learner must
be able to explain.
"""
exercises = [
    "Add a `total spent` figure per customer to the view. Which events must change it?",
    "Add an `OrderCancelled` event. Update the view, and rebuild it from the log.",
    "Count how many rows a rename rewrites for a customer with 100 kettle orders. Is that a problem?",
    "Deliver the events in a different order. Which orders break the view, and how would you guard against it?",
]

[docs.explained]
sentence = """
A materialized view is a ready-made copy of data from several services, shaped
for one page and kept up to date from events, so reading it is one fast lookup
that works even when those services are down.
"""
verdict = """
Use it for pages that are read far more often than the data changes and that
need data from several services, when a short delay is acceptable. Keep the
events, so the view can always be rebuilt. For answers that must be exactly
current, ask the owning service instead.
"""
recognise = [
    "A table or index named for a screen: `order_history`, `product_search`, `dashboard_stats`.",
    "Event handlers that only update a read table.",
    "A `rebuild` or `replay` job for a read model.",
    "Documentation that says data on a page \"may take a few seconds to update\".",
]

[spec]
purpose = """
Teach Materialized View with an online store: the "my orders" page built by
asking three services (7 calls, about 280 ms, failing when the catalogue is
down), then from a view updated by events (0 calls, still working), the lag
between shipping and the page, a rebuild from the event log, and the costs of
rewritten rows and stored copies.
"""
nongoals = [
    "Not a database or broker. Events and the view live in memory.",
    "Not event sourcing. The services keep their own state; the log is for delivery and replay.",
    "Not ordering guarantees. Events are delivered in the order they were published.",
]
problem = """
A page that needs data from several services asks all of them on every visit,
which is slow and fails when any of them is down.
"""
roles = [
    ["The pattern", "`OrderHistoryView`"],
    ["Events", "`Event` (`OrderPlaced`, `OrderShipped`, `ProductRenamed`), `EventLog`"],
    ["The owning services", "`Services`"],
    ["The naive version", "`QueryOnRead`"],
    ["Entry point", "`MaterializedViewDemo`, five acts"],
]
requirements = [
    "**Same answer:** the view's page equals the page built by asking the services.",
    "**No calls on read:** reading the view makes 0 service calls, asserted.",
    "**Lag is visible:** an undelivered event leaves the old status on the page.",
    "**Rebuildable:** replaying the log into an empty view gives the same page.",
    "**Every printed number is asserted** in `DemoRunsTest`.",
]

