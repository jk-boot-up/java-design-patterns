# pattern.toml for the Asynchronous Request-Reply project. See tools/patternkit.

[project]
slug = "async-request-reply"
category = "micro-services-design-patterns"
title = "Asynchronous Request-Reply"
package = "asyncreply"
main_class = "AsyncRequestReplyDemo"
tagline = "Take a ticket, come back later"
bold = "When work takes longer than a caller can wait, accept the request at once, hand back a link to check, and let the caller come back for the result."
youtube_description = """Asynchronous Request-Reply pattern in Java, explained with an online store where sellers ask for a monthly sales report that takes about six seconds to build. When a job takes longer than a caller can wait, the server accepts the request at once, hands back a link to check on the job, and that link leads to the result when it is ready, like a dry cleaner's ticket you bring back on Thursday. We watch a slow report fail behind a normal request even when the work succeeds, then accept it at once with 202 Accepted, check back and follow a 303 to the result, and stop a double click from doing the work twice. We finish with what the pattern costs."""
domain_note = ""
thumb_lines = ["ASYNC", "REQUEST-REPLY"]
thumb_code = "202 Accepted"
youtube_title = "Asynchronous Request-Reply"
youtube_tags = ["asynchronous request reply", "202 accepted", "polling", "microservices", "rest api", "java"]

[readme]
intro = """
Asynchronous Request-Reply is a pattern for slow work behind an HTTP API. A
normal request waits for its answer, and everything in between (the browser,
the load balancer, the gateway) gives up after a few seconds. For work that
takes longer, the server answers straight away with `202 Accepted` and a
status link. The caller checks that link from time to time, and when the work
is done, it is sent on to the result.

Nobody waits on an open connection, nothing times out, and the work is done
once, even if the caller asks twice.
"""
analogy = """
Think of a dry cleaner. You do not stand at the counter while your coat is
cleaned. You hand it over, you get a ticket with a number, and you are told to
come back on Thursday. On Thursday you show the ticket and collect the coat.

If you come back on Tuesday, they just tell you "not yet, try Thursday". And if
you hand in the same coat twice by mistake, a good cleaner notices it is the
same order.
"""
scenario = """
Sellers in the online store can ask for a sales report for the month. Building
it adds up every order and takes about six seconds. The gateway in front of the
store gives up on any request after three seconds, so the seller always saw
"504 Gateway Timeout", clicked again, and the store built the same report again,
for nobody.
"""
costs = [
    "**More requests.** One report now takes a submit, a few status checks and a fetch: five requests instead of one.",
    "**A smarter client.** The caller must remember the link, wait between checks, and follow the redirect.",
    "**State on the server.** Every job's progress and result must be stored until it is collected, and cleaned up after.",
    "**Impatient clients.** A client that ignores the retry hint and checks every tenth of a second sends sixty requests for one report.",
]
too_much = """
When the work reliably finishes in well under a second, a normal request is
simpler and better. And when the client can receive a message back, such as a
webhook or a web socket, the server can tell it when the work is done instead
of being asked again and again.
"""
met_before = [
    "HTTP `202 Accepted` with a `Location` header, and `Retry-After`.",
    "Cloud APIs for long jobs: starting a virtual machine, transcoding a video, or an Azure long-running operation.",
    "\"Your export is being prepared; we will show it here when it is ready\" in many web apps.",
    "Payment providers that return `pending` and let you check the payment's status later.",
]
where = """
This project is in [micro-services-design-patterns](..). It pairs well with
[Idempotent Consumer](../idempotent-consumer-pattern), which uses the same idea
as the request key: asking twice must not do the work twice.
"""

[[act]]
title = "Waiting for a slow report"
summary = "The report takes 6 s, the gateway gives up at 3 s: 504 twice, built 2 times, received 0 times."
detail = """
`SyncReportApi` builds the report while the request waits. The report takes six
seconds; the gateway in front gives up after three and answers
`504 Gateway Timeout`. The seller clicks again and gets another 504. The server
never knew the seller had gone, so it built the report both times: two builds,
and the seller received nothing.
"""
speech = """
First demo: waiting for a slow report. [[slnc 400]] A seller asks for this month's sales report. [[slnc 300]] Building it takes six seconds. [[slnc 500]]
But the gateway in front of the store gives up after three seconds. [[slnc 300]] It answers five oh four, which means gateway timeout. [[slnc 500]]
The seller clicks again. [[slnc 300]] Another five oh four. [[slnc 600]]
Meanwhile, the server never knew the seller had gone. [[slnc 300]] It built the report both times. [[slnc 300]] Built twice. [[slnc 300]] Received, zero times.
"""
rows = { seller = "active wrong", gateway = "active wrong", builder = "active amber" }
console = [
    ["first try: 504, Gateway Timeout", "bad"],
    ["second try: 504, Gateway Timeout", "bad"],
    ["built 2 times, received 0 times", "bad"],
]

[[act]]
title = "Accepted at once"
summary = "POST /reports answers 202 Accepted at once, with a status link and a hint to retry after 2 s."
detail = """
`AsyncReportApi.submit` starts the job and answers immediately with
`202 Accepted`. The answer carries two things: a status link,
`/reports/status/R-1`, and a hint to check again after two seconds. The
connection closes straight away, so no gateway ever times out.
"""
speech = """
Second demo: accepted at once. [[slnc 400]] Now the seller's request gets an answer straight away. [[slnc 300]] Two oh two, accepted. [[slnc 500]]
The answer means: I have your request, and I am working on it. [[slnc 500]]
It carries two things. [[slnc 300]] A status link, like a ticket number. [[slnc 300]] And a hint: check again in two seconds. [[slnc 500]]
The report is built in the background. [[slnc 300]] Nothing is left waiting, so nothing times out.
"""
rows = { seller = "active ok", api = "active ok", jobs = "active amber" }
console = [
    ["POST /reports: 202 Accepted", "ok"],
    ["-> /reports/status/R-1", "ok"],
    ["retry after 2 s", "amber"],
]

[[act]]
title = "Check back, then fetch"
summary = "At 2 s and 4 s the status says running, 33% then 66%; at 6 s it answers 303 See Other; the fetch returns 412 orders, £18240.50."
detail = """
`PollingClient` waits the two seconds it was told, then checks the status link:
running, 33 percent. Two seconds later: running, 66 percent. At six seconds the
status link answers `303 See Other`, pointing at `/reports/R-1`. The client
follows it and gets the report: 412 orders, £18,240.50.
"""
speech = """
Third demo: check back, then fetch. [[slnc 400]] The seller's page waits two seconds, as it was told. [[slnc 300]] Then it checks the status link. [[slnc 300]] Running, thirty-three percent. [[slnc 500]]
Two seconds later: running, sixty-six percent. [[slnc 500]]
At six seconds, the status link answers three oh three, see other. [[slnc 300]] That means: it is done, and the result is over here. [[slnc 500]]
The page follows the link, and gets the report. [[slnc 300]] Four hundred and twelve orders, eighteen thousand, two hundred and forty pounds fifty.
"""
rows = { seller = "active ok", status = "active ok", report = "active ok" }
console = [
    ["2 s: running, 33%", "amber"],
    ["4 s: running, 66%", "amber"],
    ["6 s: 303 See Other -> /reports/R-1", "ok"],
    ["fetch: 412 orders, £18240.50", "ok"],
]

[[act]]
title = "Asking twice"
summary = "A second POST with the same request key returns the same job, R-1; the report is built once."
detail = """
Every submit carries a request key, here `seller-7-september`. The server keeps
a map from key to job, so a second submit with the same key returns the same
status link, `R-1`, and does not start the work again. The report is built
exactly once.
"""
speech = """
Fourth demo: the seller clicks twice. [[slnc 400]] Each request carries a key, a short name for what is being asked. [[slnc 300]] Here, seller seven, September. [[slnc 500]]
The server remembers which job each key started. [[slnc 300]] So the second click gets the same status link, R 1. [[slnc 500]]
No second job is started. [[slnc 300]] The report is built exactly once.
"""
rows = { api = "active ok", jobs = "active ok" }
console = [
    ["same key again: -> /reports/status/R-1", "ok"],
    ["the report was built 1 time", "ok"],
]

[[act]]
title = "The bill"
summary = "One report takes 5 requests instead of 1; an impatient client checking every 0.1 s sends 62; the server stores every job."
detail = """
One report now costs five requests: submit, three status checks and a fetch.
A client that ignores the retry hint and checks every tenth of a second sends
62 requests for the same report. And the server must keep each job's state
until its result is collected, then clean it up.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] One report now takes five requests, instead of one. [[slnc 300]] A submit, three status checks, and a fetch. [[slnc 600]]
And the client must behave. [[slnc 300]] An impatient client that checks every tenth of a second sends sixty-two requests, for the same report. [[slnc 600]]
The server also has to remember every job, and its result, until someone collects it.
"""
rows = { seller = "active amber", status = "active amber", jobs = "active amber" }
console = [
    ["as told: 5 requests instead of 1", "amber"],
    ["every 0.1 s: 62 requests", "bad"],
    ["the server keeps every job", "amber"],
]

