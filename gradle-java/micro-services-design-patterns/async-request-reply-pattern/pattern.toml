[[scene]]
key = "01-poster"
kind = "poster"
title = "Asynchronous Request-Reply"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Asynchronous Request Reply pattern, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] When a job takes longer than a caller can wait, the server accepts the request straight away. [[slnc 300]] It hands back a link where the caller can check on the job. [[slnc 300]] And when the job is done, that link leads to the result. [[slnc 600]]
Think of a dry cleaner. [[slnc 300]] You do not stand at the counter while your coat is cleaned. [[slnc 300]] You get a ticket, and you are told to come back on Thursday. [[slnc 300]] On Thursday, you show the ticket, and collect the coat. [[slnc 700]]
In this video, the domain is an online shop. [[slnc 300]] Sellers in the shop can ask for a monthly sales report. [[slnc 300]] Building it takes about six seconds. [[slnc 500]]
By the end, you will hear why a slow job fails behind a normal request, even when it succeeds. [[slnc 300]] What the answers two oh two and three oh three mean. [[slnc 300]] How to stop a double click doing the work twice. [[slnc 300]] And what the pattern costs.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["A seller asks for this month's", "sales report: 6 seconds of work.", "", "The gateway in front gives up", "on any request after 3 seconds."]
narration = """
Here is the scenario. [[slnc 400]] A seller asks for this month's sales report. [[slnc 300]] The shop adds up every order, which takes about six seconds. [[slnc 600]]
In front of the shop sits a gateway. [[slnc 300]] A gateway is the front door that every request passes through. [[slnc 300]] To protect the shop, it gives up on any request that takes longer than three seconds. [[slnc 500]]
Six seconds of work, and three seconds of patience. [[slnc 300]] What happens?
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["1. Submit: 202 Accepted + status link", "2. Status: running... then 303", "3. Result: the finished report", "", "Plus a key, so asking twice", "does the work once."]
narration = """
Let's name the pattern. [[slnc 400]] The server has three addresses. [[slnc 500]]
One: submit. [[slnc 300]] It answers two oh two, accepted, with a status link, straight away. [[slnc 500]]
Two: the status link. [[slnc 300]] It answers running, with how far along the job is, and when to check again. [[slnc 300]] When the job is done, it answers three oh three, see other, pointing at the result. [[slnc 500]]
Three: the result itself. [[slnc 500]]
And every request carries a key, so asking twice does the work only once.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["AsyncReportApi: submit, status, fetch", "PollingClient: waits, checks, follows", "ReportBuilder: the slow work", "SyncReportApi: the old way"]
narration = """
Here is who does what. [[slnc 400]] The async report API has the three methods: submit, status, and fetch. [[slnc 300]] It keeps a list of jobs, and which key started each one. [[slnc 500]]
The polling client is the caller's side. [[slnc 300]] It submits, waits as long as it was told, checks the status, and follows the link to the result. [[slnc 500]]
The report builder is the slow work. [[slnc 300]] And the sync report API is the old way, kept for comparison.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["202 Accepted + Location header", "Retry-After", "Cloud APIs: /operations/{id}", "\"Your export is being prepared\""]
narration = """
You have probably met this pattern already. [[slnc 400]] Any API that answers two oh two accepted, with a location header, is using it. [[slnc 300]] A retry after header is the hint for when to check again. [[slnc 500]]
Cloud providers use it for slow jobs, such as starting a virtual machine. [[slnc 500]]
And whenever a website says your export is being prepared, and shows it later, that is this pattern.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Use it for work that can take", "longer than a few seconds.", "", "Give each request a key.", "Send a retry hint.", "", "Can you call the client back?", "Do that instead."]
narration = """
So, when should you use it? [[slnc 400]] Use it for any work behind an API that can take longer than a few seconds. [[slnc 300]] Reports, exports, video processing. [[slnc 500]]
Give each request a key, so a repeat does not start the work again. [[slnc 300]] Send a retry hint, so clients check at a sensible pace. [[slnc 500]]
And when the server can call the client back, for example with a webhook, do that instead of polling.
"""

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a FAILED state", "that says why."]
narration = """
That's the Asynchronous Request Reply pattern. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] For slow work, give the caller a ticket, and let them come back for the result. [[slnc 500]]
The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs offline, with nothing installed except a Java development kit. [[slnc 500]]
