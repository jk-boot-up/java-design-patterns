[docs.prerequisites]
required = [
    "Java basics: classes, records, maps.",
    "HTTP basics: a request, a response, and a status code such as 200 or 404.",
]
not_required = [
    "A web server. The three endpoints are plain Java methods.",
    "Threads. A pretend clock stands in for time passing.",
]

[docs.session]
objectives = [
    "Explain why slow work behind a normal request fails, even when the work succeeds.",
    "Name the three addresses: submit, status and result.",
    "Say what 202, 303 and Retry-After mean.",
    "Make a repeated submit safe with a request key.",
]
walkthrough = """
Run `./gradlew run` and start with act one: built twice, received never. Then
open `AsyncReportApi.java` and read its three methods side by side: `submit`,
`status`, `fetch`. Finish with `PollingClient`, which is the half every
learner forgets: the caller must wait as told and follow the redirect.
"""
exercises = [
    "Add a FAILED state: if the report cannot be built, the status link should say why.",
    "Make the retry hint grow: 1 s, then 2 s, then 4 s. How many requests does one report take now?",
    "Delete a finished job one minute after its report is fetched. What should a late status check answer?",
    "Replace polling with a callback: the client gives a URL, and the server calls it when done.",
]

[docs.explained]
sentence = """
Asynchronous Request-Reply accepts slow work at once with 202 and a status
link, lets the caller check back when told, and sends it on to the result when
the work is done.
"""
verdict = """
Use it for any work that can take longer than a few seconds behind HTTP:
reports, exports, video processing, provisioning. Give each request a key so
a repeat does not start the work again, send a Retry-After hint, and clean up
finished jobs. When the client can receive a callback, prefer that to polling.
"""
recognise = [
    "An endpoint answering `202 Accepted` with a `Location` header.",
    "URLs like `/operations/{id}`, `/jobs/{id}` or `/status/{id}`.",
    "A `Retry-After` header on a status response.",
    "Client code that loops, sleeps, and checks a status field until it says done.",
]

[spec]
purpose = """
Teach Asynchronous Request-Reply with an online store: a 6 second sales report
behind a gateway that gives up at 3 seconds (504 twice, built twice, received
never), then 202 Accepted with a status link, status checks showing progress
and 303 See Other, a repeated submit returning the same job, and the costs in
requests and stored state.
"""
nongoals = [
    "Not a web server or threads. Endpoints are methods; a pretend clock stands in for time.",
    "Not callbacks or web sockets. They are named as the alternative.",
    "Not job storage. Jobs live in a map.",
]
problem = """
Work that takes longer than the gateway's timeout fails for the caller even
when it succeeds on the server, and retries repeat it.
"""
roles = [
    ["The pattern", "`AsyncReportApi` (submit, status, fetch)"],
    ["The caller", "`PollingClient`"],
    ["The slow work", "`ReportBuilder`"],
    ["The naive version", "`SyncReportApi`"],
    ["Entry point", "`AsyncRequestReplyDemo`, five acts"],
]
requirements = [
    "**Accepted at once:** submit answers 202 with a status link and a 2 second retry hint.",
    "**Progress then redirect:** status answers running with a percentage, then 303 to the result.",
    "**Once per key:** the same request key never starts a second job.",
    "**Counted requests:** 5 when the hint is followed, 62 when checking every 0.1 s.",
    "**Every printed number is asserted** in `DemoRunsTest`.",
]

