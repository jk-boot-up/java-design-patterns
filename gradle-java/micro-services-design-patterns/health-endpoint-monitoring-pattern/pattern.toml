[[scene]]
key = "01-poster"
kind = "poster"
title = "Health Endpoint Monitoring"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Health Endpoint Monitoring pattern, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] Each running copy of a service answers a small web address that says how it is. [[slnc 300]] It answers two questions. [[slnc 300]] Am I working at all? If not, restart me. [[slnc 300]] And can I take work right now? If not, stop sending it. [[slnc 600]]
Think of the host at a busy restaurant, who decides which waiter gets the next table. [[slnc 300]] A waiter who has fainted is sent home and replaced. [[slnc 300]] A waiter whose kitchen has run out of gas is fine, but should not get tables for now. [[slnc 300]] Sending them home would not fix the gas. [[slnc 700]]
In this video, the domain is an online shop. [[slnc 300]] Its checkout service runs as three copies, called A, B and C. [[slnc 300]] A load balancer shares the orders between them. [[slnc 500]]
By the end, you will hear why an open port is not a healthy service. [[slnc 300]] The difference between liveness and readiness. [[slnc 300]] Why a check that asks too much restarts everything. [[slnc 300]] And what these checks cost.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["Checkout runs as 3 instances:", "A, B and C.", "", "Each has its own database.", "All share payments and", "recommendations.", "", "A load balancer shares the orders."]
narration = """
Here is the scenario. [[slnc 400]] The shop's checkout service runs as three instances. [[slnc 300]] An instance is one running copy of the same program. [[slnc 500]]
Each instance has its own database connection. [[slnc 300]] All three share the same payment provider. [[slnc 300]] And the same product recommendations service. [[slnc 600]]
In front of them sits a load balancer. [[slnc 300]] It shares the orders between A, B and C, in turn. [[slnc 500]]
How does it know which instances are fit for work?
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["/health/live: is the process working?", "  No: the platform restarts it.", "", "/health/ready: can it take work now?", "  No: the load balancer skips it.", "  Degraded: work, with less."]
narration = """
Let's name the pattern. [[slnc 400]] Every instance answers two addresses. [[slnc 500]]
Health, live, asks: is the process working at all? [[slnc 300]] If the answer is no, three times in a row, the platform restarts it. [[slnc 500]]
Health, ready, asks: can it take work right now? [[slnc 300]] If a critical dependency is down, the answer is no, and the load balancer skips it. [[slnc 300]] If only something optional is down, the answer is degraded. [[slnc 300]] It keeps working, with less.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["HealthEndpoint: live and ready", "LoadBalancer: acts on ready", "Restarter: acts on live", "Dependency: critical or not"]
narration = """
Here is who does what. [[slnc 400]] The health endpoint has two checks, live and ready. [[slnc 500]]
The load balancer uses ready, to decide where to send orders. [[slnc 300]] The restarter stands in for the platform. [[slnc 300]] It uses live, to decide what to restart. [[slnc 500]]
And each dependency is marked critical, or not. [[slnc 300]] That mark decides between down, and degraded.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Kubernetes liveness and", "readiness probes", "Spring Boot Actuator /health", "Cloud load balancer health checks", "Status pages: operational, degraded"]
narration = """
You have probably met this pattern already. [[slnc 400]] Kubernetes has liveness probes and readiness probes. [[slnc 300]] They are exactly these two questions. [[slnc 500]]
Spring Boot Actuator gives every application a health address. [[slnc 500]]
Cloud load balancers have health check settings. [[slnc 300]] And public status pages show operational, degraded, or down.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Give every service both checks.", "", "Keep liveness shallow.", "Critical dependencies: readiness.", "Optional ones: degraded.", "", "Keep the details private."]
narration = """
So, when should you use it? [[slnc 400]] Give every service that runs as several instances both checks. [[slnc 500]]
Keep liveness shallow: only the process itself. [[slnc 300]] Put critical dependencies in readiness. [[slnc 300]] Report optional ones as degraded. [[slnc 500]]
Cache the answer for a few seconds, so checks do not flood your dependencies. [[slnc 300]] And keep the detailed answer off the public internet.
"""

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Cache the readiness answer", "and count the calls."]
narration = """
That's the Health Endpoint Monitoring pattern. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Alive is not the same as ready. [[slnc 300]] Restart what is dead, and stop sending work to what is not ready. [[slnc 500]]
The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs offline, with nothing installed except a Java development kit. [[slnc 500]]
Here is one exercise to try. [[slnc 300]] Cache the readiness answer for five seconds. [[slnc 300]] Then count the dependency calls a minute. [[slnc 500]]
If this helped, a like really does help other people find it. [[slnc 300]] And subscribe, if you'd like the rest of the series. [[slnc 400]] Thanks for watching.
"""
