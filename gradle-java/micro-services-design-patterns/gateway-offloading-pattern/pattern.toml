[[scene]]
key = "01-poster"
kind = "poster"
title = "Gateway Offloading"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Gateway Offloading pattern, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] Many services need the same chores done on every request. [[slnc 300]] Checking who the caller is. [[slnc 300]] Stopping callers who send too much. [[slnc 300]] Compressing the answer. [[slnc 500]] Gateway offloading moves those chores into the gateway in front of the services. [[slnc 300]] So they are done once, the same way for everyone. [[slnc 600]]
Think of an office building with a reception desk. [[slnc 300]] Visitors sign in once, at the front door. [[slnc 300]] The teams upstairs do not each check passports at their own door. [[slnc 700]]
In this video, the domain is an online shop, with three services. [[slnc 300]] Catalog, cart, and orders. [[slnc 500]]
By the end, you will hear how three copies of a sign-in check drifted apart. [[slnc 300]] How the gateway takes over sign-in, rate limits and compression. [[slnc 300]] And why there must be no side door.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["Catalog, cart and orders.", "", "Each checks the sign-in token", "with its own copy of the code.", "", "Orders forgot to check expiry."]
narration = """
Here is the scenario. [[slnc 400]] The shop has three services. [[slnc 300]] Catalog, cart and orders. [[slnc 500]]
Each one checked the customer's sign-in token itself, with its own copy of the code. [[slnc 500]]
The orders team's copy forgot to check whether the token had expired.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["Shared chores move to the gateway.", "", "Sign-in, rate limits, compression.", "", "Services keep only their business."]
narration = """
Let's name the pattern. [[slnc 400]] The chores every service needs move into the gateway. [[slnc 500]]
Checking sign-in. [[slnc 300]] Limiting how often each customer can call. [[slnc 300]] Compressing responses. [[slnc 500]]
The services keep only their own business.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["Gateway: sign-in, limit, route, compress", "ShopService: just its own job", "SelfCheckingService: the old way", "Tokens: the customer's sign-in"]
narration = """
Here is who does what. [[slnc 400]] The gateway does four steps, in order. [[slnc 300]] Check sign-in. [[slnc 300]] Check the rate limit. [[slnc 300]] Route the request, saying who the customer is. [[slnc 300]] And compress the answer. [[slnc 500]]
The shop services just do their own job. [[slnc 500]]
The self-checking service is the old way, with its own copy of the check.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Kong, NGINX, Envoy", "AWS API Gateway", "Spring Cloud Gateway", "TLS at the load balancer"]
narration = """
You have probably met this pattern already. [[slnc 400]] Gateways such as Kong, NGINX, and Envoy have plugins for sign-in checks and rate limits. [[slnc 500]]
Cloud gateways, and Spring Cloud Gateway, do the same. [[slnc 500]]
And a load balancer that handles encryption is offloading too.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Many services need the same chores.", "", "Keep business rules out.", "Block every side door.", "Treat the gateway as critical."]
narration = """
So, when should you use it? [[slnc 400]] When many services need exactly the same chores. [[slnc 500]]
Keep business rules out of the gateway. [[slnc 300]] Make sure nobody can reach the services around it. [[slnc 300]] And run the gateway as the critical piece it now is.
"""

