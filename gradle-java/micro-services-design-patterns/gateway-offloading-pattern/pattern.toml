# pattern.toml for the Gateway Offloading project. See tools/patternkit.

[project]
slug = "gateway-offloading"
category = "micro-services-design-patterns"
title = "Gateway Offloading"
package = "gatewayoffloading"
main_class = "GatewayOffloadingDemo"
tagline = "Do the shared chores once"
bold = "Move the chores every service needs, such as sign-in checks, rate limiting and compression, out of the services and into the gateway in front of them, so they are done once and the same way."
youtube_description = """Gateway Offloading pattern in Java: chores every service needs on every request, such as checking who the caller is, limiting callers who send too much, and compressing the answer, move into the gateway in front of them, so they are done once and the same way for everyone, like visitors signing in at reception instead of at every team's door. Explained with an online store running catalog, cart and orders services. We watch three copies of a sign-in check drift apart, then check once at the gateway, add rate limiting and compression there. We finish with the bill."""
domain_note = ""
thumb_lines = ["GATEWAY", "OFFLOADING"]
thumb_code = "one check, at the door"
youtube_title = "Gateway Offloading"
youtube_tags = ["gateway offloading", "api gateway", "rate limiting", "authentication", "microservices", "java"]

[readme]
intro = """
Gateway Offloading is a cloud design pattern. Many services need the same
chores done on every request: check who the caller is, stop callers who send
too much, compress the response, log it. When each service does these itself,
each team writes its own copy, and the copies drift apart.

The pattern moves those shared chores into the gateway that already sits in
front of the services. The gateway does them once, the same way for everyone,
and passes on only requests that passed. The services are left to do their
own business.
"""
analogy = """
Think of an office building with a reception desk. Visitors show their ID and
sign in once, at the front door. The teams upstairs do not each check
passports at their own door; they trust that anyone in the corridor has
already been checked. That only works if there is no side door.
"""
scenario = """
The online store has three services: catalog, cart and orders. Each one
checked the customer's sign-in token itself, with its own copy of the code.
The orders team's copy forgot to check whether the token had expired, so a
customer whose sign-in expired an hour ago could still see and place orders.
"""
costs = [
    "**No side doors.** The services now trust the gateway; a call straight to the orders service, claiming to be another customer, was accepted.",
    "**One place for everything.** A gateway fault, a slow gateway or a bad setting hits every page at once.",
    "**Scope creep.** Only shared, generic chores belong in the gateway; business rules must stay in the services.",
]
too_much = """
With one or two services, a shared library does the job without an extra hop.
Offloading pays off when many services, often written by different teams or
in different languages, need exactly the same chores.
"""
met_before = [
    "API gateways: Kong, NGINX, Envoy, AWS API Gateway, Spring Cloud Gateway.",
    "TLS termination at a load balancer.",
    "Rate-limiting and JWT-validation plugins on a gateway.",
]
where = """
This project is in [micro-services-design-patterns](..). The
[API Gateway](../api-gateway-pattern) project shows the gateway as a single
entry point that routes and combines calls; this one is about what the gateway
takes off the services' hands.
"""

[[act]]
title = "Every service checks for itself"
summary = "An expired token: catalog and cart refuse it with 401, but orders answers 200, because its copy of the check forgot expiry."
detail = """
Catalog, cart and orders each check the sign-in token with their own copy of
the code. A customer's token expired a minute ago. Catalog and cart refuse it
with 401. Orders answers 200, because the orders team's copy never checks
expiry. Three copies of the same check, and one of them is wrong.
"""
speech = """
First demo: every service checks the sign-in token itself. [[slnc 400]] The customer's token expired a minute ago. [[slnc 600]]
The catalog service refuses it. [[slnc 300]] The cart service refuses it. [[slnc 300]] But the orders service lets the customer in. [[slnc 600]]
The orders team's copy of the check forgot about expiry. [[slnc 300]] Three copies of the same check, and one of them is wrong.
"""
rows = { catalog = "active ok", cart = "active ok", orders = "active wrong" }
console = [
    ["expired -> catalog: 401", "ok"],
    ["expired -> cart: 401", "ok"],
    ["expired -> orders: 200", "bad"],
]

[[act]]
title = "One check, at the gateway"
summary = "The gateway checks the token once: an expired token gets 401 from every service; a valid one reaches orders, which holds no sign-in code."
detail = """
Now the gateway checks the token once, before routing. The same expired
token is refused with 401 for catalog, cart and orders alike. A valid token
reaches the orders service, which is told who the customer is in a header.
The services hold no sign-in code at all.
"""
speech = """
Second demo: the gateway checks the token, once. [[slnc 400]] Every request passes through the gateway first. [[slnc 600]]
The expired token is refused for all three services. [[slnc 300]] The same way, every time. [[slnc 500]]
A valid token gets through. [[slnc 300]] The gateway tells the orders service who the customer is. [[slnc 500]]
The services hold no sign-in code at all.
"""
rows = { gateway = "active ok", catalog = "active ok", cart = "active ok", orders = "active ok" }
console = [
    ["expired -> all three: 401", "ok"],
    ["valid -> orders: 200", "ok"],
]

[[act]]
title = "Rate limiting"
summary = "5 requests a second per customer: of 8 requests, 5 pass and 3 are refused with 429; the orders service sees only 5."
detail = """
The gateway also limits each customer to five requests a second. A customer
sends eight in one second: five pass and three are refused with status 429,
too many requests. The orders service only ever sees five, and none of the
services had to write a rate limiter.
"""
speech = """
Third demo: rate limiting. [[slnc 400]] The gateway allows each customer five requests a second. [[slnc 600]]
A customer sends eight requests in one second. [[slnc 300]] Five pass. [[slnc 300]] Three are refused, with too many requests. [[slnc 500]]
The orders service only ever sees five. [[slnc 300]] And no service had to write a rate limiter.
"""
rows = { gateway = "active ok", orders = "active ok" }
console = [
    ["8 requests: 5 passed, 3 refused (429)", "ok"],
    ["orders saw 5", "ok"],
]

[[act]]
title = "Compression"
summary = "A 10,094-byte catalog page is gzipped at the gateway to under a fifth of its size, with no compression code in the catalog service."
detail = """
The catalog page is ten thousand bytes of JSON. For clients that accept it,
the gateway compresses the response with gzip, to under a fifth of its size.
One compressor at the gateway, instead of one in every service.
"""
speech = """
Fourth demo: compression. [[slnc 400]] The catalog page is about ten thousand bytes. [[slnc 600]]
The gateway compresses it, for every browser that accepts compression. [[slnc 300]] It shrinks to under a fifth of its size. [[slnc 500]]
One compressor at the gateway. [[slnc 300]] Not one in every service.
"""
rows = { gateway = "active ok", catalog = "active ok" }
console = [
    ["catalog: 10094 bytes plain", "muted"],
    ["gzipped: under a fifth", "ok"],
]

[[act]]
title = "The bill"
summary = "A call straight to the orders service, claiming to be ben, is answered 200: services must only be reachable through the gateway."
detail = """
The services now trust whatever the gateway tells them. So a call that goes
straight to the orders service, skipping the gateway and claiming to be
another customer, is accepted. The services must only be reachable through
the gateway. And with everything going through one place, a gateway fault
or a slow gateway hits every page at once.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] The services now trust whatever the gateway tells them. [[slnc 600]]
So a call that skips the gateway, and goes straight to the orders service claiming to be another customer, is accepted. [[slnc 600]]
The services must only be reachable through the gateway. [[slnc 500]]
And everything goes through one place. [[slnc 300]] If the gateway fails, or slows down, every page does.
"""
rows = { orders = "active wrong", gateway = "active amber" }
console = [
    ["straight to orders as ben: 200", "bad"],
    ["no side doors", "amber"],
]

[animation]
subtitle = "Every request passes the gateway, which checks sign-in, limits rates and compresses, before the services see it."
boxes = [
    ["gateway", "Gateway", "sign-in, limits, gzip"],
    ["catalog", "Catalog", "products"],
    ["cart", "Cart", "basket"],
    ["orders", "Orders", "checkout"],
]

[docs.problem]
scenario = """
Catalog, cart and orders each checked the sign-in token with their own copy
of the code.
"""
naive = """
Three copies drift apart: the orders service never checked expiry, so an
expired sign-in still worked there.
"""
deliver = [
    "Three services checking tokens themselves, one wrongly.",
    "A gateway that checks sign-in once for all.",
    "Per-customer rate limiting at the gateway.",
    "Gzip compression at the gateway.",
    "The side-door risk shown, and the single point named.",
    "Every printed result asserted by a test.",
]

[docs.prerequisites]
required = [
    "Java basics: records, interfaces, `Map`.",
    "HTTP status codes 200, 401, 404 and 429.",
]
not_required = [
    "A real HTTP server. Requests and responses are plain records.",
]

[docs.session]
objectives = [
    "Spot duplicated cross-cutting code across services.",
    "Move sign-in checks, rate limiting and compression into a gateway.",
    "Pass the checked identity on to the services.",
    "Explain why services must not be reachable around the gateway.",
]
walkthrough = """
Run `./gradlew run` and compare act one's 200 from orders with act two's 401.
Open `Gateway.handle`: four numbered steps. Then open `ShopService`: no
sign-in code at all. End on act five's side door.
"""
exercises = [
    "Add request logging to the gateway: one line per request, with the customer and status.",
    "Make the services refuse calls without a secret header only the gateway adds.",
    "Cache catalog responses at the gateway for five seconds.",
]

[docs.explained]
sentence = """
Gateway Offloading moves the chores every service needs into the gateway in
front of them, so they are done once and the same way.
"""
verdict = """
Offload generic, shared chores, such as sign-in checks, rate limits,
compression, TLS and logging, when many services need them. Keep business
rules in the services, block every side door, and run the gateway as the
critical component it now is.
"""
recognise = [
    "Gateway plugins for JWT validation, rate limiting or gzip.",
    "Services reading the caller from a header such as `X-User-Id`.",
    "TLS ending at a load balancer, with plain HTTP behind it.",
]

[spec]
purpose = """
Teach Gateway Offloading with an online store's catalog, cart and orders
services: duplicated sign-in checks with one forgetting expiry, a gateway
doing the check once, per-customer rate limiting, gzip compression, and the
side-door and single-point risks.
"""
nongoals = [
    "Not a real HTTP server or real JWTs. Requests are records and tokens are simple strings.",
]
problem = """
Every service re-implements the same cross-cutting chores, and the copies
drift apart.
"""
roles = [
    ["The pattern", "`Gateway`"],
    ["The slimmed-down services", "`ShopService`"],
    ["The old way", "`SelfCheckingService`"],
    ["Sign-in tokens", "`Tokens`"],
    ["Entry point", "`GatewayOffloadingDemo`, five acts"],
]
requirements = [
    "**One check:** the gateway refuses missing and expired tokens for every route.",
    "**Pass on identity:** services receive the customer in `X-Customer`.",
    "**Rate limit:** at most five requests per customer per second.",
    "**Every printed result is asserted** in `DemoRunsTest`.",
]

