after = { code = "group(boss, workers)", note = "100 tills, 1 event loop", tag = "AFTER" }
taglines = [["Event loops, and never block", "gold"]]

[[scene]]
key = "01-poster"
kind = "poster"
title = "Reactor with Netty"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Reactor pattern, built with Netty, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] A reactor is one thread that waits on many connections at once. [[slnc 300]] When something happens on one, it calls that connection's handler. [[slnc 500]] Netty is the open-source networking library underneath much of the Java world, and its event loops are reactors. [[slnc 600]]
Think of a restaurant with one fast waiter covering many tables, going wherever a hand is raised. [[slnc 300]] And passing any hour-long dish straight to the kitchen. [[slnc 700]]
In this video, the domain is an online shop's tills, asking a stock server short questions. [[slnc 500]]
By the end, you will hear how one event loop serves a hundred tills. [[slnc 300]] How the pipeline handles half-sent questions. [[slnc 300]] How to add more loops. [[slnc 300]] And the one rule you must never break.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["100 tills stay connected.", "", "They ask short questions:", "\"stock KETTLE-1\".", "", "A thread per till: 100 threads."]
narration = """
Here is the scenario. [[slnc 400]] A hundred shop tills stay connected to a stock server. [[slnc 500]]
They ask short questions, such as, how many kettles are in stock. [[slnc 500]]
A thread for every till meant a hundred threads, almost all of them waiting.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern, in Netty"
body = ["An event loop: one thread,", "many connections.", "", "A pipeline of handlers.", "", "Slow work: an executor group."]
narration = """
Let's name the pattern, in Netty's words. [[slnc 400]] An event loop is one thread, serving many connections. [[slnc 500]]
Each connection has a pipeline of handlers. [[slnc 500]]
And slow work runs on an executor group, away from the loop.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["Boss loop: accepts", "Worker loops: serve connections", "Line decoder: whole questions", "QuestionHandler: answers"]
narration = """
Here is who does what. [[slnc 400]] The boss loop accepts new connections. [[slnc 300]] The worker loops serve them. [[slnc 500]]
The line decoder turns bytes into whole questions. [[slnc 500]]
And the question handler answers each one.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["gRPC, WebFlux and Vert.x on Netty", "Node.js event loop", "Nginx worker processes"]
narration = """
You have probably met this already. [[slnc 400]] gRPC, Spring WebFlux, and Vert.x all run on Netty. [[slnc 500]]
Node.js has an event loop. [[slnc 300]] And Nginx runs a few worker processes, each an event loop.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Many connections, mostly idle.", "Custom protocols.", "", "Short handlers.", "Ready-made decoders.", "Never block the loop."]
narration = """
So, when should you use it? [[slnc 400]] For many connections that are mostly idle, or for your own network protocol. [[slnc 500]]
Keep handlers short. [[slnc 300]] Use ready-made decoders. [[slnc 300]] And never block the event loop.
"""

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a", "logging handler."]
narration = """
That's the Reactor, with Netty. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] One thread can serve many connections, as long as nothing it runs ever blocks. [[slnc 500]]
The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs offline, with nothing installed except a Java development kit. [[slnc 500]]
