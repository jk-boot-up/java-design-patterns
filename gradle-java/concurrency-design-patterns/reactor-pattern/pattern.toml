[[scene]]
key = "01-poster"
kind = "poster"
title = "Reactor"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Reactor pattern, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] In a reactor, one thread waits for events on many connections at once. [[slnc 300]] When something happens on a connection, the thread hands that event to a short piece of code called a handler. [[slnc 300]] No connection gets a thread of its own. [[slnc 600]]
Think of one waiter looking after a whole restaurant. [[slnc 300]] They do not stand at one table while the guests read the menu. [[slnc 300]] They watch the room, and go to whichever table raises a hand. [[slnc 700]]
In this video, the domain is an online shop's warehouse. [[slnc 300]] Its stock server has a hundred shop tills connected all day, asking short questions like: how many kettles are in stock? [[slnc 500]]
By the end, you will hear why a thread per connection wastes threads. [[slnc 300]] How a reactor serves them all with one. [[slnc 300]] How handlers work. [[slnc 300]] And the one rule you must never break.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["A warehouse stock server.", "", "100 shop tills connected all day,", "asking short questions now and then.", "", "One thread per connection."]
narration = """
Here is the scenario. [[slnc 400]] The warehouse runs a stock server. [[slnc 500]]
A hundred shop tills stay connected all day. [[slnc 300]] Now and then, each asks a short question. [[slnc 300]] How many kettles? [[slnc 300]] What does a mug cost? [[slnc 600]]
The server gave every connection its own thread.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["One thread waits on every", "connection at once: a selector.", "", "Event ready? Dispatch it", "to its handler.", "", "Handlers must be quick."]
narration = """
Let's name the pattern. [[slnc 400]] One thread waits on every connection at once. [[slnc 300]] In Java, a selector does the waiting. [[slnc 500]]
When a connection is ready, the thread dispatches the event to its handler. [[slnc 300]] A new connection, to the accept handler. [[slnc 300]] Arriving bytes, to the read handler. [[slnc 500]]
And every handler must be quick.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["Selector: which connection is ready", "Reactor: the loop and dispatch", "Accept, read: the handlers", "StockCommands: the answers", "ThreadPerConnection: the old way"]
narration = """
Here is who does what. [[slnc 400]] The selector says which connections are ready. [[slnc 500]]
The reactor runs the loop: wait, then dispatch. [[slnc 500]]
The accept handler registers new tills. [[slnc 300]] The read handler answers their questions, using stock commands. [[slnc 500]]
And thread per connection is the old way, kept for comparison.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Java NIO Selector", "Netty event loops", "Node.js, Nginx, Redis", "Spring WebFlux, Vert.x"]
narration = """
You have probably met this pattern already. [[slnc 400]] Java's NIO selector is the reactor's building block. [[slnc 500]]
Netty's event loops are reactors. [[slnc 300]] So are Node.js, Nginx, and Redis. [[slnc 500]]
And Spring WebFlux and Vert.x are built on them.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Many mostly idle connections.", "", "Keep handlers short.", "Slow work: a thread pool.", "", "A few dozen connections?", "Virtual threads are simpler."]
narration = """
So, when should you use it? [[slnc 400]] For servers with many connections that are mostly idle. [[slnc 300]] Usually through Netty, or a framework built on it. [[slnc 500]]
Keep handlers short. [[slnc 300]] Hand slow work to a thread pool. [[slnc 500]]
And for a few dozen connections, Java's virtual threads give you a thread per connection without the cost.
"""

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Hand the report", "to a thread pool."]
narration = """
That's the Reactor pattern. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] One thread watches every connection, and every handler must be quick. [[slnc 500]]
The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs offline, with nothing installed except a Java development kit. [[slnc 500]]
