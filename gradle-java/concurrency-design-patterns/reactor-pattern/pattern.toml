    "Handle a line that arrives in two pieces.",
    "Run the thread-per-connection server on virtual threads. How many platform threads does it use?",
]

[docs.explained]
sentence = """
A reactor uses one thread to wait for events on many connections at once and
dispatches each event to a short handler.
"""
verdict = """
Use a reactor, usually through Netty or a framework built on it, for servers
with many mostly idle connections. Keep handlers short and non-blocking, and
hand slow work to a thread pool. For modest numbers of connections, virtual
threads are simpler.
"""
recognise = [
    "`Selector.select()` in a loop.",
    "\"Event loop\" in a framework's documentation.",
    "Warnings not to block the event loop.",
]

[spec]
purpose = """
Teach Reactor with an online store's warehouse stock server over real
sockets: 100 tills taking 100 threads, then one NIO reactor thread with accept
and read handlers answering all 100, and a 300 ms handler delaying another
till's quick question.
"""
nongoals = [
    "Not Netty. Plain NIO shows the pattern.",
    "Not partial reads or writes in depth. Lines are short.",
]
problem = """
A thread per connection spends most threads waiting, and runs out of threads
long before it runs out of work.
"""
roles = [
    ["The pattern", "`Reactor` (selector loop, accept and read handlers)"],
    ["The work", "`StockCommands`"],
    ["The clients", "`Clients`"],
    ["The naive version", "`ThreadPerConnection`"],
    ["Entry point", "`ReactorDemo`, five acts"],
]
requirements = [
