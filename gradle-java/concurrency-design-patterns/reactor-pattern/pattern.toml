# pattern.toml for the Reactor project. See tools/patternkit.

[project]
slug = "reactor"
category = "concurrency-design-patterns"
title = "Reactor"
package = "reactor"
main_class = "ReactorDemo"
tagline = "One thread, many connections"
bold = "Let one thread wait for events on every connection at once, and hand each event to a short handler, instead of giving every connection a thread that mostly waits."
domain_note = ""
thumb_lines = ["REACTOR"]
thumb_code = "selector.select()"
youtube_title = "Reactor"
youtube_tags = ["reactor pattern", "java nio", "selector", "event loop", "concurrency", "java"]

[readme]
intro = """
Reactor is a concurrency pattern for servers with many connections. Instead
of one thread per connection, each spending most of its life waiting for the
client to say something, one thread waits for events on all connections at
once. When something happens (a new client connects, bytes arrive), an event
demultiplexer (in Java, the NIO `Selector`) says which connection is ready,
and the thread dispatches the event to its handler.

It is how Netty, Node.js, Nginx and Redis serve thousands of connections with
a handful of threads. The rule that comes with it: handlers must be quick,
because while one runs, nobody else is served.
"""
analogy = """
Think of one waiter looking after a whole restaurant. They do not stand beside
one table while its guests read the menu. They watch the room, and go to
whichever table raises a hand. One waiter can serve many tables that way, as
long as they never stop to cook a dish themselves; if they do, every table
waits.
"""
scenario = """
The online store's warehouse has a stock server that shop tills and packing
stations connect to all day, asking short questions such as "stock KETTLE-1".
The server started a new thread for every connection. With a hundred tills
connected, a hundred threads sat almost entirely idle, each holding memory,
waiting for the next question.
"""
costs = [
    "**Handlers must never block.** One 300 ms handler held up every other client in the demo.",
    "**Harder code.** Reads can arrive in pieces, and state for each connection must be kept by hand.",
    "**One core.** A single reactor thread uses one CPU core; busy servers run several reactors.",
]
too_much = """
With a few dozen connections, or with Java 21's virtual threads, a thread per
connection is simpler and performs well. Reactor pays off with thousands of
mostly idle connections, or where platform threads are expensive.
"""
met_before = [
    "Java NIO's `Selector`, `ServerSocketChannel` and `SocketChannel`.",
    "Netty's event loops, used by gRPC, Cassandra and many Java servers.",
    "Node.js's event loop, Nginx, and Redis.",
    "Spring WebFlux and Vert.x, built on reactors.",
]
where = """
This project is in [concurrency-design-patterns](..), next to
[Thread Pool](../thread-pool-pattern), which a reactor often hands its slow
work to, and [Proactor](../proactor-pattern), its asynchronous-completion
cousin.
"""

[[act]]
title = "A thread per connection"
summary = "100 tills connect and wait: 100 threads, almost all idle; the answer to stock KETTLE-1 is 4."
detail = """
`ThreadPerConnection` starts a new thread for every client. A hundred tills
connect and wait for their next question: a hundred threads, nearly all of
them idle, each holding its own stack. Till 1 asks "stock KETTLE-1" and gets
4.
"""
speech = """
First demo: a thread for every connection. [[slnc 400]] A hundred shop tills connect to the stock server. [[slnc 300]] The server starts a thread for each one. [[slnc 600]]
That is a hundred threads. [[slnc 300]] Almost all of them are idle, waiting for their till to ask something. [[slnc 300]] Each one still holds memory. [[slnc 500]]
Till one asks: how many kettles are in stock? [[slnc 300]] Four.
"""
rows = { tills = "active amber", threads = "active wrong" }
console = [
    ["100 tills: 100 threads, mostly idle", "bad"],
    ["stock KETTLE-1: 4", "ok"],
]

[[act]]
title = "One reactor thread"
summary = "The same 100 tills connect to the reactor; one thread runs every handler."
detail = """
`Reactor` uses one thread and a `Selector`. The selector waits on all hundred
connections at once and wakes the thread only when one is ready. Till 1's
question is answered, and the number of threads that ever ran a handler is
one.
"""
speech = """
Second demo: a reactor. [[slnc 400]] One thread waits on every connection at once. [[slnc 500]]
Java gives us a selector for this. [[slnc 300]] It sleeps until some connection is ready, then says which one. [[slnc 600]]
A hundred tills connect. [[slnc 300]] Till one asks about kettles: four. [[slnc 500]]
Threads running handlers: one.
"""
rows = { selector = "active ok", reactor = "active ok", tills = "active ok" }
console = [
    ["100 tills connect to the reactor", "muted"],
    ["stock KETTLE-1: 4", "ok"],
    ["threads running handlers: 1", "ok"],
]

[[act]]
title = "A handler per event"
summary = "A new connection goes to the accept handler, arriving bytes to the read handler; price MUG-1 is 800."
detail = """
The reactor's loop dispatches by event. A new connection goes to the accept
handler, which registers it for reading. Arriving bytes go to the read
handler, which answers the line. Till 2 asks "price MUG-1" and gets 800.
"""
speech = """
Third demo: each kind of event has its handler. [[slnc 400]] When a new connection arrives, the accept handler registers it, so the selector will watch it. [[slnc 500]]
When bytes arrive, the read handler answers the line. [[slnc 600]]
Till two asks the price of a mug. [[slnc 300]] Eight hundred pence.
"""
rows = { reactor = "active ok", accept = "active ok", read = "active ok" }
console = [
    ["new connection -> accept handler", "ok"],
    ["bytes arrive -> read handler", "ok"],
    ["price MUG-1: 800", "ok"],
]

[[act]]
title = "Every till, one thread"
summary = "All 100 tills ask at once: 100 correct answers, still 1 thread."
detail = """
All hundred tills send "stock MUG-1" at once. The selector reports whichever
are ready, and the one thread answers them in turn: 100 correct answers, and
still only one thread ever ran a handler.
"""
speech = """
Fourth demo: every till is answered by the one thread. [[slnc 400]] All hundred tills ask at the same moment. [[slnc 500]]
The selector reports whichever connections are ready. [[slnc 300]] The one thread answers them, one after another. [[slnc 600]]
A hundred correct answers. [[slnc 300]] Still one thread.
"""
rows = { reactor = "active ok", tills = "active ok" }
console = [
    ["100 tills ask at once", "muted"],
    ["100 correct answers", "ok"],
    ["threads running handlers: still 1", "ok"],
]

[[act]]
title = "The bill"
summary = "While till 2's 300 ms report runs, till 3's quick question waits over 200 ms."
detail = """
Till 2 asks for a report whose handler takes 300 milliseconds. Till 3 then
asks a question that takes microseconds, and waits over 200 milliseconds,
because the only thread is busy. Handlers must never block; slow work must be
handed to another thread.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] Till two asks for a report. [[slnc 300]] Its handler takes three hundred milliseconds. [[slnc 500]]
Meanwhile, till three asks a quick question. [[slnc 300]] It waits over two hundred milliseconds, for an answer that takes microseconds. [[slnc 600]]
The only thread was busy. [[slnc 300]] Like the waiter who stopped to cook. [[slnc 300]] So handlers must never block, and slow work goes to another thread.
"""
rows = { reactor = "active wrong", slow = "active wrong", tills = "active amber" }
console = [
    ["till 2: 300 ms report", "amber"],
    ["till 3's quick question: over 200 ms", "bad"],
    ["handlers must never block", "amber"],
]

