    "Record buyers in a `ConcurrentLinkedQueue`. Can stock and buyers still disagree?",
    "Replace the sold counter in FlashSale with a `LongAdder`.",
]

[docs.explained]
sentence = """
Compare-and-swap changes a value only if it still holds what the thread saw,
and otherwise retries, giving correct updates to a single value with no locks.
"""
verdict = """
Use atomic classes for single shared values: counters, stock levels, flags,
references. Prefer `updateAndGet` to hand-written loops, use `LongAdder` for
hot counters, and use a lock or transaction when several values must change
together.
"""
recognise = [
    "`AtomicInteger`, `AtomicLong`, `AtomicReference` fields.",
    "`while (true) { ... if (x.compareAndSet(a, b)) return; }` loops.",
    "`version` columns checked in database updates.",
]

[spec]
purpose = """
Teach Lock-Free Compare-and-Swap with an online store's flash sale: check-
then-act overselling 100 kettles, a lock selling exactly 100 while others
wait, a compareAndSet retry loop and getAndUpdate selling exactly 100 with no
locks, and the limit that two atomic values are not one atomic change.
"""
nongoals = [
    "Not lock-free data structures beyond a counter.",
    "Not the ABA problem in depth. It is named.",
]
problem = """
Reading a shared value and writing a new one later lets two threads act on
the same reading, so updates are lost and stock is oversold.
"""
