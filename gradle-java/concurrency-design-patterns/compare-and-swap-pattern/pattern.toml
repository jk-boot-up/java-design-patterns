[[scene]]
key = "01-poster"
kind = "poster"
title = "Lock-Free Compare-and-Swap"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Lock-Free Compare-and-Swap pattern, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] Compare-and-swap changes a shared value only if it still holds what you saw. [[slnc 300]] If someone else changed it first, you read it again, and try again. [[slnc 300]] Nobody ever waits for a lock. [[slnc 600]]
Think of booking a concert seat online. [[slnc 300]] You pick seat twelve on the map. [[slnc 300]] When you press book, it is booked only if seat twelve is still free. [[slnc 300]] If someone beat you to it, you look at the map again, and pick another. [[slnc 700]]
In this video, the domain is an online shop's flash sale. [[slnc 300]] A hundred kettles, and eight buyer threads racing to buy them. [[slnc 500]]
By the end, you will hear how a shop sells more kettles than it has. [[slnc 300]] How a lock fixes it, slowly. [[slnc 300]] How compare-and-swap fixes it without a lock. [[slnc 300]] And its limits.
"""

