# pattern.toml for the Lock-Free Compare-and-Swap project. See tools/patternkit.

[project]
slug = "compare-and-swap"
category = "concurrency-design-patterns"
title = "Lock-Free Compare-and-Swap"
package = "cas"
main_class = "CompareAndSwapDemo"
tagline = "Change it only if it hasn't changed"
bold = "Read a value, work out the new one, and swap it in only if nobody changed it in the meantime; if they did, read again and retry, with no lock at all."
youtube_description = """Lock-Free Compare-and-Swap pattern in Java, explained with an online store flash sale: a hundred kettles and eight buyer threads racing for them. Compare-and-swap changes a shared value only if it still holds what you saw, and if someone changed it first you read it again and retry, with nobody waiting on a lock, like booking a concert seat that might just have been taken. We watch the shop sell more kettles than it has, fix it slowly with a lock, then without one using compare-and-swap, and fold the retry loop into one call. We finish with its limits."""
domain_note = ""
thumb_lines = ["COMPARE", "AND SWAP"]
thumb_code = "compareAndSet(seen, seen - 1)"
youtube_title = "Lock-Free Compare-and-Swap"
youtube_tags = ["compare and swap", "cas", "atomicinteger", "lock free", "concurrency", "java"]

[readme]
intro = """
Compare-and-swap is the building block of lock-free programming. The
processor offers one indivisible instruction: "if this value is still what I
saw, replace it with this new value, and tell me whether it worked". A thread
reads the value, works out the new one, and tries the swap. If another thread
changed the value first, the swap fails and the thread simply reads again and
retries.

No thread ever waits for a lock. Java exposes it through `AtomicInteger`,
`AtomicLong`, `AtomicReference` and friends, with methods such as
`compareAndSet` and `updateAndGet`.
"""
analogy = """
Think of booking a seat for a concert online. You look at the seat map and
pick seat 12. When you press "book", the system books it only if seat 12 is
still free at that moment. If someone else booked it while you were
deciding, it says so, and you look at the map again and pick another.
Nobody is ever locked out of the map while someone else decides.
"""
scenario = """
The online store runs a flash sale: 100 kettles, and eight buyer threads each
trying to buy fifty. The stock check read the count, ran a quick fraud check,
and then wrote back the count minus one. Two buyers could read the same count
at the same moment, and the shop sold more kettles than it had.
"""
costs = [
    "**One value at a time.** Taking a kettle and recording the buyer are two atomic changes, not one; a thread that stops between them leaves stock 99 and no buyer recorded.",
    "**Spinning under contention.** When many threads fight over one value, they retry again and again, using the processor instead of waiting quietly.",
    "**Subtle bugs.** Lock-free code beyond a single counter is hard to get right; the classic trap is the ABA problem.",
]
too_much = """
When a change touches several values that must stay consistent, use a lock or
a transaction. And when contention is very high on a counter, `LongAdder`
spreads the updates out and is faster than a single atomic value.
"""
met_before = [
    "`AtomicInteger.incrementAndGet`, `compareAndSet`, `updateAndGet`.",
    "`ConcurrentHashMap` and `ConcurrentLinkedQueue`, built on compare-and-swap.",
    "Optimistic locking in databases: `UPDATE ... WHERE version = 7`.",
    "Git's refusal to push when the remote branch moved since you last pulled.",
]
where = """
This project is in [concurrency-design-patterns](..), next to
[Monitor Object](../monitor-object-pattern), the lock-based way to protect
shared state, and [Double-Checked Locking](../double-checked-locking-pattern).
"""

[[act]]
title = "Check, then act"
summary = "8 buyers, 100 kettles, no protection: more than 100 kettles sold."
detail = """
`UnsafeStock.buyOne` reads the count, runs a quick fraud check, then writes
back the count minus one. Two buyers read the same count during each other's
fraud check, and both write back the same new value: one kettle counted,
two sold. With eight buyers the shop sells more than 100 kettles from a stock
of 100.
"""
speech = """
First demo: check, then act, with no protection. [[slnc 400]] A hundred kettles. [[slnc 300]] Eight buyer threads, each trying fifty times. [[slnc 600]]
Each buyer reads the stock count, runs a quick fraud check, then writes back the count, minus one. [[slnc 500]]
Two buyers read the same count at the same moment. [[slnc 300]] Both take the same kettle. [[slnc 500]]
The shop sells more than a hundred kettles, from a stock of a hundred.
"""
rows = { buyers = "active amber", unsafe = "active wrong" }
console = [
    ["sold: more than 100, from a stock of 100", "bad"],
    ["two buyers took the same kettle", "bad"],
]

[[act]]
title = "A lock"
summary = "With a lock, exactly 100 are sold and 0 are left, but every other buyer waits in line."
detail = """
`LockedStock.buyOne` is `synchronized`: only one buyer at a time may look and
take. Exactly 100 kettles are sold and none are left. It is correct, but every
other buyer waits in line during each fraud check.
"""
speech = """
Second demo: a lock, one buyer at a time. [[slnc 400]] Only the buyer holding the lock may look at the stock and take a kettle. [[slnc 500]]
Exactly a hundred kettles sold. [[slnc 300]] None left. [[slnc 500]]
Correct. [[slnc 300]] But every other buyer waits in line while one checks.
"""
rows = { buyers = "active amber", locked = "active ok" }
console = [
    ["kettles sold: 100; left: 0", "ok"],
    ["everyone else waits in line", "amber"],
]

[[act]]
title = "Compare-and-swap"
summary = "A compareAndSet loop sells exactly 100 with no locks; a buyer who lost a race just looked again."
detail = """
`CasStock.buyOne` reads the count, runs the fraud check, then calls
`compareAndSet(seen, seen - 1)`: take one only if the count is still what it
saw. If another buyer got there first, the swap fails and the buyer reads
again. Exactly 100 are sold, none left, and no thread ever waited for a lock.
"""
speech = """
Third demo: compare-and-swap. [[slnc 400]] Each buyer reads the count, and runs the fraud check. [[slnc 300]] Then it says: take one, but only if the count is still what I saw. [[slnc 600]]
The processor does that in one indivisible step. [[slnc 500]]
If another buyer got there first, the swap fails. [[slnc 300]] The buyer simply reads the count again, and retries. [[slnc 500]]
Exactly a hundred sold. [[slnc 300]] None left. [[slnc 300]] And no thread ever waited for a lock.
"""
rows = { buyers = "active ok", cas = "active ok" }
console = [
    ["kettles sold: 100; left: 0", "ok"],
    ["no locks; losers look again", "ok"],
]

[[act]]
title = "The loop in one call"
summary = "getAndUpdate(s -> s > 0 ? s - 1 : s) sells 100 and leaves 0."
detail = """
Java's atomic classes hide the retry loop: `getAndUpdate` takes a function
from old value to new, and retries the compare-and-swap for you. The flash
sale again sells exactly 100.
"""
speech = """
Fourth demo: the loop in one call. [[slnc 400]] Java's atomic integer has a method, get and update. [[slnc 300]] You give it a rule: if there is stock, take one. [[slnc 500]]
It runs the compare-and-swap, and retries it for you. [[slnc 500]]
A hundred sold. [[slnc 300]] None left.
"""
rows = { cas = "active ok" }
console = [
    ["getAndUpdate(s -> s > 0 ? s - 1 : s)", "muted"],
    ["sold 100, left 0", "ok"],
]

[[act]]
title = "The bill"
summary = "Take a kettle, then stop before recording the buyer: stock 99, buyers 0. Two atomic values are not one atomic change."
detail = """
Compare-and-swap protects one value. Taking a kettle and recording the buyer
are two separate atomic values; a thread that stops between them leaves stock
at 99 and no buyer recorded. And under heavy contention, threads spin
retrying instead of waiting quietly.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] Compare-and-swap protects one value at a time. [[slnc 500]]
A buyer takes a kettle. [[slnc 300]] Then its thread stops, before it records who bought it. [[slnc 500]]
Stock says ninety-nine. [[slnc 300]] Buyers recorded: zero. [[slnc 300]] Two atomic values are not one atomic change. [[slnc 600]]
And when many threads fight over one value, they keep retrying, instead of waiting quietly.
"""
rows = { cas = "active amber" }
console = [
    ["stock 99, buyers recorded 0", "bad"],
    ["heavy contention: threads spin", "amber"],
]

