kind = "bullets"
title = "The Scenario"
body = ["A flash sale: 100 kettles.", "", "8 buyer threads, each trying", "to buy 50.", "", "Read the count, check for fraud,", "write the count minus one."]
narration = """
Here is the scenario. [[slnc 400]] A flash sale: a hundred kettles. [[slnc 500]]
Eight buyer threads, each trying to buy fifty. [[slnc 500]]
To buy one, a thread reads the stock count, runs a quick fraud check, and then writes back the count, minus one.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["Read the value.", "Work out the new one.", "Swap it in only if it is unchanged.", "", "Swap failed? Read again, retry.", "", "No locks."]
narration = """
Let's name the pattern. [[slnc 400]] Read the value. [[slnc 300]] Work out the new value. [[slnc 500]]
Then swap it in, but only if the value is still what you read. [[slnc 300]] The processor does that check and change as one indivisible step. [[slnc 500]]
If the swap fails, someone else changed it. [[slnc 300]] Read again, and retry.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["AtomicInteger: the shared count", "compareAndSet: swap if unchanged", "CasStock: the retry loop", "UnsafeStock, LockedStock:", "the alternatives"]
narration = """
Here is who does what. [[slnc 400]] An atomic integer holds the shared stock count. [[slnc 500]]
Compare and set is the indivisible step: swap if unchanged. [[slnc 500]]
CAS stock runs the retry loop. [[slnc 500]]
And unsafe stock and locked stock are the alternatives, kept for comparison.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["AtomicInteger, AtomicReference", "ConcurrentHashMap", "UPDATE ... WHERE version = 7", "git push, rejected"]
narration = """
You have probably met this pattern already. [[slnc 400]] Java's atomic integer, atomic long, and atomic reference. [[slnc 300]] And the concurrent hash map, which is built on them. [[slnc 500]]
Databases do the same with a version column: update the row, only if its version is still seven. [[slnc 500]]
And git refuses your push if the branch moved since you last pulled.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["One shared value: counters,", "stock, flags, references.", "", "Prefer updateAndGet.", "Hot counters: LongAdder.", "", "Several values together? A lock."]
narration = """
So, when should you use it? [[slnc 400]] For one shared value at a time: counters, stock levels, flags, references. [[slnc 500]]
Prefer update and get, rather than writing your own loop. [[slnc 300]] For very busy counters, use long adder. [[slnc 500]]
And when several values must change together, use a lock, or a database transaction.
"""

