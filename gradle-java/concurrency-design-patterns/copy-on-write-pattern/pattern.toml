# pattern.toml for the Copy-on-Write project. See tools/patternkit.

[project]
slug = "copy-on-write"
category = "concurrency-design-patterns"
title = "Copy-on-Write"
package = "copyonwrite"
main_class = "CopyOnWriteDemo"
tagline = "Read freely, copy to change"
bold = "Let readers use the current copy with no locks at all, and make every writer copy the whole thing, change the copy, and swap it in."
domain_note = ""
thumb_lines = ["COPY-ON-WRITE"]
thumb_code = "CopyOnWriteArrayList"
youtube_title = "Copy-on-Write"
youtube_tags = ["copy on write", "CopyOnWriteArrayList", "concurrency", "lock free reads", "java"]

[readme]
intro = """
Copy-on-Write is a concurrency pattern for data that is read far more often
than it changes. Readers use the current version directly, with no locks. A
writer never changes that version: it copies it, changes the copy, and
replaces the current version with the copy in one step. A reader half way
through the old version carries on undisturbed, and the next reader sees the
new one.

Java's `CopyOnWriteArrayList` and `CopyOnWriteArraySet` work this way, and
they are the usual home for lists of listeners.
"""
analogy = """
Think of a restaurant's printed menus. Diners read them at their tables, as
long as they like. To change a dish, the manager does not cross it out on the
menus in people's hands; they print a whole new batch and swap them in at the
door. Diners already reading finish with the old menu; new diners get the new
one. Reprinting for every small change is expensive, so it suits menus that
rarely change.
"""
scenario = """
When a product's price changes, the online store tells a list of listeners:
the web page cache, the loyalty service, the phone app. Prices change
constantly; the list of listeners rarely does. The list was a plain
`ArrayList`, and when the loyalty service subscribed the email service while
being told about a price change, the notification loop crashed half way.
"""
costs = [
    "**Every write copies everything.** Adding 10,000 listeners one by one copied almost 50 million references.",
    "**Readers may see an old version.** A reader that started before a change finishes with the old list.",
    "**Writers wait for each other.** Writes are serialised by a lock.",
]
too_much = """
For data that changes often, such as a shopping basket or an order queue,
copying on every write is far too costly: use a concurrent collection or a
lock instead. Copy-on-write is for small collections that are read constantly
and changed rarely.
"""
met_before = [
    "`java.util.concurrent.CopyOnWriteArrayList` and `CopyOnWriteArraySet`.",
    "Listener and observer lists in Swing, Spring and many libraries.",
    "Linux's `fork()`, which shares memory between processes until one writes to it.",
    "Snapshots in file systems such as ZFS and Btrfs.",
]
where = """
This project is in [concurrency-design-patterns](..), next to
[Read-Write Lock](../read-write-lock-pattern), which also favours readers but
makes them take a lock, and near
[Immutable Object](../../foundational-design-patterns/immutable-object-pattern),
the idea copy-on-write is built on.
"""

[[act]]
title = "A plain list, changed while read"
summary = "The loyalty service subscribes the email service mid-notification: ConcurrentModificationException; the phone app never hears."
detail = """
The listeners are kept in a plain `ArrayList`. The kettle's price changes and
the loop starts telling each listener. The loyalty service, when told,
subscribes the email service, which adds to the list being looped over. The
loop throws `ConcurrentModificationException` after the web page cache and
the loyalty service, and the phone app never hears the new price.
"""
speech = """
First demo: a plain list, changed while it is being read. [[slnc 400]] The kettle's price changes. [[slnc 300]] The shop tells each listener in turn. [[slnc 500]]
The web page cache hears it. [[slnc 300]] The loyalty service hears it, and subscribes the email service, adding to the list as it goes. [[slnc 600]]
The loop crashes, with a concurrent modification exception. [[slnc 300]] The phone app never hears about the new price.
"""
rows = { plain = "active wrong", loyalty = "active amber", app = "active wrong" }
console = [
    ["loyalty subscribes email mid-loop", "amber"],
    ["ConcurrentModificationException", "bad"],
    ["the phone app never heard", "bad"],
]

[[act]]
title = "A copy-on-write list"
summary = "The same thing with a copy-on-write list: all 3 listeners hear the first change, all 4 hear the next."
detail = """
`CowList` keeps its listeners in an array that is never changed once
published. The loop reads the current array; the loyalty service's
subscription copies the array, adds the email service, and swaps the copy in.
All three original listeners hear the first change, and all four hear the
next one.
"""
speech = """
Second demo: a copy-on-write list. [[slnc 400]] The same thing happens. [[slnc 300]] The loyalty service subscribes the email service while being told. [[slnc 500]]
This time, the loop is reading an array that nobody will ever change. [[slnc 300]] The new subscription copies the array, adds to the copy, and swaps it in. [[slnc 600]]
The first change reaches all three listeners. [[slnc 300]] The next change reaches all four.
"""
rows = { cow = "active ok", loyalty = "active ok", app = "active ok", email = "active ok" }
console = [
    ["first change: web cache, loyalty, app", "ok"],
    ["next change: + email service", "ok"],
]

[[act]]
title = "Readers never lock"
summary = "100,000 notification passes while another thread subscribes and unsubscribes 1,000 times: 0 failures, 0 reader locks."
detail = """
One thread runs a hundred thousand notification passes over the list while
another subscribes and unsubscribes a thousand times. Readers never take a
lock and never see a half-changed list: zero failures.
"""
speech = """
Third demo: readers never lock, and are never disturbed. [[slnc 400]] One thread tells the listeners about prices, a hundred thousand times. [[slnc 300]] At the same moment, another thread subscribes and unsubscribes, a thousand times. [[slnc 600]]
Failures: zero. [[slnc 300]] Locks taken by the readers: zero.
"""
rows = { cow = "active ok", readers = "active ok", writer = "active amber" }
console = [
    ["100,000 passes, 1,000 changes", "muted"],
    ["failures: 0; reader locks: 0", "ok"],
]

[[act]]
title = "Snapshots"
summary = "A reader started with 3 listeners; a fourth was added; the reader finishes with 3."
detail = """
A reader starts going through the list when it has three listeners. A fourth
is added before it finishes. The reader completes its pass over the three it
started with; the next reader will see four.
"""
speech = """
Fourth demo: each reader sees a snapshot. [[slnc 400]] A reader starts going through the list. [[slnc 300]] It has three listeners. [[slnc 500]]
Before it finishes, a fourth is added. [[slnc 500]]
The reader finishes with the three it started with. [[slnc 300]] Like a diner with the old menu. [[slnc 300]] The next reader sees four.
"""
rows = { cow = "active ok", readers = "active amber" }
console = [
    ["reader started with 3 listeners", "muted"],
    ["the list now has 4", "amber"],
]

[[act]]
title = "The bill"
summary = "Adding 10,000 listeners one at a time copies 49,995,000 references."
detail = """
Every write copies the whole array. Adding ten thousand listeners one at a
time copied 49,995,000 references in total. That is fine for a list read
constantly and changed rarely, and wrong for anything that changes all the
time.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] Every write copies everything. [[slnc 500]]
Add ten thousand listeners, one at a time. [[slnc 300]] Nearly fifty million references are copied along the way. [[slnc 600]]
That is fine for a list that is read constantly and changed rarely. [[slnc 300]] It is wrong for anything that changes all the time.
"""
rows = { cow = "active amber", writer = "active wrong" }
console = [
    ["10,000 adds: 49,995,000 copies", "bad"],
    ["for lists that rarely change", "amber"],
]

