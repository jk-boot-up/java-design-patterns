[docs.session]
objectives = [
    "Explain why changing a list while iterating it fails.",
    "Describe copy, change, swap.",
    "Explain why readers need no lock.",
    "Decide when copying on every write is too costly.",
]
walkthrough = """
Run `./gradlew run` and read act one: a subscription during a notification
crashes the loop. Open `CowList`: `add` copies, `iterator` takes the array as
it is. Then show that Java's `CopyOnWriteArrayList` does the same, and end on
act five's copy count.
"""
exercises = [
    "Replace CowList with `CopyOnWriteArrayList` and run the demo again.",
    "Add `addAll` that copies once for many listeners. How many copies does act five need now?",
    "Try act three with a `Collections.synchronizedList`. What happens to the readers?",
]

[docs.explained]
sentence = """
Copy-on-write lets readers use the current version with no locks and makes
every writer copy it, change the copy and swap it in.
"""
verdict = """
Use copy-on-write for small collections that are read constantly and changed
rarely, above all lists of listeners. Use `CopyOnWriteArrayList` rather than
writing your own, and choose something else for data that changes often.
"""
recognise = [
    "`CopyOnWriteArrayList` or `CopyOnWriteArraySet` fields named `listeners` or `subscribers`.",
    "A `volatile` array or list replaced whole on every change.",
    "Iteration with no locks over shared data.",
]

[spec]
purpose = """
Teach Copy-on-Write with an online store's price-change listeners: an
ArrayList crashing when a listener subscribes another mid-notification, then
a copy-on-write list that survives it, readers with no locks under concurrent
changes, snapshots, and 49,995,000 references copied for 10,000 adds.
"""
nongoals = [
    "Not a replacement for CopyOnWriteArrayList. The hand-written list shows how it works.",
    "Not benchmarks. Copies are counted, not timed.",
]
problem = """
A list read constantly and changed occasionally, sometimes during a read,
fails with a plain collection and slows readers with a locked one.
"""
roles = [
    ["The pattern", "`CowList`"],
    ["The listeners", "`PriceListener`"],
    ["The naive version", "`ArrayList` in act one"],
    ["Entry point", "`CopyOnWriteDemo`, five acts"],
]
requirements = [
    "**No reader locks:** iteration takes the published array.",
    "**Copy, change, swap:** writes never change a published array.",
    "**Snapshots:** an iterator sees the list as it was when it started.",
    "**Counted cost:** copies are counted.",
    "**Every printed result is asserted** in `DemoRunsTest`.",
]

