[[scene]]
key = "01-poster"
kind = "poster"
title = "Copy-on-Write"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Copy-on-Write pattern, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] With copy-on-write, readers use the current version of the data, with no locks at all. [[slnc 300]] A writer never changes that version. [[slnc 300]] It makes a copy, changes the copy, and swaps it in. [[slnc 600]]
Think of a restaurant's printed menus. [[slnc 300]] Diners read them for as long as they like. [[slnc 300]] To change a dish, the manager prints a whole new batch, and swaps them in at the door. [[slnc 300]] Diners already reading finish with the old menu. [[slnc 700]]
In this video, the domain is an online shop. [[slnc 300]] When a price changes, it tells a list of listeners: the web page cache, the loyalty service, and the phone app. [[slnc 500]]
By the end, you will hear how a plain list crashes when it changes while being read. [[slnc 300]] How copy-on-write fixes it. [[slnc 300]] Why readers never lock. [[slnc 300]] And what every write costs.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["A price changes: tell every listener.", "", "Prices change all the time.", "Listeners rarely change.", "", "Listeners were in a plain ArrayList."]
narration = """
Here is the scenario. [[slnc 400]] When a price changes, the shop tells every listener on a list. [[slnc 500]]
Prices change all the time. [[slnc 300]] The list of listeners rarely changes. [[slnc 300]] But sometimes a listener adds another, while it is being told. [[slnc 500]]
The listeners were kept in a plain array list.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["Readers: take the current array,", "no lock.", "", "Writers: copy it, change the copy,", "swap it in.", "", "A published array never changes."]
narration = """
Let's name the pattern. [[slnc 400]] Readers take the current array, and read it with no lock. [[slnc 500]]
Writers copy the array, change the copy, and swap it in, in one step. [[slnc 500]]
The rule that makes it safe: once an array is published, nobody ever changes it again.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["CowList: the array and the swap", "PriceListener: who is told", "The notification loop: a reader", "Subscribe: a writer", "ArrayList: the old way"]
narration = """
Here is who does what. [[slnc 400]] Cow list holds the array, and swaps in new copies. [[slnc 500]]
A price listener is anyone who wants to be told about price changes. [[slnc 500]]
The notification loop is a reader. [[slnc 300]] Subscribing is a write. [[slnc 500]]
And the plain array list is the old way, kept for comparison.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["CopyOnWriteArrayList", "Listener lists in Swing and Spring", "fork() in Linux", "File system snapshots"]
narration = """
You have probably met this pattern already. [[slnc 400]] Java's copy on write array list, and copy on write array set. [[slnc 500]]
Listener lists in Swing, Spring, and many libraries use them. [[slnc 500]]
Linux shares memory between processes until one writes to it. [[slnc 300]] And file systems use the same trick for snapshots.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Small collections, read constantly,", "changed rarely: listeners.", "", "Use CopyOnWriteArrayList.", "", "Changes often? Something else."]
narration = """
So, when should you use it? [[slnc 400]] For small collections that are read constantly, and changed rarely. [[slnc 300]] Lists of listeners are the classic case. [[slnc 500]]
Use Java's copy on write array list, rather than writing your own. [[slnc 500]]
And for data that changes often, choose a concurrent collection, or a lock.
"""

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Swap in", "CopyOnWriteArrayList."]
narration = """
That's the Copy-on-Write pattern. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Readers read freely, and writers copy, change, and swap. [[slnc 500]]
The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs offline, with nothing installed except a Java development kit. [[slnc 500]]
