# pattern.toml for the Leader/Followers project. See tools/patternkit.

[project]
slug = "leader-followers"
category = "concurrency-design-patterns"
title = "Leader/Followers"
package = "leaderfollowers"
main_class = "LeaderFollowersDemo"
tagline = "Take turns, no hand-offs"
bold = "Let a pool of threads take turns: one leader waits for the next message, hands leadership to a follower as soon as it gets one, and then handles that message itself."
youtube_description = """Leader Followers pattern in Java: the threads take turns: one leader waits for the next message, hands leadership to another thread, then handles that message itself, like the front taxi at a rank driving off as the next one moves up. Explained with an online store order service handling a stream of order messages with a pool of threads. We compare it with a dispatcher that hands work off, walk through receive, promote and handle, and show every thread doing useful work. We finish with the bill, including why message order is not kept."""
domain_note = ""
thumb_lines = ["LEADER", "FOLLOWERS"]
thumb_code = "lock(); take(); unlock(); handle()"
youtube_title = "Leader/Followers"
youtube_tags = ["leader followers", "concurrency patterns", "thread pool", "java locks", "java"]

[readme]
intro = """
Leader/Followers is a concurrency pattern for a pool of threads that handles
incoming messages. At any moment one thread is the leader and waits for the
next message; the others are followers, waiting to become leader. When the
leader receives a message, it passes leadership to a follower straight away,
and then handles the message itself.

There is no separate dispatcher thread and no second queue: the thread that
received a message is the thread that handles it. That saves a hand-off
between threads for every message, which matters in very high-throughput
servers.
"""
analogy = """
Think of a taxi rank. The taxi at the front waits for the next passenger.
When someone gets in, that taxi drives off with them, and the next taxi moves
up to the front to wait. Nobody stands at the rank handing passengers from one
car to another; the car that picks you up is the car that takes you home.
"""
scenario = """
The online store's order service receives a stream of order messages. A
dispatcher thread received each message and passed it through a second queue
to one of four workers. Every message changed threads once, and the dispatcher
itself handled no orders at all.
"""
costs = [
    "**Order is not kept.** A \"place order\" received first finished after a \"cancel\" received second, because they ran on two threads.",
    "**Subtle to write.** Getting the hand-over of leadership right needs careful locking.",
    "**Small gains in Java.** A hand-off between threads is cheap in modern JVMs; the pattern mainly pays off in very high-throughput servers.",
]
too_much = """
For most Java applications, an `ExecutorService` (a dispatcher with a queue)
is simpler and fast enough. And when messages for the same order must be
handled in order, route them to the same thread instead.
"""
met_before = [
    "High-performance C++ servers built with ACE and TAO, where the pattern was described.",
    "Netty's and other event loops where several threads take turns on a shared selector.",
    "Several threads calling `accept()` on the same server socket.",
]
where = """
This project is in [concurrency-design-patterns](..), next to
[Half-Sync/Half-Async](../half-sync-half-async-pattern), which does the
opposite, handing every message across a queue, and
[Thread Pool](../thread-pool-pattern).
"""

[[act]]
title = "A dispatcher that hands off"
summary = "1 dispatcher + 4 workers: 20 hand-offs between threads, 0 orders handled by the thread that received them."
detail = """
`DispatcherWorkers` has one dispatcher thread that takes each message from
the source and puts it on a second queue for four workers. Twenty orders mean
twenty hand-offs between threads; none is handled by the thread that
received it, and the dispatcher handles no orders itself.
"""
speech = """
First demo: a dispatcher receives every message, and hands it to a worker. [[slnc 400]] One dispatcher thread, and four workers. [[slnc 500]]
The dispatcher takes each order message, and passes it through a second queue to a worker. [[slnc 600]]
Twenty orders. [[slnc 300]] Twenty hand-offs between threads. [[slnc 300]] And the dispatcher itself handled no orders at all.
"""
rows = { source = "active ok", dispatcher = "active amber", workers = "active ok" }
console = [
    ["5 threads: 1 dispatcher + 4 workers", "muted"],
    ["hand-offs between threads: 20", "amber"],
    ["the dispatcher handled 0 orders", "amber"],
]

[[act]]
title = "Leader and followers"
summary = "4 threads and no dispatcher handle 20 orders; only 1 thread ever waits for a message at a time."
detail = """
`LeaderFollowers` has four pool threads and no dispatcher. Leadership is a
lock: the thread holding it is the leader and waits on the source; the
others wait for the lock. The count of threads waiting on the source at once
never goes above one.
"""
speech = """
Second demo: leader and followers. [[slnc 400]] Four threads, and no dispatcher. [[slnc 500]]
At any moment, one thread is the leader. [[slnc 300]] Only the leader waits for the next message. [[slnc 300]] The others are followers, waiting their turn to lead. [[slnc 600]]
Twenty orders are handled. [[slnc 300]] And never more than one thread waits for a message at the same moment.
"""
rows = { source = "active ok", leader = "active ok", followers = "active amber" }
console = [
    ["4 threads, no dispatcher", "ok"],
    ["20 orders handled", "ok"],
    ["waiting for a message at once: 1", "ok"],
]

[[act]]
title = "Receive, promote, handle"
summary = "Leadership passes 20 times, once per order; 20 of 20 orders are handled by the thread that received them."
detail = """
Each leader takes a message, releases the lock (promoting a follower to
leader), and then handles the message itself. Leadership passes twenty times,
once per order, and all twenty are handled by the thread that received them:
zero hand-offs.
"""
speech = """
Third demo: receive, promote a follower, then handle. [[slnc 400]] The leader takes a message. [[slnc 300]] At once, it passes leadership to a follower. [[slnc 300]] Then it handles the message itself. [[slnc 600]]
Leadership passes twenty times, once per order. [[slnc 300]] Every order is handled by the thread that received it. [[slnc 300]] Zero hand-offs.
"""
rows = { leader = "active ok", followers = "active ok" }
console = [
    ["leadership passed on 20 times", "ok"],
    ["same thread: 20 of 20", "ok"],
    ["hand-offs: 0", "ok"],
]

[[act]]
title = "Every thread works"
summary = "All 20 orders are handled by several pool threads; none sits as a pure dispatcher."
detail = """
All twenty orders are handled by pool threads, spread across several of them.
No thread spends its life only receiving and passing on.
"""
speech = """
Fourth demo: every thread in the pool does real work. [[slnc 400]] The twenty orders were handled by several different pool threads. [[slnc 500]]
None of them sat as a pure dispatcher, only receiving and passing on.
"""
rows = { leader = "active ok", followers = "active ok" }
console = [
    ["20 orders, several threads", "ok"],
    ["no pure dispatcher", "ok"],
]

[[act]]
title = "The bill"
summary = "\"Place\" then \"cancel\" for ORD-1 finish as cancel first, place second."
detail = """
Two messages for the same order arrive in order: "place" (80 ms of work),
then "cancel" (5 ms). The first leader takes "place" and promotes a follower,
which takes "cancel" and finishes first. The order of arrival is not the
order of completion; messages that must stay in order need to go to the same
thread.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] Two messages for the same order arrive: place the order, then cancel it. [[slnc 600]]
The first leader takes place order, and promotes a follower. [[slnc 300]] The follower takes cancel, which is quicker. [[slnc 500]]
Cancel finishes first. [[slnc 300]] Then place. [[slnc 600]]
Messages that must stay in order need to go to the same thread.
"""
rows = { leader = "active wrong", followers = "active wrong" }
console = [
    ["received: place, then cancel", "muted"],
    ["finished: cancel, then place", "bad"],
]

