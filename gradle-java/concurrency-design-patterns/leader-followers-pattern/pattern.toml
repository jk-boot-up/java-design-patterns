[[scene]]
key = "01-poster"
kind = "poster"
title = "Leader/Followers"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Leader Followers pattern, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] A pool of threads takes turns. [[slnc 300]] One thread, the leader, waits for the next message. [[slnc 300]] When it gets one, it hands leadership to another thread, and then handles that message itself. [[slnc 600]]
Think of a taxi rank. [[slnc 300]] The taxi at the front waits for a passenger. [[slnc 300]] When someone gets in, it drives off, and the next taxi moves up. [[slnc 300]] The car that picks you up is the car that takes you home. [[slnc 700]]
In this video, the domain is an online shop's order service. [[slnc 300]] It receives a stream of order messages, and a pool of threads handles them. [[slnc 500]]
By the end, you will hear what a dispatcher costs. [[slnc 300]] How leader and followers take turns. [[slnc 300]] How leadership passes on. [[slnc 300]] And why order is not kept.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["A stream of order messages.", "", "A dispatcher thread received each", "and handed it to one of 4 workers."]
narration = """
Here is the scenario. [[slnc 400]] The order service receives a stream of order messages. [[slnc 500]]
A dispatcher thread received each message. [[slnc 300]] Then it passed it, through a second queue, to one of four worker threads.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["One leader waits for a message.", "Followers wait to lead.", "", "Receive -> promote a follower", "-> handle it yourself."]
narration = """
Let's name the pattern. [[slnc 400]] One thread is the leader. [[slnc 300]] Only it waits for the next message. [[slnc 500]]
The other threads are followers. [[slnc 300]] They wait to become leader. [[slnc 500]]
When the leader receives a message, it promotes a follower, and then handles the message itself.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["LeaderFollowers: the pool", "leadership: a lock", "source: the incoming messages", "Record: who received, who handled", "DispatcherWorkers: the old way"]
narration = """
Here is who does what. [[slnc 400]] Leader followers is the pool of threads. [[slnc 500]]
Leadership is a lock. [[slnc 300]] The thread holding it is the leader. [[slnc 500]]
The source is the queue of incoming messages. [[slnc 300]] Record notes who received each message, and who handled it. [[slnc 500]]
And dispatcher workers is the old way, kept for comparison.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["High-performance C++ servers", "Threads taking turns on a selector", "Several threads calling accept()"]
narration = """
You have probably met this pattern in fast servers. [[slnc 400]] It was described for high-performance C++ servers. [[slnc 500]]
Some event loops let several threads take turns on the same selector. [[slnc 500]]
And several threads calling accept on the same server socket are, in effect, taking turns as leader.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Very high throughput, where a", "hand-off per message counts.", "", "Most apps: an ExecutorService.", "", "Order matters? Same thread."]
narration = """
So, when should you use it? [[slnc 400]] In very high-throughput servers, where a hand-off per message is a real cost. [[slnc 500]]
For most applications, a plain executor service is simpler, and fast enough. [[slnc 500]]
And either way, messages that must stay in order should go to the same thread.
"""

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Keep place and cancel", "in order."]
narration = """
