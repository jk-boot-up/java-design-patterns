"""
exercises = [
    "Route messages for the same order to the same thread, and show place finishes before cancel.",
    "Count how many orders each pool thread handled. Is it even?",
    "Replace the lock with a Semaphore of one permit.",
]

[docs.explained]
sentence = """
Leader/Followers lets a pool of threads take turns: the leader waits for a
message, promotes a follower, and handles the message itself, with no
dispatcher and no hand-off.
"""
verdict = """
Use it in very high-throughput servers where a hand-off per message is a
measurable cost. For most applications, an ExecutorService is simpler. Either
way, keep messages that must stay in order on the same thread.
"""
recognise = [
    "A lock or semaphore guarding the wait for the next event, released before handling it.",
    "Several threads calling `select()` or `accept()` in turn.",
    "No dispatcher thread and no hand-off queue in a pool.",
]

[spec]
purpose = """
Teach Leader/Followers with an online store's order messages: a dispatcher
handing off all 20, then a four-thread pool where only one thread waits at a
time, leadership passes 20 times, every order is handled by the thread that
received it, and place and cancel finish out of order.
"""
nongoals = [
    "Not networking. The source is a BlockingQueue.",
    "Not performance measurement. Hand-offs are counted, not timed.",
]
problem = """
A dispatcher that receives every message and hands it to another thread adds
a hand-off per message and a thread that does no real work.
"""
roles = [
    ["The pattern", "`LeaderFollowers`"],
    ["The messages", "`Message`"],
    ["What happened", "`Record`"],
    ["The naive version", "`DispatcherWorkers`"],
    ["Entry point", "`LeaderFollowersDemo`, five acts"],
]
requirements = [
    "**One waiter:** only the leader waits on the source, asserted.",
    "**No hand-off:** the receiving thread handles the message, 20 of 20.",
    "**Honest cost:** out-of-order completion shown.",
    "**Every printed result is asserted** in `DemoRunsTest`.",
]

