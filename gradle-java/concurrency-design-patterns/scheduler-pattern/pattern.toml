[docs.session]
objectives = [
    "Explain why a lock alone cannot choose who goes next.",
    "Build a scheduler around a lock, a condition and a policy.",
    "Swap policies.",
    "Prevent starvation with ageing.",
]
walkthrough = """
Run `./gradlew run` and read act one's print order aloud. Open
