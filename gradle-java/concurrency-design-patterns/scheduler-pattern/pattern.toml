# pattern.toml for the Scheduler project. See tools/patternkit.

[project]
slug = "scheduler"
category = "concurrency-design-patterns"
title = "Scheduler"
package = "scheduler"
main_class = "SchedulerDemo"
tagline = "A policy decides who goes next"
bold = "When threads queue for one shared resource, let a scheduler with a replaceable policy decide whose turn is next, instead of whoever happens to grab the lock."
youtube_description = """Scheduler pattern in Java: when many threads wait for one shared resource, a scheduler decides whose turn is next by a policy that can be swapped without touching anything else, like a triage nurse deciding by urgency. Explained with an online store warehouse where six packing stations share one label printer and express orders must catch the afternoon van. We see why a fair lock serves the wrong job first, put express orders first, make the policy replaceable, and make sure nobody waits forever. We finish with the bill."""
domain_note = ""
thumb_lines = ["SCHEDULER"]
thumb_code = "scheduler.enter(job)"
youtube_title = "Scheduler"
youtube_tags = ["scheduler pattern", "concurrency patterns", "priority", "starvation", "java"]

[readme]
intro = """
Scheduler is a concurrency pattern for a shared resource that only one thread
can use at a time, when the order of use matters. Each thread asks the
scheduler for its turn and waits. When the resource becomes free, the
scheduler's policy (express first, smallest first, oldest first) picks which
waiting thread goes next.

The policy lives in one place and can be swapped without touching the threads
or the resource. Because priority rules can leave some threads waiting for
ever, a good scheduler also ages long-waiting requests so everyone is served
eventually.
"""
analogy = """
Think of the triage nurse in a hospital's emergency department. Patients are
not seen in the order they walked in. The nurse decides who goes next, by how
urgent each case is. And a patient with a sprained wrist who has watched ten
urgent cases go ahead is eventually moved up, so nobody waits all night.
"""
scenario = """
The online store's warehouse has one label printer shared by six packing
stations. Express orders must catch the afternoon van. The printer was
protected by a fair lock, which serves jobs in the order they arrived, so
express labels waited behind every standard label that arrived first.
"""
costs = [
    "**Someone has to decide, every time.** Each job takes the scheduler's lock, joins its list, and is woken to check whether it is next.",
    "**Starvation.** Express-first alone printed a standard job last during an express rush; ageing is needed to prevent it.",
    "**One more moving part.** The policy is simple to swap but easy to get subtly wrong.",
]
too_much = """
When the order of use does not matter, a plain lock or a fair lock is simpler.
And when work can be queued rather than waited for, a priority queue in front
of a worker thread does the same job with less machinery.
"""
met_before = [
    "Operating system CPU schedulers and I/O schedulers.",
    "`PriorityBlockingQueue` feeding a worker thread.",
    "Print queues, and job schedulers in build servers.",
    "Kubernetes pod priority and preemption.",
]
where = """
This project is in [concurrency-design-patterns](..), next to
[Monitor Object](../monitor-object-pattern), which guards a resource without
deciding the order, and
[Producer-Consumer](../producer-consumer-pattern).
"""

[[act]]
title = "A fair lock"
summary = "Jobs print in arrival order: STD-1, STD-2, STD-3, then EXP-1, EXP-2, EXP-3; express waits behind every standard job."
detail = """
A bulk job is printing. Three standard jobs arrive, then three express ones.
The printer is guarded by a fair `ReentrantLock`, which serves strictly in
arrival order: STD-1, STD-2, STD-3, EXP-1, EXP-2, EXP-3. The express labels
wait behind every standard one.
"""
speech = """
First demo: a fair lock, first come, first served. [[slnc 400]] The printer is busy with a bulk job. [[slnc 300]] Three standard jobs arrive. [[slnc 300]] Then three express jobs. [[slnc 600]]
The lock serves them in the order they arrived. [[slnc 300]] Standard one, two, three. [[slnc 300]] Then express one, two, three. [[slnc 500]]
The express orders waited behind every standard order, and may miss the van.
"""
rows = { printer = "active amber", fair = "active wrong" }
console = [
    ["printed: STD-1, STD-2, STD-3,", "bad"],
    ["         EXP-1, EXP-2, EXP-3", "bad"],
]

[[act]]
title = "Express first"
summary = "A scheduler with an express-first policy prints EXP-1, EXP-2, EXP-3, then STD-1, STD-2, STD-3."
detail = """
Each station now calls `scheduler.enter(job)`, which waits until the printer
is free and the policy picks that job. With `EXPRESS_FIRST`, the order is
EXP-1, EXP-2, EXP-3, then STD-1, STD-2, STD-3.
"""
speech = """
Second demo: a scheduler, with an express-first policy. [[slnc 400]] Each station asks the scheduler for its turn, and waits. [[slnc 500]]
When the printer is free, the policy chooses who goes next. [[slnc 600]]
Express one, two, three. [[slnc 300]] Then standard one, two, three.
"""
rows = { printer = "active ok", scheduler = "active ok", policy = "active ok" }
console = [
    ["printed: EXP-1, EXP-2, EXP-3,", "ok"],
    ["         STD-1, STD-2, STD-3", "ok"],
]

[[act]]
title = "A replaceable policy"
summary = "Swapping in smallest-first prints STD-2, EXP-2, STD-3, EXP-3, EXP-1, STD-1; nothing else changed."
detail = """
The policy is a comparator. Swapping `EXPRESS_FIRST` for `SMALLEST_FIRST`
prints the jobs with the fewest labels first: STD-2, EXP-2, STD-3, EXP-3,
EXP-1, STD-1. The stations and the printer did not change.
"""
speech = """
Third demo: the policy is replaceable. [[slnc 400]] Swap in a different rule: smallest job first. [[slnc 500]]
The jobs with the fewest labels print first, whatever their type. [[slnc 500]]
One line changed. [[slnc 300]] The stations and the printer did not.
"""
rows = { scheduler = "active ok", policy = "active amber" }
console = [
    ["smallest first:", "muted"],
    ["STD-2, EXP-2, STD-3, EXP-3, EXP-1, STD-1", "ok"],
]

[[act]]
title = "Nobody waits for ever"
summary = "In an express rush, express-first prints STD-1 last; promoting after 3 passes prints it fourth."
detail = """
One standard job arrives, then five express ones. With express-first alone,
the standard job is printed last, and in a longer rush it would never be
printed. With ageing, a job overtaken three times is promoted: STD-1 prints
fourth, after EXP-3.
"""
speech = """
Fourth demo: nobody waits for ever. [[slnc 400]] One standard job arrives. [[slnc 300]] Then a rush of five express jobs. [[slnc 600]]
With express first alone, the standard job goes last. [[slnc 300]] In a longer rush, it would never print. [[slnc 500]]
Now add a rule: a job overtaken three times moves to the front. [[slnc 300]] The standard job prints fourth.
"""
rows = { scheduler = "active ok", policy = "active ok" }
console = [
    ["express only: STD-1 printed last", "bad"],
    ["promote after 3: STD-1 printed 4th", "ok"],
]

[[act]]
title = "The bill"
summary = "Every job takes the scheduler's lock, joins its list and is woken to check; every priority rule needs a starvation guard."
detail = """
Deciding costs something every time: each job takes the scheduler's lock,
joins its list, and is woken to check whether it is next. And every priority
rule needs a guard against starving the jobs it does not favour.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] Someone has to decide, every time. [[slnc 300]] Each job takes the scheduler's lock, joins its list, and is woken to check whether it is next. [[slnc 600]]
And every priority rule needs a guard, so the jobs it does not favour are never starved.
"""
rows = { scheduler = "active amber" }
console = [
    ["lock, list, wake, check: every job", "amber"],
    ["every priority needs a guard", "amber"],
]

