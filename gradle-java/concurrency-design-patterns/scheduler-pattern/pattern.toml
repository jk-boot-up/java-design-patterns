show that the two policies are one-line comparators. End on act four's two
orders side by side.
"""
exercises = [
    "Add a policy: oldest first, but express jobs count as 30 seconds older.",
    "Give each job a deadline and print the one closest to its deadline first.",
    "Replace the scheduler with a `PriorityBlockingQueue` and one printing thread. What changes for the stations?",
]

[docs.explained]
sentence = """
A scheduler makes threads ask for their turn at a shared resource and lets a
replaceable policy decide whose turn comes next.
"""
verdict = """
Use a scheduler when the order of access to a shared resource matters and may
change. Keep the policy in one comparator, add ageing so nobody starves, and
prefer a priority queue and worker when callers need not wait.
"""
recognise = [
    "`enter`/`leave` or `acquire`/`release` methods around a condition and a list of waiters.",
    "Comparators named for a policy: `EXPRESS_FIRST`, `SHORTEST_JOB_FIRST`.",
    "Ageing or promotion counters on waiting jobs.",
]

[spec]
purpose = """
Teach Scheduler with an online store's shared label printer: a fair lock
printing express jobs last, then a scheduler with express-first and
smallest-first policies, starvation during an express rush prevented by
promoting a job overtaken three times.
"""
nongoals = [
    "Not real printers. Printing is a short sleep.",
    "Not operating system scheduling.",
]
problem = """
A lock decides who uses a shared resource by who arrives or grabs it first,
not by what matters to the business.
"""
roles = [
