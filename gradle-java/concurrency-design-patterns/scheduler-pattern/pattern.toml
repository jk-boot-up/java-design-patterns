[[scene]]
key = "01-poster"
kind = "poster"
title = "Scheduler"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Scheduler pattern, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] When many threads wait for one shared resource, a scheduler decides whose turn comes next. [[slnc 300]] It follows a policy, such as most urgent first. [[slnc 300]] And the policy can be swapped, without touching anything else. [[slnc 600]]
Think of the triage nurse in a hospital's emergency department. [[slnc 300]] Patients are not seen in the order they walked in. [[slnc 300]] The nurse decides, by urgency. [[slnc 300]] And someone who has waited a very long time is eventually moved up. [[slnc 700]]
In this video, the domain is an online shop's warehouse. [[slnc 300]] Six packing stations share one label printer. [[slnc 300]] Express orders must catch the afternoon van. [[slnc 500]]
By the end, you will hear why a lock alone serves the wrong job first. [[slnc 300]] How a scheduler fixes it. [[slnc 300]] How to swap the policy. [[slnc 300]] And how to make sure nobody waits for ever.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["One label printer.", "Six packing stations.", "", "Express orders must catch", "the afternoon van.", "", "A fair lock guarded the printer."]
narration = """
Here is the scenario. [[slnc 400]] The warehouse has one label printer, and six packing stations. [[slnc 500]]
Some orders are express, and must catch the afternoon van. [[slnc 500]]
The printer was guarded by a fair lock. [[slnc 300]] A fair lock serves whoever arrived first.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["Threads ask the scheduler for a turn.", "", "When the resource is free,", "the policy picks who is next.", "", "Age long waiters so nobody", "starves."]
narration = """
Let's name the pattern. [[slnc 400]] Each thread asks the scheduler for its turn, and waits. [[slnc 500]]
When the resource is free, the policy picks who goes next. [[slnc 300]] The policy is a simple rule, kept in one place. [[slnc 500]]
And long waiters are aged, so nobody is starved.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["Scheduler: enter, done, the waiting list", "Policy: a comparator", "PrintJob: express or not, size, age", "Printer: the shared resource", "Fair lock: the old way"]
narration = """
Here is who does what. [[slnc 400]] The scheduler keeps the waiting list. [[slnc 300]] Stations call enter, and done. [[slnc 500]]
The policy is a comparator: express first, or smallest first. [[slnc 500]]
A print job knows if it is express, how many labels it has, and how often it has been overtaken. [[slnc 500]]
The printer is the shared resource. [[slnc 300]] And the fair lock is the old way, kept for comparison.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Operating system CPU schedulers", "PriorityBlockingQueue + a worker", "Print queues, build servers", "Kubernetes pod priority"]
narration = """
You have probably met this pattern already. [[slnc 400]] Your operating system schedules which program runs on the processor next. [[slnc 500]]
A priority blocking queue in front of one worker thread does the same job. [[slnc 500]]
Print queues and build servers schedule their jobs. [[slnc 300]] And Kubernetes schedules containers by priority.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["The order of access matters,", "and may change.", "", "Policy in one comparator.", "Age long waiters.", "", "Callers need not wait? A priority queue."]
narration = """
So, when should you use it? [[slnc 400]] When the order of access to a shared resource matters, and may change. [[slnc 500]]
Keep the policy in one comparator. [[slnc 300]] Age long waiters, so nobody starves. [[slnc 500]]
And when callers do not need to wait for their turn, a priority queue and one worker thread is simpler.
"""

