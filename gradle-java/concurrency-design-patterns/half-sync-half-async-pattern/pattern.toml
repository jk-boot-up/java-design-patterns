[[scene]]
key = "01-poster"
kind = "poster"
title = "Half-Sync/Half-Async"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Half-Sync, Half-Async pattern, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] The work is split in two halves, joined by a queue. [[slnc 300]] A fast half accepts events and only queues them. [[slnc 300]] A slow half of ordinary worker threads takes them from the queue, and does the blocking work, step by step. [[slnc 600]]
Think of a busy restaurant. [[slnc 300]] The host at the door writes each order on a ticket, and pins it to the rail. [[slnc 300]] The cooks take tickets from the rail, one at a time. [[slnc 300]] If the host tried to cook as well, the queue at the door would stretch down the street. [[slnc 700]]
In this video, the domain is an online shop. [[slnc 300]] Orders arrive in bursts, and each one needs a tenth of a second of slow work: save it, charge the card, and send an email. [[slnc 500]]
By the end, you will hear why the receiving thread must never block. [[slnc 300]] How the two halves work. [[slnc 300]] How the queue absorbs a burst. [[slnc 300]] And what a full queue costs.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["Orders arrive on an event thread,", "sometimes 20 at once.", "", "Each needs 100 ms:", "save, charge, email."]
narration = """
Here is the scenario. [[slnc 400]] Orders arrive on one event thread. [[slnc 300]] Sometimes twenty at once. [[slnc 600]]
Each order needs a tenth of a second of slow, blocking work. [[slnc 300]] Save it to the database. [[slnc 300]] Charge the card. [[slnc 300]] Send the confirmation email.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["Async half: accept and queue.", "Never block.", "", "Queue: bounded, in the middle.", "", "Sync half: plain worker threads,", "plain blocking code."]
narration = """
Let's name the pattern. [[slnc 400]] The async half accepts each event and puts it in a queue. [[slnc 300]] It never blocks. [[slnc 500]]
The queue sits in the middle, with a limit. [[slnc 500]]
The sync half is a few ordinary worker threads. [[slnc 300]] Each takes an event from the queue, and runs plain, step-by-step, blocking code.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["burst(): the async half", "ArrayBlockingQueue: the rail", "workLoop(): the sync half", "OrderWork: save, charge, email", "EventThreadOnly: the old way"]
narration = """
Here is who does what. [[slnc 400]] The burst method is the async half: it only offers orders to the queue. [[slnc 500]]
An array blocking queue is the ticket rail, with a limit. [[slnc 500]]
The work loop is the sync half: take an order, and process it. [[slnc 300]] Order work holds the three slow steps. [[slnc 500]]
And event thread only is the old way, kept for comparison.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Event loop + worker pool", "ExecutorService + BlockingQueue", "API + background job queue", "Interrupts + kernel threads"]
narration = """
You have probably met this pattern already. [[slnc 400]] Web servers often have an event loop that hands requests to a pool of worker threads. [[slnc 500]]
Java's executor services are a queue and worker threads. [[slnc 500]]
A web A P I that drops jobs onto a queue for background workers is the same shape. [[slnc 300]] So is the way an operating system handles hardware interrupts.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Events on a thread that must", "stay responsive; blocking work", "behind them.", "", "Tiny async half. Bounded queue.", "Plain workers. A full-queue plan."]
narration = """
So, when should you use it? [[slnc 400]] Whenever events arrive on a thread that must stay responsive, and the work behind them blocks. [[slnc 500]]
Keep the async half tiny. [[slnc 300]] Put a limit on the queue. [[slnc 300]] Decide what happens when it is full. [[slnc 300]] And keep the worker code plain.
"""

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
