subtitle = "The event thread only queues orders; four plain worker threads take them and do the slow, blocking work."
boxes = [
    ["orders", "Order burst", "20 at once"],
    ["event", "Event thread", "async half: accept, queue"],
    ["queue", "Queue", "the ticket rail"],
    ["workers", "4 workers", "sync half: save, charge, email"],
]

[docs.problem]
scenario = """
Orders arrive in bursts on an event thread; each needs 100 ms of blocking
work.
"""
naive = """
`EventThreadOnly` does the blocking work on the event thread, so it cannot
accept the next order until the previous one is finished.
"""
deliver = [
    "The acceptance delay shown with blocking work on the event thread.",
    "An async half that only queues, accepting every order within 0.1 s.",
    "A sync half of plain worker threads finishing the burst in under 1 s.",
    "A bounded queue turning orders away when workers stall.",
    "Every printed result asserted by a test.",
]

[docs.prerequisites]
required = [
    "Java basics: threads, `ExecutorService` at a beginner level.",
    "What a queue is.",
]
not_required = [
    "Networking. Arrivals are submitted to an executor.",
]

[docs.session]
objectives = [
    "Explain why an event thread must never block.",
    "Separate accepting from processing with a queue.",
    "Write plain blocking workers for the sync half.",
    "Choose a queue limit and a full-queue policy.",
]
walkthrough = """
Run `./gradlew run` and compare act one's acceptance delay with act two's.
Open `HalfSyncHalfAsync`: `burst` is the async half, `workLoop` the sync half,
and the `ArrayBlockingQueue` joins them. End on act five and ask what a real
shop should do with the orders it turned away.
"""
exercises = [
    "Instead of turning orders away, save them to a file and retry later.",
    "Change the number of workers from 4 to 1 and 8. What happens to the total time?",
    "Replace the worker threads with virtual threads. What changes, and what stays?",
]

[docs.explained]
sentence = """
Half-Sync/Half-Async splits a system into a non-blocking half that accepts and
queues events and a blocking half of plain workers that process them, joined
by a bounded queue.
"""
verdict = """
Use it whenever events arrive on a thread that must stay responsive and the
work behind them blocks. Keep the async half tiny, bound the queue, decide
what happens when it is full, and keep the worker code plain.
"""
recognise = [
    "An event loop or listener that only submits work to an executor.",
    "`BlockingQueue` between a receiver and worker threads.",
    "\"Background workers\" consuming from a job queue.",
]

[spec]
purpose = """
Teach Half-Sync/Half-Async with an online store's order burst: blocking work
on the event thread delaying acceptance over 1.5 s, then an async half that
only queues (every order accepted within 0.1 s), four plain workers finishing
all 20 in under 1 s, a queue absorbing the burst, and a bounded queue turning
10 of 20 away when workers stall.
"""
nongoals = [
    "Not networking or persistence. Work is simulated with sleeps.",
    "Not retry policies. They are an exercise.",
]
problem = """
Doing blocking work on the thread that receives events stops it receiving
more, so later events wait just to be acknowledged.
"""
roles = [
    ["The pattern", "`HalfSyncHalfAsync` (burst = async half, workLoop = sync half)"],
    ["The work", "`OrderWork`"],
    ["The naive version", "`EventThreadOnly`"],
    ["Entry point", "`HalfSyncHalfAsyncDemo`, five acts"],
]
requirements = [
    "**Fast accept:** the async half never blocks.",
    "**Plain workers:** the sync half runs step-by-step blocking code.",
    "**Bounded queue:** a full queue turns orders away, counted.",
    "**Every printed result is asserted** in `DemoRunsTest`.",
]

