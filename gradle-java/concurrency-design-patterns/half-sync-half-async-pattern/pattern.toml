# pattern.toml for the Half-Sync/Half-Async project. See tools/patternkit.

[project]
slug = "half-sync-half-async"
category = "concurrency-design-patterns"
title = "Half-Sync/Half-Async"
package = "halfsync"
main_class = "HalfSyncHalfAsyncDemo"
tagline = "Accept fast, work slowly, queue between"
bold = "Split the work in two: a fast asynchronous half that only accepts events and queues them, and a synchronous half of plain threads that take from the queue and do the slow, blocking work."
youtube_description = """Half-Sync, Half-Async pattern in Java: the work is split into two halves joined by a queue: a fast half only accepts and queues events, and a slow half of ordinary worker threads does the blocking work, like a restaurant host pinning tickets for the cooks. Explained with an online store where orders arrive in bursts and each needs slow work: save it, charge the card, send an email. We watch blocking work stall the event thread, then build the async half and the sync half, and let the queue absorb a burst. We finish with the bill, including a full queue."""
domain_note = ""
thumb_lines = ["HALF-SYNC", "HALF-ASYNC"]
thumb_code = "queue.offer(order)"
youtube_title = "Half-Sync/Half-Async"
youtube_tags = ["half sync half async", "concurrency patterns", "blocking queue", "worker threads", "java"]

[readme]
intro = """
Half-Sync/Half-Async is a concurrency pattern that splits a system into two
layers joined by a queue. The asynchronous half receives events (new orders,
network messages) on a thread that must never block; all it does is put each
event in the queue. The synchronous half is a small group of ordinary worker
threads that take events from the queue and run plain, step-by-step, blocking
code.

The event thread stays responsive under any load, the business code stays
simple to read, and the queue in the middle absorbs bursts.
"""
analogy = """
Think of a busy restaurant. The host at the door does one quick job: greet,
write the order on a ticket, and pin it to the rail. The cooks in the kitchen
take tickets from the rail one at a time and cook each dish step by step. If
the host tried to cook as well, the queue at the door would stretch down the
street. And when the rail is full, the host has to say: sorry, we are full.
"""
scenario = """
The online store receives order notifications on an event thread. Each order
then needs 100 milliseconds of blocking work: save it, charge the card, send
the email. The event thread did that work itself, so during a burst of twenty
orders it could not even accept the next one, and the last order waited over
a second and a half just to be acknowledged.
"""
costs = [
    "**A full queue must say no.** With stalled workers and a queue of 10, 10 of 20 orders were turned away; every queue needs a limit and a plan.",
    "**Two kinds of code.** The async half and the sync half follow different rules, and developers must know which side they are on.",
    "**Queued work can be lost.** Orders in an in-memory queue vanish if the process stops; real systems persist them.",
]
too_much = """
When events are few, or the work is already quick and non-blocking, one layer
is simpler. And with Java 21's virtual threads, giving each event its own
virtual thread achieves much of the same with plain code, though a bounded
queue is still the simplest way to limit load.
"""
met_before = [
    "Web servers whose event loop hands requests to a worker thread pool.",
    "`ExecutorService` with a `BlockingQueue`: a direct implementation.",
    "Message queues between a front-end API and background workers.",
    "Operating systems: interrupt handlers (async) queue work for kernel threads (sync).",
]
where = """
This project is in [concurrency-design-patterns](..), next to
[Producer-Consumer](../producer-consumer-pattern), the queue at its heart, and
[Reactor](../reactor-pattern), a common asynchronous half.
"""

[[act]]
title = "Blocking work on the event thread"
summary = "20 orders arrive at once; the event thread does each 100 ms job itself; the last order waits over 1.5 s to be accepted."
detail = """
`EventThreadOnly` receives orders on a single event thread and processes each
one there: save, charge, email, 100 milliseconds. Twenty orders arrive in a
burst. Each must wait for every order before it to be fully processed, so the
last is not even accepted until over 1.5 seconds later.
"""
speech = """
First demo: the event thread does every order's blocking work itself. [[slnc 400]] Twenty orders arrive at once. [[slnc 300]] Each needs a tenth of a second: save it, charge the card, send the email. [[slnc 600]]
The event thread takes the first order, and does all its work. [[slnc 300]] Only then can it even accept the second. [[slnc 500]]
The last order waits over a second and a half, just to be accepted.
"""
rows = { event = "active wrong", orders = "active amber" }
console = [
    ["20 orders, 100 ms of work each", "muted"],
    ["last accepted after over 1.5 s", "bad"],
]

[[act]]
title = "The async half"
summary = "The event thread only queues: every order is accepted within 0.1 s."
detail = """
`HalfSyncHalfAsync.burst` keeps the event thread's job tiny: offer the order
to a queue. Every one of the twenty orders is accepted within a tenth of a
second, and the event thread is free again at once.
"""
speech = """
Second demo: the async half only accepts, and queues. [[slnc 400]] The event thread now does one quick job. [[slnc 300]] It puts each order in a queue. [[slnc 600]]
All twenty orders are accepted within a tenth of a second. [[slnc 300]] The event thread is free again, at once.
"""
rows = { event = "active ok", queue = "active ok" }
console = [
    ["every order accepted within 0.1 s", "ok"],
    ["the event thread is free at once", "ok"],
]

[[act]]
title = "The sync half"
summary = "4 worker threads take orders and run save, charge, email in order: all 20 done in under 1 s."
detail = """
Four ordinary worker threads loop: take an order from the queue, then save,
charge and email it, one step after another, in plain blocking code. All
twenty orders are done in under a second.
"""
speech = """
Third demo: the sync half. [[slnc 400]] Four ordinary worker threads each take an order from the queue. [[slnc 300]] Then they save it, charge the card, and send the email, one step after another. [[slnc 600]]
Plain, simple, blocking code. [[slnc 300]] Easy to read, easy to debug. [[slnc 500]]
All twenty orders are done in under a second.
"""
rows = { queue = "active ok", workers = "active ok" }
console = [
    ["4 workers: save, charge, email", "ok"],
    ["all 20 orders done in under 1 s", "ok"],
]

[[act]]
title = "The queue absorbs the burst"
summary = "At the busiest moment the queue held 10 or more orders; the event thread never waited for a card payment."
detail = """
During the burst the queue held ten or more orders waiting for a free worker.
That is its job: the event thread never waited for a card payment, only the
workers did.
"""
speech = """
Fourth demo: the queue in the middle absorbs the burst. [[slnc 400]] At the busiest moment, ten or more orders were waiting in the queue for a worker. [[slnc 600]]
That is what the queue is for. [[slnc 300]] The event thread never waited for a card payment. [[slnc 300]] Only the workers did.
"""
rows = { queue = "active amber", event = "active ok", workers = "active ok" }
console = [
    ["queue peak: 10 or more orders", "amber"],
    ["event thread never waited", "ok"],
]

[[act]]
title = "The bill"
summary = "With the workers stalled and a queue of 10, 10 of 20 orders are turned away."
detail = """
If the card provider is down, the workers stall and the queue fills. With a
queue of ten, ten of twenty orders are turned away. Every queue needs a
limit, and a plan for what happens beyond it: reject, retry later, or save to
disk.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] The card provider goes down, and the workers stall. [[slnc 300]] The queue fills up. [[slnc 600]]
The queue holds ten orders. [[slnc 300]] Ten of the twenty are turned away. [[slnc 500]]
Every queue needs a limit, and a plan for what happens when it is full.
"""
rows = { queue = "active wrong", workers = "active wrong" }
console = [
    ["workers stalled, queue of 10", "amber"],
    ["10 of 20 orders turned away", "bad"],
]

