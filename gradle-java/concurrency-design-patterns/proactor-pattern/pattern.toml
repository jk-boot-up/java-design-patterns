# pattern.toml for the Proactor project. See tools/patternkit.

[project]
slug = "proactor"
category = "concurrency-design-patterns"
title = "Proactor"
package = "proactor"
main_class = "ProactorDemo"
tagline = "Start it all, get called back"
bold = "Start slow operations without waiting for them, and give each one a completion handler that the system calls when it finishes, successfully or not."
youtube_description = """Proactor pattern in Java, explained with an online store warehouse that asks five suppliers for today's kettle price, each taking a fifth of a second to answer. You start slow operations without waiting, hand each a completion handler for success and failure, and the system does the waiting and calls you back, like buzzers at a food court. We watch asking one after another add up, start everything at once, handle results in completion handlers, and treat a failure as just another completion. We finish with the bill."""
domain_note = ""
thumb_lines = ["PROACTOR"]
thumb_code = "CompletionHandler"
youtube_title = "Proactor"
youtube_tags = ["proactor pattern", "asynchronous io", "completion handler", "java nio2", "concurrency", "java"]

[readme]
intro = """
Proactor is a concurrency pattern for slow input and output, such as network
calls. Instead of starting an operation and waiting for it, the program starts
it and hands over a completion handler: a small object that says what to do
when the operation finishes, and what to do if it fails. The system does the
waiting and calls the handler when the result is ready.

Many operations can then be in flight at once from a single caller, and their
waiting overlaps. Java's asynchronous channels (`AsynchronousSocketChannel`,
`AsynchronousFileChannel`) and `CompletionHandler` are a direct
implementation.
"""
analogy = """
Think of a food court with a buzzer at every stall. You order at five stalls,
one after another, and each hands you a buzzer. You do not queue at a stall
until your dish is cooked. You sit down, and as each buzzer goes off, you go
and collect that dish. If one stall runs out of what you ordered, its buzzer
goes off too, and they tell you.
"""
scenario = """
The online store's warehouse buys kettles from five suppliers. Before each
order it asks all five for today's price and picks the cheapest. Each supplier
takes 0.2 seconds to answer, and the warehouse asked them one after another,
waiting for each answer before asking the next: over a second every time.
"""
costs = [
    "**One request, several callbacks.** Connect, write and read each finish in a different handler; the steps no longer read top to bottom.",
    "**Harder debugging.** Stack traces start in the system's threads, not in the code that started the work.",
    "**Shared results.** Handlers run on other threads, so results must be collected safely.",
]
too_much = """
When operations are few, fast or must happen in order, plain blocking calls
are clearer. And in modern Java, virtual threads let you write blocking code
that waits just as cheaply; `CompletableFuture` or a reactive library gives a
friendlier face to the same idea.
"""
met_before = [
    "`AsynchronousSocketChannel` and `CompletionHandler` in Java NIO.2.",
    "`HttpClient.sendAsync` and `CompletableFuture.thenAccept`.",
    "Windows I/O completion ports and Linux io_uring, which the pattern is named after.",
    "Callbacks in JavaScript's Node.js file and network APIs.",
]
where = """
This project is in [concurrency-design-patterns](..), next to
[Reactor](../reactor-pattern), which is told when an operation *can* be done;
a proactor is told when it *has been* done.
"""

[[act]]
title = "One after another"
summary = "Five suppliers at 0.2 s each, asked in turn: 5 prices in over 0.9 s, the asking thread blocked throughout."
detail = """
`BlockingQuotes` opens a connection to each supplier, sends "price KETTLE-1",
and waits for the answer before moving on. Each supplier takes 0.2 seconds, so
five prices take over 0.9 seconds, and the asking thread does nothing else
the whole time.
"""
speech = """
First demo: ask five suppliers for a kettle price, one after another. [[slnc 400]] Each supplier takes a fifth of a second to answer. [[slnc 500]]
The warehouse asks the first, and waits. [[slnc 300]] Then the second, and waits. [[slnc 300]] And so on. [[slnc 600]]
Five prices take nearly a second. [[slnc 300]] And the asking thread does nothing else, the whole time.
"""
rows = { caller = "active wrong", s1 = "active amber" }
console = [
    ["5 prices in over 0.9 s", "bad"],
    ["the asking thread only waited", "bad"],
]

[[act]]
title = "Start everything at once"
summary = "All 5 requests start and start() returns in under 0.1 s; all 5 answers arrive in under 0.6 s."
detail = """
`ProactorQuotes.start` opens an asynchronous channel to each supplier and
calls `connect` with a completion handler. It does not wait: all five are
started, and `start` returns, in under a tenth of a second. The system does the
waiting, the five 0.2 second waits overlap, and all answers arrive in under
0.6 seconds.
"""
speech = """
Second demo: a proactor. [[slnc 400]] The warehouse starts all five requests at once. [[slnc 300]] For each, it hands over a completion handler: what to do when that request finishes. [[slnc 600]]
It does not wait. [[slnc 300]] All five are started, and the method returns, in under a tenth of a second. [[slnc 500]]
The system does the waiting. [[slnc 300]] The five waits overlap. [[slnc 300]] All five answers arrive in under six tenths of a second.
"""
rows = { caller = "active ok", s1 = "active ok", s2 = "active ok", s3 = "active ok" }
console = [
    ["5 requests started in under 0.1 s", "ok"],
    ["5 answers in under 0.6 s", "ok"],
]

[[act]]
title = "Completion handlers"
summary = "The read handlers record £21.00, £19.50, £22.40, £18.90 and £20.10; the cheapest is £18.90."
detail = """
Each request is a chain of three handlers: `Connected` sends the question,
`Written` starts reading the answer, `Read` records the price. The five read
handlers record £21.00, £19.50, £22.40, £18.90 and £20.10, and the warehouse
picks the cheapest, £18.90.
"""
speech = """
Third demo: completion handlers receive the results. [[slnc 400]] When a connection is made, one handler sends the question. [[slnc 300]] When the question is sent, another starts reading. [[slnc 300]] When the answer arrives, a third records the price. [[slnc 600]]
Twenty-one pounds. [[slnc 200]] Nineteen fifty. [[slnc 200]] Twenty-two forty. [[slnc 200]] Eighteen ninety. [[slnc 200]] Twenty ten. [[slnc 500]]
The cheapest is eighteen pounds ninety.
"""
rows = { handlers = "active ok" }
console = [
    ["£21.00  £19.50  £22.40  £18.90  £20.10", "ok"],
    ["cheapest: £18.90", "ok"],
]

[[act]]
title = "A failure is a completion"
summary = "Supplier 6 is down: its failed() handler runs; the other 2 answer as normal."
detail = """
A sixth supplier is down. Its connect cannot complete, so the system calls
that request's `failed` handler instead of `completed`. It is recorded as a
failure, and the other two requests in the batch answer as normal. No
try-catch surrounds the call that started them.
"""
speech = """
Fourth demo: a failure arrives as a completion too. [[slnc 400]] A sixth supplier's server is down. [[slnc 500]]
Its request cannot connect. [[slnc 300]] So the system calls that request's failed handler, instead of its completed handler. [[slnc 600]]
The failure is recorded. [[slnc 300]] The other two suppliers answer as normal. [[slnc 300]] Like a buzzer that goes off to say: sorry, sold out.
"""
rows = { handlers = "active amber", s6 = "active wrong" }
console = [
    ["supplier 6 down: failed() handler ran", "amber"],
    ["the other 2 answered as normal", "ok"],
]

[[act]]
title = "The bill"
summary = "One request is spread across Connected, Written and Read handlers; the steps no longer read top to bottom."
detail = """
One request is now three handlers: `Connected.completed` writes,
`Written.completed` reads, `Read.completed` records. The steps no longer read
top to bottom in one method, and a stack trace from a handler starts in the
system's thread, not in the code that asked.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] One request is now spread across three handlers. [[slnc 300]] Connected. [[slnc 200]] Written. [[slnc 200]] Read. [[slnc 600]]
The steps no longer read top to bottom in one method. [[slnc 300]] And when something goes wrong, the error starts in the system's thread, not in the code that asked.
"""
rows = { handlers = "active amber" }
console = [
    ["Connected -> Written -> Read", "amber"],
    ["no longer top to bottom", "amber"],
]

[animation]
subtitle = "The warehouse starts every supplier request at once; the system calls each request's completion handler when it finishes."
boxes = [
    ["caller", "Warehouse", "starts the requests"],
    ["s1", "Supplier 1", "0.2 s"],
    ["s2", "Supplier 2", "0.2 s"],
    ["s3", "Suppliers 3-5", "0.2 s each"],
    ["s6", "Supplier 6", "down"],
    ["handlers", "Completion handlers", "Connected, Written, Read"],
]

[docs.problem]
scenario = """
The warehouse asks five suppliers for a price before each order; each takes
0.2 seconds to answer.
"""
naive = """
`BlockingQuotes` asks one supplier at a time and waits for each answer: over
0.9 seconds, with the thread doing nothing else.
"""
deliver = [
    "Sequential blocking asks shown taking over 0.9 s.",
    "Asynchronous channels started at once, returning in under 0.1 s.",
    "Completion handlers recording each price; the cheapest chosen.",
    "A down supplier reported through failed().",
    "Every printed result asserted by a test, over real sockets.",
]

[docs.prerequisites]
required = [
    "Java basics: classes, interfaces, inner classes.",
    "What a socket connection is.",
]
not_required = [
    "Reactive libraries. Plain `AsynchronousSocketChannel` is used.",
]

[docs.session]
objectives = [
    "Explain initiating an operation versus waiting for it.",
    "Write completed and failed handlers.",
    "Chain handlers for connect, write and read.",
    "Compare Proactor with Reactor.",
]
walkthrough = """
Run `./gradlew run` and compare the times in acts one and two. Open
`ProactorQuotes`: `start` only starts. Follow one request through
`Connected`, `Written` and `Read`. End with act four: the failure path is a
handler too.
"""
exercises = [
    "Add a timeout: a supplier that takes more than 0.5 s counts as failed.",
    "Rewrite `ProactorQuotes` with `HttpClient.sendAsync` and `CompletableFuture`. What disappears?",
    "Rewrite `BlockingQuotes` with one virtual thread per supplier. Compare the time and the code.",
]

[docs.explained]
sentence = """
A proactor starts slow operations without waiting and lets the system call a
completion handler, or a failure handler, when each finishes.
"""
verdict = """
Use a proactor, or the futures and reactive libraries built on the idea, when
many slow operations can overlap. Keep handlers short, collect results safely,
and consider virtual threads when readable, top-to-bottom code matters more.
"""
recognise = [
    "`CompletionHandler` with `completed` and `failed` methods.",
    "`sendAsync`, `thenAccept`, `whenComplete`.",
    "Callbacks passed to I/O calls.",
]

[spec]
purpose = """
Teach Proactor with an online store's supplier price checks over real sockets:
five blocking asks taking over 0.9 s, then asynchronous channels with
Connected, Written and Read completion handlers answering in under 0.6 s,
the cheapest of five prices, and a down supplier reported through failed().
"""
nongoals = [
    "Not CompletableFuture or reactive streams. Named as friendlier forms.",
    "Not timeouts. They are an exercise.",
]
problem = """
Asking several slow services one after another adds their waits together and
keeps a thread doing nothing.
"""
roles = [
    ["The pattern", "`ProactorQuotes` with `Connected`, `Written`, `Read`"],
    ["The slow services", "`Supplier`"],
    ["The naive version", "`BlockingQuotes`"],
    ["Entry point", "`ProactorDemo`, five acts"],
]
requirements = [
    "**Real sockets:** every price is fetched over localhost.",
    "**Start without waiting:** `start` returns in under 0.1 s.",
    "**Overlapping waits:** five answers in well under five waits.",
    "**Failures as completions:** a down supplier reaches `failed`.",
    "**Every printed result is asserted** in `DemoRunsTest`.",
]

