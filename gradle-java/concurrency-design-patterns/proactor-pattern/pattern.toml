[[scene]]
key = "01-poster"
kind = "poster"
title = "Proactor"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Proactor pattern, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] In a proactor, you start slow operations without waiting for them. [[slnc 300]] With each one, you hand over a completion handler: what to do when it finishes, and what to do if it fails. [[slnc 300]] The system does the waiting, and calls you back. [[slnc 600]]
Think of a food court with a buzzer at every stall. [[slnc 300]] You order at five stalls, and each gives you a buzzer. [[slnc 300]] You sit down. [[slnc 300]] As each buzzer goes off, you collect that dish. [[slnc 700]]
In this video, the domain is an online shop's warehouse. [[slnc 300]] Before ordering kettles, it asks five suppliers for today's price, and each takes a fifth of a second to answer. [[slnc 500]]
By the end, you will hear why asking one after another is slow. [[slnc 300]] How a proactor overlaps the waits. [[slnc 300]] How failures are reported. [[slnc 300]] And what it costs.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["Five kettle suppliers.", "Each takes 0.2 s to answer", "\"what is today's price?\"", "", "The warehouse asked them", "one after another."]
narration = """
Here is the scenario. [[slnc 400]] The warehouse buys kettles from five suppliers. [[slnc 500]]
Before each order, it asks all five: what is today's price? [[slnc 300]] Then it picks the cheapest. [[slnc 500]]
Each supplier takes a fifth of a second to answer. [[slnc 300]] And the warehouse asked them one after another.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["Start the operation;", "do not wait for it.", "", "Hand over a completion handler:", "completed(...) and failed(...).", "", "The system calls it back."]
narration = """
Let's name the pattern. [[slnc 400]] Start the operation, and do not wait for it. [[slnc 500]]
Hand over a completion handler, with two methods. [[slnc 300]] Completed, for when it succeeds. [[slnc 300]] Failed, for when it does not. [[slnc 500]]
The system does the waiting, and calls the right one when the operation is done.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["ProactorQuotes: starts every request", "Async channels: do the waiting", "Connected, Written, Read: handlers", "Supplier: slow price servers", "BlockingQuotes: the old way"]
narration = """
Here is who does what. [[slnc 400]] Proactor quotes starts every request, and returns at once. [[slnc 500]]
Java's asynchronous channels do the waiting. [[slnc 500]]
Connected, written, and read are the completion handlers, one for each step. [[slnc 500]]
Supplier is a slow price server. [[slnc 300]] And blocking quotes is the old way, kept for comparison.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["AsynchronousSocketChannel", "HttpClient.sendAsync", "CompletableFuture", "Node.js callbacks"]
narration = """
You have probably met this pattern already. [[slnc 400]] Java's asynchronous socket and file channels take completion handlers. [[slnc 500]]
The HTTP client's send async, and completable futures, are friendlier faces of the same idea. [[slnc 500]]
And Node.js file and network calls take callbacks.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Many slow operations that", "can overlap.", "", "Keep handlers short.", "Collect results safely.", "", "Readable code first? Virtual threads."]
narration = """
So, when should you use it? [[slnc 400]] When many slow operations can overlap. [[slnc 500]]
Keep handlers short, and collect their results safely, because they run on other threads. [[slnc 500]]
And when readable, top-to-bottom code matters more, Java's virtual threads let blocking code wait just as cheaply.
"""

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a timeout", "for slow suppliers."]
narration = """
That's the Proactor pattern. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Start everything, wait for nothing, and let each result call you back. [[slnc 500]]
