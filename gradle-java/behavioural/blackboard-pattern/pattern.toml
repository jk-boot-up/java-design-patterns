# pattern.toml for the Blackboard project. See tools/patternkit.

[project]
slug = "blackboard"
category = "behavioural"
title = "Blackboard"
package = "blackboard"
main_class = "BlackboardDemo"
tagline = "Experts share one board"
bold = "Let independent experts read and add to one shared board, and let a controller choose who goes next and stop as soon as the answer is known."
domain_note = ""
thumb_lines = ["BLACKBOARD"]
thumb_code = "board.post(fact)"
youtube_title = "Blackboard"
youtube_tags = ["blackboard pattern", "behavioural patterns", "fraud detection", "knowledge sources", "java"]

[readme]
intro = """
Blackboard is a behavioural pattern for problems that no single piece of code
can solve alone, and where the steps cannot be fixed in advance. Several
independent experts, called knowledge sources, share one board of facts. Each
expert says when it has what it needs, and then adds what it knows. A
controller decides which ready expert goes next, and stops as soon as the
answer is clear.

No expert calls another, or even knows the others exist. That makes it easy to
add a new one, and lets the controller skip expensive work that is no longer
needed.
"""
analogy = """
Think of an incident room in a detective story. A big board on the wall holds
every clue so far. The fingerprint expert cannot start until the lab sends a
print. The phone analyst adds a name once the call records arrive. Nobody
waits in a fixed queue: whoever can add something steps up. And the lead
detective decides who speaks next, and closes the case the moment there is
enough to go on.
"""
scenario = """
Before the online store accepts an order, it checks for fraud: where the card
is from, where the shopper is, how many orders the account placed in the last
hour, how big the order is, and whether the device looks like a real phone.
All of it lived in one method that ran every check, in a fixed order, every
time, including an 800 millisecond device check after the answer was already
clear.
"""
costs = [
    "**No fixed story.** The order of the checks is chosen at run time, so the log is the only record of what happened and why.",
    "**Everything is shared.** Every expert can read every fact on the board, including sensitive ones such as the card number.",
    "**A controller to get right.** When to stop, and which expert goes first, are real decisions hidden in one class.",
    "**Harder to test end to end.** Each expert is easy to test alone; the combination depends on the facts.",
]
too_much = """
When the steps are always the same and always in the same order, a plain
method or a Chain of Responsibility is simpler and easier to read. The
blackboard earns its keep when experts depend on each other's results in
changing ways, when new experts arrive often, or when skipping work matters.
"""
met_before = [
    "Fraud and risk engines that combine many independent signals into one score.",
    "Speech recognition and early AI systems such as Hearsay-II, where the pattern was born.",
    "Rule engines such as Drools, whose rules fire when the facts they need are present.",
    "Multi-agent AI setups where agents post findings to a shared memory.",
]
where = """
This project is in [behavioural](..), next to
[Chain of Responsibility](../chain-of-responsibility-pattern), which passes a
request along a fixed line of handlers. A blackboard has no fixed line: whoever
is ready goes next.
"""

[[act]]
title = "Every check, every time"
summary = "One method runs all 6 checks in a fixed order: the risky order is rejected after 902 ms, including an 800 ms check it did not need."
detail = """
`FraudCheckAll` runs every check, in an order written by hand: both country
lookups must come before comparing them. For the risky order, the answer is
clear after the five cheap checks, but the 800 millisecond device check runs
anyway, for 902 milliseconds in total. Adding a check means editing this
method and finding the right place for it.
"""
speech = """
First demo: one method runs every check, in a fixed order. [[slnc 400]] Card country. [[slnc 200]] Shopper's country. [[slnc 200]] Do they match. [[slnc 200]] Orders in the last hour. [[slnc 200]] Order value. [[slnc 200]] And a device check that takes eight hundred milliseconds. [[slnc 600]]
A risky order comes in. [[slnc 300]] After the five cheap checks, the answer is already clear: reject. [[slnc 300]] But the slow device check runs anyway. [[slnc 300]] Nine hundred and two milliseconds in total. [[slnc 600]]
And adding a new check means editing this one method, and getting the order right by hand.
"""
rows = { method = "active wrong" }
console = [
    ["risky order: REJECT after all 6 checks", "amber"],
    ["902 ms, 800 of them not needed", "bad"],
    ["a new check means editing this method", "bad"],
]

[[act]]
title = "The blackboard"
summary = "Checks post facts to a shared board as soon as they have what they need; the good order is approved at risk 0."
detail = """
Each check is now a knowledge source that only says what it needs and what it
adds. The good order goes on the board. The controller lets the cheapest ready
check go first: order value, then card country and IP country. Once both
countries are on the board, the country comparison becomes ready. Velocity and
the device check follow. Six checks, risk zero: approved.
"""
speech = """
Second demo: the blackboard. [[slnc 400]] Each check is now an independent expert. [[slnc 300]] It only says two things. [[slnc 300]] What facts it needs, and what it adds. [[slnc 600]]
A good order goes on the board. [[slnc 300]] A controller looks for experts that are ready, and lets the cheapest go first. [[slnc 500]]
Order value is ready straight away. [[slnc 300]] Then card country, and I P country. [[slnc 300]] The moment both countries are on the board, the comparison becomes ready. [[slnc 300]] Nobody had to write that order down. [[slnc 600]]
Six checks, and a risk score of zero. [[slnc 300]] Approved.
"""
rows = { board = "active ok", controller = "active ok", card = "active ok", ip = "active ok", match = "active ok" }
console = [
    ["order value, card country, IP country", "ok"],
    ["country match: ready once both are posted", "ok"],
    ["good order: APPROVE, risk 0, 6 checks", "ok"],
]

[[act]]
title = "Stopping early"
summary = "Card from GB, shopper in RU (+40) and 5 orders in an hour (+30): rejected at 70 after 5 checks and 102 ms; the device check never runs."
detail = """
The risky order uses a British card from a Russian address, and the account
placed five orders in the last hour. The country match adds 40 risk and the
velocity check adds 30. At 70, above the rejection line of 60, the controller
stops. Five checks, 102 milliseconds; the 800 millisecond device check never
runs.
"""
speech = """
Third demo: the controller stops as soon as it can decide. [[slnc 400]] The risky order has a British card, but the shopper is in Russia. [[slnc 300]] Forty risk points. [[slnc 500]]
The account placed five orders in the last hour. [[slnc 300]] Thirty more. [[slnc 500]]
The score is seventy. [[slnc 300]] Anything over sixty is rejected. [[slnc 300]] So the controller stops. [[slnc 600]]
Five checks, one hundred and two milliseconds. [[slnc 300]] The slow device check never runs.
"""
rows = { board = "active amber", controller = "active ok", match = "active wrong", velocity = "active wrong" }
console = [
    ["card from GB, shopper in RU: +40", "bad"],
    ["5 orders in the last hour: +30", "bad"],
    ["REJECT at 70 after 5 checks, 102 ms", "ok"],
]

[[act]]
title = "A new expert"
summary = "A gift-card check is added to the list without changing any other; £300 of gift cards is rejected, where it would have been approved."
detail = """
Fraudsters start buying gift cards. A new knowledge source is written: over
£200 of gift cards adds 60 risk. It is added to the list; no other check, and
not the controller, changes. An order for six gift cards worth £300 is now
rejected. Without the new expert, it would have been approved.
"""
speech = """
Fourth demo: a new expert joins. [[slnc 400]] Fraudsters start buying gift cards. [[slnc 300]] So a new check is written. [[slnc 300]] Over two hundred pounds of gift cards adds sixty risk points. [[slnc 600]]
It is simply added to the list of experts. [[slnc 300]] No other check changes, and neither does the controller. [[slnc 500]]
Six gift cards, three hundred pounds. [[slnc 300]] Rejected. [[slnc 300]] Without the new expert, it would have been approved.
"""
rows = { gift = "active ok", board = "active ok", controller = "active ok" }
console = [
    ["6 gift cards, £300: REJECT, +60", "ok"],
    ["without the new check: APPROVE", "bad"],
]

[[act]]
title = "The bill"
summary = "The order of checks is chosen at run time, so only the log tells the story; every check can read every fact."
detail = """
Nobody wrote down the order of events: it depends on which facts arrived and
what each check costs, so the log is the only story of a decision. And the
board is shared: every check can read every fact on it, including the card
number, which is exactly what a privacy review will ask about.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] Nobody wrote down the order of events. [[slnc 300]] It is chosen while the program runs. [[slnc 300]] So when someone asks why an order was rejected, the log is the only story. [[slnc 600]]
And the board is shared. [[slnc 300]] Every expert can read every fact on it. [[slnc 300]] Including the card number.
"""
rows = { board = "active amber", controller = "active amber" }
console = [
    ["order chosen at run time: the log is the story", "amber"],
    ["every check can read the card number", "amber"],
]

