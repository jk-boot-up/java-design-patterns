[[scene]]
key = "01-poster"
kind = "poster"
title = "Blackboard"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Blackboard pattern, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] In the blackboard pattern, several independent experts share one board of facts. [[slnc 300]] Each expert adds what it knows, as soon as it has what it needs. [[slnc 300]] And a controller decides who goes next, and stops as soon as the answer is clear. [[slnc 600]]
Think of an incident room in a detective story. [[slnc 300]] A board on the wall holds every clue so far. [[slnc 300]] Whoever can add something steps up. [[slnc 300]] And the lead detective closes the case the moment there is enough to go on. [[slnc 700]]
In this video, the domain is an online shop. [[slnc 300]] Before it accepts an order, it checks for fraud. [[slnc 300]] Where the card is from, where the shopper is, how many orders they placed recently, and more. [[slnc 500]]
By the end, you will hear why one method that runs every check wastes time. [[slnc 300]] How experts on a shared board fix it. [[slnc 300]] How the controller stops early. [[slnc 300]] And what the pattern costs.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["Six fraud checks before an order:", "card country, shopper country,", "do they match, orders this hour,", "order value, device check.", "", "One method ran them all, every time."]
narration = """
Here is the scenario. [[slnc 400]] Before accepting an order, the shop runs six fraud checks. [[slnc 500]]
Where is the card from? [[slnc 300]] Where is the shopper? [[slnc 300]] Do those match? [[slnc 300]] How many orders did this account place in the last hour? [[slnc 300]] How big is the order? [[slnc 300]] And is the device a real phone? [[slnc 300]] That last check is slow: eight hundred milliseconds. [[slnc 600]]
Each check adds risk points. [[slnc 300]] Sixty or more, and the order is rejected.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["A board of facts, shared by all.", "", "Experts: \"I need these facts,", "and I add this one.\"", "", "A controller: who is ready,", "who goes next, when to stop."]
narration = """
Let's name the pattern. [[slnc 400]] There are three parts. [[slnc 500]]
The blackboard holds the facts, shared by everyone. [[slnc 500]]
The experts, called knowledge sources, each say which facts they need, and what they add. [[slnc 300]] They never call each other. [[slnc 500]]
And the controller asks who is ready, picks who goes next, and decides when to stop.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["Blackboard: facts, risk, a log", "KnowledgeSource: ready? contribute", "Checks: the six fraud checks", "Controller: cheapest ready, stop at 60", "FraudCheckAll: the old way"]
narration = """
Here is who does what. [[slnc 400]] The blackboard holds the facts, the risk score, and a log of every contribution. [[slnc 500]]
Knowledge source is the interface every expert follows. [[slnc 300]] Are you ready? [[slnc 300]] Then contribute. [[slnc 500]]
The checks class holds the six fraud experts, and later the gift card one. [[slnc 500]]
The controller runs the cheapest ready expert, and stops at sixty. [[slnc 300]] And fraud check all is the old way, kept for comparison.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Fraud and risk engines", "Rule engines such as Drools", "Early speech recognition", "AI agents sharing a memory"]
narration = """
You have probably met this pattern already. [[slnc 400]] Fraud and risk engines combine many independent signals into one score. [[slnc 500]]
Rule engines such as Drools fire a rule when the facts it needs are present. [[slnc 500]]
The pattern was born in early speech recognition systems. [[slnc 300]] And today, AI agents that post findings to a shared memory are using it again.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Many independent pieces of", "knowledge, one decision,", "order depends on the facts.", "", "Keep experts small.", "Log every contribution.", "Guard what the board shows."]
narration = """
So, when should you use it? [[slnc 400]] When many independent pieces of knowledge combine into one decision. [[slnc 300]] When their order depends on what is already known. [[slnc 300]] And when new pieces arrive often. [[slnc 500]]
Keep each expert small. [[slnc 300]] Log every contribution. [[slnc 300]] And decide carefully what the board may show to each expert. [[slnc 500]]
When the steps are always the same, a plain method is simpler.
"""

