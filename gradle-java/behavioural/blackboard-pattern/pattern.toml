]

[docs.prerequisites]
required = [
    "Java basics: interfaces, records, lists, maps, lambdas.",
    "`Optional` and `Comparator` at a beginner level.",
]
not_required = [
    "Any rule engine or AI library.",
    "Fraud expertise. The rules are deliberately simple.",
]

[docs.session]
objectives = [
    "Describe the three parts: the board, the knowledge sources and the controller.",
    "Write a knowledge source that says when it is ready.",
    "Explain how the controller saves work by stopping early.",
    "Add a knowledge source without changing the others.",
]
walkthrough = """
Run `./gradlew run` and compare act one with act three: 902 milliseconds
against 102. Then open `Checks.countryMatch()` and point out that it only says
it needs two facts; nothing says when it runs. Finish in `Controller.decide`,
a short loop that is the whole pattern.
"""
exercises = [
    "Add a check that needs the device result and adds risk for a new device on an old account.",
    "Make the controller approve early when every remaining check could not reach 60.",
    "Hide the card number from every check except the card country check.",
    "Print the log as a numbered story a support agent could read.",
]

[docs.explained]
sentence = """
A blackboard lets independent experts read and add to one shared set of facts,
while a controller chooses which ready expert goes next and stops when the
answer is known.
"""
verdict = """
Use it when many independent pieces of knowledge combine into one decision,
their order depends on what is known, and new pieces arrive often: fraud,
diagnosis, recommendations. Keep each expert small, log every contribution,
and decide carefully what the board may expose.
"""
recognise = [
    "A shared context or facts map that many small classes read and write.",
    "Classes with a `canHandle` or `ready` method and an `apply` or `contribute` method.",
    "A loop that picks the next rule or agent until a score or a goal is reached.",
    "Rule engines and risk scoring services.",
]

[spec]
purpose = """
Teach Blackboard with an online store's fraud checks: a fixed method spending
902 ms, then independent knowledge sources on a shared board with a controller
that runs the cheapest ready check, approves a good order, rejects a risky one
at risk 70 after 102 ms, and accepts a new gift-card check without other changes.
"""
nongoals = [
    "Not a rule engine. Drools is named, not used.",
    "Not real fraud scoring. Rules and thresholds are illustrative.",
    "Not concurrency. Checks run one at a time.",
]
problem = """
One method that runs every check in a fixed order wastes time after the answer
is clear and must be edited for every new check.
"""
roles = [
    ["The board", "`Blackboard`"],
    ["The experts", "`KnowledgeSource`, `Checks`"],
    ["The organiser", "`Controller`"],
    ["The naive version", "`FraudCheckAll`"],
    ["Entry point", "`BlackboardDemo`, five acts"],
]
requirements = [
    "**Independent experts:** no check refers to another.",
    "**Ready, not ordered:** a check runs when its facts are on the board.",
    "**Cheapest first, stop early:** the controller stops at a risk of 60.",
    "**Open to new experts:** a new check changes nothing else.",
    "**Every printed result is asserted** in `DemoRunsTest`.",
]

