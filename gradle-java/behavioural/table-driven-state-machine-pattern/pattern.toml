[poster]
headline = [["STATE", "text"], ["TABLE", "text"]]
before = { code = "if (status != SHIPPED)", note = "delivered orders cancelled", tag = "BEFORE" }
after = { code = "PAID + SHIP -> SHIPPED", note = "not in the table: refused", tag = "AFTER" }
taglines = [["Every allowed move, in one table", "gold"]]

[[scene]]
key = "01-poster"
kind = "poster"
title = "Table-Driven State Machine"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Table-Driven State Machine pattern, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] A state machine is anything that is always in one of a few statuses, and moves between them when something happens. [[slnc 300]] In a table-driven state machine, every allowed move is one row in a table. [[slnc 300]] From this status, on this action, go to that status. [[slnc 300]] Anything not in the table is refused. [[slnc 600]]
Think of an airport. [[slnc 300]] Check-in, then security, then the gate, then the plane. [[slnc 300]] There is one chart of allowed steps, and every desk checks it. [[slnc 300]] A step that is not on the chart does not happen. [[slnc 700]]
In this video, the domain is an online shop. [[slnc 300]] Its orders move from placed, to paid, to shipped, to delivered. [[slnc 300]] And they can be cancelled, or refunded. [[slnc 500]]
By the end, you will hear how scattered if statements hide missing rules. [[slnc 300]] How one table fixes it. [[slnc 300]] How to add a rule with two lines. [[slnc 300]] And what the table does not do for you.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["An order: placed, paid, shipped,", "delivered. Or cancelled, or refunded.", "", "Each method checked the status", "in its own way."]
narration = """
Here is the scenario. [[slnc 400]] An order is placed. [[slnc 300]] Then paid. [[slnc 300]] Then shipped. [[slnc 300]] Then delivered. [[slnc 300]] Along the way, it might be cancelled, or refunded. [[slnc 600]]
Each of those is a status. [[slnc 300]] At any moment, an order has exactly one. [[slnc 500]]
The shop had one method per action: pay, ship, cancel, refund. [[slnc 300]] And each method checked the status in its own way.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["One table of allowed moves:", "from + action -> to.", "", "Look every move up.", "Not in the table? Refused.", "", "New rule? New row."]
narration = """
Let's name the pattern. [[slnc 400]] Write every allowed move as one row, in one table. [[slnc 300]] From this status, on this action, go to that status. [[slnc 500]]
To change an order's status, look the move up. [[slnc 300]] If it is not in the table, refuse it, and say why. [[slnc 500]]
And when the rules change, change the table. [[slnc 300]] A new rule is a new row.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["Status, Action: two enums", "TransitionTable: the rule book", "Order: looks each move up", "IfElseOrder: the old way"]
narration = """
Here is who does what. [[slnc 400]] Status and Action are two enums, fixed lists of names. [[slnc 500]]
The transition table is the whole rule book. [[slnc 300]] It can say what comes next, and which actions are allowed from any status. [[slnc 500]]
The order holds its status, and asks the table before every move. [[slnc 500]]
And the if else order is the old way, kept for comparison.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Spring State Machine", "Jira workflows", "Order and payment statuses", "Parsers and network protocols"]
narration = """
You have probably met this pattern already. [[slnc 400]] Spring State Machine is configured as a table of transitions. [[slnc 500]]
Ticket systems such as Jira let an admin edit the allowed moves between statuses. [[slnc 500]]
Almost every shop has order and payment statuses. [[slnc 300]] And parsers and network protocols are built on state tables, too.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["A few statuses, rules about", "which can follow which:", "use a table.", "", "Draw it as a diagram.", "Attach side effects to moves."]
narration = """
So, when should you use it? [[slnc 400]] Whenever something has a handful of statuses, and rules about which can follow which. [[slnc 300]] Orders, payments, tickets, bookings. [[slnc 500]]
Keep the table in one place. [[slnc 300]] Draw it as a diagram. [[slnc 300]] Attach side effects, such as emails, to the moves. [[slnc 500]]
And when each status needs a lot of its own behaviour, look at the State pattern instead.
"""

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add a LOST status", "and its rows."]
narration = """
That's the Table-Driven State Machine pattern. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Write every allowed move in one table, and refuse everything else. [[slnc 500]]
The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs offline, with nothing installed except a Java development kit. [[slnc 500]]
Here is one exercise to try. [[slnc 300]] Add a lost status, for parcels that never arrive. [[slnc 300]] Which actions lead into it, and out of it? [[slnc 500]]
If this helped, a like really does help other people find it. [[slnc 300]] And subscribe, if you'd like the rest of the series. [[slnc 400]] Thanks for watching.
"""
