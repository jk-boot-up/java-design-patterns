# pattern.toml for the Servant project. See tools/patternkit.

[project]
slug = "servant"
category = "behavioural"
title = "Servant"
package = "servant"
main_class = "ServantDemo"
tagline = "One helper serves them all"
bold = "Put behaviour that many unrelated classes need into one separate helper, the servant, which works on anything that offers a small interface."
youtube_description = """Servant pattern in Java, explained with an online store that posts parcels, letters and gift cards, and later pallets. A servant is a separate class that does one job for many classes that have nothing else in common: each class offers a few facts and the servant does the work, written once, like a car wash that cleans every make of car. We watch copied postage code drift apart, replace it with one servant, add a new kind of item with no new code, and test the servant on its own. We finish with the bill."""
domain_note = ""
thumb_lines = ["SERVANT"]
thumb_code = "servant.postage(item)"
youtube_title = "Servant"
youtube_tags = ["servant pattern", "behavioural patterns", "interfaces", "code reuse", "java"]

[readme]
intro = """
Servant is a behavioural pattern for sharing behaviour between classes that
have nothing else in common. Instead of copying the same method into each
class, or forcing them all under one parent class, you write the behaviour
once, in a separate class called the servant. Each class only promises a small
interface, the few facts the servant needs, and the servant does the work.

The classes stay small and free to belong to whatever family they like, and the
behaviour lives in exactly one place.
"""
analogy = """
Think of a car wash. Every car in town gets washed, but no car carries its own
brushes and soap. The car wash does not care about the make or the model. It
only needs a car that fits through the door. When the car wash changes its
prices, it changes them once, for every car.
"""
scenario = """
The online store posts parcels, letters and gift cards. Each kind of item had
its own copy of the postage sum. When the carrier raised its prices, someone
updated the parcel's copy and missed the other two, so letters and gift cards
were undercharged.
"""
costs = [
    "**The behaviour is not on the object.** There is no `parcel.postage()`; you have to know the servant exists to find it.",
    "**Items show more of themselves.** Each item must expose its weight and city to anyone, so the servant can read them.",
    "**Easy to overdo.** Pulling every method out into servants leaves classes that only hold data and do nothing.",
]
too_much = """
When the classes already share a natural parent, a method on that parent is
simpler. And when only one class needs the behaviour, it belongs in that class.
A servant is worth it when several unrelated classes need the same job done.
"""
met_before = [
    "`java.util.Collections.sort(list)`: one class that sorts any `List` of `Comparable` things.",
    "`Files`, `Objects` and other Java utility classes that work on anything with the right interface.",
    "Printing and export helpers that turn any object with a few getters into a label or a CSV row.",
    "Service classes in Spring applications that operate on plain data objects.",
]
where = """
This project is in [behavioural](..), next to [Visitor](../visitor-pattern),
which also keeps an operation outside the classes it works on, but lets the
operation differ for each class. A servant does the same job for all of them.
"""

[[act]]
title = "Copied postage"
summary = "The carrier's new rates reached the parcel's copy (£6.00) but not the letter's or gift card's (£2.50, should be £2.80)."
detail = """
Postage is now 120 pence plus 160 pence for every started kilo. The parcel's
copy of the sum was updated: 2300 grams costs £6.00. The letter's and gift
card's copies still use the old rates and charge £2.50 instead of £2.80. A
shared parent class could have held one copy, but it would tie every item into
one family tree just to be posted.
"""
speech = """
First demo: each item carries its own copy of the postage sum. [[slnc 400]] The carrier's new rates are one pound twenty, plus one pound sixty for every started kilo. [[slnc 600]]
The parcel's copy was updated. [[slnc 300]] Two point three kilos costs six pounds. [[slnc 500]]
The letter's copy was missed. [[slnc 300]] It charges two pounds fifty, not two eighty. [[slnc 300]] So was the gift card's. [[slnc 600]]
Each copy looks fine on its own. [[slnc 300]] Together, they disagree.
"""
rows = { parcel = "active ok", letter = "active wrong", gift = "active wrong" }
console = [
    ["parcel, 2300 g: £6.00 (updated)", "ok"],
    ["letter, 80 g: £2.50 (should be £2.80)", "bad"],
    ["gift card, 20 g: £2.50 (missed)", "bad"],
]

[[act]]
title = "One servant"
summary = "ShippingServant labels the parcel £6.00 and the letter and gift card £2.80 each, from one copy of the rates."
detail = """
`ShippingServant` holds the rates and the sum, once. Each item only implements
`Shippable`: a name, a weight in grams and a city. The servant prints a label
for each: parcel £6.00, letter £2.80, gift card £2.80. The items hold no
shipping code at all.
"""
speech = """
Second demo: one shipping servant serves every item. [[slnc 400]] The rates and the sum now live in one class, the servant. [[slnc 500]]
Each item only promises three things. [[slnc 300]] Its name, its weight, and the city it is going to. [[slnc 600]]
The servant prints a label for each. [[slnc 300]] Parcel, six pounds. [[slnc 300]] Letter, two eighty. [[slnc 300]] Gift card, two eighty. [[slnc 500]]
The items hold no shipping code at all.
"""
rows = { servant = "active ok", parcel = "active ok", letter = "active ok", gift = "active ok" }
console = [
    ["PARCEL-1 | 2300 g | to Leeds | £6.00", "ok"],
    ["LETTER-1 | 80 g | to Bath | £2.80", "ok"],
    ["GIFTCARD-1 | 20 g | to York | £2.80", "ok"],
]

[[act]]
title = "A new kind of item"
summary = "A 180 kg pallet to Hull is labelled £289.20 with no new shipping code; it only says its name, weight and city."
detail = """
The shop starts sending pallets. `Pallet` implements `Shippable`, and the same
servant labels it: 180,000 grams to Hull, £289.20. No postage code was written
for pallets.
"""
speech = """
Third demo: a new kind of item. [[slnc 400]] The shop starts sending pallets. [[slnc 500]]
A pallet only says its name, its weight, and its city. [[slnc 300]] The same servant labels it. [[slnc 300]] One hundred and eighty kilos, to Hull, two hundred and eighty-nine pounds twenty. [[slnc 500]]
Not one line of postage code was written for pallets.
"""
rows = { servant = "active ok", pallet = "active ok" }
console = [
    ["PALLET-1 | 180000 g | to Hull | £289.20", "ok"],
    ["no new shipping code", "ok"],
]

[[act]]
title = "Tested alone"
summary = "A made-up 1001 g item costs £4.40, two started kilos; the servant keeps no state between items."
detail = """
Because the servant only needs a `Shippable`, it can be tested with a made-up
item. 1001 grams is two started kilos: £4.40. The servant keeps nothing
between calls, so one instance serves every item in the shop.
"""
speech = """
Fourth demo: the servant can be tested on its own. [[slnc 400]] A test makes up an item of one thousand and one grams. [[slnc 300]] That is two started kilos: four pounds forty. [[slnc 600]]
No real parcel, letter or pallet was needed. [[slnc 500]]
And the servant keeps nothing between calls. [[slnc 300]] One servant object serves every item in the shop.
"""
rows = { servant = "active ok", test = "active ok" }
console = [
    ["made-up 1001 g item: £4.40", "ok"],
    ["one servant, no state kept", "ok"],
]

[[act]]
title = "The bill"
summary = "There is no parcel.postage(), so the servant must be known; every item must expose its weight and city."
detail = """
The behaviour is no longer on the item. A developer typing `parcel.` finds no
postage method and has to know the servant exists. And every item now exposes
its weight and city to anyone who asks, because the servant needs them.
"""
speech = """
Fifth demo: the bill. [[slnc 400]] The behaviour is not on the item any more. [[slnc 300]] A developer looking for parcel dot postage finds nothing. [[slnc 300]] They have to know the servant exists. [[slnc 600]]
And every item now shows its weight and city, to anyone who asks. [[slnc 300]] Because the servant needs them.
"""
rows = { servant = "active amber", parcel = "active amber" }
console = [
    ["no parcel.postage(): find the servant", "amber"],
    ["every item exposes weight and city", "amber"],
]

[animation]
subtitle = "Parcels, letters, gift cards and pallets hold no shipping code; one servant labels anything Shippable."
boxes = [
    ["parcel", "Parcel", "2300 g to Leeds"],
    ["letter", "Letter", "80 g to Bath"],
    ["gift", "Gift card", "20 g to York, also a Voucher"],
    ["pallet", "Pallet", "180 kg to Hull, added later"],
    ["servant", "Shipping servant", "rates, postage, label"],
    ["test", "Made-up item", "for testing the servant"],
]

[docs.problem]
scenario = """
The store posts parcels, letters and gift cards, each a different class with
nothing in common except that it can be posted.
"""
naive = """
`CopiedPostage` keeps one copy of the sum per kind of item. A price change
reached one copy and missed two, so letters and gift cards were charged £2.50
instead of £2.80.
"""
deliver = [
    "The drifted copies shown: £6.00, £2.50, £2.50.",
    "A `Shippable` interface with only what shipping needs.",
    "A stateless `ShippingServant` that prices and labels any Shippable.",
    "A new item type shipped with no new shipping code.",
    "The servant tested with a made-up item.",
    "Every printed result asserted by a test.",
]

[docs.prerequisites]
required = [
    "Java basics: interfaces, records, methods.",
    "The idea of an interface as a small promise.",
]
not_required = [
    "Any other design pattern. Visitor is compared, not required.",
]

[docs.session]
objectives = [
    "Explain why copies of the same behaviour drift apart.",
    "Say why a shared parent class is not always possible or wanted.",
    "Write a servant that depends only on a small interface.",
    "Name the cost: behaviour you cannot find on the object.",
]
walkthrough = """
Run `./gradlew run` and read act one: three copies, two of them wrong. Then
open `Shippable` (three methods) and `ShippingServant` (two). Point out that
`Items` contains no shipping code at all, and that `GiftCard` is also a
`Voucher`, which is why a shared parent class would not fit.
"""
exercises = [
    "Add international postage: double the rate when the city is outside the UK. Where does the change go?",
    "Add a `CustomsServant` that uses the gift card's value. What interface does it need?",
    "Make the servant refuse items over 200 kg.",
    "Write a test with a made-up item that proves 0 grams is charged as one started kilo.",
]

[docs.explained]
sentence = """
A servant is a separate class that performs one job for many unrelated classes,
each of which only offers a small interface with the facts the job needs.
"""
verdict = """
Use a servant when several unrelated classes need the same behaviour and a
shared parent class does not fit. Keep the interface small, keep the servant
stateless, and name it so developers can find it.
"""
recognise = [
    "Classes named `...Service`, `...Helper` or `...s` (like `Collections`) that take an interface as a parameter.",
    "Small interfaces such as `Comparable`, `Shippable`, `Printable`.",
    "Several classes implementing the same small interface only to be handled by one helper.",
]

[spec]
purpose = """
Teach Servant with an online store's postage: three copies of the sum drifting
(£6.00, £2.50, £2.50), then a ShippingServant over a Shippable interface that
labels a parcel, letter, gift card and a new pallet (£289.20) consistently and
is tested with a made-up item.
"""
nongoals = [
    "Not a real carrier's price list. The rates are illustrative.",
    "Not dependency injection. The servant is created with `new`.",
]
problem = """
The same behaviour copied into several unrelated classes drifts apart when it
changes.
"""
roles = [
    ["The pattern", "`ShippingServant`"],
    ["What it needs", "`Shippable`"],
    ["The served", "`Items.Parcel`, `Letter`, `GiftCard`, `Pallet`"],
    ["The naive version", "`CopiedPostage`"],
    ["Entry point", "`ServantDemo`, five acts"],
]
requirements = [
    "**One copy:** the rates and the sum exist only in the servant.",
    "**Small interface:** `Shippable` has three methods.",
    "**Stateless:** one servant serves every item.",
    "**Open to new items:** a pallet needs no shipping code.",
    "**Every printed result is asserted** in `DemoRunsTest`.",
]

