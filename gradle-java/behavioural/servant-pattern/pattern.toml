before = { code = "parcel.postage()", note = "3 copies, 2 out of date", tag = "BEFORE" }
after = { code = "servant.postage(item)", note = "one copy, every item", tag = "AFTER" }
taglines = [["One helper serves them all", "gold"]]

[[scene]]
key = "01-poster"
kind = "poster"
title = "Servant"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Servant pattern, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] A servant is a separate class that does one job for many classes that have nothing else in common. [[slnc 300]] Each class only offers a few facts. [[slnc 300]] The servant does the work, written once. [[slnc 600]]
Think of a car wash. [[slnc 300]] Every car gets washed, but no car carries its own brushes and soap. [[slnc 300]] The car wash does not care about the make or model. [[slnc 300]] When its prices change, they change once, for every car. [[slnc 700]]
In this video, the domain is an online shop. [[slnc 300]] It posts parcels, letters and gift cards, and later, pallets. [[slnc 500]]
By the end, you will hear how copies of the same code drift apart. [[slnc 300]] How one servant fixes it. [[slnc 300]] How a new kind of item needs no new code. [[slnc 300]] And what the pattern costs.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["The shop posts parcels, letters", "and gift cards.", "", "Each kind of item had its own", "copy of the postage sum.", "", "Then the carrier raised its prices."]
narration = """
Here is the scenario. [[slnc 400]] The shop posts parcels, letters, and gift cards. [[slnc 300]] Each one is a different class. [[slnc 500]]
Each had its own copy of the postage sum. [[slnc 300]] A base price, plus a charge for every started kilo. [[slnc 500]]
Then the carrier raised its prices. [[slnc 300]] Someone had to update every copy.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["Write the behaviour once,", "in a separate class: the servant.", "", "Each class offers a small interface:", "the facts the servant needs.", "", "The servant does the work."]
narration = """
Let's name the pattern. [[slnc 400]] Write the behaviour once, in a separate class. [[slnc 300]] That class is the servant. [[slnc 500]]
Each class that needs the job done offers a small interface. [[slnc 300]] Just the facts the servant needs. [[slnc 300]] Here: a name, a weight, and a city. [[slnc 500]]
The servant takes any object with that interface, and does the work.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["Shippable: name, grams, city", "Parcel, Letter, GiftCard, Pallet:", "the served, no shipping code", "ShippingServant: rates, postage, label", "CopiedPostage: the old way"]
narration = """
Here is who does what. [[slnc 400]] Shippable is the small interface: name, grams, and city. [[slnc 500]]
Parcel, letter, gift card, and pallet are the served. [[slnc 300]] They implement Shippable, and hold no shipping code. [[slnc 500]]
The shipping servant holds the rates, works out the postage, and prints the label. [[slnc 500]]
And copied postage is the old way, kept for comparison.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Collections.sort(list)", "Java's Files and Objects classes", "Label and export helpers", "Spring service classes"]
narration = """
You have probably met this pattern already. [[slnc 400]] Collections dot sort is a servant. [[slnc 300]] It sorts any list of things that can be compared. [[slnc 500]]
Java's Files and Objects classes work the same way. [[slnc 500]]
And so do label printers, export helpers, and many service classes in Spring applications.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Several unrelated classes need", "the same job done.", "", "Keep the interface small.", "Keep the servant stateless.", "Name it so people find it."]
narration = """
So, when should you use it? [[slnc 400]] When several unrelated classes need the same job done, and a shared parent class does not fit. [[slnc 500]]
Keep the interface small. [[slnc 300]] Keep the servant free of state. [[slnc 300]] And give it a name people will find. [[slnc 500]]
When only one class needs the behaviour, keep it in that class.
"""

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add international", "postage in one place."]
narration = """
That's the Servant pattern. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] When many unrelated classes need the same job, write it once, in a servant. [[slnc 500]]
The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs offline, with nothing installed except a Java development kit. [[slnc 500]]
Here is one exercise to try. [[slnc 300]] Add international postage, and notice that only the servant changes. [[slnc 500]]
If this helped, a like really does help other people find it. [[slnc 300]] And subscribe, if you'd like the rest of the series. [[slnc 400]] Thanks for watching.
"""
