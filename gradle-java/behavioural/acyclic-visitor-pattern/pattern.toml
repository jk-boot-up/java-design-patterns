[[scene]]
key = "01-poster"
kind = "poster"
title = "Acyclic Visitor"
narration = """
Hello, and welcome. [[slnc 400]] This video explains the Acyclic Visitor pattern, in Java. [[slnc 300]]
This video is presented by Jayasekhar Konduru. [[slnc 600]]
First, a simple definition. [[slnc 300]] A visitor is an operation, such as working out tax, kept outside the classes it works on. [[slnc 300]] In the acyclic version, each type gets its own tiny visitor interface. [[slnc 300]] Each visitor handles only the types it chooses. [[slnc 300]] So a new type changes nothing that already exists. [[slnc 600]]
Think of a hotel where staff wear a badge for each language they speak. [[slnc 300]] A guest looks for the right badge. [[slnc 300]] Nobody has to speak every language. [[slnc 300]] And a new language only needs a new badge. [[slnc 700]]
In this video, the domain is an online shop. [[slnc 300]] Its catalogue has books, food, and electronics, and later, gift cards. [[slnc 300]] Visitors work out VAT, and customs forms. [[slnc 500]]
By the end, you will hear what goes wrong with the classic visitor. [[slnc 300]] How the acyclic version fixes it. [[slnc 300]] How a new product type changes nothing old. [[slnc 300]] And what it costs.
"""

[[scene]]
key = "02-scenario"
kind = "bullets"
title = "The Scenario"
body = ["Products: books, food, electronics.", "", "Visitors: VAT, customs forms.", "", "Each visitor had a method", "for every product type.", "", "Then: gift cards."]
narration = """
Here is the scenario. [[slnc 400]] The shop sells books, food, and electronics. [[slnc 500]]
Two operations visit every product. [[slnc 300]] One works out VAT, a sales tax. [[slnc 300]] The other writes customs forms, for items sent abroad. [[slnc 500]]
Each operation was a classic visitor. [[slnc 300]] It had one method for every product type, whether it cared about that type or not. [[slnc 500]]
Then the shop started selling gift cards.
"""

[[scene]]
key = "03-acts"
kind = "acts"
title = "acts"

[[scene]]
key = "04-pattern"
kind = "bullets"
title = "The Pattern"
body = ["An empty root visitor interface.", "", "One tiny interface per type:", "BookVisitor, FoodVisitor, ...", "", "Visitors wear only the ones", "they handle."]
narration = """
Let's name the pattern. [[slnc 400]] Start with an empty root visitor interface. [[slnc 300]] It names no product type at all. [[slnc 500]]
Give each product type its own tiny interface, with one method. [[slnc 300]] Book visitor, food visitor, and so on. [[slnc 500]]
Each visitor implements only the interfaces for the types it handles. [[slnc 300]] And each product checks for its own interface before letting a visitor in.
"""

[[scene]]
key = "05-roles"
kind = "bullets"
title = "Who Does What"
body = ["ProductVisitor: the empty root", "BookVisitor, FoodVisitor, ...: badges", "Book, Food, Electronics, GiftCard:", "check the badge in accept()", "VAT, Customs, Activation: visitors"]
narration = """
Here is who does what. [[slnc 400]] Product visitor is the empty root. [[slnc 500]]
Book visitor, food visitor, electronics visitor, and gift card visitor are the badges. [[slnc 300]] One method each. [[slnc 500]]
Each product checks for its badge in its accept method. [[slnc 500]]
And the visitors are VAT, customs, and gift card activation. [[slnc 300]] Each wears only the badges it needs.
"""

[[scene]]
key = "06-recognise"
kind = "bullets"
title = "Where You Have Seen It"
body = ["Event listeners that implement", "only the events they care about", "Plug-ins that declare which", "file types they handle", "Robert C. Martin's original paper"]
narration = """
You have probably met this pattern already. [[slnc 400]] Event listeners often implement only the listener interfaces for the events they care about. [[slnc 500]]
Plug-in systems let each plug-in say which file types it can handle. [[slnc 500]]
And the pattern itself was described by Robert C. Martin, as a way to break the dependency cycle in the classic visitor.
"""

[[scene]]
key = "07-verdict"
kind = "bullets"
title = "When To Use It"
body = ["Types keep arriving; most", "operations care about a few.", "", "Log or test the skipped cases.", "", "Fixed list of types?", "Classic visitor, or a sealed switch."]
narration = """
So, when should you use it? [[slnc 400]] When new types keep arriving, and most operations only care about a few of them. [[slnc 500]]
Log or test the skipped cases, because the compiler no longer checks them. [[slnc 500]]
And when the list of types is fixed, prefer the classic visitor, or a sealed interface with a switch. [[slnc 300]] Then the compiler checks everything for you.
"""

[[scene]]
key = "08-outro"
kind = "outro"
title = "Thanks for Watching"
body = ["Full source, notes, diagrams and an animated walkthrough", "are in the repository. Add clothing", "and a visitor for it alone."]
narration = """
That's the Acyclic Visitor pattern. [[slnc 400]] If you remember one sentence, make it this one. [[slnc 300]] Give each type its own small visitor interface, and let each visitor handle only what it knows. [[slnc 500]]
The full source code, written notes, diagrams, and an animated walkthrough are all in the repository. [[slnc 300]] It runs offline, with nothing installed except a Java development kit. [[slnc 500]]
Here is one exercise to try. [[slnc 300]] Add clothing as a new product type, and a size label visitor that handles only clothing. [[slnc 500]]
If this helped, a like really does help other people find it. [[slnc 300]] And subscribe, if you'd like the rest of the series. [[slnc 400]] Thanks for watching.
"""
